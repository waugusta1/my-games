function tone(o){if(!ac)return;const t=now()+(o.t||0),d=o.d||.2,v=(o.v==null?.2:o.v),a=o.a||.005,r=o.r==null?d*.8:o.r;const os=ac.createOscillator(),g=ac.createGain();
  if(o.wave)os.setPeriodicWave(o.wave);else os.type=o.type||'sine';os.frequency.setValueAtTime(o.f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+(o.slide||d));if(o.detune)os.detune.value=o.detune;
  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vibRate||5.5;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+r+.1);}
  let node=os;if(o.lp||o.hp||o.bp){const f=ac.createBiquadFilter();f.type=o.lp?'lowpass':o.hp?'highpass':'bandpass';f.frequency.setValueAtTime(o.lp||o.hp||o.bp,t);if(o.lp2)f.frequency.exponentialRampToValueAtTime(o.lp2,t+d);f.Q.value=o.q||.8;os.connect(f);node=f;}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);if(o.sus!=null){g.gain.setTargetAtTime(v*o.sus,t+a,(o.dec||.1));g.gain.setValueAtTime(v*o.sus,t+d);}else g.gain.setValueAtTime(v,t+Math.max(a,d-r));g.gain.exponentialRampToValueAtTime(.0001,t+d+(o.sus!=null?r:0)+.001);
  node.connect(g);g.connect(out(o.dest,o.pan));os.start(t);os.stop(t+d+r+.05);return os;}
function noise(o){if(!ac)return;const t=now()+(o.t||0),d=o.d||.2,v=o.v==null?.2:o.v,a=o.a||.002;const s=ac.createBufferSource();s.buffer=o.pink?pinkBuf:noiseBuf;s.loop=true;if(o.rate)s.playbackRate.value=o.rate;

  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);node.connect(g);g.connect(out(o.dest,o.pan));s.start(t,R()*1.5);s.stop(t+d+.05);}
function fm(o){if(!ac)return;const t=now()+(o.t||0),d=o.d||1,v=o.v==null?.15:o.v;const c=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();
  c.frequency.value=o.f;m.frequency.value=o.f*(o.ratio||3.5);mg.gain.setValueAtTime(o.f*(o.index||4),t);mg.gain.exponentialRampToValueAtTime(o.f*.05+1,t+d*.6);m.connect(mg);mg.connect(c.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.003));g.gain.exponentialRampToValueAtTime(.0001,t+d);c.connect(g);g.connect(out(o.dest,o.pan));c.start(t);m.start(t);c.stop(t+d+.05);m.stop(t+d+.05);}
const ksCache={};
function ksBuf(midi){const k=midi|0;if(ksCache[k])return ksCache[k];const sr=ac.sampleRate,f=mtof(k),N=Math.round(sr/f),len=Math.floor(sr*2.2),b=ac.createBuffer(1,len,sr),d=b.getChannelData(0);
  for(let i=0;i<N;i++)d[i]=R()*2-1;for(let i=N;i<len;i++)d[i]=(d[i-N]+d[i-N+1>=i?i-N:i-N+1])*.4985;ksCache[k]=b;return b;}
function pluckKS(midi,o={}){if(!ac)return;const t=now()+(o.t||0),s=ac.createBufferSource();s.buffer=ksBuf(midi);const g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp||3200;
  g.gain.setValueAtTime(o.v||.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+(o.d||1.8));s.connect(f);f.connect(g);g.connect(out(o.dest,o.pan));s.start(t);s.stop(t+(o.d||1.8)+.05);}
let pulseW=null;const pulse=()=>{if(!pulseW){const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++)im[i]=2/(i*Math.PI)*Math.sin(i*Math.PI*.25);pulseW=ac.createPeriodicWave(re,im);}return pulseW;};

const INS={

  warmpad:(m,t,d,v,dest)=>{tone({type:'triangle',f:mtof(m),t,d,v:v*.45,a:Math.min(.8,d*.4),r:Math.min(1.5,d*.5),dest});tone({type:'sine',f:mtof(m+12),t,d,v:v*.15,a:d*.5,r:1,dest});},
  strings:(m,t,d,v,dest)=>{for(const dt of[-6,0,7])tone({type:'sawtooth',f:mtof(m),detune:dt,t,d,v:v*.18,a:Math.min(.35,d*.3),r:.6,lp:1800,vib:2.5,vibRate:5,dest});},
  epiano:(m,t,d,v,dest)=>{fm({f:mtof(m),ratio:1,index:1.2,t,d:Math.max(.6,d*1.4),v:v*.5,dest});tone({type:'sine',f:mtof(m),t,d:Math.max(.5,d),v:v*.25,r:.4,dest});},
  bell:(m,t,d,v,dest)=>fm({f:mtof(m),ratio:3.5,index:3,t,d:Math.max(1.2,d*2),v:v*.35,dest}),
  marimba:(m,t,d,v,dest)=>{tone({type:'sine',f:mtof(m),t,d:.45,v:v*.6,a:.002,r:.4,dest});tone({type:'sine',f:mtof(m)*4,t,d:.08,v:v*.12,a:.001,r:.07,dest});},
  pluck:(m,t,d,v,dest)=>{if(ac)pluckKS(m,{t,v:v*.9,d:Math.max(.8,d*2),dest});},
  guitar:(m,t,d,v,dest)=>{if(ac)pluckKS(m,{t,v:v*.8,d:Math.max(1.2,d*2.5),lp:2400,dest});},
  bass:(m,t,d,v,dest)=>{tone({type:'sine',f:mtof(m),t,d,v:v*.75,a:.008,r:Math.min(.25,d*.5),dest});tone({type:'sawtooth',f:mtof(m),t,d,v:v*.18,a:.008,r:.15,lp:500,lp2:220,dest});},
  synthbass:(m,t,d,v,dest)=>{tone({type:'sawtooth',f:mtof(m),t,d,v:v*.4,a:.004,r:.1,lp:1400,lp2:300,q:4,dest});tone({type:'square',f:mtof(m-12),t,d,v:v*.2,r:.1,lp:400,dest});},
  lead:(m,t,d,v,dest)=>tone({type:'square',f:mtof(m),t,d,v:v*.16,a:.01,r:.12,lp:2600,vib:4,vibRate:5.5,dest}),
  flute:(m,t,d,v,dest)=>{tone({type:'sine',f:mtof(m),t,d,v:v*.38,a:.05,r:.15,vib:3,vibRate:5,dest});tone({type:'triangle',f:mtof(m)*2,t,d,v:v*.05,a:.05,r:.1,dest});noise({t,d:Math.min(.15,d),v:v*.04,bp:mtof(m)*2,q:4,dest});},
  chip:(m,t,d,v,dest)=>tone({wave:pulse(),f:mtof(m),t,d,v:v*.16,a:.002,r:.04,dest}),
  organ:(m,t,d,v,dest)=>{for(const[h,a]of[[1,.4],[2,.25],[3,.12],[4,.1]])tone({type:'sine',f:mtof(m)*h,t,d,v:v*a*.5,a:.01,r:.08,dest});},
  kalimba:(m,t,d,v,dest)=>{fm({f:mtof(m),ratio:5.2,index:1.5,t,d:1,v:v*.4,dest});},

const DR={
  kick:(t,v,dest)=>{tone({type:'sine',f:150,f2:42,slide:.12,t,d:.32,v:v*.9,a:.001,r:.25,dest});noise({t,d:.02,v:v*.2,lp:3000,dest});},

const DRUMS={
  lofi:{kick:'x.........x.....x.........x.....',snare:'....x.......x.......x.......x...',hat:'..x...x...x...x...x...x...x...xx',k:'softkick',s:'rim'},
  soft:{kick:'x...............x...............',snare:'',hat:'....x.......x.......x.......x...',k:'softkick',s:'rim',h:'shaker'},
  tense:{kick:'x.....x...x.....x.....x...x.x...',snare:'....x.......x.......x.......x...',hat:'x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.',k:'kick',s:'snare'},
  shaker:{kick:'x.......x.......x.......x.......',snare:'',hat:'x.xxx.xxx.xxx.xxx.xxx.xxx.xxx.xx',k:'softkick',s:'rim',h:'shaker'},
  drive:{kick:'x...x...x...x...x...x...x...x...',snare:'....x.......x.......x.......x..x',hat:'..x...x...x...x...x...x...x...x.',k:'kick',s:'snare',h:'hat'},
  race:{kick:'x..x..x.x..x..x.x..x..x.x..x.xx.',snare:'....x.......x.......x.......x...',hat:'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx',k:'kick',s:'clap',h:'hat'},
  bouncy:{kick:'x.....x...x.....x.....x...x.....',snare:'....x.......x.......x.......x...',hat:'..x...x...x...x...x...x...x...x.',k:'kick',s:'clap',h:'shaker'},

let song=null,want={song:null,amb:{}},seqTimer=null;
function seeded(n){let a=n>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function chordNotes(st,deg,oct=0){const sc=SC[st.sc],n=sc.length,o=[];for(const k of[0,2,4,6]){const i=deg+k;o.push(st.root+sc[i%n]+12*Math.floor(i/n)+oct);}return o;}
function scaleNote(st,i){const sc=SC[st.sc],n=sc.length;return st.root+sc[((i%n)+n)%n]+12*Math.floor(i/n);}
function makeMotif(g,len){const m=[];for(let i=0;i<len;i++){m.push(g()<.25?null:{d:Math.floor(g()*5)-2,l:g()<.3?2:1});}return m;}
function startSong(name){const st=STY[name];if(!st)return;if(song&&song.name===name)return;const g=seeded(name.length*977+(Date.now()/86400000|0));
  const old=song;const bus=ac.createGain();bus.gain.value=0;bus.connect(musicBus);bus.gain.linearRampToValueAtTime(1,now()+2.5);
  if(old){old.bus.gain.cancelScheduledValues(now());old.bus.gain.setValueAtTime(old.bus.gain.value,now());old.bus.gain.linearRampToValueAtTime(0,now()+2);setTimeout(()=>{try{old.bus.disconnect();}catch(_){}},2600);}
  song={name,st,bus,step:0,next:now()+.15,bar:0,g,motifs:[makeMotif(g,8),makeMotif(g,8),makeMotif(g,8)],prog:st.prog[0],section:0,intensity:1};
  if(!seqTimer)seqTimer=setInterval(schedule,40);}
function stopSong(){if(!song)return;const s=song;song=null;s.bus.gain.cancelScheduledValues(now());s.bus.gain.setValueAtTime(s.bus.gain.value,now());s.bus.gain.linearRampToValueAtTime(0,now()+1.5);setTimeout(()=>{try{s.bus.disconnect();}catch(_){}},1800);}
const SECTIONS=['intro','a','a','b','a','b','break','b'];
function schedule(){if(!song||!ac)return;const s=song,st=s.st,spb=60/st.bpm/4;
  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;
    if(step===0&&bar%4===0){s.prog=st.prog[Math.floor(s.g()*st.prog.length)];if(bar%16===0&&bar>0){s.motifs[Math.floor(s.g()*3)]=makeMotif(s.g,8);}}
    const deg=s.prog[bar%4],ch=chordNotes(st,deg),sw=(step%2)?st.swing*spb:0,T=t+sw;
    if(step===0)ch.slice(0,3).forEach(n=>INS[st.pad](n,T,spb*16,sec==='intro'?.5:.42,dest));
    if(sec!=='intro'){const bp=st.bass==='synthbass'?[0,3,6,8,10,14]:[0,6,8];if(bp.includes(step))INS[st.bass](ch[0]-24+(step===8&&s.g()<.3?7:0),T,spb*(step===0?5:2.5),.55,dest);}
    if(sec!=='intro'&&sec!=='break'||sec==='break'&&step%4===0){const ap=st.arpPat;let idx=null;if(ap==='up'&&step%2===0)idx=(step/2)%4;else if(ap==='down'&&step%2===0)idx=3-(step/2)%4;else if(ap==='wide'&&step%4===0)idx=[0,2,1,3][step/4];else if(ap==='bounce'&&[0,3,6,8,11,14].includes(step))idx=[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(step)];
      if(idx!=null)INS[st.arp](ch[idx]+12,T,spb*2,.3*(sec==='b'?1:.8),dest);}
    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}
    const D=DRUMS[st.drum];if(D&&sec!=='intro'){const k=s.step%32;const ki=D.kick[k]==='x',sn=D.snare&&D.snare[k]==='x',ht=D.hat&&D.hat[k]==='x';const lvl=(sec==='break'?.5:1)*I;
      if(ki&&sec!=='break')DR[D.k](T,.8*lvl,dest);if(sn)DR[D.s||'snare'](T,.6*lvl,dest);if(ht)DR[D.h||'hat'](T,(.5+(k%4===2?.3:0))*lvl,dest);if(k===0&&bar%8===0&&sec==='b'&&st.drum!=='soft'&&st.drum!=='lofi')DR.crash(T,.5,dest);}
    s.step++;s.next+=spb;}}

/* ---- ambience ---- */
const AMB={};
function loopNoise(o){const s=ac.createBufferSource();s.buffer=o.pink?pinkBuf:noiseBuf;s.loop=true;const f=ac.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.value=o.f;f.Q.value=o.q||.7;const g=ac.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(ambBus);s.start();return{s,f,g};}
function ambOn(name,vol=1){want.amb[name]=vol;if(!ac||!unlocked)return;let A=AMB[name];
  if(!A){A=AMB[name]={nodes:[],timers:[],vol:0};
    if(name==='rain'){const a=loopNoise({f:3500,type:'highpass',pink:false}),b=loopNoise({f:900,pink:true});A.nodes=[a,b];A.set=v=>{a.g.gain.setTargetAtTime(v*.14,now(),.6);b.g.gain.setTargetAtTime(v*.22,now(),.6);};A.tick=()=>{if(R()<.5)noise({d:.04,v:.06*A.vol,bp:2000+R()*3000,q:2,dest:ambBus,pan:R()*2-1});};A.rate=60;}
    else if(name==='wind'){const a=loopNoise({f:400,type:'bandpass',q:.8,pink:true});A.nodes=[a];A.set=v=>a.g.gain.setTargetAtTime(v*.5,now(),1);A.tick=()=>{a.f.frequency.setTargetAtTime(250+R()*700,now(),.8);};A.rate=900;}
    else if(name==='ocean'){const a=loopNoise({f:600,pink:true});A.nodes=[a];A.set=v=>{A.vol=v;};A.tick=()=>{const t=now(),v=A.vol;a.g.gain.cancelScheduledValues(t);a.g.gain.setTargetAtTime(v*.55,t,1.2);a.g.gain.setTargetAtTime(v*.08,t+2.6,1.4);a.f.frequency.setTargetAtTime(1400,t,1);a.f.frequency.setTargetAtTime(420,t+2.4,1.5);};A.rate=6500;}
    else if(name==='river'){const a=loopNoise({f:1200,type:'bandpass',q:.5}),b=loopNoise({f:300,pink:true});A.nodes=[a,b];A.set=v=>{a.g.gain.setTargetAtTime(v*.1,now(),.8);b.g.gain.setTargetAtTime(v*.2,now(),.8);};A.tick=()=>{if(R()<.6)tone({type:'sine',f:900+R()*1600,f2:400+R()*600,d:.05,v:.02*A.vol,dest:ambBus,pan:R()*2-1});};A.rate=120;}
    else if(name==='birds'){A.set=()=>{};A.tick=()=>{if(R()<.55){const f=2200+R()*2400,n=1+(R()*4|0),pan=R()*2-1,vv=.05*A.vol;for(let i=0;i<n;i++){const st=i*(.08+R()*.06);tone({type:'sine',f:f*rv(.15),f2:f*(R()<.5?1.5:.7),slide:.07,t:st,d:.09,v:vv,a:.005,r:.06,dest:ambBus,pan});}}};A.rate=1400;}

function costN(i,k){const L=LINES[i],n=save.lines[i].n;return L.cost*Math.pow(L.mult,n)*(Math.pow(L.mult,k)-1)/(L.mult-1);}
function maxBuy(i){const L=LINES[i],n=save.lines[i].n,m=save.money;const k=Math.floor(Math.log(m*(L.mult-1)/(L.cost*Math.pow(L.mult,n))+1)/Math.log(L.mult));return Math.max(0,k);}
let buyMode=1;const MODES=[1,10,100,'max'];
function buyCount(i){if(buyMode==='max')return Math.max(1,maxBuy(i));if(buyMode==='next'){const n=save.lines[i].n;const m=MILES.find(x=>x>n)||n+1;return m-n;}return buyMode;}
function earn(v,i){v*=boostMult();save.money+=v;save.life+=v;if(i!=null){save.made[LINES[i].id]=(save.made[LINES[i].id]||0)+1;orderProg(i);}}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

    case'rock':{ctx.fillStyle='#e8d8b0';ctx.fillRect(-1.2,-14,2.4,28);for(let k=0;k<5;k++){ctx.fillStyle=['#7ad8ff','#ff9ad8','#bfffe0','#ffe08a','#c8a8ff'][k];ctx.beginPath();const yy=-10+k*5;ctx.moveTo(-7,yy);ctx.lineTo(-2,yy-4);ctx.lineTo(4,yy-3);ctx.lineTo(7,yy+2);ctx.lineTo(1,yy+5);ctx.lineTo(-5,yy+4);ctx.fill();}ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(-3,-11,2,2);ctx.fillRect(2,-1,2,2);break;}

  else if(kind==='spinner'){ctx.save();ctx.translate(cx,top-14);ctx.rotate(active?t*8:0);candy('lolli',0,0,1.4,col);ctx.restore();}
  else if(kind==='melter'){ctx.fillStyle='#6a6a7a';ctx.fillRect(cx-22,top-28,44,28);ctx.fillStyle='#7a4024';ctx.beginPath();ctx.ellipse(cx,top-28,22,6,0,0,TAU);ctx.fill();if(active)for(let k=0;k<3;k++){ctx.fillStyle='rgba(122,64,36,.8)';ctx.beginPath();ctx.arc(cx-10+k*10,top-28+Math.sin(t*6+k)*2,3,0,TAU);ctx.fill();}}
  else if(kind==='press'){const py=active?Math.abs(Math.sin(t*5))*10:0;ctx.fillStyle='#7a7a8a';ctx.fillRect(cx-4,top-44,8,20+py);ctx.fillStyle=col;ctx.fillRect(cx-20,top-26+py,40,10);ctx.fillStyle='#9a9aaa';ctx.fillRect(cx-24,top-48,48,8);}

function drawTruck(x,y,load,col,name){ctx.save();ctx.translate(x,y);ctx.fillStyle='#fff';rr(0,-34,56,30,5);ctx.fill();ctx.strokeStyle='rgba(60,30,80,.3)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=col;rr(2,-12,52,6,3);ctx.fill();ctx.fillStyle='#ff5aa0';ctx.font='700 9px Fredoka,system-ui';ctx.fillText('SUGAR RUSH',5,-20);

  if(golden){ctx.save();ctx.translate(golden.x,golden.y);ctx.rotate(Math.sin(t*3)*.3);const g=ctx.createRadialGradient(0,0,2,0,0,40);g.addColorStop(0,'rgba(255,240,150,.9)');g.addColorStop(1,'rgba(255,200,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,40,0,TAU);ctx.fill();candy('taffy',0,0,2,'#ffd23a');ctx.fillStyle='#ffd23a';ctx.font='700 13px Fredoka,system-ui';ctx.textAlign='center';ctx.fillText('TAP!',0,34);ctx.restore();}
  if(Date.now()<save.boostUntil||goldBoostUntil>Date.now()){ctx.strokeStyle='rgba(255,90,160,'+(.4+Math.sin(t*6)*.3)+')';ctx.lineWidth=8;ctx.strokeRect(4,topH+4,W-8,H-topH-8);}}
function drawBtn(b,txt,ok,col='#ff5aa0'){ctx.globalAlpha=ok?1:.45;ctx.fillStyle='rgba(0,0,0,.18)';rr(b.x,b.y+3,b.w,b.h,12);ctx.fill();const g=ctx.createLinearGradient(0,b.y,0,b.y+b.h);g.addColorStop(0,col==='#ff5aa0'?'#ff8ad0':'#a08aff');g.addColorStop(1,col);ctx.fillStyle=g;rr(b.x,b.y,b.w,b.h,12);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 '+(b.h>40?16:14)+'px Fredoka,system-ui';ctx.textAlign='center';ctx.fillText(txt,b.x+b.w/2,b.y+b.h/2+5,b.w-10);ctx.textAlign='left';ctx.globalAlpha=1;}

/* ================= UPDATE ================= */
let coinSnd=0;
function produce(i){const L=LINES[i];const v=lineRev(i);earn(v,i);items[i].push({p:0,r:rnd(-.3,.3)});const y=rowY(i);floaters.push({x:W*.5+rnd(-60,60),y:y+30,txt:'+🍬'+fmt(v*boostMult()),life:1.1});
  if(coinSnd<=0){SND.play('coin');coinSnd=.15;}}
function update(dt){coinSnd-=dt;LINES.forEach((L,i)=>{const s=save.lines[i];if(!s.n)return;const lt=lineTime(i);
  if(s.mgr||s.t>0){s.t+=dt;if(s.t>=lt){const times=Math.floor(s.t/lt);s.t-=times*lt;if(!s.mgr)s.t=0;const v=lineRev(i)*times;earn(v,i);if(lt>.25||R()<.3){items[i].push({p:0,r:rnd(-.3,.3)});floaters.push({x:W*.55+rnd(-40,40),y:rowY(i)+34,txt:'+🍬'+fmt(v*boostMult()),life:1});if(coinSnd<=0&&rowY(i)>0&&rowY(i)<H){SND.play('coin');coinSnd=.25;}if(R()<.3)SND.play('machine');}
    for(let k=1;k<Math.min(times,3);k++)items[i].push({p:-k*.05,r:0});}}
  const sp=Math.min(1.5,.5/Math.max(.2,Math.min(lt,2)));for(const it of items[i])it.p+=dt*sp;const tr=trucks[i];
  items[i]=items[i].filter(it=>{if(it.p>=1){tr.load=Math.min(1,tr.load+.1);return false;}return true;});if(items[i].length>30)items[i].splice(0,items[i].length-30);
  if(tr.state==='park'&&tr.load>=1){tr.state='go';if(rowY(i)>0&&rowY(i)<H)SND.tone({type:'square',f:440,d:.08,v:.04,lp:1500}),SND.tone({type:'square',f:440,t:.15,d:.08,v:.04,lp:1500});}
  if(tr.state==='go'){tr.x+=dt*260;if(tr.x>140){tr.state='back';tr.x=-140;tr.load=0;}}else if(tr.state==='back'){tr.x=Math.min(0,tr.x+dt*200);if(tr.x>=0)tr.state='park';}
  const wk=workers[i];wk.t+=dt;wk.x+=wk.dir*dt*.12;if(wk.x>1||wk.x<0)wk.dir*=-1;wk.x=clamp(wk.x,0,1);});
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.smoke)p.vy+=500*dt;else p.sz+=dt*6;if(p.life<=0)parts.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.life-=dt;f.y-=40*dt;if(f.life<=0)floaters.splice(i,1);}if(floaters.length>40)floaters.splice(0,floaters.length-40);
  scrollY+=scrollV*dt;scrollV*=Math.pow(.02,dt);const maxS=Math.max(0,topH+14+LINES.length*ROWH-H+80);if(scrollY<0){scrollY=0;scrollV=0;}if(scrollY>maxS){scrollY=maxS;scrollV=0;}
  // golden candy
  if(!golden){goldT-=dt;if(goldT<=0&&save.lines[0].n){golden={x:-40,y:topH+80+R()*(H-topH-200),vx:rnd(70,120),t:0};SND.play('sparkle');}}else{golden.t+=dt;golden.x+=golden.vx*dt;golden.y+=Math.sin(golden.t*2)*30*dt;if(R()<.3)parts.push({x:golden.x+rnd(-15,15),y:golden.y+rnd(-15,15),vx:0,vy:-20,life:.6,col:'#ffd23a',sz:3});if(golden.x>W+40){golden=null;goldT=rnd(70,140);}}
  // orders & boost button
  orderTick(dt);const left=Math.max(0,(save.boostReady-Date.now())/1000),on=Date.now()<save.boostUntil;$('boost').disabled=left>0&&!on;$('boost').textContent=on?'🍭 SUGAR RUSH! '+ftime((save.boostUntil-Date.now())/1000):left>0?'🍭 Rush in '+ftime(left):'🍭 Gumdrop Empire ×3';
  const ps=totalPerSec();$('money').textContent='🍬 '+fmt(save.money);$('rate').textContent=fmt(ps)+' / sec'+(save.stars?' · ⭐ '+save.stars+' (+'+save.stars*2+'%)':'')+(boostMult()>1?' · 🔥 ×'+boostMult():'');
  checkAch();}

/* ================= ORDERS ================= */
function newOrder(){const avail=LINES.map((l,i)=>i).filter(i=>save.lines[i].n>0);if(!avail.length)return;const i=avail[Math.floor(R()*avail.length)];const lt=lineTime(i);const dur=90+Math.floor(R()*4)*30;const per=save.lines[i].mgr?dur/lt:dur/Math.max(lt,1.2)*.6;const need=Math.max(5,Math.round(per*rnd(.45,.7)));
  const reward=Math.max(100,lineRev(i)*need*1.8+totalPerSec()*30);const who=['🧒 Kid\'s Party','🏪 Candy Shop','🎂 Bakery','🎪 Carnival','🏰 The King','🚀 Space Station','🎃 Halloween Store','🎄 Holiday Fair'][Math.floor(R()*8)];
  save.orders.push({i,need,have:0,until:Date.now()+dur*1000,reward,who});SND.play('chime');toast('📦 New order from '+who+'!');}
function orderTick(dt){save.orderT-=dt;if(save.orderT<=0){save.orderT=rnd(60,120);if(save.orders.length<3)newOrder();}const now=Date.now();save.orders=save.orders.filter(o=>{if(o.done)return false;if(now>o.until){toast('⌛ Order from '+o.who+' expired');return false;}return true;});$('bOrd').classList.toggle('hot',save.orders.length>0);$('bOrd').textContent='📦 Orders'+(save.orders.length?' ('+save.orders.length+')':'');}
function orderProg(i){for(const o of save.orders){if(o.i!==i||o.done)continue;o.have++;if(o.have>=o.need){o.done=1;save.money+=o.reward;save.life+=o.reward;SND.play('fanfare');toast('📦 Order complete for '+o.who+'! +🍬'+fmt(o.reward),3.5);confetti(W/2,H/2);save.ach.orders=(save.ach.orders||0)+1;}}}
function confetti(x,y){const cs=['#ff5aa0','#ffd23a','#5ad06a','#5aa0ff','#b05aff'];for(let i=0;i<40;i++)parts.push({x,y,vx:rnd(-260,260),vy:rnd(-420,-120),life:1.5,col:cs[i%5],sz:rnd(4,8)});}

/* ================= ACHIEVEMENTS ================= */
const ACH=[{id:'m1',n:'First Million',d:'Earn 1M candy',chk:()=>save.life>=1e6,r:5},{id:'m2',n:'Billionaire',d:'Earn 1B candy',chk:()=>save.life>=1e9,r:20},{id:'m3',n:'Trillionaire',d:'Earn 1T candy',chk:()=>save.life>=1e12,r:60},
 {id:'l1',n:'Gumdrop Guru',d:'Gumdrops level 100',chk:()=>save.lines[0].n>=100,r:5},{id:'l2',n:'All Lines',d:'Build every candy line',chk:()=>save.lines.every(s=>s.n>0),r:40},{id:'mg',n:'Robot Army',d:'Hire 5 managers',chk:()=>save.lines.filter(s=>s.mgr).length>=5,r:15},
 {id:'g1',n:'Golden Touch',d:'Catch 10 golden candies',chk:()=>save.golden>=10,r:10},{id:'o1',n:'Delivery Pro',d:'Complete 10 orders',chk:()=>(save.ach.orders||0)>=10,r:15},{id:'t1',n:'Tap Master',d:'Tap machines 500 times',chk:()=>save.taps>=500,r:5},{id:'p1',n:'Fresh Start',d:'Open a new factory',chk:()=>save.resets>=1,r:10}];
function checkAch(){for(const a of ACH){if(!save.ach[a.id]&&a.chk()){save.ach[a.id]=1;save.stars+=a.r;SND.play('levelup');toast('🏆 '+a.n+'! +'+a.r+' ⭐',3.5);}}}

/* ================= PANELS ================= */
function sheet(h){$('sheet').innerHTML=h;$('sheet').hidden=false;$('sheet').querySelectorAll('.x').forEach(x=>x.onclick=()=>{$('sheet').hidden=true;SND.play('click');});}
function ordersHTML(){return'<h3>📦 Orders <button class="x">×</button></h3><div class="sub">Customers want candy fast! Make it before time runs out for a big bonus.</div>'+(save.orders.length?'<div class="grid">'+save.orders.map(o=>'<div class="card"><div class="t">'+o.who+'</div><div class="d">'+LINES[o.i].e+' '+o.have+' / '+o.need+' '+LINES[o.i].n+'</div><div style="height:8px;background:#f0e0ec;border-radius:9px;overflow:hidden"><div style="height:100%;width:'+(o.have/o.need*100)+'%;background:#ff5aa0"></div></div><div class="d">⏱️ '+ftime((o.until-Date.now())/1000)+' · Reward 🍬'+fmt(o.reward)+'</div></div>').join('')+'</div>':'<p class="sub">No orders right now. New ones arrive every minute or two.</p>');}
function labHTML(){return'<h3>🧪 Candy Lab <button class="x">×</button></h3><div class="sub">Research makes candy worth more, forever (until you open a new factory).</div><div class="grid">'+LAB.filter((r,k)=>k<4||save.lab[LAB[k-1].id]||save.lab[LAB[Math.max(0,k-4)].id]).slice(0,40).map(r=>{const own=save.lab[r.id];return'<div class="card" style="'+(own?'opacity:.6':'')+'"><div class="t">'+r.n+'</div><div class="d">'+(r.line<0?'All candy':LINES[r.line].e+' '+LINES[r.line].n)+' ×'+r.x+' value</div><button data-lab="'+r.id+'" '+(own||save.money<r.cost?'disabled':'')+'>'+(own?'Done ✓':'🍬 '+fmt(r.cost))+'</button></div>';}).join('')+'</div>';}
function starsFor(){return Math.floor(Math.sqrt(save.life/1e6))-save.starsSpent;}
function preHTML(){const s=Math.max(0,starsFor());return'<h3>⭐ Open a New Factory <button class="x">×</button></h3><div class="sub">Sell this factory and start over with Sugar Stars. Each star gives +2% candy income forever!<br>You have ⭐ '+save.stars+' (+'+save.stars*2+'%).</div><p style="font-size:20px;font-weight:700">You would earn: ⭐ '+s+'</p><p class="sub">Stars come from total candy ever made (1M = 1 star, 4M = 2, 9M = 3…). Lines, managers, lab and candy reset.</p><button class="btn y big" id="doPre" '+(s<1?'disabled':'')+'>Open new factory (+'+s+' ⭐)</button>';}
function achHTML(){return'<h3>🏆 Achievements <button class="x">×</button></h3><div class="grid">'+ACH.map(a=>'<div class="card" style="'+(save.ach[a.id]?'border-color:#5ad06a':'opacity:.7')+'"><div class="t">'+(save.ach[a.id]?'✅ ':'')+a.n+'</div><div class="d">'+a.d+' · +'+a.r+' ⭐</div></div>').join('')+'</div><p class="sub">Candy ever made: 🍬'+fmt(save.life)+' · Golden candies: '+save.golden+' · Taps: '+save.taps+'</p>';}
function setHTML(){return'<h3>⚙️ Settings <button class="x">×</button></h3><div style="display:flex;gap:8px"><button class="btn" id="tMus">🎵 Music: '+(SND.get('music')?'on':'off')+'</button><button class="btn" id="tSfx">🔊 Sounds: '+(SND.get('sfx')?'on':'off')+'</button></div><p class="sub" style="margin-top:10px">👆 Tap a machine to make candy. Hire a 🤖 manager to make it automatic. Managed lines keep earning while you\'re away!<br>⚡ Every 25, 50, 100… levels a line works twice as fast.<br>✨ Tap golden candy flying by for a huge bonus.</p>';}
$('bOrd').onclick=()=>{SND.play('click');sheet(ordersHTML());};$('bLab').onclick=()=>{SND.play('click');sheet(labHTML());};$('bPre').onclick=()=>{SND.play('click');sheet(preHTML());};$('bAch').onclick=()=>{SND.play('click');sheet(achHTML());};$('bSet').onclick=()=>{SND.play('click');sheet(setHTML());};
$('sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.lab){const r=LAB.find(x=>x.id===d.lab);if(save.lab[r.id]||save.money<r.cost){SND.play('error');return;}save.money-=r.cost;save.lab[r.id]=1;SND.play('levelup');persist();sheet(labHTML());}
  if(b.id==='doPre'){const s=starsFor();if(s<1)return;const keep={stars:save.stars+s,starsSpent:save.starsSpent+s,life:save.life,ach:save.ach,golden:save.golden,taps:save.taps,resets:save.resets+1};save=Object.assign(fresh(),keep);SND.play('fanfare');confetti(W/2,H/2);toast('⭐ New factory! +'+s+' stars',3.5);persist();$('sheet').hidden=true;}
  if(b.id==='tMus'){SND.set('music',!SND.get('music'));sheet(setHTML());}if(b.id==='tSfx'){SND.set('sfx',!SND.get('sfx'));sheet(setHTML());}});
$('buyMode').onclick=()=>{SND.play('click');const i=MODES.indexOf(buyMode);buyMode=MODES[(i+1)%MODES.length];$('buyMode').textContent='Buy '+(buyMode==='max'?'MAX':'×'+buyMode);};
$('boost').onclick=()=>{if(Date.now()<save.boostReady)return;save.boostUntil=Date.now()+60000;save.boostReady=Date.now()+300000;SND.play('powerup');SND.play('fanfare');toast('🍭 SUGAR RUSH! Everything ×3 for 60 seconds!');persist();};

/* ================= INPUT ================= */
let drag=null;
cv.addEventListener('pointerdown',e=>{if(!$('sheet').hidden){$('sheet').hidden=true;return;}drag={y0:e.clientY,y:e.clientY,s0:scrollY,t0:performance.now(),moved:0,x:e.clientX};scrollV=0;});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.abs(e.clientY-drag.y0));scrollY-=dy;scrollV=-dy/Math.max(.008,(performance.now()-(drag.lt||drag.t0))/1000);drag.lt=performance.now();drag.y=e.clientY;});
cv.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(d.moved>8)return;scrollV=0;tap(e.clientX,e.clientY);});
function tap(x,y){if(golden&&Math.hypot(x-golden.x,y-golden.y)<50){const g=golden;golden=null;goldT=rnd(70,140);save.golden++;SND.play('rare');buzz([20,40,20]);if(R()<.5){const v=Math.max(500,totalPerSec()*45+save.money*.05);earn(v/boostMult());floaters.push({x:g.x,y:g.y,txt:'✨ +🍬'+fmt(v),life:2,big:1,col:'#d08a00'});toast('✨ Golden candy! +🍬'+fmt(v));}else{goldBoostUntil=Date.now()+30000;toast('✨ Golden frenzy! ×7 for 30 seconds!');SND.play('fanfare');}confetti(g.x,g.y);return;}
  for(const b of btns){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){act(b,x,y);return;}}}
function act(b,x,y){const i=b.i,s=save.lines[i],L=LINES[i];
  if(b.act==='tap'){if(!s.n)return;save.taps++;if(!s.mgr&&s.t===0){s.t=.0001;SND.play('pop');SND.play('machine');}else{s.t+=lineTime(i)*.08;SND.play('tap');}for(let k=0;k<5;k++)parts.push({x,y,vx:rnd(-120,120),vy:rnd(-260,-80),life:.8,candy:L.shape,col:L.col,r:R()*6});buzz(8);}
  else if(b.act==='buy'){const k=s.n?(b.k||buyCount(i)):1,c=s.n?costN(i,k):L.cost;if(save.money<c){SND.play('error');return;}save.money-=c;const before=s.n;s.n+=k;SND.play('buy');const crossed=MILES.find(m=>before<m&&s.n>=m);if(crossed){SND.play('levelup');toast('⚡ '+L.n+' reached level '+crossed+'! Twice as fast!');confetti(x,y);}if(!before){SND.play('fanfare');toast('🏭 New line: '+L.n+'! Tap the machine to start.');}persist();}
  else if(b.act==='mgr'){if(save.money<L.mgr){SND.play('error');return;}save.money-=L.mgr;s.mgr=true;SND.play('success');toast('🤖 Manager hired! '+L.n+' now runs by itself, even offline.');persist();}}

/* ================= OFFLINE ================= */
function offline(){const el=Math.min(86400,(Date.now()-save.last)/1000);if(el<30)return;const ps=LINES.reduce((a,_,i)=>a+perSec(i),0);const v=ps*el;if(v<1)return;save.money+=v;save.life+=v;$('wTxt').innerHTML='You were away for <b>'+ftime(el)+'</b>.<br>Your robot managers made <b>🍬'+fmt(v)+'</b>!';$('welcome').hidden=false;}
$('wOk').onclick=()=>{$('welcome').hidden=true;SND.play('cash');confetti(W/2,H/2);};

/* ================= LOOP ================= */
let last=performance.now(),saveT=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;t+=dt;update(dt);draw();if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true;}saveT+=dt;if(saveT>5){saveT=0;persist();}requestAnimationFrame(frame);}
addEventListener('visibilitychange',()=>{if(document.hidden)persist();else offline();});addEventListener('pagehide',persist);
SND.music('candy');SND.amb('hum',.5);offline();requestAnimationFrame(frame);
window.__sf={save:()=>save,earn:v=>{save.money+=v;},golden:()=>{goldT=0;},tap,btns,LINES,setLast:ms=>{save.last=ms;},offline};
})();

});</script>

</body></html>
