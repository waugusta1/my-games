<title>Tiny Greens</title>
<style>
/* Garden mini-golf at golden hour: deep hedge greens, cream paper UI, flag red */
:root{--bg:#0f2a1c;--ink:#fffaf0;--muted:#cfe3cf;--accent:#ff5d4a;--gold:#ffcd4a;--card:rgba(14,38,26,.9);--line:rgba(255,250,230,.22);color-scheme:dark;--disp:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;--body:Nunito,system-ui,sans-serif}

#c{position:fixed;inset:0;width:100%;height:100%;display:block}

h1{font-family:var(--disp);font-weight:400;font-size:clamp(54px,16vw,92px);margin:0;line-height:.9;color:#fff6d8;text-shadow:0 5px 0 #2f7a3c,0 10px 30px rgba(0,0,0,.45);letter-spacing:.01em}
h1 span{color:var(--gold)}
h2{font-family:var(--disp);font-weight:400;font-size:40px;margin:0;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.sub{color:var(--muted);font-weight:700;font-size:15px;max-width:320px;margin:0;line-height:1.45}
.btn{font:900 18px var(--body);color:#173a22;background:linear-gradient(180deg,#fff3c4,#ffcd4a);border:0;border-radius:999px;padding:13px 34px;cursor:pointer;box-shadow:0 5px 0 #b8861c,0 10px 24px rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8861c}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1.5px solid var(--line);font-size:15px;padding:10px 20px}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;min-width:78px}
.pill span{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:900;text-transform:uppercase}
.pill b{display:block;font-size:24px;font-weight:900}

table.card td{padding:6px 0;width:26px;text-align:center;border-right:1px solid rgba(255,255,255,.06)}
table.card tr:first-child td{color:var(--muted);font-size:11px}
table.card tr:nth-child(2) td{color:var(--muted)}
table.card td.cur{background:rgba(255,205,74,.18)}
td.u{color:#7fe08a}td.o{color:#ff9a8a}td.e{color:#fff}
#res{font-family:var(--disp);font-size:clamp(44px,13vw,70px);color:#fff6d8;margin:0;text-shadow:0 4px 0 rgba(0,0,0,.3)}
#hudBtn{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:rgba(10,30,18,.6);color:var(--ink);font:900 18px var(--body);cursor:pointer}
</style>
