<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}</style></head><body>
<title>Tiny Greens</title>
<style>
/* Garden mini-golf at golden hour: deep hedge greens, cream paper UI, flag red */
:root{--bg:#0f2a1c;--ink:#fffaf0;--muted:#cfe3cf;--accent:#ff5d4a;--gold:#ffcd4a;--card:rgba(14,38,26,.9);--line:rgba(255,250,230,.22);color-scheme:dark;--disp:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;--body:Nunito,system-ui,sans-serif}

html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;text-align:center;background:radial-gradient(ellipse at center,rgba(15,42,28,.72),rgba(8,24,15,.94))}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(54px,16vw,92px);margin:0;line-height:.9;color:#fff6d8;text-shadow:0 5px 0 #2f7a3c,0 10px 30px rgba(0,0,0,.45);letter-spacing:.01em}
h1 span{color:var(--gold)}
h2{font-family:var(--disp);font-weight:400;font-size:40px;margin:0;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.sub{color:var(--muted);font-weight:700;font-size:15px;max-width:320px;margin:0;line-height:1.45}
.btn{font:900 18px var(--body);color:#173a22;background:linear-gradient(180deg,#fff3c4,#ffcd4a);border:0;border-radius:999px;padding:13px 34px;cursor:pointer;box-shadow:0 5px 0 #b8861c,0 10px 24px rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8861c}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1.5px solid var(--line);font-size:15px;padding:10px 20px}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;min-width:78px}
.pill span{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:900;text-transform:uppercase}
.pill b{display:block;font-size:24px;font-weight:900}

table.card tr:first-child td{color:var(--muted);font-size:11px}
table.card tr:nth-child(2) td{color:var(--muted)}
table.card td.cur{background:rgba(255,205,74,.18)}
td.u{color:#7fe08a}td.o{color:#ff9a8a}td.e{color:#fff}
#res{font-family:var(--disp);font-size:clamp(44px,13vw,70px);color:#fff6d8;margin:0;text-shadow:0 4px 0 rgba(0,0,0,.3)}
#hudBtn{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:rgba(10,30,18,.6);color:var(--ink);font:900 18px var(--body);cursor:pointer}
</style>

</div>
<script>
/* Cloud save: keeps game saves in your Claude account so they survive across devices and cleared browser storage. */
(()=>{const mem={},has={};let ls=null;try{ls=window.localStorage;ls.getItem('__probe');}catch(_){ls=null;}
const lget=k=>{try{return ls?ls.getItem(k):null;}catch(_){return null;}},lset=(k,v)=>{try{if(!ls)return;v===null?ls.removeItem(k):ls.setItem(k,v);}catch(_){}};

async function flush(){clearTimeout(timer);timer=0;if(!col||busy)return;busy=true;try{while(pending.size){const[k,v]=pending.entries().next().value;pending.delete(k);
  try{const ref=col.doc(safe(k));if(v===null)await ref.delete();else if(v.length<240000)await ref.set({k,v,t:Date.now()});}catch(e){if(e&&e.code==='unavailable'){pending.set(k,v);await new Promise(r=>setTimeout(r,1500+Math.random()*1000));}}}}finally{busy=false;}}
const sched=()=>{if(!timer)timer=setTimeout(flush,2000);};
window.__store={flush(){if(timer){clearTimeout(timer);timer=0;}flush();},get(k){return has[k]?mem[k]:lget(k);},
  set(k,v){v=String(v);has[k]=1;mem[k]=v;lset(k,v);lset('__t:'+k,String(Date.now()));pending.set(k,v);sched();},
  remove(k){has[k]=1;mem[k]=null;lset(k,null);lset('__t:'+k,String(Date.now()));pending.set(k,null);sched();}};
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});addEventListener('pagehide',flush);
async function load(){if(!window.claude||!claude.use)return;const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;const id=await u.id();if(!id)return;
  db=d;uid=id;col=db.collection('data/users/'+uid);const snap=await col.get();const seen=new Set();
  for(const doc of snap.docs){const b=doc.data();if(!b||typeof b.k!=='string')continue;seen.add(b.k);const lt=+(lget('__t:'+b.k)||0),lv=lget(b.k);
    if(lv!==null&&lt>(b.t||0)){pending.set(b.k,lv);}else{has[b.k]=1;mem[b.k]=b.v;lset(b.k,b.v);lset('__t:'+b.k,String(b.t||Date.now()));}}
  if(ls){for(let i=0;i<ls.length;i++){const k=ls.key(i);if(!k||k.startsWith('__')||seen.has(k))continue;pending.set(k,lget(k));}}
  if(pending.size)sched();}
let ready=false;const waiters=[];
window.__boot=fn=>{if(ready)fn();else waiters.push(fn);};
const go=()=>{if(ready)return;ready=true;waiters.splice(0).forEach(f=>{try{f();}catch(e){setTimeout(()=>{throw e;});}});};
Promise.race([load().catch(()=>{}),new Promise(r=>setTimeout(r,5000))]).then(go);
})();
</script>
<script>__boot(function(){
(()=>{

/* ---------- course ---------- */

 {n:'Warm-up',par:2,outer:rect(90,40,120,450),tee:[150,440],cup:[150,100]},

 {n:'Pinball',par:3,outer:rect(40,40,220,450),posts:[[100,330,16],[200,330,16],[150,262,18],[88,185,14],[212,185,14],[150,150,12]],tee:[150,450],cup:[150,82]},
 {n:'Bunker',par:3,outer:[[60,40],[240,40],[260,120],[260,490],[40,490],[40,120]],sand:[[[86,205],[214,205],[226,295],[74,295]],[[118,58],[182,58],[172,74],[128,74]]],tee:[150,450],cup:[150,108]},

 {n:'Windmill',par:3,outer:rect(70,40,160,450),movers:[{t:'spin',x:150,y:270,len:150,sp:1.35}],posts:[[150,270,11,1]],tee:[150,450],cup:[150,90]},
 {n:'Hillside',par:3,outer:rect(40,40,220,450),slopes:[{r:[40,330,220,70],f:[300,0]},{r:[40,200,220,70],f:[-300,0]}],tee:[150,450],cup:[150,90]},
 {n:'Serpent',par:4,outer:rect(40,40,220,450),blocks:[[40,365,165,16],[95,250,165,16],[40,135,160,16]],tee:[75,450],cup:[90,82]},

 {n:'Warp',par:2,outer:rect(40,40,220,450),blocks:[[40,170,220,16]],posts:[[105,300,13],[195,300,13]],tele:[[150,262],[150,140]],tee:[150,450],cup:[150,74]},
 {n:'Grand Finale',par:4,outer:[[90,40],[210,40],[260,110],[260,490],[40,490],[40,110]],water:[rect(40,250,70,70)],sand:[rect(190,250,70,70)],movers:[{t:'spin',x:150,y:285,len:118,sp:-1.7}],posts:[[150,285,10,1],[100,160,13],[200,160,13]],slopes:[{r:[110,360,80,60],f:[0,-160]}],tee:[150,455],cup:[150,82]}];

const GCACHE=new Map();

  const h={n:pick(ADJ)+' '+pick(NOUN),par:2,outer,blocks:[],posts:[],sand:[],water:[],movers:[],slopes:[],tee:[150+(w>180?ri(-30,30):0),452],cup:[150+ri(-(w/2-58),w/2-58),ri(82,104)]};

  if(i>14&&r()<.14){h.blocks.push([x0,165,w,16]);h.tele=[[ri(x0+35,x1-35),236],[150,134]];h.cup=[150,76];bands=bands.slice(0,2);diff+=1;}

  for(const[ya,yb]of bands.slice(0,nb)){const ym=(ya+yb)/2;let t=pick(pool);if((t==='windmill'||t==='gate')&&mills>=1)t='posts';
    if(t==='block'){const bw=ri(40,Math.min(90,w-100)),bx=ri(x0+48,x1-48-bw),bh=ri(18,44);h.blocks.push([bx,ym-bh/2,bw,bh]);diff+=.5;}

/* ---------- sizing ---------- */

/* ---------- state ---------- */
let state='title',hi=0,scores=[],strokes=0,holeDone=false,ball={x:0,y:0,vx:0,vy:0,moving:false,sunk:0,z:1},last={x:0,y:0},HOLE=null,segs=[],aim=null,parts=[],trail=[],t=0,teleCd=0,splashT=0,msg=null,flagUp=1,shake=0;

/* ---------- geometry ---------- */
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}

function collideSeg(ax,ay,bx,by,svx,svy,e,rad){const[qx,qy]=closest(ball.x,ball.y,ax,ay,bx,by);let dx=ball.x-qx,dy=ball.y-qy,d=hyp(dx,dy);if(d>=rad||d<1e-6)return 0;
  const nx=dx/d,ny=dy/d;ball.x=qx+nx*rad;ball.y=qy+ny*rad;const rvx=ball.vx-svx,rvy=ball.vy-svy,vn=rvx*nx+rvy*ny;if(vn<0){ball.vx-=(1+e)*vn*nx;ball.vy-=(1+e)*vn*ny;ball.vx*=.985;ball.vy*=.985;return -vn;}return 0;}

/* ---------- physics ---------- */
let wallSnd=0;
function step(dt){const h=HOLE;let hitV=0;

  let onSand=false,onSlope=false;for(const p of h.sand||[])if(inPoly(ball.x,ball.y,p))onSand=true;
  for(const s of h.slopes||[])if(inRect(ball.x,ball.y,s.r)){ball.vx+=s.f[0]*dt;ball.vy+=s.f[1]*dt;onSlope=true;}

  if(cd<CUPR+2){const pull=2400*(1-cd/(CUPR+2));ball.vx+=cdx/(cd||1)*pull*dt;ball.vy+=cdy/(cd||1)*pull*dt;}
  const sp=hyp(ball.vx,ball.vy);

const NAMES={'-3':'Albatross!','-2':'Eagle!','-1':'Birdie!','0':'Par','1':'Bogey','2':'Double bogey','3':'Triple bogey'};

/* ---------- input ---------- */

/* ---------- update ---------- */

/* ---------- rendering ---------- */
function polyPath(g,p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();}

  STATIC=c;}
function drawPost(p){const[x,y,r,metal]=p;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+3,y+6,r,r*.9,0,0,TAU);ctx.fill();

function render(dt){ctx.setTransform(1,0,0,1,0,0);

  if(!STATIC)buildStatic();ctx.drawImage(STATIC,0,0);
  const h=HOLE;ctx.setTransform(dpr*k,0,0,dpr*k,dpr*ox,dpr*oy);
  // water (animated)
  for(const p of h.water||[]){ctx.save();polyPath(ctx,p);ctx.clip();const wg=ctx.createLinearGradient(0,p[0][1],0,p[2][1]);wg.addColorStop(0,'#2a7fb8');wg.addColorStop(1,'#1a5f94');ctx.fillStyle=wg;ctx.fillRect(0,0,300,530);
    ctx.strokeStyle='rgba(220,245,255,.35)';ctx.lineWidth=1.2;for(let i=0;i<9;i++){const y=p[0][1]+((i*11+t*8)%90);ctx.beginPath();for(let x=0;x<=300;x+=6){const yy=y+Math.sin(x*.09+t*1.6+i)*2;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}ctx.stroke();}
    for(let i=0;i<4;i++){const lx=p[0][0]+((i*37+t*5)%80),ly=p[0][1]+((i*23)%60)+8;ctx.fillStyle='#3f9a52';ctx.beginPath();ctx.arc(lx,ly,6,.4,TAU-.2);ctx.lineTo(lx,ly);ctx.fill();}
    ctx.restore();polyPath(ctx,p);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;ctx.stroke();}
  // slope chevrons
  for(const s of h.slopes||[]){const[x,y,w,hh]=s.r,f=s.f,fl=hyp(f[0],f[1]),ux=f[0]/fl,uy=f[1]/fl;ctx.save();ctx.beginPath();ctx.rect(x,y,w,hh);ctx.clip();ctx.strokeStyle='rgba(255,255,230,.28)';ctx.lineWidth=3;ctx.lineCap='round';
    const off=(t*30)%26;for(let a=-300;a<300;a+=26){for(let b=-60;b<=60;b+=30){const cx=x+w/2+ux*(a+off)-uy*b*2,cy=y+hh/2+uy*(a+off)+ux*b*2;ctx.beginPath();ctx.moveTo(cx-ux*6-uy*8,cy-uy*6+ux*8);ctx.lineTo(cx,cy);ctx.lineTo(cx-ux*6+uy*8,cy-uy*6-ux*8);ctx.stroke();}}ctx.restore();}
  // teleport swirl
  if(h.tele){for(const p of h.tele){ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(t*3);ctx.strokeStyle='rgba(220,200,255,.8)';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.rotate(TAU/3);ctx.beginPath();ctx.arc(0,0,9,0,1.6);ctx.stroke();}ctx.restore();}}
  // aim guide
  if(aim){const p=aimPower(),dx=aim.sx-aim.x,dy=aim.sy-aim.y,d=hyp(dx,dy);if(d>12){const ux=dx/d,uy=dy/d,len=30+p*150;const col=p<.5?`rgb(${Math.round(lerp(140,255,p*2))},255,120)`:`rgb(255,${Math.round(lerp(255,90,(p-.5)*2))},90)`;
    ctx.fillStyle=col;for(let s=14;s<len;s+=9){const a=1-s/len*.7;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(ball.x+ux*s,ball.y+uy*s,2.2,0,TAU);ctx.fill();}ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x-ux*(10+p*40),ball.y-uy*(10+p*40));ctx.stroke();ctx.setLineDash([]);
    ctx.save();ctx.translate(ball.x,ball.y);ctx.beginPath();ctx.arc(0,0,16,-Math.PI/2,-Math.PI/2+p*TAU);ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();ctx.restore();}}
  // trail
  if(trail.length>1){ctx.lineCap='round';for(let i=1;i<trail.length;i++){ctx.strokeStyle=`rgba(255,255,255,${i/trail.length*.35})`;ctx.lineWidth=i/trail.length*BR*1.4;ctx.beginPath();ctx.moveTo(trail[i-1][0],trail[i-1][1]);ctx.lineTo(trail[i][0],trail[i][1]);ctx.stroke();}}
  // ball
  if(ball.z>0){const s=ball.sunk?ball.z:1,inW=splashT>0;const bx=ball.x,by=ball.y;ctx.globalAlpha=inW?Math.max(0,splashT-.3):1;
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bx+2.5,by+4,BR*s,BR*.8*s,0,0,TAU);ctx.fill();
    const g=ctx.createRadialGradient(bx-2.4*s,by-2.8*s,.5,bx,by,BR*s);g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#f2f2ea');g.addColorStop(1,'#b8bcb0');ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,BR*s,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(150,150,140,.35)';for(let i=0;i<5;i++){const a=i*1.3+(ball.x+ball.y)*.15;ctx.beginPath();ctx.arc(bx+Math.cos(a)*3.5*s,by+Math.sin(a)*3.5*s,.8*s,0,TAU);ctx.fill();}ctx.globalAlpha=1;}
  // movers + posts (above ball shadow)
  for(const m of h.movers||[]){if(m.t==='spin'){const a=m.sp*t;ctx.save();ctx.translate(m.x,m.y);ctx.fillStyle='rgba(0,0,0,.3)';ctx.save();ctx.translate(4,7);ctx.rotate(a);rrect(ctx,-m.len/2,-5,m.len,10,5);ctx.fill();ctx.restore();
      ctx.rotate(a);const bg=ctx.createLinearGradient(0,-5,0,5);bg.addColorStop(0,'#ffe9b0');bg.addColorStop(1,'#d8962e');ctx.fillStyle=bg;rrect(ctx,-m.len/2,-5,m.len,10,5);ctx.fill();ctx.strokeStyle='rgba(120,70,20,.5)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='#e05a3a';rrect(ctx,-m.len/2,-5,14,10,5);ctx.fill();rrect(ctx,m.len/2-14,-5,14,10,5);ctx.fill();ctx.restore();}
    else{const st=moverState(m,t);ctx.fillStyle='rgba(0,0,0,.3)';rrect(ctx,st.x+4,st.y+7,m.w,m.h,3);ctx.fill();ctx.fillStyle='#3a5a8a';rrect(ctx,st.x,st.y+3,m.w,m.h,3);ctx.fill();const gg=ctx.createLinearGradient(0,st.y,0,st.y+m.h);gg.addColorStop(0,'#8ab8ff');gg.addColorStop(1,'#5a88d8');ctx.fillStyle=gg;rrect(ctx,st.x,st.y,m.w,m.h-2,3);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(st.x+m.w*(i+1)/4,st.y+m.h/2-1,1.6,0,TAU);ctx.fill();}}}
  for(const p of h.posts||[])drawPost(p);
  // flag
  if(flagUp>.02){const[cx,cy]=h.cup;const ph=46*flagUp;ctx.globalAlpha=flagUp;ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+ph*.35,cy+ph*.2);ctx.stroke();
    ctx.strokeStyle='#f4f4ee';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy-ph);ctx.stroke();ctx.fillStyle='#ff4a3a';ctx.beginPath();ctx.moveTo(cx,cy-ph);
    for(let i=0;i<=8;i++){const u=i/8;ctx.lineTo(cx+u*22,cy-ph+Math.sin(t*6-u*4)*2.5*u+u*2);}for(let i=8;i>=0;i--){const u=i/8;ctx.lineTo(cx+u*22,cy-ph+13+Math.sin(t*6-u*4)*2.5*u-u*2);}ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='900 8px Nunito,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(hi+1,cx+10,cy-ph+9.5);ctx.globalAlpha=1;}
  // particles
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life/p.ml*2);ctx.fillStyle=p.c;if(p.conf){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();}}ctx.globalAlpha=1;
  // HUD
  ctx.setTransform(dpr,0,0,dpr,0,0);if(state!=='title'){const top=12+(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0);
    ctx.textAlign='left';ctx.fillStyle='#fff6d8';ctx.font='400 26px "Lilita One",system-ui,sans-serif';ctx.fillText('Hole '+(hi+1),14,top+24);
    ctx.font='800 13px Nunito,system-ui,sans-serif';ctx.fillStyle='#cfe3cf';ctx.fillText('Par '+h.par+'  ·  '+h.n,14,top+42);
    ctx.textAlign='center';ctx.font='400 30px "Lilita One",system-ui,sans-serif';ctx.fillStyle='#fff6d8';ctx.fillText(strokes,W/2,top+26);ctx.font='800 11px Nunito,system-ui,sans-serif';ctx.fillStyle='#cfe3cf';ctx.fillText(strokes===1?'STROKE':'STROKES',W/2,top+41);
    const T=total();ctx.textAlign='right';ctx.font='800 12px Nunito,system-ui,sans-serif';ctx.fillStyle='#cfe3cf';ctx.fillText('ROUND',W-64,top+20);ctx.font='400 22px "Lilita One",system-ui,sans-serif';ctx.fillStyle=T.d<0?'#7fe08a':T.d>0?'#ff9a8a':'#fff6d8';ctx.fillText(fmtD(T.d),W-64,top+42);
    if(!ball.moving&&!aim&&!holeDone&&strokes===0&&hi<2){ctx.textAlign='center';ctx.font='800 14px Nunito,system-ui,sans-serif';ctx.fillStyle=`rgba(255,250,230,${.6+Math.sin(t*3)*.25})`;ctx.fillText('Drag back from anywhere, then let go',W/2,H-22);}
    if(msg){const a=Math.min(1,msg.t*2);ctx.globalAlpha=a;ctx.textAlign='center';ctx.font='400 '+(msg.small?30:38)+'px "Lilita One",system-ui,sans-serif';ctx.lineWidth=6;ctx.strokeStyle='rgba(10,30,15,.6)';ctx.strokeText(msg.txt,W/2,H*.42);ctx.fillStyle='#fff6d8';ctx.fillText(msg.txt,W/2,H*.42);
      if(msg.sub){ctx.font='800 16px Nunito,system-ui,sans-serif';ctx.lineWidth=4;ctx.strokeText(msg.sub,W/2,H*.42+26);ctx.fillStyle='#ffcd4a';ctx.fillText(msg.sub,W/2,H*.42+26);}ctx.globalAlpha=1;}}
}

/* ---------- title backdrop ---------- */
function titleScene(){hi=0;HOLE=HOLES[3];segs=buildSegs(HOLE);ball.x=150;ball.y=420;ball.z=1;ball.sunk=0;STATIC=null;}

let lastT=performance.now();
function frame(now){const dt=Math.min(.033,(now-lastT)/1000);lastT=now;if(state==='play'||state==='hole')update(dt);else t+=dt;render(dt);requestAnimationFrame(frame);}
resize();titleScene();updTitle();requestAnimationFrame(frame);
window.__tg={check:n=>{const bad=[];for(let i=NH;i<n;i++){const h=HL(i);for(const p of[h.tee,h.cup]){let ok=inPoly(p[0],p[1],h.outer);for(const b of h.blocks)if(inRect(p[0],p[1],[b[0]-12,b[1]-12,b[2]+24,b[3]+24]))ok=false;for(const w of h.water)if(inPoly(p[0],p[1],w))ok=false;for(const q of h.posts)if(hyp(p[0]-q[0],p[1]-q[1])<q[2]+14)ok=false;if(!ok)bad.push(i);}}return bad;},get s(){return{state,hi,strokes,ball:{...ball},scores}},shoot:(dx,dy,p)=>{const d=hyp(dx,dy);last.x=ball.x;last.y=ball.y;const sp=40+p*760;ball.vx=dx/d*sp;ball.vy=dy/d*sp;ball.moving=true;strokes++;},go:i=>{hideAll();state='play';$('hudBtn').hidden=false;startHole(i);}};
})();
