:root{--wall:#2a2452;--wall2:#1f1a3e;--ink:#fff6e3;--mut:#c2bbdc;--sun:#ffcf33;--btn:#ff4d3d;--btn2:#b92418;--wood:#dcaa6c;--wood2:#ae7640;--wood3:#7c4e27;--disp:"Big Shoulders Display","Arial Narrow",sans-serif;--body:Barlow,system-ui,-apple-system,sans-serif;--cw:176px;--gut:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--wall2)}
body{margin:0;color:var(--ink);font:500 16px/1.4 var(--body);min-height:100vh;padding:env(safe-area-inset-top) 0 calc(30px + env(safe-area-inset-bottom));overflow-x:hidden}
.room{position:fixed;inset:0;z-index:-1;background:radial-gradient(90vmax 60vmax at 18% -8%,#5a4596 0%,transparent 62%),radial-gradient(70vmax 50vmax at 96% 8%,#7a3f7e 0%,transparent 60%),linear-gradient(180deg,var(--wall),var(--wall2))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;line-height:1}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gut)}

/* the sign and plaques on the wall */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;padding-top:22px}
.sign{font-size:clamp(60px,9vw,92px);color:#fff8ee;letter-spacing:.015em;text-shadow:0 0 4px #fff,0 0 14px #ff8fd0,0 0 34px #ff4fb0,0 0 70px rgba(255,79,176,.55)}
.plaques{display:flex;gap:10px;flex-wrap:wrap}
.plaque{min-width:82px;padding:7px 12px 8px;border-radius:5px;background:linear-gradient(160deg,#f2d27e,#c8963d 55%,#e7c56c);color:#3d2708;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 5px 11px rgba(0,0,0,.42);font-size:13px;line-height:1.15;font-weight:600}
.plaque b{display:block;font:800 25px/1 var(--disp)}
.save{display:flex;align-items:center;gap:9px;margin:12px 0 0;font-size:14px;color:var(--mut);min-height:20px}
.lamp{flex:none;width:10px;height:10px;border-radius:50%;background:#ffb627;box-shadow:0 0 9px #ffb627}.save.done .lamp{background:#57f08e;box-shadow:0 0 9px #57f08e}
.meter{flex:0 1 150px;height:6px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden}.meter i{display:block;height:100%;width:0;background:#ffb627}.save.done .meter{display:none}

/* TV on its console */
.den{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(18px,3.4vw,44px);align-items:center;margin-top:20px}
.tvbase{position:relative;padding-bottom:30px}
.tv{position:relative;z-index:1;padding:13px 13px 32px;border-radius:18px;background:linear-gradient(170deg,#4e4c5c,#26252f 60%,#1a1921);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 -2px 0 rgba(0,0,0,.5) inset,0 16px 26px rgba(0,0,0,.5)}
.glass{position:relative;display:block;aspect-ratio:16/9;border-radius:11px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #0a0a0f,0 0 40px rgba(170,190,255,.25);cursor:pointer;width:100%;padding:0;border:0}
.glass img{display:block;width:100%;height:100%;object-fit:cover}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18) 0,rgba(255,255,255,.05) 26%,transparent 27%),repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.45));pointer-events:none}
.glass canvas{position:absolute;inset:0;width:100%;height:100%;display:none}.glass.static canvas{display:block}
.glass.on::before{content:"";position:absolute;inset:0;z-index:2;background:#fff;animation:flash .38s ease-in forwards}@keyframes flash{0%{opacity:0}100%{opacity:1}}
.tvled{position:absolute;right:20px;bottom:11px;width:8px;height:8px;border-radius:50%;background:#59ff91;box-shadow:0 0 9px #59ff91}
.tvmark{position:absolute;left:20px;bottom:8px;font:800 14px var(--disp);letter-spacing:.09em;color:#a6a4b8}
.console{position:absolute;left:-22px;right:-22px;bottom:0;height:42px;border-radius:4px;background:linear-gradient(180deg,var(--wood) 0 11px,var(--wood2) 11px,var(--wood3));box-shadow:0 16px 24px rgba(0,0,0,.42)}
.pick small{display:block;color:var(--sun);font:700 17px var(--body)}
.pick h2{font-size:clamp(44px,6.2vw,74px);margin:3px 0 8px}
.pick p{margin:0 0 15px;color:#e7e1f5;max-width:36ch}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.play{border:0;border-radius:13px;padding:13px 26px 15px;min-height:50px;background:var(--btn);color:#fff;font:800 24px/1 var(--disp);letter-spacing:.03em;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 5px 0 var(--btn2),0 10px 15px rgba(0,0,0,.35)}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 1px 0 var(--btn2)}
.ghost{border:2px solid rgba(255,246,227,.34);background:rgba(255,255,255,.05);border-radius:13px;padding:10px 16px;min-height:50px;font-weight:700;cursor:pointer}
.ghost:active{background:rgba(255,255,255,.17)}

/* latest arrival note */
.note{margin-top:20px;background:#fff2a8;color:#3b2f10;border-radius:3px;padding:11px 15px 12px;box-shadow:0 8px 14px rgba(0,0,0,.34);transform:rotate(-.25deg);font-weight:500}
.note summary{cursor:pointer;list-style:none;font-size:15px}.note summary::-webkit-details-marker{display:none}
.note summary u{font-weight:700;white-space:nowrap}
.note ul{margin:9px 0 2px;padding:9px 0 0 18px;border-top:1px dashed rgba(59,47,16,.42);max-height:300px;overflow:auto;font-size:15px}.note li{margin-bottom:6px}

/* search strip */
.ctl{position:sticky;top:0;z-index:5;margin:18px calc(var(--gut) * -1) 0;padding:calc(8px + env(safe-area-inset-top)) var(--gut) 8px;background:rgba(31,26,62,.97);box-shadow:0 7px 12px rgba(0,0,0,.28)}
.bar{display:flex;gap:8px}
#q{flex:1;min-width:0;height:46px;padding:0 15px;border-radius:11px;border:2px solid rgba(255,255,255,.18);background:#15112f;outline-offset:0;font-size:17px}#q::placeholder{color:#a79fc8}
#sort{height:46px;max-width:140px;padding:0 9px;border-radius:11px;border:2px solid rgba(255,255,255,.18);background:#15112f;font-weight:600}
.cats{display:flex;gap:5px;overflow-x:auto;margin:8px calc(var(--gut) * -1) 0;padding:0 var(--gut);scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;min-height:38px;display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--mut);font-weight:700;padding:0 12px;border-radius:8px;cursor:pointer}.cat.on{background:var(--sun);color:#2b1f00}.cat svg{width:15px;height:15px}

/* shelves */
.shelf{margin-top:26px;--led:255,190,110;content-visibility:auto;contain-intrinsic-size:auto 300px}
.shelf>h3{font-size:31px;margin:0 var(--gut) 3px;max-width:1200px}.shelf>h3 span{margin-left:7px;font:600 15px var(--body);color:var(--mut)}
.row{display:flex;gap:15px;overflow-x:auto;padding:15px var(--gut) 0;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:var(--gut);background:radial-gradient(70% 90% at 50% 112%,rgba(var(--led),.5),transparent 70%)}.row::-webkit-scrollbar{display:none}
.plank{position:relative;height:30px;background:linear-gradient(180deg,var(--wood) 0 11px,var(--wood2) 11px,var(--wood3));box-shadow:0 13px 20px rgba(0,0,0,.42),0 -1px 0 rgba(255,255,255,.28) inset}
.plank::after{content:"";position:absolute;left:0;right:0;top:11px;height:3px;background:rgba(var(--led),.85);box-shadow:0 0 11px rgba(var(--led),.85)}
.stack{padding:0}.stack .row{overflow:visible;flex-wrap:nowrap}

/* cartridge */
.g{--p:#555;position:relative;flex:none;display:block;width:var(--cw);padding:17px 8px 11px;border-radius:9px 9px 3px 3px;background-color:var(--p);background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 2px,rgba(255,255,255,.14) 2px 3px,transparent 3px 5px),linear-gradient(90deg,rgba(255,255,255,.2),transparent 11%,transparent 88%,rgba(0,0,0,.28)),linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22));background-size:100% 13px,100% 100%,100% 100%;background-repeat:no-repeat;color:inherit;text-decoration:none;scroll-snap-align:start;box-shadow:0 1px 0 rgba(255,255,255,.34) inset,0 7px 8px -2px rgba(0,0,0,.55);transition:transform .14s}
.g:active{transform:translateY(-9px)}@media (hover:hover){.g:hover{transform:translateY(-7px)}}
.lbl{display:block;border-radius:4px;overflow:hidden;background:#17142b;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 0 1px rgba(255,255,255,.17)}
.lbl img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.lbl b{display:block;padding:6px 8px 0;font:800 20px/1.04 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl em{display:block;padding:1px 8px 7px;font:500 12.5px/1.25 var(--body);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{position:absolute;right:0;top:0;width:46px;height:44px;border:0;background:none;padding:0 5px 25px 22px;cursor:pointer;color:rgba(255,255,255,.72)}.fav svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}.fav.on{color:var(--sun)}
.new{position:absolute;left:-8px;top:-13px;width:38px;height:38px;display:grid;place-items:center;background:var(--sun);color:#3a2300;font:800 13.5px var(--disp);transform:rotate(-12deg);clip-path:polygon(50% 0,61% 13%,76% 7%,80% 23%,96% 26%,91% 42%,100% 53%,89% 64%,93% 80%,77% 82%,70% 97%,55% 90%,41% 99%,32% 85%,15% 87%,14% 70%,1% 61%,9% 46%,2% 30%,18% 24%,24% 8%,39% 13%)}
.d3{position:absolute;left:10px;top:1px;font:800 12.5px var(--disp);letter-spacing:.06em;color:rgba(255,255,255,.88);background:var(--p);padding:0 4px;line-height:14px}
.g .new~.d3{left:40px}
.empty{padding:18px var(--gut) 8px;color:var(--mut)}.empty button{margin-left:8px}

/* trophy shelf */
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px var(--gut) 12px;max-width:1240px;margin:0 auto}
.bd{text-align:center;font-size:13px;line-height:1.25;color:var(--mut)}.bd svg{display:block;width:58px;height:66px;margin:0 auto 5px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}.bd b{display:block;font:800 19px var(--disp);color:var(--ink)}.bd:not(.on) svg{opacity:.5}.bd:not(.on) b{color:var(--mut)}

/* game sheet */
dialog{border:0;padding:0;margin:auto;width:min(860px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border-radius:16px;background:#1e1940;color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.7);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(9,6,26,.8)}
dialog[open]{animation:rise .24s cubic-bezier(.2,.9,.3,1.12)}@keyframes rise{from{transform:translateY(46px);opacity:.3}}
.sh{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);gap:22px;padding:24px}
.sh .g{width:100%;padding:27px 13px 15px;align-self:start;transition:none;cursor:default;background-size:100% 22px,100% 100%,100% 100%}.sh .g:active{transform:none}.sh .lbl em{display:none}.sh .lbl b{display:none}
.sh .slot{height:13px;margin:0 -8px;border-radius:0 0 7px 7px;background:linear-gradient(#0a0914,#2d2a3c);position:relative;z-index:1}
.insert .g{animation:ins .4s cubic-bezier(.5,0,.8,.5) forwards}@keyframes ins{to{transform:translateY(62%) scale(.96);opacity:.9}}
.sh h2{font-size:clamp(42px,6vw,60px);margin:0 42px 6px 0}
.facts{margin:0 0 12px;padding:0;list-style:none;color:var(--sun);font-weight:700}.facts li{line-height:1.3}
.blurb{margin:0 0 15px;color:#e7e1f5;line-height:1.48;max-width:60ch}
.sts{display:flex;gap:7px;margin:0 0 15px}.sts div{flex:1;min-width:0;border-radius:8px;background:rgba(255,255,255,.075);padding:7px 9px;font-size:12.5px;color:var(--mut)}.sts b{display:block;font:800 22px/1.05 var(--disp);color:var(--ink);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}.tags button{min-height:34px;border:0;border-radius:6px;background:rgba(255,255,255,.1);padding:0 10px;font-weight:600;font-size:14px;cursor:pointer}
.x{position:absolute;right:11px;top:11px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.1);cursor:pointer;z-index:2}.x svg{width:18px;height:18px;display:block;margin:auto}
.sim{padding:0 24px 22px}.sim h3{font-size:24px;margin-bottom:10px}.sim div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.sim button{padding:0;border:0;background:none;text-align:left;cursor:pointer;font:700 14px/1.2 var(--body)}.sim img{display:block;width:100%;aspect-ratio:16/9;border-radius:5px;margin-bottom:4px;object-fit:cover}
@media (min-width:900px) and (max-height:900px){.top{padding-top:12px}.sign{font-size:64px}.den{grid-template-columns:470px minmax(0,1fr);margin-top:10px}.save{margin-top:6px}.note{margin-top:12px}.ctl{margin-top:12px}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function blurb(g){const n=NEWS.find(x=>x.includes('<b>'+g.n+'</b>')&&/^(New: )?<b>/.test(x)&&x.split('</b>')[1].length>30);if(!n)return'';let t=n.replace(/^New: /,'').split('</b>').slice(1).join('</b>').replace(/<[^>]+>/g,'').replace(/^[,:\s]+/,'').replace(/^(a|an|the) /i,m=>m);return t[0].toUpperCase()+t.slice(1).replace(/\.?$/,'.');}

  const sim=pool().filter(x=>x!==g&&x.c.some(c=>c===home(g))).sort((a,b)=>(hub.plays[a.id]||0)-(hub.plays[b.id]||0)).slice(0,4);
  S.className='';S.innerHTML=`<div class="sh"><button class="x" data-close="1" aria-label="Close">${'<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3l12 12M15 3L3 15"/></svg>'}</button><div><span class="g" style="--p:${PLASTIC[home(g)]}">${g.c.includes('3d')?'<i class="d3">3D</i>':''}<span class="lbl"><img src="${art(id)}" alt=""></span></span><div class="slot"></div></div><div><h2>${esc(g.n)}</h2><ul class="facts">${g.d.split(' · ').map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${blurb(g)?`<p class="blurb">${esc(blurb(g))}</p>`:''}<div class="sts"><div><b>${p}</b>${p===1?'play':'plays'}</div><div><b>${t?fmtT(t):'0'}</b>played</div><div><b>${l?ago(l):'Never'}</b>last played</div></div><div class="acts"><button class="play" id="shPlay">Play</button><button class="ghost" id="shFav" aria-pressed="${fav}">${fav?'Remove favorite':'Add favorite'}</button></div><div class="tags">${g.c.filter(c=>CATS.some(k=>k[0]===c)).map(c=>`<button data-tag="${c}">More ${esc(CATS.find(k=>k[0]===c)[1])}</button>`).join('')}</div></div></div>${sim.length?`<div class="sim"><h3>You might also like</h3><div>${sim.map(x=>`<button data-sim="${x.id}"><img src="${art(x.id)}" alt="">${esc(x.n)}</button>`).join('')}</div></div>`:''}`;
  if(!S.open)S.showModal();S.scrollTop=0;
  $('shPlay').onclick=()=>{if(still)return location.href=id+'.html';S.classList.add('insert');setTimeout(()=>{location.href=id+'.html';},400);};
  $('shFav').onclick=()=>{toggleFav(id);openSheet(id,1);};}
function toggleFav(id){const i=hub.fav.indexOf(id);if(i>=0)hub.fav.splice(i,1);else hub.fav.push(id);saveHub();render();}

async function saveExtras(){const c=await caches.open("mygames-files");const have=new Set((await c.keys()).map(r=>{const u=new URL(r.url);return u.pathname.replace(/^.*?\/(music|assets)\//,"$1/")+u.search;}));
  const todo=EXTRA.filter(([u,h])=>!have.has(u+"?v="+h));const tot=EXTRA.length;let done=tot-todo.length;
  const show=()=>{st.textContent=done>=tot?"Everything is saved for offline play.":"Saving music and 3D games for offline: "+done+" of "+tot+" files. Keep this page open.";$("meter").style.width=(100*done/tot)+"%";$("saveRow").classList.toggle("done",done>=tot);};show();
  if(!todo.length||!navigator.onLine)return;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  for(const [u,h] of todo){try{const r=await fetch(u+"?v="+h+"&dl=1",{cache:"no-store"});if(!r.ok)continue;await c.put(u+"?v="+h,r);
    for(const k of await c.keys(new Request(u),{ignoreSearch:true})){if(!k.url.endsWith("?v="+h))await c.delete(k);}done++;show();}catch(e){if(!navigator.onLine)break;}}show();}
