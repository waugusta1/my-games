<style>

omjar": "<defs><linearGradient id=\"gbj\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff1f4\"/><stop offset=\"1\" stop-color=\"#ffd4e0\"/></linearGradient></defs><rect width=\"160\" height=\"90\" fill=\"url(#gbj)\"/><path d=\"M52 14 h56 v8 q8 4 8 14 v40 q0 10 -10 10 h-52 q-10 0 -10 -10 v-40 q0 -10 8 -14z\" fill=\"#e6f6ff\" stroke=\"#8ab4cc\" stroke-width=\"2.5\"/><circle cx=\"75.2\" cy=\"70.0\" r=\"6.0\" fill=\"#ff7aa8\"/><circle cx=\"70.2\" cy=\"76.8\" r=\"6.0\" fill=\"#ff7aa8\"/><circle cx=\"62.2\" cy=\"74.2\" r=\"6.0\" fill=\"#ff7aa8\"/><circle cx=\"62.2\" cy=\"65.8\" r=\"6.0\" fill=\"#ff7aa8\"/><circle cx=\"70.2\" cy=\"63.2\" r=\"6.0\" fill=\"#ff7aa8\"/><circle cx=\"68\" cy=\"70\" r=\"4.2\" fill=\"#ffe36a\"/><circle cx=\"101.4\" cy=\"68.0\" r=\"7.0\" fill=\"#b48aff\"/><circle cx=\"95.6\" cy=\"76.0\" r=\"7.0\" fill=\"#b48aff\"/><circle cx=\"86.2\" cy=\"72.9\" r=\"7.0\" fill=\"#b48aff\"/><circle cx=\"86.2\" cy=\"63.1\" r=\"7.0\" fill=\"#b48aff\"/><circle cx=\"95.6\" cy=\"60.0\" r=\"7.0\" fill=\"#b48aff\"/><circle cx=\"93\" cy=\"68\" r=\"4.9\" fill=\"#ffe36a\"/><circle cx=\"86.0\" cy=\"50.0\" r=\"5.0\" fill=\"#ffa94a\"/><circle cx=\"81.9\" cy=\"55.7\" r=\"5.0\" fill=\"#ffa94a\"/><circle cx=\"75.1\" cy=\"53.5\" r=\"5.0\" fill=\"#ffa94a\"/><circle cx=\"75.1\" cy=\"46.5\" r=\"5.0\" fill=\"#ffa94a\"/><circle cx=\"81.9\" cy=\"44.3\" r=\"5.0\" fill=\"#ffa94a\"/><circle cx=\"80\" cy=\"50\" r=\"3.5\" fill=\"#ffe36a\"/><circle cx=\"102.8\" cy=\"46.0\" r=\"4.0\" fill=\"#6ac6ff\"/><circle cx=\"99.5\" cy=\"50.6\" r=\"4.0\" fill=\"#6ac6ff\"/><circle cx=\"94.1\" cy=\"48.8\" r=\"4.0\" fill=\"#6ac6ff\"/><circle cx=\"94.1\" cy=\"43.2\" r=\"4.0\" fill=\"#6ac6ff\"/><circle cx=\"99.5\" cy=\"41.4\" r=\"4.0\" fill=\"#6ac6ff\"/><circle cx=\"98\" cy=\"46\" r=\"2.8\" fill=\"#ffe36a\"/>", "tinygreens": "<defs><linearGradient id=\"gtg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#8fdc6a\"/><stop offset=\"1\" stop-color=\"#3f9a3a\"/></linearGradient></defs><rect width=\"160\" height=\"90\" fill=\"url(#gtg)\"/><ellipse cx=\"80\" cy=\"56\" rx=\"62\" ry=\"24\" fill=\"#6fcf5a\" stroke=\"#2f7a2a\" stroke-width=\"2\"/><ellipse cx=\"110\" cy=\"58\" rx=\"7\" ry=\"3.5\" fill=\"#1a2a1a\"/><path d=\"M110 58 V18\" stroke=\"#fff\" stroke-width=\"2\"/><path d=\"M110 18 l18 6 l-18 6z\" fill=\"#ff4a5a\"/><circle cx=\"50\" cy=\"62\" r=\"5\" fill=\"#fff\" stroke=\"#ccc\"/><path d=\"M56 60 Q80 48 102 56\" stroke=\"#fff\" stroke-dasharray=\"3 4\" stroke-width=\"1.5\" fill=\"none\"/>"};const CATS=[["all", "All"], ["fav", "\u2605 Favorites"], ["new", "New"], ["3d", "3D"], ["party", "2 players"], ["sports", "Sports"], ["racing", "Racing"], ["horror", "Horror"], ["action", "Action"], ["arcade", "Arcade"], ["puzzle", "Puzzle"], ["chill", "Chill"]];
let hub={};try{hub=JSON.parse(localStorage.getItem('mg_hub')||'{}')||{};}catch(e){}hub.plays=hub.plays||{};hub.last=hub.last||{};hub.time=hub.time||{};hub.fav=hub.fav||[];
const saveHub=()=>{try{localStorage.setItem('mg_hub',JSON.stringify(hub));}catch(e){}};
let cat=sessionStorage.getItem('mg_cat')||'all',q='';
const fmtT=s=>s<60?Math.round(s)+'s':s<3600?Math.round(s/60)+' min':(s/3600).toFixed(1)+' h';
const ago=t=>{const d=(Date.now()-t)/1000;return d<120?'just now':d<3600?Math.round(d/60)+' min ago':d<86400?Math.round(d/3600)+' h ago':Math.round(d/86400)+' d ago';};
function card(g,extra){const fav=hub.fav.includes(g.id);const p=hub.plays[g.id]||0;return`<a class="g" href="${g.id}.html"><svg class="logo" viewBox="0 0 160 90" aria-hidden="true">${LOGO[g.id]}</svg>${g.new&&!p?'<em class="new">NEW</em>':''}<button class="fav${fav?' on':''}" data-f="${g.id}" aria-label="Favorite">${fav?'★':'☆'}</button><b>${g.n}</b><span>${g.d}</span>${extra?'<i>'+extra+'</i>':p?'<i>Played '+p+'× · '+fmtT(hub.time[g.id]||0)+'</i>':''}</a>`;}
function render(){const m=document.getElementById('main');let h='';const ql=q.trim().toLowerCase();
  document.getElementById('cats').innerHTML=CATS.map(([k,n])=>`<button class="cat${cat===k?' on':''}" data-c="${k}">${n}</button>`).join('');
  if(!ql&&cat==='all'){const recent=Object.entries(hub.last).sort((a,b)=>b[1]-a[1]).map(e=>GAMES.find(g=>g.id===e[0])).filter(Boolean).slice(0,8);
    const day=Math.floor(Date.now()/864e5);const gd=GAMES[(day*7919)%GAMES.length];
    h+=`<h2>Game of the day</h2><a class="feat" href="${gd.id}.html"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice">${LOGO[gd.id]}</svg><div><small>Today's pick</small><h3>${gd.n}</h3><p>${gd.d}</p></div></a>`;
    if(recent.length)h+=`<h2>Continue playing</h2><div class="row">${recent.map(g=>card(g,'Last played '+ago(hub.last[g.id]))).join('')}</div>`;
    const favs=GAMES.filter(g=>hub.fav.includes(g.id));if(favs.length)h+=`<h2>★ Favorites</h2><div class="row">${favs.map(g=>card(g)).join('')}</div>`;
    const nw=GAMES.filter(g=>g.new);h+=`<h2>New games</h2><div class="grid">${nw.map(g=>card(g)).join('')}</div>`;
    for(const[k,n,]of[['3d','3D games'],['party','Play together (same iPad)']]){h+=`<h2>${n}</h2><div class="grid">${GAMES.filter(g=>!g.new&&g.c.includes(k)).map(g=>card(g)).join('')}</div>`;}
    h+=`<h2>More games</h2><div class="grid">${GAMES.filter(g=>!g.new&&!g.c.includes('3d')&&!g.c.includes('party')).map(g=>card(g)).join('')}</div>`;}
  else{const list=GAMES.filter(g=>(cat==='all'||(cat==='fav'?hub.fav.includes(g.id):cat==='new'?g.new:g.c.includes(cat)))&&(!ql||(g.n+' '+g.d+' '+g.c.join(' ')).toLowerCase().includes(ql)));
    h+=`<h2>${list.length} game${list.length===1?'':'s'}</h2>`+(list.length?`<div class="grid">${list.map(g=>card(g)).join('')}</div>`:`<div class="empty">${cat==='fav'?'Tap ☆ on a game to add it here.':'No games match.'}</div>`);}
  m.innerHTML=h;
  const tried=GAMES.filter(g=>hub.plays[g.id]).length,plays=Object.values(hub.plays).reduce((a,b)=>a+b,0),tt=Object.values(hub.time).reduce((a,b)=>a+b,0);
  document.getElementById('me').innerHTML=`<div class="chip"><b>${GAMES.length}</b>games</div><div class="chip"><b>${tried}/${GAMES.length}</b>tried</div><div class="chip"><b>${plays}</b>plays</div><div class="chip"><b>${fmtT(tt)}</b>played</div>`;}
document.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){e.preventDefault();e.stopPropagation();const id=f.dataset.f;const i=hub.fav.indexOf(id);if(i>=0)hub.fav.splice(i,1);else hub.fav.push(id);saveHub();render();return;}
  const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;sessionStorage.setItem('mg_cat',cat);render();}},true);
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render();});
document.getElementById('rnd').onclick=()=>{const pool=GAMES.filter(g=>g.id!==Object.entries(hub.last).sort((a,b)=>b[1]-a[1]).map(e=>e[0])[0]);location.href=pool[Math.floor(Math.random()*pool.length)].id+'.html';};
addEventListener('pageshow',()=>{try{hub=Object.assign(hub,JSON.parse(localStorage.getItem('mg_hub')||'{}'));}catch(e){}render();});
render();
const st=document.getElementById("st");if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>caches.open("mygames-v20")).then(c=>c.keys()).then(k=>{st.textContent=k.length>=GAMES.length?"Ready to play offline. Progress saves on this device.":"Saved "+k.length+" files for offline play.";}).catch(()=>{st.textContent="Offline saving needs this page opened from a website (https).";});}else st.textContent="This browser can't save for offline.";
</script></body></html>
