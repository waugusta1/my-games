:root{--wall:#2a2452;--wall2:#1f1a3e;--ink:#fff6e3;--mut:#c2bbdc;--sun:#ffcf33;--btn:#ff4d3d;--btn2:#b92418;--wood:#dcaa6c;--wood2:#ae7640;--wood3:#7c4e27;--disp:"Big Shoulders Display","Arial Narrow",sans-serif;--body:Barlow,system-ui,-apple-system,sans-serif;--cw:176px;--gut:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--wall2)}
body{margin:0;color:var(--ink);font:500 16px/1.4 var(--body);min-height:100vh;padding:env(safe-area-inset-top) 0 calc(30px + env(safe-area-inset-bottom));overflow-x:hidden}
.room{position:fixed;inset:0;z-index:-1;background:radial-gradient(90vmax 60vmax at 18% -8%,#5a4596 0%,transparent 62%),radial-gradient(70vmax 50vmax at 96% 8%,#7a3f7e 0%,transparent 60%),linear-gradient(180deg,var(--wall),var(--wall2))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;line-height:1}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gut)}

/* the sign and plaques on the wall */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;padding-top:22px}
.sign{font-size:clamp(60px,9vw,92px);color:#fff8ee;letter-spacing:.015em;text-shadow:0 0 4px #fff,0 0 14px #ff8fd0,0 0 34px #ff4fb0,0 0 70px rgba(255,79,176,.55)}
.plaques{display:flex;gap:10px;flex-wrap:wrap}
.plaque{min-width:82px;padding:7px 12px 8px;border-radius:5px;background:linear-gradient(160deg,#f2d27e,#c8963d 55%,#e7c56c);color:#3d2708;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 5px 11px rgba(0,0,0,.42);font-size:13px;line-height:1.15;font-weight:600}
.plaque b{display:block;font:800 25px/1 var(--disp)}
.save{display:flex;align-items:center;gap:9px;margin:12px 0 0;font-size:14px;color:var(--mut);min-height:20px}
.lamp{flex:none;width:10px;height:10px;border-radius:50%;background:#ffb627;box-shadow:0 0 9px #ffb627}.save.done .lamp{background:#57f08e;box-shadow:0 0 9px #57f08e}
.meter{flex:0 1 150px;height:6px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden}.meter i{display:block;height:100%;width:0;background:#ffb627}.save.done .meter{display:none}

/* TV on its console */
.den{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(18px,3.4vw,44px);align-items:center;margin-top:20px}
.tvbase{position:relative;padding-bottom:30px}
.tv{position:relative;z-index:1;padding:13px 13px 32px;border-radius:18px;background:linear-gradient(170deg,#4e4c5c,#26252f 60%,#1a1921);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 -2px 0 rgba(0,0,0,.5) inset,0 16px 26px rgba(0,0,0,.5)}
.glass{position:relative;display:block;aspect-ratio:16/9;border-radius:11px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #0a0a0f,0 0 40px rgba(170,190,255,.25);cursor:pointer;width:100%;padding:0;border:0}
.glass img{display:block;width:100%;height:100%;object-fit:cover}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18) 0,rgba(255,255,255,.05) 26%,transparent 27%),repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.45));pointer-events:none}
.glass canvas{position:absolute;inset:0;width:100%;height:100%;display:none}.glass.static canvas{display:block}
.glass.on::before{content:"";position:absolute;inset:0;z-index:2;background:#fff;animation:flash .38s ease-in forwards}@keyframes flash{0%{opacity:0}100%{opacity:1}}
.tvled{position:absolute;right:20px;bottom:11px;width:8px;height:8px;border-radius:50%;background:#59ff91;box-shadow:0 0 9px #59ff91}
.tvmark{position:absolute;left:20px;bottom:8px;font:800 14px var(--disp);letter-spacing:.09em;color:#a6a4b8}
.console{position:absolute;left:-22px;right:-22px;bottom:0;height:42px;border-radius:4px;background:linear-gradient(180deg,var(--wood) 0 11px,var(--wood2) 11px,var(--wood3));box-shadow:0 16px 24px rgba(0,0,0,.42)}
.pick small{display:block;color:var(--sun);font:700 17px var(--body)}
.pick h2{font-size:clamp(44px,6.2vw,74px);margin:3px 0 8px}
.pick p{margin:0 0 15px;color:#e7e1f5;max-width:36ch}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.play{border:0;border-radius:13px;padding:13px 26px 15px;min-height:50px;background:var(--btn);color:#fff;font:800 24px/1 var(--disp);letter-spacing:.03em;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 5px 0 var(--btn2),0 10px 15px rgba(0,0,0,.35)}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 1px 0 var(--btn2)}
.ghost{border:2px solid rgba(255,246,227,.34);background:rgba(255,255,255,.05);border-radius:13px;padding:10px 16px;min-height:50px;font-weight:700;cursor:pointer}
.ghost:active{background:rgba(255,255,255,.17)}

/* latest arrival note */
.note{margin-top:20px;background:#fff2a8;color:#3b2f10;border-radius:3px;padding:11px 15px 12px;box-shadow:0 8px 14px rgba(0,0,0,.34);transform:rotate(-.25deg);font-weight:500}
.note summary{cursor:pointer;list-style:none;font-size:15px}.note summary::-webkit-details-marker{display:none}
.note summary u{font-weight:700;white-space:nowrap}
.note ul{margin:9px 0 2px;padding:9px 0 0 18px;border-top:1px dashed rgba(59,47,16,.42);max-height:300px;overflow:auto;font-size:15px}.note li{margin-bottom:6px}

/* search strip */
.ctl{position:sticky;top:0;z-index:5;margin:18px calc(var(--gut) * -1) 0;padding:calc(8px + env(safe-area-inset-top)) var(--gut) 8px;background:rgba(31,26,62,.97);box-shadow:0 7px 12px rgba(0,0,0,.28)}
.bar{display:flex;gap:8px}
#q{flex:1;min-width:0;height:46px;padding:0 15px;border-radius:11px;border:2px solid rgba(255,255,255,.18);background:#15112f;outline-offset:0;font-size:17px}#q::placeholder{color:#a79fc8}
#sort{height:46px;max-width:140px;padding:0 9px;border-radius:11px;border:2px solid rgba(255,255,255,.18);background:#15112f;font-weight:600}

.cat{flex:none;min-height:38px;display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--mut);font-weight:700;padding:0 12px;border-radius:8px;cursor:pointer}.cat.on{background:var(--sun);color:#2b1f00}.cat svg{width:15px;height:15px}

/* shelves */
.shelf{margin-top:26px;--led:255,190,110;content-visibility:auto;contain-intrinsic-size:auto 300px}
.shelf>h3{font-size:31px;margin:0 var(--gut) 3px;max-width:1200px}.shelf>h3 span{margin-left:7px;font:600 15px var(--body);color:var(--mut)}
.row{display:flex;gap:15px;overflow-x:auto;padding:15px var(--gut) 0;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:var(--gut);background:radial-gradient(70% 90% at 50% 112%,rgba(var(--led),.5),transparent 70%)}.row::-webkit-scrollbar{display:none}
.plank{position:relative;height:30px;background:linear-gradient(180deg,var(--wood) 0 11px,var(--wood2) 11px,var(--wood3));box-shadow:0 13px 20px rgba(0,0,0,.42),0 -1px 0 rgba(255,255,255,.28) inset}
.plank::after{content:"";position:absolute;left:0;right:0;top:11px;height:3px;background:rgba(var(--led),.85);box-shadow:0 0 11px rgba(var(--led),.85)}
.stack{padding:0}.stack .row{overflow:visible;flex-wrap:nowrap}

/* cartridge */
.g{--p:#555;position:relative;flex:none;display:block;width:var(--cw);padding:17px 8px 11px;border-radius:9px 9px 3px 3px;background-color:var(--p);background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 2px,rgba(255,255,255,.14) 2px 3px,transparent 3px 5px),linear-gradient(90deg,rgba(255,255,255,.2),transparent 11%,transparent 88%,rgba(0,0,0,.28)),linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22));background-size:100% 13px,100% 100%,100% 100%;background-repeat:no-repeat;color:inherit;text-decoration:none;scroll-snap-align:start;box-shadow:0 1px 0 rgba(255,255,255,.34) inset,0 7px 8px -2px rgba(0,0,0,.55);transition:transform .14s}
.g:active{transform:translateY(-9px)}@media (hover:hover){.g:hover{transform:translateY(-7px)}}
.lbl{display:block;border-radius:4px;overflow:hidden;background:#17142b;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 0 1px rgba(255,255,255,.17)}
.lbl img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.lbl b{display:block;padding:6px 8px 0;font:800 20px/1.04 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl em{display:block;padding:1px 8px 7px;font:500 12.5px/1.25 var(--body);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{position:absolute;right:0;top:0;width:46px;height:44px;border:0;background:none;padding:0 5px 25px 22px;cursor:pointer;color:rgba(255,255,255,.72)}.fav svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}.fav.on{color:var(--sun)}
.new{position:absolute;left:-8px;top:-13px;width:38px;height:38px;display:grid;place-items:center;background:var(--sun);color:#3a2300;font:800 13.5px var(--disp);transform:rotate(-12deg);clip-path:polygon(50% 0,61% 13%,76% 7%,80% 23%,96% 26%,91% 42%,100% 53%,89% 64%,93% 80%,77% 82%,70% 97%,55% 90%,41% 99%,32% 85%,15% 87%,14% 70%,1% 61%,9% 46%,2% 30%,18% 24%,24% 8%,39% 13%)}
.d3{position:absolute;left:10px;top:1px;font:800 12.5px var(--disp);letter-spacing:.06em;color:rgba(255,255,255,.88);background:var(--p);padding:0 4px;line-height:14px}
.g .new~.d3{left:40px}
.empty{padding:18px var(--gut) 8px;color:var(--mut)}.empty button{margin-left:8px}

/* trophy shelf */
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px var(--gut) 12px;max-width:1240px;margin:0 auto}
.bd{text-align:center;font-size:13px;line-height:1.25;color:var(--mut)}.bd svg{display:block;width:58px;height:66px;margin:0 auto 5px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}.bd b{display:block;font:800 19px var(--disp);color:var(--ink)}.bd:not(.on) svg{opacity:.5}.bd:not(.on) b{color:var(--mut)}

/* game sheet */
dialog{border:0;padding:0;margin:auto;width:min(860px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border-radius:16px;background:#1e1940;color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.7);overflow:auto;overscroll-behavior:contain}

dialog[open]{animation:rise .24s cubic-bezier(.2,.9,.3,1.12)}@keyframes rise{from{transform:translateY(46px);opacity:.3}}
.sh{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);gap:22px;padding:24px}
.sh .g{width:100%;padding:27px 13px 15px;align-self:start;transition:none;cursor:default;background-size:100% 22px,100% 100%,100% 100%}.sh .g:active{transform:none}.sh .lbl em{display:none}.sh .lbl b{display:none}
.sh .slot{height:13px;margin:0 -8px;border-radius:0 0 7px 7px;background:linear-gradient(#0a0914,#2d2a3c);position:relative;z-index:1}
.insert .g{animation:ins .4s cubic-bezier(.5,0,.8,.5) forwards}@keyframes ins{to{transform:translateY(62%) scale(.96);opacity:.9}}
.sh h2{font-size:clamp(42px,6vw,60px);margin:0 42px 6px 0}
.facts{margin:0 0 12px;padding:0;list-style:none;color:var(--sun);font-weight:700}.facts li{line-height:1.3}
.blurb{margin:0 0 15px;color:#e7e1f5;line-height:1.48;max-width:60ch}
.sts{display:flex;gap:7px;margin:0 0 15px}.sts div{flex:1;min-width:0;border-radius:8px;background:rgba(255,255,255,.075);padding:7px 9px;font-size:12.5px;color:var(--mut)}.sts b{display:block;font:800 22px/1.05 var(--disp);color:var(--ink);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}.tags button{min-height:34px;border:0;border-radius:6px;background:rgba(255,255,255,.1);padding:0 10px;font-weight:600;font-size:14px;cursor:pointer}
.x{position:absolute;right:11px;top:11px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.1);cursor:pointer;z-index:2}.x svg{width:18px;height:18px;display:block;margin:auto}
.sim{padding:0 24px 22px}.sim h3{font-size:24px;margin-bottom:10px}.sim div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.sim button{padding:0;border:0;background:none;text-align:left;cursor:pointer;font:700 14px/1.2 var(--body)}.sim img{display:block;width:100%;aspect-ratio:16/9;border-radius:5px;margin-bottom:4px;object-fit:cover}
/* my stats */
button.plaque{border:0;cursor:pointer;font-family:var(--body);text-align:left;min-height:44px}button.plaque:active{transform:translateY(2px)}
.ms{padding:24px}.ms h2{font-size:clamp(38px,6vw,54px);margin:0 48px 4px 0}.ms>p{margin:0 0 16px;color:var(--mut);max-width:62ch}
.ms h3{font-size:25px;margin:20px 0 3px}.ms h3+small{display:block;color:var(--mut);font-size:13.5px;margin-bottom:9px}
.mt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mt div{border-radius:8px;background:rgba(255,255,255,.075);padding:9px 11px;font-size:13px;color:var(--mut)}.mt b{display:block;font:800 26px/1.05 var(--disp);color:var(--ink)}
.mb{display:grid;grid-template-columns:minmax(92px,150px) minmax(0,1fr) auto;gap:3px 10px;align-items:center;font-size:14px}.mb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mb i{display:block;height:10px;border-radius:0 4px 4px 0;background:var(--sun);min-width:3px}.mb em{font-style:normal;color:var(--mut);font-size:12.5px;white-space:nowrap}
.ml{margin:0;padding:0;list-style:none}.ml li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:14.5px}.ml li:first-child{border-top:0}.ml small{display:block;color:var(--mut);font-size:13px}.ml b{font-weight:700}.ml span:last-child{flex:none;text-align:right;color:var(--mut);font-size:13px}
.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.mno{color:var(--mut);font-size:14px;margin:0;padding:6px 0}
.ms .acts{margin-top:22px}.ms .play{text-decoration:none;display:inline-block}.skill{margin:-6px 0 15px;font-size:14px;color:#e7e1f5}.skill b{color:var(--sun)}
@media (max-width:640px){.ms{padding:18px 16px}.mc{grid-template-columns:1fr}.mt b{font-size:21px}}
/* game badges */
.bgh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px var(--gut) 14px;max-width:1240px;margin:0 auto}.bgh .bgm{flex:1 1 220px;height:8px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden}.bgh .bgm i{display:block;height:100%;background:var(--sun);border-radius:0 4px 4px 0}
.bgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;padding:0 var(--gut) 14px;max-width:1240px;margin:0 auto}
.gb{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.065);font-size:13px;line-height:1.25;color:var(--mut)}.gb svg{flex:none;width:46px;height:50px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}.gb div{min-width:0;flex:1}.gb b{display:block;color:var(--ink);font:800 17px/1.1 var(--disp);letter-spacing:.01em}.gb u{display:block;text-decoration:none;font-size:11.5px;color:var(--sun);font-weight:700;margin-bottom:1px}.gb s{display:block;height:4px;margin-top:5px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden;text-decoration:none}.gb s i{display:block;height:100%;background:var(--sun)}.gb em{font-style:normal;color:var(--sun);font-weight:700}.gb.off svg{filter:grayscale(1) brightness(.72)}.gb.off b{color:#d7d1ea}
.bgf{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}.bgf button{min-height:44px;padding:0 14px;border:0;border-radius:8px;background:rgba(255,255,255,.1);font-weight:700;cursor:pointer}.bgf button.on{background:var(--sun);color:#2a1d00}
.bgg{display:flex;align-items:center;gap:10px;margin:18px 0 8px}.bgg img{width:64px;aspect-ratio:16/9;border-radius:4px;object-fit:cover}.bgg h3{font-size:24px;margin:0}.bgg span{color:var(--mut);font-size:13px;margin-left:auto}
.bgl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.shb{padding:0 24px 20px}.shb h3{font-size:24px;margin-bottom:10px}
.btoast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 32px);width:max-content;padding:6px 6px 6px 8px;border-radius:12px;background:#fff2a8;color:#3b2f10;box-shadow:0 12px 28px rgba(0,0,0,.55);animation:rise .3s}.btoast button{min-height:44px;border:0;background:none;color:inherit;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:9px;text-align:left}.btoast svg{width:34px;height:37px;flex:none}.btoast .bx svg{width:16px;height:16px}.btoast .bx{width:44px;justify-content:center}
@media (max-width:640px){.bgl{grid-template-columns:1fr}.shb{padding:0 16px 18px}}
/* the den comes alive */
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.room::after{content:"";position:absolute;inset:0;background:var(--tint,transparent)}
html[data-tod=morning]{--tint:linear-gradient(180deg,rgba(255,170,110,.2),transparent 55%)}html[data-tod=day]{--tint:linear-gradient(180deg,rgba(120,190,255,.16),transparent 55%)}html[data-tod=dusk]{--tint:linear-gradient(180deg,rgba(255,105,80,.24),transparent 60%)}html[data-tod=night]{--tint:linear-gradient(180deg,rgba(15,20,70,.34),transparent 70%)}
.sign{animation:poweron 1.2s steps(1) both}.sign span{animation:flick 9s linear infinite}
@keyframes poweron{0%{opacity:.12}12%{opacity:1}20%{opacity:.2}34%{opacity:.95}42%{opacity:.35}58%,100%{opacity:1}}
@keyframes flick{0%,91%,93.5%,96%,100%{opacity:1}92%,95%{opacity:.28}}
.pc{--pct:0;display:flex;align-items:center;gap:11px;padding:7px 15px 7px 8px;border-radius:40px;background:rgba(10,7,30,.55);box-shadow:0 0 0 1px rgba(255,255,255,.13) inset;min-width:0;border:0;color:inherit;cursor:pointer;text-align:left;font-family:var(--body);min-height:58px}
.pc .ring{flex:none;position:relative;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--pct)*1%),rgba(255,255,255,.14) 0)}.pc .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#191436}.pc .ring b{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font:800 21px var(--disp);color:var(--sun)}
.pc strong{display:block;font:800 21px/1.05 var(--disp);letter-spacing:.02em;white-space:nowrap}.pc small{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap}.pc.up .ring{animation:lvup 1s 3}@keyframes lvup{50%{transform:scale(1.16)}}
.top{align-items:center}
.osd{position:absolute;right:13px;top:9px;z-index:3;font:700 clamp(15px,2vw,21px)/1 ui-monospace,Menlo,Consolas,monospace;color:#7dffa0;text-shadow:0 0 7px #2bff6d;letter-spacing:.04em;pointer-events:none}
.roll{position:absolute;left:0;right:0;top:0;height:22%;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,255,255,.07) 55%,transparent);animation:roll 6.5s linear infinite}@keyframes roll{from{transform:translateY(-110%)}to{transform:translateY(460%)}}
.tvled{animation:ledp 3s ease-in-out infinite}@keyframes ledp{50%{opacity:.45}}

.plank::after{animation:ledp 5s ease-in-out infinite}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);opacity:0}.g:active::after{opacity:1;transform:translateX(120%);transition:transform .45s ease-out}
.sndb{flex:none;width:44px;height:44px;margin:-12px 0 -12px auto;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:var(--mut);cursor:pointer;display:grid;place-items:center}.sndb svg{width:22px;height:22px}.save{min-height:24px}
@media (prefers-reduced-motion:reduce){.led div{padding-left:12px}}
@media (max-width:640px){.pc{order:3;width:100%}.pc strong{font-size:19px}}
@media (min-width:900px) and (max-height:900px){.led{margin-top:12px}}
@media (min-width:900px) and (max-height:900px){.top{padding-top:12px}.sign{font-size:64px}.den{grid-template-columns:470px minmax(0,1fr);margin-top:10px}.save{margin-top:6px}.note{margin-top:12px}.ctl{margin-top:12px}}
@media (max-width:640px){:root{--cw:148px;--gut:16px}.den,.sh{grid-template-columns:1fr}.sign{font-size:62px}.lbl b{font-size:18px}.sim div{grid-template-columns:repeat(2,minmax(0,1fr))}.console{left:-16px;right:-16px}.sh{padding:18px}.sim{padding:0 18px 20px}.sh .g{width:min(78%,300px)}#sort{max-width:112px}}

<script>
const NEWS=["New: <b>Nightwood</b>, a 3D forest survival game: chop wood to keep the campfire alive, craft at the workbench, rescue four lost children and survive the Antler for 99 nights.","New: <b>Black Spur</b>, a 3D zombie train ride: shovel coal to keep the engine moving, loot frontier towns, and hold off the dead at night for 80 km to Fort Mercy.","New: <b>Emberline</b>, a lighthouse deckbuilder: summon defenders onto three floors, ring the bell to fight, and keep the drowned from putting out the Flame across 9 battles and 10 Tides.","New: <b>Clatterkeep</b>, a peg-bounce dungeon RPG: aim and drop orbs through a board of pegs to hit monsters, collect orbs and relics and climb past 3 bosses.","New: <b>Reelwright</b>, a slot machine deckbuilder: add symbols to your reels, make them pay off together and keep up with 12 rising tolls.","New: <b>Gravewick</b>, a survive-the-horde game: walk with your finger while your weapons fire on their own, level up, evolve weapons and beat the boss of each graveyard.","New: <b>Warband</b>, an auto-battler: recruit units, place them on the field, merge three into a stronger one and win 15 rounds across 3 campaigns.","New: <b>Wildbound</b>, a creature taming RPG: explore 8 regions, catch and train 30 creatures, grow them into new forms and beat the Wardens to reach the Summit.","Update: <b>Last Light</b> is much lighter on the iPad: textures now stay compressed in video memory, far fewer triangles are drawn, and the game adjusts its own quality to stay smooth.","Update: <b>Duskspire</b> grows: a new climber, the Gravebinder, who reaps foes with Doom, a new Act VI with the Ember Throne, 68 new cards, 16 relics, 6 potions, 10 events and 7 new Sanctum blessings.","New: <b>Grease Monkey</b>, a garage rush game: pull cars into the bays, send mechanics to each job and grow the shop over 30 days.","New: <b>Quillbound</b>, a word battle RPG: spell words from a grid of letters to fight the creatures of an unfinished book, with gems, relics and 36,000 words.","New: <b>Starlane</b>, a space trading game: fly between 7 stations, buy low and sell high, mine asteroids, hunt pirates and buy bigger ships.","New: <b>Spellfront</b>, a card duel game: play cards into three lanes over six turns and win two of them, against 20 rival mages, then the gauntlet.","New: <b>Gloomdeep</b>, a turn-based dungeon crawler: three classes, twenty floors in four lands, loot, level-up perks and a guardian every fifth floor.","New: <b>Packrat</b>, a backpack battler: fill a bag with weapons, shields and gems that power each other up, then watch it fight. Three heroes and Heat levels.","<b>Big update</b>: a new hub look with rooms, sign colours and titles you unlock by levelling up, plus a Trophy room. <b>Duskspire</b> has a fourth climber, the Stormcaller, with 25 lightning cards. <b>Last Light</b> has 12 new side jobs, including life after the signal. <b>Noodle Rush</b> adds 20 signature bowls and shop ranks. <b>Orbiter</b> adds 12 Tour levels in 2 new sectors.","<b>Duskspire</b> is twice as long: beat the Dusk and climb on through Act IV, The Withered Gardens, and Act V, The Starless Summit. There are 19 new enemies, 2 new bosses, 19 new cards, 9 relics, 6 events and 3 potions","New: <b>Retroburn</b>, a lunar-lander career: 40 missions on the Moon, Mars, Europa, Titan and Io, with cargo runs, rescues and hangar upgrades","New: <b>Cardsharp</b>, a poker roguelike on a riverboat: beat 8 ports of card tables and their captains with trinkets, tricks and charts","<b>Duskspire</b>: playing Ascension more than once in a fight now stacks, upgrading your cards again each time", "New: <b>Runeroll</b>, a dice dungeon-crawler: roll bone dice into your gear, 4 depths, 3 heroes and 5 Heat levels", "New: <b>Forgewright</b>, a blacksmith shop: heat, hammer and quench for 40 days, then forge the King's Blade", "<b>Duskspire</b>: rewards you leave behind now stay on the map, so you can tap the room and claim them later", "New: <b>Keyhole</b>, a turn-based heist puzzle on blueprint paper: 60 jobs, 5 cities, guards, cameras and gadgets", "New: <b>Deuce</b>, a tennis career: swipe to hit, 10 tournaments, 4 Slams and upgrades", "<b>The den</b>: player levels, a marquee, a TV that surfs on its own, next-badge goals, room light that follows the time of day and sound", "<b>Badges</b>: progress you already saved in your games now counts, so badges you had already earned are unlocked", "<b>Badges</b>: every game now has four to earn, bronze to platinum, and they all live in a new Badges section", "<b>My Stats</b>: the hub now shows which games you play most and what is hard or easy for you, and you can send that report to Claude", "<b>Duskspire</b>: fixed the freeze when Blood Oath killed an enemy, and the Healing Draught now works", "<b>Duskspire</b>: 60 new cards, with new commons and uncommons for every hero and more joining the rewards in Acts 2 and 3", "<b>Duskspire</b>: rare cards now show up more the higher you climb, and 14 new rare cards unlock as you slay bosses", "New: <b>Bramblewatch</b>, a hex tactics RPG: lead a woodland company of badgers, hares, mice and owls through four seasons of war on the Old Hedge. 45 battles, fire and ice, talents, a camp to build and 3 endings", "New: <b>Extra Innings</b>, a baseball career: bat and pitch for a small-town club through 6 leagues, train your players, rebuild Harbor Park, and finish the game they stopped in 1958. Home Run Derby too", "New: <b>Sprocket Cup</b>, a robot programming game: stack code blocks, read sensors and pass hidden test tables across 36 missions, with a daily table, an endless gauntlet and an old team notebook to piece together", "New: <b>Thermocline</b>, a submarine command game: listen on sonar, hide under the cold-water layer, line up shots through the periscope. 35 patrols across 6 seas, a mystery in the deep and 3 endings", "New: <b>Squawk</b>, an air traffic control career: land and launch real traffic from a radar scope, from Managua and Bradley to Heathrow and old Kai Tak. 40 shifts, 30 aircraft to log, a daily shift, and a strange target that keeps calling on an old frequency", "New: <b>Verdigris</b>, a long metroidvania: a small lamplighter robot walks a dead clockwork city under a mountain, earning new powers to open old doors. 84 rooms, 6 bosses, 30 lore cards, 3 endings", "<b>Golazo</b> has new physics: real dribbling touches, a ball that rolls and curls properly, kicks that connect with the foot, a net that catches the ball, and keepers who hold it in their hands", "New: <b>Golazo</b>, a 3D soccer career: found a club and climb 4 tiers to the First Division and the Continental Crown, take any of 24 nations through the World Stage, play a friend on one iPad, and fill a 300-sticker album from packs you earn", "Revamped: <b>Duskspire</b> has redrawn heroes and foes, a new look for all 3 acts, a clear Back button on every screen, and a pause menu with Go back to games. Leaving mid-fight now picks up right where you left off", "New: <b>Hearthvale</b>, a medieval town builder: take up 7 royal charters from a lakeside hamlet to a new capital, lay roads, feed the folk through hard winters, grow cottages into patrician houses, answer letters, trade with caravans and raise a cathedral", "<b>Lantern</b> has new creatures, a richer forest and a redrawn hero. <b>Drillbit Depths</b>, <b>Critter Crossing</b> and <b>Sky Hop</b> got new scenery, vehicles and worlds", "The hub is now a shelf of cartridges with a TV, game details and new cover art", "New: <b>Switchback</b>, hill climb driving: race a jeep, dirt bike, dune buggy, monster truck and lunar rover up 6 stages from Meadow Hills to the Moon, grab fuel, pull flips, hit 30 stage goals and tune every vehicle", "New: <b>Silk Road</b>, a mahjong solitaire journey: clear 64 boards across 8 cities from Chang'an to Constantinople, earn stars and merchant seals, race the sands in Caravan, play the Daily Board and collect 6 tile sets", "New: <b>Gambit</b>,   bel:'<svg viewBox="0 0 40 40"><path d="M20 6c-6 0-9 4-9 10v6l-3 5h24l-3-5v-6c0-6-3-10-9-10z" style="fill:var(--mut)"/><circle cx="20" cy="31" r="3.5" style="fill:var(--mut)"/></svg>'};
function dock(){const l=gbAll(),on=l.filter(x=>x.on).length,p=_playerLv(),nr=ROOMS.filter(r=>r[2]<=p.lv).length+SIGNS.filter(s=>s[2]<=p.lv).length,seen=hub.rwSeen||0;
  return`<button class="dk" data-troom="1">${DI.tro}<span><b>Trophy room</b><small>${on} of ${l.length} badges</small></span></button><button class="dk${nr>seen?' hot':''}" data-rew="1">${DI.rew}<span><b>Rewards</b><small>${nr>seen?'New unlock ready':ROOMS.find(r=>r[0]===(hub.room||'den'))[1]}</small></span>${nr>seen?'<i class="dot"></i>':''}</button><button class="dk" data-stats="1">${DI.sts}<span><b>My stats</b><small>hard and easy</small></span></button><button class="dk" data-alerts="1">${DI.bel}<span><b>Alerts</b><small>${hub.push?'on':'off'}</small></span></button>`;}
const _render=render;
render=function(){_render();const me=$('me');const tried=GAMES.filter(g=>hub.plays[g.id]).length,plays=Object.values(hub.plays).reduce((a,b)=>a+b,0),tt=Object.values(hub.time).reduce((a,b)=>a+b,0);
  me.innerHTML=`<div class="plaque"><b>${tried} of ${GAMES.length}</b>games tried</div><div class="plaque"><b>${plays}</b>plays</div><div class="plaque"><b>${fmtT(tt)}</b>played</div>`;
  let d=$('dock');if(!d){d=document.createElement('div');d.id='dock';d.className='dock';document.querySelector('.top').after(d);}d.innerHTML=dock();};
/* trophy room */
let trF='all';
function openTrophy(){const S=$('sheet'),l=gbAll(),games=[...new Set(l.map(x=>x.g))],tot=games.length;
  const tiers=[0,1,2,3].map(i=>({n:l.filter(x=>x.i===i&&x.on).length}));
  const shown=l.filter(x=>x.on).sort((a,b)=>(b.at||0)-(a.at||0)||b.i-a.i).slice(0,14);
  const rows=games.map(g=>{const m=l.filter(x=>x.g===g),n=m.filter(x=>x.on).length,pc=m.reduce((a,x)=>a+(x.on?1:x.pc),0)/4;return{g,m,n,pc};});
  const f=rows.filter(r=>trF==='all'||(trF==='done'?r.n===4:trF==='prog'?r.n>0&&r.n<4:r.n===0)).sort((a,b)=>b.pc-a.pc||a.g.n.localeCompare(b.g.n));
  const ht=badges(),hton=ht.filter(b=>b.on).length;
  S.className='';S.innerHTML=`<div class="tr"><button class="x" data-close="1" aria-label="Close">${AX}</button><h2>Trophy room</h2><p>${l.filter(x=>x.on).length} of ${l.length} badges across ${tot} games. Full sets: ${rows.filter(r=>r.n===4).length}.</p>
  <div class="trt">${tiers.map((t,i)=>`<div>${medal('w',i,t.n>0)}<b>${t.n}</b><small>${TIER[i][0]} of ${tot}</small><i><u style="width:${100*t.n/tot}%"></u></i></div>`).join('')}</div>
  <div class="trh"><h3>Showcase</h3><span>Your newest badges</span></div>${shown.length?`<div class="case">${shown.map(x=>`<button class="ped" data-sh="${x.g.id}">${medal(x.b[2],x.i,true)}<span class="pl"></span><b>${esc(x.b[0])}</b>${esc(x.g.n)}</button>`).join('')}</div>`:'<p class="mno">Earn a badge and it goes on display here.</p>'}
  <div class="trh"><h3>Game cabinets</h3><span>Tap a game to see its badges</span></div>
  <div class="trf">${[['all','All'],['prog','In progress'],['done','Full sets'],['none','Not started']].map(([k,n])=>`<button data-trf="${k}" class="${trF===k?'on':''}" aria-pressed="${trF===k}">${n}</button>`).join('')}<button data-gbs="1">Badge list</button></div>
  ${f.length?`<div class="cabs">${f.map(r=>`<button class="cab${r.n===4?' done':''}" data-sh="${r.g.id}"><img src="${art(r.g.id)}" alt="" loading="lazy"><b>${esc(r.g.n)}</b><span class="md">${r.m.map(x=>medal(x.b[2],x.i,x.on)).join('')}<em>${Math.round(r.pc*100)}%</em></span></button>`).join('')}</div>`:'<p class="mno">Nothing here yet.</p>'}
  <div class="trh"><h3>Hub trophies</h3><span>${hton} of ${ht.length}</span></div><div class="htro">${ht.map((b,i)=>`<div class="bd${b.on?' on':''}">${badgeArt(b.on,i)}<b>${esc(b.n)}</b>${esc(b.d)}</div>`).join('')}</div>
  <div class="acts" style="margin-top:22px"><button class="ghost" data-close="1">Close</button></div></div>`;
  if(!S.open)S.showModal();S.scrollTop=0;}
/* rewards road */
function openRewards(){const S=$('sheet'),p=_playerLv(),lv=p.lv;
  const steps=[];for(let i=1;i<=21;i++){const it=[];ROOMS.filter(r=>r[2]===i).forEach(r=>it.push(['Room',r[1],roomArt(r[0])]));SIGNS.filter(s=>s[2]===i).forEach(s=>it.push(['Sign colour',s[1],`<svg viewBox="0 0 120 58"><rect width="120" height="58" rx="6" fill="#120f22"/><text x="60" y="37" text-anchor="middle" font-family="Arial Narrow,sans-serif" font-weight="800" font-size="20" fill="#fff" style="filter:drop-shadow(0 0 5px ${s[3].startsWith('#')?s[3]:'#fff'})">My Games</text></svg>`]));if(i===1||(i-1)%3===0)it.push(['Title',titleAt(i),'']);if(it.length)steps.push([i,it]);}
  const nr=ROOMS.filter(r=>r[2]<=lv).length+SIGNS.filter(s=>s[2]<=lv).length;hub.rwSeen=nr;saveHub();
  const cur=hub.room||'den',cs=hub.sign||'pink',ti=p.title;
  S.className='';S.innerHTML=`<div class="rw"><button class="x" data-close="1" aria-label="Close">${AX}</button><h2>Rewards</h2><p>Earn badges and play to level up. Each level brings new rooms, sign colours and titles for your hub.</p>
  <div class="lvb" style="--pct:${p.pct}"><span class="ring"><b>${lv}</b></span><span><strong>${esc(ti)}</strong><small>${p.left} of ${p.need} XP to level ${lv+1}. Bronze 10 XP, silver 25, gold 60, platinum 150, and 5 XP per hour played.</small></span></div>
  <div class="trh"><h3>Level road</h3><span>Swipe to see what's next</span></div>
  <div class="road" id="road">${steps.map(([i,it])=>`<div class="stp${i<=lv?' got':''}${i===steps.filter(s=>s[0]<=lv).slice(-1)[0][0]?' now':''}"><b>Level ${i}</b>${it.map(x=>`${x[2]}<div>${x[0]}: <b style="display:inline;font-size:14px">${esc(x[1])}</b></div>`).join('')}${i>lv?`<div style="margin-top:4px">${LOCK.replace('<svg','<svg style="width:12px;height:12px;display:inline;vertical-align:-1px"')} Locked</div>`:''}</div>`).join('')}</div>
  <div class="trh"><h3>Room</h3><span>Changes the whole hub</span></div>
  <div class="pick2">${ROOMS.map(r=>`<button class="opt${cur===r[0]?' on':''}" data-room="${r[0]}" ${r[2]>lv?'disabled':''} aria-pressed="${cur===r[0]}">${roomArt(r[0])}${r[2]>lv?`<span class="lk">${LOCK}</span>`:''}<span>${esc(r[1])}<small>${r[2]>lv?'Unlocks at level '+r[2]:esc(r[3])}</small></span></button>`).join('')}</div>
  <div class="trh"><h3>Sign colour</h3></div>
  <div class="chips">${SIGNS.map(s=>`<button data-sign="${s[0]}" class="${cs===s[0]?'on':''}" ${s[2]>lv?'disabled':''} aria-pressed="${cs===s[0]}"><i style="background:${s[3]}"></i>${esc(s[1])}${s[2]>lv?' · level '+s[2]:''}</button>`).join('')}</div>
  <div class="trh"><h3>Title</h3><span>Shown next to your level</span></div>
  <div class="chips">${TITLES.map((t,i)=>{const need=i*3+1;return`<button data-title="${esc(t)}" class="${ti===t?'on':''}" ${need>lv?'disabled':''} aria-pressed="${ti===t}">${esc(t)}${need>lv?' · level '+need:''}</button>`;}).join('')}</div>
  <div class="acts" style="margin-top:22px"><button class="ghost" data-close="1">Close</button></div></div>`;
  if(!S.open)S.showModal();S.scrollTop=0;const rd=$('road'),nw=rd.querySelector('.now');if(nw)rd.scrollLeft=Math.max(0,nw.offsetLeft-20);}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-troom]')){openTrophy();return;}
  if(e.target.closest('[data-rew]')){openRewards();render();return;}
  const tf=e.target.closest('[data-trf]');if(tf){trF=tf.dataset.trf;openTrophy();return;}
  const sh=e.target.closest('[data-sh]');if(sh){openSheet(sh.dataset.sh);return;}
  const rm=e.target.closest('button[data-room]');if(rm&&!rm.disabled){hub.room=rm.dataset.room;saveHub();applyRoom();const y=$('sheet').scrollTop;openRewards();$('sheet').scrollTop=y;return;}
  const sg=e.target.closest('button[data-sign]');if(sg&&!sg.disabled){hub.sign=sg.dataset.sign;saveHub();applyRoom();const y=$('sheet').scrollTop;openRewards();$('sheet').scrollTop=y;return;}
  const tt=e.target.closest('button[data-title]');if(tt&&!tt.disabled){hub.title=tt.dataset.title;saveHub();renderPC();const y=$('sheet').scrollTop;openRewards();$('sheet').scrollTop=y;return;}},true);
addEventListener('pageshow',()=>{applyRoom();render();});
$('sheet').addEventListener('close',()=>{renderPC();render();});
applyRoom();render();
if(hub.roomNew){delete hub.roomNew;saveHub();setTimeout(()=>{const t=document.createElement('div');t.className='btoast';t.innerHTML=`<button data-rew="1">${DI.rew}<span>New look: the Neon Arcade<br><small>Tap to pick a room, sign colour and title</small></span></button><button class="bx" aria-label="Close">${AX}</button>`;t.querySelector('.bx').onclick=()=>t.remove();t.querySelector('[data-rew]').addEventListener('click',()=>t.remove());document.body.appendChild(t);setTimeout(()=>t.remove(),9000);},700);}
</script></body></html>
