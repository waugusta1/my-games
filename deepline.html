function update(dt){t+=dt;
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;}parts=parts.filter(p=>p.life>0);

      if(R()<dt*8)bubbles.push({x:r.hx+(R()-.5)*6,y:r.hy,v:40+R()*40,life:1.4,ph:R()*6,r:1.5+R()*2});

function render(){ctx.setTransform(dpr,0,0,dpr,0,0);const c0=cam,c1=cam+H;
  // water
  const wtop=Math.max(0,c0),g=ctx.createLinearGradient(0,wtop-c0,0,H);g.addColorStop(0,rgb(waterAt(wtop/PX)));g.addColorStop(1,rgb(waterAt(c1/PX)));ctx.fillStyle=g;ctx.fillRect(0,Math.max(0,-c0),W,H);
  // sky + surface
  if(c0<0){const sy=-c0;const sg=ctx.createLinearGradient(0,0,0,sy);sg.addColorStop(0,'#ff9f6a');sg.addColorStop(.6,'#ffcf8a');sg.addColorStop(1,'#bfe7ff');ctx.fillStyle=sg;ctx.fillRect(0,0,W,sy);
    ctx.fillStyle='rgba(255,240,200,.95)';ctx.beginPath();ctx.arc(W*.78,sy-70,26,0,TAU);ctx.fill();
    // boat
    const bx=W/2,by=sy-4;ctx.fillStyle='#7a3e1e';ctx.beginPath();ctx.moveTo(bx-60,by-14);ctx.lineTo(bx+60,by-14);ctx.lineTo(bx+44,by+8);ctx.lineTo(bx-44,by+8);ctx.closePath();ctx.fill();ctx.fillStyle='#f4efe4';ctx.fillRect(bx-56,by-18,112,5);
    ctx.fillStyle='#2a4a6a';ctx.fillRect(bx-10,by-48,20,30);ctx.fillStyle='#ffd06a';ctx.beginPath();ctx.arc(bx,by-56,9,0,TAU);ctx.fill();
    ctx.strokeStyle='#4a2a14';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx+6,by-40);ctx.lineTo(bx+46,by-82);ctx.stroke();
    // waves
    ctx.fillStyle='rgba(255,255,255,.55)';for(let x=0;x<W;x+=4){const y=sy+Math.sin(x*.05+t*2)*2.5;ctx.fillRect(x,y-1,4,2);}}
  // light rays near surface
  const rayA=clamp(1-Math.max(0,c0)/900,0,1)*.12;if(rayA>0){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<5;i++){const x=(i/5*W+t*12+i*40)%(W+200)-100;const gr=ctx.createLinearGradient(0,-c0,0,-c0+700);gr.addColorStop(0,`rgba(200,240,255,${rayA})`);gr.addColorStop(1,'rgba(200,240,255,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(x,-c0);ctx.lineTo(x+50,-c0);ctx.lineTo(x+170,-c0+700);ctx.lineTo(x+90,-c0+700);ctx.fill();}ctx.restore();}
  // marine snow
  ctx.fillStyle='rgba(220,240,255,.35)';for(const p of snow){const y=((p.y-cam*p.p)%(H*3)+H*3)%(H*3)-H;if(y<Math.max(0,-c0)||y>H)continue;ctx.fillRect(p.x,y,p.s,p.s);}
  // depth marks
  ctx.font='700 11px "Baloo 2",system-ui,sans-serif';ctx.textAlign='left';const m0=Math.max(0,Math.floor(c0/PX/10)*10);for(let m=m0;m*PX<c1;m+=10){const y=m*PX-c0;if(m===0)continue;ctx.fillStyle=m%50===0?'rgba(200,230,255,.45)':'rgba(200,230,255,.18)';ctx.fillRect(0,y,m%50===0?14:7,1);if(m%50===0)ctx.fillText(m+' m',17,y+4);}
  if(run){const r=run,md=maxDepth()*PX;if(md>c0&&md<c1){ctx.fillStyle='rgba(255,180,90,.5)';ctx.setLineDash([6,6]);ctx.fillRect(0,md-c0,W,1);ctx.setLineDash([]);ctx.fillStyle='rgba(255,200,120,.8)';ctx.textAlign='right';ctx.fillText('line ends',W-10,md-c0-6);}
    // fish & jellies
    for(const f of r.fish){const y=f.y-c0;if(y<-80||y>H+80)continue;if(f.jelly){const sp=SPR.jelly,sc=1+Math.sin(f.ph)*.08;ctx.save();ctx.translate(f.x,y);ctx.scale(sc,2-sc);ctx.drawImage(sp.c,-sp.w/2,-sp.h/2+6,sp.w,sp.h);ctx.restore();continue;}
      const sp=SPR[f.s.id];ctx.save();ctx.translate(f.x,y);if(f.caught){ctx.rotate(Math.PI/2*.85);}else{ctx.scale(f.vx<0?-1:1,1);ctx.rotate(Math.sin(f.ph)*.06);}ctx.drawImage(sp.c,-sp.w/2,-sp.h/2,sp.w,sp.h);ctx.restore();}
    // line & hook
    if(state==='play'||state==='tally'){const hy=r.hy-c0,top=-c0-40;ctx.strokeStyle='rgba(240,250,255,.7)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(W/2+46,Math.max(top,-10));ctx.quadraticCurveTo((W/2+r.hx)/2,(hy+top)/2,r.hx,hy-10);ctx.stroke();
      ctx.save();ctx.translate(r.hx,hy);ctx.strokeStyle='#d8dee6';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,4);ctx.arc(-5,4,5,0,Math.PI*.9);ctx.stroke();
      ctx.fillStyle='#ff5a4a';ctx.beginPath();ctx.arc(0,-14,4,0,TAU);ctx.fill();
      if(r.phase==='drop'&&r.shields>0){ctx.strokeStyle='rgba(190,235,255,.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-4,18,0,TAU);ctx.stroke();}
      if(r.stung>0){ctx.fillStyle=`rgba(255,120,200,${r.stung})`;ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.fill();}ctx.restore();}}
  for(const b of bubbles){ctx.strokeStyle=`rgba(220,245,255,${b.life*.5})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y-c0,b.r,0,TAU);ctx.stroke();}
  for(const p of parts){if(p.spr){const sp=SPR[p.spr];ctx.save();ctx.translate(p.x,p.y-c0);p.rot+=p.vr*.016;ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life*2);ctx.drawImage(sp.c,-sp.w/2,-sp.h/2,sp.w,sp.h);ctx.restore();ctx.globalAlpha=1;continue;}
    ctx.globalAlpha=Math.min(1,p.life*2.5);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y-c0,p.s,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  ctx.textAlign='center';for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*2);ctx.font='800 '+(p.newb?18:p.gold?20:14)+'px "Baloo 2",system-ui,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,20,40,.6)';ctx.strokeText(p.txt,p.x,p.y-c0);ctx.fillStyle=p.bad?'#ff9ab0':p.newb?'#7dffb0':p.gold?'#ffd46a':'#fff';ctx.fillText(p.txt,p.x,p.y-c0);}ctx.globalAlpha=1;
  // HUD
  if(run&&state==='play'){const r=run;ctx.textAlign='left';ctx.font='800 30px "Baloo 2",system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(Math.round(r.depth).toLocaleString()+' m',14,40);
    ctx.font='700 13px "Baloo 2",system-ui,sans-serif';ctx.fillStyle='rgba(200,230,255,.8)';ctx.fillText(r.phase==='drop'?(r.xp&&r.hy<r.xp*PX?'Express drop to '+r.xp.toLocaleString()+' m…':'Dodge fish on the way down'):'Catch fish on the way up!',14,58);
    ctx.textAlign='right';ctx.font='800 20px "Baloo 2",system-ui,sans-serif';ctx.fillStyle='#ffd46a';ctx.fillText('🪝 '+r.hooked.length+'/'+capacity(),W-14,36);
    if(r.phase==='drop'&&r.shields>0){ctx.font='700 14px "Baloo 2",system-ui,sans-serif';ctx.fillStyle='#bfe8ff';ctx.fillText('🫧×'+r.shields,W-14,56);}
    // depth bar
    const bh=H*.4,by=H*.3,f=clamp(r.depth/maxDepth(),0,1);ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(W-8,by,4,bh);ctx.fillStyle='#ffb347';ctx.fillRect(W-8,by,4,bh*f);}
  if(state==='tally'&&run){ctx.textAlign='center';ctx.font='800 34px "Baloo 2",system-ui,sans-serif';ctx.fillStyle='#ffd46a';ctx.strokeStyle='rgba(60,30,0,.5)';ctx.lineWidth=5;const s='+'+run.earned;ctx.strokeText(s,W/2,H*.2);ctx.fillText(s,W/2,H*.2);}
}

/* ---------- menus ---------- */
function hideAll(){['title','result','shop','bookOv'].forEach(i=>$(i).hidden=true);}
function updTitle(){$('tCoins').textContent=save.coins;$('tDeep').textContent=save.deep+' m';$('tSpec').textContent=Object.keys(save.seen).length+'/'+SPECIES.length;}
function cast(){audio();hideAll();parts=[];pops=[];newRun();}
$('castBtn').onclick=cast;$('againBtn').onclick=cast;$('shopCast').onclick=cast;
function openShop(){audio();hideAll();renderShop();$('shop').hidden=false;state='menu';}
$('shopBtn').onclick=openShop;$('rShopBtn').onclick=openShop;
$('shopBack').onclick=()=>{hideAll();$('title').hidden=false;updTitle();};
function renderShop(){$('sCoins').textContent=save.coins+' coins';$('shopList').innerHTML=UPG.map(u=>{const l=save.up[u.id],maxed=l>=u.max,c=u.cost(l);
  return'<div class="up"><div class="ic">'+u.icon+'</div><div><div class="nm">'+u.name+' <span style="color:var(--muted);font-size:12px">Lv '+l+'</span></div><div class="ds">'+(maxed?(u.id==='rocket'?'Unlocked! Look for the 🚀 button while fishing.':'Maxed out!'):u.desc(l))+'</div></div><button data-u="'+u.id+'" '+(maxed||save.coins<c?'disabled':'')+'>'+(maxed?(u.id==='rocket'?'✓':'MAX'):c.toLocaleString()+' 🪙')+'</button></div>';}).join('');}
$('shopList').addEventListener('click',e=>{const b=e.target.closest('button[data-u]');if(!b)return;const u=UPG.find(x=>x.id===b.dataset.u),l=save.up[u.id],c=u.cost(l);if(l>=u.max||save.coins<c){SFX.deny();return;}save.coins-=c;save.up[u.id]++;persist();SFX.buy();buzz(15);renderShop();updTitle();});
$('bookBtn').onclick=()=>{audio();hideAll();renderBook();$('bookOv').hidden=false;};
$('bookBack').onclick=()=>{hideAll();$('title').hidden=false;updTitle();};
function renderBook(){const box=$('book');box.innerHTML='';let n=0;for(const s of SPECIES){const seen=!!save.seen[s.id];if(seen)n++;const d=document.createElement('div');d.className='sp';const c=document.createElement('canvas');c.width=192;c.height=112;const g=c.getContext('2d');g.translate(96,56);const sc=Math.min(1.6,30/s.size);g.scale(sc,sc);drawFish(g,s,!seen);
  d.appendChild(c);const tx=document.createElement('div');tx.innerHTML=seen?'<b>'+s.name+'</b>'+s.z[0]+(s.z[1]>1e8?'+':'–'+s.z[1])+' m · '+s.val+' 🪙'+(save.caught[s.id]?' · caught '+save.caught[s.id]:''):'<b>???</b>'+(s.rare?'Rare':'Found below '+s.z[0]+' m');d.appendChild(tx);box.appendChild(d);}
  $('bookInfo').textContent=n+' of '+SPECIES.length+' species found. Deeper lines find stranger fish.';}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);{const show=!!(save.up.rocket&&run&&state==='play'&&!run.rocket&&run.hy>200);const b=$('rocketB');if(b.hidden===show)b.hidden=!show;}
  if(state==='title'||state==='menu'){cam=lerp(cam,-H*.45+Math.sin(t*.4)*20,.05);}
  render();requestAnimationFrame(frame);}
resize();updTitle();cam=-H*.45;requestAnimationFrame(frame);
window.__dl={get s(){return{state,run:run&&{phase:run.phase,depth:run.depth,hooked:run.hooked.length}}},cast,surfaceNow:()=>{if(run){run.phase='reel';run.hy=5;}},give:n=>{save.coins+=n;persist();updTitle();},save};
})();

});</script>
