 if(goal&&Math.hypot(goal.x-F.x,goal.y-F.y)>400){const a=Math.atan2(goal.y-F.y,goal.x-F.x);const ax=W/2+Math.cos(a)*170*s,ay=H/2+Math.sin(a)*170*s;g.save();g.translate(ax,ay);g.rotate(a);g.fillStyle='rgba(42,212,255,.85)';g.beginPath();g.moveTo(16*s,0);g.lineTo(-8*s,-10*s);g.lineTo(-3*s,0);g.lineTo(-8*s,10*s);g.fill();g.restore();g.fillStyle='#bfe8ff';g.font='600 '+(14*s)+'px Arial Narrow';g.textAlign='center';g.fillText(goal.n+' '+Math.round(Math.hypot(goal.x-F.x,goal.y-F.y)/100)/10+'k',ax,ay+26*s);}

 else{g.fillStyle='rgba(122,184,216,.5)';g.font='600 '+(15*s)+'px Arial Narrow';g.textAlign='left';g.fillText('Drag on the left side to fly',220*s,H-30*s);}
 // buttons
 const rb=(b,lbl,on,col)=>{g.save();g.translate(b.x,b.y);g.fillStyle=on?col:'rgba(4,14,26,.7)';g.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU;g.lineTo(Math.cos(a)*b.r,Math.sin(a)*b.r);}g.closePath();g.fill();g.strokeStyle=col;g.lineWidth=2.5;g.stroke();g.fillStyle=on?'#02101a':'#dff4ff';g.font='700 '+(b.r*.36)+'px Arial Narrow';g.textAlign='center';g.textBaseline='middle';g.fillText(lbl,0,1);g.restore();};
 rb(B.fire,'FIRE',BTNS.fire,'#ff8a2a');rb(B.boost,'BOOST',BTNS.boost,'#c8a8ff');
 g.save();for(const[b,k]of[[B.pause,'p'],[B.map,'m']]){g.translate(0,0);g.fillStyle='rgba(4,14,26,.8)';g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fill();g.strokeStyle='#2ad4ff';g.lineWidth=2;g.stroke();g.fillStyle='#dff4ff';if(k==='p'){g.fillRect(b.x-9*s,b.y-11*s,6*s,22*s);g.fillRect(b.x+3*s,b.y-11*s,6*s,22*s);}else{g.strokeStyle='#dff4ff';g.lineWidth=2.4;g.beginPath();g.moveTo(b.x-12*s,b.y-8*s);g.lineTo(b.x-4*s,b.y-12*s);g.lineTo(b.x+4*s,b.y-8*s);g.lineTo(b.x+12*s,b.y-12*s);g.lineTo(b.x+12*s,b.y+8*s);g.lineTo(b.x+4*s,b.y+12*s);g.lineTo(b.x-4*s,b.y+8*s);g.lineTo(b.x-12*s,b.y+12*s);g.closePath();g.stroke();}}g.restore();
 const ns=nearStation();if(ns){const b=B.dock;g.fillStyle='#2ad4ff';g.beginPath();g.moveTo(b.x-b.w/2+14*s,b.y-b.h/2);g.lineTo(b.x+b.w/2,b.y-b.h/2);g.lineTo(b.x+b.w/2-14*s,b.y+b.h/2);g.lineTo(b.x-b.w/2,b.y+b.h/2);g.fill();g.fillStyle='#02101a';g.font='700 '+(24*s)+'px Arial Narrow';g.textAlign='center';g.textBaseline='middle';g.fillText('DOCK AT '+ns.n.toUpperCase(),b.x,b.y+1);}
 if(F.msg>0){g.globalAlpha=clamp(F.msg,0,1);g.fillStyle='#fff';g.font='700 '+(26*s)+'px Arial Narrow';g.textAlign='center';g.shadowColor='#000';g.shadowBlur=10;g.fillText(F.msgT,W/2,150*s);g.shadowBlur=0;g.globalAlpha=1;}
