<meta charset="utf-8">
<title>Bloomstead</title>
<style>
/* Sunny homestead: grass green, warm soil, cream panels, gold coins */
:root{--bg:#8fd3ff;--ink:#2a2014;--cream:#fff8ea;--muted:#7a6a52;--gold:#f0a800;--leaf:#3f9a3a;--line:rgba(90,60,20,.18);color-scheme:light;--f:Fredoka,"Trebuchet MS",system-ui,sans-serif;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--f);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.out{color:#fff;text-shadow:0 2px 0 rgba(40,30,10,.55),0 0 6px rgba(40,30,10,.4)}
#hud{position:fixed;left:10px;top:calc(8px + var(--st));background:rgba(40,30,10,.42);color:#fff;border-radius:14px;padding:5px 12px 6px;pointer-events:none;font-weight:700;line-height:1.15}
#boost{position:fixed;left:10px;top:calc(66px + var(--st));font-weight:700;font-size:13px;line-height:1.4;pointer-events:none;color:#fff3a0}
@media (max-width:760px){#boost{top:calc(104px + var(--st))}}
#hud .c{font-size:22px}#hud .s{font-size:12px;opacity:.92;font-weight:600}
#tele{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + var(--st));display:flex;gap:5px}
.pill{font:700 13px var(--f);border:0;border-radius:12px;background:var(--cream);color:var(--ink);padding:7px 10px;box-shadow:0 3px 0 rgba(90,60,20,.4);cursor:pointer;white-space:nowrap}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,60,20,.4)}
#wx{position:fixed;right:10px;top:calc(8px + var(--st));text-align:right;font-weight:700;pointer-events:none;font-size:15px;max-width:38vw}
#wx .s{font-size:12px;font-weight:600}
#side{position:fixed;right:10px;top:calc(84px + var(--st));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:760px){#tele{top:calc(64px + var(--st))}#side{top:calc(108px + var(--st))}#wx{max-width:46vw}}
#hot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));display:flex;gap:5px;max-width:calc(100% - 210px);overflow-x:auto;padding:5px;background:rgba(40,30,10,.38);border-radius:16px;scrollbar-width:none}
#hot::-webkit-scrollbar{display:none}
#hot button{position:relative;flex:0 0 auto;width:54px;height:54px;border-radius:12px;border:2px solid rgba(255,255,255,.55);background:rgba(255,248,234,.93);font-size:26px;cursor:pointer;padding:0;line-height:1}
#hot button.on{border-color:#ffc800;background:#fff0a0;box-shadow:0 0 0 3px rgba(255,200,0,.5)}
#hot button b{position:absolute;right:3px;bottom:2px;font:700 12px var(--f);color:#2a2014}
#hot .empty{color:#fff;font:600 13px var(--f);padding:8px 10px;white-space:nowrap}
#jump{position:fixed;right:16px;bottom:calc(16px + var(--sb));width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,248,234,.88);font:700 14px var(--f);box-shadow:0 4px 0 rgba(90,60,20,.4);color:var(--ink)}
#collect{position:fixed;right:12px;bottom:calc(104px + var(--sb));border:0;border-radius:16px;padding:10px 14px;font:700 16px var(--f);background:linear-gradient(180deg,#9ae86a,#4ab83a);color:#fff;box-shadow:0 4px 0 #2f8a2a}
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + var(--sb))}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(178px + var(--sb));font-weight:700;pointer-events:none;text-align:center;width:88%;font-size:17px;color:#fff8c0}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);pointer-events:none}
#joy i{position:absolute;left:32px;top:32px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
#mode{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + var(--sb));background:#2a2014;color:#fff;font:700 14px var(--f);padding:7px 14px;border-radius:999px;display:flex;gap:10px;align-items:center;white-space:nowrap;max-width:94vw}
#mode button{font:700 13px var(--f);border:0;border-radius:999px;padding:4px 10px;background:#ff8a6a;color:#fff}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,780px);box-sizing:border-box;max-height:72vh;overflow:auto;background:var(--cream);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:14px 14px calc(14px + var(--sb));z-index:5}
#sheet h3{margin:0 0 4px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
#sheet .x{background:none;border:0;font:700 26px var(--f);color:var(--muted);cursor:pointer}
.sub{color:var(--muted);font-size:14px;font-weight:600;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{border:2px solid var(--line);border-radius:16px;padding:8px 10px;background:#fff;display:flex;flex-direction:column;gap:3px}
.card .t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}.card .d{font-size:12px;color:var(--muted);font-weight:600}
.card button{font:700 14px var(--f);border:0;border-radius:12px;padding:7px 8px;background:linear-gradient(180deg,#9ae86a,#4ab83a);color:#fff;cursor:pointer;box-shadow:0 3px 0 #2f8a2a}
.card button.alt{background:linear-gradient(180deg,#ffe08a,#f0b020);color:#3a2a00;box-shadow:0 3px 0 #b8800a}
.card button:disabled{opacity:.4}
.rar{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff}
.btn{font:700 17px var(--f);border:0;border-radius:14px;padding:10px 20px;background:linear-gradient(180deg,#ffe08a,#f0b020);color:#3a2a00;box-shadow:0 4px 0 #b8800a;cursor:pointer}
.btn.g{background:linear-gradient(180deg,#9ae86a,#4ab83a);color:#fff;box-shadow:0 4px 0 #2f8a2a}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tabs button{font:700 14px var(--f);border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}.tabs button.on{background:#ffe08a;border-color:#f0b020}
.fr{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:3px 8px;margin:2px;font-size:13px;font-weight:600}
.mut{font-size:11px;font-weight:700;padding:0 5px;border-radius:6px;color:#fff}
#toast{position:fixed;left:50%;top:calc(112px + var(--st));transform:translateX(-50%);background:#2a2014;color:#fff;font:700 15px var(--f);padding:8px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:9;max-width:90vw;text-align:center;pointer-events:none}
#away{position:fixed;inset:0;background:rgba(40,30,10,.5);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
#away .box{background:var(--cream);border-radius:22px;padding:18px;max-width:380px;text-align:center;box-shadow:0 10px 0 rgba(90,60,20,.3)}
#away h2{margin:0 0 6px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#8fd3ff;font:700 22px var(--f);color:#fff;z-index:20}
@media (max-width:600px){#hot{left:10px;transform:none;max-width:calc(100% - 112px)}}
</style>

function play(name,...a){if(!ac||!S.sfx)return;const f=FX[name];if(f)try{f(...a);}catch(_){}}

<script>/* ===== RealKit: shared realistic rendering (ported from Wildlands) ===== */

/* ================= textures (procedural, tileable) ================= */
function canvasTex(w,h,fn,opts={}){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const img=g.createImageData(w,h);const ht=new Float32Array(w*h);

const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const J=(x,y,s,a)=>(h2(x,y,s)-.5)*a;
let TX={};
function makeTextures(){if(TX.grass)return;
  const S=256;
  TX.grass=canvasTex(S,S,(x,y)=>{const n=pf(x,y,S,1,4,4,5),b=pf(x,y,S,2,32,32,2),d=pf(x,y,S,3,3,3,3);let c=mix3([52,82,30],[104,140,52],n*.75+b*.35);if(d<.38)c=mix3(c,[96,78,50],smooth(.38,.3,d)*.8);const j=J(x,y,4,16);return[c[0]+j,c[1]+j,c[2]+j*.5];});
  TX.sand=canvasTex(S,S,(x,y)=>{const n=pf(x,y,S,5,8,8,4),rp=Math.sin((y+pf(x,y,S,6,4,4,2)*30)*.35)*.5+.5;const c=mix3([170,150,108],[212,194,150],n*.7+rp*.3);const j=J(x,y,7,18);return[c[0]+j,c[1]+j,c[2]+j];});
  TX.rock=canvasTex(S,S,(x,y)=>{const n=pf(x,y,S,8,4,4,5),cr=Math.abs(pf(x,y,S,9,6,6,3)-.5),l=pf(x,y,S,10,2,16,3);let g=86+n*70+l*22+J(x,y,11,12);if(cr<.02)g*=.6;return[g,g*.97,g*.92,255,n-(cr<.02?.3:0)];},{normal:3});
  TX.snow=canvasTex(S,S,(x,y)=>{const n=pf(x,y,S,12,4,4,4);const c=mix3([210,220,232],[248,250,255],n);return[c[0],c[1],c[2]];});
  TX.noise=canvasTex(S,S,(x,y)=>{const n=pf(x,y,S,13,4,4,5)*255;return[n,n,n];});
  TX.bark=canvasTex(256,512,(x,y)=>{if(x<128){const n=pf(x,y/4,128,14,12,8,4),f=pf(x,y/4,128,15,24,12,2);let c=mix3([54,40,28],[110,84,58],n);if(f<.4)c=mix3(c,[30,22,15],.65);return[c[0]+J(x,y,16,10),c[1],c[2],255,n-(f<.4?.35:0)];}
    const xx=x-128,n=pf(xx,y/4,128,17,6,8,3),m=pf(xx,y/2,128,18,10,24,3);let c=[222+J(x,y,19,12),218,206];if(m<.33)c=mix3(c,[38,34,30],.85);else if(n<.35)c=mix3(c,[170,160,140],.4);return[c[0],c[1],c[2],255,m<.33?0:.6+n*.2];},{normal:4});
  TX.rockObj=canvasTex(S,S,(x,y)=>{const n=pf(x,y,S,20,4,4,5),cr=Math.abs(pf(x,y,S,21,5,5,3)-.5),lich=pf(x,y,S,22,8,8,3);let g=110+n*80;let c=[g,g*.98,g*.94];if(lich>.68)c=mix3(c,[120,130,80],.5);if(cr<.018)c=c.map(v=>v*.55);return[c[0],c[1],c[2],255,n-(cr<.018?.3:0)];},{normal:3.5});
  TX.plank=canvasTex(S,S,(x,y)=>{const row=y>>5,yy=y&31,seam=yy<2,vs=((row*97+40)%256);const g=pf(x+row*37,y,S,23,16,8,4),grain=pf(x+row*11,y,S,24,48,4,2);let c=mix3([118,82,48],[178,134,88],g*.55+grain*.45);if(seam||Math.abs(x-vs)<1.5)c=mix3(c,[48,32,18],.75);return[c[0],c[1],c[2],255,seam?0:.5+grain*.3];},{normal:2.5});
  TX.logwall=canvasTex(S,S,(x,y)=>{const yy=(y%64)/64,round=Math.sin(yy*Math.PI),bark=pf(x,y,S,25,16,8,4);let c=mix3([60,42,26],[132,96,62],bark*.6+round*.4);if(yy<.04||yy>.96)c=[30,22,14];return[c[0],c[1],c[2],255,round*.8+bark*.2];},{normal:4});
  TX.brick=canvasTex(S,S,(x,y)=>{const row=y>>5,yy=y&31,off=(row%2)*32,xx=(x+off)&63;const n=pf(x,y,S,26,8,8,4);if(yy<3||xx<3)return[76,74,70,255,0];let g=104+n*70+J(row,xx>>3,27,26);const e=Math.min(yy,31-yy,xx,63-xx)/8;return[g,g*.97,g*.92,255,clamp(e,0,1)*.7+n*.3];},{normal:3});
  // leaves atlas: left broadleaf, right pine needles
  const lc=document.createElement('canvas');lc.width=512;lc.height=256;const g=lc.getContext('2d');const r=mulberry32(9);

    for(let t=-100;t<100;t+=4){for(const sd of[-1,1]){const gg=60+r()*50;g.strokeStyle=`rgb(${(gg*.35)|0},${(gg*.85)|0},${(gg*.55)|0})`;g.lineWidth=1.4;g.beginPath();g.moveTo(0,t);g.lineTo(sd*(14+r()*8),t-8-r()*6);g.stroke();}}g.restore();}g.restore();

}
function tex(c,srgb=true,rep=true){const t=new THREE.CanvasTexture(c);if(srgb&&!LEG)t.encoding=THREE.sRGBEncoding;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=8;return t;}

/* ================= geometry builder ================= */
class GB{constructor(){this.p=[];this.n=[];this.u=[];this.c=[];this.i=[];}
  v(x,y,z,nx,ny,nz,u,v,c){this.p.push(x,y,z);this.n.push(nx,ny,nz);this.u.push(u,v);this.c.push(c[0],c[1],c[2]);return this.p.length/3-1;}
  tube(pts,rad,seg,u0,u1,vs,col){let prevN=null,len=0;const rings=[];
    for(let k=0;k<pts.length;k++){const t=(k<pts.length-1?pts[k+1].clone().sub(pts[k]):pts[k].clone().sub(pts[k-1])).normalize();

/* ---------- world time: weather, night, shop (pure functions of time so it works offline) ---------- */
const WEATHERS=[['rain',30,'🌧️ Rain','Plants grow 50% faster. Fruits can turn Wet!'],['frost',18,'❄️ Frost','Fruits can turn Chilled. Wet + Chilled = Frozen ×6!'],['thunder',14,'⛈️ Thunderstorm','Lightning strikes plants: Shocked ×30!'],['wind',12,'🌬️ Windstorm','Fruits can get Windstruck ×3'],['meteor',5,'☄️ Meteor Shower','Meteors hit plants: Celestial ×40!'],['rainbow',3,'🌈 Rainbow','Rainbow fruits are 10× more likely!'],['clear',38,'','']];
const WWIN=8*60*1000,WLEN=3*60*1000;
function weatherAt(ms){const win=Math.floor(ms/WWIN),into=ms-win*WWIN;if(into>WLEN)return null;const r=seeded(win*7919+3)();let tot=WEATHERS.reduce((a,w)=>a+w[1],0),x=r*tot;for(const w of WEATHERS){x-=w[1];if(x<=0)return w[0]==='clear'?null:w[0];}return null;}
function weatherEnd(ms){const win=Math.floor(ms/WWIN);return win*WWIN+WLEN;}
function nightAt(ms){const m=Math.floor(ms/60000)%20;return m>=16;}
function bloodAt(ms){const c=Math.floor(ms/1200000);return nightAt(ms)&&seeded(c*31+7)()<.12;}
const SHOPWIN=5*60*1000;
function shopStock(idx){const g=seeded(idx*104729+11),st={};for(const c of CROPS){const r=g();const p={C:1,U:.8,R:.5,L:.28,M:.12,D:.05,P:.025}[c.r];if(c.wild||(c.reb&&save.reb<c.reb)){st[c.id]=0;continue;}const n=r<p?Math.max(1,Math.round(({C:12,U:6,R:4,L:2,M:1.5,D:1,P:1}[c.r])*(.5+g()))):0;st[c.id]=c.id==='carrot'?Math.max(n,8):n;}return st;}
function gearStock(idx){const g=seeded(idx*7727+5),st={};for(const it of GEAR){st[it.id]=g()<it.ch?(it.id==='can'?3+Math.floor(g()*4):1+Math.floor(g()*2)):0;}return st;}

/* ---------- garden logic ---------- */
const plotKey=(c,r)=>c+','+r;
function cropSpeed(pk,ms){let s=1;const w=weatherAt(ms);if(w==='rain')s*=1.5;s*=1+petPower('cat')*0;for(const p of save.placed){const G=GR[p.k];if(!G.boost||p.until<ms)continue;const[c,r]=p.at.split(',').map(Number),[c2,r2]=pk.split(',').map(Number);if(Math.abs(c-c2)<=1&&Math.abs(r-r2)<=1)s*=G.boost;}
  const cat=petLv('cat');if(cat>=0)s*=1.15+cat*.01;const owl=petLv('owl');if(owl>=0&&nightAt(ms))s*=1.5+owl*.02;return s;}
function petLv(k){let best=-1;for(const id of save.equip){const p=save.pets.find(x=>x.id===id);if(p&&p.k===k)best=Math.max(best,p.lv);}return best;}
function petPower(){return 0;}
function newFruit(crop,plantObj){const fert=plantObj&&plantObj.fert>0;let w=crop.w*rnd(.7,1.4)*psz(plantObj).w,sz='';const r0=R()/(fert?3:1);if(r0<.004){w*=rnd(5,7);sz='colossal';}else if(fert||r0<.024){w*=rnd(2.5,3.5);sz='huge';}else if(r0<.084){w*=rnd(1.6,2);sz='big';}
  const gl=petLv('goldlab');const gch=.012*(gl>=0?2+gl*.05:1),rch=.0012;const muts=[];const r=R();if(r<rch)muts.push('rainbow');else if(r<rch+gch)muts.push('gold');
  if(fert)plantObj.fert--;if(plantObj&&plantObj.var&&PVAR[plantObj.var]){const vm=PVAR[plantObj.var].mut;if(!muts.includes(vm)){if(vm==='gold'||vm==='rainbow')muts.length=0;muts.push(vm);}}return{g:0,w,muts,giant:sz==='huge'||sz==='colossal',sz};}
function plant(pk,id){const c=CR[id];save.plants[pk]={id,g:0,fr:[],t:Date.now(),fert:0,size:rollPlantSize(pk,id),var:rollPlantVar(id)};save.seeds[id]--;if(!save.seeds[id])delete save.seeds[id];SFX.plant();buzz(6);bump(pk);}
function mutChance(base,pk,ms){let m=base;const bf=petLv('butterfly');if(bf>=0)m*=1.4+bf*.02;for(const p of save.placed){const G=GR[p.k];if(!G.mutb||p.until<ms)continue;const[c,r]=p.at.split(',').map(Number),[c2,r2]=pk.split(',').map(Number);if(Math.abs(c-c2)<=1&&Math.abs(r-r2)<=1)m*=G.mutb;}return m;}
const ENVM=['wet','chilled','frozen','shocked','moonlit','bloodlit','celestial','pollinated','windy'];
function addMut(f,k){if(f.muts.includes(k))return false;if((k==='wet'||k==='chilled')&&f.muts.includes('frozen'))return false;if(k==='moonlit'&&f.muts.includes('bloodlit'))return false;if(k==='bloodlit'&&f.muts.includes('moonlit')){f.muts=f.muts.filter(x=>x!=='moonlit');}
  if(ENVM.includes(k)&&f.muts.filter(x=>ENVM.includes(x)).length>=4&&!(k==='frozen'))return false;if(k==='chilled'&&f.muts.includes('wet')){f.muts=f.muts.filter(x=>x!=='wet');k='frozen';}if(k==='wet'&&f.muts.includes('chilled')){f.muts=f.muts.filter(x=>x!=='chilled');k='frozen';}if(f.muts.includes(k))return false;
  if(k==='gold'||k==='rainbow'){f.muts=f.muts.filter(x=>x!=='gold'&&x!=='rainbow');}f.muts.push(k);return true;}
function fruitsOf(pk){const p=save.plants[pk];if(!p)return[];const c=CR[p.id];if(!c.regrow)return p.g>=1&&p.single?[p.single]:[];return p.fr;}
// main simulation step (works for live frames and big offline chunks)
let events=[];
function tick(dt,ms,live){
  for(const pk in save.plants){const p=save.plants[pk],c=CR[p.id],sp=cropSpeed(pk,ms);
    if(p.g<1){p.g=Math.min(1,p.g+dt*sp/c.grow);if(p.g>=1){if(c.regrow){p.fr=[];}else p.single=newFruit(c,p);}}
    else if(c.regrow){if(p.fr.length<pMax(p,c)){p.rg=(p.rg||0)+dt*sp/c.regrow;while(p.rg>=1&&p.fr.length<pMax(p,c)){p.rg-=1;const f=newFruit(c,p);f.g=1;p.fr.push(f);}if(p.fr.length>=pMax(p,c))p.rg=0;}}}
  // weather mutations
  const w=weatherAt(ms),night=nightAt(ms),blood=bloodAt(ms);
  const roll=(pps,pk)=>R()<1-Math.pow(1-mutChance(pps,pk,ms)*(live?1:.4),dt);
  for(const pk in save.plants){for(const f of fruitsOf(pk)){if(w==='rain'&&roll(.0015,pk))addMut(f,'wet');if(w==='frost'&&roll(.0012,pk))addMut(f,'chilled');if(w==='wind'&&roll(.0008,pk))addMut(f,'windy');if(w==='rainbow'&&roll(.0002,pk))addMut(f,'rainbow');
      if(night&&roll(blood?.0008:.0004,pk))addMut(f,blood?'bloodlit':'moonlit');}}
  if(w==='thunder'||w==='meteor'){const rate=w==='thunder'?1/40:1/100;let n=live?(R()<rate*dt?1:0):Math.round(rate*dt*rnd(.2,.6));const pks=Object.keys(save.plants);
    while(n-->0&&pks.length){let pk=pks[(R()*pks.length)|0];if(w==='thunder'){const rods=save.placed.filter(p=>p.k==='rod'&&p.until>ms);if(rods.length&&R()<.75){const rd=rods[(R()*rods.length)|0];const[c,r]=rd.at.split(',').map(Number);const near=pks.filter(k=>{const[a,b]=k.split(',').map(Number);return Math.abs(a-c)<=1&&Math.abs(b-r)<=1;});if(near.length)pk=near[(R()*near.length)|0];}}
      const fs=fruitsOf(pk);if(fs.length)addMut(fs[(R()*fs.length)|0],w==='thunder'?'shocked':'celestial');if(live)events.push({k:w,pk,t:1});}}
  // pets
  for(const id of save.equip){const pt=save.pets.find(x=>x.id===id);if(!pt)continue;pt.xp=(pt.xp||0)+dt;while(pt.xp>=1200*(1+pt.lv*.4)&&pt.lv<50){pt.xp-=1200*(1+pt.lv*.4);pt.lv++;if(live)toast(PETS[pt.k].e+' '+PETS[pt.k].n+' reached level '+pt.lv+'!');}
    const L=pt.lv;pt.cd=(pt.cd||0)-dt;let period=0;
    if(pt.k==='puppy')period=Math.max(2,6-L*.1)*60;else if(pt.k==='bee')period=Math.max(40,150-L*2);else if(pt.k==='dragonfly')period=Math.max(2,6-L*.1)*60;else if(pt.k==='raccoon')period=Math.max(4,12-L*.15)*60;else if(pt.k==='queenbee')period=Math.max(15,50-L*.6);else if(pt.k==='dragon')period=Math.max(4,10-L*.1)*60;
    if(!period)continue;let guard=0;while(pt.cd<=0&&guard++<500){pt.cd+=period;curPet=pt;petAct(pt,live);curPet=null;}}}
function randomFruit(){const all=[];for(const pk in save.plants)for(const f of fruitsOf(pk))all.push([pk,f]);return all.length?all[(R()*all.length)|0]:null;}
function petAct(pt,live){const P=PETS[pt.k];
  if(pt.k==='puppy'){const x=R(),rr=x<.002?'P':x<.008?'D':x<.025?'M':x<.08?'L':x<.25?'R':x<.55?'U':'C';const opts=CROPS.filter(c=>(!c.reb||save.reb>=c.reb)&&c.r===rr);const c=opts.length?opts[(R()*opts.length)|0]:CR.carrot;save.seeds[c.id]=(save.seeds[c.id]||0)+1;if(live)toast(P.e+' Puppy dug up a '+c.n+' seed!');}
  else if(pt.k==='bee'||pt.k==='queenbee'){const rf=randomFruit();if(rf){addMut(rf[1],'pollinated');if(pt.k==='queenbee'){const p=save.plants[rf[0]];if(p&&p.g<1)p.g=Math.min(1,p.g+.1);}if(live)bump(rf[0]);}}
  else if(pt.k==='dragonfly'){const rf=randomFruit();if(rf){addMut(rf[1],'gold');if(live){bump(rf[0]);toast(P.e+' Dragonfly turned a fruit Gold!');}}}
  else if(pt.k==='dragon'){const rf=randomFruit();if(rf){addMut(rf[1],'rainbow');if(live){bump(rf[0]);toast(P.e+' Dragon turned a fruit Rainbow!');}}}
  else if(pt.k==='raccoon'){if(save.bag.length&&save.bag.length<BAGMAX()){const f=save.bag[(R()*save.bag.length)|0];save.bag.push({...f,muts:f.muts.slice()});if(live)toast(P.e+' Raccoon copied your '+CR[f.c].n+'!');}}}
function fruitValue(f){const c=CR[f.c];let base=1;if(f.muts.includes('rainbow'))base=50;else if(f.muts.includes('gold'))base=20;let env=1;for(const m of f.muts){const M=MUTS[m];if(M&&M.m)env+=M.m-1;}
  let v=c.sell*Math.pow(f.w/c.w,1.3)*base*env*(1+save.reb*.35);const bn=petLv('bunny');if(bn>=0&&(c.r==='C'||c.r==='U'))v*=1.1+bn*.01;const uc=petLv('unicorn');if(uc>=0)v*=1.3+uc*.01;return Math.max(1,Math.round(v));}
function harvest(pk){const p=save.plants[pk];if(!p)return 0;const c=CR[p.id];let n=0;const take=f=>{if(save.bag.length>=BAGMAX()){toast('🎒 Your bag is full! Sell some fruit.');return false;}const fr={c:p.id,w:+f.w.toFixed(2),muts:f.muts.slice(),sz:f.sz||''};save.bag.push(fr);journalAdd(fr);save.stats.harv++;save.xp+=Math.max(1,Math.round(c.sell/8));n++;questProg('harvest',p.id,1);for(const m of f.muts)questProg('mut',m,1);return true;};
  if(c.regrow){while(p.fr.length){if(!take(p.fr[0]))break;p.fr.shift();}}else if(p.g>=1&&p.single){if(take(p.single)){delete save.plants[pk];}}
  if(n){SFX.pick(n);buzz(8);bump(pk);floaters.push({pk,txt:'+'+n+' '+c.e,life:1});}return n;}

    h+='<div class="sub" style="margin-top:10px">Gear shop · restocks in '+ftime(((gi+1)*SHOPWIN-now)/1000)+'</div><div class="grid">'+GEAR.map(g=>{const left=st[g.id]-(save.gbought[g.id]||0);return'<div class="card"><div class="t">'+g.e+' '+g.n+'</div><div class="d">'+g.d+'</div><button class="alt" data-gbuy="'+g.id+'" '+(left<=0||save.coins<g.cost?'disabled':'')+'>'+(left>0?'🪙 '+fmt(g.cost)+' · '+left+' left':'Sold out')+'</button></div>';}).join('')+'</div>';}
  else if(p==='eggs'){h='<h3>🐣 Pets <button class="x">×</button></h3><div class="sub">Equip up to '+PETSLOTS()+' pets. Equipped pets level up over time and get stronger.</div>';
    if(save.eggs.length)h+='<div class="grid">'+save.eggs.map((e,i)=>{const E=EGGS[e.k],left=E.hatch-(now-e.start)/1000;return'<div class="card"><div class="t">'+E.e+' '+E.n+'</div><div class="d">'+(left>0?'Hatching in '+ftime(left):'Ready to hatch!')+'</div><button data-hatch="'+i+'" '+(left>0?'disabled':'')+'>Hatch</button></div>';}).join('')+'</div>';
    h+='<div class="grid" style="margin-top:8px">'+save.pets.map(pt=>{const on=save.equip.includes(pt.id),P=PETS[pt.k];return'<div class="card" style="'+(on?'border-color:#4ab83a':'')+'"><div class="t">'+P.e+' '+P.n+' · Lv '+pt.lv+'</div><div class="d">'+P.d(pt.lv)+'</div><button data-eq="'+pt.id+'" class="'+(on?'alt':'')+'">'+(on?'Unequip':'Equip')+'</button></div>';}).join('')+'</div>';
    h+='<div class="sub" style="margin-top:10px">Egg shop</div><div class="grid">'+Object.keys(EGGS).map(k=>{const E=EGGS[k];return'<div class="card"><div class="t">'+E.e+' '+E.n+'</div><div class="d">Hatches in '+ftime(E.hatch)+' · '+E.pets.map(p=>PETS[p[0]].e+' '+p[1]+'%').join(' ')+'</div><button class="alt" data-egg="'+k+'" '+(save.coins<E.cost?'disabled':'')+'>🪙 '+fmt(E.cost)+'</button></div>';}).join('')+'</div>';}
  else if(p==='bag'){let tot=0;for(const f of save.bag)tot+=fruitValue(f);h='<h3>🎒 Bag '+save.bag.length+'/'+BAGMAX()+' <button class="x">×</button></h3><div class="sub">Worth '+fmt(tot)+' coins. Tap 💰 Sell to sell it all.</div><div>';
    const sorted=save.bag.map((f,i)=>({f,i,v:fruitValue(f)})).sort((a,b)=>b.v-a.v).slice(0,120);h+=sorted.map(({f,v})=>'<span class="fr">'+CR[f.c].e+' '+f.w+'kg '+(f.sz?'<span class="mut" style="background:#7a5a2a">'+FSIZE[f.sz]+'</span>':'')+f.muts.map(m=>'<span class="mut" style="background:'+MUTS[m].c+'">'+MUTS[m].n+'</span>').join('')+' · '+fmt(v)+'</span>').join('')+'</div>';}
  else if(p==='more'){const tab=sheetTab.more||'quests';h='<h3>⭐ More <button class="x">×</button></h3><div class="tabs">'+[['quests','📋 Quests'],['journal','📖 Journal'],['rebirth','🌀 Rebirth'],['spin','🎡 Daily Spin'],['badges','🏆 Badges'],['help','❓ How to play'],['settings','⚙️']].map(([k,n])=>'<button data-tab="'+k+'" class="'+(tab===k?'on':'')+'">'+n+'</button>').join('')+'</div>';
    if(tab==='quests'){checkQuestDay();h+='<div class="sub">New quests every day.</div><div class="grid">'+save.quests.map(q=>'<div class="card" style="'+(q.done?'border-color:#4ab83a':'')+'"><div class="t">'+(q.done?'✅ ':'')+q.txt+'</div><div class="d">'+(q.t==='sell'?fmt(q.p):q.p)+' / '+(q.t==='sell'?fmt(q.n):q.n)+' · reward: '+({coins:'🪙 coins',seed:'🌱 rare seed',egg:'🥚 egg'})[q.rw]+'</div></div>').join('')+'</div>';}
    else if(tab==='journal'){const total=CROPS.length*(1+Object.keys(MUTS).length),have=Object.keys(save.journal).length;h+='<div class="sub">'+have+' / '+total+' discovered. Every new crop or mutation pays coins!</div><div>'+CROPS.map(c=>'<div class="card" style="margin-bottom:6px"><div class="t">'+(save.journal[c.id+':normal']?c.e:'❔')+' '+c.n+'</div><div class="d">'+['normal'].concat(Object.keys(MUTS)).map(m=>'<span class="mut" style="background:'+(save.journal[c.id+':'+m]?(m==='normal'?'#8a9a7a':MUTS[m].c):'#ccc')+'">'+(m==='normal'?'Normal':MUTS[m].n)+'</span>').join(' ')+'</div></div>').join('')+'</div>';}
    else if(tab==='rebirth'){const need=rebirthNeed();h+='<div class="card"><div class="t">🌀 Rebirth '+save.reb+' → '+(save.reb+1)+'</div><div class="d">Start a fresh garden, but grow stronger forever:<br>• +35% value on every fruit per rebirth (now +'+(save.reb*35)+'%)<br>• Bigger bag (+50) and an extra pet slot every 2 rebirths<br>• Unlocks a new Prismatic seed'+(CROPS.find(c=>c.reb===save.reb+1)?' ('+CROPS.find(c=>c.reb===save.reb+1).n+')':'')+'<br>You keep your pets, eggs and journal. Coins, seeds, plants, gear and garden size reset.<br><br>Requirement: earn '+fmt(need)+' coins this rebirth ('+fmt(save.earned)+' so far)</div><button id="rebB" '+(save.earned<need?'disabled':'')+'>Rebirth!</button></div>';}
    else if(tab==='spin'){h+=spinHTML();}else if(tab==='badges'){h+=badgeHTML();}else if(tab==='help'){h+='<div class="d" style="font-size:14px;line-height:1.5">🌱 Buy seeds in the shop (it restocks every 5 minutes, with rare seeds sometimes!). Plant them in your soil.<br>⏳ Plants keep growing even when the app is closed.<br>🕹️ Walk with the joystick (left side), drag the right side to turn the camera, pinch to zoom.<br>✋ Tap a plant with a glowing ring to harvest it. Multi-harvest plants grow new fruit again and again.<br>💰 Sell your fruit at the Sell Stand. Heavier fruit and mutations are worth way more.<br>🌧️ Weather comes every few minutes: Rain (Wet ×2), Frost (Chilled ×2, Wet+Chilled = Frozen ×6), Thunderstorm (Shocked ×30), Wind (×3), Meteors (Celestial ×40), Rainbow. Night gives Moonlit ×2 and a Blood Moon gives Bloodlit ×4. Gold (×20) and Rainbow (×50) can appear on any fruit!<br>✨ Rarely a plant sprouts MUTATED (Golden, Rainbow, Frostbitten, Moonkissed or Stormcharged) and every fruit it grows gets that mutation!<br>🌳 Plants can sprout Big, Huge or Colossal: more fruit and heavier harvests! Sprinklers raise the chance. Fruit can also grow Big, Huge or Colossal.<br>🐣 Hatch eggs to get pets with special powers.<br>🌍 Explore the endless wild! Walk past the meadow to find jungles, deserts, snowy tundra, swamps and more. Wild crops grow out there: walk up to a wild tomato, berry patch, apple tree or banana plant to gather its seeds (the farther you go, the rarer). Some crops only grow from wild seeds! Tap 🏡 to teleport home and 🏃 to run.<br>🎁 Lucky gifts fall from the sky every few minutes. Follow the light beam!<br>🛒 A Traveling Merchant visits with rare deals. 🌟 Golden Hour makes fruit sell ×2.<br>🎡 Spin the wheel for free every day, and claim 🏆 badge rewards.<br>🌀 Rebirth to grow stronger forever.</div>';}
    else{h+='<div class="row"><button class="btn" id="sndT">🔊 Sounds: '+(save.snd?'on':'off')+'</button><button class="btn" id="musT">🎵 Music: '+(SND.get('music')?'on':'off')+'</button></div>';}}
  sh.innerHTML=h;sh.hidden=false;sh.dataset.p=p;if(!keep)sh.scrollTop=0;sh.querySelector('.x').onclick=closeSheet;}
function rebirthNeed(){return Math.round(2e6*Math.pow(6,save.reb));}
$('sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const now=Date.now(),d=b.dataset;
  if(d.pack!==undefined){buyPack(+d.pack);return;}if(b.id==='sellAllB'){sellAll();if(save.tut===2)save.tut=3;coinBurst(sellPos(),26);coinFly();openPanel('sellp',1);return;}if(b.id==='bagB'){openPanel('bag');return;}
  if(d.plant){closeSheet();setMode({k:'plant',id:d.plant});return;}
  if(d.buy){const c=CR[d.buy],si=Math.floor(now/SHOPWIN),st=shopStock(si);if(save.boughtIdx!==si){save.boughtIdx=si;save.bought={};}if((save.bought[c.id]||0)>=st[c.id]||save.coins<c.seed){SFX.deny();return;}save.coins-=c.seed;save.bought[c.id]=(save.bought[c.id]||0)+1;save.seeds[c.id]=(save.seeds[c.id]||0)+1;SFX.buy();if(['L','M','D','P'].includes(c.r))SFX.rare();persist();openPanel('seeds',1);return;}
  if(d.gbuy){const g=GR[d.gbuy],gi=Math.floor(now/SHOPWIN),st=gearStock(gi);if(save.gbIdx!==gi){save.gbIdx=gi;save.gbought={};}if((save.gbought[g.id]||0)>=st[g.id]||save.coins<g.cost){SFX.deny();return;}save.coins-=g.cost;save.gbought[g.id]=(save.gbought[g.id]||0)+1;save.gear[g.id]=(save.gear[g.id]||0)+1;SFX.buy();persist();openPanel('gear',1);return;}
  if(d.use){closeSheet();setMode(d.use==='shovel'?{k:'shovel'}:{k:'place',id:d.use});return;}
  if(d.egg){const E=EGGS[d.egg];if(save.coins<E.cost){SFX.deny();return;}save.coins-=E.cost;save.eggs.push({k:d.egg,start:now});SFX.buy();persist();openPanel('eggs',1);return;}
  if(d.hatch!==undefined){const e=save.eggs[+d.hatch],E=EGGS[e.k];if((now-e.start)/1000<E.hatch)return;let x=R()*100,k=E.pets[0][0];for(const[pk,w]of E.pets){x-=w;if(x<=0){k=pk;break;}}save.eggs.splice(+d.hatch,1);const pt={id:Date.now()+''+Math.floor(R()*1e4),k,lv:0,xp:0};save.pets.push(pt);if(save.equip.length<PETSLOTS())save.equip.push(pt.id);SFX.rare();buzz([20,30,60]);toast('🎉 You hatched a '+PETS[k].e+' '+PETS[k].n+'!');persist();openPanel('eggs',1);return;}
  if(d.eq){const i=save.equip.indexOf(d.eq);if(i>=0)save.equip.splice(i,1);else{if(save.equip.length>=PETSLOTS()){toast('All pet slots are full');return;}save.equip.push(d.eq);}persist();openPanel('eggs',1);return;}
  if(d.tab){sheetTab.more=d.tab;openPanel('more');return;}
  if(b.id==='sndT'){save.snd=!save.snd;SND.set('sfx',save.snd);persist();openPanel('more',1);return;}
  if(b.id==='rebB'){if(save.earned<rebirthNeed())return;const keep={badges:save.badges,spinDay:save.spinDay,wheelRot:save.wheelRot,boostUntil:save.boostUntil,mBought:save.mBought,pets:save.pets,equip:save.equip,eggs:save.eggs,journal:save.journal,reb:save.reb+1,xp:save.xp,stats:save.stats,snd:save.snd,tut:3,quests:save.quests,qday:save.qday};save=Object.assign(fresh(),keep);resize();save.coins=100;SFX.rare();buzz([60,40,60,40,120]);toast('🌀 Rebirth '+save.reb+'! Everything is worth +'+(save.reb*35)+'% now.');persist();closeSheet();return;}});
/* ---------- offline catch-up ---------- */
function catchUp(){const now=Date.now();let el=(now-(save.last||now))/1000;if(el<5)return;el=Math.min(el,7*86400);const before={bag:save.bag.length,fr:0,seeds:JSON.stringify(save.seeds)};let ripe0=0;for(const pk in save.plants)ripe0+=fruitsOf(pk).length;
  let ms=now-el*1000;const step=el>3600?60:15;while(el>0){const d=Math.min(step,el);ms+=d*1000;tick(d,ms,false);el-=d;}
  let ripe=0,muts={};for(const pk in save.plants)for(const f of fruitsOf(pk)){ripe++;for(const m of f.muts)muts[m]=(muts[m]||0)+1;}
  const hatch=save.eggs.filter(e=>(now-e.start)/1000>=EGGS[e.k].hatch).length;const away=(now-save.last)/1000;
  $('awayTxt').innerHTML='You were away for <b>'+ftime(away)+'</b>.<br>🍓 '+ripe+' fruit'+(ripe===1?' is':'s are')+' ready to harvest'+(Object.keys(muts).length?'<br>✨ Mutations: '+Object.keys(muts).map(m=>muts[m]+' '+MUTS[m].n).join(', '):'')+(hatch?'<br>🥚 '+hatch+' egg'+(hatch>1?'s are':' is')+' ready to hatch!':'')+(save.equip.length?'<br>🐾 Your pets kept working too.':'');$('away').hidden=false;}
$('awayOk').onclick=()=>{audio();$('away').hidden=true;};

/* ---------- loop ---------- */
let last=performance.now(),saveT=0,lastW=null,lastShop=-1,uiT=0;
function frame(nowp){const dt=Math.min(.05,(nowp-last)/1000);last=nowp;t+=dt;const now=Date.now();tick(dt,now,true);
  for(const k in bumps){bumps[k]-=dt*4;if(bumps[k]<=0)delete bumps[k];}floaters.length=0;
  for(const e of events){const[x,z]=pkPos(e.pk);if(e.k==='thunder')bolt(x,z);else meteor(x,z);}events.length=0;
  const w=weatherAt(now);if(w!==lastW){if(w){const wl=WEATHERS.find(x=>x[0]===w);toast(wl[2]+'! '+wl[3]);tone(440,.4,'triangle',.05,880);}lastW=w;}
  const si=Math.floor(now/SHOPWIN);if(si!==lastShop){if(lastShop>=0){const st=shopStock(si);const rare=CROPS.filter(c=>st[c.id]>0&&['L','M','D','P'].includes(c.r));toast('🌱 Seed shop restocked!'+(rare.length?' '+rare.map(c=>c.e+' '+c.n).join(', ')+' in stock!':''));if(rare.some(c=>['M','D','P'].includes(c.r)))SFX.rare();}lastShop=si;}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true;}
  saveT+=dt;if(saveT>5){saveT=0;persist();}
  if(!$('sheet').hidden&&(['seeds','gear','eggs'].includes($('sheet').dataset.p))&&Math.floor(t)!==Math.floor(t-dt)){const st=$('sheet').scrollTop;openPanel($('sheet').dataset.p,1);$('sheet').scrollTop=st;}
  updatePlayer(dt);updateCamera();syncGarden();syncPlants();syncPlaced();syncPets(dt);updateSky(dt,now);updateFX(dt);updateGift(dt);
  const hl=mode&&mode.k==='plant';for(const pk in tileM){const m=tileM[pk],want=hl&&!save.plants[pk]?tileHL:((pk.split(',').reduce((a,b)=>a+ +b,0))%2?tileMatA:tileMatB);if(m.material!==want)m.material=want;}
  tileHL.emissiveIntensity=.5+Math.sin(t*6)*.4;
  rainbowM.color.setHSL((t*.25)%1,.9,.55);for(const s of sparkles){s.userData.spark+=dt*3;s.material.opacity=.55+Math.sin(s.userData.spark)*.35;}
  for(const h of spinners)h.rotation.y+=dt*6;
  updateOpen(dt);updateExtra(dt,now);updateSound(dt,now);uiT-=dt;if(uiT<=0){uiT=.2;updateUI();}
  RK.frame(dt);RK.render();requestAnimationFrame(frame);}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist();else{catchUp();}});addEventListener('pagehide',persist);
resize();checkQuestDay();catchUp();persist();$('load').hidden=true;requestAnimationFrame(frame);
window.__bs={save:()=>save,tick:(s)=>{tick(s,Date.now(),false);},rich:()=>{save.coins+=1e9;},setLast:(ms)=>{save.last=ms;},tp:teleport,pl,gift:()=>{giftT=0;},ev:(k,pk)=>events.push({k,pk,t:1}),cam:(y,p,d)=>{yaw=y;pitch=p;camDist=d;},setMode,merch:()=>merchWin(Date.now()),mo:w=>merchOffers(w),mg:merch,spin:doSpin,badges:badgeHTML,day:(v)=>{dayAmt=v;},info:()=>renderer.info.render};
})();
