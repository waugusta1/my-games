<script>/* SND: shared audio engine: real public-domain soundtrack (FreePD.com, CC0) with synth fallback, rich sound effects, nature ambience. */

const INS={

function schedule(){if(!song||!ac)return;const s=song,st=s.st,spb=60/st.bpm/4;
  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;

    const deg=s.prog[bar%4],ch=chordNotes(st,deg),sw=(step%2)?st.swing*spb:0,T=t+sw;

    if(sec!=='intro'&&sec!=='break'||sec==='break'&&step%4===0){const ap=st.arpPat;let idx=null;if(ap==='up'&&step%2===0)idx=(step/2)%4;else if(ap==='down'&&step%2===0)idx=3-(step/2)%4;else if(ap==='wide'&&step%4===0)idx=[0,2,1,3][step/4];else if(ap==='bounce'&&[0,3,6,8,11,14].includes(step))idx=[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(step)];
      if(idx!=null)INS[st.arp](ch[idx]+12,T,spb*2,.3*(sec==='b'?1:.8),dest);}
    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}

  if(state==='play'&&me){$('score').innerHTML='Length '+Math.round(me.mass)+'<small>Best '+save.best+' · Defeated '+me.kills+'</small>';const top=[...snakes].filter(s=>s.alive).sort((a,b)=>b.mass-a.mass).slice(0,6);$('board').innerHTML='🏆 Leaderboard<br>'+top.map((s,i)=>(i+1)+'. '+(s===me?'<b>'+s.name+'</b>':s.name)+' · '+Math.round(s.mass)).join('<br>');}}
/* menu */
function skins(){$('skins').innerHTML=SKINS.map((s,i)=>'<div class="sk'+(save.skin===i?' sel':'')+(save.best<s.need?' lock':'')+'" data-i="'+i+'" style="background:radial-gradient(circle at 35% 30%,#fff,'+s.c[0]+' 30%,'+(s.c[1]||s.c[0])+')"><small>'+(save.best<s.need?'🔒'+s.need:s.n)+'</small></div>').join('');
  document.querySelectorAll('.sk').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(save.best<SKINS[i].need){toast('Reach length '+SKINS[i].need+' to unlock');SND.play('error');return;}save.skin=i;persist();skins();SND.play('tap');});}
$('nm').value=save.name;$('playB').onclick=start;$('againB').onclick=start;$('menuB').onclick=()=>{$('over').hidden=true;$('menu').hidden=false;skins();state='menu';};
const sndTxt=()=>$('sndB').textContent='🎵 Music '+(SND.get('music')?'on':'off')+' · 🔊 Sounds '+(SND.get('sfx')?'on':'off');$('sndB').onclick=()=>{const m=SND.get('music'),s=SND.get('sfx');if(m&&s)SND.set('music',false);else if(!m&&s){SND.set('sfx',false);}else{SND.set('music',true);SND.set('sfx',true);}sndTxt();};sndTxt();
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;if(state==='menu'){t+=dt;camX=Math.cos(t*.1)*400;camY=Math.sin(t*.13)*400;zoom=Math.min(W,H)/800;if(!orbs.length){spawnFood(600);for(let i=0;i<10;i++)spawnAI();}for(const s of snakes)if(s.ai&&s.alive){} update(dt);}else update(dt);render();if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true;}}
window.__ns={get me(){return me;},get snakes(){return snakes;},start,save};
skins();requestAnimationFrame(loop);
})();

});</script>
