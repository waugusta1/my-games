function genTerrain(m,r){const n=Math.ceil(m.L/10)+1;const h=new Float32Array(n);const lava=new Uint8Array(n);

const LEGS=[[-4.2,-3.2],[4.2,-3.2]],HULL=[[-2.7,-1.3],[2.7,-1.3],[-2.2,2.4],[2.2,2.4],[0,3.7],[-1.1,-2.5],[1.1,-2.5]];
