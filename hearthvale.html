#tcard{pointer-events:auto;width:min(420px,100%);padding:20px 28px 18px;text-align:center;border-radius:3px}
#tcard h1{margin:0;font-size:50px;letter-spacing:.01em;font-weight:700;line-height:1;color:var(--ink)}
#tcard h1::first-letter{color:var(--ox);font-size:66px}
#tcard p{margin:4px 0 12px;font-style:italic;color:var(--ink2);font-size:15px}
#tcard .inb{width:100%;margin:4px 0;font-size:17px;min-height:50px}
.chr{display:flex;gap:10px;padding:8px 6px;border-top:1px dotted #bfa675;align-items:center;width:100%;text-align:left;min-height:60px}
.chr .nmc{font-weight:700;font-size:16.5px}
.chr .ds{font-size:13px;color:var(--ink2);font-style:italic;line-height:1.2}
.chr.lock{opacity:.5}
.chr .sl{display:flex;gap:2px;margin-left:auto;flex:none}
.fv{display:flex;gap:8px;padding:6px 2px;border-top:1px dotted #bfa675;align-items:center}
.fv .t{flex:1;line-height:1.2}
.fv .t b{font-size:15px}

#pause{flex-direction:column;gap:10px}#pause>.__gb{width:min(360px,100%)}#pause .card{width:min(360px,100%);padding:20px 24px;text-align:center;display:flex;flex-direction:column;gap:8px}

function add(g,k,n){if(k==='gold')g.gold=Math.max(0,g.gold+n);else g.stock[k]=clamp((g.stock[k]||0)+n,0,storeCap(g));}
function takeFood(g,n){const fs=FOOD.filter(f=>(g.stock[f]||0)>0);fs.sort((a,b)=>g.stock[b]-g.stock[a]);for(const f of fs){const t=Math.min(n,g.stock[f]);g.stock[f]-=t;n-=t;if(n<=0)break;}}

function updatePop(){let p=0,cap=0;for(const b of G.b){if(b.t==='hall'){p+=b.occ;cap+=12;}else if(b.t==='house'&&!b.prog){p+=b.occ;if(b.conn)cap+=HCAP[b.lvl];}}G.pop=p;G.cap=cap;}
const PRI={food:0,serv:1,ind:2,trade:3,mono:4,road:9,home:9};
function assignWorkers(){let free=G.pop;G.jobs=0;const list=G.b.filter(b=>B[b.t].w&&!b.prog&&b.on&&b.conn);list.sort((a,b)=>(a.pri||0)-(b.pri||0)||PRI[B[a.t].cat]-PRI[B[b.t].cat]||a.id-b.id);for(const b of G.b)if(B[b.t].w)b.staff=0;for(const b of list){const n=Math.min(B[b.t].w,free);b.staff=n;free-=n;G.jobs+=B[b.t].w;}G.idle=free;}
/* ---------- stock helpers ---------- */
function canAfford(cost,mult=1){for(const k in cost){if(k==='gold'){if(G.gold<cost[k]*mult)return false;}else if((G.stock[k]||0)<cost[k]*mult)return false;}return true;}
function pay(cost,mult=1){for(const k in cost){if(k==='gold')G.gold-=cost[k]*mult;else G.stock[k]-=cost[k]*mult;}}
function foodTotal(){return FOOD.reduce((a,f)=>a+(G.stock[f]||0),0);}
/* placement */
function canPlace(t,x,y){const b=B[t],s=b.s;if(x<0||y<0||x+s>N||y+s>N)return'edge';for(let j=y;j<y+s;j++)for(let i=x;i<x+s;i++){const k=idx(i,j);if(OCC[k])return'occupied';if(G.roads[k])return'road';const tt=W.T[k];if(isWater(tt))return'water';}if(b.need==='coast'&&siteYield(t,x,y)<.1)return'needs water';if(b.need&&b.need!=='wild'&&b.need!=='soil'&&b.need!=='coast'&&siteYield(t,x,y)<.05)return'needs '+({trees:'woodland',rock:'stone outcrop',ore:'iron rock',clay:'clay'}[b.need]);return null;}
function place(t,x,y){const b=B[t];if(!canAfford(b.cost)||canPlace(t,x,y))return false;pay(b.cost);const s=b.s;for(let j=y;j<y+s;j++)for(let i=x;i<x+s;i++){const k=idx(i,j);if(G.tree[k]){G.tree[k]=0;addClamp('logs',2);}}
 const time=(b.time||(4+s*3))*(hasFav('masons')?.6:1);const nb={id:G.uid++,t,x,y,lvl:0,occ:0,staff:0,on:1,prog:time,ptotal:time,yld:null,conn:0};G.b.push(nb);for(let j=y;j<y+s;j++)for(let i=x;i<x+s;i++)OCC[idx(i,j)]=nb.id;nb.conn=touchesRoad(x,y,s);yieldOf(nb,1);rebuildObjects();return nb;}
function addClamp(k,n){G.stock[k]=clamp((G.stock[k]||0)+n,0,storeCap(G));}
function placeRoad(t,tiles){let cnt=0;const c=B[t].cost;for(const[x,y]of tiles){const k=idx(x,y);const tt=W.T[k];if(OCC[k])continue;const isW=isWater(tt);if(G.roads[k]&&(G.roads[k]===(t==='cobble'?2:1)||isW))continue;const ty=isW?'bridge':t==='bridge'?'road':t;const cc=B[ty].cost;if(!canAfford(cc))break;pay(cc);if(G.tree[k]){G.tree[k]=0;addClamp('logs',2);}G.roads[k]=isW?3:ty==='cobble'?2:1;cnt++;}recalcRoads();rebuildObjects();return cnt;}
function roadCost(t,tiles){const o={};for(const[x,y]of tiles){const k=idx(x,y);const tt=W.T[k];if(OCC[k])continue;const isW=isWater(tt);if(G.roads[k]&&(G.roads[k]===(t==='cobble'?2:1)||isW))continue;const ty=isW?'bridge':t==='bridge'?'road':t;for(const g in B[ty].cost)o[g]=(o[g]||0)+B[ty].cost[g];}return o;}
function demolish(b){if(b.t==='hall')return false;G.b=G.b.filter(q=>q!==b);const s=fp(b);for(let j=b.y;j<b.y+s;j++)for(let i=b.x;i<b.x+s;i++)OCC[idx(i,j)]=0;if(B[b.t].cost&&!B[b.t].mono)for(const k in B[b.t].cost){const v=B[b.t].cost[k]*.4;if(k==='gold')G.gold+=v;else addClamp(k,v);}if(b.occ){const hall=G.b.find(q=>q.t==='hall');hall.occ=Math.min(hall.occ+0,12);}updatePop();recalcRoads();rebuildObjects();return true;}
function removeRoad(x,y){const k=idx(x,y);if(G.roads[k]){delete G.roads[k];recalcRoads();rebuildObjects();return true;}return false;}
/* ---------- simulation ---------- */
function workSpeed(b){const d=B[b.t];let f=1;if(hasFav('axes')&&(b.t==='wood'||b.t==='saw'))f*=1.15;if(hasFav('guilds')&&(d.in))f*=1.12;return f;}
function daySim(){const g=G;g.day++;g.tick++;const ch=chOf(g);const newSeason=Math.floor(g.day/SEASON)%4;if(newSeason!==g.season){g.season=newSeason;onSeason&&onSeason();saveTown();}
 g.year=1+Math.floor(g.day/YEAR);
 if(g.tick%3===0)assignWorkers();
 /* construction */for(const b of g.b){if(b.prog){b.prog-=1;if(b.prog<=0){delete b.prog;delete b.ptotal;if(b.t==='house')b.lvl=0;if(B[b.t].mono)sfx('bell');toast(B[b.t].n+' is built.');if(b.t==='post'||b.t==='harbor'){g.tradeLeft+=b.t==='post'?70:200;}yieldOf(b,1);rebuildObjects();updatePop();}}}
 const sm=g.season,dt=1/YEAR,cap=storeCap(g);
 /* production */for(const b of g.b){const d=B[b.t];b.st=0;if(b.prog||!d.w)continue;if(!b.conn){b.st='road';continue;}if(!b.staff){b.st='hands';continue;}if(!b.on)continue;const eff=b.staff/d.w*workSpeed(b);
  if(b.t==='forester'){if(g.tick%6===0)plantTree(b);continue;}
  if(d.goldrate){g.gold+=d.goldrate*eff*dt;continue;}
  if(!d.out)continue;const y=yieldOf(b);if(d.need&&y<=.02){b.st='res';continue;}
  if(d.harvest){if(sm<2||sm===2&&g.day%SEASON<12){b.grow=(b.grow||0)+eff*y*d.rate/((SEASON*2)+12)*(hasFav('harvest')?1.15:1)*(1-(g.blight||0));}if(sm===2&&g.day%SEASON===12&&b.grow){const n=b.grow;addClamp(d.out,n);g.made[d.out]=(g.made[d.out]||0)+n;b.grow=0;spawnFloat(b,'+'+Math.round(n),d.out);}continue;}
  let r=d.rate*eff*y*dt*(d.sm?d.sm[sm]:1);if(r<=0)continue;if((g.stock[d.out]||0)>=cap){b.st='full';continue;}
  if(d.in){let ok=true;for(const k in d.in)if((g.stock[k]||0)<d.in[k]*r)ok=false;if(b.t==='saw'&&g.stock.logs<25)ok=false;if(!ok){b.st='input';continue;}for(const k in d.in)g.stock[k]-=d.in[k]*r;}
  g.stock[d.out]=Math.min(cap,(g.stock[d.out]||0)+r);g.made[d.out]=(g.made[d.out]||0)+r;
  if(b.t==='wood'){b.cut=(b.cut||0)+r;if(b.cut>=16){b.cut=0;chopTree(b);}}
 }
 /* idle hands scavenge fallen wood and forage, so a town can always recover */if(g.idle>0){const n=Math.min(g.idle,20)*dt;addClamp('logs',n*5);if(sm<3)addClamp('berries',n*3);}
 /* eating and burning */let persons=0;const lvCount=[0,0,0,0];for(const b of g.b){if(b.t==='hall'){lvCount[0]+=b.occ;}else if(b.t==='house'&&!b.prog)lvCount[b.lvl]+=b.occ;}persons=g.pop;
 const eat=persons*6*dt*(hasFav('thrift')?.88:1);let need=eat;const fs=FOOD.filter(f=>g.stock[f]>0);if(fs.length){const each=need/fs.length;for(const f of fs){const t=Math.min(g.stock[f],each);g.stock[f]-=t;need-=t;}if(need>1e-5)takeFood(g,need);}g.hungry=foodTotal()<=0&&persons>0;
 const cold=(sm>=2?1:0)*(sm===3?1.5:1);if(cold){const burn=persons*3*dt*1.1*cold*(ch.cold||1)*(hasFav('hearth')?.75:1)*(g.harshWinter?1.5:1);g.stock.firewood=Math.max(0,g.stock.firewood-burn);g.freezing=g.stock.firewood<=0&&persons>0;}else{g.freezing=false;if(g.harshWinter&&sm===0)g.harshWinter=0;}
 for(let l=1;l<4;l++){if(!lvCount[l])continue;for(let q=1;q<=l;q++){const gd=HN_NEEDS[q].g;for(const k in gd){g.stock[k]=Math.max(0,g.stock[k]-gd[k]*lvCount[l]*dt);}}}
 /* taxes */const tm=[.7,1,1.35][g.tax]*(hasFav('reeve')?1.15:1);let inc=0;for(let l=0;l<4;l++)inc+=lvCount[l]*HTAX[l];inc=inc*tm*dt*(g.hungry?.5:1);g.gold+=inc;let up=0;for(const b of g.b)if(!b.prog&&B[b.t].up&&(b.staff||!B[b.t].w))up+=B[b.t].up;up=up*dt*1.5;g.gold=Math.max(0,g.gold-up);g.incRate=inc*YEAR;g.upRate=up*YEAR;
 if(g.tick%5===0)homesTick();
 if(g.tick%6===0)migrate();
 if(g.tick%4===0)moodCalc();
 fireTick();
 g.moodEv*=.992;
 if(g.day%SEASON===0)for(const k in g.demand)g.demand[k]*=.5;
 if(g.day%SEASON===0)refreshTrade();
 if(g.day%YEAR===0)g.blight=0;
 checkRank();letterTick();if(!g.demo)goalTick();
 if(g.tick%10===0)achTick();
}
function plantTree(b){let best=-1,tries=0;const d=B[b.t];while(tries++<14){const x=b.x+1+((Math.random()*(d.rad*2+1))|0)-d.rad,y=b.y+1+((Math.random()*(d.rad*2+1))|0)-d.rad;if(!inb(x,y))continue;const k=idx(x,y);if(OCC[k]||G.roads[k]||G.tree[k]||isWater(W.T[k])||W.T[k]>=4)continue;best=k;break;}if(best>=0){G.tree[best]=1+(best%3);rebuildObjects();}}
function chopTree(b){const d=B[b.t];const cand=[];for(let j=b.y-d.rad;j<b.y+2+d.rad;j++)for(let i=b.x-d.rad;i<b.x+2+d.rad;i++){if(inb(i,j)&&G.tree[idx(i,j)])cand.push(idx(i,j));}if(cand.length){const k=cand[(Math.random()*cand.length)|0];G.tree[k]=Math.max(0,G.tree[k]-1);rebuildObjects();}}
function homeNeeds(b,level){/* returns list of [label,met] for the given level (cumulative) */const out=[];for(let q=1;q<=level;q++){for(const s of HN_NEEDS[q].s)out.push([B[s].n,serviceAt(s,b)]);for(const k in HN_NEEDS[q].g)out.push([gn(k),(G.stock[k]||0)>0.5]);}return out;}
function homesTick(){const g=G;let didUp=false;for(const b of g.b){if(b.t!=='house'||b.prog)continue;const curOk=homeNeeds(b,b.lvl).every(q=>q[1]);if(!curOk){b.down=(b.down||0)+1;if(b.down>=8&&b.lvl>0){b.lvl--;b.down=0;const cap=HCAP[b.lvl];if(b.occ>cap)b.occ=cap;rebuildObjects();}}else b.down=0;
  const nx=b.lvl+1;if(nx<4&&nx<=g.rank+1&&b.occ>=HCAP[b.lvl]*.6){if(homeNeeds(b,nx).every(q=>q[1])&&!g.hungry&&!g.freezing){b.upg=(b.upg||0)+1;if(b.upg>=3&&!didUp&&canAfford(HUP[nx])){pay(HUP[nx]);b.lvl=nx;b.upg=0;didUp=true;rebuildObjects();updatePop();spawnFloat(b,HN[nx],null);}}else b.upg=0;}}}
function migrate(){const g=G;updatePop();const room=g.cap-g.pop;let arrive=0;if(g.pendingArr>0&&room>0){const n=Math.min(g.pendingArr,Math.max(room,0),4);g.pendingArr-=n;arrive+=n;}
 if(room-arrive>0&&g.mood>=40&&!g.hungry&&!g.freezing){arrive+=Math.ceil((g.mood-40)/25*(hasFav('pilgrim')?1.5:1)+.5);}arrive=Math.min(arrive,room);
 if(arrive>0){for(const b of g.b){if(arrive<=0)break;const cap=b.t==='hall'?0:b.t==='house'&&!b.prog&&b.conn?HCAP[b.lvl]:0;const v=cap-b.occ;if(v>0){const n=Math.min(v,arrive);b.occ+=n;arrive-=n;}}if(arrive>0){const h=g.b.find(b=>b.t==='hall');const n=Math.min(arrive,12-h.occ);if(n>0)h.occ+=n;}updatePop();}
 const bad=g.hungry||g.freezing||g.mood<22;if(bad&&g.pop>4){leave(g,Math.ceil(g.pop*.03));if(!g.warned||g.tick-g.warned>40){g.warned=g.tick;toast(g.hungry?'The people are starving and leaving town.':g.freezing?'The hearths are out. Families are leaving.':'Discontent grows. Families are leaving.',1);sfx('bad');}}
 /* hall empties into proper homes */const h=g.b.find(b=>b.t==='hall');if(h.occ>0){for(const b of g.b){if(b.t==='house'&&!b.prog&&b.conn&&b.occ<HCAP[b.lvl]&&h.occ>0){const n=Math.min(h.occ,HCAP[b.lvl]-b.occ,2);b.occ+=n;h.occ-=n;}}}}
function leave(g,n){const hs=g.b.filter(b=>(b.t==='house'||b.t==='hall')&&b.occ>0).sort((a,b)=>b.occ-a.occ);for(const b of hs){if(n<=0)break;const t=Math.min(n,b.occ);b.occ-=t;n-=t;}updatePop();}
function moodCalc(){const g=G;let s=0,c=0;const hs=g.b.filter(b=>b.t==='house'&&!b.prog);for(const b of hs){const nx=homeNeeds(b,Math.min(3,b.lvl+1));const met=nx.filter(q=>q[1]).length;s+=nx.length?met/nx.length:0;c++;}let m=46+(c?s/c*22:6);const kinds=FOOD.filter(f=>g.stock[f]>1).length;m+=(kinds-1)*5;if(g.hungry)m-=32;if(g.freezing)m-=24;m+=[10,0,-16][g.tax];m+=g.moodEv;for(const b of g.b){if(b.t==='well'&&!b.prog){m+=.0;}if(B[b.t].mono&&!b.prog)m+=8;}
 const wells=hs.filter(b=>serviceAt('well',b)).length;if(hs.length)m+=wells/hs.length*6;let cob=0;for(const b of hs){if(hasCobble(b))cob++;}if(hs.length)m+=cob/hs.length*5;if(g.fires)m-=4;g.mood=lerp(g.mood,clamp(m,0,100),.2);}
function hasCobble(b){const s=2;for(let i=0;i<s;i++){for(const[a,c]of[[b.x+i,b.y-1],[b.x+i,b.y+s],[b.x-1,b.y+i],[b.x+s,b.y+i]])if(inb(a,c)&&G.roads[idx(a,c)]===2)return true;}return false;}
const RANKNEED=[null,{pop:30},{pop:90,lvl:[1,8]},{pop:180,lvl:[2,8]},{pop:320,lvl:[3,6]}];
function rankProg(r){const q=RANKNEED[r];if(!q)return null;const hs=q.lvl?G.b.filter(b=>b.t==='house'&&!b.prog&&b.lvl>=q.lvl[0]).length:0;return{pop:G.pop,popN:q.pop,hs,hsN:q.lvl?q.lvl[1]:0,lv:q.lvl?HN[q.lvl[0]]:null,ok:G.pop>=q.pop&&(!q.lvl||hs>=q.lvl[1])};}
function checkRank(){const g=G;const p=rankProg(g.rank+1);if(p&&p.ok){g.rank++;__mgt('m','rank');sfx('bell');if(!g.demo){const names=Object.values(B).filter(b=>b.r===g.rank&&b.cat!=='x').map(b=>b.n);letterQ.push({rank:1,t:`By this letter the Crown names your settlement a ${RANKS[g.rank]}. Your people may now raise: ${names.join(', ')}.`});}}}
/* fires */
function fireTick(){const g=G;g.fires=0;for(const b of g.b){if(b.fire){g.fires++;b.fire-=1;const well=g.b.some(q=>q.t==='well'&&!q.prog&&Math.hypot(q.x-b.x,q.y-b.y)<=B.well.rad+1);const tw=g.b.some(q=>q.t==='tower'&&q.staff&&Math.hypot(q.x-b.x,q.y-b.y)<=B.tower.rad);b.fp=(b.fp||0)+(well?1.4:0)+(tw?.6:0);if(b.fp>=6){delete b.fire;delete b.fp;g.firesOut++;toast('The fire is out.');rebuildObjects();continue;}if(b.fire<=0){burnDown(b);return;}if(b.fire<8&&Math.random()<.03){const n=g.b.find(q=>q!==b&&!q.fire&&q.t!=='hall'&&Math.hypot(q.x-b.x,q.y-b.y)<3.5&&!B[q.t].mono);if(n){n.fire=14;n.fp=0;}}}}
 const rate=(hasFav('wardens')?.25:1)*Math.min(1,g.b.length/30);if(g.tick%10===0&&g.pop>25&&Math.random()<.03*rate){const c=g.b.filter(b=>b.t!=='hall'&&!b.prog&&!b.fire&&!B[b.t].mono);if(c.length){const b=c[(Math.random()*c.length)|0];b.fire=hasFav('wardens')?24:16;b.fp=0;toast(`Fire at the ${b.t==='house'?HN[b.lvl]:B[b.t].n}! Tap it to send a bucket chain.`,1);sfx('fire');rebuildObjects();}}}
function burnDown(b){toast((b.t==='house'?HN[b.lvl]:B[b.t].n)+' has burned down.',1);sfx('bad');G.b=G.b.filter(q=>q!==b);const s=fp(b);for(let j=b.y;j<b.y+s;j++)for(let i=b.x;i<b.x+s;i++)OCC[idx(i,j)]=0;updatePop();recalcRoads();rebuildObjects();G.moodEv-=5;}
/* trade */
function tradeCap(){let n=0;for(const b of G.b){if(b.prog)continue;if(b.t==='post')n+=70;if(b.t==='harbor')n+=200;}return n;}
function refreshTrade(){G.tradeLeft=tradeCap();}
function price(k,sell){const base=GOODS[k][1],d=G.demand[k]||0;const f=hasFav('merchant')?.12:0;return sell?Math.max(1,base*(.8+f)*(1-d)):Math.max(1,base*(1.3-f)*(1+Math.max(0,-d)+Math.max(0,d)*.4));}
function trade(k,n,sell){const u=Math.min(n,G.tradeLeft);if(u<=0)return false;if(sell){const a=Math.min(u,Math.floor(G.stock[k]));if(a<=0)return false;const v=a*price(k,1);G.stock[k]-=a;G.gold+=v;G.tradeLeft-=a;G.traded+=v;G.demand[k]=clamp((G.demand[k]||0)+a/200,0,.6);}else{const c=price(k,0)*u;if(G.gold<c)return false;addClamp(k,u);G.gold-=c;G.tradeLeft-=u;G.traded+=c;G.demand[k]=clamp((G.demand[k]||0)-u/300,-.6,.6);}return true;}
/* letters & goals */
const letterQ=[];
function letterTick(){const g=G;if(g.demo)return;g.nextEv-=1;if(g.nextEv>0||letterQ.length)return;g.nextEv=55+Math.random()*80;const ch=chOf(g);const raidP=(ch.raids||0)*.3+(g.pop>60?.08:0);if(g.pop>30&&Math.random()<raidP&&!g.b.some(b=>b.t==='keep'&&!b.prog)){letterQ.push({raid:1,t:RAID.t});return;}
 const pool=EV.filter(e=>g.pop>=e.min&&(!e.cond||e.cond(g)));let tw=pool.reduce((a,e)=>a+e.w,0),r=Math.random()*tw;for(const e of pool){r-=e.w;if(r<=0){letterQ.push({ev:e});return;}}}
function raidOutcome(pay){const g=G;if(pay){const n=Math.min(g.gold,60+g.pop);g.gold-=n;toast('The riders take the purse and pass on.');return;}let towers=g.b.filter(b=>b.t==='tower'&&b.staff).length;const chance=clamp(.2+towers*.25,0,.95);if(Math.random()<chance){g.raidsWon++;g.moodEv+=6;const loot=40+g.pop;g.gold+=loot;toast('Your watch drove the riders off and took '+loot+' gold in plunder.');sfx('coin');}else{const n=Math.min(g.gold,60+g.pop*2);g.gold-=n;takeFood(g,g.pop);leave(g,Math.ceil(g.pop*.05));g.moodEv-=10;toast('The riders broke through. Gold and food were taken.',1);sfx('bad');}}
function condVal(k){const g=G;if(k.pop!=null)return[g.pop,k.pop];if(k.count){return[g.b.filter(b=>b.t===k.count[0]&&!b.prog).length+(k.count[0]==='road'||k.count[0]==='bridge'?countRoads(k.count[0]):0),k.count[1]];}if(k.rank!=null)return[g.rank,k.rank];if(k.lvl){return[g.b.filter(b=>b.t==='house'&&!b.prog&&b.lvl>=k.lvl[0]).length,k.lvl[1]];}if(k.made)return[Math.floor(g.made[k.made[0]]||0),k.made[1]];if(k.stock)return[Math.floor(g.stock[k.stock[0]]||0),k.stock[1]];if(k.gold!=null)return[Math.floor(g.gold),k.gold];if(k.mood!=null)return[Math.floor(g.mood),k.mood];if(k.traded!=null)return[Math.floor(g.traded),k.traded];if(k.raids!=null)return[g.raidsWon,k.raids];if(k.built)return[g.b.some(b=>b.t===k.built&&!b.prog)?1:0,1];if(k.before!=null)return[g.year<=k.before?1:0,1];return[0,1];}
function countRoads(t){let n=0;const want=t==='bridge'?3:null;for(const k in G.roads){if(want?G.roads[k]===want:G.roads[k]!==3)n++;}return n;}
function goalDone(k){const[v,t]=condVal(k);return v>=t;}
