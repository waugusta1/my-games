 $('title').innerHTML=`<div class="logo">Emberline<small>KEEP THE FLAME BURNING</small></div>
 <div style="position:absolute;left:70px;bottom:60px;width:420px" class="plate"><div class="lbl">Lighthouse log</div><p style="margin:6px 0;font-size:16px;color:#e2d8c0">Runs ${S.runs} · Admirals sunk ${S.wins} · Battles won ${S.bw}<br>Highest Tide open: ${S.maxTide}</p>${Object.keys(HOUSES).map(h=>`<div style="font-size:14px;color:#cfc5ac;margin-top:4px">${HOUSES[h].n}: ${S.unl[h]?'level '+hLvl(h):'locked'}</div><div class="prog"><i style="width:${S.unl[h]?Math.min(100,((S.hx[h]||0)%120)/1.2):0}%"></i></div>`).join('')}</div>
 <div id="tbtn">${cont?`<button class="br" id="tC">${IC.play} Continue run</button>`:''}<button class="br ${cont?'sea':''}" id="tN">${IC.play} New run</button><button class="br sea" id="tHow">How to play</button><button class="br sea" id="tHome">${IC.home} Go back to games</button></div>`;
 bind('tN',()=>{if(cont){sheet(`<h2>Start a new run?</h2><p>Your current run will be abandoned.</p><div class="row cen"><button class="br" id="qN">${IC.back} Back</button><button class="br rust" id="qY">New run</button></div>`);bind('qN',closeSheet);bind('qY',()=>{S.runs++;S.run=null;S.save();chooseHouse();});}else chooseHouse();});
 bind('tC',()=>{RUN=S.run;mapScreen();});bind('tHow',()=>help());bind('tHome',goHub);}
function chooseHouse(){let tide=Math.min(S.tide||0,S.maxTide);
 const draw=()=>{sheet(XB()+`<h2>Choose a house</h2><p>Each house brings its own deck. Rare cards join the pool as the house levels up.</p>
 ${Object.keys(HOUSES).map(h=>`<button class="opt" id="h_${h}" ${S.unl[h]?'':'disabled'}><canvas width="120" height="120" data-f="${HOUSE_START[h][3]}"></canvas><div><b>${HOUSES[h].n}${S.unl[h]?' · level '+hLvl(h):''}</b><small>${S.unl[h]?HOUSES[h].d+' Flame '+HOUSES[h].flame+'.':'Locked. Win a full run to unlock.'}</small></div></button>`).join('')}
 <h3>Tide</h3><div class="row"><button class="br sea" id="tdM" style="min-height:48px">−</button><span class="big" style="min-width:60px;text-align:center">${tide}</span><button class="br sea" id="tdP" style="min-height:48px">+</button><span style="font-size:15px;color:#cfc5ac;max-width:520px">${tideDesc(tide)}</span></div>`);
  $('sh').querySelectorAll('canvas[data-f]').forEach(cv=>{const c=cv.getContext('2d');c.translate(60,116);FIG[cv.dataset.f].f(c,0);});
  bind('xC',closeSheet);bind('tdM',()=>{tide=Math.max(0,tide-1);draw();});bind('tdP',()=>{tide=Math.min(S.maxTide,tide+1);draw();});
  Object.keys(HOUSES).forEach(h=>bind('h_'+h,()=>{S.tide=tide;newRun(h,tide);}));};draw();}
function tideDesc(t){const L=['Calm seas.','Drowned are 10% tougher.','The Flame starts 5 lower.','Drowned hit 1 harder.','Shops cost 20% more.','Each battle has an extra wave.','Bosses are 20% tougher.','Rest heals less.','Drowned are tougher still.','You start with a Soot curse.','Drowned hit 2 harder still.'];let s=[];for(let i=1;i<=t;i++)s.push(L[i]);return t?s.join(' '):L[0];}
function newRun(h,tide){const fm=HOUSES[h].flame-(tide>=2?5:0);RUN={house:h,tide,bi:1,gold:30,deck:HOUSE_START[h].map(id=>({id,up:0})),relics:[],flame:fm,flameMax:fm,kills:0,node:null};
 if(tide>=9)RUN.deck.push({id:'soot',up:0});closeSheet();saveAll();mapScreen();}
function pool(){const lv=hLvl(RUN.house);return Object.keys(CARDS).filter(k=>{const C=CARDS[k];return(C.h===RUN.house||C.h==='any')&&C.t!=='x'&&(C.r<2||lv>=2);});}
function reward(g){const pl=pool();const ch=[];const w=k=>CARDS[k].r===2?1:CARDS[k].r===1?3:6;while(ch.length<3){let tot=0;pl.forEach(k=>tot+=w(k));let r=R()*tot;for(const k of pl){r-=w(k);if(r<=0){if(!ch.includes(k))ch.push(k);break;}}}
 sheet(`<h2>Victory</h2><p>+${g} shards. Choose a card to add to your deck.</p><div class="grid">${ch.map((k,i)=>cardHTML({id:k,up:0},i)).join('')}</div><div class="row cen" style="margin-top:14px"><button class="br sea" id="skip">Skip</button></div>`);paintCards($('sh'));
 $('sh').querySelectorAll('.grid .card').forEach(b=>b.onclick=e=>{e.stopPropagation();RUN.deck.push({id:b.dataset.id,up:0});AU.tone(660,.2,'triangle',.1);after();});bind('skip',after);
 function after(){closeSheet();if(RUN.relicDue){RUN.relicDue=0;relicChoice(()=>mapScreen());}else mapScreen();}}
function nodeKind(bi){return bi===5||bi===9?'boss':(bi===3||bi===7)?'elite':'fight';}
function mapScreen(){scr='map';$('panel').hidden=true;$('hand').innerHTML='';$('title').hidden=true;$('pauseB').hidden=false;const M=$('map');M.hidden=false;AU.play(['windy_old_weather','travelers_notebook','night_vigil']);
 if(!RUN.opts)RUN.opts=shuf(['shop','forge','rest','shrine','shop','forge']).slice(0,2);if(RUN.bi===1&&!RUN.cleared)RUN.opts=[];
 saveAll();
 const steps=[];for(let i=1;i<=9;i++)steps.push(i);
 M.innerHTML=`<div style="position:absolute;left:90px;top:30px;right:40px;font:700 34px Palatino,Georgia;color:#f6d58a">The Climb · ${HOUSES[RUN.house].n}</div>
 <div style="position:absolute;left:90px;top:76px;font-size:17px;color:#9fd2d6">Flame ${RUN.flame}/${RUN.flameMax} · ${RUN.gold} shards · Tide ${RUN.tide} · ${RUN.deck.length} cards</div>
 <div style="position:absolute;left:60px;right:60px;top:130px;height:120px;display:flex;justify-content:space-between;align-items:center">${steps.map(i=>{const k=nodeKind(i);return`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;opacity:${i<RUN.bi?.35:1}"><div style="width:${i===RUN.bi?80:60}px;height:${i===RUN.bi?80:60}px;border-radius:50%;background:${i===RUN.bi?'radial-gradient(#3a5a7a,#1a2a3a)':'#16243a'};border:3px solid ${i===RUN.bi?'#f6d58a':'#3f5a74'};display:flex;align-items:center;justify-content:center">${'<svg style="width:70%;height:70%" viewBox="0 0 48 48">'+IC[k].replace(/<svg[^>]*>|<\/svg>/g,'')+'</svg>'}</div><small style="color:#cfc5ac;font-size:13px">${k==='boss'?(i===5?'Bell Hag':'Admiral'):k==='elite'?'Elite':'Battle '+i}</small></div>`;}).join('')}</div>
 <div style="position:absolute;left:90px;right:90px;top:290px" class="plate">${RUN.opts.length?`<div class="lbl">Choose a stop before battle ${RUN.bi}</div><div class="row" style="gap:14px;margin-top:10px">${RUN.opts.map((o,i)=>`<button class="opt" id="o_${i}" style="flex:1;width:auto">${IC[o]}<div><b>${{shop:'Chandler',forge:'Forge',rest:'Hearth',shrine:'Sea Shrine'}[o]}</b><small>${{shop:'Buy cards, charms and remove cards.',forge:'Upgrade one card: +50% to its numbers.',rest:'The Flame heals '+(RUN.tide>=7?'30%':'50%')+'.',shrine:'Choose 1 of 3 charms.'}[o]}</small></div></button>`).join('')}</div>`:`<div class="lbl">Next</div><p style="font-size:17px">${nodeKind(RUN.bi)==='boss'?'A boss climbs the tower. Prepare.':nodeKind(RUN.bi)==='elite'?'An elite tide: stronger drowned, but a charm as reward.':'The drowned are coming.'}</p><div class="row"><button class="br" id="go" style="min-width:320px">${IC.bell} Start battle ${RUN.bi}</button></div>`}</div>
 <div style="position:absolute;left:90px;bottom:40px" class="row"><button class="br sea" id="mD">Deck & charms</button><button class="br sea" id="mT">${IC.back} Title</button></div>`;
 RUN.opts.forEach((o,i)=>bind('o_'+i,()=>{RUN.opts=[];({shop,forge,rest,shrine})[o]();}));
 bind('go',()=>{const k=nodeKind(RUN.bi);if(k==='elite')RUN.relicDue=1;RUN.cleared=0;RUN.opts=null;startBattle(k);});
 bind('mD',()=>deckView());bind('mT',()=>{saveAll();title();});}
function priceMul(){return RUN.tide>=4?1.2:1;}
function shop(){const pl=pool();const items=shuf(pl.slice()).slice(0,5).map(k=>({k,p:Math.round(({0:40,1:65,2:100}[CARDS[k].r])*priceMul()*(.9+R()*.2))}));
 const rk=shuf(Object.keys(RELICS).filter(k=>!RUN.relics.includes(k))).slice(0,2).map(k=>({k,p:Math.round(110*priceMul())}));let rem=Math.round(55*priceMul());
 const draw=()=>{sheet(XB()+`<h2>The Chandler</h2><p>You have <b style="color:#f6d58a">${RUN.gold}</b> shards.</p><h3>Cards</h3><div class="grid">${items.map((it,i)=>`<div class="ch">${cardHTML({id:it.k,up:0},i,it.sold?'dim':'')}<button class="br" id="b_${i}" style="min-height:44px" ${it.sold||RUN.gold<it.p?'disabled':''}>${it.sold?'Sold':it.p+' shards'}</button></div>`).join('')}</div>
 <h3>Charms</h3>${rk.map((it,i)=>`<button class="opt" id="r_${i}" ${it.sold||RUN.gold<it.p?'disabled':''}><canvas width="120" height="120" data-r="${it.k}"></canvas><div><b>${RELICS[it.k].n} · ${it.sold?'Sold':it.p+' shards'}</b><small>${RELICS[it.k].d}</small></div></button>`).join('')}
 <h3>Services</h3><button class="opt" id="rm" ${RUN.gold<rem?'disabled':''}>${IC.forge}<div><b>Remove a card · ${rem} shards</b><small>Thin your deck.</small></div></button><div class="row cen"><button class="br" id="lv">${IC.back} Leave the shop</button></div>`);
  paintCards($('sh'));$('sh').querySelectorAll('canvas[data-r]').forEach(cv=>cv.getContext('2d').drawImage(relicCanvas(cv.dataset.r),0,0));$('sh').querySelectorAll('.grid .card').forEach(b=>b.onclick=e=>e.stopPropagation());
  items.forEach((it,i)=>bind('b_'+i,()=>{RUN.gold-=it.p;it.sold=1;RUN.deck.push({id:it.k,up:0});draw();}));
  rk.forEach((it,i)=>bind('r_'+i,()=>{RUN.gold-=it.p;it.sold=1;gainRelic(it.k);draw();}));
  bind('rm',()=>pickCard('Remove which card?',c=>{RUN.gold-=rem;RUN.deck.splice(RUN.deck.indexOf(c),1);rem+=25;draw();},draw));
  const out=()=>{closeSheet();saveAll();mapScreen();};bind('xC',out);bind('lv',out);};draw();}
function pickCard(t,fn,back,filter){sheet(XB()+`<h2>${t}</h2><div class="grid">${RUN.deck.map((c,i)=>cardHTML(c,i,filter&&!filter(c)?'dim':'')).join('')}</div>`);paintCards($('sh'));bind('xC',back);
 $('sh').querySelectorAll('.grid .card').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=RUN.deck[+b.dataset.i];if(filter&&!filter(c))return;fn(c);});}
function forge(){const back=()=>{closeSheet();RUN.opts=null;RUN.opts=[];saveAll();mapScreen();};
 pickCard('Forge: upgrade one card',c=>{c.up=1;AU.tone(880,.3,'triangle',.12);toast(CARDS[c.id].n+' upgraded');back();},()=>{sheet(`<h2>Leave the forge?</h2><p>You can still upgrade a card.</p><div class="row cen"><button class="br" id="qN">${IC.back} Back to the forge</button><button class="br rust" id="qY">Leave without upgrading</button></div>`);bind('qN',forge);bind('qY',back);},c=>!c.up&&CARDS[c.id].t!=='x');}
function rest(){const h=Math.round(RUN.flameMax*(RUN.tide>=7?.3:.5));RUN.flame=Math.min(RUN.flameMax,RUN.flame+h);sheet(`<h2>The Hearth</h2><p>You trim the wick and feed the Flame. It heals ${h}.</p><p>Flame ${RUN.flame}/${RUN.flameMax}</p><div class="row cen"><button class="br" id="ok">${IC.back} Back to the climb</button></div>`);bind('ok',()=>{closeSheet();saveAll();mapScreen();});}
function shrine(){relicChoice(()=>{saveAll();mapScreen();});}
function relicChoice(after){const opts=shuf(Object.keys(RELICS).filter(k=>!RUN.relics.includes(k))).slice(0,3);
 sheet(XB()+`<h2>Choose a charm</h2>${opts.map((k,i)=>`<button class="opt" id="r_${i}"><canvas width="120" height="120" data-r="${k}"></canvas><div><b>${RELICS[k].n}</b><small>${RELICS[k].d}</small></div></button>`).join('')}<div class="row cen"><button class="br sea" id="skip">Skip</button></div>`);
 $('sh').querySelectorAll('canvas[data-r]').forEach(cv=>cv.getContext('2d').drawImage(relicCanvas(cv.dataset.r),0,0));
 opts.forEach((k,i)=>bind('r_'+i,()=>{gainRelic(k);closeSheet();after();}));const sk=()=>{closeSheet();after();};bind('skip',sk);bind('xC',sk);}
function gainRelic(k){RUN.relics.push(k);if(k==='whale'){RUN.flameMax+=15;RUN.flame+=15;}AU.tone(988,.3,'triangle',.12);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveAll();});addEventListener('pagehide',saveAll);
fit();loop(frame);title();
if(location.search.includes('gallery')){scr='gal';setTimeout(()=>{$('title').hidden=true;window.PAUSED=true;const c=cx;c.setTransform(PR,0,0,PR,0,0);c.fillStyle='#3a4a5a';c.fillRect(0,0,VW,VH);Object.keys(FIG).forEach((k,i)=>{c.save();c.translate(80+(i%7)*140,170+Math.floor(i/7)*190);c.scale(1.3,1.3);FIG[k].f(c,0);c.restore();c.fillStyle='#fff';c.font='12px Georgia';c.fillText(k,40+(i%7)*140,190+Math.floor(i/7)*190);});},300);}
</script></body></html>
