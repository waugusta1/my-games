let song=null,want={song:null,amb:{}},seqTimer=null;
function seeded(n){let a=n>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  const old=song;const bus=ac.createGain();bus.gain.value=0;bus.connect(musicBus);bus.gain.linearRampToValueAtTime(1,now()+2.5);
  if(old){old.bus.gain.cancelScheduledValues(now());old.bus.gain.setValueAtTime(old.bus.gain.value,now());old.bus.gain.linearRampToValueAtTime(0,now()+2);setTimeout(()=>{try{old.bus.disconnect();}catch(_){}},2600);}

function stopSong(){if(!song)return;const s=song;song=null;s.bus.gain.cancelScheduledValues(now());s.bus.gain.setValueAtTime(s.bus.gain.value,now());s.bus.gain.linearRampToValueAtTime(0,now()+1.5);setTimeout(()=>{try{s.bus.disconnect();}catch(_){}},1800);}
const SECTIONS=['intro','a','a','b','a','b','break','b'];
function schedule(){if(!song||!ac)return;const s=song,st=s.st,spb=60/st.bpm/4;
  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;
    if(step===0&&bar%4===0){s.prog=st.prog[Math.floor(s.g()*st.prog.length)];if(bar%16===0&&bar>0){s.motifs[Math.floor(s.g()*3)]=makeMotif(s.g,8);}}
    const deg=s.prog[bar%4],ch=chordNotes(st,deg),sw=(step%2)?st.swing*spb:0,T=t+sw;
    if(step===0)ch.slice(0,3).forEach(n=>INS[st.pad](n,T,spb*16,sec==='intro'?.5:.42,dest));
    if(sec!=='intro'){const bp=st.bass==='synthbass'?[0,3,6,8,10,14]:[0,6,8];if(bp.includes(step))INS[st.bass](ch[0]-24+(step===8&&s.g()<.3?7:0),T,spb*(step===0?5:2.5),.55,dest);}

      if(idx!=null)INS[st.arp](ch[idx]+12,T,spb*2,.3*(sec==='b'?1:.8),dest);}
    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}
    const D=DRUMS[st.drum];if(D&&sec!=='intro'){const k=s.step%32;const ki=D.kick[k]==='x',sn=D.snare&&D.snare[k]==='x',ht=D.hat&&D.hat[k]==='x';const lvl=(sec==='break'?.5:1)*I;
      if(ki&&sec!=='break')DR[D.k](T,.8*lvl,dest);if(sn)DR[D.s||'snare'](T,.6*lvl,dest);if(ht)DR[D.h||'hat'](T,(.5+(k%4===2?.3:0))*lvl,dest);if(k===0&&bar%8===0&&sec==='b'&&st.drum!=='soft'&&st.drum!=='lofi')DR.crash(T,.5,dest);}
    s.step++;s.next+=spb;}}

function menu(){$('menu').hidden=false;$('over').hidden=true;let unl=1;for(let i=1;i<=LEVELS;i++){if(save.lv[i])unl=i+1;}const m=$('menu');
  const tabs=`<div class="row">${[['levels','Levels'],['shop','Shop']].map(([k,n])=>`<button class="btn ${tab===k?'c':'s'}" data-tab="${k}">${n}</button>`).join('')}</div>`;
  let body='';if(tab==='levels'){body=`<div class="lv">${Array.from({length:LEVELS},(_,i)=>{const n=i+1,lock=n>unl;return`<button class="l${lock?' lock':''}${n%10===0?' boss':''}" data-l="${n}">${lock?'🔒':n}<small>${'★'.repeat(save.lv[n]||0)}</small></button>`;}).join('')}</div>
    <div class="row"><button class="btn c" id="endless" ${save.lv[30]?'':'disabled style="opacity:.4"'}>∞ Endless${save.endless?' · best '+save.endless:''}</button></div><div class="sub" style="font-size:14px">Slide anywhere to move the paddle. Catch capsules: <b style="color:#3ae0ff">3</b> multi-ball, <b style="color:#7aff9a">W</b> wide, <b style="color:#ff5a5a">L</b> lasers, <b style="color:#b89aff">S</b> slow, <b style="color:#ffb04a">F</b> fireball, <b style="color:#ffd23a">M</b> magnet. Dodge the grey shrink!</div>`;}
  else body=`<div class="sub">Coins: <b style="color:#ffd23a">${save.coins}</b></div><div style="font-weight:700">Paddles</div><div class="shop">${PADS.map((P,i)=>`<div class="it${save.paddle===i?' on':''}" data-p="${i}"><span data-pt="${i}"></span>${P.n}<small>${save.ownP.includes(i)?(save.paddle===i?'Equipped':'Owned'):P.cost+' coins'}</small></div>`).join('')}</div>
    <div style="font-weight:700">Ball trails</div><div class="shop">${TRAILS.map((T,i)=>`<div class="it${save.trail===i?' on':''}" data-t="${i}"><div style="height:14px;margin:6px 10px;border-radius:7px;background:${T.rb?'linear-gradient(90deg,red,orange,yellow,lime,cyan,violet)':T.c||'transparent'};${T.c||T.rb?'':'border:1px dashed #666'}"></div>${T.n}<small>${save.ownT.includes(i)?(save.trail===i?'Equipped':'Owned'):T.cost+' coins'}</small></div>`).join('')}</div>`;
  m.innerHTML=`<h1>BRICK BLITZ</h1><div class="sub">30 levels, 3 bosses, then endless. Best score ${save.best} · ${save.bricks} bricks smashed</div>${tabs}${body}<div class="row">${state==='paused'?'<button class="btn" id="resume">▶ Resume</button>':''}<button class="btn s" id="sndB"></button></div>`;
  m.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;SND.play('tap');menu();});
  m.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>{const n=+e.dataset.l;if(n>unl){SND.play('error');return;}lives=3;score=0;coinsRun=0;SND.play('tap');startLevel(n);});
  if($('endless'))$('endless').onclick=()=>{if(!save.lv[30])return;lives=3;score=0;startLevel(31);};if($('resume'))$('resume').onclick=()=>{m.hidden=true;$('pause').hidden=false;state='play';};
  m.querySelectorAll('[data-pt]').forEach(e=>e.replaceWith(padThumb(PADS[+e.dataset.pt])));
  m.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{const i=+e.dataset.p;if(!save.ownP.includes(i)){if(save.coins<PADS[i].cost){SND.play('error');return;}save.coins-=PADS[i].cost;save.ownP.push(i);SND.play('buy');}save.paddle=i;persist();menu();});
  m.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{const i=+e.dataset.t;if(!save.ownT.includes(i)){if(save.coins<TRAILS[i].cost){SND.play('error');return;}save.coins-=TRAILS[i].cost;save.ownT.push(i);SND.play('buy');}save.trail=i;persist();menu();});
  const st=()=>$('sndB').textContent='🎵 Music '+(SND.get('music')?'on':'off')+' · 🔊 '+(SND.get('sfx')?'on':'off');st();$('sndB').onclick=()=>{const a=SND.get('music'),b=SND.get('sfx');if(a&&b)SND.set('music',false);else if(!a&&b)SND.set('sfx',false);else{SND.set('music',true);SND.set('sfx',true);}st();};}
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=clamp((now-last)/1000,0,.04);last=now;if(state==='play'){update(dt);}else if(state==='menu'||state==='paused'){for(const s of stars){s.y+=s.z*12*dt;if(s.y>H)s.y-=H;}}draw();}
window.__bb={get state(){return state;},startLevel,update,get bricks(){return bricks;},get balls(){return balls;},pad,launch};
bricks=buildLevel(1);menu();addEventListener('pointerdown',()=>{if(state==='menu')SND.music('arcade');},{once:true});requestAnimationFrame(loop);
})();

});</script>
