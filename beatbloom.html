const ksCache={};

let song=null,want={song:null,amb:{}},seqTimer=null;
function seeded(n){let a=n>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function scaleNote(st,i){const sc=SC[st.sc],n=sc.length;return st.root+sc[((i%n)+n)%n]+12*Math.floor(i/n);}
function makeMotif(g,len){const m=[];for(let i=0;i<len;i++){m.push(g()<.25?null:{d:Math.floor(g()*5)-2,l:g()<.3?2:1});}return m;}
function startSong(name){const st=STY[name];if(!st)return;if(song&&song.name===name)return;const g=seeded(name.length*977+(Date.now()/86400000|0));
  const old=song;const bus=ac.createGain();bus.gain.value=0;bus.connect(musicBus);bus.gain.linearRampToValueAtTime(1,now()+2.5);
  if(old){old.bus.gain.cancelScheduledValues(now());old.bus.gain.setValueAtTime(old.bus.gain.value,now());old.bus.gain.linearRampToValueAtTime(0,now()+2);setTimeout(()=>{try{old.bus.disconnect();}catch(_){}},2600);}
  song={name,st,bus,step:0,next:now()+.15,bar:0,g,motifs:[makeMotif(g,8),makeMotif(g,8),makeMotif(g,8)],prog:st.prog[0],section:0,intensity:1};
  if(!seqTimer)seqTimer=setInterval(schedule,40);}
function stopSong(){if(!song)return;const s=song;song=null;s.bus.gain.cancelScheduledValues(now());s.bus.gain.setValueAtTime(s.bus.gain.value,now());s.bus.gain.linearRampToValueAtTime(0,now()+1.5);setTimeout(()=>{try{s.bus.disconnect();}catch(_){}},1800);}
const SECTIONS=['intro','a','a','b','a','b','break','b'];
function schedule(){if(!song||!ac)return;const s=song,st=s.st,spb=60/st.bpm/4;
  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;
    if(step===0&&bar%4===0){s.prog=st.prog[Math.floor(s.g()*st.prog.length)];if(bar%16===0&&bar>0){s.motifs[Math.floor(s.g()*3)]=makeMotif(s.g,8);}}
    const deg=s.prog[bar%4],ch=chordNotes(st,deg),sw=(step%2)?st.swing*spb:0,T=t+sw;
    if(step===0)ch.slice(0,3).forEach(n=>INS[st.pad](n,T,spb*16,sec==='intro'?.5:.42,dest));
    if(sec!=='intro'){const bp=st.bass==='synthbass'?[0,3,6,8,10,14]:[0,6,8];if(bp.includes(step))INS[st.bass](ch[0]-24+(step===8&&s.g()<.3?7:0),T,spb*(step===0?5:2.5),.55,dest);}
    if(sec!=='intro'&&sec!=='break'||sec==='break'&&step%4===0){const ap=st.arpPat;let idx=null;if(ap==='up'&&step%2===0)idx=(step/2)%4;else if(ap==='down'&&step%2===0)idx=3-(step/2)%4;else if(ap==='wide'&&step%4===0)idx=[0,2,1,3][step/4];else if(ap==='bounce'&&[0,3,6,8,11,14].includes(step))idx=[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(step)];
      if(idx!=null)INS[st.arp](ch[idx]+12,T,spb*2,.3*(sec==='b'?1:.8),dest);}
    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}
    const D=DRUMS[st.drum];if(D&&sec!=='intro'){const k=s.step%32;const ki=D.kick[k]==='x',sn=D.snare&&D.snare[k]==='x',ht=D.hat&&D.hat[k]==='x';const lvl=(sec==='break'?.5:1)*I;
      if(ki&&sec!=='break')DR[D.k](T,.8*lvl,dest);if(sn)DR[D.s||'snare'](T,.6*lvl,dest);if(ht)DR[D.h||'hat'](T,(.5+(k%4===2?.3:0))*lvl,dest);if(k===0&&bar%8===0&&sec==='b'&&st.drum!=='soft'&&st.drum!=='lofi')DR.crash(T,.5,dest);}
    s.step++;s.next+=spb;}}

function lin(a,t){const i=t|0,f=t-i;return i+1<a.length?a[i]*(1-f)+a[i+1]*f:0;}

/* ---------- game ---------- */
let state='menu',buf=null,src=null,t0=0,notes=[],AN=null,cur=null,sc=0,combo=0,maxC=0,cnt={p:0,g:0,o:0,m:0},pauseAt=0,parts=[],blooms=[],judgeT=0,lastFrame=0;
const AC=()=>SND.ac;function now(){return state==='play'?AC().currentTime-t0-save.off/1000:pauseAt;}
async function load(i){const s=SONGS[i];if(cache[s.f])return cache[s.f];$('loading').hidden=false;$('ldT').textContent='Downloading '+s.n+'…';
  const base=(window.MUSIC_BASE||'music/');const r=await fetch(base+s.f+'.mp3');if(!r.ok)throw new Error('download failed');const ab=await r.arrayBuffer();
  const b=await new Promise((res,rej)=>{const p=AC().decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);});

async function startSong(){SND.unlock&&SND.unlock();SND.music(null);const i=save.song;try{AN=await load(i);}catch(e){$('loading').hidden=true;alert('Could not load that song. Check your connection.');return;}

  state='play';$('menu').hidden=true;$('res').hidden=true;$('hud').hidden=false;$('pauseB').hidden=false;$('songN').textContent=cur.n+' · '+DIFF[save.diff].n;}
function stopSrc(){if(src){try{src.onended=null;src.stop();}catch(_){}src=null;}}
function finish(){state='res';stopSrc();$('hud').hidden=true;$('pauseB').hidden=true;$('combo').hidden=true;const tot=notes.length||1,acc=(cnt.p+cnt.g*.7+cnt.o*.4)/tot;const gr=acc>=.95?'S':acc>=.88?'A':acc>=.78?'B':acc>=.65?'C':'D';

  $('resT').textContent=cur.n+' · '+DIFF[save.diff].n;$('grade').textContent=gr;$('newB').textContent=nb?'🏆 New best!':'Best '+old.s;
  $('stats').innerHTML=`<span>Score</span><span>${sc}</span><span>Accuracy</span><span>${(acc*100).toFixed(1)}%</span><span>Max combo</span><span>${maxC}</span><span>🌸 Perfect</span><span>${cnt.p}</span><span>🌼 Great</span><span>${cnt.g}</span><span>🌱 Good</span><span>${cnt.o}</span><span>🥀 Miss</span><span>${cnt.m}</span>`;
  $('res').hidden=false;SND.play(gr==='S'||gr==='A'?'fanfare':'success');SND.music('calm');}
/* input */
const laneX=l=>{const lw=Math.min(W*.8,520)/4;return W/2-lw*2+lw*(l+.5);},laneW=()=>Math.min(W*.8,520)/4,hitY=()=>H-Math.max(110,H*.16);
const held=[0,0,0,0];
function press(l){if(state!=='play')return;held[l]=.15;const tn=now();let best=null,bd=.16;for(const n of notes){if(n.hit||n.l!==l)continue;const d=Math.abs(n.t-tn);if(d<bd){bd=d;best=n;}if(n.t>tn+.2)break;}
  if(!best){SND.tone({type:'sine',f:180,d:.05,v:.03});return;}best.hit=1;const j=bd<.05?'p':bd<.095?'g':'o';cnt[j]++;combo++;maxC=Math.max(maxC,combo);sc+=Math.round(({p:300,g:200,o:100})[j]*(1+Math.min(combo,100)/50));
  showJ(j==='p'?'PERFECT':j==='g'?'GREAT':'GOOD',j==='p'?'#ffd36a':j==='g'?'#7affc8':'#7ab8ff');hitFx(l,j);}
const PENT=[0,2,4,7,9,12,14,16];
function hitFx(l,j){const x=laneX(l),y=hitY();const c=LANEC[l];for(let i=0;i<(j==='p'?18:10);i++){const a=R()*TAU,s=80+R()*220;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,l:.7,c,r:3+R()*4,petal:R()<.6});}

  if(j==='p'||combo%5===0)blooms.push({x:30+R()*(W-60),y:H*.12+R()*H*.55,s:0,mx:10+R()*22+Math.min(combo,60)*.3,c:LANEC[(R()*4)|0],rot:R()*TAU,n:5+((R()*3)|0)});if(blooms.length>140)blooms.shift();}
function showJ(t,c){const e=$('judge');e.textContent=t;e.style.color=c;judgeT=.45;}
function miss(n){n.hit=2;cnt.m++;combo=0;showJ('MISS','#ff6a6a');}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;const lw=laneW(),x0=W/2-lw*2;let l=Math.floor((e.clientX-x0)/lw);if(e.clientX<x0)l=0;if(e.clientX>x0+lw*4)l=3;press(clamp(l,0,3));});
addEventListener('keydown',e=>{if(e.repeat)return;const k={KeyD:0,KeyF:1,KeyJ:2,KeyK:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3}[e.code];if(k!=null)press(k);if(e.code==='Escape'&&state==='play')pause();});
function pause(){if(state!=='play')return;pauseAt=now();state='pause';AC().suspend();$('pause').hidden=false;}
$('pauseB').onclick=pause;$('resB').onclick=()=>{AC().resume();state='play';$('pause').hidden=true;};$('quitB').onclick=()=>{AC().resume();stopSrc();state='menu';$('pause').hidden=true;$('hud').hidden=true;$('pauseB').hidden=true;$('combo').hidden=true;menu();SND.music('calm');};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
/* render */
function petal(x,y,r,c,rot,n){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=c;for(let i=0;i<n;i++){ctx.rotate(TAU/n);ctx.beginPath();ctx.ellipse(r*.55,0,r*.55,r*.28,0,0,TAU);ctx.fill();}ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.arc(0,0,r*.22,0,TAU);ctx.fill();ctx.restore();}
function draw(dt){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c0f38');g.addColorStop(1,'#3a1a40');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // garden blooms
  for(const b of blooms){b.s=Math.min(b.mx,b.s+dt*b.mx*3);ctx.globalAlpha=.55;ctx.strokeStyle='#3a8a5a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,H);ctx.quadraticCurveTo(b.x+20,(H+b.y)/2,b.x,b.y);ctx.stroke();petal(b.x,b.y,b.s*(1+pulse*.08),b.c,b.rot+beat*.05,b.n);}ctx.globalAlpha=1;
  if(state!=='play'&&state!=='pause')return;const lw=laneW(),x0=W/2-lw*2,hy=hitY(),tn=now(),spd=H*.62*save.spd;

  // receptors (flowers)
  for(let l=0;l<4;l++){const r=lw*.34*(1+(held[l]>0?.12:0)+pulse*.05);ctx.globalAlpha=held[l]>0?1:.55;petal(laneX(l),hy,r*1.6,LANEC[l],l+beat*.1,6);ctx.globalAlpha=1;}

    const x=laneX(n.l),r=lw*.26;ctx.globalAlpha=n.hit===2?.3:1;const sg=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);sg.addColorStop(0,'#fff');sg.addColorStop(.35,LANEC[n.l]);sg.addColorStop(1,'#2a1040');ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(x,y,r*.85,r,0,0,TAU);ctx.fill();

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.l<=0){parts.splice(i,1);continue;}ctx.globalAlpha=clamp(p.l*1.5,0,1);ctx.fillStyle=p.c;ctx.beginPath();if(p.petal)ctx.ellipse(p.x,p.y,p.r*1.4,p.r*.7,p.vx*.01,0,TAU);else ctx.arc(p.x,p.y,p.r*.6,0,TAU);ctx.fill();}ctx.globalAlpha=1;

  const ce=$('combo');if(combo>=5){ce.hidden=false;ce.textContent=combo;ce.style.transform='translate(-50%,-50%) scale('+(1+pulse*.12)+')';}else ce.hidden=true;
  if(judgeT>0){judgeT-=dt;$('judge').style.opacity=clamp(judgeT*3,0,1);}else $('judge').style.opacity=0;

function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-lastFrame)/1000||0);lastFrame=t;if(state!=='play'&&state!=='pause'&&blooms.length<40&&R()<dt*3)blooms.push({x:R()*W,y:H*.1+R()*H*.7,s:0,mx:8+R()*24,c:LANEC[(R()*4)|0],rot:R()*TAU,n:5+((R()*3)|0)});draw(dt);}
/* menu */
function menu(){$('menu').hidden=false;$('res').hidden=true;
  $('songs').innerHTML=SONGS.map((s,i)=>{const b=save.best[s.f+save.diff];return`<div class="song${i===save.song?' sel':''}" data-i="${i}"><span class="st">${b?b.g+' · '+b.s:''}</span><b>${s.n}</b><small>${s.a} · ${s.mood}</small></div>`;}).join('');

$('calB').onclick=()=>{save.off=save.off>=150?-150:save.off+25;persist();menu();};$('spdB').onclick=()=>{save.spd=save.spd>=2?.7:Math.round((save.spd+.1)*10)/10;persist();menu();};$('sfxB').onclick=()=>{SND.set('sfx',!SND.get('sfx'));menu();};
$('goB').onclick=startSong;$('retryB').onclick=startSong;$('backB').onclick=()=>{menu();};
addEventListener('pointerdown',()=>{SND.unlock&&SND.unlock();if(state==='menu')SND.music('calm');},{once:true});
