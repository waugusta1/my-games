/* Cloud save: keeps game saves in your Claude account so they survive across devices and cleared browser storage. */
(()=>{const mem={},has={};let ls=null;try{ls=window.localStorage;ls.getItem('__probe');}catch(_){ls=null;}
const lget=k=>{try{return ls?ls.getItem(k):null;}catch(_){return null;}},lset=(k,v)=>{try{if(!ls)return;v===null?ls.removeItem(k):ls.setItem(k,v);}catch(_){}};
const safe=k=>'s_'+k.replace(/[^A-Za-z0-9_\-~:@+]/g,'_');
let db=null,uid=null,col=null;const pending=new Map();let timer=0,busy=false;
async function flush(){clearTimeout(timer);timer=0;if(!col||busy)return;busy=true;try{while(pending.size){const[k,v]=pending.entries().next().value;pending.delete(k);
  try{const ref=col.doc(safe(k));if(v===null)await ref.delete();else if(v.length<240000)await ref.set({k,v,t:Date.now()});}catch(e){if(e&&e.code==='unavailable'){pending.set(k,v);await new Promise(r=>setTimeout(r,1500+Math.random()*1000));}}}}finally{busy=false;}}
const sched=()=>{if(!timer)timer=setTimeout(flush,2000);};
window.__store={get(k){return has[k]?mem[k]:lget(k);},
  set(k,v){v=String(v);has[k]=1;mem[k]=v;lset(k,v);lset('__t:'+k,String(Date.now()));pending.set(k,v);sched();},
  remove(k){has[k]=1;mem[k]=null;lset(k,null);lset('__t:'+k,String(Date.now()));pending.set(k,null);sched();}};
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});addEventListener('pagehide',flush);
async function load(){if(!window.claude||!claude.use)return;const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;const id=await u.id();if(!id)return;
  db=d;uid=id;col=db.collection('data/users/'+uid);const snap=await col.get();const seen=new Set();
  for(const doc of snap.docs){const b=doc.data();if(!b||typeof b.k!=='string')continue;seen.add(b.k);const lt=+(lget('__t:'+b.k)||0),lv=lget(b.k);
    if(lv!==null&&lt>(b.t||0)){pending.set(b.k,lv);}else{has[b.k]=1;mem[b.k]=b.v;lset(b.k,b.v);lset('__t:'+b.k,String(b.t||Date.now()));}}
  if(ls){for(let i=0;i<ls.length;i++){const k=ls.key(i);if(!k||k.startsWith('__')||seen.has(k))continue;pending.set(k,lget(k));}}
  if(pending.size)sched();}
let ready=false;const waiters=[];
window.__boot=fn=>{if(ready)fn();else waiters.push(fn);};
const go=()=>{if(ready)return;ready=true;waiters.splice(0).forEach(f=>{try{f();}catch(e){setTimeout(()=>{throw e;});}});};
Promise.race([load().catch(()=>{}),new Promise(r=>setTimeout(r,5000))]).then(go);
})();
</script>

/* ================= noise ================= */
function h2(x,y,s){let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h2(xi,yi,s),b=h2(xi+1,yi,s),c=h2(xi,yi+1,s),d=h2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

const terrH=(x,y)=>fbm(x/48,y/48,SEED,4),terrM=(x,y)=>fbm(x/40+500,y/40,SEED+7,3),terrR=(x,y)=>fbm(x/30-300,y/30+200,SEED+13,3);

/* ================= world data ================= */
const G_WATER=0,G_SAND=1,G_GRASS=2,G_ROCK=3;
function classify(h,r){return h<0.37?G_WATER:h<0.405?G_SAND:(r>0.6&&h>0.43)?G_ROCK:G_GRASS;}
let SP=SV&&SV.spawn;
if(!SP){SP=[0,0];outer:for(let rr=0;rr<300;rr+=2)for(let a=0;a<12;a++){const tx=Math.round(Math.cos(a/12*TAU)*rr),ty=Math.round(Math.sin(a/12*TAU)*rr);
  if(terrH(tx+.5,ty+.5)>0.47&&terrR(tx+.5,ty+.5)<0.55){SP=[tx,ty];break outer;}}}
const chunks=new Map();

function genChunk(cx,cy){
  const key=ck(cx,cy);let c=chunks.get(key);if(c)return c;

  for(let j=0;j<=16;j++)for(let i=0;i<=16;i++){const x=cx*CH+i,y=cy*CH+j,k=(j*17+i)*3;c.grid[k]=terrH(x,y);c.grid[k+1]=terrM(x,y);c.grid[k+2]=terrR(x,y);}

    let h=0,m=0,r=0;for(const[a,b]of[[0,0],[1,0],[0,1],[1,1]]){const k=((j+b)*17+i+a)*3;h+=c.grid[k];m+=c.grid[k+1];r+=c.grid[k+2];}
    c.ground[j*16+i]=classify(h/4,r/4);mAt[j*16+i]=m/4;
  }

  if(md){for(const[t,idx,v,d]of md.o){c.objs.set(idx,{t,x:cx*CH+(idx%16),y:cy*CH+((idx/16)|0),v,d});}for(const[idx,t]of md.f)c.floors.set(idx,t);}

}

function mkSpr(w,h,ax,ay,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g);return{c,ax,ay,w,h};}

/* ================= chunk rendering ================= */
const tmp=document.createElement('canvas');tmp.width=tmp.height=256;const tctx=tmp.getContext('2d');const img=tctx.createImageData(256,256);
const FLC=['#f4f1e8','#ffd84d','#e46a9b','#9a7ce0'];
function renderChunk(c){
  const d=img.data,gr=c.grid,bx=c.cx*256,by=c.cy*256;
  for(let py=0;py<256;py++){const gy=py/16,j=gy|0,fy=gy-j;
    for(let px=0;px<256;px++){const gx=px/16,i=gx|0,fx=gx-i;
      const k00=(j*17+i)*3,k10=k00+3,k01=k00+51,k11=k00+54;
      const w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy;
      const h=gr[k00]*w00+gr[k10]*w10+gr[k01]*w01+gr[k11]*w11;
      const m=gr[k00+1]*w00+gr[k10+1]*w10+gr[k01+1]*w01+gr[k11+1]*w11;
      const r=gr[k00+2]*w00+gr[k10+2]*w10+gr[k01+2]*w01+gr[k11+2]*w11;
      let Rr,G,B;
      if(h<0.37){const t=clamp((h-0.27)/0.10,0,1);Rr=22+t*48;G=74+t*78;B=124+t*58;if(h>0.362){const f=(h-0.362)/0.008;Rr=lerp(Rr,190,f*.55);G=lerp(G,214,f*.55);B=lerp(B,214,f*.55);}}
      else if(h<0.405){Rr=212;G=196;B=150;if(h<0.38){const w=(0.38-h)/0.01;Rr-=w*34;G-=w*32;B-=w*24;}}
      else{const dry=clamp((0.56-m)*2.6,0,1);Rr=lerp(66,124,dry);G=lerp(118,136,dry);B=lerp(46,68,dry);
        const s=(vnoise((bx+px)/40,(by+py)/40,SEED+40)-0.5)*30;Rr+=s;G+=s;B+=s*.5;
        if(h<0.425){const t=(0.425-h)/0.02;Rr=lerp(Rr,212,t);G=lerp(G,196,t);B=lerp(B,150,t);}
        if(h>0.43&&r>0.55){const t=clamp((r-0.55)/0.05,0,1),s2=(vnoise((bx+px)/12,(by+py)/12,SEED+41)-0.5)*24;Rr=lerp(Rr,122+s2,t);G=lerp(G,119+s2,t);B=lerp(B,110+s2,t);}}
      const n=h2(bx+px,by+py,SEED)*14-7,o=(py*256+px)*4;
      d[o]=Rr+n;d[o+1]=G+n;d[o+2]=B+n;d[o+3]=255;
    }}
  tctx.putImageData(img,0,0);
  if(!c.canvas){c.canvas=document.createElement('canvas');c.canvas.width=c.canvas.height=CPX;}
  const g=c.canvas.getContext('2d');g.imageSmoothingEnabled=true;g.drawImage(tmp,0,0,CPX,CPX);
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){const tx=c.cx*CH+i,ty=c.cy*CH+j,gt=c.ground[j*16+i],x=i*TS,y=j*TS;
    if(gt===G_GRASS){const n=(h2(tx,ty,SEED+50)*4)|0;g.strokeStyle='rgba(30,60,20,.45)';g.lineWidth=1;
      for(let k=0;k<n;k++){const ox=x+h2(tx+k,ty,SEED+51)*28+2,oy=y+h2(tx,ty+k,SEED+52)*26+4;g.beginPath();g.moveTo(ox,oy);g.lineTo(ox-2,oy-5);g.moveTo(ox+2,oy);g.lineTo(ox+2,oy-6);g.moveTo(ox+4,oy);g.lineTo(ox+6,oy-4);g.stroke();}
      if(h2(tx,ty,SEED+53)<.05)for(let k=0;k<3;k++)Ci(g,x+6+h2(tx+k,ty,9)*20,y+6+h2(tx,ty+k,9)*20,1.8,FLC[(h2(tx,ty,SEED+54)*4)|0]);}
    else if(gt===G_ROCK){g.fillStyle='rgba(60,58,52,.35)';for(let k=0;k<3;k++)g.fillRect(x+h2(tx+k,ty,7)*30,y+h2(tx,ty+k,7)*30,2,1.5);}
  }
  for(const[idx,t]of c.floors)drawFloor(g,t,(idx%16)*TS,((idx/16)|0)*TS);
  c.gfxDirty=false;
}

  for(let i=0;i<inv.length&&n;i++)if(!inv[i]){const k=Math.min(n,stackMax(id));inv[i]={id,n:k};n-=k;}return n;}

function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();nbuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(_){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='sine',v=.05,f2=0,dl=0){if(!AC||muted)return;const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v,freq=1200,q=1,dl=0){if(!AC||muted)return;const t=AC.currentTime+dl,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,R()*.3);s.stop(t+d);}

function toast(s){toasts.push({s,t:3});if(toasts.length>4)toasts.shift();}

addEventListener('keydown',e=>{initAudio();const k=e.code;if(!keys[k])pressed[k]=true;keys[k]=true;if(['Space','Tab'].includes(k))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.l=mouse.r=false;});
function mpos(e){const b=cv.getBoundingClientRect();mouse.x=(e.clientX-b.left)/b.width*W;mouse.y=(e.clientY-b.top)/b.height*H;}
cv.addEventListener('mousemove',mpos);
cv.addEventListener('mousedown',e=>{initAudio();cv.focus();mpos(e);if(e.button===0){mouse.l=true;mouse.lc=true;}else if(e.button===2){mouse.r=true;mouse.rc=true;}e.preventDefault();});

cv.addEventListener('wheel',e=>{e.preventDefault();if(panel){scroll=clamp(scroll+(e.deltaY>0?1:-1),0,Math.max(0,RECIPES.length-8));}else P.sel=(P.sel+(e.deltaY>0?1:-1)+9)%9;},{passive:false});

/* ================= helpers ================= */
const tileOfW=(x,y)=>[Math.floor(x/TS),Math.floor(y/TS)];
function solidTile(tx,ty){if(groundAt(tx,ty)===G_WATER)return true;const o=objAt(tx,ty);return !!(o&&OBJ[o.t].block&&!(o.t==='door'&&o.d));}
function collide(){
  const r=9,x0=Math.floor((P.x-r)/TS),x1=Math.floor((P.x+r)/TS),y0=Math.floor((P.y-r)/TS),y1=Math.floor((P.y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    let bx0,by0,bx1,by1;const o=objAt(tx,ty);
    if(groundAt(tx,ty)===G_WATER){bx0=tx*TS;by0=ty*TS;bx1=bx0+TS;by1=by0+TS;}
    else if(o&&OBJ[o.t].block&&!(o.t==='door'&&o.d)){const b=OBJ[o.t].box;bx0=tx*TS+b[0]*TS;by0=ty*TS+b[1]*TS;bx1=tx*TS+b[2]*TS;by1=ty*TS+b[3]*TS;}
    else continue;
    const cx=clamp(P.x,bx0,bx1),cy=clamp(P.y,by0,by1),dx=P.x-cx,dy=P.y-cy,d=Math.hypot(dx,dy);
    if(d<r){if(d>0.001){P.x=cx+dx/d*r;P.y=cy+dy/d*r;}else{P.y=by0-r;}}
  }
}
function spawnDrop(id,n,x,y){drops.push({id,n,x,y,vx:rnd(-50,50),vy:rnd(-50,50),z:0,vz:rnd(90,140),age:0});}
function burst(x,y,n,cols,sp=70,life=.5,sz=3,g=180){for(let i=0;i<n&&parts.length<350;i++){const a=R()*TAU,v=rnd(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:rnd(life*.5,life),col:cols[(R()*cols.length)|0],s:sz*rnd(.6,1.2),g});}}
const MATCOL={wood:['#a7774a','#6e4526','#d3a874'],stone:['#9d9a90','#6f6c64','#c4c0b5'],leaf:['#4f9a3a','#2c5a25','#7bbb5c','#d02a35']};
function anchorOf(o){return[o.x*TS+16,o.y*TS+28];}
function stationsNear(){const s=new Set();const ptx=Math.floor(P.x/TS),pty=Math.floor(P.y/TS);
  for(let ty=pty-4;ty<=pty+4;ty++)for(let tx=ptx-4;tx<=ptx+4;tx++){const o=objAt(tx,ty);if(o&&OBJ[o.t].station)s.add(o.t);}return s;}
function canCraft(r){if(r.st&&!nearSt.has(r.st))return false;for(const k in r.need)if(countItem(k)<r.need[k])return false;return true;}
function doCraft(r){if(!canCraft(r))return false;for(const k in r.need)takeItem(k,r.need[k]);const left=addItem(r.out,r.n);if(left)spawnDrop(r.out,left,P.x,P.y);return true;}

/* ================= targeting ================= */
let visObjs=[];
function reachOk(tx,ty){return Math.hypot(tx*TS+16-P.x,ty*TS+16-P.y)<=4.3*TS;}
function findTarget(){
  const wx=mouse.x+camX,wy=mouse.y+camY;
  for(let i=visObjs.length-1;i>=0;i--){const o=visObjs[i],pk=OBJ[o.t].pick,[ax,ay]=anchorOf(o);
    if(wx>=ax+pk[0]&&wx<=ax+pk[2]&&wy>=ay+pk[1]&&wy<=ay+pk[3]&&reachOk(o.x,o.y))return{k:'o',o,key:'o'+o.x+','+o.y};}
  const[tx,ty]=tileOfW(wx,wy);if(!reachOk(tx,ty))return{k:'far',tx,ty};
  const o=objAt(tx,ty);if(o)return{k:'o',o,key:'o'+tx+','+ty};
  if(floorAt(tx,ty))return{k:'f',tx,ty,key:'f'+tx+','+ty};
  return{k:'t',tx,ty};
}
function mineInfo(t){
  const h=held(),it=h&&ITEMS[h.id];
  if(t.k==='f'){const pick=it&&it.tool==='pick'?TOOLMULT[it.tier]:1;return{can:true,time:1.0/pick,mat:floorAt(t.tx,t.ty)==='floor_wood'?'wood':'stone'};}
  const d=OBJ[t.o.t];let mult=1;if(it&&it.tool&&it.tool===d.tool)mult=TOOLMULT[it.tier];
  if(d.min){const tier=it&&it.tool==='pick'?it.tier:0;if(tier<d.min)return{can:false,msg:d.min===1?'You need a pickaxe to break '+d.name.toLowerCase()+'.':'You need a stone pickaxe or better for iron.'};}
  return{can:true,time:d.hard/mult,mat:d.mat};
}
function breakTarget(t){
  if(t.k==='f'){const c=chunkOf(t.tx,t.ty),id=c.floors.get(li(t.tx,t.ty));c.floors.delete(li(t.tx,t.ty));c.gfxDirty=true;markMod(c);spawnDrop(id,1,t.tx*TS+16,t.ty*TS+16);SFX.brk(id==='floor_wood'?'wood':'stone');return;}
  const o=t.o,d=OBJ[o.t],c=chunkOf(o.x,o.y),[ax,ay]=anchorOf(o);
  if(o.t==='bush'){if(o.d<=0){o.d=wt+150;spawnDrop('berries',rint(2,4),ax,ay-8);SFX.brk('leaf');burst(ax,ay-10,10,MATCOL.leaf);markMod(c);return;}
    c.objs.delete(li(o.x,o.y));spawnDrop('stick',rint(1,2),ax,ay-6);}
  else{c.objs.delete(li(o.x,o.y));for(const dr of d.drops())if(dr&&dr[1]>0)spawnDrop(dr[0],dr[1],ax,ay-10);}
  SFX.brk(d.mat);burst(ax,ay-(o.t==='oak'||o.t==='pine'||o.t==='birch'?40:12),18,MATCOL[d.mat],120,.7,3.5);markMod(c);
}
function useRight(){
  const h=held(),it=h&&ITEMS[h.id];
  if(it&&it.food){if(P.hun>=99.5){toast('You are not hungry.');return;}P.hun=Math.min(100,P.hun+it.food);h.n--;if(!h.n)inv[P.sel]=null;SFX.eat();burst(P.x,P.y-10,6,['#d02a35','#8f4f28','#fff'],40,.4,2);return;}
  const t=findTarget();
  if(t.k==='o'){const o=t.o;if(o.t==='door'){o.d=o.d?0:1;if(!o.d&&Math.hypot(o.x*TS+16-P.x,o.y*TS+16-P.y)<26){o.d=1;toast('Step out of the doorway first.');return;}markMod(chunkOf(o.x,o.y));SFX.place();return;}
    if(OBJ[o.t].station){panel=true;return;}}
  if(!it||!(it.place||it.floor))return;
  if(t.k==='far'){SFX.deny();return;}
  const tx=t.tx!==undefined?t.tx:t.o.x,ty=t.ty!==undefined?t.ty:t.o.y,g=groundAt(tx,ty),c=chunkOf(tx,ty);
  if(!c||g===G_WATER){SFX.deny();toast('You cannot build on water.');return;}
  if(it.floor){if(c.floors.has(li(tx,ty))){SFX.deny();return;}c.floors.set(li(tx,ty),it.floor);c.gfxDirty=true;}
  else{if(objAt(tx,ty)){SFX.deny();return;}
    if(it.place==='sapling'&&g!==G_GRASS){toast('Saplings only grow on grass.');SFX.deny();return;}
    if(OBJ[it.place].block){const bx0=tx*TS,by0=ty*TS;if(P.x+9>bx0&&P.x-9<bx0+TS&&P.y+9>by0&&P.y-9<by0+TS){toast('You are standing there.');SFX.deny();return;}}
    c.objs.set(li(tx,ty),{t:it.place,x:tx,y:ty,v:(R()*3)|0,d:it.place==='sapling'?wt+120:0});}
  h.n--;if(!h.n)inv[P.sel]=null;markMod(c);SFX.place();burst(tx*TS+16,ty*TS+24,6,['#c9b089','#8a7a5a'],40,.3,2);
}

/* ================= chunk management ================= */
function ensureAround(){
  const pcx=Math.floor(P.x/CPX),pcy=Math.floor(P.y/CPX);
  for(let cy=pcy-2;cy<=pcy+2;cy++)for(let cx=pcx-2;cx<=pcx+2;cx++)genChunk(cx,cy);
  let rendered=0;
  const vx0=Math.floor(camX/CPX),vx1=Math.floor((camX+W)/CPX),vy0=Math.floor(camY/CPX),vy1=Math.floor((camY+H)/CPX);
  for(let cy=vy0;cy<=vy1;cy++)for(let cx=vx0;cx<=vx1;cx++){const c=genChunk(cx,cy);if(c.gfxDirty){renderChunk(c);rendered++;}}
  if(!rendered)for(const c of chunks.values()){if(c.gfxDirty&&Math.abs(c.cx-pcx)<=1&&Math.abs(c.cy-pcy)<=1){renderChunk(c);break;}}
  if(chunks.size>60)for(const[k,c]of chunks){if(Math.abs(c.cx-pcx)>3||Math.abs(c.cy-pcy)>3)chunks.delete(k);}
}

/* ================= update ================= */
const phase=()=>(wt%DAY)/DAY;
function darkness(){const p=phase();if(p<.6)return 0;if(p<.68)return(p-.6)/.08;if(p<.92)return 1;return 1-(p-.92)/.08;}
function update(dt){
  wt+=dt;
  if(pressed.KeyM){muted=!muted;toast(muted?'Sound off':'Sound on');}
  if(pressed.KeyH)showHelp=!showHelp;
  if(showHelp){if(pressed.Escape||pressed.Enter||pressed.Space||mouse.lc){showHelp=false;mouse.lc=false;}}
  if(pressed.KeyE||pressed.Tab||(panel&&pressed.Escape)){panel=!panel;if(!panel&&heldStack){const l=addItem(heldStack.id,heldStack.n);if(l)spawnDrop(heldStack.id,l,P.x,P.y);heldStack=null;}}
  for(let i=1;i<=9;i++)if(pressed['Digit'+i])P.sel=i-1;
  if(P.dead){if(mouse.lc||pressed.Space){P.dead=false;P.hp=100;P.hun=70;P.x=SP[0]*TS+16;P.y=SP[1]*TS+16;}mouse.lc=mouse.rc=false;}
  // movement
  let mx=0,my=0;const busy=panel||showHelp||P.dead;
  if(!busy){mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);}
  const l=Math.hypot(mx,my);const sprint=(keys.ShiftLeft||keys.ShiftRight)&&P.hun>5;
  if(l){const sp=(sprint?185:118)*dt/l;P.x+=mx*sp;collide();P.y+=my*sp;collide();P.walk+=dt*(sprint?14:10);
    stepPh+=dt*(sprint?14:10);if(stepPh>Math.PI){stepPh-=Math.PI;SFX.step();}}
  P.moving=!!l;
  P.ang=Math.atan2(mouse.y+camY-(P.y-4),mouse.x+camX-P.x);
  // survival
  P.hun=Math.max(0,P.hun-dt*(l&&sprint?.42:.16));
  if(P.hun<=0){P.hp-=dt*2;if(Math.random()<dt*.5)SFX.hurt();}else if(P.hun>50&&P.hp<100)P.hp=Math.min(100,P.hp+dt*.9);
  if(P.hp<=0&&!P.dead){P.dead=true;P.hp=0;toast('You starved. Keep food on you!');}
  // camera
  camX=lerp(camX,P.x-W/2,Math.min(1,dt*8));camY=lerp(camY,P.y-H/2,Math.min(1,dt*8));
  ensureAround();
  // mining / using
  const t=!busy?findTarget():null;lastTarget=t;
  if(!busy&&mouse.lc){const wx=mouse.x+camX,wy=mouse.y+camY;
    for(const rb of rabbits){if(Math.hypot(rb.x-wx,rb.y-wy)<20&&Math.hypot(rb.x-P.x,rb.y-P.y)<4.3*TS){const it=held()&&ITEMS[held().id];rb.hp-=it&&it.tool==='axe'?2:1;rb.flee=3;rb.hurt=.2;P.swing=.25;SFX.hit('leaf');
      burst(rb.x,rb.y-4,6,['#8b7355','#fff'],50,.4,2);if(rb.hp<=0){rb.dead=true;spawnDrop('raw_meat',rint(1,2),rb.x,rb.y);}mouse.lc=false;break;}}}
  if(!busy&&mouse.l&&t&&(t.k==='o'||t.k==='f')){
    if(mine.key!==t.key){mine.key=t.key;mine.t=0;mine.hitT=0;}
    const info=mineInfo(t);
    if(info.can){mine.t+=dt;mine.hitT-=dt;P.swing+=dt;if(mine.hitT<=0){mine.hitT=.32;SFX.hit(info.mat);const[ax,ay]=t.k==='o'?anchorOf(t.o):[t.tx*TS+16,t.ty*TS+20];burst(ax+rnd(-6,6),ay-14,4,MATCOL[info.mat],60,.4,2.5);}
      if(mine.t>=info.time){breakTarget(t);mine.key=null;mine.t=0;}}
    else if(mine.deniedKey!==t.key){mine.deniedKey=t.key;toast(info.msg);SFX.deny();}
  }else{mine.key=null;mine.t=0;if(!mouse.l)mine.deniedKey=null;P.swing=mouse.l?P.swing:0;}
  if(P.swing>0&&!mouse.l)P.swing=Math.max(0,P.swing-dt);
  if(!busy&&mouse.rc)useRight();
  // panel clicks
  if(panel&&mouse.lc)panelClick(keys.ShiftLeft||keys.ShiftRight);
  if(!panel&&!busy&&mouse.lc){const hb=hotbarHit();if(hb>=0)P.sel=hb;}
  mouse.lc=mouse.rc=false;
  // stations
  if((stT-=dt)<=0){stT=.3;nearSt=stationsNear();}
  // growth
  if((growT-=dt)<=0){growT=1;for(const c of chunks.values()){let ch=false;for(const o of c.objs.values()){
    if(o.t==='sapling'&&o.d&&wt>=o.d){o.t=R()<.3?'birch':R()<.5?'pine':'oak';o.v=(R()*3)|0;o.d=0;ch=true;}
    else if(o.t==='bush'&&o.d>0&&wt>=o.d){o.d=0;ch=true;}}
    if(ch)markMod(c);}}
  // drops
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.age+=dt;d.vz-=380*dt;d.z+=d.vz*dt;if(d.z<0){d.z=0;d.vz=-d.vz*.3;d.vx*=.6;d.vy*=.6;}
    d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.97;d.vy*=.97;
    const dx=P.x-d.x,dy=P.y-d.y,dd=Math.hypot(dx,dy);
    if(d.age>.45&&dd<70&&!P.dead){d.x+=dx/dd*Math.min(dd,260*dt);d.y+=dy/dd*Math.min(dd,260*dt);
      if(dd<14){const left=addItem(d.id,d.n);if(left<d.n){SFX.pop();toast('+'+(d.n-left)+' '+ITEMS[d.id].name);}if(left)d.n=left;else drops.splice(i,1);}}
    if(d.age>600)drops.splice(i,1);}
  // rabbits
  if((rabbitT-=dt)<=0){rabbitT=2.5;if(rabbits.length<6){const a=R()*TAU,dist=rnd(420,600),x=P.x+Math.cos(a)*dist,y=P.y+Math.sin(a)*dist,[tx,ty]=tileOfW(x,y);
    if(groundAt(tx,ty)===G_GRASS&&!solidTile(tx,ty))rabbits.push({x,y,vx:0,vy:0,hp:2,t:R()*3,hop:0,flee:0,hurt:0,face:1});}}
  for(let i=rabbits.length-1;i>=0;i--){const rb=rabbits[i];if(rb.dead||Math.hypot(rb.x-P.x,rb.y-P.y)>900){rabbits.splice(i,1);continue;}
    rb.t-=dt;rb.hurt-=dt;rb.flee-=dt;const dx=rb.x-P.x,dy=rb.y-P.y,dd=Math.hypot(dx,dy)||1;
    if(dd<110&&!P.dead)rb.flee=Math.max(rb.flee,1.2);
    if(rb.flee>0){rb.vx=dx/dd*115;rb.vy=dy/dd*115;}else if(rb.t<=0){rb.t=rnd(1,3);if(R()<.5){const a=R()*TAU;rb.vx=Math.cos(a)*35;rb.vy=Math.sin(a)*35;}else rb.vx=rb.vy=0;}
    if(rb.vx||rb.vy){rb.hop+=dt*(rb.flee>0?16:9);const nx=rb.x+rb.vx*dt,ny=rb.y+rb.vy*dt,[tx,ty]=tileOfW(nx,ny);if(solidTile(tx,ty)){rb.vx=-rb.vx;rb.vy=-rb.vy;rb.t=.5;}else{rb.x=nx;rb.y=ny;}if(rb.vx)rb.face=Math.sign(rb.vx);}}
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.97;}
  for(let i=toasts.length-1;i>=0;i--)if((toasts[i].t-=dt)<=0)toasts.splice(i,1);
  // ambience
  if((ambT-=dt)<=0){const dk=darkness();ambT=rnd(2.5,7);if(dk<.3){const f=rnd(2200,3400);for(let k=0;k<rint(2,4);k++)tone(f,.07,'sine',.012,f*1.25,k*.1);}else if(dk>.7){for(let k=0;k<6;k++)tone(4300,.025,'sine',.006,0,k*.06);ambT=rnd(1,3);}}
  if((saveT-=dt)<=0){saveT=15;persist();}
}
function persist(){try{__store.set(SK,JSON.stringify({seed:SEED,spawn:SP,mods,inv,wt,p:{x:P.x,y:P.y,hp:Math.max(1,P.hp),hun:P.hun,sel:P.sel}}));}catch(_){}}
addEventListener('beforeunload',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});

/* ================= drawing ================= */
const text=(s,x,y,size=14,col='#efe6d2',align='left',wt2=500,shadow=true)=>{ctx.font=wt2+' '+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';if(shadow){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillText(s,x+1,y+1.5);}ctx.fillStyle=col;ctx.fillText(s,x,y);};
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}}
function flame(x,y,s){const f=1+Math.sin(wt*17+x)*.12+Math.sin(wt*29+y)*.08;
  ctx.fillStyle='rgba(255,120,30,.9)';ctx.beginPath();ctx.moveTo(x-6*s,y);ctx.quadraticCurveTo(x-5*s,y-10*s*f,x,y-18*s*f);ctx.quadraticCurveTo(x+5*s,y-10*s*f,x+6*s,y);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,220,110,.95)';ctx.beginPath();ctx.moveTo(x-3*s,y);ctx.quadraticCurveTo(x-2.5*s,y-6*s*f,x,y-11*s*f);ctx.quadraticCurveTo(x+2.5*s,y-6*s*f,x+3*s,y);ctx.closePath();ctx.fill();}
function drawPlayer(cx,cy){
  const x=P.x-cx,y=P.y-cy;E(ctx,x,y+9,12,5,'rgba(0,0,0,.3)');
  ctx.save();ctx.translate(x,y-3);ctx.rotate(P.ang);
  const st=P.moving?Math.sin(P.walk)*5:0;
  E(ctx,st,-5,5.5,3.5,'#3b3024');E(ctx,-st,5,5.5,3.5,'#3b3024');
  const sw=P.swing>0?Math.sin(P.swing*18)*.9:0;
  // body
  const bg=ctx.createLinearGradient(0,-12,0,12);bg.addColorStop(0,'#4f7f9e');bg.addColorStop(1,'#2f5670');ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,8,12.5,0,0,TAU);ctx.fill();
  // left hand
  Ci(ctx,7,-10,3.4,'#e3b48b');
  // right arm + tool
  ctx.save();ctx.rotate(sw);const h=held();
  if(h&&ICON[h.id]){ctx.save();ctx.translate(13,10);ctx.rotate(.5);ctx.drawImage(ICON[h.id],-6,-18,22,22);ctx.restore();}
  Ci(ctx,10,10,3.4,'#e3b48b');ctx.restore();
  // head
  Ci(ctx,0,0,7.6,'#4a2f1d');E(ctx,3.6,0,3.6,5.2,'#e3b48b');Ci(ctx,-1.5,-1.5,2.5,'rgba(255,255,255,.08)');
  ctx.restore();
}
function drawRabbit(rb,cx,cy){const x=rb.x-cx,y=rb.y-cy,z=(rb.vx||rb.vy)?Math.abs(Math.sin(rb.hop))*5:0;E(ctx,x,y+3,7,2.5,'rgba(0,0,0,.25)');

const PNL={x:90,y:46,w:780,h:400},IG={x:110,y:110,s:46},RL={x:560,y:104,w:290,row:40,rows:8};
function sortedRecipes(){return RECIPES.map((r,i)=>({r,i,ok:canCraft(r)})).sort((a,b)=>(b.ok-a.ok)||(a.i-b.i));}
function invSlotAt(mx,my){const c=Math.floor((mx-IG.x)/IG.s),r=Math.floor((my-IG.y)/IG.s);if(c<0||c>8||r<0||r>3)return -1;if((mx-IG.x)%IG.s>44||(my-IG.y)%IG.s>44)return -1;return r===3?c:(r+1)*9+c;}
function panelClick(shift){
  const mx=mouse.x,my=mouse.y,si=invSlotAt(mx,my);
  if(si>=0){const s=inv[si];if(!heldStack){if(s){heldStack=s;inv[si]=null;}}else if(!s){inv[si]=heldStack;heldStack=null;}
    else if(s.id===heldStack.id){const k=Math.min(heldStack.n,stackMax(s.id)-s.n);s.n+=k;heldStack.n-=k;if(!heldStack.n)heldStack=null;}else{inv[si]=heldStack;heldStack=s;}SFX.pop();return;}
