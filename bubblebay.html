<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}</style></head><body>
<title>Bubble Bay</title>
<style>
/* Tropical bay: turquoise shallows, sand, coral accents */
:root{--bg:#0e6d8c;--ink:#ffffff;--muted:#c8f2ff;--accent:#ff7a5a;--card:rgba(6,50,72,.88);--line:rgba(200,245,255,.28);color-scheme:dark;--f:Fredoka,"Trebuchet MS",system-ui,sans-serif}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--f);touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;text-align:center;background:rgba(4,30,46,.55);overflow:auto}
h1{font-size:clamp(54px,16vw,90px);margin:0;line-height:.88;font-weight:700;color:#fff;text-shadow:0 5px 0 #0a7a9a,0 12px 30px rgba(0,0,0,.3)}
h1 span{color:#ffd76a;text-shadow:0 5px 0 #d07a1a,0 12px 30px rgba(0,0,0,.3)}
h2{font-size:38px;margin:0;font-weight:700}
.sub{color:var(--muted);font-weight:500;font-size:16px;max-width:320px;margin:0;line-height:1.4}
.btn{font:700 20px var(--f);color:#3a1a00;background:linear-gradient(180deg,#ffe08a,#ffb02e);border:0;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 5px 0 #c27a0a,0 10px 24px rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c27a0a}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:2px solid var(--line);font-size:16px;padding:9px 20px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 14px;min-width:84px}
.pill span{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;text-transform:uppercase}
.pill b{display:block;font-size:24px;font-weight:700}
#pauseB{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:#fff;font:700 18px var(--f);cursor:pointer}
</style>
<canvas id="c" aria-label="Bubble Bay. Drag to aim, let go to shoot. Tap the launcher to swap bubbles."></canvas>
<button id="pauseB" aria-label="Pause" hidden>II</button>
<div id="title" class="ov">
  <h1>Bubble<br><span>Bay</span></h1>
  <p class="sub">Aim, bounce off the walls, and match 3 or more. Knock loose bubbles down for big points before the tide pushes in.</p>
  <div class="pills"><div class="pill"><span>Best</span><b id="tBest">0</b></div></div>
  <div class="row"><button class="btn" id="playBtn">Play</button><button class="btn" id="resumeBtn" hidden>Continue</button></div>
  <div class="row"><button class="btn ghost" id="newBtn" hidden>New game</button><button class="btn ghost" id="sndBtn">Sound: on</button></div>
  <p class="sub" style="font-size:13px">Drag to aim, let go to shoot. Tap the launcher to swap.</p>
</div>
<div id="pause" class="ov" hidden><h2>Paused</h2><div class="row"><button class="btn" id="pResume">Resume</button><button class="btn ghost" id="pHome">Home</button></div><p class="sub" style="font-size:13px">Your game is saved. You can come back any time.</p></div>
<div id="over" class="ov" hidden>
  <h2 id="oTitle">Tide's in!</h2>
  <div class="pills"><div class="pill"><span>Score</span><b id="oScore">0</b></div><div class="pill"><span>Best</span><b id="oBest">0</b></div><div class="pill"><span>Popped</span><b id="oPop">0</b></div></div>
  <div class="row"><button class="btn" id="againBtn">Play again</button><button class="btn ghost" id="oHome">Home</button></div>
</div>
<script>
/* Cloud save: keeps game saves in your Claude account so they survive across devices and cleared browser storage. */
(()=>{const mem={},has={};let ls=null;try{ls=window.localStorage;ls.getItem('__probe');}catch(_){ls=null;}
const lget=k=>{try{return ls?ls.getItem(k):null;}catch(_){return null;}},lset=(k,v)=>{try{if(!ls)return;v===null?ls.removeItem(k):ls.setItem(k,v);}catch(_){}};
const safe=k=>'s_'+k.replace(/[^A-Za-z0-9_\-~:@+]/g,'_');
let db=null,uid=null,col=null;const pending=new Map();let timer=0,busy=false;
async function flush(){clearTimeout(timer);timer=0;if(!col||busy)return;busy=true;try{while(pending.size){const[k,v]=pending.entries().next().value;pending.delete(k);
  try{const ref=col.doc(safe(k));if(v===null)await ref.delete();else if(v.length<240000)await ref.set({k,v,t:Date.now()});}catch(e){if(e&&e.code==='unavailable'){pending.set(k,v);await new Promise(r=>setTimeout(r,1500+Math.random()*1000));}}}}finally{busy=false;}}
const sched=()=>{if(!timer)timer=setTimeout(flush,2000);};
window.__store={flush(){if(timer){clearTimeout(timer);timer=0;}flush();},get(k){return has[k]?mem[k]:lget(k);},
  set(k,v){v=String(v);has[k]=1;mem[k]=v;lset(k,v);lset('__t:'+k,String(Date.now()));pending.set(k,v);sched();},
  remove(k){has[k]=1;mem[k]=null;lset(k,null);lset('__t:'+k,String(Date.now()));pending.set(k,null);sched();}};
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});addEventListener('pagehide',flush);
async function load(){if(!window.claude||!claude.use)return;const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;const id=await u.id();if(!id)return;
  db=d;uid=id;col=db.collection('data/users/'+uid);const snap=await col.get();const seen=new Set();
  for(const doc of snap.docs){const b=doc.data();if(!b||typeof b.k!=='string')continue;seen.add(b.k);const lt=+(lget('__t:'+b.k)||0),lv=lget(b.k);
    if(lv!==null&&lt>(b.t||0)){pending.set(b.k,lv);}else{has[b.k]=1;mem[b.k]=b.v;lset(b.k,b.v);lset('__t:'+b.k,String(b.t||Date.now()));}}
  if(ls){for(let i=0;i<ls.length;i++){const k=ls.key(i);if(!k||k.startsWith('__')||seen.has(k))continue;pending.set(k,lget(k));}}
  if(pending.size)sched();}
let ready=false;const waiters=[];
window.__boot=fn=>{if(ready)fn();else waiters.push(fn);};
const go=()=>{if(ready)return;ready=true;waiters.splice(0).forEach(f=>{try{f();}catch(e){setTimeout(()=>{throw e;});}});};
Promise.race([load().catch(()=>{}),new Promise(r=>setTimeout(r,5000))]).then(go);
})();
</script>
<script>__boot(function(){
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,R=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const COLS=9,SQ=Math.sqrt(3);
const COL=[{a:'#ff8a7a',b:'#e0303a'},{a:'#ffe48a',b:'#f0a010'},{a:'#9cf07a',b:'#2fa83a'},{a:'#8ae4ff',b:'#1a8ad0'},{a:'#d6a6ff',b:'#7a3ad8'},{a:'#ffb0e0',b:'#e0489a'}];
let W,H,dpr,r,bx,by,BW,shY,dangerY;

/* ---------- save ---------- */
const SK='bubblebay-save-v1',RK='bubblebay-run-v1';let save={best:0,snd:true};
try{Object.assign(save,JSON.parse(__store.get(SK))||{});}catch(_){}
const persist=()=>{try{__store.set(SK,JSON.stringify(save));}catch(_){}};

/* ---------- audio ---------- */
let AC=null,master;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);}catch(_){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='sine',v=.06,f2=0,dl=0){if(!AC||!save.snd)return;const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
const SFX={shoot:()=>tone(500,.12,'sine',.06,900),bounce:()=>tone(700,.04,'triangle',.03),stick:()=>tone(240,.08,'sine',.06,160),
  pop:i=>tone(700+i*70,.07,'sine',.05,1400+i*90,i*.035),drop:i=>tone(500-i*20,.15,'triangle',.035,200,i*.03),push:()=>{tone(140,.4,'sine',.1,70);tone(90,.5,'triangle',.05);},
  swap:()=>tone(880,.06,'sine',.04,660),special:()=>[523,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.05,0,i*.05)),boom:()=>{tone(110,.4,'sine',.14,40);tone(500,.25,'sawtooth',.03,80);},
  clear:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,'triangle',.06,0,i*.08)),over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.35,'triangle',.06,0,i*.18))};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(_){}};
$('sndBtn').onclick=()=>{save.snd=!save.snd;persist();$('sndBtn').textContent='Sound: '+(save.snd?'on':'off');};$('sndBtn').textContent='Sound: '+(save.snd?'on':'off');

/* ---------- sprites ---------- */
let SPR={};
function icon(g,t,s){g.fillStyle='rgba(255,255,255,.85)';g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=s*.09;g.lineCap='round';g.lineJoin='round';g.beginPath();
  if(t===0){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?s*.17:s*.38;g.lineTo(Math.cos(a)*d,Math.sin(a)*d);}g.closePath();g.fill();}
  else if(t===1){g.arc(0,0,s*.28,0,TAU);g.fill();for(let i=0;i<8;i++){const a=i/8*TAU;g.moveTo(Math.cos(a)*s*.36,Math.sin(a)*s*.36);g.lineTo(Math.cos(a)*s*.46,Math.sin(a)*s*.46);}g.stroke();}
  else if(t===2){g.moveTo(0,s*.36);g.bezierCurveTo(-s*.5,0,-s*.25,-s*.38,0,-s*.14);g.bezierCurveTo(s*.25,-s*.38,s*.5,0,0,s*.36);g.fill();}
  else if(t===3){g.moveTo(0,-s*.4);g.quadraticCurveTo(s*.34,s*.02,0,s*.36);g.quadraticCurveTo(-s*.34,s*.02,0,-s*.4);g.fill();}
  else if(t===4){g.moveTo(0,-s*.4);g.lineTo(s*.32,0);g.lineTo(0,s*.4);g.lineTo(-s*.32,0);g.closePath();g.fill();}
  else if(t===5){g.moveTo(-s*.36,s*.18);g.arc(0,s*.18,s*.36,Math.PI,0);g.closePath();g.fill();g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=s*.05;for(let i=1;i<5;i++){const a=Math.PI+i*Math.PI/5;g.beginPath();g.moveTo(0,s*.18);g.lineTo(Math.cos(a)*s*.34,s*.18+Math.sin(a)*s*.34);g.stroke();}}}
function bubbleSprite(t){const sz=Math.ceil(r*2*dpr),c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');g.scale(dpr,dpr);g.translate(r,r);const rr=r*.94;
  if(t===-1){const gr=g.createConicGradient?g.createConicGradient(0,0,0):null;if(gr){COL.forEach((q,i)=>gr.addColorStop(i/6,q.b));gr.addColorStop(1,COL[0].b);g.fillStyle=gr;}else g.fillStyle='#c080ff';g.beginPath();g.arc(0,0,rr,0,TAU);g.fill();
    const w=g.createRadialGradient(0,0,0,0,0,rr);w.addColorStop(0,'rgba(255,255,255,.85)');w.addColorStop(.5,'rgba(255,255,255,.2)');w.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=w;g.fill();}
  else if(t===-2){const gr=g.createRadialGradient(-rr*.3,-rr*.35,rr*.05,0,0,rr);gr.addColorStop(0,'#6a6a7a');gr.addColorStop(1,'#14141c');g.fillStyle=gr;g.beginPath();g.arc(0,0,rr,0,TAU);g.fill();
    g.strokeStyle='#c8a46a';g.lineWidth=rr*.14;g.lineCap='round';g.beginPath();g.moveTo(rr*.35,-rr*.6);g.quadraticCurveTo(rr*.6,-rr*1,rr*.85,-rr*.85);g.stroke();g.fillStyle='#ffd23a';g.beginPath();g.arc(rr*.88,-rr*.88,rr*.16,0,TAU);g.fill();
    g.fillStyle='#ff5a3a';g.font='700 '+Math.round(rr*.9)+'px Fredoka,system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('!',0,rr*.08);}
  else{const q=COL[t],gr=g.createRadialGradient(-rr*.35,-rr*.4,rr*.08,0,0,rr*1.05);gr.addColorStop(0,q.a);gr.addColorStop(1,q.b);g.fillStyle=gr;g.beginPath();g.arc(0,0,rr,0,TAU);g.fill();
    g.strokeStyle='rgba(0,0,0,.12)';g.lineWidth=1.2;g.stroke();icon(g,t,rr);}
  g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(-rr*.38,-rr*.45,rr*.26,rr*.14,-.6,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(rr*.48,rr*.4,rr*.08,0,TAU);g.fill();
  return c;}
function buildSprites(){SPR={};for(const t of[-2,-1,0,1,2,3,4,5])SPR[t]=bubbleSprite(t);}

/* ---------- layout ---------- */
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  BW=Math.min(W-16,460);r=BW/(COLS*2);bx=(W-BW)/2;by=74;shY=H-Math.max(70,r*3.2)-Math.min(30,H*.03);dangerY=shY-r*2.6;buildSprites();}
addEventListener('resize',resize);

/* ---------- grid ---------- */
let grid=[],par=0;// grid[row][col] = {t} or null
const odd=row=>((row+par)&1)===1;
const ncols=row=>odd(row)?COLS-1:COLS;
const cx=(row,c)=>bx+r+c*2*r+(odd(row)?r:0),cy=row=>by+r+row*r*SQ;
const get=(row,c)=>row>=0&&row<grid.length&&c>=0&&c<ncols(row)?grid[row][c]:null;
function ensureRow(row){while(grid.length<=row)grid.push(new Array(COLS).fill(null));}
function nbrs(row,c){return odd(row)?[[row,c-1],[row,c+1],[row-1,c],[row-1,c+1],[row+1,c],[row+1,c+1]]:[[row,c-1],[row,c+1],[row-1,c-1],[row-1,c],[row+1,c-1],[row+1,c]];}
function trim(){while(grid.length&&grid[grid.length-1].every(x=>!x))grid.pop();}
function colorsOnBoard(){const s=new Set();for(const row of grid)for(const b of row)if(b&&b.t>=0)s.add(b.t);return[...s];}
const nColors=()=>4+(score>1500)+(score>6000);
function randColor(fromBoard=true){const on=fromBoard?colorsOnBoard():[];return on.length?on[Math.floor(R()*on.length)]:Math.floor(R()*nColors());}
function newRow(){const rowArr=new Array(COLS).fill(null);grid.unshift(rowArr);par^=1;const n=ncols(0);let prev=-1;
  for(let c=0;c<n;c++){let t=Math.floor(R()*nColors());if(R()<.45&&prev>=0)t=prev;const below=get(1,c);if(below&&R()<.35&&below.t>=0)t=below.t;rowArr[c]={t};prev=t;}}

/* ---------- state ---------- */
let state='title',score=0,shown=0,popped=0,cur=0,nxt=0,shot=null,aim=null,aiming=false,shotsLeft=6,maxShots=6,falling=[],parts=[],pops=[],t=0,shake=0,pushAnim=0,swapAnim=0;
function startNew(){grid=[];par=0;score=0;shown=0;popped=0;for(let i=0;i<7;i++)newRow();maxShots=6;shotsLeft=maxShots;cur=randColor();nxt=randColor();shot=null;falling=[];parts=[];pops=[];begin();}
function begin(){state='play';['title','over','pause'].forEach(i=>$(i).hidden=true);$('pauseB').hidden=false;}
function saveRun(){try{if(state==='play'||state==='paused')__store.set(RK,JSON.stringify({grid:grid.map(row=>row.map(b=>b?b.t:null)),par,score,popped,cur,nxt,shotsLeft,maxShots}));else __store.remove(RK);}catch(_){}}
function loadRun(){try{const d=JSON.parse(__store.get(RK));if(!d||!d.grid)return false;grid=d.grid.map(row=>row.map(v=>v===null?null:{t:v}));par=d.par;score=d.score;shown=score;popped=d.popped||0;cur=d.cur;nxt=d.nxt;shotsLeft=d.shotsLeft;maxShots=d.maxShots;shot=null;falling=[];parts=[];pops=[];return true;}catch(_){return false;}}

/* ---------- input ---------- */
function setAim(x,y){const dx=x-W/2,dy=y-shY;let a=Math.atan2(dy,dx);if(dy>-10)a=dx<0?-Math.PI+.12:-.12;a=clamp(a,-Math.PI+.1,-.1);aim=a;}
cv.addEventListener('pointerdown',e=>{audio();if(state!=='play')return;const x=e.clientX,y=e.clientY;
  if(Math.hypot(x-W/2,y-shY)<r*1.6||(Math.hypot(x-(W/2+r*3.2),y-(shY+r*.6))<r*1.3)){swap();return;}
  aiming=true;setAim(x,y);});
addEventListener('pointermove',e=>{if(aiming&&state==='play')setAim(e.clientX,e.clientY);});
addEventListener('pointerup',()=>{if(aiming&&state==='play'&&aim!==null)fire();aiming=false;});
addEventListener('pointercancel',()=>{aiming=false;});
function swap(){if(shot)return;[cur,nxt]=[nxt,cur];swapAnim=1;SFX.swap();}
function fire(){if(shot||state!=='play')return;const sp=Math.max(1100,H*1.5);shot={t:cur,x:W/2,y:shY,vx:Math.cos(aim)*sp,vy:Math.sin(aim)*sp};cur=nxt;nxt=nextColor();SFX.shoot();aim=null;}
let special=null;function nextColor(){if(special!==null){const s=special;special=null;return s;}return randColor();}

/* ---------- flight & snapping ---------- */
function hitsBubble(x,y){const rowE=Math.round((y-by-r)/(r*SQ));for(let row=rowE-1;row<=rowE+1;row++){if(row<0||row>=grid.length)continue;for(let c=0;c<ncols(row);c++){if(!grid[row][c])continue;if(Math.hypot(cx(row,c)-x,cy(row)-y)<r*1.7)return true;}}return false;}
function snap(x,y){let best=null,bd=1e9;const rowE=Math.round((y-by-r)/(r*SQ));
  for(let row=Math.max(0,rowE-1);row<=rowE+1;row++){for(let c=0;c<(odd(row)?COLS-1:COLS);c++){if(get(row,c))continue;const d=Math.hypot(cx(row,c)-x,cy(row)-y);if(d>=bd)continue;
      const attached=row===0||nbrs(row,c).some(([a,b])=>get(a,b));if(!attached)continue;bd=d;best=[row,c];}}
  if(!best){for(let row=Math.max(0,rowE-2);row<=rowE+2;row++)for(let c=0;c<(odd(row)?COLS-1:COLS);c++){if(get(row,c))continue;const d=Math.hypot(cx(row,c)-x,cy(row)-y);if(d<bd){bd=d;best=[row,c];}}}
  return best;}
function stepShot(dt){const s=shot;const steps=Math.ceil(Math.hypot(s.vx,s.vy)*dt/(r*.3));
  for(let i=0;i<steps;i++){s.x+=s.vx*dt/steps;s.y+=s.vy*dt/steps;
    if(s.x<bx+r){s.x=bx+r;s.vx=Math.abs(s.vx);SFX.bounce();}if(s.x>bx+BW-r){s.x=bx+BW-r;s.vx=-Math.abs(s.vx);SFX.bounce();}
    if(s.y<=by+r||hitsBubble(s.x,s.y)){land(s);return;}}}
function land(s){const cell=snap(s.x,s.y);shot=null;if(!cell){return;}const[row,c]=cell;ensureRow(row);
  const b={t:s.t,pop:1};grid[row][c]=b;SFX.stick();
  let cleared=0,dropped=0,boom=false;
  if(s.t===-2){boom=true;const X=cx(row,c),Y=cy(row);const kill=[];for(let rr=0;rr<grid.length;rr++)for(let cc=0;cc<ncols(rr);cc++)if(grid[rr][cc]&&Math.hypot(cx(rr,cc)-X,cy(rr)-Y)<r*4.3)kill.push([rr,cc]);
    kill.forEach(([a,bb],i)=>{popAt(a,bb,i);});cleared=kill.length;SFX.boom();shake=.4;buzz(40);}
  else{if(s.t===-1){let bestT=null,bestN=0;for(const[a,bb]of nbrs(row,c)){const n=get(a,bb);if(!n||n.t<0)continue;b.t=n.t;const sz=cluster(row,c).length;if(sz>bestN){bestN=sz;bestT=n.t;}}b.t=bestT===null?randColor(false):bestT;}
    const cl=cluster(row,c);if(cl.length>=3){cl.forEach(([a,bb],i)=>popAt(a,bb,i));cleared=cl.length;}}
  if(cleared){dropped=dropFloaters();combo++;}else combo=0;
  if(cleared){const pts=cleared*10*Math.max(1,combo)+dropped*dropped*10+dropped*20;score+=pts;popped+=cleared+dropped;
    pops.push({x:cx(row,c),y:cy(row),txt:'+'+pts,life:1});if(dropped>=3)pops.push({x:W/2,y:cy(row)+40,txt:dropped>=8?'Avalanche!':dropped>=5?'Splash!':'Nice drop!',life:1.3,big:1});
    if(combo>=3)pops.push({x:cx(row,c),y:cy(row)-30,txt:'Combo x'+combo,life:1});
    if(cleared+dropped>=8&&!boom){special=-2;SFX.special();pops.push({x:W/2,y:shY-60,txt:'Bomb ready!',life:1.4});}
    else if(dropped>=4&&special===null){special=-1;SFX.special();pops.push({x:W/2,y:shY-60,txt:'Rainbow ready!',life:1.4});}
    buzz(Math.min(40,8+cleared*3));}
  else{shotsLeft--;}
  trim();
  if(!grid.length||grid.every(row=>row.every(x=>!x))){score+=1000;SFX.clear();pops.push({x:W/2,y:H*.35,txt:'Bay cleared! +1000',life:2,big:1});for(let i=0;i<5;i++)newRow();pushAnim=1;}
  if(shotsLeft<=0){maxShots=Math.max(3,6-Math.floor(score/5000));shotsLeft=maxShots;newRow();pushAnim=1;SFX.push();shake=.2;buzz(20);}
  if([cur,nxt].some(v=>v>=0&&!colorsOnBoard().includes(v))&&colorsOnBoard().length){if(cur>=0&&!colorsOnBoard().includes(cur))cur=randColor();if(nxt>=0&&!colorsOnBoard().includes(nxt))nxt=randColor();}
  checkOver();saveRun();}
let combo=0;
function cluster(row,c){const t=grid[row][c].t,seen=new Set([row*100+c]),out=[[row,c]],q=[[row,c]];while(q.length){const[a,b]=q.pop();for(const[na,nb]of nbrs(a,b)){const n=get(na,nb);if(!n||(n.t!==t&&n.t!==-1))continue;const k=na*100+nb;if(seen.has(k))continue;seen.add(k);out.push([na,nb]);q.push([na,nb]);}}return out;}
function popAt(row,c,i){const b=grid[row][c];if(!b)return;grid[row][c]=null;const x=cx(row,c),y=cy(row),col=b.t>=0?COL[b.t].b:'#ffffff';
  for(let k=0;k<9;k++){const a=R()*TAU,v=r*(3+R()*6);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+R()*.3,c:k%3?col:'#ffffff',s:r*(.08+R()*.12)});}
  parts.push({ring:1,x,y,life:.3,c:col});SFX.pop(Math.min(i,12));}
function dropFloaters(){const seen=new Set(),q=[];for(let c=0;c<ncols(0);c++)if(get(0,c)){seen.add(c);q.push([0,c]);}
  while(q.length){const[a,b]=q.pop();for(const[na,nb]of nbrs(a,b)){if(!get(na,nb))continue;const k=na*100+nb;if(seen.has(k))continue;seen.add(k);q.push([na,nb]);}}
  let n=0;for(let row=0;row<grid.length;row++)for(let c=0;c<ncols(row);c++){const b=grid[row][c];if(b&&!seen.has(row*100+c)){grid[row][c]=null;falling.push({t:b.t,x:cx(row,c),y:cy(row),vx:(R()-.5)*r*6,vy:-r*(2+R()*4),rot:0});SFX.drop(n);n++;}}return n;}
function checkOver(){for(let row=0;row<grid.length;row++)for(let c=0;c<ncols(row);c++)if(grid[row][c]&&cy(row)+r>dangerY){gameOver();return;}}
function gameOver(){state='over';$('pauseB').hidden=true;SFX.over();buzz([50,40,80]);const nb=score>save.best;save.best=Math.max(save.best,score);persist();try{__store.remove(RK);}catch(_){}
  setTimeout(()=>{$('oTitle').textContent=nb&&score>0?'New best!':"Tide's in!";$('oScore').textContent=score.toLocaleString();$('oBest').textContent=save.best.toLocaleString();$('oPop').textContent=popped;$('over').hidden=false;},900);}

/* ---------- aim preview ---------- */
function previewPath(){const pts=[[W/2,shY]];let x=W/2,y=shY,vx=Math.cos(aim),vy=Math.sin(aim),bounces=0;const st=r*.5;
  for(let i=0;i<600;i++){x+=vx*st;y+=vy*st;if(x<bx+r){x=bx+r;vx=-vx;pts.push([x,y]);if(++bounces>2)break;}if(x>bx+BW-r){x=bx+BW-r;vx=-vx;pts.push([x,y]);if(++bounces>2)break;}
    if(y<=by+r||hitsBubble(x,y)){pts.push([x,y]);return{pts,end:snap(x,y)};}}
  pts.push([x,y]);return{pts,end:null};}

/* ---------- update / render ---------- */
function update(dt){t+=dt;
  if(state==='play'&&shot)stepShot(dt);
  for(const f of falling){f.vy+=r*60*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vx*.02*dt;}falling=falling.filter(f=>{if(f.y>H+r*2){return false;}if(f.y>shY+r*1.5&&!f.splash){f.splash=1;for(let k=0;k<5;k++)parts.push({x:f.x,y:f.y,vx:(R()-.5)*r*8,vy:-R()*r*8,life:.4,c:'#bff4ff',s:r*.1,g:1});}return true;});
  for(const p of parts){p.life-=dt;if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g?r*30:r*4)*dt;}}parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.life-=dt;p.y-=r*1.2*dt;}pops=pops.filter(p=>p.life>0);
  for(const row of grid)for(const b of row)if(b&&b.pop)b.pop=Math.max(0,b.pop-dt*4);
  shake=Math.max(0,shake-dt);pushAnim=Math.max(0,pushAnim-dt*3);swapAnim=Math.max(0,swapAnim-dt*5);shown=lerp(shown,score,Math.min(1,dt*8));if(Math.abs(shown-score)<1)shown=score;}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a4a6a');g.addColorStop(.55,'#0e7a9a');g.addColorStop(1,'#2ab0b8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // caustic light
  ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const x=((i*W/5+t*14*(i%2?1:-1))%(W+200)+W+200)%(W+200)-100;const gr=ctx.createLinearGradient(0,0,0,H*.8);gr.addColorStop(0,'rgba(180,240,255,.07)');gr.addColorStop(1,'rgba(180,240,255,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+60,0);ctx.lineTo(x+160,H*.8);ctx.lineTo(x+90,H*.8);ctx.fill();}ctx.restore();
  // sand
  ctx.fillStyle='#e8c98a';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,shY+r*1.6+Math.sin(x*.03)*5);ctx.lineTo(W,H);ctx.fill();
  ctx.fillStyle='#d4b070';for(let i=0;i<14;i++){ctx.beginPath();ctx.arc((i*73)%W,shY+r*2.2+((i*31)%40),2,0,TAU);ctx.fill();}
  // seaweed & coral sides
  for(const side of[0,1]){const x0=side?W-18:18;for(let k=0;k<3;k++){ctx.strokeStyle=k%2?'#2f9a5a':'#3fb86a';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0+(side?-1:1)*k*9,shY+r*1.8);for(let j=1;j<=6;j++)ctx.lineTo(x0+(side?-1:1)*k*9+Math.sin(t*1.4+j*.8+k)*6,shY+r*1.8-j*16);ctx.stroke();}}
  if(state==='title'){return;}
  const sx=shake>0?(R()-.5)*shake*r:0,sy=shake>0?(R()-.5)*shake*r:0;ctx.save();ctx.translate(sx,sy);
  // board frame
  ctx.fillStyle='rgba(0,30,50,.25)';ctx.fillRect(bx-4,by-6,BW+8,dangerY-by+6);ctx.fillStyle='#ffd76a';ctx.fillRect(bx-6,by-8,BW+12,5);
  // danger line
  let low=0;for(let row=0;row<grid.length;row++)if(grid[row].some(Boolean))low=row;const near=clamp(1-(dangerY-(cy(low)+r))/(r*SQ*3),0,1);
  ctx.strokeStyle=`rgba(255,${Math.round(200-near*150)},${Math.round(200-near*150)},${.35+near*.5*(.6+.4*Math.sin(t*8))})`;ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,dangerY);ctx.lineTo(bx+BW,dangerY);ctx.stroke();ctx.setLineDash([]);
  // grid
  const po=pushAnim*r*SQ;
  for(let row=0;row<grid.length;row++)for(let c=0;c<ncols(row);c++){const b=grid[row][c];if(!b)continue;const s=1+(b.pop?Math.sin(b.pop*Math.PI)*.15:0),x=cx(row,c),y=cy(row)-po;const sp=SPR[b.t];ctx.drawImage(sp,x-r*s,y-r*s,r*2*s,r*2*s);}
  // aim
  if(aim!==null&&!shot&&state==='play'){const{pts,end}=previewPath();ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.setLineDash([2,10]);ctx.lineDashOffset=-t*40;ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);
    if(end){ctx.globalAlpha=.4;ctx.drawImage(SPR[cur],cx(end[0],end[1])-r,cy(end[0])-r,r*2,r*2);ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx(end[0],end[1]),cy(end[0]),r*.95,0,TAU);ctx.stroke();}}
  // falling
  for(const f of falling){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.drawImage(SPR[f.t],-r,-r,r*2,r*2);ctx.restore();}
  if(shot)ctx.drawImage(SPR[shot.t],shot.x-r,shot.y-r,r*2,r*2);
  // launcher
  const a=aim!==null?aim:-Math.PI/2;ctx.save();ctx.translate(W/2,shY);ctx.rotate(a+Math.PI/2);ctx.fillStyle='#ff7a5a';ctx.beginPath();ctx.moveTo(-r*.5,0);ctx.lineTo(-r*.35,-r*1.9);ctx.lineTo(r*.35,-r*1.9);ctx.lineTo(r*.5,0);ctx.fill();ctx.fillStyle='#ffb09a';ctx.fillRect(-r*.35,-r*1.9,r*.7,r*.3);ctx.restore();
  ctx.fillStyle='#c84a3a';ctx.beginPath();ctx.arc(W/2,shY+r*.2,r*1.35,0,TAU);ctx.fill();ctx.fillStyle='#ff8a6a';ctx.beginPath();ctx.arc(W/2,shY,r*1.25,0,TAU);ctx.fill();
  const ss=1-swapAnim*.3;if(!shot)ctx.drawImage(SPR[cur],W/2-r*ss,shY-r*ss,r*2*ss,r*2*ss);
  const nx=W/2+r*3.2,ny=shY+r*.6;ctx.fillStyle='rgba(0,40,60,.35)';ctx.beginPath();ctx.arc(nx,ny,r*.95,0,TAU);ctx.fill();ctx.drawImage(SPR[nxt],nx-r*.75,ny-r*.75,r*1.5,r*1.5);
  ctx.font='600 11px Fredoka,system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.75)';ctx.textAlign='center';ctx.fillText('next',nx,ny+r*1.35);
  // shots until push
  for(let i=0;i<maxShots;i++){const x=W/2-r*3.2-(i-(maxShots-1)/2)*r*.62,y=shY+r*.6;ctx.fillStyle=i<shotsLeft?'#fff':'rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(x,y,r*.2,0,TAU);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('tide',W/2-r*3.2,shY+r*1.35);
  // particles
  for(const p of parts){if(p.ring){const k=1-p.life/.3;ctx.strokeStyle=p.c;ctx.globalAlpha=1-k;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,r*(1+k*.8),0,TAU);ctx.stroke();ctx.globalAlpha=1;continue;}ctx.globalAlpha=Math.min(1,p.life*3);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*2);ctx.font='700 '+(p.big?30:18)+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,40,60,.6)';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.big?'#ffd76a':'#fff';ctx.fillText(p.txt,p.x,p.y);}ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
  ctx.restore();
  // HUD
  ctx.textAlign='center';ctx.font='700 30px Fredoka,system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(Math.round(shown).toLocaleString(),W/2,44);ctx.font='600 12px Fredoka,system-ui,sans-serif';ctx.fillStyle='rgba(200,245,255,.8)';ctx.fillText('best '+save.best.toLocaleString(),W/2,62);}

/* ---------- menus ---------- */
function updTitle(){$('tBest').textContent=save.best.toLocaleString();let has=false;try{has=!!__store.get(RK);}catch(_){}$('resumeBtn').hidden=!has;$('newBtn').hidden=!has;$('playBtn').hidden=has;}
$('playBtn').onclick=()=>{audio();startNew();};$('newBtn').onclick=()=>{audio();startNew();};$('againBtn').onclick=()=>{audio();startNew();};
$('resumeBtn').onclick=()=>{audio();if(loadRun())begin();else startNew();};
$('pauseB').onclick=()=>{if(state!=='play')return;state='paused';saveRun();$('pause').hidden=false;};
$('pResume').onclick=()=>{$('pause').hidden=true;state='play';};
$('pHome').onclick=$('oHome').onclick=()=>{saveRun();['pause','over'].forEach(i=>$(i).hidden=true);$('pauseB').hidden=true;state='title';$('title').hidden=false;updTitle();};
addEventListener('pagehide',saveRun);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun();});

let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
resize();updTitle();requestAnimationFrame(frame);
window.__bb={get s(){return{state,score,shotsLeft,rows:grid.length,cur,nxt,shot:!!shot}},setAimFire:a=>{aim=a;fire();},previewPath:()=>{return previewPath()}};
})();

});</script>
