/* ---------- layout ---------- */

/* ---------- grid ---------- */

/* ---------- state ---------- */

function loadRun(){try{const d=JSON.parse(__store.get(RK));if(!d||!d.grid)return false;grid=d.grid.map(row=>row.map(v=>v===null?null:{t:v}));par=d.par;score=d.score;shown=score;popped=d.popped||0;cur=d.cur;nxt=d.nxt;shotsLeft=d.shotsLeft;maxShots=d.maxShots;shot=null;falling=[];parts=[];pops=[];return true;}catch(_){return false;}}

/* ---------- input ---------- */
function setAim(x,y){const dx=x-W/2,dy=y-shY;let a=Math.atan2(dy,dx);if(dy>-10)a=dx<0?-Math.PI+.12:-.12;a=clamp(a,-Math.PI+.1,-.1);aim=a;}
cv.addEventListener('pointerdown',e=>{audio();if(state!=='play')return;const x=e.clientX,y=e.clientY;

addEventListener('pointerup',()=>{if(aiming&&state==='play'&&aim!==null)fire();aiming=false;});
addEventListener('pointercancel',()=>{aiming=false;});

let special=null;function nextColor(){if(special!==null){const s=special;special=null;return s;}return randColor();}

/* ---------- flight & snapping ---------- */

function stepShot(dt){const s=shot;const steps=Math.ceil(Math.hypot(s.vx,s.vy)*dt/(r*.3));

  ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('tide',W/2-r*3.2,shY+r*1.35);
  // particles
  for(const p of parts){if(p.ring){const k=1-p.life/.3;ctx.strokeStyle=p.c;ctx.globalAlpha=1-k;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,r*(1+k*.8),0,TAU);ctx.stroke();ctx.globalAlpha=1;continue;}ctx.globalAlpha=Math.min(1,p.life*3);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*2);ctx.font='700 '+(p.big?30:18)+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,40,60,.6)';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.big?'#ffd76a':'#fff';ctx.fillText(p.txt,p.x,p.y);}ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
  ctx.restore();
  // HUD
  ctx.textAlign='center';ctx.font='700 30px Fredoka,system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(Math.round(shown).toLocaleString(),W/2,44);ctx.font='600 12px Fredoka,system-ui,sans-serif';ctx.fillStyle='rgba(200,245,255,.8)';ctx.fillText('best '+save.best.toLocaleString(),W/2,62);}

/* ---------- menus ---------- */
function updTitle(){$('tBest').textContent=save.best.toLocaleString();let has=false;try{has=!!__store.get(RK);}catch(_){}$('resumeBtn').hidden=!has;$('newBtn').hidden=!has;$('playBtn').hidden=has;}
$('playBtn').onclick=()=>{audio();startNew();};$('newBtn').onclick=()=>{audio();startNew();};$('againBtn').onclick=()=>{audio();startNew();};
$('resumeBtn').onclick=()=>{audio();if(loadRun())begin();else startNew();};
$('pauseB').onclick=()=>{if(state!=='play')return;state='paused';saveRun();$('pause').hidden=false;};
$('pResume').onclick=()=>{$('pause').hidden=true;state='play';};
$('pHome').onclick=$('oHome').onclick=()=>{saveRun();['pause','over'].forEach(i=>$(i).hidden=true);$('pauseB').hidden=true;state='title';$('title').hidden=false;updTitle();};
addEventListener('pagehide',saveRun);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun();});

let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
resize();updTitle();requestAnimationFrame(frame);
window.__bb={get s(){return{state,score,shotsLeft,rows:grid.length,cur,nxt,shot:!!shot}},setAimFire:a=>{aim=a;fire();},previewPath:()=>{return previewPath()}};
})();

});</script>
