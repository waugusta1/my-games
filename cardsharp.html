:root{--brass:#d4ac5c;--brass2:#8a6327;--mah:#4a1d12;--mah2:#2b0f08;--cream:#f3e7c9;--ink:#24140a;--chip:#2f6fb5;--mult:#c23a2b;--felt:#1d5a3f;--head:Didot,"Bodoni 72","Bodoni MT",Georgia,serif;--body:"Avenir Next","Gill Sans","Segoe UI",sans-serif}

/* ---------------- helpers ---------------- */
const sIs=(c,s)=>c.e==='wild'||c.s===s;
const hasT=id=>R&&R.tr.some((t,i)=>t.id===id&&!trOff(i));
function trOff(i){return T&&R.phase==='play'&&T.cap==='queen'&&i===0;}
const cardById=id=>R.cards.find(c=>c.id===id);
function chance(n){return Math.random()<(hasT('horseshoe')?2:1)/n;}
const cardChips=c=>c.r===14?11:c.r>=11?10:c.r;
function isDb(c){if(!T||!T.cap)return false;const k=CAPS[T.cap];if(k.suit!==undefined&&(c.s===k.suit||c.e==='wild'))return true;if(T.cap==='face'&&isFace(c))return true;return false;}
function isUnl(id){return!LOCKS[id]||META.unl[id];}
function price(base){let p=base;if(R.v.coupon)p=Math.ceil(p*.75);if(R.stake>=5)p+=1;return p;}
function trSlots(){return 5+(R.v.rail?1:0);}function consSlots(){return 2+(R.v.sleeve?1:0);}

function hlv(t){return R.lv[t]||1;}

function targetFor(port,tbl){let b=port<=8?BASE[port-1]:Math.round(BASE[7]*Math.pow(1.7,port-8)/100)*100;let m=TB[tbl].m;if(R.stake>=3)m*=1.25;if(R.stake>=5)m*=1.2;return Math.round(b*m/10)*10;}
/* ---------------- hand evaluation ---------------- */
function evalHand(cards){const n=cards.length,need=hasT('shorthand')?4:5,sc=hasT('shortcut');const g={};cards.forEach(c=>{(g[c.r]=g[c.r]||[]).push(c);});const groups=Object.values(g).sort((a,b)=>b.length-a.length||b[0].r-a[0].r);
 let fl=null;if(n>=need)for(let s=0;s<4;s++){const f=cards.filter(c=>sIs(c,s));if(f.length>=need){fl=f;break;}}
 let st=null;if(n>=need){const rs=new Set();cards.forEach(c=>{rs.add(c.r);if(c.r===14)rs.add(1);});const ur=[...rs].sort((a,b)=>a-b);let best=[],cur=[];ur.forEach((r,i)=>{if(i&&(r-ur[i-1]===1||(sc&&r-ur[i-1]===2)))cur.push(r);else cur=[r];if(cur.length>best.length)best=cur.slice();});if(best.length>=need){const ids=new Set();st=[];best.forEach(r=>{const rr=r===1?14:r;const c=cards.find(q=>q.r===rr&&!ids.has(q.id));if(c){ids.add(c.id);st.push(c);}});if(st.length<need)st=null;}}
 const top=groups[0]?groups[0].length:0,sec=groups[1]?groups[1].length:0;let type,sco;
 if(top>=5){type='five';sco=groups[0];}else if(fl&&st){type='sflush';sco=[...new Set(fl.concat(st))];}else if(top===4){type='four';sco=groups[0];}else if(top===3&&sec>=2){type='full';sco=groups[0].concat(groups[1]);}else if(fl){type='flush';sco=fl;}else if(st){type='straight';sco=st;}else if(top===3){type='three';sco=groups[0];}else if(top===2&&sec===2){type='two';sco=groups[0].concat(groups[1]);}else if(top===2){type='pair';sco=groups[0];}else{type='high';sco=n?[cards.slice().sort((a,b)=>b.r-a.r)[0]]:[];}
 const has={pair:top>=2,two:(top>=2&&sec>=2)||top>=4,three:top>=3,four:top>=4,straight:!!st,flush:!!fl};
 return{type,scoring:cards.filter(c=>sco.includes(c)),has};}
function computeScore(sel,held){const ev=evalHand(sel);let[ch,mu]=hBase(ev.type);if(T.cap==='flint'){ch=Math.ceil(ch/2);mu=Math.max(1,Math.ceil(mu/2));}
 const S={c:ch,m:mu},steps=[],ctx={ev,sel,held,has:ev.has,n:sel.length};let money=0;
 const act=R.tr.map((t,i)=>({t,i})).filter(o=>!trOff(o.i));
 const ap=(src,o)=>{if(!o)return;if(o.c)S.c+=o.c;if(o.m)S.m+=o.m;if(o.x)S.m*=o.x;if(o.$)money+=o.$;steps.push(Object.assign({src},o,{C:S.c,M:S.m}));};
 const fid=hasT('fiddler'),enc=hasT('encore'),und=hasT('understudy');
 ev.scoring.forEach((c,ci)=>{if(isDb(c)){steps.push({src:{card:c.id},txt:'Debuffed',C:S.c,M:S.m});return;}let reps=1+(ci===0&&fid?2:0)+(isFace(c)&&enc?1:0);
  for(let k=0;k<reps;k++){if(k)steps.push({src:{card:c.id},txt:'Again!',C:S.c,M:S.m});ap({card:c.id},{c:cardChips(c)+(c.e==='bonus'?30:0)});if(c.e==='mult')ap({card:c.id},{m:4});if(c.e==='glass')ap({card:c.id},{x:2});if(c.e==='lucky'){if(chance(5))ap({card:c.id},{m:20});if(chance(15))ap({card:c.id},{$:20});}
   act.forEach(o=>{const d=TD[o.t.id];if(d.card)ap({tr:o.i},d.card(ctx,c,o.t));});}});
 held.forEach(c=>{if(isDb(c))return;for(let k=0;k<(und?2:1);k++){if(c.e==='steel')ap({card:c.id},{x:1.5});act.forEach(o=>{const d=TD[o.t.id];if(d.held)ap({tr:o.i},d.held(ctx,c,o.t));});}});
 act.forEach(o=>{const d=TD[o.t.id];if(d.hand)ap({tr:o.i},d.hand(ctx,o.t));});
 return{ev,steps,base:[ch,mu],total:Math.floor(S.c*S.m),money};}

function pause(){if(busy)return;SFX.btn();save();ov(`<div class="sheet mah" style="width:min(50rem,92vw)">${xBtn()}<h2>Paused</h2><div class="menu"><button class="bb blue" id="pR">${UIc('play')}<span class="col">Resume</span></button><button class="bb dark" id="pD">${UIc('deck')}<span class="col">View deck<small>${R.cards.length} cards</small></span></button><button class="bb dark" id="pHd">${UIc('book')}<span class="col">Hand levels</span></button><button class="bb dark" id="pH">${UIc('deck')}<span class="col">How to play</span></button><button class="bb dark" id="pS">${UIc('gear')}<span class="col">Settings</span></button><button class="bb dark" id="pT">${UIc('back')}<span class="col">Title screen<small>Your voyage is saved</small></span></button><button class="bb red" id="pG">${UIc('home')}<span class="col">Go back to games<small>Progress is saved</small></span></button></div></div>`);
 on('pR',closeOv);on('pD',()=>deckView(pause));on('pHd',()=>handsView(pause));on('pH',()=>how(pause));on('pS',()=>settings(pause));on('pT',()=>{closeOv();save();title();});on('pG',leave);}
function deckView(back){const all=R.cards.slice().sort((a,b)=>a.s-b.s||b.r-a.r);const inDraw=T?new Set(T.draw):null;
 ov(`<div class="sheet mah" style="width:min(104rem,96vw)">${xBtn()}<h2>Your deck · ${R.cards.length} cards</h2><p class="hint" style="text-align:center">${T?'Faded cards have already been drawn or played this table.':'All cards in your deck.'}</p>${[0,1,2,3].map(s=>`<div style="display:flex;gap:.3rem;flex-wrap:wrap;margin:.6rem 0">${all.filter(c=>c.s===s).map(c=>`<div style="width:6.4rem;height:9rem;${inDraw&&!inDraw.has(c.id)?'opacity:.35':''}">${cardSVG(c)}</div>`).join('')}</div>`).join('')}<div class="row"><button class="bb dark" data-x>${UIc('back')} Back</button></div></div>`,back);}
function handsView(back){ov(`<div class="sheet mah" style="width:min(70rem,94vw)">${xBtn()}<h2>Hand levels</h2>${HT.map(h=>{const[c,m]=hBase(h[0]);return`<div class="stat"><span>${h[1]} <span class="hint">lv ${hlv(h[0])} · played ${R.st.hands[h[0]]||0}</span></span><b><span style="color:#7ab4ff">${c}</span> × <span style="color:#ff8c78">${m}</span></b></div>`;}).join('')}<div class="row"><button class="bb dark" data-x>${UIc('back')} Back</button></div></div>`,back);}
function settings(back){const S=META.set;const draw=()=>{ov(`<div class="sheet mah" style="width:min(50rem,92vw)">${xBtn()}<h2>Settings</h2><div class="menu"><button class="bb dark" id="sF">${UIc('spk')}<span class="col">Sound effects: ${S.sfx?'On':'Off'}</span></button><button class="bb dark" id="sM">${UIc('note')}<span class="col">Music: ${S.mus?'On':'Off'}</span></button><button class="bb dark" id="sP">${UIc('ff')}<span class="col">Scoring speed: ${['Normal','Fast','Fastest'][S.spd-1]}</span></button></div><div class="row"><button class="bb dark" data-x>${UIc('back')} Back</button></div></div>`,back);
 on('sF',()=>{S.sfx=S.sfx?0:1;save();draw();});on('sM',()=>{S.mus=S.mus?0:1;save();startMusic();draw();});on('sP',()=>{S.spd=S.spd%3+1;save();draw();});};draw();}
function how(back){ov(`<div class="sheet mah" style="width:min(84rem,96vw)">${xBtn()}<h2>How to play</h2>
 <p><b>Goal:</b> steam down the river from St. Louis to New Orleans. Each port has three tables. Beat a table by filling the <b>Pot</b> to the target before you run out of plays.</p>
 <p><b>Playing:</b> tap up to 5 cards, then <b>Play hand</b>. The best poker hand they make gives base <span style="color:#7ab4ff">Chips</span> and <span style="color:#ff8c78">Mult</span>. Every card that is part of the hand adds its value as Chips (Aces 11, faces 10). Score = Chips × Mult.</p>
 <p><b>Discard</b> swaps cards you don't want. You get only a few, so use them wisely.</p>
 <div style="display:flex;gap:.5rem;justify-content:center;margin:1rem 0">${[{r:9,s:1},{r:9,s:3},{r:9,s:0},{r:4,s:2,e:'bonus'},{r:4,s:1,e:'glass'}].map(c=>`<div style="width:7rem;height:9.8rem">${cardSVG(c)}</div>`).join('')}</div><p class="hint" style="text-align:center">Three 9s and two 4s: a Full House.</p>
 <p><b>Trinkets</b> sit on your rail and change how hands score. Their order matters: they trigger left to right. <b>Tricks</b> change cards in your deck: select cards first, then tap the Trick and Use. <b>Charts</b> level up a poker hand forever.</p>
 <p><b>Money:</b> each win pays a reward, $1 for every unused play, plus interest of $1 per $5 you hold (up to $5). Spend it at the Purser's Counter between tables.</p>
 <p><b>Captains</b> guard each port with a nasty rule. Beat them to unlock new decks, Trinkets and harder stakes. Beat the River Queen in New Orleans to finish a voyage, then keep sailing into endless water if you dare.</p>
 <h3>Poker hands</h3>${HT.map(h=>`<div class="stat"><span>${h[1]}</span><b><span style="color:#7ab4ff">${h[2]}</span> × <span style="color:#ff8c78">${h[3]}</span></b></div>`).join('')}
 <div class="row"><button class="bb dark" data-x>${UIc('back')} Back</button></div></div>`,back);}
function records(back){const m=META;ov(`<div class="sheet mah" style="width:min(80rem,94vw)">${xBtn()}<h2>Records</h2>${[['Voyages started',m.runs],['Voyages finished',m.wins],['Tables won',m.tables],['Captains beaten',m.captains],['Best port reached',m.bestPort?PORTS[Math.min(8,m.bestPort)-1]:'—'],['Highest stake won',m.wonStake||'—'],['Best single hand',fmt(m.bestHand)],['Furthest endless port',m.endlessBest?'Open Water '+(m.endlessBest-8):'—'],['Hands played',m.cnt.hands]].map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}
 <h3>Locked Trinkets</h3>${Object.keys(LOCKS).map(id=>{const L=LOCKS[id],ok=META.unl[id];return`<div class="lock"><div class="tag">${tagSVG(id,{lock:!ok})}</div><div style="flex:1"><b>${ok?TD[id].n:'???'}</b><div class="hint">${L[0]} · ${ok?'Unlocked':Math.min(L[1](META),L[2])+' / '+L[2]}</div></div></div>`;}).join('')}
 <div class="row"><button class="bb dark" data-x>${UIc('back')} Back</button></div></div>`,back);}
function collection(back,tab){tab=tab||'tr';let body='';
 if(tab==='tr')body=`<div class="grid">${TRL.map(t=>`<div class="tag" data-ct="${t[0]}" style="width:9.6rem;height:13.4rem">${tagSVG(t[0],{lock:!isUnl(t[0])})}</div>`).join('')}</div>`;
 else if(tab==='tk')body=`<div class="grid">${Object.keys(TK).map(k=>`<div class="tag" data-ck="${k}" style="width:9.6rem;height:13.4rem">${trickSVG(k)}</div>`).join('')}</div>`;
 else if(tab==='ch')body=`<div class="grid">${HT.map(h=>`<div class="tag" style="width:9.6rem;height:13.4rem">${chartSVG(h[0])}</div>`).join('')}</div><p class="hint" style="text-align:center">Each Chart levels up its poker hand by one.</p>`;
 else body=Object.keys(DECKS).map(k=>`<div class="stat"><span><b>${DECKS[k].n}</b> · ${DECKS[k].d}</span><b>${META.decks[k]?'Unlocked':DECKS[k].lock}</b></div>`).join('')+`<h3>Captains</h3>`+Object.keys(CAPS).map(k=>`<div class="stat"><span><b>${CAPS[k].n}</b></span><span>${CAPS[k].r}</span></div>`).join('');
 ov(`<div class="sheet mah" style="width:min(100rem,96vw)">${xBtn()}<h2>Collection</h2><div class="tabs">${[['tr','Trinkets'],['tk','Tricks'],['ch','Charts'],['dk','Decks & Captains']].map(t=>`<button class="bb ${t[0]===tab?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${body}<div class="row"><button class="bb dark" data-x>${UIc('back')} Back</button></div></div>`,back);
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{SFX.btn();collection(back,b.dataset.tab);});
 document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{SFX.btn();const id=b.dataset.ct,ok=isUnl(id);ov(`<div class="sheet mah" style="width:min(50rem,92vw)">${xBtn()}<div class="hl"><div class="tag" style="width:12rem;height:16.8rem">${tagSVG(id,{lock:!ok})}</div><div style="flex:1"><h2 style="text-align:left">${ok?TD[id].n:'Locked'}</h2><p class="desc">${ok?TD[id].d:'Unlock: '+LOCKS[id][0]}</p></div></div><div class="row"><button class="bb dark" data-x>${UIc('back')} Back</button></div></div>`,()=>collection(back,'tr'));});
 document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{SFX.btn();const k=b.dataset.ck;ov(`<div class="sheet mah" style="width:min(50rem,92vw)">${xBtn()}<h2>${TK[k].n}</h2><p class="desc" style="text-align:center">${TK[k].d}</p><div class="row"><button class="bb dark" data-x>${UIc('back')} Back</button></div></div>`,()=>collection(back,'tk'));});}
/* ---------------- wire up ---------------- */
on('pauseB',pause);on('playB',playHand);on('discB',discard);on('sR',()=>sortHand('r'));on('sS',()=>sortHand('s'));on('deckB',()=>{if(!busy)deckView(null);});on('infoB',()=>{if(!busy)handsView(null);});
addEventListener('pagehide',save);
load();drawBG();title();
window.__cs={get R(){return R;},get T(){return T;},evalHand,computeScore,cardById,META:()=>META,playHand,discard,sel,layout,updPreview};
</script></body></html>
