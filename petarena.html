function fixFeed(d){
  if(!d||!Array.isArray(d.pets)||!d.pets.length)return null;
  const by={};d.pets.forEach(p=>{if(p&&p.name)by[p.name]=p;});
  d.pets=PET_ORDER.filter(n=>by[n]).concat(Object.keys(by).filter(n=>!PET_ORDER.includes(n))).map(n=>{
    const p=Object.assign(demoPet(n,{}),by[n],{demo:!!d.demo});
    p.stats=Object.assign({hp:150,atk:40,def:40,spd:40,spc:40},p.stats||{});
    if(!p.moves||!p.moves.length)p.moves=(DEMO.pets.find(x=>x.name===n)||DEMO.pets[0]).moves;
    ['hours24','by_hour'].forEach(k=>{if(!Array.isArray(p[k])||p[k].length!==24)p[k]=Array(24).fill(0);});
    if(!Array.isArray(p.days7)||p.days7.length!==7)p.days7=Array(7).fill(0);
    if(!Array.isArray(p.album))p.album=[];
    return p;});
  return d;
}

async function loadFeed(){
  let d=null,state='demo';

  const tries=[[FEED_API,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'}],[FEED_BASE+'pets.json?t='+Date.now(),{cache:'no-store'}]];
  for(const[url,opt]of tries){if(d)break;
    try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(url,Object.assign({signal:ctl.signal},opt));clearTimeout(t);
      if(r.ok){d=fixFeed(await r.json());if(d){state='live';try{localStorage.setItem(FEED_CACHE,JSON.stringify(d));}catch(e){}}}}catch(e){}}
  if(!d){d=feedCached();if(d)state='cached';}
  if(!d){d=fixFeed(JSON.parse(JSON.stringify(DEMO)));state='demo';}
  d.state=state;return d;
}

}

  im.src=FEED_BASE+a.path+'?v='+encodeURIComponent(a.time||'');im.onerror=()=>{im._bad=1;};return PHOTOS[a.path]=im;}

function spdOf(F){return F.st.spd*(F.fx.slow>0?.7:1);}
function hitDamage(A,Bf,power,stat,opts){ // one hit with all the powers applied
  opts=opts||{};const r={miss:false,crit:false,zap:false,dmg:0};
  if(!opts.sure){let dodge=Math.max(0,(spdOf(Bf)-spdOf(A))/350);if(Bf.name==='Galaxy')dodge+=.2;dodge+=bossDodge(Bf);if(LR()>(opts.acc||1)-dodge){r.miss=true;return r;}}
  const At=(A.st[stat]||A.st.atk)*A.atkMod,D=Bf.st.def;let dmg=power*2.3*DMG_BOOST*(At/(At+D))*LRN(.8,1.2);
  if(A.name==='Buster')dmg*=1+A.mom;if(A.name==='Bella'&&A.hp/A.max<.4)dmg*=1.35;if(A.fx.rage>0)dmg*=1.4;
  if(A.name==='Cloudy'&&LR()<.3){dmg*=1.4;r.zap=true;}
  if(LR()<.10+bossCrit(A)+spdOf(A)/600){dmg*=1.8;r.crit=true;}
  if(Bf.name==='Buster')dmg*=.8;dmg*=bossArmor(Bf);
  r.dmg=Math.max(3,Math.round(dmg));return r;}
function charge(F,v){F.pw=Math.min(PW_FULL,F.pw+v);}
function resolve(A,Bf,mv){
  const r={miss:false,crit:false,dmg:0,heal:0,hpBefore:A.hp};
  if(mv.uses<99)mv.uses--;
  if(mv.kind==='heal'){r.heal=Math.round(A.max*LRN(.25,.35));r.hpAfter=Math.min(A.max,A.hp+r.heal);r.heal=r.hpAfter-A.hp;charge(A,10);return r;}
  if(mv.kind==='debuff'){if(LR()<mv.acc){Bf.atkMod*=.8;charge(A,12);}else r.miss=true;return r;}
  const h=hitDamage(A,Bf,mv.power,mv.stat,{acc:mv.acc});Object.assign(r,h);
  if(r.miss){r.hpAfter=Bf.hp;charge(Bf,6);return r;}
  if(A.name==='Buster')A.mom=Math.min(.36,A.mom+.06);
  charge(A,r.dmg*1.4);charge(Bf,r.dmg*1.1);
  r.hpAfter=Math.max(0,Bf.hp-r.dmg);return r;
}
function cpuPick(A,Bf,smart){
  if(A.pw>=PW_FULL&&Math.random()<.85)return ULT;
  const ok=A.moves.filter(m=>m.uses>0),heal=ok.filter(m=>m.kind==='heal'),deb=ok.filter(m=>m.kind==='debuff'),hits=ok.filter(m=>m.kind==='hit');
  if(heal.length&&A.hp/A.max<.35&&Math.random()<.65+.25*smart)return heal[0];
  if(deb.length&&Bf.atkMod>.8&&Math.random()<.14)return deb[0];
  if(!hits.length)return ok[0]||A.moves[0];
  if(Math.random()<smart){const exp=m=>{const At=(A.st[m.stat]||A.st.atk)*A.atkMod;return m.power*m.acc*(At/(At+Bf.st.def))*(m.sig?1.05:1);};return hits.slice().sort((x,y)=>exp(y)-exp(x))[0];}
  const w=hits.map(m=>m.sig?2.2:1),sum=w.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<hits.length;i++){r-=w[i];if(r<=0)return hits[i];}return hits[0];
}

// fancy particles for the effects above
function drawPart(p,k){
  if(p.heart){cx.save();cx.translate(p.x,p.y);cx.scale(p.r/9,p.r/9);cx.beginPath();cx.moveTo(0,8);cx.bezierCurveTo(-10,0,-8,-8,0,-4);cx.bezierCurveTo(8,-8,10,0,0,8);cx.fill();cx.restore();return true;}
  if(p.leaf||p.feather){cx.save();cx.translate(p.x,p.y);cx.rotate(p.age*(p.spin||2));cx.beginPath();if(p.feather){cx.moveTo(-p.r*1.6,0);cx.quadraticCurveTo(0,-p.r*.6,p.r*1.6,0);cx.quadraticCurveTo(0,p.r*.6,-p.r*1.6,0);}else cx.ellipse(0,0,p.r,p.r*.55,0,0,7);cx.fill();cx.restore();return true;}
  if(p.bubble){cx.strokeStyle=p.col;cx.lineWidth=1.6;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.stroke();cx.fillStyle='rgba(255,255,255,.6)';cx.beginPath();cx.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.22,0,7);cx.fill();return true;}
  if(p.treat){cx.save();cx.translate(p.x,p.y);cx.rotate(p.age*(p.spin||2));const r=p.r;cx.fillStyle='#e8c890';cx.strokeStyle='#a8743a';cx.lineWidth=1.2;cx.beginPath();cx.roundRect(-r,-r*.3,r*2,r*.6,r*.3);cx.fill();cx.stroke();for(const sx of[-1,1])for(const sy of[-1,1]){cx.beginPath();cx.arc(sx*r,sy*r*.3,r*.35,0,7);cx.fill();cx.stroke();}cx.restore();return true;}
  if(p.smoke){cx.fillStyle=`rgba(200,200,210,${.55*k})`;cx.beginPath();cx.arc(p.x,p.y,p.r*(1.6-k),0,7);cx.fill();return true;}
  if(p.dust){cx.fillStyle=`rgba(190,160,130,${.5*k})`;cx.beginPath();cx.arc(p.x,p.y,p.r*(1.8-k),0,7);cx.fill();return true;}

function qte(F,kind){return new Promise(res=>{
  if(!S.taps||!B){res('none');return;}
  const c=centerOf(F),r0=c.s*.36,dur=kind==='atk'?1.0:B.online?.8:[.95,.8,.66][S.diff]||.8,t0=NOW,col=kind==='atk'?'#ffd34a':'#5ad8ff';let done=null,shown=0;
  const box=$('qte');box.hidden=false;
  const draw=()=>{const k=(NOW-t0)/dur,r=r0*(2.7-2.3*Math.min(1,k));
    cx.save();cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(0,0,W,H);
    cx.setLineDash([10,8]);cx.lineDashOffset=-NOW*40;cx.strokeStyle='rgba(255,255,255,.95)';cx.lineWidth=5;cx.beginPath();cx.arc(c.x,c.y,r0,0,7);cx.stroke();cx.setLineDash([]);
    cx.strokeStyle=rgba('#ffffff',.25);cx.lineWidth=r0*.24;cx.beginPath();cx.arc(c.x,c.y,r0,0,7);cx.stroke();
    if(!done){cx.shadowColor=col;cx.shadowBlur=18;cx.strokeStyle=col;cx.lineWidth=7;cx.beginPath();cx.arc(c.x,c.y,r,0,7);cx.stroke();cx.shadowBlur=0;}
    cx.font='900 '+Math.round(clamp(W*.045,26,44))+'px "Avenir Next Condensed","Futura","Impact",sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=7;cx.strokeStyle='#000';
    const label=kind==='atk'?'TAP TO POWER UP!':'TAP TO BLOCK!';cx.strokeText(label,c.x,c.y-c.s*.78);cx.fillStyle=col;cx.fillText(label,c.x,c.y-c.s*.78);cx.restore();};
  FXDRAW.push(draw);
  const finish=(q,txt,tc)=>{if(done)return;done=q;box.hidden=true;box.onpointerdown=null;setTimeout(()=>{const i=FXDRAW.indexOf(draw);if(i>=0)FXDRAW.splice(i,1);},q==='none'?0:160);
    if(txt)floatText(c.x,c.y-c.s*.5,txt,tc,q==='perfect');if(q==='perfect'){play('chime',{vol:.5,vary:0,rate:1.3});burst(c.x,c.y,col,22,360,4);}
    res(q);};
  box.onpointerdown=e=>{e.preventDefault();const k=(NOW-t0)/dur,r=r0*(2.7-2.3*Math.min(1,k)),d=Math.abs(r-r0)/r0;
    if(d<.13)finish('perfect','PERFECT!','#7dff9a');else if(d<.34)finish('good','GOOD!','#ffd34a');else finish('none',r>r0?'TOO EARLY':'TOO LATE','#cfd8ff');};
  const tick=()=>{if(done)return;if(!B){finish('none');return;}if(NOW-t0>dur*1.18){finish('none','MISSED','#cfd8ff');return;}requestAnimationFrame(tick);};tick();});}

function h2h(a,b){let wa=0,wb=0;for(const x of(FEED&&FEED.battles)||[]){if((x.a===a&&x.b===b)||(x.a===b&&x.b===a)){if(x.winner===a)wa++;else if(x.winner===b)wb++;}}
  for(const x of S.history||[]){if((x.a===a&&x.b===b)||(x.a===b&&x.b===a)){if(x.w===a)wa++;else if(x.w===b)wb++;}}return[wa,wb];}
function rivalOf(name){let best=null,n=1;for(const p of PETS){if(p.name===name)continue;const[x,y]=h2h(name,p.name);if(x+y>n){n=x+y;best=p.name;}}return best;}

// timing taps, blocks and combos for one move (changes the damage before the hit plays)
async function fightTiming(A,O,mv,res,i){
  if(mv.kind!=='hit'){A.lastMv=mv;return;}
  if(res.miss){A.combo=0;A.lastMv=mv;return;}
  A.combo=(A.lastMv&&A.lastMv!==mv&&A.combo>0)?Math.min(5,A.combo+1):1;A.lastMv=mv;let m=1+.07*(A.combo-1);
  const ca=centerOf(A);if(A.combo>=2){floatText(ca.x,ca.y-ca.s*.85,'COMBO x'+A.combo,'#ff7ad8',A.combo>=4);if(B.human[i])evt('combo',A.combo);}
  const cb=centerOf(O);
  if(B.online){m=await netTiming(A,O,i,m,res);if(!B)return;}
  else if(B.human[i]){const q=await qte(O,'atk');if(!B)return;if(q==='perfect'){m*=1.3;evt('perfect');}else if(q==='good')m*=1.12;
    if(!B.human[1-i]&&q!=='perfect'&&Math.random()<[.06,.14,.22][B.dIdx]){m*=.6;floatText(cb.x,cb.y-cb.s*.62,'BLOCKED','#9ad8ff',true);}}
  else if(B.human[1-i]){const q=await qte(O,'def');if(!B)return;if(q==='perfect'){m*=.25;evt('block');evt('perfect');O.counter=Math.max(2,Math.round(res.dmg*.3));A.combo=0;floatText(cb.x,cb.y-cb.s*.62,'PERFECT BLOCK','#7dff9a',true);}
    else if(q==='good'){m*=.55;evt('block');floatText(cb.x,cb.y-cb.s*.62,'BLOCK','#9ad8ff',true);}}

function simulateFight(pa,pb){const A=mkFighter(pa.p,0,{shadow:pa.shadow}),Bq=mkFighter(pb.p,1,{shadow:pb.shadow}),f=[A,Bq];
  for(let r=0;r<30;r++){const picks=f.map((F,i)=>cpuPick(F,f[1-i],.5));const order=spdOf(A)+rnd(0,18)>=spdOf(Bq)+rnd(0,18)?[0,1]:[1,0];
    for(const i of order){const X=f[i],Y=f[1-i];if(X.hp<=0||Y.hp<=0)break;const mv=picks[i];
      if(mv===ULT){X.pw=0;Y.hp=Math.max(0,Y.hp-hitDamage(X,Y,55,'atk',{sure:true}).dmg);continue;}
      const res=resolve(X,Y,mv);if(mv.kind==='heal')X.hp=res.hpAfter;else if(mv.kind==='hit'&&!res.miss)Y.hp=res.hpAfter;}
    if(A.hp<=0)return 1;if(Bq.hp<=0)return 0;for(const F of f)charge(F,8);}
  return A.hp/A.max>=Bq.hp/Bq.max?0:1;}

function tourMyIndex(){const R=TOUR.rounds[TOUR.r];return R.findIndex(e=>e&&e.me);}
function tourAdvance(myWon){const R=TOUR.rounds[TOUR.r],N=TOUR.rounds[TOUR.r+1],mi=tourMyIndex();

// ===================== PLAY ONLINE: 2 iPads with a room code (WebRTC through PeerJS) =====================
// Turn fights: both iPads run the same fight with the same random seed; only the moves and timing taps are sent.
// Brawl: the host's iPad runs the brawl. The guest sends its stick + buttons, the host sends back where everything is
// (about 30 times a second) plus the sounds, banners and sparkles, so both screens show the same fight.
const NETV=1,NET_PREFIX='waugusta-petarena-v1-',NET_LET='ABCDEFGHJKMNPQRSTUVWXYZ';
const NET={on:false,host:false,side:0,peer:null,conn:null,code:'',cid:'',gid:'',peerName:'Friend',sq:0,rq:0,out:[],got:{},waits:{},room:null,gpet:null,
  hb:false,gb:false,replay:false,status:'',lost:0,fxq:[],lastSnap:0,lastRx:0,rtt:0,again:{},match:null,mid:0,screen:'',rng:null,inK:'',inT:0,met:false};
S.net=Object.assign({name:'',w:0,l:0,pet:null,cid:''},S.net||{});
if(!S.net.cid){S.net.cid=Math.random().toString(36).slice(2,10);save();}
function MEPL(){return BRW.cfg&&BRW.cfg.mode==='online'?NET.side:0;}
function MINE(F){return!!F&&!!F.human&&(!(BRW.cfg&&BRW.cfg.mode==='online')||F.side===NET.side);}
function LR(){return NET.rng?NET.rng():Math.random();}
function LRN(a,b){return a+LR()*(b-a);}
function netLab(F){return F.side===NET.side?'YOU':(NET.peerName||'Friend').toUpperCase().slice(0,12);}
function myName(){return(S.net.name||'').trim().slice(0,12)||'Player';}
function petJSON(p){return JSON.parse(JSON.stringify(p,(k,v)=>k[0]==='_'?undefined:v));}
let PEERJS=null;
function loadPeer(){if(window.Peer)return Promise.resolve();if(PEERJS)return PEERJS;
  PEERJS=new Promise((res,rej)=>{const s=document.createElement('script');s.src='assets/peerjs.min.js?v=155';s.onload=()=>res();s.onerror=()=>{PEERJS=null;s.remove();rej(new Error('load'));};document.head.appendChild(s);});return PEERJS;}
function peerOpts(){return Object.assign({debug:0},window.__PEEROPTS||{});}
function netCode(){let s='';for(let i=0;i<4;i++)s+=NET_LET[Math.floor(Math.random()*NET_LET.length)];return s;}
// ---------- connection ----------
function netReset(){clearInterval(NET.tick);try{if(NET.conn)NET.conn.close();}catch(e){}try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{on:false,host:false,side:0,peer:null,conn:null,code:'',gid:'',peerName:'Friend',sq:0,rq:0,out:[],got:{},waits:{},room:null,gpet:null,hb:false,gb:false,replay:false,
    status:'',lost:0,fxq:[],lastSnap:0,lastRx:0,again:{},match:null,screen:'',rng:null,met:false,pausedByNet:0});netOverlay(false);netPill(false);}
function netStartTick(){clearInterval(NET.tick);NET.tick=setInterval(()=>{if(!NET.on)return;const now=Date.now();
  if(NET.conn&&NET.conn.open&&!NET.lost){netSendRaw({t:'ping',ts:performance.now(),ack:NET.rq});if(NET.met&&NET.lastRx&&now-NET.lastRx>7000)netLost();}
  if(NET.lost){if(now-NET.lost>45000)return netGiveUp();if(!NET.host)netRedial();netOverlay(true);}
  const pe=$('nPing');if(pe&&NET.rtt)pe.textContent=Math.round(NET.rtt)+' ms';},2000);}
function netPeerEvents(p){
  p.on('disconnected',()=>{if(NET.peer!==p||p.destroyed)return;setTimeout(()=>{try{if(NET.peer===p&&p.disconnected&&!p.destroyed)p.reconnect();}catch(e){}},1500);});

    if(t==='unavailable-id'&&NET.host&&!NET.met){try{p.destroy();}catch(x){}netOpenHost();return;}
    if(t==='peer-unavailable'){if(NET.met)return;NET.status='nocode';return netScreen();}
    if(t==='browser-incompatible'){NET.status='nobrowser';return netScreen();}
    if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){if(!NET.met&&!p.open){NET.status='noserver';netScreen();}}});}
async function netHost(){try{await loadPeer();}catch(e){return netHome('Could not load the online part. Check the internet and try again.');}
  netReset();NET.on=true;NET.host=true;NET.side=0;NET.cid=S.net.cid;NET.status='opening';netOpenHost();netStartTick();netScreen();}
function netOpenHost(){NET.code=netCode();const p=new Peer(NET_PREFIX+NET.code,peerOpts());NET.peer=p;netPeerEvents(p);
  p.on('open',()=>{if(NET.peer!==p)return;if(NET.status==='opening'){NET.status='waiting';netScreen();}});

async function netJoin(code){try{await loadPeer();}catch(e){return netHome('Could not load the online part. Check the internet and try again.');}
  netReset();NET.on=true;NET.host=false;NET.side=1;NET.code=code;NET.cid=S.net.cid;NET.status='joining';
  const p=new Peer(peerOpts());NET.peer=p;netPeerEvents(p);p.on('open',()=>{if(NET.peer===p&&!NET.conn)netDial();});netStartTick();netScreen();
  setTimeout(()=>{if(NET.on&&!NET.host&&!NET.met&&NET.status==='joining'&&NET.code===code){NET.status='slow';netScreen();}},15000);}

function netRedial(){const p=NET.peer;if(!p||p.destroyed)return;if(p.disconnected){try{p.reconnect();}catch(e){}return;}netDial();}
function netSendRaw(m){const c=NET.conn;if(!c||!c.open)return false;try{c.send(m);return true;}catch(e){return false;}}
const NET_REL={start:1,pick:1,qte:1,end:1,again:1};
function netSend(m){if(NET_REL[m.t]){m.sq=++NET.sq;NET.out.push(m);}return netSendRaw(m);}
