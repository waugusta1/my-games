  d.pets=PET_ORDER.filter(n=>by[n]).concat(Object.keys(by).filter(n=>!PET_ORDER.includes(n))).map(n=>{

// ---------- battle rules (same as the camera's /battle) ----------
function resolve(A,Bf,mv){
  const r={miss:false,crit:false,dmg:0,heal:0,hpBefore:A.hp};
  if(mv.uses<99)mv.uses--;
  if(mv.kind==='heal'){r.heal=Math.round(A.max*rnd(.22,.32));r.hpAfter=Math.min(A.max,A.hp+r.heal);r.heal=r.hpAfter-A.hp;return r;}
  if(mv.kind==='debuff'){if(Math.random()<mv.acc)Bf.atkMod*=.8;else r.miss=true;return r;}
  const dodge=Math.max(0,(Bf.st.spd-A.st.spd)/350);
  if(Math.random()>mv.acc-dodge){r.miss=true;r.hpAfter=Bf.hp;return r;}
  const At=(A.st[mv.stat]||A.st.atk)*A.atkMod,D=Bf.st.def;let dmg=mv.power*2.3*(At/(At+D))*rnd(.75,1.25);
  if(Math.random()<.10+A.st.spd/600){dmg*=1.7;r.crit=true;}
  r.dmg=Math.max(3,Math.round(dmg));r.hpAfter=Math.max(0,Bf.hp-r.dmg);return r;
}
function cpuPick(A,Bf,smart){
  const ok=A.moves.filter(m=>m.uses>0),heal=ok.filter(m=>m.kind==='heal'),deb=ok.filter(m=>m.kind==='debuff'),hits=ok.filter(m=>m.kind==='hit');
  if(heal.length&&A.hp/A.max<.35&&Math.random()<.65+.25*smart)return heal[0];
  if(deb.length&&Bf.atkMod>.8&&Math.random()<.14)return deb[0];
  if(!hits.length)return ok[0]||A.moves[0];
  if(Math.random()<smart){const exp=m=>{const At=(A.st[m.stat]||A.st.atk)*A.atkMod;return m.power*m.acc*(At/(At+Bf.st.def))*(m.sig?1.05:1);};return hits.slice().sort((x,y)=>exp(y)-exp(x))[0];}
  const w=hits.map(m=>m.sig?2.2:1),sum=w.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<hits.length;i++){r-=w[i];if(r<=0)return hits[i];}return hits[0];
}

async function loopRounds(){
  while(B&&!B.over){
    B.round++;
    if(B.round>30){const w=B.f[0].hp/B.f[0].max>=B.f[1].hp/B.f[1].max?0:1;const d=voiceSay('time','','','#ffd34a',1.8,true);if(!d)banner('TIME! JUDGES DECIDE','#ffd34a',1.6);await wait(Math.max(1.4,d));return endBattle(w);}
    const picks=[];
    for(const F of B.f){const O=B.f[1-F.side];if(B.human[F.side]){picks[F.side]=await askMove(F,O);if(!B)return;}else picks[F.side]=cpuPick(F,O,B.smart);}
    hideMoves();
    const sp=B.f.map(F=>F.st.spd+rnd(0,18));const order=sp[0]>=sp[1]?[0,1]:[1,0];
    for(const i of order){if(!B)return;const A=B.f[i],O=B.f[1-i];if(A.hp<=0||O.hp<=0)break;const mv=picks[i];
      B.say=null;floatText(centerOf(A).x,centerOf(A).y-centerOf(A).s*.62,mv.name.toUpperCase(),mv.color||'#fff');
      const res=resolve(A,O,mv);if(res.crit)B.crits+= (B.human[i]?1:0);if(!B.human[i]&&B.human[1-i]&&res.dmg)B.dmgTaken+=res.dmg;
      await animMove(A,O,mv,res);
      if(mv.kind==='heal'){A.hp=res.hpAfter;}else if(mv.kind==='hit'&&!res.miss)O.hp=res.hpAfter;
      // commentary
      let tag=null;if(O.hp<=0)tag='ko';else if(res.crit)tag='crit';else if(res.miss&&Math.random()<.6)tag='miss';else if(mv.kind==='heal')tag='heal';else if(mv.kind==='debuff'&&!res.miss)tag='debuff';
      else if(O.hp/O.max<.2&&O.lowest>=.2)tag='low';else if(A.lowest<.25&&A.hp/A.max<.3&&res.dmg>=20&&Math.random()<.7)tag='comeback';else if(res.dmg>=28&&Math.random()<.6)tag='big';
      O.lowest=Math.min(O.lowest,O.hp/O.max);
      if(tag){const big=tag==='crit'||tag==='ko'||tag==='comeback';const col=tag==='ko'?'#ff5a3a':tag==='heal'?'#7dff9a':'#ffd34a';const d=voiceSay(tag,A.name,O.name,col,1.6,tag==='ko');if(big)sfx('cheer');if(d&&tag==='ko')await wait(d);}
      if(O.hp<=0){sfx('ko');FLASH=.6;FLASHC='#fff';await tween(.9,k=>{O.dy=k*40;O.rot=(O.side?1:-1)*k*.5;O.alpha=1-k*.6;});return endBattle(A.side);}
      await wait(.35);}
  }
}

function startGauntlet(p){
  const others=PETS.filter(x=>x.name!==p.name).sort((x,y)=>x.level-y.level);const strongest=others.slice().sort((x,y)=>y.level-x.level)[0]||p;
  const tier=petRec(p.name).gt||0;
  const list=others.map(o=>({pet:o})).concat([{pet:p,shadow:1.15+.1*tier,boss:true}]);
  gauntletScreen({a:p,list,i:0,hp:null,tier},null);
}
function gauntletScreen(g,note){
  TITLEPETS=null;const p=g.a;
  setScreen(topbar('THE GAUNTLET','home')+`<div class="wrap"><div class="gl">${g.list.map((x,i)=>`<div class="gs ${i<g.i?'done':i===g.i?'now':''}${x.boss?' boss':''}">${photoTag(x.pet)}<b>${x.boss?'SHADOW '+esc(x.pet.name.toUpperCase()):esc(x.pet.name)}</b><span>${i<g.i?'Beaten':i===g.i?'Next':x.boss?'Final boss · Tier '+(g.tier+1):'LV '+x.pet.level}</span></div>`).join('')}</div>
   <p class="gnote">${note?esc(note)+' · ':''}${esc(p.name)} has ${g.hp==null?'full':g.hp+' / '+eff(p).hp} HP${g.list[g.i].boss?' · The Shadow is a stronger copy of '+esc(p.name)+' itself':''}</p>
   <div class="dbtn"><button class="big purple" id="gNext"><b>Fight ${g.list[g.i].boss?'the Shadow':esc(g.list[g.i].pet.name)}</b></button></div></div>`,'pooldeck');
  $('gNext').onclick=()=>{ac();const x=g.list[g.i];startBattle({mode:'gauntlet',a:p,b:x.pet,shadow:x.shadow,arena:x.boss?'storm':ARENAS[g.i%3].id==='sunset'&&S.ap<100?'yard':ARENAS[g.i%3].id,human:[true,false],g,hpA:g.hp});};
}
function resultScreen(o){
  cv.hidden=false;$('hud').hidden=true;
  ui().innerHTML=`<div class="res${o.lose?' lose':''}"><div class="rt">${o.title}</div><div class="rph" style="--pc:${o.pet.color}">${photoTag(o.pet)}</div><div class="rs">${esc(o.sub)}</div>
   ${o.gain!=null?`<div class="ap">+${o.gain} arena points</div>`:''}${o.rankUp?`<div class="rankup">${icon('trophy',18)} New rank: ${o.rankUp}</div>`:''}
   <div class="rb">${o.buttons.map(([t,k],i)=>`<button class="big ${i?'gold':'red'}" data-go='${esc(k)}'><b>${t}</b></button>`).join('')}</div></div>`;wire();
  if(o.lose)sfx('lose');
}
function records(){
  TITLEPETS=null;const r=rankOf(S.ap);const ord=PETS.slice().sort((a,b)=>petRec(b.name).w-petRec(a.name).w);
  setScreen(topbar('RECORD BOOK')+`<div class="wrap"><div class="rk"><div><b>${S.ap}</b><span>Arena points</span></div><div><b>${r.name}</b><span>Rank</span></div><div><b>${S.wins}-${S.losses}</b><span>Your fights</span></div><div><b>${S.bestStreak}</b><span>Best win streak</span></div><div><b>${S.gauntClears}</b><span>Gauntlets cleared</span></div><div><b>${S.flawless}</b><span>Flawless wins</span></div></div>
   <h4>ARENA LEADERBOARD</h4><table class="tb"><tr><th></th><th>Pet</th><th>Arena</th><th>Gauntlet</th><th>Camera battles</th><th>Badges</th></tr>${ord.map((p,i)=>`<tr><td>${i+1}</td><td><b style="color:${p.color}">${esc(p.name)}</b></td><td>${petRec(p.name).w}-${petRec(p.name).l}</td><td>${petRec(p.name).gt?'x'+petRec(p.name).gt:'-'}</td><td>${p.wins}-${p.losses}</td><td>${p.achievements.length}</td></tr>`).join('')}</table>
   ${FEED.battles&&FEED.battles.length?`<h4>LATEST /BATTLE FIGHTS IN DISCORD</h4><div class="hist">${FEED.battles.slice().reverse().map(b=>`<div><b>${esc(b.winner||'?')}</b> beat ${esc(b.winner===b.a?b.b:b.a)}<span>${agoText(b.time)}</span></div>`).join('')}</div>`:''}
   ${S.history.length?`<h4>YOUR LAST FIGHTS HERE</h4><div class="hist">${S.history.slice(0,12).map(h=>`<div>${esc(h.a)} vs ${esc(h.b)} · <b>${esc(h.w)}</b> won<span>${agoText(new Date(h.t).toISOString())}</span></div>`).join('')}</div>`:''}</div>`);
}
// ---------- pause ----------
function openPause(inBattle){
  const m=$('pause');m.hidden=false;
  m.innerHTML=`<div class="pbox"><h3>PAUSED</h3><button class="big gold" id="pRes"><b>Resume</b></button>
   <button class="tg" id="pSnd">${icon('sound',16)} Sound: ${S.sound?'On':'Off'}</button><button class="tg" id="pVoc">Commentator voice: ${S.voice?'On':'Off'}</button>
   <button class="tg" id="pRef">${icon('cam',16)} Get the newest pet data</button>
   ${inBattle?'<button class="tg" id="pQuit">Leave this fight</button>':''}
   <button class="big red" id="pExit"><b>Go back to games</b></button><button class="xb" id="pX" aria-label="Close">${icon('x',18)}</button></div>`;
  const close=()=>{m.hidden=true;m.innerHTML='';};
  $('pRes').onclick=close;$('pX').onclick=close;
  $('pSnd').onclick=()=>{S.sound=!S.sound;save();if(!S.sound)crowdOn(false);openPause(inBattle);};
  $('pVoc').onclick=()=>{S.voice=!S.voice;save();if(!S.voice&&window.speechSynthesis)speechSynthesis.cancel();openPause(inBattle);};
  $('pRef').onclick=async()=>{$('pRef').textContent='Checking the camera...';await boot(true);close();};
  $('pExit').onclick=()=>{location.href='index.html';};
  if(inBattle)$('pQuit').onclick=()=>{close();crowdOn(false);if(window.speechSynthesis)speechSynthesis.cancel();ANIMS.length=0;FXDRAW.length=0;B=null;home();};
}
// ---------- boot ----------
async function boot(refresh){
  FEED=await loadFeed();PETS=FEED.pets;PETS.forEach(p=>petPhoto(p,'photo'));
  if(!refresh||!B)home();
}
resize();requestAnimationFrame(frame);
ui().innerHTML='<div class="loading"><h1>PET ARENA</h1><p>Asking the camera for the newest stats...</p></div>';
boot();
document.addEventListener('visibilitychange',()=>{if(document.hidden){crowdOn(false);if(window.speechSynthesis)speechSynthesis.cancel();}});
</script></body></html>
