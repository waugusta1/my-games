function fixFeed(d){
  if(!d||!Array.isArray(d.pets)||!d.pets.length)return null;
  const by={};d.pets.forEach(p=>{if(p&&p.name)by[p.name]=p;});
  d.pets=PET_ORDER.filter(n=>by[n]).concat(Object.keys(by).filter(n=>!PET_ORDER.includes(n))).map(n=>{
    const p=Object.assign(demoPet(n,{}),by[n],{demo:!!d.demo});
    p.stats=Object.assign({hp:150,atk:40,def:40,spd:40,spc:40},p.stats||{});
    if(!p.moves||!p.moves.length)p.moves=(DEMO.pets.find(x=>x.name===n)||DEMO.pets[0]).moves;
    ['hours24','by_hour'].forEach(k=>{if(!Array.isArray(p[k])||p[k].length!==24)p[k]=Array(24).fill(0);});
    if(!Array.isArray(p.days7)||p.days7.length!==7)p.days7=Array(7).fill(0);
    if(!Array.isArray(p.album))p.album=[];
    return p;});
  return d;
}

// state: 'live' (fresh from the camera), 'cached' (offline, last copy), 'demo' (camera hasn't sent anything yet)
async function loadFeed(){
  let d=null,state='demo';
  // 1) GitHub API: always the newest copy (right after /games update). 2) raw file: can be up to 5 min old.
  const tries=[[FEED_API,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'}],[FEED_BASE+'pets.json?t='+Date.now(),{cache:'no-store'}]];
  for(const[url,opt]of tries){if(d)break;
    try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(url,Object.assign({signal:ctl.signal},opt));clearTimeout(t);
      if(r.ok){d=fixFeed(await r.json());if(d){state='live';try{localStorage.setItem(FEED_CACHE,JSON.stringify(d));}catch(e){}}}}catch(e){}}
  if(!d){d=feedCached();if(d)state='cached';}
  if(!d){d=fixFeed(JSON.parse(JSON.stringify(DEMO)));state='demo';}
  d.state=state;return d;
}

  im.src=FEED_BASE+path+'?v='+encodeURIComponent(p[(which||'photo')+'_time']||p.photo_time||'');
  im.onerror=()=>{im._bad=1;};PHOTOS[k]=im;return im;
}
function randomPhoto(p){ // a different real photo each time (best photo + the album)

  const a=pick(opts);if(PHOTOS[a.path])return PHOTOS[a.path];const im=new Image();im.crossOrigin='anonymous';im.decoding='async';
  im.src=FEED_BASE+a.path+'?v='+encodeURIComponent(a.time||'');im.onerror=()=>{im._bad=1;};return PHOTOS[a.path]=im;}

function agoText(iso){if(!iso)return 'not seen yet';const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400){const h=Math.floor(s/3600);return h+(h===1?' hour':' hours')+' ago';}

// end of a round: burns, Mama's healing, effects wear off, power bars fill a little
async function roundEnd(){
  for(const F of B.f){if(F.hp<=0)continue;const c=centerOf(F);
    if(F.fx.burn>0){const d=Math.max(2,Math.round(F.max*.05));F.hp=Math.max(1,F.hp-d);sfx('burn',{O:F});floatText(c.x,c.y-c.s*.3,'-'+d+' BURN','#ff9a4a');burst(c.x,c.y,'#ff7a2a',12,200,4);F.fx.burn--;}

function spdOf(F){return F.st.spd*(F.fx.slow>0?.7:1);}
function hitDamage(A,Bf,power,stat,opts){ // one hit with all the powers applied
  opts=opts||{};const r={miss:false,crit:false,zap:false,dmg:0};
  if(!opts.sure){let dodge=Math.max(0,(spdOf(Bf)-spdOf(A))/350);if(Bf.name==='Galaxy')dodge+=.2;dodge+=bossDodge(Bf);if(Math.random()>(opts.acc||1)-dodge){r.miss=true;return r;}}
  const At=(A.st[stat]||A.st.atk)*A.atkMod,D=Bf.st.def;let dmg=power*2.3*DMG_BOOST*(At/(At+D))*rnd(.8,1.2);
  if(A.name==='Buster')dmg*=1+A.mom;if(A.name==='Bella'&&A.hp/A.max<.4)dmg*=1.35;if(A.fx.rage>0)dmg*=1.4;
  if(A.name==='Cloudy'&&Math.random()<.3){dmg*=1.4;r.zap=true;}
  if(Math.random()<.10+bossCrit(A)+spdOf(A)/600){dmg*=1.8;r.crit=true;}
  if(Bf.name==='Buster')dmg*=.8;dmg*=bossArmor(Bf);
  r.dmg=Math.max(3,Math.round(dmg));return r;}
function charge(F,v){F.pw=Math.min(PW_FULL,F.pw+v);}
function resolve(A,Bf,mv){
  const r={miss:false,crit:false,dmg:0,heal:0,hpBefore:A.hp};
  if(mv.uses<99)mv.uses--;
  if(mv.kind==='heal'){r.heal=Math.round(A.max*rnd(.25,.35));r.hpAfter=Math.min(A.max,A.hp+r.heal);r.heal=r.hpAfter-A.hp;charge(A,10);return r;}
  if(mv.kind==='debuff'){if(Math.random()<mv.acc){Bf.atkMod*=.8;charge(A,12);}else r.miss=true;return r;}
  const h=hitDamage(A,Bf,mv.power,mv.stat,{acc:mv.acc});Object.assign(r,h);
  if(r.miss){r.hpAfter=Bf.hp;charge(Bf,6);return r;}
  if(A.name==='Buster')A.mom=Math.min(.36,A.mom+.06);
  charge(A,r.dmg*1.4);charge(Bf,r.dmg*1.1);
  r.hpAfter=Math.max(0,Bf.hp-r.dmg);return r;
}
function cpuPick(A,Bf,smart){
  if(A.pw>=PW_FULL&&Math.random()<.85)return ULT;
  const ok=A.moves.filter(m=>m.uses>0),heal=ok.filter(m=>m.kind==='heal'),deb=ok.filter(m=>m.kind==='debuff'),hits=ok.filter(m=>m.kind==='hit');
  if(heal.length&&A.hp/A.max<.35&&Math.random()<.65+.25*smart)return heal[0];
  if(deb.length&&Bf.atkMod>.8&&Math.random()<.14)return deb[0];
  if(!hits.length)return ok[0]||A.moves[0];
  if(Math.random()<smart){const exp=m=>{const At=(A.st[m.stat]||A.st.atk)*A.atkMod;return m.power*m.acc*(At/(At+Bf.st.def))*(m.sig?1.05:1);};return hits.slice().sort((x,y)=>exp(y)-exp(x))[0];}
  const w=hits.map(m=>m.sig?2.2:1),sum=w.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<hits.length;i++){r-=w[i];if(r<=0)return hits[i];}return hits[0];
}

async function loopRounds(){

      if(mv===ULT){const r=await doUltimate(A,O);if(!B)return;if(B.human[i])B.crits++;if(!B.human[i]&&B.human[1-i])B.dmgTaken+=r.dmg;
        if(O.hp<=0){const d=voiceSay('ko',A.name,O.name,'#ff5a3a',1.6,true);if(d)await wait(d+.15);slowmo(.3,1100);zoomAt(centerOf(O).x,centerOf(O).y,1.18);sfx('ko',{A,O});FLASH=.6;FLASHC='#fff';await tween(.9,k=>{O.dy=k*40;O.rot=(O.side?1:-1)*k*.5;O.alpha=1-k*.6;});return endBattle(A.side);}

// fancy particles for the effects above
function drawPart(p,k){
  if(p.heart){cx.save();cx.translate(p.x,p.y);cx.scale(p.r/9,p.r/9);cx.beginPath();cx.moveTo(0,8);cx.bezierCurveTo(-10,0,-8,-8,0,-4);cx.bezierCurveTo(8,-8,10,0,0,8);cx.fill();cx.restore();return true;}
  if(p.leaf||p.feather){cx.save();cx.translate(p.x,p.y);cx.rotate(p.age*(p.spin||2));cx.beginPath();if(p.feather){cx.moveTo(-p.r*1.6,0);cx.quadraticCurveTo(0,-p.r*.6,p.r*1.6,0);cx.quadraticCurveTo(0,p.r*.6,-p.r*1.6,0);}else cx.ellipse(0,0,p.r,p.r*.55,0,0,7);cx.fill();cx.restore();return true;}
  if(p.bubble){cx.strokeStyle=p.col;cx.lineWidth=1.6;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.stroke();cx.fillStyle='rgba(255,255,255,.6)';cx.beginPath();cx.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.22,0,7);cx.fill();return true;}
  if(p.treat){cx.save();cx.translate(p.x,p.y);cx.rotate(p.age*(p.spin||2));const r=p.r;cx.fillStyle='#e8c890';cx.strokeStyle='#a8743a';cx.lineWidth=1.2;cx.beginPath();cx.roundRect(-r,-r*.3,r*2,r*.6,r*.3);cx.fill();cx.stroke();for(const sx of[-1,1])for(const sy of[-1,1]){cx.beginPath();cx.arc(sx*r,sy*r*.3,r*.35,0,7);cx.fill();cx.stroke();}cx.restore();return true;}
  if(p.smoke){cx.fillStyle=`rgba(200,200,210,${.55*k})`;cx.beginPath();cx.arc(p.x,p.y,p.r*(1.6-k),0,7);cx.fill();return true;}
  if(p.dust){cx.fillStyle=`rgba(190,160,130,${.5*k})`;cx.beginPath();cx.arc(p.x,p.y,p.r*(1.8-k),0,7);cx.fill();return true;}
  return false;}

  setScreen(topbar('TROPHY ROOM')+`<div class="wrap"><div class="trh">${got} / ${TROPHIES.length} trophies</div><div class="shelf">${TROPHIES.map(t=>{const on=!!S.trophies[t.id];
    return`<div class="tro${on?'':' lock'}" style="--tc:${TRC[t.tr]}">${trophySVG(t.tr,!on,70)}<b>${esc(t.n)}</b><span>${esc(t.d)}</span>${on?`<em>${new Date(S.trophies[t.id]).toLocaleDateString()}</em>`:''}</div>`;}).join('')}</div></div>`,'pooldeck');}
// ---------- career: Road to Yard Champion ----------
const CAR_REW=[40,50,120,60,70,150,90,180,200,400];
function careerPlan(p){const o=PETS.filter(x=>x.name!==p.name).sort((a,b)=>a.level-b.level);const O=i=>o.length?o[i%o.length]:p;
  return[{k:'pet',opp:O(0),diff:0,arena:'yard',t:'First Day on the Porch',s:`Every champion starts somewhere. ${p.name}'s first fight is a friendly one against ${O(0).name}.`},
   {k:'pet',opp:O(1),diff:0,arena:'dining',t:'Dinner Time Brawl',s:`The food bowls are full and ${O(1).name} wants ${p.name}'s spot.`},
   {k:'boss',boss:'gallo',tier:0,arena:'yard',t:'The 5 AM Alarm',s:BOSS_DEFS.gallo.story,item:'f_feather'},
   {k:'pet',opp:O(2),diff:1,arena:'sunset',t:'Golden Hour',s:`The sun goes down over the pool. ${O(2).name} has been training all week.`},
   {k:'pet',opp:O(o.length-1),diff:1,arena:'pooldeck',t:'Night Swim',s:`The string lights are on. ${O(o.length-1).name}, the strongest in the house, is waiting.`},
   {k:'boss',boss:'sapo',tier:0,arena:'storm',t:'Puddle Trouble',s:BOSS_DEFS.sapo.story},
   {k:'pet',opp:O(p.name.length),diff:2,arena:'sunset',t:'The Big Leagues',s:`Champion level now. ${O(p.name.length).name} doesn't hold back anymore.`},
   {k:'boss',boss:'zanate',tier:1,arena:'yard',t:'Bird Attack',s:BOSS_DEFS.zanate.story,item:'w_feathers'},
   {k:'shadow',arena:'storm',t:'Face Your Shadow',s:`Lightning hits the pool and a dark copy of ${p.name} climbs out. The only way forward is through yourself.`},
   {k:'boss',boss:'iguana',tier:1,arena:'pooldeck',t:'King of the Wall',s:BOSS_DEFS.iguana.story,item:'f_champ',final:1}];}
function carOf(n){return S.car[n]=S.car[n]||{st:0,done:0};}
function careerPick(){TITLEPETS=null;setScreen(topbar('ROAD TO CHAMPION')+`<div class="wrap"><p class="lead">Ten fights from the porch to the top of the ivy wall. Pets, bosses, your own shadow, and the King of the Wall.</p><div class="picks">`+PETS.map(p=>{const c=carOf(p.name);
   return`<button class="pk" data-n="${esc(p.name)}" style="--pc:${p.color}">${photoTag(p)}<b>${esc(p.name)}</b><span>${c.done?icon('crown',14)+' Champion x'+c.done+' · ':''}Stage ${Math.min(10,c.st+1)} / 10</span><div class="cbar"><i style="width:${c.st*10}%"></i></div></button>`;}).join('')+`</div></div>`,'sunset');
  ui().querySelectorAll('.pk').forEach(b=>b.onclick=()=>{sfx('tap');careerMap(petByName(b.dataset.n));});}
function careerMap(p,note){TITLEPETS=null;const plan=careerPlan(p),c=carOf(p.name),cur=Math.min(c.st,9),st=plan[cur];
  const oppName=x=>x.k==='boss'?BOSS_DEFS[x.boss].name:x.k==='shadow'?'Shadow '+p.name:x.opp.name;
  setScreen(topbar(esc(p.name.toUpperCase())+"'S CAREER",'career')+`<div class="wrap">${note?`<div class="note">${note}</div>`:''}<div class="road">${plan.map((x,i)=>`<div class="node ${i<c.st?'done':i===cur?'now':''}${x.k==='boss'?' boss':''}${x.final?' final':''}">
     <div class="nb">${x.k==='boss'?`<img src="${bossURL(makeBoss(x.boss))}" alt="">`:x.k==='shadow'?`<div class="shd">${photoTag(p)}</div>`:photoTag(x.opp)}</div><b>${i+1}. ${esc(x.t)}</b><span>${esc(oppName(x))}</span>${i<c.st?`<i>${icon('star',12)} Won</i>`:''}</div>`).join('')}</div>
   <div class="story"><h3>Stage ${cur+1}: ${esc(st.t)}</h3><p>${esc(st.s)}</p><div class="sm2">${icon('treat',15)} ${CAR_REW[cur]} treats${st.item&&!owned(st.item)?' · unlocks '+esc(ITEM[st.item].n):''} · CPU: ${st.k==='boss'||st.k==='shadow'?'Boss':DIFFS[st.diff].n} · ${esc((ARENAS.find(a=>a.id===st.arena)||{}).n||'')}</div></div>
   <div class="dbtn"><button class="big red" id="carGo"><b>${c.st>=10?'Play the final again':'Fight '+esc(oppName(st))}</b></button></div></div>`,st.arena);
  $('carGo').onclick=()=>{ac();const b=st.k==='boss'?makeBoss(st.boss,st.tier):st.k==='shadow'?p:st.opp;
    startBattle({mode:'career',a:p,b,arena:st.arena,human:[true,false],diff:st.k==='pet'?st.diff:1,shadow:st.k==='shadow'?1.2:null,car:{stage:cur}});};}
// ---------- boss fights ----------
function bossPick(){TITLEPETS=null;
  setScreen(topbar('BOSS FIGHTS')+`<div class="wrap"><p class="lead">The real animals that visit our yard. Every time you beat one, it comes back stronger.</p><div class="bosses">`+BOSS_ORDER.map(id=>{const d=BOSS_DEFS[id],w=S.stat.bossW[id]||0,P=powerOf(d.name);
    return`<button class="bc" data-b="${id}" style="--pc:${d.color}"><img src="${bossURL(makeBoss(id))}" alt=""><div><b>${esc(d.name)}</b><span class="ti">${esc(d.title)} · Tier ${w+1}</span><p>${esc(d.story)}</p><div class="pow" style="--pc:${P.color}"><b>Power: ${esc(P.passive)}</b><span>${esc(P.pd)}</span><b>Super: ${esc(P.ult)}</b><span>${esc(P.ud)}</span></div><em>${w?'Beaten '+w+'x':'First win: '+(id==='iguana'?'Iguana Scales frame + ':'')+'150 treats'}</em></div></button>`;}).join('')+`</div></div>`,'storm');
  ui().querySelectorAll('.bc').forEach(b=>b.onclick=()=>{sfx('tap');const id=b.dataset.b;bossPetPick(id);});}
function bossPetPick(id){const d=BOSS_DEFS[id];setScreen(topbar('WHO FIGHTS '+esc(d.name.toUpperCase())+'?','boss')+`<div class="wrap"><div class="picks">`+PETS.map(p=>`<button class="pk" data-n="${esc(p.name)}" style="--pc:${p.color}">${photoTag(p)}<b>${esc(p.name)}</b><span>LV ${p.level} · ${esc(p.cls)}</span>${powBox(p,1)}</button>`).join('')+`</div></div>`,'storm');
  ui().querySelectorAll('.pk').forEach(b=>b.onclick=()=>{sfx('tap');ac();const tier=S.stat.bossW[id]||0;startBattle({mode:'boss',a:petByName(b.dataset.n),b:makeBoss(id,tier),arena:pick(['yard','sunset','pooldeck','storm']),human:[true,false],diff:1,bossId:id});});}
// ---------- tournament: 8-fighter bracket ----------
let TOUR=null;
function simulateFight(pa,pb){const A=mkFighter(pa.p,0,{shadow:pa.shadow}),Bq=mkFighter(pb.p,1,{shadow:pb.shadow}),f=[A,Bq];
  for(let r=0;r<30;r++){const picks=f.map((F,i)=>cpuPick(F,f[1-i],.5));const order=spdOf(A)+rnd(0,18)>=spdOf(Bq)+rnd(0,18)?[0,1]:[1,0];
    for(const i of order){const X=f[i],Y=f[1-i];if(X.hp<=0||Y.hp<=0)break;const mv=picks[i];
      if(mv===ULT){X.pw=0;Y.hp=Math.max(0,Y.hp-hitDamage(X,Y,55,'atk',{sure:true}).dmg);continue;}
      const res=resolve(X,Y,mv);if(mv.kind==='heal')X.hp=res.hpAfter;else if(mv.kind==='hit'&&!res.miss)Y.hp=res.hpAfter;}
    if(A.hp<=0)return 1;if(Bq.hp<=0)return 0;for(const F of f)charge(F,8);}
  return A.hp/A.max>=Bq.hp/Bq.max?0:1;}
function tourneyPick(){TITLEPETS=null;setScreen(topbar('TOURNAMENT')+`<div class="wrap"><p class="lead">Eight fighters, three rounds, one trophy. The other pets and the yard bosses are all in the bracket.</p><div class="picks">`+PETS.map(p=>`<button class="pk" data-n="${esc(p.name)}" style="--pc:${p.color}">${photoTag(p)}<b>${esc(p.name)}</b><span>LV ${p.level} · ${esc(p.cls)}</span></button>`).join('')+`</div></div>`,'pooldeck');
  ui().querySelectorAll('.pk').forEach(b=>b.onclick=()=>{sfx('tap');const me=petByName(b.dataset.n);const ent=[{p:me,me:1}].concat(PETS.filter(x=>x.name!==me.name).map(p=>({p})));
    let bi=0;while(ent.length<8){const id=BOSS_ORDER[bi%4];ent.push({p:makeBoss(id,Math.floor(bi/4))});bi++;}
    for(let i=ent.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ent[i],ent[j]]=[ent[j],ent[i]];}
    TOUR={me,rounds:[ent.slice(0,8),[],[],[]],r:0,out:false};tourneyScreen();});}
function tourMyIndex(){const R=TOUR.rounds[TOUR.r];return R.findIndex(e=>e&&e.me);}
function tourAdvance(myWon){const R=TOUR.rounds[TOUR.r],N=TOUR.rounds[TOUR.r+1],mi=tourMyIndex();
  for(let i=0;i<R.length;i+=2){if(N[i/2])continue;if(mi===i||mi===i+1){N[i/2]=myWon?R[mi]:R[mi===i?i+1:i];continue;}N[i/2]=R[i+simulateFight(R[i],R[i+1])];}
  if(!myWon)TOUR.out=true;TOUR.r++;
  while(TOUR.out&&TOUR.r<3){const R2=TOUR.rounds[TOUR.r],N2=TOUR.rounds[TOUR.r+1];for(let i=0;i<R2.length;i+=2)N2[i/2]=R2[i+simulateFight(R2[i],R2[i+1])];TOUR.r++;}}
function tourneyScreen(note){TITLEPETS=null;const T=TOUR,names=['QUARTER-FINALS','SEMI-FINALS','FINAL','CHAMPION'];
  const cell=e=>e?`<div class="tc${e.me?' me':''}">${e.p.boss?`<img src="${bossURL(e.p)}" alt="">`:photoTag(e.p)}<b>${esc(e.p.name)}</b></div>`:'<div class="tc tbd"><b>?</b></div>';
  const champ=T.rounds[3][0],done=T.r>=3,mi=done?-1:tourMyIndex(),opp=mi>=0?T.rounds[T.r][mi^1]:null;
  setScreen(topbar('TOURNAMENT','home')+`<div class="wrap">${note?`<div class="note">${note}</div>`:''}<div class="bracket">${T.rounds.map((R,ri)=>`<div class="col"><h5>${names[ri]}</h5>${ri<3?Array.from({length:[8,4,2][ri]/2},(_,m)=>`<div class="match${ri===T.r&&(mi>>1)===m&&!done?' now':''}">${cell(R[m*2])}${cell(R[m*2+1])}</div>`).join('')
     :`<div class="match champ">${cell(champ)}</div>`}</div>`).join('')}</div>
   ${done?`<div class="story"><h3>${champ&&champ.me?'YOU WON THE TOURNAMENT!':esc(champ.p.name)+' wins the tournament'}</h3></div><div class="dbtn"><button class="big gold" data-go="tourney"><b>New tournament</b></button></div>`
    :`<div class="dbtn"><button class="big red" id="tGo"><b>${names[T.r]}: ${esc(T.me.name)} vs ${esc(opp.p.name)}</b><span>Ring the bell</span></button></div>`}</div>`,'pooldeck');
  if(!done)$('tGo').onclick=()=>{ac();startBattle({mode:'tourney',a:T.me,b:opp.p,arena:['yard','sunset','pooldeck'][T.r],human:[true,false],diff:T.r});};}
// ---------- locker: buy and equip unlockables ----------
let LOCKER=null;
function locker(name){TITLEPETS=null;const p=name?petByName(name):(LOCKER&&LOCKER.F?LOCKER.F.p:PETS[0]);
  LOCKER={F:Object.assign(mkFighter(p,0,{}),{shownHp:0}),t0:NOW};const e=eqOf(p.name);
  const sec=(k,title)=>`<h4>${title}</h4><div class="items">${ITEMS.filter(i=>i.k===k).map(i=>{const own=owned(i.id),on=e[{frame:'frame',win:'win',entr:'entr'}[k]]===i.id;
    return`<button class="it${on?' on':''}${own?'':' lockd'}" data-i="${i.id}"><b>${esc(i.n)}</b><span>${esc(i.d)}</span><em>${on?'Equipped':own?'Tap to equip':i.p==null?icon('lock',12)+' Locked':icon('treat',13)+' '+i.p}</em></button>`;}).join('')}</div>`;
  setScreen(`<div class="lockerw"><div class="lockl"></div><div class="lockr">`+topbar('LOCKER')+`<div class="treats">${icon('treat',20)} <b>${S.treats}</b> treats</div>
    <div class="ptabs">${PETS.map(x=>`<button class="${x.name===p.name?'on':''}" data-p="${esc(x.name)}" style="--pc:${x.color}">${photoTag(x,'th')}${esc(x.name)}</button>`).join('')}</div>
    ${sec('frame','CARD FRAMES')}${sec('win','VICTORY EFFECTS')}${sec('entr','ENTRANCES')}<p class="sm">Earn treats by winning fights, daily challenges, the Career, Boss Fights and Tournaments.</p></div></div>`,'yard');
  ui().querySelectorAll('.ptabs button').forEach(b=>b.onclick=()=>{sfx('tap');locker(b.dataset.p);});
  ui().querySelectorAll('.it').forEach(b=>b.onclick=()=>{const i=ITEM[b.dataset.i],sc=ui().scrollTop;
    if(!owned(i.id)){if(i.p==null||S.treats<i.p){sfx('miss');toast(i.p==null?esc(i.d):`Need ${i.p-S.treats} more treats`,'#cfd8ff');return;}S.treats-=i.p;grant(i.id);play('coin',{vol:.8});toast(`Unlocked <b>${esc(i.n)}</b>!`,'#7dff9a');}
    const eq=S.eq[p.name]=S.eq[p.name]||{};eq[i.k]=i.id;save();sfx('tap');locker(p.name);ui().scrollTop=sc;
    if(i.k==='win')setTimeout(()=>winEffect(LOCKER.F),150);if(i.k==='entr'){LOCKER.F.alpha=0;setTimeout(()=>entrance(LOCKER.F),150);}checkTrophies();});}

// ---------- pause ----------
function openPause(inBattle){
  const m=$('pause');m.hidden=false;
  m.innerHTML=`<div class="pbox"><h3>PAUSED</h3><button class="big gold" id="pRes"><b>Resume</b></button>
   <button class="tg" id="pSnd">${icon('sound',16)} Sound: ${S.sound?'On':'Off'}</button><button class="tg" id="pVoc">Commentator voice: ${S.voice?'On':'Off'}</button><button class="tg" id="pTap">Timing taps: ${S.taps?'On':'Off'}</button>
   ${S.sound?`<div class="vols">${[['voice','Commentator (your voice)'],['pets','Pet voices'],['fx','Fight sounds']].map(([k,l])=>`<label><span>${l}</span><input type="range" min="0" max="100" value="${Math.round(S.vol[k]*100)}" data-v="${k}"></label>`).join('')}</div>`:''}
   <button class="tg" id="pRef">${icon('cam',16)} Get the newest pet data</button>
   ${inBattle?'<button class="tg" id="pQuit">Leave this fight</button>':''}
   <button class="big red" id="pExit"><b>Go back to games</b></button><button class="xb" id="pX" aria-label="Close">${icon('x',18)}</button></div>`;
  const close=()=>{m.hidden=true;m.innerHTML='';};
  $('pRes').onclick=close;$('pX').onclick=close;
  $('pSnd').onclick=()=>{S.sound=!S.sound;save();if(!S.sound)crowdOn(false);openPause(inBattle);};
  m.querySelectorAll('[data-v]').forEach(r=>{r.oninput=()=>{ac();setVol(r.dataset.v,r.value/100);};r.onchange=()=>{save();const k=r.dataset.v;if(k==='fx')play(take('punch'));else if(k==='pets'){const p=pick(PETS);petCry({p,name:p.name,side:0},'attack',{cd:0});}else vplay(pick([...VHAVE]),true);};});
  $('pTap').onclick=()=>{S.taps=!S.taps;save();openPause(inBattle);};
  $('pVoc').onclick=()=>{S.voice=!S.voice;save();if(!S.voice&&window.speechSynthesis)speechSynthesis.cancel();openPause(inBattle);};
  $('pRef').onclick=async()=>{$('pRef').textContent='Checking the camera...';await boot(true);close();};
  $('pExit').onclick=()=>{location.href='index.html';};
  if(inBattle)$('pQuit').onclick=()=>{close();crowdOn(false);TS=1;ZOOM.k=1;$('qte').hidden=true;if(window.speechSynthesis)speechSynthesis.cancel();ANIMS.length=0;FXDRAW.length=0;B=null;home();};
}
// ---------- boot ----------
async function boot(refresh){
  FEED=await loadFeed();PETS=FEED.pets;PETS.forEach(p=>petPhoto(p,'photo'));
  if(!refresh||!B)home();
}
resize();requestAnimationFrame(frame);
ui().innerHTML='<div class="loading"><h1>PET ARENA</h1><p>Asking the camera for the newest stats...</p></div>';
boot();
document.addEventListener('visibilitychange',()=>{if(document.hidden){crowdOn(false);if(window.speechSynthesis)speechSynthesis.cancel();}});
</script></body></html>
