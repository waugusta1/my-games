let song=null,want={song:null,amb:{}},seqTimer=null;
function seeded(n){let a=n>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  if(old){old.bus.gain.cancelScheduledValues(now());old.bus.gain.setValueAtTime(old.bus.gain.value,now());old.bus.gain.linearRampToValueAtTime(0,now()+2);setTimeout(()=>{try{old.bus.disconnect();}catch(_){}},2600);}
  song={name,st,bus,step:0,next:now()+.15,bar:0,g,motifs:[makeMotif(g,8),makeMotif(g,8),makeMotif(g,8)],prog:st.prog[0],section:0,intensity:1};
  if(!seqTimer)seqTimer=setInterval(schedule,40);}
function stopSong(){if(!song)return;const s=song;song=null;s.bus.gain.cancelScheduledValues(now());s.bus.gain.setValueAtTime(s.bus.gain.value,now());s.bus.gain.linearRampToValueAtTime(0,now()+1.5);setTimeout(()=>{try{s.bus.disconnect();}catch(_){}},1800);}

function schedule(){if(!song||!ac)return;const s=song,st=s.st,spb=60/st.bpm/4;
  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;
    if(step===0&&bar%4===0){s.prog=st.prog[Math.floor(s.g()*st.prog.length)];if(bar%16===0&&bar>0){s.motifs[Math.floor(s.g()*3)]=makeMotif(s.g,8);}}
    const deg=s.prog[bar%4],ch=chordNotes(st,deg),sw=(step%2)?st.swing*spb:0,T=t+sw;
    if(step===0)ch.slice(0,3).forEach(n=>INS[st.pad](n,T,spb*16,sec==='intro'?.5:.42,dest));

    if(sec!=='intro'&&sec!=='break'||sec==='break'&&step%4===0){const ap=st.arpPat;let idx=null;if(ap==='up'&&step%2===0)idx=(step/2)%4;else if(ap==='down'&&step%2===0)idx=3-(step/2)%4;else if(ap==='wide'&&step%4===0)idx=[0,2,1,3][step/4];else if(ap==='bounce'&&[0,3,6,8,11,14].includes(step))idx=[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(step)];
      if(idx!=null)INS[st.arp](ch[idx]+12,T,spb*2,.3*(sec==='b'?1:.8),dest);}
    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}

/* ---------- path helpers: one continuous silhouette ---------- */
function sym(g,sx,segs,sy){sy=sy||1;g.moveTo(sx,0);const ends=[[sx,0]];
  for(const s of segs){if(s[0]==='L')g.lineTo(s[1],s[2]*sy);else if(s[0]==='Q')g.quadraticCurveTo(s[1],s[2]*sy,s[3],s[4]*sy);else g.bezierCurveTo(s[1],s[2]*sy,s[3],s[4]*sy,s[5],s[6]*sy);ends.push([s[s.length-2],s[s.length-1]]);}
  const L=ends[ends.length-1];if(L[1]!==0)g.lineTo(L[0],-L[1]*sy);
  for(let i=segs.length-1;i>=0;i--){const s=segs[i],e=ends[i];if(s[0]==='L')g.lineTo(e[0],-e[1]*sy);else if(s[0]==='Q')g.quadraticCurveTo(s[1],-s[2]*sy,e[0],-e[1]*sy);else g.bezierCurveTo(s[3],-s[4]*sy,s[1],-s[2]*sy,e[0],-e[1]*sy);}
  g.closePath();}
function smoothThru(g,P){for(let i=1;i<P.length-1;i++){g.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2);}g.lineTo(P[P.length-1][0],P[P.length-1][1]);}
/* tapered limb along a spine; wf(t) gives width at t in [0,1] */
function tube(g,pts,wf){const n=pts.length,L=[],R=[];let dx0=0,dy0=0,dx1=0,dy1=0;
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;if(i===0){dx0=dx;dy0=dy;}if(i===n-1){dx1=dx;dy1=dy;}
    const w=(typeof wf==='function'?wf(i/(n-1)):wf)/2;L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);R.push([pts[i][0]+dy*w,pts[i][1]-dx*w]);}
  const we=(typeof wf==='function'?wf(1):wf)/2,ws=(typeof wf==='function'?wf(0):wf)/2;
  g.moveTo(L[0][0],L[0][1]);smoothThru(g,L);const e=pts[n-1];g.quadraticCurveTo(e[0]+dx1*we*1.6,e[1]+dy1*we*1.6,R[n-1][0],R[n-1][1]);
  const Rr=R.slice().reverse();smoothThru(g,Rr);const s=pts[0];g.quadraticCurveTo(s[0]-dx0*ws*1.6,s[1]-dy0*ws*1.6,L[0][0],L[0][1]);g.closePath();}
function limb(a,b,c,n){/* shoulder, knee, foot -> smooth spine with a real bend */const P=[];n=n||7;for(let i=0;i<=n;i++){const t=i/n,u=1-t;P.push([u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]]);}
  /* pull mid toward the knee so the joint reads */const m=n>>1;P[m]=[(P[m][0]+b[0])/2,(P[m][1]+b[1])/2];return P;}
/* fill + rim light + core shadow + outline on one path */
function paint(g,build,o){g.beginPath();build(g);g.fillStyle=o.fill;g.fill();
  g.save();g.beginPath();build(g);g.clip();if(o.detail)o.detail(g);const d=o.d||2.4;
  if(o.shade){for(const k of[1.2,2.6]){g.save();g.beginPath();g.rect(-2000,-2000,4000,4000);g.translate(-d*k,-d*k);build(g);g.fillStyle=o.shade;g.fill('evenodd');g.restore();}}
  if(o.rim){g.save();g.beginPath();g.rect(-2000,-2000,4000,4000);g.translate(d*.8,d*.8);build(g);g.fillStyle=o.rim;g.fill('evenodd');g.restore();}
  if(o.after)o.after(g);g.restore();
  if(o.line){g.beginPath();build(g);g.strokeStyle=o.line;g.lineWidth=o.lw||1;g.lineJoin='round';g.stroke();}}
function rg(g,x,y,r,stops,x2,y2){const gr=g.createRadialGradient(x2==null?x:x2,y2==null?y:y2,0,x,y,r);stops.forEach((s,i)=>gr.addColorStop(s[0],s[1]));return gr;}
function lg(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>gr.addColorStop(s[0],s[1]));return gr;}
function dot(g,x,y,r,c){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();}
function glowDot(g,x,y,r,c){g.fillStyle=rg(g,x,y,r,[[0,'rgba(255,255,255,.95)'],[.3,c],[1,'rgba(0,0,0,0)']]);g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}

function playerFire(dt){const p=P;const surge=p.surgeT>0;p.fireT-=dt;const pw=surge?5:p.power,dm=p.dmgM*(surge?1.5:1);const nx=p.x+p.S.nose-4,y=p.y;
  if(p.fireT<=0){const k=p.S.shot;
    if(k==='bolt'){p.fireT=.115/p.rateM*(surge?.65:1);const d=6.2*dm,sp=980,A=Math.PI/180;
      const L=[[[-5,0],[5,0]],[[-5,0],[5,0],[0,-5*A],[0,5*A]],[[-7,0],[0,0],[7,0],[-4,-8*A],[4,8*A]],[[-7,0],[0,0],[7,0],[-4,-6*A],[4,6*A],[-6,-14*A],[6,14*A]],[[-9,0],[-3,0],[3,0],[9,0],[-5,-7*A],[5,7*A],[-6,-15*A],[6,15*A],[-6,-22*A],[6,22*A]]][pw-1];
      for(const [oy,a] of L)pShot(nx,y+oy,a,sp,d,'bolt');}
    else if(k==='wave'){p.fireT=.2/p.rateM*(surge?.65:1);const d=13*dm,sp=640,A=Math.PI/180;
      const L=[[0],[-4,4],[-9,0,9],[-12,-4,4,12],[-18,-9,0,9,18]][pw-1];for(const a of L)pShot(nx,y+a*.6,a*A,sp,d,'wave',3,1+pw*.08);}
    else{p.fireT=.15/p.rateM*(surge?.65:1);const d=9*dm,sp=1500;const L=[[0],[-7,7],[-10,0,10],[-14,-5,5,14],[-18,-9,0,9,18]][pw-1];for(const o of L)pShot(nx,y+o,0,sp,d,'rail',99);}
    if((shotSndT-=1)<=0){shotSndT=1;SND.tone({type:p.S.shot==='wave'?'triangle':'square',f:p.S.shot==='rail'?1900:1250,f2:p.S.shot==='wave'?300:600,d:.05,v:.022,lp:3200});}
  }
  /* sub weapon */
  if(p.sub&&p.subLv){p.subT-=dt;const L=p.subLv;
    if(p.sub==='seek'&&p.subT<=0){p.subT=[1.25,.95,.7][L-1];for(const s of[-1,1])PB.push({x:p.x-6,y:p.y+s*12,vx:-60,vy:s*160,dmg:20*p.dmgM,k:'missile',home:1,t:0,a:0});SND.play('swish');}
    if(p.sub==='arc'&&p.subT<=0){const tg=nearestE(p.x,p.y,420);if(tg){p.subT=[1.05,.8,.6][L-1];let cur={x:p.x+10,y:p.y},hit=[],n=2+L;let e=tg;
        while(e&&n-->0){ZAP.push({x0:cur.x,y0:cur.y,x1:e.x+(e.T.hx||0),y1:e.y,t:.14});dmgE(e,17*p.dmgM,e.x,e.y);hit.push(e);cur={x:e.x,y:e.y};e=nearestE(cur.x,cur.y,190,hit);}
        SND.noise({d:.12,v:.08,hp:2500});}else p.subT=.2;}
    if(p.sub==='drone'){p.drA+=dt*2.4;p.droneT-=dt;if(p.droneT<=0){p.droneT=[.42,.32,.26][L-1];const n=L>=3?3:2;for(let i=0;i<n;i++){const a=p.drA+i/n*TAU;pShot(p.x+Math.cos(a)*40+8,p.y+Math.sin(a)*40,0,900,4.5*p.dmgM,'bolt',0,.6);}}}
  }}
function nearestE(x,y,maxd,ex){let b=null,bd=maxd*maxd;for(const e of EN){if(e.dead||e.x>W+10||e.x<-10||e.y<-10||e.y>H+10||(ex&&ex.includes(e)))continue;const ex2=e.x+(e.T.hx||0);const d=(ex2-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e;}}return b;}
function hurtPlayer(){const p=P;if(p.inv>0||p.dead||TEST&&G.god)return;G.hits++;
  if(p.sh>0){p.sh--;p.shT=0;p.inv=.9;SND.play('bumper');burst(p.x,p.y,12,'cy',200,.4);return;}

/* ================= damage, drops ================= */
function dmgE(e,d,x,y){if(e.dead)return;if(e.boss){e.boss.hit(e,d,x,y);return;}e.hp-=d;e.fl=.07;if(e.hp<=0)killE(e);}
function killE(e,silent){if(e.dead)return;e.dead=1;const T=e.T;if(!e.noCount)G.kills++;if(e.type!=='rock')SAVE.kills++;
  const sc=Math.round(T.score*(e.type==='rock'?e.sc:1)*(1+D()*.25));G.chain++;G.chainT=1.6;const m=comboM();G.score+=Math.round(sc*m);
  P.surge=Math.min(1,P.surge+sc/2600*P.surgeGain*(P.surgeT>0?0:1));
  const ex=e.x+(T.hx||0);let val=Math.round((e.type==='rock'?(e.big?5:2):T.scrap)*(1+G.s*.18));dropScrap(ex,e.y,val);
  if(e.g){e.g.k++;if(e.g.k>=e.g.n&&e.g.n>=3)dropPU(ex,e.y,P.power<5?'ion':(rnd()<.5?'repair':'ion'));}
  if(rnd()<.012)dropPU(ex,e.y,'repair');
  if(e.type==='pod'&&e.burst)ring(e.x,e.y,8,bspd()*.8,'mg',rnd());
  if(e.type==='rock'){explodeRock(e);if(e.big)for(let i=0;i<2;i++)spawnE('rock',e.x,e.y+(i?14:-14),{noCount:1,vx:e.vx*.8,vy:(i?1:-1)*rr(40,80),sc:.6,r:15,hp:28*(1+D()*.3),var:(e.var+1+i)%3,spin:rr(-2,2)});}
  else explode(ex,e.y,e.type==='eel'?1.5:(e.type==='beetle'||e.type==='maw')?1.15:.7,T.col);
  if(!silent)SND.play(e.type==='beetle'||e.type==='maw'||e.type==='eel'?'explosion':'pop',.5);}
function comboM(){return Math.min(5,1+Math.floor(G.chain/6)*.5);}
function dropScrap(x,y,v){const n=Math.min(6,v);for(let i=0;i<n;i++){const val=Math.floor(v/n)+(i<v%n?1:0);const a=rnd()*TAU,s=rr(60,180);PU.push({x,y,vx:Math.cos(a)*s-40,vy:Math.sin(a)*s,k:'scrap',v:val,t:0,rot:rnd()*TAU});}}
function dropPU(x,y,k){PU.push({x,y,vx:-50,vy:0,k,v:1,t:0,rot:0});}

function part(o){if(PT.length>420)PT.shift();PT.push(o);}
function burst(x,y,n,col,sp,life){for(let i=0;i<n;i++){const a=rnd()*TAU,s=rnd()*sp;part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*rr(.5,1),max:life,sz:rr(5,12),col,k:'g'});}}
function explode(x,y,sz,col){part({x,y,vx:0,vy:0,life:.35,max:.35,sz:60*sz,col:'wh',k:'g'});part({x,y,vx:0,vy:0,life:.45,max:.45,sz:30*sz,col,k:'r'});
  burst(x,y,Math.round(14*sz),col,320*sz,.7);burst(x,y,Math.round(6*sz),'or',160*sz,.5);for(let i=0;i<5*sz;i++){const a=rnd()*TAU,s=rnd()*70*sz;part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.2,max:1.2,sz:rr(18,34)*sz,k:'s'});}
  shake=Math.max(shake,4*sz);}
function explodeRock(e){burst(e.x,e.y,10,'am',180,.5);for(let i=0;i<7;i++){const a=rnd()*TAU,s=rr(60,200);part({x:e.x,y:e.y,vx:Math.cos(a)*s+e.vx,vy:Math.sin(a)*s,life:.9,max:.9,sz:rr(2,5)*e.sc,k:'c',rot:rnd()*TAU,vr:rr(-8,8),col:G?SECTORS[G.s].rock[1]:'#666'});}
  for(let i=0;i<4;i++)part({x:e.x,y:e.y,vx:rr(-40,40),vy:rr(-40,40),life:1,max:1,sz:rr(20,36)*e.sc,k:'s'});SND.noise({d:.25,v:.18,lp:900,pink:true});}

/* ================= enemy behaviour ================= */
const bez=(p,u)=>{const v=1-u;return[v*v*v*p[0][0]+3*v*v*u*p[1][0]+3*v*u*u*p[2][0]+u*u*u*p[3][0],v*v*v*p[0][1]+3*v*v*u*p[1][1]+3*v*u*u*p[2][1]+u*u*u*p[3][1]];};
const easeO=t=>1-Math.pow(1-clamp(t,0,1),3);
function updEnemy(e,dt){if(e.dly>0){e.dly-=dt;e.hidden=1;return;}e.hidden=0;e.t+=dt;if(e.fl>0)e.fl-=dt;
  if(e.boss){e.boss.upd(e,dt);return;}
  const ox=e.x,oy=e.y;
  switch(e.mv){
    case'lin':e.x+=e.vx*dt;e.y+=e.vy*dt;break;
    case'sine':e.x+=e.vx*dt;e.y=e.y0+Math.sin(e.t*e.fq+e.ph)*e.amp;break;
    case'path':{const u=Math.min(1,e.t/e.dur),p=bez(e.pp,u);e.x=p[0];e.y=p[1];if(u>=1)e.gone=1;break;}
    case'hover':{if(e.t<1.6){e.x=lerp(W+60,e.tx,easeO(e.t/1.6));}else if(e.t<1.6+e.stay){e.y+=Math.sin(e.t*1.1+e.ph)*26*dt;}else{e.x+=170*dt;}break;}
    case'dash':{if(e.t<1.1){const u=easeO(e.t/1.1);e.x=lerp(W+40,e.tx,u);e.y=lerp(e.y,e.ty,dt*3);e.ang=Math.PI;}
      else if(e.t<1.85){const a=aimAt(e.x,e.y);let d=a-e.ang;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;e.ang+=d*Math.min(1,dt*8);e.x+=Math.sin(e.t*40)*.6;}
      else{if(!e.dash){e.dash=1;const sp=520+D()*30;e.vx=Math.cos(e.ang)*sp;e.vy=Math.sin(e.ang)*sp;SND.noise({d:.25,v:.07,bp:900,f2:2400,q:2});}e.x+=e.vx*dt;e.y+=e.vy*dt;
        if(rnd()<.6)part({x:e.x-e.vx*.03,y:e.y-e.vy*.03,vx:0,vy:0,life:.25,max:.25,sz:9,col:'or',k:'g'});}break;}
    case'eel':{e.x+=e.vx*dt;e.y=e.y0+Math.sin(e.t*e.fq+e.ph)*e.amp;break;}
  }
  if(e.T.rot&&e.mv!=='dash'&&(e.x!==ox||e.y!==oy))e.ang=Math.atan2(e.y-oy,e.x-ox);
  if(e.mv==='path'||e.type==='skate')e.ang=Math.atan2(e.y-oy,e.x-ox);
  if(e.type==='eel')eelBody(e);
  /* firing */
  if(e.x<W-10&&e.x>40){e.fire-=dt;const d=D();
    if(e.type==='maw'){e.mouth=clamp(1-(e.fire/.6),0,1);if(e.fire<=0&&e.t>1.4){e.fire=Math.max(.9,1.9-d*.15);const a=aimAt(e.x-22,e.y),n=d>2?5:3;for(let i=0;i<n;i++)eShot(e.x-22,e.y,a+(i-(n-1)/2)*.17,bspd(),'or');SND.play('plop');}}
    else if(e.type==='beetle'&&e.fire<=0){e.fire=2.3-Math.min(.9,d*.15);e.burstN=3;e.burstT=0;}
    else if(e.type==='mote'&&d>1.2&&e.fire<=0){e.fire=rr(2.6,4.5)-d*.2;if(rnd()<.45)eShot(e.x-16,e.y,aimAt(e.x,e.y),bspd()*.8,'cy');}
    else if(e.type==='skate'&&e.shoot&&e.fire<=0){e.fire=rr(1.6,3);eShot(e.x,e.y,aimAt(e.x,e.y),bspd(),'vi');}
    else if(e.type==='eel'&&e.fire<=0){e.fire=rr(1.4,2.4);const a=aimAt(e.x,e.y);for(let i=-1;i<=1;i++)eShot(e.x,e.y,a+i*.22,bspd()*.9,'mg','n');}
    if(e.burstN>0){e.burstT-=dt;if(e.burstT<=0){e.burstN--;e.burstT=.14;eShot(e.x-24,e.y,aimAt(e.x,e.y),bspd()*1.2,'gr','n');}}}
  if(e.x<-160||e.x>W+700||e.y<-260||e.y>H+260)e.gone=1;}
function eelBody(e){const h=e.hist;h.unshift([e.x,e.y]);if(h.length>220)h.pop();const sp=10,pts=[[e.x,e.y]];let acc=0,need=sp;
  for(let i=1;i<h.length&&pts.length<e.segs;i++){const d=Math.hypot(h[i][0]-h[i-1][0],h[i][1]-h[i-1][1]);acc+=d;if(acc>=need){pts.push(h[i]);need+=sp;}}
  while(pts.length<e.segs){const l=pts[pts.length-1];pts.push([l[0]+sp,l[1]]);}e.pts=pts;e.parts=pts.filter((p,i)=>i%2===0).map((p,i)=>[p[0],p[1],i===0?14:Math.max(5,11-i*1.1),i===0?1:.6]);
  if(pts.length>1)e.ang=Math.atan2(pts[0][1]-pts[1][1],pts[0][0]-pts[1][0]);}

/* ================= story ================= */
const STORY=[
  ['Vey Station is the last lit window in the Halcyon system. Three weeks ago the Choir came out of the dark between stars: a living swarm that eats worlds and sings while it does it.','You fly the only Lance-class fighter we have left. Clear the Halcyon Belt and find the thing that is birthing them.'],
  ['The Matriarch is dead and the belt is quiet. But the song moved inward, to the Ember Drift, where the gas giant Coru is burning.','Something long is swimming in that fire. Keep your distance from the body. Go for the head.'],
  ['Coru has stopped burning. Beyond it, the Verdant Bloom: a nebula the Choir has turned into a garden. Spores, pods, things that grow on contact.','The Bloom Mother is anchored there. She only opens to feed. Hit her then.'],
  ['The Glass Reef used to be our shipyards. The Choir grew crystal over all of it. Our scopes see a shape inside the reef, with arms, and one eye.','When you see red lines, move. Those are not warnings for us. They are for you.'],
  ['This is it. The song comes from one place: the Choir Heart. Everything you have killed was part of it, and it has been watching you the whole way in.','Bring it down, pilot. Then come home.'],
];
const ENDING=['The Heart stops. For the first time in weeks the comms are quiet, no song under the static.','Vey Station turns its lights back on, one deck at a time. Somewhere out there the Rift is still open, and the Choir that is left is still coming through it.','But now we know they can die.'];

const scr=$('scr');let planetURL=[],shipURL={};
let menuView='title';function show(html){menuView='other';scr.innerHTML=html;scr.hidden=false;$('hud').hidden=true;mode=mode==='play'?'play':'menu';SND.music('menu');}
function on(id,fn){const el=$(id);if(el)el.addEventListener('click',e=>{SND.play('click');fn(e);});}
function scrapBar(){return `<div class="scrap">${IC.scrap} ${fmt(SAVE.scrap)}</div>`;}
function showTitle(){mode='menu';G=null;show(`<div class="col" style="gap:14px;margin-top:-140px"><div class="sub">The Choir is singing</div><div class="title">Voidwake</div>
  <div class="row" style="margin-top:14px"><button class="bt" id="tCamp">Campaign</button><button class="bt ${riftOpen()?'':'g'}" id="tRift" ${riftOpen()?'':'disabled'}>${riftOpen()?'The Rift':IC.lock+' The Rift'}</button></div>
  <div class="row"><button class="bt g" id="tHang">Hangar</button><button class="bt g" id="tMed">Commendations</button><button class="bt g sm" id="tSet">Settings</button></div>
  <div class="row k" style="gap:24px;margin-top:6px"><span>${scrapBar()}</span><span>${IC.star(1).replace('<svg','<svg class="ic"')} ${totalStars()} / 75</span>${SAVE.rift.best?`<span>Rift best: wave ${SAVE.rift.wave}</span>`:''}</div></div>`);
  menuView='title';on('tCamp',()=>{if(!SAVE.story[0]&&!TEST)showStory(0,()=>showMap(0));else showMap(lastSector());});on('tRift',()=>{if(riftOpen())startFlight(0,0,1);});on('tHang',showHangar);on('tMed',showMedals);on('tSet',showSettings);}
function lastSector(){let s=0;for(let i=0;i<5;i++)if(unlocked(i,0))s=i;return s;}
function showStory(s,then){SAVE.story[s]=1;save();const P=s==='end'?ENDING:STORY[s];
  show(`<div class="pn col" style="max-width:720px;gap:16px;padding:30px 36px"><div class="story"><div class="who">${s==='end'?'Vey Station · log':'Admiral Ines Vey · Sector '+(s+1)}</div>${P.map(p=>`<p>${p}</p>`).join('')}</div><button class="bt" id="sGo">${s==='end'?'Continue':'Launch'}</button></div>`);on('sGo',then);}
function showMap(sel){mode='menu';G=null;setBG(sel);const pos=[[10,58],[30,30],[50,62],[70,32],[90,56]];
  let h=`<div class="topbar"><button class="bt g sm" id="mBack">${IC.back} Back</button><h2 style="font-size:18px">Star chart</h2>${scrapBar()}</div><div class="map"><svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M${pos.map(p=>p.join(' ')).join(' L')}" fill="none" stroke="rgba(94,242,255,.6)" stroke-width="1.5" stroke-dasharray="1.2 1.2" vector-effect="non-scaling-stroke"/></svg>`;
  SECTORS.forEach((S,s)=>{const lk=!unlocked(s,0);let st=0;for(let i=0;i<5;i++)st+=stars(s,i);
    h+=`<button class="sect ${lk?'lk':''} ${s===sel?'sel':''}" id="sec${s}" style="left:${pos[s][0]}%;top:${pos[s][1]-14}%"><img src="${planetURL[s]}" alt=""><div class="nm">${lk?IC.lock+' ':''}${S.n}</div><div class="k">${st} / 15</div></button>`;});
  h+=`</div><div class="pn" style="margin-top:-30px;min-width:620px;text-align:center"><div class="k">Sector ${sel+1} · ${SECTORS[sel].n}</div><div class="nodes">`;
  for(let i=0;i<5;i++){const lk=!unlocked(sel,i),st=stars(sel,i),cur=!lk&&!st;h+=`<button class="node ${i===4?'boss':''} ${lk?'lk':''} ${cur?'cur':''}" id="nd${i}" ${lk?'disabled':''}><span class="k">${i===4?'Guardian':'Stage'}</span><b>${lk?IC.lock:(i===4?'':sel+1+'-')+(i===4?'<svg class="ic" viewBox="0 0 20 20" style="width:22px;height:22px"><path d="M10 2 18 7v6l-8 5-8-5V7Z" fill="#ff4fa3"/><circle cx="10" cy="10" r="3" fill="#fff"/></svg>':i+1)}</b><span class="stars">${[0,1,2].map(k=>IC.star(k<st)).join('')}</span></button>`;}
  h+=`</div></div>`;show(h);on('mBack',showTitle);
  SECTORS.forEach((S,s)=>on('sec'+s,()=>{if(unlocked(s,0))showMap(s);else toast('Defeat the previous guardian first');}));for(let i=0;i<5;i++)on('nd'+i,()=>showBrief(sel,i));}
function showBrief(s,i){const S=SECTORS[s],st=stars(s,i),boss=i===4;
  show(`<div class="pn col" style="min-width:540px;max-width:640px;gap:6px;padding:26px 32px"><div class="k">${S.n} · ${boss?'Guardian':'Stage '+(i+1)}</div><h2 style="font-size:30px">${boss?S.boss:['Outer drift','Shoal','Crossing','Deep run'][i]}</h2>
    <div style="color:var(--dim);font-size:14px;margin:6px 0 4px;text-align:center">${boss?S.bossD:'Clear every wave. Formations destroyed to the last drop an ion cell.'}</div>
    <div class="bigstars" style="margin:8px 0">${['Clear the stage','Take at most 1 hull hit','Destroy 80% of the Choir'].map((t,k)=>`<div class="col" style="gap:2px">${IC.star(k<st,1)}<div class="lbl">${t}</div></div>`).join('')}</div>
    <div class="brief"><span>Ship</span><b>${SHIPS[SAVE.ship].n}</b><span>Support</span><b>${SAVE.sub&&SAVE.subs[SAVE.sub]?SUBS.find(x=>x.id===SAVE.sub).n+' Mk '+['I','II','III'][SAVE.subs[SAVE.sub]-1]:'None'}</b></div>
    <div class="row"><button class="bt g" id="bBack">${IC.back} Chart</button><button class="bt g" id="bHang">Hangar</button><button class="bt" id="bGo">Launch</button></div></div>`);
  on('bBack',()=>showMap(s));on('bHang',()=>showHangar(()=>showBrief(s,i)));on('bGo',()=>{if(i===0&&!SAVE.story[s]&&!TEST)showStory(s,()=>startFlight(s,i));else startFlight(s,i);});}
function shipReq(id){if(id==='warden')return SAVE.boss[0]?null:'Defeat the Matriarch';if(id==='wraith')return SAVE.boss[2]?null:'Defeat the Bloom Mother';return null;}
function showHangar(ret){const back=typeof ret==='function'?ret:showTitle;let h=`<div class="topbar"><button class="bt g sm" id="hBack">${IC.back} Back</button><h2 style="font-size:18px">Hangar</h2>${scrapBar()}</div><div class="hg"><div class="ships">`;
  for(const id in SHIPS){const S=SHIPS[id],own=SAVE.ships[id],req=shipReq(id);h+=`<button class="shipc ${SAVE.ship===id?'on':''}" id="sh_${id}"><img src="${shipURL[id]}" alt=""><div><div class="n" style="font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:${S.acc}">${S.n}</div><div class="d">${S.d}</div>
    <div class="k" style="margin-top:6px">${own?(SAVE.ship===id?'Selected':'Tap to fly'):req?IC.lock+' '+req:`<span class="scrap">${IC.scrap} ${fmt(S.cost)}</span>`}</div></div></button>`;}
  h+=`</div><div class="ups">`;
  for(const u of UPS){const lv=upLv(u.id),mx=lv>=u.max,c=upCost(u);h+=`<div class="up">${uic(u.id)}<div><div class="n">${u.n}</div><div class="d">${u.d}</div><div class="pips">${Array.from({length:u.max},(_,k)=>`<i class="${k<lv?'f':''}"></i>`).join('')}</div></div>
    <button class="bt ${mx?'g':'a'}" id="up_${u.id}" ${mx||SAVE.scrap<c?'disabled':''}>${mx?'Max':IC.scrap+' '+fmt(c)}</button></div>`;}
  h+=`<div class="sect-h k">Support weapon · one equipped</div>`;
  for(const s of SUBS){const lv=SAVE.subs[s.id]|0,mx=lv>=3,c=s.cost[lv],eq=SAVE.sub===s.id&&lv;h+=`<div class="up ${eq?'subsel':''}">${uic(s.id)}<div><div class="n">${s.n} ${lv?'Mk '+['I','II','III'][lv-1]:''}</div><div class="d">${s.d}</div><div class="pips">${[0,1,2].map(k=>`<i class="${k<lv?'f':''}"></i>`).join('')}</div></div>
    <div class="col" style="gap:6px">${mx?'':`<button class="bt a" id="sb_${s.id}" ${SAVE.scrap<c?'disabled':''}>${IC.scrap} ${fmt(c)}</button>`}${lv?`<button class="bt g sm" id="se_${s.id}">${eq?'Unequip':'Equip'}</button>`:''}</div></div>`;}
  h+=`</div></div>`;show(h);on('hBack',back);
  for(const id in SHIPS)on('sh_'+id,()=>{const S=SHIPS[id];if(SAVE.ships[id]){SAVE.ship=id;}else if(shipReq(id)){toast(shipReq(id)+' to unlock');return;}else if(SAVE.scrap>=S.cost){SAVE.scrap-=S.cost;SAVE.ships[id]=1;SAVE.ship=id;SND.play('cash');}else{toast('Not enough scrap');SND.play('error');return;}save();checkMedals();showHangar(ret);});
  for(const u of UPS)on('up_'+u.id,()=>{const c=upCost(u);if(SAVE.scrap<c||upLv(u.id)>=u.max)return;SAVE.scrap-=c;SAVE.up[u.id]=upLv(u.id)+1;SND.play('buy');save();checkMedals();showHangar(ret);});
  for(const s of SUBS){on('sb_'+s.id,()=>{const lv=SAVE.subs[s.id]|0,c=s.cost[lv];if(SAVE.scrap<c)return;SAVE.scrap-=c;SAVE.subs[s.id]=lv+1;if(!SAVE.sub||!SAVE.subs[SAVE.sub])SAVE.sub=s.id;SND.play('buy');save();checkMedals();showHangar(ret);});
    on('se_'+s.id,()=>{SAVE.sub=SAVE.sub===s.id?'':s.id;save();showHangar(ret);});}}
function showMedals(){const got=MEDALS.filter(m=>SAVE.md[m.id]).length;let h=`<div class="topbar"><button class="bt g sm" id="mdBack">${IC.back} Back</button><h2 style="font-size:18px">Commendations ${got} / ${MEDALS.length}</h2>${scrapBar()}</div><div class="medals">`;
  for(const m of MEDALS){const g=SAVE.md[m.id];h+=`<div class="md ${g?'got':''}"><svg viewBox="0 0 40 40">${g?UIC.medal:UIC.medalOff}</svg><div><div class="n">${m.n}</div><div class="d">${m.d}</div><div class="d scrap" style="font-size:11px">${g?'Awarded':'+'+fmt(m.r)}</div></div></div>`;}
  show(h+'</div>');on('mdBack',showTitle);}
function showSettings(){let armed=0;const r=()=>show(`<div class="pn col" style="gap:16px;padding:28px 36px"><h2>Settings</h2>
  <div class="tog">Music<button class="sw ${SND.get('music')?'on':''}" id="stM"></button></div><div class="tog">Sound effects<button class="sw ${SND.get('sfx')?'on':''}" id="stS"></button></div>
  <div class="tog">Sharp graphics<button class="sw ${QUAL?'on':''}" id="stQ"></button></div>
  <div class="k" style="max-width:320px;text-align:center;line-height:1.5">Drag anywhere to fly. Your ship fires on its own. Nova clears the screen, Surge overcharges your guns.</div>
  <div class="row"><button class="bt g sm" id="stR">${armed?'Tap again to erase':'Reset progress'}</button><button class="bt" id="stB">Done</button></div></div>`);
  r();const bind=()=>{on('stM',()=>{SND.set('music',!SND.get('music'));r();bind();});on('stS',()=>{SND.set('sfx',!SND.get('sfx'));r();bind();});on('stQ',()=>{QUAL=!QUAL;try{localStorage.setItem('voidwake-q',QUAL?'1':'0');}catch(e){}DPR=QUAL?Math.min(devicePixelRatio||1,1.5):1;resize();r();bind();});
    on('stR',()=>{if(!armed){armed=1;r();bind();return;}SAVE=defSave();save();showTitle();});on('stB',showTitle);};bind();}
function finish(win,quit){if(mode!=='play')return;if(!quit){if(G.rift)__mgt('e','The Rift',()=>G.wave);else __mgt(win?'w':'l',()=>'Sector '+(G.s+1)+'-'+(G.i+1));}mode='over';const g=G;const rate=g.spawned?g.kills/g.spawned:1;let earned=g.scrap,bonus=0,st=0,prev=0,newBest=false;
  if(g.rift){prev=SAVE.rift.wave;if(g.wave>SAVE.rift.wave){SAVE.rift.wave=g.wave;newBest=true;}SAVE.rift.best=Math.max(SAVE.rift.best,g.score);bonus=g.wave*25;}
  else if(win){st=1+(g.hullHits<=1?1:0)+(rate>=.8?1:0);prev=stars(g.s,g.i);SAVE.st[sKey(g.s,g.i)]=Math.max(prev,st);bonus=Math.round((70+45*g.i)*(1+g.s*.6))+Math.max(0,st-prev)*Math.round(60*(1+g.s*.5));if(g.hits===0)SAVE.flawless++;}
  else earned=Math.round(g.scrap*(quit?.4:.6));
  if(!win&&!g.rift)SAVE.deaths++;SAVE.scrap+=earned+bonus;SAVE.earned+=earned+bonus;save();checkMedals();$('hud').hidden=true;
  const final=win&&!g.rift&&g.s===4&&g.i===4;
  const done=()=>showResults({win,quit,g,rate,earned,bonus,st,prev,newBest});
  if(final&&!SAVE.story.end)setTimeout(()=>showStory('end',done),500);else setTimeout(done,350);}
function showResults(r){const g=r.g;const nextOk=r.win&&!g.rift&&(g.i<4||g.s<4);
  const title=g.rift?'Rift run over':r.win?(g.i===4?'Guardian down':'Stage clear'):r.quit?'Flight abandoned':'Ship lost';
  show(`<div class="pn res col" style="gap:4px;padding:26px 34px"><div class="k">${g.rift?'The Rift':SECTORS[g.s].n+' · '+(g.i===4?'Guardian':'Stage '+(g.i+1))}</div><h2 style="font-size:34px;color:${r.win||g.rift?'#e8fbff':'#ff8fb0'}">${title}</h2>
    ${g.rift?`<div class="k" style="margin-top:8px">Reached wave</div><div style="font-size:54px;font-weight:900">${g.wave}</div>${r.newBest?'<div class="scrap">New record</div>':''}`:
      `<div class="bigstars">${[0,1,2].map(k=>`<div class="col" style="gap:2px">${IC.star(r.win&&(k===0||(k===1&&g.hullHits<=1)||(k===2&&r.rate>=.8)),1)}<div class="lbl">${['Cleared','≤1 hull hit','80% destroyed'][k]}</div></div>`).join('')}</div>`}
    <div class="stat"><span>Score</span><b>${fmt(g.score)}</b><span>Choir destroyed</span><b>${g.rift?g.kills:Math.round(r.rate*100)+'%'}</b><span>Hull hits</span><b>${g.hullHits}</b><span>Scrap salvaged${!r.win&&!g.rift?' (partial)':''}</span><b class="scrap">${fmt(r.earned)}</b>${r.bonus?`<span>Mission bonus</span><b class="scrap">${fmt(r.bonus)}</b>`:''}</div>
    <div class="row" style="margin-top:10px"><button class="bt g" id="rMap">${g.rift?'Title':'Star chart'}</button><button class="bt g" id="rHang">Hangar</button><button class="bt ${nextOk?'g':''}" id="rRetry">${g.rift?'Again':'Retry'}</button>${nextOk?'<button class="bt" id="rNext">Next</button>':''}</div></div>`);
  on('rMap',()=>g.rift?showTitle():showMap(g.s));on('rHang',()=>showHangar(()=>g.rift?showTitle():showMap(g.s)));on('rRetry',()=>startFlight(g.s,g.i,g.rift));
  on('rNext',()=>{const s=g.i<4?g.s:g.s+1,i=g.i<4?g.i+1:0;if(i===0&&!SAVE.story[s])showStory(s,()=>startFlight(s,i));else startFlight(s,i);});}

/* ================= input ================= */
const KEY={};addEventListener('keydown',e=>{KEY[e.key]=1;if(e.key===' ')useNova();if(e.key==='Shift'||e.key==='e')useSurge();if(e.key==='Escape'&&mode==='play')pauseGame();});addEventListener('keyup',e=>{KEY[e.key]=0;});
let steer=null;
cv.addEventListener('pointerdown',e=>{if(mode!=='play'||!P||paused)return;e.preventDefault();steer={id:e.pointerId,fx:e.clientX/K,fy:e.clientY/K,sx:P.tx,sy:P.ty};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!steer||e.pointerId!==steer.id||!P)return;e.preventDefault();P.tx=steer.sx+(e.clientX/K-steer.fx)*1.35;P.ty=steer.sy+(e.clientY/K-steer.fy)*1.35;
  if(P.tx<30||P.tx>W-40||P.ty<28||P.ty>H-28){P.tx=clamp(P.tx,30,W-40);P.ty=clamp(P.ty,28,H-28);steer.sx=P.tx;steer.sy=P.ty;steer.fx=e.clientX/K;steer.fy=e.clientY/K;}});
const endSteer=e=>{if(steer&&e.pointerId===steer.id)steer=null;};cv.addEventListener('pointerup',endSteer);cv.addEventListener('pointercancel',endSteer);
for(const [id,fn] of[['bNova',useNova],['bSurge',useSurge]]){$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});}
let paused=false;
function pauseGame(){if(mode!=='play'||paused)return;paused=true;steer=null;$('pause').hidden=false;$('hud').hidden=true;syncPause();}
function syncPause(){$('pMus').textContent='Music: '+(SND.get('music')?'On':'Off');$('pSfx').textContent='Sound: '+(SND.get('sfx')?'On':'Off');}
$('bPause').addEventListener('click',e=>{e.stopPropagation();pauseGame();});
$('pResume').addEventListener('click',()=>{paused=false;$('pause').hidden=true;$('hud').hidden=false;last=performance.now();});
$('pMus').addEventListener('click',()=>{SND.set('music',!SND.get('music'));syncPause();});$('pSfx').addEventListener('click',()=>{SND.set('sfx',!SND.get('sfx'));syncPause();});
$('pQuit').addEventListener('click',()=>{paused=false;$('pause').hidden=true;finish(false,true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();try{__store.flush();}catch(e){}}});

/* ================= main loop ================= */
let QUAL=true;try{QUAL=localStorage.getItem('voidwake-q')!=='0';}catch(e){}if(!QUAL){DPR=1;resize();}
let last=performance.now(),slowT=0;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(dt<=0)return;
  if(mode==='play'&&!paused){update(dt);if(dt>.026)slowT+=dt;else slowT=Math.max(0,slowT-dt*.5);if(slowT>3&&DPR>1){DPR=1;resize();slowT=0;}}
  if(!paused||mode!=='play')render(dt);}
