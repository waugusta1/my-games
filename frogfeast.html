    ctx.font='700 '+Math.round(20*S)+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=4;for(let i=0;i<N;i++){const x=(i+.5)/N*W;ctx.strokeText('tap here',x,H*.62);ctx.fillStyle=FROGS[i].c;ctx.fillText('tap here',x,H*.62);}}}
