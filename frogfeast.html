<style>
/* Lily pond at golden hour: teal water, lily greens, warm sun accents */
:root{--bg:#0f4a50;--ink:#fffaf0;--muted:#cfeee6;--accent:#ffd34a;--card:rgba(8,50,56,.9);--line:rgba(200,255,240,.3);color-scheme:dark;--f:Fredoka,"Trebuchet MS",system-ui,sans-serif}

h1{font-size:clamp(54px,13vw,96px);margin:0;line-height:.9;font-weight:700;color:#8ef07a;text-shadow:0 6px 0 #2f8a3a,0 12px 30px rgba(0,0,0,.3)}

.sub{color:var(--muted);font-weight:600;font-size:16px;max-width:420px;margin:0;line-height:1.4}

</div>

let countT=0;
$('go').onclick=start;$('again').onclick=start;$('home').onclick=()=>{$('over').hidden=true;$('title').hidden=false;state='title';updTitle();};
function updTitle(){const tot=save.w.reduce((a,b)=>a+b,0);$('wins').textContent=tot?'All-time wins · '+FROGS.map((f,i)=>f.name+' '+save.w[i]).join(' · '):'';}
function pickBug(){const frenzy=time<=10;const ks=Object.keys(BUGS);let tot=0;const w=ks.map(k=>{let x=BUGS[k].w;if(frenzy&&k==='firefly')x*=3;tot+=x;return x;});let r=R()*tot;for(let i=0;i<ks.length;i++){r-=w[i];if(r<=0)return ks[i];}return'fly';}
function spawnBug(anywhere){const k=pickBug(),B=BUGS[k],dir=R()<.5?1:-1,top=60*S,bot=H-200*S;const y=rnd(top,Math.max(top+40,bot));
  bugs.push({k,x:anywhere?rnd(40,W-40):(dir>0?-30:W+30),y,by:y,vx:dir*rnd(B.sp[0],B.sp[1])*S,ph:R()*TAU,amp:rnd(14,40)*S,r:B.r*S*1.45,t:0,wob:k==='butterfly'?1:0});}
function update(dt){t+=dt;
  for(const r of ripples){r.r+=40*dt*S;r.a-=dt*.6;}ripples=ripples.filter(r=>r.a>0);if(R()<dt*1.5)ripples.push({x:R()*W,y:rnd(H*.2,H*.8),r:2,a:.5});
  if(state==='count'){countT-=dt;if(Math.ceil(countT)!==Math.ceil(countT+dt)&&countT>0)tone(440,.15,'triangle',.06);if(countT<=0){state='play';tone(880,.3,'triangle',.07);}}
  const playing=state==='play';
  if(playing){time-=dt;if(time<=10&&time+dt>10){texts.push({x:W/2,y:H*.35,s:'FRENZY! Double points!',c:'#ffe066',life:2,big:1});tone(660,.4,'square',.04,1320);}
    if(time<=0){time=0;endGame();}}
  // bugs
  spawnT-=dt;const want=N+3+(time<=10?4:0);if((state==='play'||state==='count')&&spawnT<=0&&bugs.length<want){spawnBug(false);spawnT=rnd(.3,.9);}
  for(const b of bugs){if(b.held)continue;b.t+=dt;b.ph+=dt*(b.k==='dragon'?6:3);b.x+=b.vx*dt*(b.wob?1+Math.sin(b.ph*2)*.6:1);b.y=b.by+Math.sin(b.ph)*b.amp+(b.wob?Math.sin(b.ph*3.3)*b.amp*.4:0);
    if(b.k==='dragon'&&R()<dt*.6){b.vx*=-1;}if((b.x<-60&&b.vx<0)||(b.x>W+60&&b.vx>0))b.gone=true;}
  bugs=bugs.filter(b=>!b.gone);
  // frogs
  for(const f of frogs){f.dizzy=Math.max(0,f.dizzy-dt);f.gulp=Math.max(0,f.gulp-dt*3);f.blink-=dt;if(f.blink<-3)f.blink=.15;
    const spd=1.5+Math.min(1,(LEN-time)/LEN)*.8;f.ph+=dt*spd*(f.dizzy>0?3:1);f.ang=-Math.PI/2+Math.sin(f.ph)*1.15;
    if(f.state==='out'){f.len+=1500*S*dt;const tx=f.x+Math.cos(f.shotAng)*f.len,ty=f.y-26*S+Math.sin(f.shotAng)*f.len;
      for(const b of bugs){if(b.held)continue;if(hyp(b.x-tx,b.y-ty)<b.r+14*S){b.held=f.i;f.caught=b;f.state='in';tone(b.k==='bee'?180:900,.08,'square',.05);break;}}
      if(f.len>=f.max||tx<-20||tx>W+20||ty<-20)f.state='in';}
    else if(f.state==='in'){f.len-=1900*S*dt;if(f.caught){const b=f.caught;b.x=f.x+Math.cos(f.shotAng)*f.len;b.y=f.y-26*S+Math.sin(f.shotAng)*f.len;}
      if(f.len<=0){f.len=0;f.state='idle';if(f.caught){eat(f,f.caught);f.caught=null;}else f.streak=0;}}}}
function eat(f,b){b.gone=true;let pts=BUGS[b.k].pts;if(time<=10&&pts>0)pts*=2;
  if(b.k==='bee'){f.dizzy=1.6;f.streak=0;tone(150,.4,'sawtooth',.06,90);buzz([30,30,30]);burst(f.x,f.y-30*S,'#ffd84a',16);}
  else{f.streak++;if(f.streak>=3&&pts>0){pts+=1;}f.gulp=1;[660,880].forEach((q,k)=>tone(q*(1+f.i*.1),.12,'triangle',.06,0,k*.06));buzz(10);burst(f.x,f.y-30*S,b.k==='firefly'?'#ffe066':'#ffffff',b.k==='firefly'?24:10);}
  f.score=Math.max(0,f.score+pts);texts.push({x:f.x,y:f.y-90*S,s:(pts>0?'+':'')+pts+(f.streak>=3&&pts>0?' streak!':''),c:pts>0?FROGS[f.i].c:'#ff8a8a',life:1.1});}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=R()*TAU,v=rnd(60,220)*S;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.7),max:.7,c,s:rnd(2,4)*S});}}
function endGame(){state='over';const best=Math.max(...frogs.map(f=>f.score)),ws=frogs.filter(f=>f.score===best);ws.forEach(f=>save.w[f.i]++);persist();
  [523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.07,0,i*.1));buzz([30,40,60]);
  setTimeout(()=>{$('wTitle').textContent=ws.length>1?"It's a tie!":'🏆 '+FROGS[ws[0].i].name+' frog wins!';$('wTitle').style.color=ws.length>1?'#fff':FROGS[ws[0].i].c;
    const sorted=frogs.slice().sort((a,b)=>b.score-a.score);$('rank').innerHTML=sorted.map((f,k)=>'<div class="rk"><span>'+(f.score===best?'👑':(k+1)+'.')+'</span><span class="dot" style="background:'+FROGS[f.i].c+'"></span>'+FROGS[f.i].name+'<span class="sc">'+f.score+'</span></div>').join('');$('over').hidden=false;},900);}

/* ---------- render ---------- */
function drawBug(b){ctx.save();ctx.translate(b.x,b.y);const s=S*1.45,dir=b.vx<0?-1:1;ctx.scale(dir,1);const fl=Math.sin(t*40+b.ph)*.6;
  if(b.k==='fly'){ctx.fillStyle='rgba(220,240,255,.7)';ctx.beginPath();ctx.ellipse(-2*s,-6*s,6*s,3*s*(1+fl*.5),-.5,0,TAU);ctx.ellipse(3*s,-6*s,6*s,3*s*(1-fl*.5),.5,0,TAU);ctx.fill();ctx.fillStyle='#2a2a3a';ctx.beginPath();ctx.ellipse(0,0,8*s,5.5*s,0,0,TAU);ctx.fill();ctx.fillStyle='#c83a3a';ctx.beginPath();ctx.arc(6*s,-1*s,2.5*s,0,TAU);ctx.fill();}
  else if(b.k==='bee'){ctx.fillStyle='rgba(230,245,255,.75)';ctx.beginPath();ctx.ellipse(-2*s,-8*s,7*s,3.5*s*(1+fl*.5),-.5,0,TAU);ctx.ellipse(3*s,-8*s,7*s,3.5*s*(1-fl*.5),.5,0,TAU);ctx.fill();ctx.fillStyle='#ffcc2a';ctx.beginPath();ctx.ellipse(0,0,10*s,7*s,0,0,TAU);ctx.fill();ctx.fillStyle='#2a1a0a';for(const x of[-4,1])ctx.fillRect(x*s,-7*s,2.6*s,14*s);ctx.beginPath();ctx.moveTo(-10*s,0);ctx.lineTo(-14*s,-2*s);ctx.lineTo(-10*s,3*s);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7*s,-2*s,2*s,0,TAU);ctx.fill();}
  else if(b.k==='butterfly'){const w=.4+Math.abs(Math.sin(t*10+b.ph))*.6;const cols=['#ff7ad8','#7ac8ff','#ffb03a'];const c=cols[Math.floor(b.by)%3];ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(-5*s,-5*s,9*s*w,8*s,-.4,0,TAU);ctx.ellipse(5*s,-5*s,9*s*w,8*s,.4,0,TAU);ctx.ellipse(-4*s,5*s,6*s*w,5*s,.4,0,TAU);ctx.ellipse(4*s,5*s,6*s*w,5*s,-.4,0,TAU);ctx.fill();ctx.fillStyle='#2a1a2a';ctx.fillRect(-1.2*s,-9*s,2.4*s,18*s);}
  else if(b.k==='dragon'){ctx.fillStyle='rgba(200,240,255,.6)';ctx.beginPath();ctx.ellipse(2*s,-6*s,10*s,2.5*s,-.3+fl*.3,0,TAU);ctx.ellipse(2*s,6*s,10*s,2.5*s,.3-fl*.3,0,TAU);ctx.fill();ctx.strokeStyle='#2ad8c8';ctx.lineWidth=3.5*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-16*s,0);ctx.lineTo(8*s,0);ctx.stroke();ctx.fillStyle='#1a8a8a';ctx.beginPath();ctx.arc(10*s,0,4*s,0,TAU);ctx.fill();}
  else if(b.k==='firefly'){ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(-4*s,2*s,0,-4*s,2*s,24*s);g.addColorStop(0,`rgba(255,240,120,${.7+.3*Math.sin(t*8+b.ph)})`);g.addColorStop(1,'rgba(255,200,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(-4*s,2*s,24*s,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(230,245,255,.7)';ctx.beginPath();ctx.ellipse(1*s,-6*s,6*s,3*s*(1+fl*.5),-.4,0,TAU);ctx.fill();ctx.fillStyle='#4a3a2a';ctx.beginPath();ctx.ellipse(2*s,0,6*s,4*s,0,0,TAU);ctx.fill();ctx.fillStyle='#fff6a0';ctx.beginPath();ctx.ellipse(-5*s,1*s,5*s,4*s,0,0,TAU);ctx.fill();}
  ctx.restore();}
function drawFrog(f){const F=FROGS[f.i],s=S*1.15,x=f.x,y=f.y;
  // lily pad
  ctx.fillStyle='#2f8a4a';ctx.beginPath();ctx.ellipse(x,y+26*s,62*s,22*s,0,.25,TAU-.25);ctx.lineTo(x,y+26*s);ctx.fill();ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.ellipse(x-10*s,y+20*s,40*s,10*s,0,0,TAU);ctx.fill();
  // aim guide
  if(state==='play'&&f.state==='idle'){ctx.strokeStyle=F.c;ctx.globalAlpha=f.dizzy>0?.25:.55;ctx.setLineDash([4*s,8*s]);ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(x,y-26*s);ctx.lineTo(x+Math.cos(f.ang)*120*s,y-26*s+Math.sin(f.ang)*120*s);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.fillStyle=F.c;ctx.save();ctx.translate(x+Math.cos(f.ang)*128*s,y-26*s+Math.sin(f.ang)*128*s);ctx.rotate(f.ang);ctx.beginPath();ctx.moveTo(10*s,0);ctx.lineTo(-6*s,-7*s);ctx.lineTo(-6*s,7*s);ctx.fill();ctx.restore();}
  // tongue
  if(f.len>0){const a=f.shotAng,tx=x+Math.cos(a)*f.len,ty=y-26*s+Math.sin(a)*f.len;ctx.strokeStyle='#ff5a7a';ctx.lineWidth=7*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y-22*s);ctx.lineTo(tx,ty);ctx.stroke();ctx.fillStyle='#ff3a62';ctx.beginPath();ctx.arc(tx,ty,9*s,0,TAU);ctx.fill();}
  // body
  const sq=1+f.gulp*.12;ctx.save();ctx.translate(x,y);ctx.scale(sq,2-sq);
  ctx.fillStyle=F.d;ctx.beginPath();ctx.ellipse(-26*s,16*s,14*s,8*s,-.3,0,TAU);ctx.ellipse(26*s,16*s,14*s,8*s,.3,0,TAU);ctx.fill();
  const bg=ctx.createRadialGradient(-10*s,-14*s,4*s,0,0,40*s);bg.addColorStop(0,F.c);bg.addColorStop(1,F.d);ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,36*s,28*s,0,0,TAU);ctx.fill();
  ctx.fillStyle=F.belly;ctx.beginPath();ctx.ellipse(0,10*s,22*s,14*s,0,0,TAU);ctx.fill();
  for(const ex of[-16,16]){ctx.fillStyle=F.c;ctx.beginPath();ctx.arc(ex*s,-24*s,12*s,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex*s,-25*s,9*s,0,TAU);ctx.fill();
    if(f.blink>0){ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo((ex-6)*s,-25*s);ctx.lineTo((ex+6)*s,-25*s);ctx.stroke();}
    else if(f.dizzy>0){ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.8*s;ctx.beginPath();for(let k=0;k<12;k++){const a=k*.9+t*8,rr=k*.5*s;ctx.lineTo(ex*s+Math.cos(a)*rr,-25*s+Math.sin(a)*rr);}ctx.stroke();}
    else{const lx=Math.cos(f.ang)*3*s,ly=Math.sin(f.ang)*3*s;ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(ex*s+lx,-25*s+ly,4.5*s,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex*s+lx-1.5*s,-26.5*s+ly,1.5*s,0,TAU);ctx.fill();}}
  ctx.strokeStyle='#1a3a1a';ctx.lineWidth=2.5*s;ctx.lineCap='round';ctx.beginPath();if(f.len>0){ctx.ellipse(0,-6*s,9*s,5*s,0,0,TAU);ctx.fillStyle='#7a1a2a';ctx.fill();}else ctx.arc(0,-10*s,12*s,.15*Math.PI,.85*Math.PI);ctx.stroke();
  ctx.fillStyle='rgba(255,120,140,.4)';ctx.beginPath();ctx.arc(-22*s,-6*s,5*s,0,TAU);ctx.arc(22*s,-6*s,5*s,0,TAU);ctx.fill();
  ctx.restore();
  if(f.dizzy>0){ctx.font=Math.round(18*s)+'px system-ui';ctx.textAlign='center';for(let k=0;k<3;k++){const a=t*4+k*2.1;ctx.fillText('⭐',x+Math.cos(a)*30*s,y-58*s+Math.sin(a)*8*s);}}
  // score
  ctx.textAlign='center';ctx.font='700 '+Math.round(30*S)+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,30,30,.6)';ctx.strokeText(f.score,x,y+70*S);ctx.fillStyle=F.c;ctx.fillText(f.score,x,y+70*S);}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a6a6a');g.addColorStop(.6,'#145a60');g.addColorStop(1,'#0e4048');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun glints & ripples
  for(let i=0;i<14;i++){const x=(i*137.5+t*10)%W,y=(i*71.3)%H;ctx.fillStyle=`rgba(255,240,180,${.06+.05*Math.sin(t*2+i)})`;ctx.fillRect(x,y,30*S,2*S);}
  for(const r of ripples){ctx.strokeStyle=`rgba(220,255,250,${r.a*.5})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.4,0,0,TAU);ctx.stroke();}
  // reeds
  for(const sx of[0,W]){for(let k=0;k<6;k++){const x=sx+(sx?-1:1)*(10+k*12)*S;ctx.strokeStyle=k%2?'#3a8a4a':'#4aa85a';ctx.lineWidth=5*S;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,H);ctx.quadraticCurveTo(x+Math.sin(t+k)*10,H*.6,x+Math.sin(t*.8+k)*16*S,H*.35+k*12);ctx.stroke();}}
  if(state==='title')return;
  // player zones
  for(let i=0;i<N;i++){ctx.fillStyle=FROGS[i].c;ctx.globalAlpha=.06;ctx.fillRect(i/N*W,H*.55,W/N,H*.45);ctx.globalAlpha=1;if(i>0){ctx.strokeStyle='rgba(255,255,255,.1)';ctx.setLineDash([6,10]);ctx.beginPath();ctx.moveTo(i/N*W,H*.55);ctx.lineTo(i/N*W,H);ctx.stroke();ctx.setLineDash([]);}}
  for(const b of bugs)drawBug(b);
  for(const f of frogs)drawFrog(f);
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life/p.max*1.4);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();}ctx.globalAlpha=1;
  ctx.textAlign='center';for(const q of texts){ctx.globalAlpha=Math.min(1,q.life*2);ctx.font='700 '+Math.round((q.big?40:22)*S)+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,30,30,.6)';ctx.strokeText(q.s,q.x,q.y);ctx.fillStyle=q.c;ctx.fillText(q.s,q.x,q.y);}ctx.globalAlpha=1;
  // timer
  const tt=Math.ceil(time);ctx.font='700 '+Math.round(40*S)+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,30,30,.6)';const ts=state==='count'?'Get ready…':tt+'s';ctx.strokeText(ts,W/2,52*S);ctx.fillStyle=time<=10&&state==='play'?'#ffe066':'#fff';ctx.fillText(ts,W/2,52*S);
  if(state==='count'){ctx.font='700 '+Math.round(110*S)+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=8;const c=String(Math.max(1,Math.ceil(countT)));ctx.strokeText(c,W/2,H*.42);ctx.fillStyle='#ffe066';ctx.fillText(c,W/2,H*.42);
    ctx.font='700 '+Math.round(20*S)+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=4;for(let i=0;i<N;i++){const x=(i+.5)/N*W;ctx.strokeText('tap here',x,H*.62);ctx.fillStyle=FROGS[i].c;ctx.fillText('tap here',x,H*.62);}}}
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;}
  for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.life-=dt;q.y-=26*dt;if(q.life<=0)texts.splice(i,1);}
  render();requestAnimationFrame(frame);}
resize();updTitle();requestAnimationFrame(frame);
window.__ff2={get s(){return{state,time,scores:frogs.map(f=>f.score),bugs:bugs.length}},shoot:i=>shoot(frogs[i]),fast(){time=12;}};
})();

});</script>
