function hitPlan(p){const r=R_;const c=Math.floor((p.x-BX)/CS),row=Math.floor((p.y-BY)/CS);if(c>=0&&c<4&&row>=0&&row<ROWS){const b=unitAt(r,c,row);return{z:'b',c,r:row,u:b&&b.u,ref:b};}

cv.addEventListener('pointermove',e=>{if(!dragging)return;const p=toV(e);dragging.x=p.x;dragging.y=p.y;if(Math.hypot(p.x-dragging.sx,p.y-dragging.sy)>10)dragging.moved=1;});
cv.addEventListener('pointerup',e=>{if(!dragging)return;const d=dragging;dragging=null;const r=R_;if(!d.moved){unitInfo(d.u);return;}const to=hitPlan({x:d.x,y:d.y});if(!to){return;}
 if(to.z==='s'){sell(d.u);return;}
 const takeFrom=()=>{if(d.from.z==='b')r.board.splice(r.board.indexOf(d.from.ref),1);else r.bench[d.from.i]=null;};
 if(to.z==='b'){if(to.ref===d.from.ref&&d.from.z==='b')return;if(to.u){// swap
   if(d.from.z==='b'){const a=d.from.ref,b=to.ref;[a.c,b.c]=[b.c,a.c];[a.r,b.r]=[b.r,a.r];}else{r.bench[d.from.i]=to.u;to.ref.u=d.u;}}
  else{if(d.from.z==='n'&&r.board.length>=boardCap(r)){flash(`Only ${boardCap(r)} units can fight at level ${r.lvl}. Train to raise it.`);return;}takeFrom();r.board.push({u:d.u,c:to.c,r:to.r});}}
 else if(to.z==='n'){if(to.u){if(d.from.z==='n'){r.bench[d.from.i]=to.u;r.bench[to.i]=d.u;}else{d.from.ref.u=to.u;r.bench[to.i]=d.u;}}else{takeFrom();r.bench[to.i]=d.u;}}
 AU.tone(330,.05,'triangle',.08);hudPlan();save();});

  const rnd=(n=>()=>(n=(n*16807)%2147483647)/2147483647)(3);for(let i=0;i<260;i++){const x=BX+rnd()*8*CS,y=BY+rnd()*ROWS*CS;g.fillStyle=`rgba(${rnd()<.5?'255,255,200':'0,0,0'},${.05+rnd()*.08})`;g.beginPath();g.ellipse(x,y,2+rnd()*6,1+rnd()*3,0,0,7);g.fill();}
  g.strokeStyle='rgba(30,20,10,.35)';g.lineWidth=1;for(let c=0;c<=8;c++){g.beginPath();g.moveTo(BX+c*CS,BY);g.lineTo(BX+c*CS,BY+ROWS*CS);g.stroke();}for(let r=0;r<=ROWS;r++){g.beginPath();g.moveTo(BX,BY+r*CS);g.lineTo(BX+8*CS,BY+r*CS);g.stroke();}

  g.strokeStyle='#6b4526';g.lineWidth=6;g.strokeRect(BX-8,BY-8,8*CS+16,ROWS*CS+16);g.strokeStyle='#c9a14a';g.lineWidth=2;g.strokeRect(BX-4,BY-4,8*CS+8,ROWS*CS+8);

 c.drawImage(bgCache,0,0,VW,VH);}
function drawUnitAt(c,u,side,x,y,o={}){const spr=spriteFor(u.t,side,u.s,o.sw);const w=spr.vw,h=spr.vh;const sc=o.sc||1;c.save();c.translate(x,y);if(o.face===-1&&!side||o.face===1&&side)c.scale(-1,1);c.globalAlpha=o.a==null?1:o.a;c.drawImage(spr,-w/2*sc,-(h-14)*sc,w*sc,h*sc);c.restore();

function frame2(){const now=performance.now();const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;tt+=dt;

 if(scr==='title'){const g=c.createRadialGradient(540,420,60,540,420,700);g.addColorStop(0,'#5a3a20');g.addColorStop(1,'#140c06');c.fillStyle=g;c.fillRect(0,0,VW,VH);c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(540,500,470,60,0,0,7);c.fill();for(let i=0;i<9;i++){c.fillStyle='rgba(242,212,138,'+(.05+.03*Math.sin(tt+i))+')';c.beginPath();c.arc(120+i*110,90+Math.sin(tt*.7+i)*20,40+i%3*20,0,7);c.fill();}const lineup=['knight','captain','griffin','archmage','warlord','lich','wyrm'];lineup.forEach((t,i)=>drawUnitAt(c,{t,s:1},i>3?1:0,170+i*125,490,{sc:1.5}));}
 else if((scr==='plan'||scr==='fight')&&R_){drawBg(c);
  if(scr==='plan'){const r=R_;// enemy preview silhouettes
   for(let i=0;i<8;i++){const u=r.bench[i];if(u&&!(dragging&&dragging.u===u))drawUnitAt(c,u,0,BX+i*CS+CS/2,BENCHY+CS-32,{sc:1.05});}
   for(const b of r.board.slice().sort((a,b)=>a.r-b.r))if(!(dragging&&dragging.u===b.u))drawUnitAt(c,b.u,0,BX+b.c*CS+CS/2,BY+b.r*CS+CS/2+26,{sc:1.25});
   c.fillStyle='rgba(242,212,138,.85)';c.font='italic 600 18px Georgia,serif';c.textAlign='center';c.fillText(`Round ${r.round}${r.round%5===0?' · '+U[CAMP[r.c].boss].n:''}`,BX+6*CS,BY+ROWS*CS/2);c.font='600 14px Optima,sans-serif';c.fillText('The enemy forms up here',BX+6*CS,BY+ROWS*CS/2+22);c.textAlign='left';
   if(dragging){const h=hitPlan(dragging);if(h&&h.z==='b'){c.fillStyle='rgba(242,212,138,.3)';c.fillRect(BX+h.c*CS,BY+h.r*CS,CS,CS);}if(h&&h.z==='s'){c.fillStyle='rgba(126,31,31,.85)';c.fillRect(BX,SHOPY-6,5*160-10,40);c.fillStyle='#fff';c.font='700 20px Georgia,serif';c.fillText('Release to sell for '+sellVal(dragging.u)+' gold',BX+20,SHOPY+20);}drawUnitAt(c,dragging.u,0,dragging.x,dragging.y+30,{sc:1.15,a:.9});}}
  else if(FT){if(!window.PAUSED&&$('ov').hidden)for(let i=0;i<speed;i++)stepFight(dt);
   const fs=FT.fs.slice().sort((a,b)=>a.y-b.y);for(const f of fs){if(!f.alive&&f.die>.6)continue;const a=f.alive?1:1-f.die/.6;const bob=f.alive&&f.walk?Math.abs(Math.sin(f.walk*10))*-3:0;const lunge=f.anim>0?Math.sin((1-f.anim/.25)*Math.PI)*8*f.face:0;
    drawUnitAt(c,{t:f.t,s:f.s},f.side,f.x+lunge,f.y+16+bob,{face:f.face,a,sw:f.anim>0?1:0,sc:1.25});
    if(f.hit>0){c.save();c.globalAlpha=f.hit*3;c.fillStyle='#fff';c.beginPath();c.arc(f.x,f.y-20,16,0,7);c.globalCompositeOperation='overlay';c.fill();c.restore();}
    if(f.alive){const bw=50,x=f.x-bw/2,y=f.y-74-(U[f.t].lk.big?30:0);// pennant health: wax tablet style
     c.fillStyle='rgba(20,12,6,.85)';c.beginPath();c.moveTo(x-3,y-3);c.lineTo(x+bw+3,y-3);c.lineTo(x+bw+3,y+10);c.lineTo(x+bw/2,y+14);c.lineTo(x-3,y+10);c.closePath();c.fill();
     c.fillStyle=f.side?'#c23a2a':'#4f8ae0';c.fillRect(x,y,bw*Math.max(0,f.hp/f.max),5);if(f.sh>0){c.fillStyle='#e8e8e8';c.fillRect(x,y,bw*Math.min(1,f.sh/f.max),2);}c.fillStyle='#c9a14a';c.fillRect(x,y+7,bw*f.mana/100,2.5);
     if(f.stun>0){c.fillStyle='#f2d48a';for(let k=0;k<3;k++){const a=tt*6+k*2.1;c.beginPath();c.arc(f.x+Math.cos(a)*12,y-6+Math.sin(a)*3,2,0,7);c.fill();}}
     if(f.burn>0){c.fillStyle='rgba(255,140,30,.6)';c.beginPath();c.arc(f.x,f.y-24,6+Math.sin(tt*20)*2,0,7);c.fill();}if(f.slow>0){c.strokeStyle='rgba(160,220,255,.8)';c.lineWidth=2;c.beginPath();c.ellipse(f.x,f.y+16,26,7,0,0,7);c.stroke();}}}
   for(const p of FT.proj){c.save();c.translate(p.x,p.y);c.rotate(p.a||0);if(p.k==='arrow'||p.k==='bolt'){c.strokeStyle='#e8d7aa';c.lineWidth=p.k==='bolt'?3:2;c.beginPath();c.moveTo(-14,0);c.lineTo(6,0);c.stroke();c.fillStyle='#c8d0d8';c.beginPath();c.moveTo(10,0);c.lineTo(4,-3);c.lineTo(4,3);c.fill();c.strokeStyle='#c23a2a';c.lineWidth=2;c.beginPath();c.moveTo(-14,-3);c.lineTo(-10,0);c.lineTo(-14,3);c.stroke();}
    else{const col=p.k==='fire'?'#ff8a1a':'#c89aff';const g=c.createRadialGradient(0,0,1,0,0,12);g.addColorStop(0,'#fff');g.addColorStop(.4,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,12,0,7);c.fill();c.fillStyle=col;c.globalAlpha=.4;c.beginPath();c.ellipse(-12,0,12,4,0,0,7);c.fill();}c.restore();}
   for(const e of FT.fx){const a=1-e.t/e.l;c.globalAlpha=Math.max(0,a);if(e.k==='p'){c.fillStyle=e.c;c.fillRect(e.x-2,e.y-2,4,4);}else if(e.k==='ring'){c.strokeStyle=e.c;c.lineWidth=4*a+1;c.beginPath();c.ellipse(e.x,e.y+14,e.r*(1-a*.5),e.r*(1-a*.5)*.4,0,0,7);c.stroke();}
    else if(e.k==='beam'){c.strokeStyle=e.c;c.lineWidth=6*a;c.beginPath();c.moveTo(e.x,e.y);c.lineTo(e.x+Math.cos(e.a)*800,e.y+Math.sin(e.a)*800);c.stroke();}
    else if(e.k==='meteor'){const p=e.t/e.l;c.fillStyle='#ff8a1a';c.beginPath();c.arc(e.x-120*(1-p),e.y-30-260*(1-p),14,0,7);c.fill();c.globalAlpha=.4;c.beginPath();c.ellipse(e.x,e.y+14,120*p,46*p,0,0,7);c.fill();}
    else if(e.k==='cone'){const g=c.createRadialGradient(e.x,e.y,4,e.x,e.y,260);g.addColorStop(0,'rgba(255,240,150,.9)');g.addColorStop(.5,'rgba(255,120,20,.6)');g.addColorStop(1,'rgba(255,60,0,0)');c.fillStyle=g;c.beginPath();c.moveTo(e.x,e.y);c.arc(e.x,e.y,260,e.face>0?-.5:Math.PI-.5,e.face>0?.5:Math.PI+.5);c.closePath();c.fill();}
    else if(e.k==='txt'){c.font='700 18px Georgia,serif';c.textAlign='center';c.lineWidth=4;c.strokeStyle='#1a0a04';c.strokeText(e.s,e.x,e.y-e.t*30);c.fillStyle=e.c;c.fillText(e.s,e.x,e.y-e.t*30);c.textAlign='left';}c.globalAlpha=1;}
   if(FT.done){c.fillStyle='rgba(10,6,2,.4)';c.fillRect(BX,BY,8*CS,ROWS*CS);c.font='700 64px "Trajan Pro",Georgia,serif';c.textAlign='center';c.fillStyle='#f2d48a';c.strokeStyle='#3a1010';c.lineWidth=8;const s=FT.res==='win'?'VICTORY':'DEFEAT';c.strokeText(s,BX+4*CS,BY+ROWS*CS/2+20);c.fillText(s,BX+4*CS,BY+ROWS*CS/2+20);c.textAlign='left';}}
  for(let i=FXT.length-1;i>=0;i--){const e=FXT[i];e.t+=dt;if(e.t>e.l){FXT.splice(i,1);continue;}c.globalAlpha=1-e.t/e.l;c.font='700 20px Georgia,serif';c.textAlign='center';c.lineWidth=4;c.strokeStyle='#1a0a04';c.strokeText(e.s,e.x,e.y-e.t*30);c.fillStyle=e.c;c.fillText(e.s,e.x,e.y-e.t*30);c.textAlign='left';c.globalAlpha=1;}}
 }
addEventListener('resize',()=>{fit();for(const k in SPC)delete SPC[k];if(scr==='plan')hudPlan();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(scr==='fight'&&$('ov').hidden)openPause();}});addEventListener('pagehide',save);
fit();
if(location.search.includes('gallery')){scr='gal';const c=cx;c.setTransform(K*DPR,0,0,K*DPR,0,0);c.fillStyle='#d8c49a';c.fillRect(0,0,VW,VH);Object.keys(U).forEach((k,i)=>{const col=i%6,row=Math.floor(i/6);const x=90+col*180,y=150+row*190;c.drawImage(spriteFor(k,0,1),x-90,y-140,180,165);c.fillStyle='#2a1a0a';c.font='14px sans-serif';c.textAlign='center';c.fillText(U[k].n,x,y+30);});}
else{title();requestAnimationFrame(frame);}
