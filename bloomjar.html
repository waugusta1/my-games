<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}</style></head><body>
<title>Bloom Jar</title>
<style>
/* Golden-hour garden: dusky plum sky, warm glass, candy petals */
:root{--bg:#2a1a33;--ink:#fff6ec;--muted:#e3c9d9;--accent:#ffb36b;--pink:#ff7fa8;--card:rgba(48,26,56,.88);--line:rgba(255,220,200,.25);color-scheme:dark;--f:Fredoka,"Trebuchet MS",system-ui,sans-serif}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--f);touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;text-align:center;background:radial-gradient(ellipse at center,rgba(42,26,51,.7),rgba(30,16,38,.94))}
h1{font-weight:700;font-size:clamp(50px,15vw,84px);margin:0;line-height:.95;background:linear-gradient(180deg,#ffe0a6,#ff8fb3);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,140,170,.45))}
h2{font-weight:700;font-size:36px;margin:0;color:var(--accent)}
.sub{color:var(--muted);font-weight:500;font-size:16px;max-width:300px;margin:0;line-height:1.4}
.btn{font:700 19px var(--f);color:#3a1430;background:linear-gradient(180deg,#ffd9a0,#ff8fb3);border:0;border-radius:999px;padding:13px 36px;cursor:pointer;box-shadow:0 8px 28px rgba(255,130,170,.4)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1.5px solid var(--line);font-size:16px;padding:10px 22px}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.pills{display:flex;gap:10px;justify-content:center}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px 16px;min-width:84px}
.pill span{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.pill b{display:block;font-size:26px;font-weight:700}
#ladder{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:320px}
#ladder canvas{width:26px;height:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
<canvas id="c" aria-label="Bloom Jar. Drag to aim, release to drop a flower. Matching flowers merge."></canvas>
<div id="title" class="ov">
  <h1>Bloom<br>Jar</h1>
  <p class="sub">Drop flowers into the jar. Two of a kind touch, they bloom into something bigger. Don't let the jar overflow.</p>
  <div id="ladder" aria-hidden="true"></div>
  <div class="pills"><div class="pill"><span>Best</span><b id="tBest">0</b></div></div>
  <button class="btn" id="playBtn">Start blooming</button>
  <button class="btn ghost" id="sndBtn">Sound: on</button>
</div>
<div id="over" class="ov" hidden>
  <h2 id="oTitle">Jar's full!</h2>
  <div class="pills"><div class="pill"><span>Score</span><b id="oScore">0</b></div><div class="pill"><span>Best</span><b id="oBest">0</b></div></div>
  <p class="sub" id="oBloom"></p>
  <div class="row"><button class="btn" id="againBtn">Plant again</button></div>
</div>
<script>

  try{const ref=col.doc(safe(k));if(v===null)await ref.delete();else if(v.length<240000)await ref.set({k,v,t:Date.now()});}catch(e){if(e&&e.code==='unavailable'){pending.set(k,v);await new Promise(r=>setTimeout(r,1500+Math.random()*1000));}}}}finally{busy=false;}}

window.__store={get(k){return has[k]?mem[k]:lget(k);},
  set(k,v){v=String(v);has[k]=1;mem[k]=v;lset(k,v);lset('__t:'+k,String(Date.now()));pending.set(k,v);sched();},
  remove(k){has[k]=1;mem[k]=null;lset(k,null);lset('__t:'+k,String(Date.now()));pending.set(k,null);sched();}};
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});addEventListener('pagehide',flush);
async function load(){if(!window.claude||!claude.use)return;const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;const id=await u.id();if(!id)return;
  db=d;uid=id;col=db.collection('data/users/'+uid);const snap=await col.get();const seen=new Set();
  for(const doc of snap.docs){const b=doc.data();if(!b||typeof b.k!=='string')continue;seen.add(b.k);const lt=+(lget('__t:'+b.k)||0),lv=lget(b.k);
    if(lv!==null&&lt>(b.t||0)){pending.set(b.k,lv);}else{has[b.k]=1;mem[b.k]=b.v;lset(b.k,b.v);lset('__t:'+b.k,String(b.t||Date.now()));}}

Promise.race([load().catch(()=>{}),new Promise(r=>setTimeout(r,5000))]).then(go);
})();
</script>

    if(shown<score)shown=Math.min(score,shown+Math.max(1,(score-shown)*dt*8));}
  else if(state==='ending'){overT+=dt;if(overT>.08&&B.length){overT=0;const b=B.shift();burst(b.x,b.y,b.t,10);pluck(note(b.t%8),.2,.03);}if(!B.length&&$('over').hidden&&overT>.6)showOver();}
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.vx*=.97;p.rot+=p.vr*dt;}parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.life-=dt;p.y-=30*dt;}pops=pops.filter(p=>p.life>0);shake=Math.max(0,shake-dt*30);}
function end(){state='ending';overT=0;buzz([60,40,60]);thud(.2);if(score>save.best){save.best=score;}save.top=Math.max(save.top||0,topTier);persist();}
function showOver(){state='over';$('oScore').textContent=score;$('oBest').textContent=save.best;$('oTitle').textContent=score>=save.best&&score>0?'New best!':"Jar's full!";$('oBloom').textContent='Biggest bloom: '+T[topTier].n;$('over').hidden=false;}

/* ---------- input ---------- */
let holding=false;const toW=x=>(x-ox)/k;
cv.addEventListener('pointerdown',e=>{audio();if(state!=='play')return;holding=true;aimX=toW(e.clientX);});
addEventListener('pointermove',e=>{if(state==='play'&&(holding||e.pointerType==='mouse'))aimX=toW(e.clientX);});
addEventListener('pointerup',e=>{if(holding&&state==='play'){aimX=toW(e.clientX);drop();}holding=false;});
addEventListener('keydown',e=>{if(state!=='play')return;if(e.code==='ArrowLeft')aimX-=20;if(e.code==='ArrowRight')aimX+=20;if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();drop();}aimX=clamp(aimX,0,JW);});
function start(){audio();reset();state='play';$('title').hidden=true;$('over').hidden=true;}
$('playBtn').onclick=start;$('againBtn').onclick=start;

/* ---------- render ---------- */
function drawB(t,x,y,a,sq=0,alpha=1){const s=SP[t],sz=(T[t].r*2+8)*k;ctx.save();ctx.translate(ox+x*k,oy+y*k);ctx.rotate(a);const q=1+Math.sin(sq*10)*sq*.12;ctx.scale(q,2-q);ctx.globalAlpha=alpha;ctx.drawImage(s,-sz/2,-sz/2,sz,sz);ctx.restore();}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(BG,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);
  // fireflies
  ctx.globalCompositeOperation='lighter';for(const f of fireflies){const x=(f.x*W+Math.sin(clock*f.s+f.p)*30+W)%W,y=f.y*H*.8+Math.cos(clock*f.s*.7+f.p)*20,al=.3+.7*Math.max(0,Math.sin(clock*2*f.s+f.p));const g=ctx.createRadialGradient(x,y,0,x,y,8);g.addColorStop(0,`rgba(255,240,160,${al})`);g.addColorStop(1,'rgba(255,220,120,0)');ctx.fillStyle=g;ctx.fillRect(x-8,y-8,16,16);}ctx.globalCompositeOperation='source-over';
  const sx=shake?(R()-.5)*shake:0,sy=shake?(R()-.5)*shake:0;ctx.save();ctx.translate(sx,sy);
  const jx=ox,jy=oy,jw=JW*k,jh=JH*k,lip=10*k;
  // jar back glass
  const jg=ctx.createLinearGradient(jx,0,jx+jw,0);jg.addColorStop(0,'rgba(255,240,230,.16)');jg.addColorStop(.5,'rgba(255,240,230,.05)');jg.addColorStop(1,'rgba(255,240,230,.13)');ctx.fillStyle=jg;
  rr(jx-lip,jy-6*k,jw+lip*2,jh+lip+6*k,22*k);ctx.fill();
  // soil
  const sg=ctx.createLinearGradient(0,jy+jh-14*k,0,jy+jh);sg.addColorStop(0,'rgba(80,40,30,.0)');sg.addColorStop(1,'rgba(80,40,30,.55)');ctx.fillStyle=sg;ctx.fillRect(jx,jy+jh-14*k,jw,14*k);
  if(danger>.4&&state==='play'){ctx.save();ctx.textAlign='center';ctx.font='700 '+Math.round(30*Math.max(.8,k))+'px Fredoka,system-ui,sans-serif';ctx.fillStyle=`rgba(255,110,130,${.6+.4*Math.sin(clock*12)})`;ctx.fillText('Overflowing! '+Math.max(1,Math.ceil(3-danger)),jx+jw/2,jy-12*k);ctx.restore();}
  // danger line
  const dl=danger>0?.5+.5*Math.sin(clock*20):0;ctx.strokeStyle=danger>0?`rgba(255,80,100,${.5+dl*.5})`:'rgba(255,230,210,.25)';ctx.setLineDash([8*k,8*k]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(jx,jy);ctx.lineTo(jx+jw,jy);ctx.stroke();ctx.setLineDash([]);
  // aim guide + held flower
  if(state==='play'){const r=T[cur].r,x=clamp(aimX,r,JW-r);ctx.strokeStyle='rgba(255,240,220,.22)';ctx.lineWidth=2;ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(ox+x*k,jy-TOP*k+r*k);ctx.lineTo(ox+x*k,jy+jh);ctx.stroke();ctx.setLineDash([]);
    drawB(cur,x,-TOP*.55,Math.sin(clock*2)*.15,0,cool>0?.45:1);}
  // bodies
  for(const b of B)drawB(b.t,b.x,b.y,b.a,b.sq);
  // jar front glass & rim
  ctx.strokeStyle='rgba(255,245,235,.55)';ctx.lineWidth=3*k;rr(jx-lip,jy-6*k,jw+lip*2,jh+lip+6*k,22*k);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.14)';rr(jx-lip+8*k,jy+20*k,10*k,jh*.65,6*k);ctx.fill();ctx.fillStyle='rgba(255,255,255,.08)';rr(jx+jw-6*k,jy+40*k,6*k,jh*.4,4*k);ctx.fill();
  // petals
  for(const p of parts){ctx.save();ctx.translate(ox+p.x*k,oy+p.y*k);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life/p.ml*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.s*k,p.s*.5*k,0,0,TAU);ctx.fill();ctx.restore();}
  ctx.globalAlpha=1;
  ctx.textAlign='center';for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*2);ctx.font='700 '+Math.round((p.big?26:17)*Math.max(.8,k))+'px Fredoka,system-ui,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(60,20,50,.7)';ctx.strokeText(p.txt,ox+p.x*k,oy+p.y*k);ctx.fillStyle=p.big?'#ffe08a':'#fff';ctx.fillText(p.txt,ox+p.x*k,oy+p.y*k);}ctx.globalAlpha=1;
  ctx.restore();
  // HUD
  if(state!=='title'){const top=14;ctx.textAlign='left';ctx.fillStyle='rgba(255,230,215,.75)';ctx.font='600 12px Fredoka,system-ui,sans-serif';ctx.fillText('SCORE',16,top+12);ctx.fillStyle='#fff6ec';ctx.font='700 32px Fredoka,system-ui,sans-serif';ctx.fillText(Math.floor(shown),16,top+44);
    ctx.fillStyle='rgba(255,230,215,.6)';ctx.font='600 12px Fredoka,system-ui,sans-serif';ctx.fillText('BEST '+Math.max(save.best,score),16,top+62);
    ctx.textAlign='right';ctx.fillStyle='rgba(255,230,215,.75)';ctx.fillText('NEXT',W-16,top+12);const nr=22;ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.arc(W-16-nr,top+20+nr,nr+4,0,TAU);ctx.fill();
    const ns=SP[next],nsz=(T[next].r*2+8)*Math.min(1,nr/T[next].r);ctx.drawImage(ns,W-16-nr-nsz/2,top+20+nr-nsz/2,nsz,nsz);
    if(combo>1&&comboT>0){ctx.textAlign='center';ctx.font='700 18px Fredoka,system-ui,sans-serif';ctx.fillStyle='#ffd27a';ctx.fillText('Combo x'+combo,W/2,top+30);}
    // ladder
    const n=T.length,ls=Math.min(26,(W-40)/n),lx0=W/2-ls*n/2,ly=H-34;for(let i=0;i<n;i++){ctx.globalAlpha=i<=Math.max(topTier,save.top||0)?1:.25;ctx.drawImage(SP[i],lx0+i*ls,ly,ls-2,ls-2);}ctx.globalAlpha=1;}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function frame(now){const dt=Math.min(1/30,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
resize();reset();$('tBest').textContent=save.best;
// ladder on title
T.forEach((_,i)=>{const c=document.createElement('canvas');c.width=c.height=52;const g=c.getContext('2d');const f=T[i],s=52/(f.r*2+8);g.scale(s,s);drawFlower(g,i,f.r+4,f.r);$('ladder').appendChild(c);});
// title: a few decorative flowers in the jar
for(let i=0;i<7;i++){const t=(R()*6)|0;B.push(body(t,40+R()*260,200+R()*300));}
const titleSim=()=>{if(state==='title'){physics(1/60);}};setInterval(titleSim,1000/60);
requestAnimationFrame(frame);
})();

});</script>
