 {id:'s3',n:'Carry the Horn',L:2,foes:'rat*2,ratsling*2,stoat',waves:[[3,'rat*2'],[5,'stoat']],obj:{t:'escape'},par:8,mix:{f:.2,s:.06,d:.05},recruit:'ysolde',

  post:[S('Ysolde','I heard you coming from three fields away. You run like a sack of acorns.'),S('Ysolde','That horn was sounded once, when the Hedge was young. It has not been silent. You have just not been listening.'),S('Pip','What does it do?'),S('Ysolde','It remembers. Let me come along. Someone must keep you alive long enough to find out.')]},
 {id:'s4',n:"Otter's Ford",L:2,foes:'rat*3,stoat,ratsling',obj:{t:'rout'},par:7,river:1,mix:{f:.1,s:.05},recruit:'merle',
  pre:[S('Merle','You lot want across my ford? Toll is one fish. Or, you know, clear out those stoats on my bank.'),S('Sorrel','We have no fish.'),S('Merle','Then you know what to do. I will help. For free. Write that down, it will not happen again.')],
  post:[S('Merle','Merle Riverkin. Nice little army. Bit short. Where do I sign?'),S('Hob','There is no pay.'),S('Merle','There is never any pay. It is why I keep a list.')]},
 {id:'s5',n:'Hold the Stile',L:3,foes:'rat*3,stoat*2',waves:[[2,'rat*2,ratsling'],[4,'stoat,rat*2']],obj:{t:'hold',n:6},par:6,mix:{f:.1,s:.08},
  pre:[S('Hob','The Lower Hedge folk are coming through behind us. Mothers, kits, the lot.'),S('Ysolde','Keep every foe off the marked ground for six turns. If one stands there when their turn ends, the road is cut.')],
  post:[S('Pip','That is the last of them through.'),S('Tansy','All my barley will not feed that many. Not to the end of summer.'),S('Hob','One worry at a time.')]},
 {id:'s6',n:'The Mole Pits',L:3,foes:'stoat*2,weasel*2,rat*2',obj:{t:'rescue',who:'tumble'},par:8,mix:{f:.05,d:.2,s:.1},recruit:'tumble',
  pre:[S('Ysolde','There is a sapper under this field. The Host has dug in over his head.'),S('Merle','What do they want with a mole?'),S('Ysolde','The same thing I want. There are tunnels under the entire Hedge, and only one creature living who knows them.')],
  post:[S('Tumble','Ah. Ah, yes. Good. Who stood on my roof? Heavy lot. Thank you. Tumble Delver. I know where everything is.'),S('Pip','Do you know where the Host is going?'),S('Tumble','Oh, I know where they came from. They came up the north drain. The north hedge is gone, you see. All of it. Ripped out, roots and all.')]},
 {id:'s7',n:'The Crow Parliament',L:4,foes:'crow*4,ratsling*2',waves:[[3,'crow*2']],obj:{t:'rout'},par:7,mix:{f:.15,x:.08,k:.05},
  pre:[S('Sorrel','Why are there crows on the road?'),S('Ysolde','The Queen pays in leftovers. Crows are always first to know where those will be.'),S('Hob','Shoot what you can. They will not stand still.')],
  post:[S('Pip','One of them dropped this. Marching orders. Five-Bar Gate by the new moon.'),S('Hob','Sloe. That will be Sloe. I know that hand. I taught him to write it.')]},
 {id:'s8',n:'Captain Sloe',L:5,foes:'stoat*3,sergeant,ratsling*2',boss:'sloe',obj:{t:'boss'},par:9,w:12,h:8,mix:{f:.1,s:.08,a:1},
  pre:[S('Sloe','Hob Brock! You got old.'),S('Hob','You got a uniform.'),S('Sloe','I got fed. The hedge you never let me into is under the plough, old friend. Move aside, and my Queen will let you keep a corner.'),S('Hob','Watch! With me.')],
  post:[S('Sloe','You have no idea what is behind us.'),S('Hob','Then tell me.'),S('Sloe','Nothing. There is NOTHING behind us. That is why she will not stop.'),S('Pip','The horn. Mother, I heard it. Just then. A long way off, like wind in a pipe.')]},
 {id:'ss1',side:1,n:'Forage Run',L:2,foes:'rat*3',waves:[[3,'rat*2']],obj:{t:'cache',n:3},par:6,mix:{f:.25,d:.08},rew:90,after:'s2'},
 {id:'ss2',side:1,n:'The Rat Nest',L:3,foes:'rat*5,ratsling*2',obj:{t:'rout'},par:7,mix:{f:.15,x:.08},rew:110,after:'s5'},
],[ /* SUMMER */
 {id:'u1',n:'Dry Grass',L:5,foes:'rat*2,torch*2,stoat*2',obj:{t:'rout'},par:7,mix:{f:.32,b:.08},
  pre:[S('Tansy','It has not rained in five weeks. The barley is like tinder.'),S('Merle','They are carrying fire. Why are they carrying fire?'),S('Hob','If they cannot hold it, they will burn it. Mind the ferns and brambles. Fire runs through them.')],
  post:[S('Pip','There is a squirrel up that oak. She has been shooting them since dawn.')]},
 {id:'u2',n:'The Barley Oak',L:5,foes:'stoat*2,torch*2,weasel*2',waves:[[3,'torch,rat*2']],obj:{t:'rescue',who:'fern'},par:8,mix:{f:.3,k:.08,b:.05},recruit:'fern',
  pre:[S('Fern','Stay away from my tree!'),S('Sorrel','We are helping!'),S('Fern','Then help FASTER.')],
  post:[S('Fern','It is gone. Three hundred years old. They lit it for a laugh.'),S('Ysolde','Come with us, Fern.'),S('Fern','I am coming. Not for you. Give me the ones with torches first.')]},
 {id:'u3',n:'Water for the Fields',L:6,foes:'stoat*3,torch*2,polecat',waves:[[3,'rat*3']],obj:{t:'hold',n:6},par:6,river:1,mix:{f:.25},
  pre:[S('Merle','If I open the sluice, the lower field floods and the fire stops.'),S('Hob','How long?'),S('Merle','Six turns. Keep them off me.')],
  post:[S('Merle','There she goes. Oh, that is beautiful. Half the rats on the heath just learned to swim.')]},
 {id:'u4',n:'The Marsh Doctor',L:6,foes:'adder*3,rat*2',obj:{t:'rescue',who:'bogle'},par:8,mix:{f:.3,w:.15,d:.15},recruit:'bogle',
  pre:[S('Ysolde','Half the company is coughing. There is a toad in the sedge who can help, if the snakes have left any of him.'),S('Pip','Snakes. Snakes are new.'),S('Ysolde','They hide in ferns. Walk carefully.')],
  post:[S('Bogle','Took your time. Stick out your tongue. Yes. Disgusting. Drink this.'),S('Pip','What is in it?'),S('Bogle','Marsh. Mostly.'),S('Bogle','The adders have taken a side, by the way. Old Sloughskin signed with the Queen. He gets the south heath.')]},
 {id:'u5',n:'Smoke Road',L:7,foes:'weasel*3,torch*2,stoat*2',waves:[[3,'weasel*2'],[5,'stoat*2']],obj:{t:'escape'},par:8,mix:{f:.35,b:.1,s:.05},
  pre:[S('Tansy','The whole upper field is going. We get out now or not at all.')],
  post:[S('Tansy','We lost the barley.'),S('Hob','We have the folk.'),S('Tansy','And what do they eat, Hob?'),S('Hob','...')]},
 {id:'u6',n:'Heath Crossing',L:7,foes:'adder*3,polecat,crow*2',obj:{t:'rout'},par:8,mix:{f:.3,n:0,b:.12,s:.05},
  pre:[S('Fern','Everything here wants to bite you.'),S('Merle','Reminds me of my mum.')],
  post:[S('Tumble','He is under us. The old one. I can hear him breathing in the rabbit holes.')]},
 {id:'u7',n:'The Warren Fires',L:8,foes:'stoat*3,polecat*2,torch*2',waves:[[4,'crow*2,rat*2']],obj:{t:'survive',n:7},par:7,mix:{f:.28,x:.05,s:.06},
  pre:[S('Sorrel','My people are in that warren. Seven turns and the last of them are down the deep tunnel. Please.'),S('Pip','You said please.'),S('Sorrel','Do not tell anyone.')],
  post:[S('Sorrel','Every one of them out. I counted. I counted twice.')]},
 {id:'u8',n:'Old Sloughskin',L:9,foes:'adder*4,polecat',boss:'sloughskin',obj:{t:'boss'},par:9,w:12,h:8,mix:{f:.34,w:.08,b:.06},
  pre:[S('Sloughskin','Little runner. I ate the one who carried that horn before your grandmother.'),S('Pip','It is louder near you. Why is it louder?'),S('Sloughskin','Because it knows me. Come here and I shall tell you what it is for.')],
  post:[S('Pip','It was not a war horn.'),S('Ysolde','No. Tell them.'),S('Pip','It called folk IN. When the first hedge was planted. It is a gathering horn. It means there is room.'),S('Hob','There is no room. There is no barley. And autumn is coming.')]},
 {id:'us1',side:1,n:'Ash Forage',L:6,foes:'rat*3,torch',waves:[[3,'crow*2']],obj:{t:'cache',n:4},par:7,mix:{f:.25,b:.1},rew:140,after:'u2'},
 {id:'us2',side:1,n:'Adder Hollow',L:8,foes:'adder*5',obj:{t:'rout'},par:7,mix:{f:.4,d:.1},rew:170,after:'u6'},
],[ /* AUTUMN */
 {id:'a1',n:'The Harvest March',L:9,foes:'stoat*4,sergeant,ratsling*2',obj:{t:'rout'},par:8,mix:{f:.15,s:.06,x:.05},
  pre:[S('Tansy','Every nut we can gather from now until the frost. Whoever holds the beech ridge eats this winter.'),S('Hob','Then we hold the beech ridge.')],
  post:[S('Sorrel','There is a fox at the camp. Sitting on my drum. Eating my apple.')],choice:null},
 {id:'a2',n:'A Fox at the Fire',L:9,foes:'weasel*4,stoat*2',obj:{t:'rescue',who:'vesper'},par:8,mix:{f:.2,x:.05},
  pre:[S('Vesper','Vesper Rusk. I sold the Queen every map she has. I want to sell you the one she does not.'),S('Hob','Why?'),S('Vesper','She stopped paying. Also there are six weasels who wish to discuss it with me, and they are right behind you.')],
  post:[S('Vesper','The map is real, you know. Whether you trust me is a separate matter.')],
  choice:{q:'What is to be done with the fox?',a:[{t:'Take him in. Everyone gets one chance.',m:1,rec:'vesper',r:[S('Vesper','How touching. Nobody has made that mistake in years.')]},{t:'Keep the map. Run him off.',m:0,nuts:200,r:[S('Vesper','Reasonable. I would have done the same. I would also check that map.')]}]}},
 {id:'a3',n:'Beech Ridge',L:10,foes:'stoat*3,sergeant*2,polecat,crow*2',obj:{t:'hold',n:6},par:6,ridge:1,mix:{f:.12,s:.08},
  pre:[S('Tansy','Beechmast for a thousand families. Do not let them near it.')],
  post:[S('Tansy','It is not enough. It is a lot, and it is not enough.')]},
 {id:'a4',n:'Old Drain',L:10,foes:'rat*4,weasel*3,polecat',waves:[[3,'rat*3']],obj:{t:'escape'},par:8,mix:{d:.3,w:.15,s:.08},
  pre:[S('Tumble','This drain goes under the millpond, past their supply dump. Quietly now. Quiet. Merle.'),S('Merle','I have not said anything.'),S('Tumble','You were about to.')],
  post:[S('Pip','Stoat kits. In the dump. Hundreds of them, sleeping in sacks.'),S('Hob','Say nothing to the others.')]},
 {id:'a5',n:'The Supply Dump',L:11,foes:'stoat*4,sergeant,polecat*2',obj:{t:'cache',n:4},par:8,mix:{f:.1,s:.08,x:.06},
  pre:[S('Sorrel','That is a winter of grain in those sacks. We take it and they starve by midwinter.'),S('Pip','The kits are in those sacks.'),S('Sorrel','I know where the kits are.')],
  post:[S('Ysolde','You have the grain. Now you must decide what you are.')],
  choice:{q:'There is grain enough for one side. The stoat kits are watching.',a:[{t:'Leave a third of it for the kits.',m:1,nuts:80,r:[S('Tansy','I will never forgive you. Help me carry the rest.')]},{t:'Take it all. Our own come first.',m:0,nuts:320,r:[S('Hob','Yes. Our own come first. Do not look back at them, runner.')]}]}},
 {id:'a6',n:'Leaves on the Water',L:11,foes:'crow*3,adder*2,stoat*3',waves:[[4,'crow*3']],obj:{t:'rout'},par:8,river:1,mix:{f:.2,x:.05},
  pre:[S('Merle','The Reeve holds the millpond. Fish for his belly, and he stabs whatever the Queen points at.'),S('Fern','It has to be done. Everything south runs through that pond.')],
  post:[S('Merle','I can see him. Just standing there. He has been standing there since I was a pup.')]},
 {id:'a7',n:'The Mill Wall',L:12,foes:'stoat*3,sergeant*2,ratsling*3',waves:[[3,'stoat*2']],obj:{t:'rout'},par:9,w:12,mix:{a:1,s:.05,w:.1},
  pre:[S('Hob','Through the wall, or round. Either way, loudly.')],
  post:[S('Ysolde','Frost on the wheel this morning. In autumn. That is much too early.')]},
 {id:'a8',n:'The Grey Reeve',L:13,foes:'crow*3,stoat*3',boss:'reeve',obj:{t:'boss'},par:9,w:12,h:9,river:2,mix:{w:.2,f:.15},
  pre:[S('Reeve','Small. All of you. So small. I have eaten your uncles.'),S('Merle','Yes you have. I have a list.')],
  post:[S('Merle','That is the top of the list. Oh, I thought that would feel different.'),S('Ysolde','Look north.'),S('Pip','Is that cloud?'),S('Ysolde','That is the first snow. She has brought winter with her, or it has chased her here. It comes to the same thing.')]},
 {id:'as1',side:1,n:'Nut Gathering',L:10,foes:'rat*3,weasel*2',waves:[[3,'crow*2']],obj:{t:'cache',n:4},par:7,mix:{f:.2,x:.08},rew:200,after:'a2'},
 {id:'as2',side:1,n:'Polecat Den',L:12,foes:'polecat*4,rat*2',obj:{t:'rout'},par:8,mix:{d:.15,x:.06},rew:240,after:'a6'},
],[ /* WINTER */
 {id:'w1',n:'First Snow',L:13,foes:'ermine*2,stoat*3',obj:{t:'rout'},par:8,snow:1,mix:{n:.3,i:.06,s:.06},
  pre:[S('Bogle','Toads should be asleep. I want that noted. I am very cross.'),S('Hob','White armor. The Queen\'s own, then.'),S('Ysolde','Snow slows you and not them. Ice carries you further than you meant to go.')],
  post:[S('Pip','They are thin, sir. Under the armor. They are all so thin.'),S('Hob','So are we.')]},
 {id:'w2',n:'The Frozen Ford',L:14,foes:'ermine*2,stoat*2,crow*3',obj:{t:'escape'},waves:[[3,'stoat*2'],[5,'ermine']],par:8,snow:1,river:1,mix:{n:.25,i:.2},frozen:1,
  pre:[S('Merle','My ford. My beautiful ford. Do not stand on the middle, it cracks and slides.')],
  post:[S('Merle','Well. Got across. Never going to forgive it, mind.')]},
 {id:'w3',n:'Long Night',L:14,foes:'stoat*4,ermine',waves:[[2,'rat*3'],[4,'stoat*2,crow*2'],[6,'ermine,polecat']],obj:{t:'survive',n:8},par:8,snow:1,mix:{n:.2,s:.1},
  pre:[S('Tansy','Refugees on the road. Theirs and ours, all mixed up in the dark.'),S('Hob','Hold till light.')],
  post:[S('Pip','There was a stoat mother asking me which way was south.'),S('Hob','What did you say?'),S('Pip','I pointed.')]},
 {id:'w4',n:"Glutton's Pass",L:15,foes:'ermine*2,polecat*2,stoat*2',boss:'wolverine',obj:{t:'boss'},par:9,snow:1,w:12,mix:{n:.3,s:.12,i:.05},
  pre:[S('Gulo','Hah! Food comes to ME now!'),S('Sorrel','What is THAT?'),S('Vesper','That would be the Glutton. He eats ahead of the army, which is why the army is so thin.')],
  post:[S('Tumble','He was eating their stores. Their own stores. The whole winter ration.'),S('Ysolde','Now you see the thing clearly. The Queen does not have food either.')]},
 {id:'w5',n:'The Empty Larder',L:15,foes:'stoat*3,weasel*3,crow*2',obj:{t:'cache',n:4},waves:[[4,'ermine']],par:8,snow:1,mix:{n:.2,x:.05,s:.08},
  pre:[S('Tansy','If we get to that old larder first, we can feed the camp for a month.'),S('Pip','And if theirs get there first?'),S('Tansy','Then they eat, and we do not. That is what winter is, runner.')],
  post:[S('Pip','Mother Ysolde. How many folk can a hedge hold?'),S('Ysolde','How long a hedge?'),S('Pip','All of it. If you dug under, like Tumble does. If you stopped counting whose side anything was.')],
  choice:{q:'A stoat envoy comes under a white rag. She begs food for the camps.',a:[{t:'Send them half the larder.',m:1,nuts:0,r:[S('Hob','Well. That is us hungry, then. Good. Being hungry is at least familiar.')]},{t:'Turn her away. Sell the surplus.',m:0,nuts:400,r:[S('Vesper','Practical. I have nothing to add. Which should worry you.')]}]}},
 {id:'w6',n:'Whiteout',L:16,foes:'ermine*3,weasel*3',waves:[[3,'stoat*3']],obj:{t:'rout'},par:9,snow:1,mix:{n:.4,i:.1,s:.05},
  pre:[S('Fern','I can see about two tails in front of me. Everything else is just white.')],
  post:[S('Sorrel','Hob. You are limping.'),S('Hob','No I am not.')]},
 {id:'w7',n:"Hob's Stand",L:17,foes:'ermine*3,sergeant*2,stoat*2',waves:[[2,'stoat*2'],[4,'ermine,polecat'],[6,'stoat*3']],obj:{t:'hold',n:8},par:8,snow:1,ridge:1,mix:{n:.25,s:.08},
  pre:[S('Hob','The whole Lower Hedge is on this one road. I will hold the bridge.'),S('Pip','WE will hold the bridge, sir.'),S('Hob','That is what I said.')],
  post:[S('Hob','Sit me down, runner. I am only tired. Just tired. Sound your grandmother\'s horn, why don\'t you, it is too quiet out here.'),S('Pip','It still does not make a sound, sir.'),S('Hob','Everyone can hear it now. Listen. Up on the road. They have stopped walking.')]},
 {id:'ws1',side:1,n:'Under the Drifts',L:15,foes:'stoat*3,crow*3',waves:[[3,'weasel*2']],obj:{t:'cache',n:4},par:8,snow:1,mix:{n:.4,x:.05},rew:280,after:'w2'},
 {id:'ws2',side:1,n:'Knights on the Ice',L:17,foes:'ermine*5',obj:{t:'rout'},par:9,snow:1,mix:{i:.35,n:.2},rew:340,after:'w5'},
],[ /* THAW */
 {id:'t1',n:'Meltwater',L:17,foes:'ermine*2,stoat*3,polecat',obj:{t:'rout'},par:8,river:1,mix:{d:.2,w:.1,n:.1},
  pre:[S('Ysolde','The ice is going. Her army is cut in two. If it ends, it ends now.'),S('Tansy','Then we go to the White Hall.')],
  post:[S('Merle','You know what I hate? I hate it when the river is on my side and I still feel bad.')]},
 {id:'t2',n:'Road of Banners',L:18,foes:'ermine*3,sergeant*2,crow*2',waves:[[3,'stoat*3']],obj:{t:'escape'},par:9,mix:{d:.15,s:.08,n:.08},
  pre:[S('Sorrel','Right up the middle? Past the whole camp?'),S('Vesper','Straight down the road, with the banner up. Nobody stops someone who looks like they are supposed to be there.')],
  post:[S('Pip','There are old folk watching us go by. Nobody is even shouting.')]},
 {id:'t3',n:'The Thin Guard',L:19,foes:'ermine*4,stoat*2',obj:{t:'rout'},par:9,mix:{d:.1,x:.06,n:.1},
  pre:[S('Hob','Her last real soldiers. Do not enjoy it.')],post:[S('Bogle','These are the old ones. Younger than me, and old already. Half of them cannot lift the lance.')]},
 {id:'t4',n:'The Gatehouse',L:20,foes:'ermine*3,sergeant*2,ratsling*3',waves:[[3,'ermine,polecat']],obj:{t:'rout'},par:9,w:12,mix:{a:1,n:.08},
  pre:[S('Tumble','I could dig under. Or you could hit it. I do enjoy both.')],post:[S('Pip','It is open. She is inside.')]},
 {id:'t5',n:'Queen Ermengard',L:21,foes:'ermine*4,sergeant*2',boss:'ermengard',waves:[[3,'stoat*2'],[6,'ermine*2']],obj:{t:'boss'},par:12,w:13,h:9,mix:{i:.15,n:.15,s:.05},
  pre:[S('Queen','The little runner with the old horn. Do you know what a plough sounds like?'),S('Pip','No, your grace.'),S('Queen','You will. It gets to every hedge in the end. I walked my people five hundred fields ahead of it. I will not stop for a mouse.'),S('Pip','Nobody asked you to stop. I just came to say there is room.'),S('Queen','Then come and say it to my face.')],
  post:[],final:1},
 {id:'ts1',side:1,n:'Mudslide',L:19,foes:'polecat*3,stoat*3',waves:[[3,'rat*4']],obj:{t:'cache',n:4},par:8,mix:{d:.35,w:.1},rew:380,after:'t1'},
],

const LORE=[
 {n:'The Bramble Watch',ch:0,t:'A company as old as the Old Hedge. Thirty fighters at its height; six when this book begins. Its one charge: no hedge-folk turned away and none harmed on the road. Nobody remembers who gave that charge.'},
 {n:'The Silent Horn',ch:0,t:'A cow-horn bound in brass. The runner carries it. It has never made a sound anyone could recall, though old folk say they sometimes wake up meaning to go somewhere.'},
 {n:'Reading the Ground',ch:0,t:'Fighters on higher ground hit harder. Those in ferns take less from arrows, and foes in ferns cannot be seen until you are close. Mud, snow and bramble slow you. Water slows everyone but otters and toads.'},
 {n:'Fire',ch:1,t:'Fire runs through ferns and bramble. It burns itself out in a couple of turns and leaves scorched ground. Water stops it. So does a good firebreak, if you have a mole.'},
 {n:'What the Adders Want',ch:1,t:'Adders do not fight wars. Old Sloughskin signed with the Queen for the south heath, and would have signed with anybody. It is a hard thing, knowing your enemy would have been your ally for the same price.'},
 {n:'The Plough',ch:2,t:'Tumble Delver heard it through the ground for two days before the north hedge fell. He says it does not sound like anything alive. He says it does not stop for dinner.'},
 {n:'Stoat Kits',ch:2,t:'A stoat bears a dozen kits at a time. The Host carried its young in sacks for five hundred fields, because there was nowhere to set them down.'},
 {n:'Ice',ch:3,t:'A shove on ice does not stop where it should. A fighter pushed there keeps sliding until something stops them. It works on Ermine Knights too, if you get them onto it.'},
 {n:'The Gathering',ch:4,t:'The horn was blown once, when the first hedge went in. It meant: there is room, come in. Everything that lives in the Hedge came from somewhere else.'},
];

 if(o.t==='rout'||o.t==='rescue'){if(o.t==='rescue'&&B.units.some(u=>u.captive))return null;if(!foes.length&&!pendingWaves())return'win';}
 if(o.t==='boss'){if(!B.units.some(u=>u.boss&&u.hp>0))return'win';}
 if(o.t==='escape'){if(alive.every(u=>u.gone))return'win';}
 if(o.t==='hold'){if(B.turn>o.n||(!foes.length&&!pendingWaves()))return'win';if(B.gateLost)return'lose';}
 if(o.t==='survive'){if(B.turn>o.n||(!foes.length&&!pendingWaves()))return'win';}
 if(o.t==='cache'){if(B.caches>=o.n)return'win';}
 return null;}
function pendingWaves(){return (B.spec.waves||[]).some(w=>!B.fired[w[0]]);}
function objText(){const o=B.spec.obj;if(o.t==='rout')return'Drive every foe from the field';if(o.t==='boss'){const b=B.units.find(u=>u.boss);return'Defeat '+(b?b.name:'their leader');}
 if(o.t==='hold')return'Keep foes off the gold ground: turn '+Math.min(B.turn,o.n)+' of '+o.n+', road strength '+Math.max(0,B.gateHP);if(o.t==='escape'){const n=B.units.filter(u=>u.side===0&&u.gone).length,t=B.units.filter(u=>u.side===0&&u.hp>0).length;return'Reach the far side: '+n+' of '+t+' safe';}
 if(o.t==='rescue'){const cap=B.units.find(u=>u.captive);return cap?'Reach '+cap.name.split(' ')[0]+', then clear the field':'Clear the field';}if(o.t==='survive')return'Hold out: turn '+Math.min(B.turn,o.n)+' of '+o.n;if(o.t==='cache')return'Gather stores: '+B.caches+' of '+o.n;return'';}

async function dealDamage(att,def,d,opt){opt=opt||{};if(def.hp<=0)return;def.hp=Math.max(0,def.hp-d);fxHit(def,d,opt);sfx(opt.ranged?'thud':'hit');

 if(att&&att.tr&&att.tr.venom&&def.hp>0&&!opt.skill&&!def.tr.nopoison)def.st.poison=Math.max(def.st.poison||0,2);}
async function fallUnit(u,by){u.hp=0;if(u.side===0){if(B.firstUp>0&&!B.spec.endless){B.firstUp=0;u.hp=Math.ceil(u.mhp/2);fxTag(u,'Back up!');sfx('heal');return;}B.fallen++;B.lost.push(u.k);fxTag(u,'Falls!');sfx('fall');}else{sfx('down');if(by){by.kills=(by.kills||0)+1;B.killsTotal++;if(by.side===0)B.xp=B.xp||{},B.xp[by.k]=(B.xp[by.k]||0)+Math.round((FOE[u.k]?FOE[u.k].xp:6)*(1+B.spec.L*.04));}}

function neighborAway(t,from,toward){const ns=nbrs(cell(t.c,t.r));let best=null,bd=toward?1e9:-1;ns.forEach(n=>{const dd=hdist(n,from);const ax=Math.abs(n.r-from.r)+Math.abs(n.c-from.c);const sc=dd*10+(toward?ax*.1:-ax*.1);if(toward?(sc<bd):(sc>bd)){bd=sc;best=n;}});return best;}

 if(q.t==='b'&&!u.tr.nofire&&!u.tr.fly&&!u.tr.tunnel&&u.hp>0){u.hp=Math.max(0,u.hp-1);fxHit(u,1,{});if(u.hp<=0)await fallUnit(u,null);}
 if(q.trap&&u.side===1&&!u.tr.fly&&u.hp>0){q.trap=0;u.hp=Math.max(0,u.hp-5);fxHit(u,5,{});fxTag(u,'Pitfall!');sfx('thud');u.st.root=1;B.rev++;if(u.hp<=0)await fallUnit(u,null);}

async function pushUnit(att,t,n,toward){for(let i=0;i<n;i++){if(t.hp<=0)return;const nx=neighborAway(t,att,toward);if(!nx)return;const o=unitAt(nx.c,nx.r);if(o||BLOCK.indexOf(nx.t)>=0||nx.t==='k'){if(!toward){t.hp=Math.max(0,t.hp-2);fxHit(t,2,{});sfx('thud');if(o&&o.hp>0&&!o.captive){o.hp=Math.max(0,o.hp-1);fxHit(o,1,{});if(o.hp<=0)await fallUnit(o,att);}if(t.hp<=0)await fallUnit(t,att);}return;}

 if(s.tg==='self'){if(s.st&&!s.aoeFoe)applySt(u,s.st);if(s.ally1){nbrs(cell(u.c,u.r)).forEach(q=>{const o=unitAt(q.c,q.r);if(o&&sameTeam(o,u)&&!o.captive)o.st.guard1=2;});}

  if(s.rally){B.units.forEach(o=>{if(o.hp>0&&!o.gone&&!o.captive&&sameTeam(o,u)&&hdist(o,u)<=2){if(u.side===0)o.hp=Math.min(o.mhp,o.hp+3);o.st.rallyb=1;fxTag(o,'Rallied');}});sfx('horn');}

 if(s.tg==='ally'){await lunge(u,t);if(s.heal){t.hp=Math.min(t.mhp,t.hp+s.heal);fxHeal(t,s.heal);sfx('heal');}if(s.cure)delete t.st.poison;return;}
 if(s.tg==='cell'){await lunge(u,tgc);if(!FAST)await shot(u,tgc);const qs=[tgc].concat(s.aoe?nbrs(tgc):[]);

 if(!s.nodmg){const c=calcDmg(u,t,s.dm||0,s);const hpb=t.hp;await dealDamage(u,t,c.d,{ranged:s.r>1,skill:1});

/* ---- turn engine ---- */
async function tickFire(){const list=B.cells.filter(q=>q.fire);if(!list.length)return;const rng=srand(B.seed+B.turn*97);const add=[];
 list.forEach(q=>{nbrs(q).forEach(n=>{if(!n.fire&&(n.t==='f'||n.t==='b')&&rng()<.55)add.push(n);});});
 for(const q of list){q.fire--;if(q.fire<=0){q.fire=0;if(q.t==='f'||q.t==='b')q.t='m',q.burnt=1;}}
 add.forEach(q=>{q.fire=2;});B.rev++;
 for(const q of B.cells.filter(z=>z.fire)){const u=unitAt(q.c,q.r);if(u&&!u.tr.fly&&!u.tr.nofire){u.hp=Math.max(0,u.hp-2);fxHit(u,2,{});if(u.hp<=0)await fallUnit(u,null);}}}
async function startSide(side){const us=B.units.filter(u=>u.side===side&&u.hp>0&&!u.gone&&!u.captive);
 for(const u of us){for(const k in u.cd)if(u.cd[k]>0)u.cd[k]--;if(u.st.guard)u.st.guard--;if(u.st.guard1)u.st.guard1--;if(u.st.riposte)u.st.riposte--;delete u.st.rallyb;u.acted=false;u.moved=false;u.refunded=0;
  if(u.tr.regen&&u.hp<u.mhp){u.hp=Math.min(u.mhp,u.hp+u.tr.regen);fxHeal(u,u.tr.regen);}
  if(u.st.poison>0){u.st.poison--;u.hp=Math.max(0,u.hp-2);fxHit(u,2,{col:'#9dc34a'});if(u.hp<=0)await fallUnit(u,null);}}}
async function startPlayerTurn(){B.turn++;B.phase='player';G.stats.turns++;await startSide(0);
 B.units.forEach(u=>{if(u.side===0&&u.hp>0&&u.st.stun>0){u.st.stun--;u.acted=true;fxTag(u,'Stunned');}});
 if(B.turn===1&&G.build.perch>=2)B.units.forEach(u=>{if(u.side===0)u.mov+=1,u.perch1=1;});if(B.turn===2)B.units.forEach(u=>{if(u.perch1){u.mov-=1;u.perch1=0;}});
 const r=checkEnd();if(r){await endBattle(r);return;}
 if(!FAST)fxTurn('Your Turn '+B.turn);saveMid();}
async function runWaves(){for(const w of(B.spec.waves||[])){if(w[0]===B.turn&&!B.fired[w[0]]){B.fired[w[0]]=1;const ks=parseFoes(w[1]);const edge=B.cells.filter(q=>q.c>=B.w-2&&terrainOK(q)&&!unitAt(q.c,q.r)).sort(()=>Math.random()-.5);for(const k of ks){const q=edge.shift();if(!q)break;const u=mkFoe(k,B.spec.L);u.c=q.c;u.r=q.r;B.units.push(u);G.seen[k]=1;fxTag(u,'Reinforcement');}if(!FAST){sfx('horn');await pause(450);}}}}
function aiTargets(u){return B.units.filter(o=>o.side===0&&o.hp>0&&!o.gone);}
function aiScoreHit(u,from,t,bonus,sk){const ox=u.c,oy=u.r;u.c=from.c;u.r=from.r;const c=calcDmg(u,t,bonus,sk);u.c=ox;u.r=oy;let s=c.d*3;if(c.d>=t.hp)s+=25;s+=(1-t.hp/t.mhp)*6;if(t.k==='ysolde'||t.k==='bogle')s+=3;if(u.tr.stalk&&t.def<=1)s+=3;return s;}
function aiPlan(u){const rooted=u.st.root>0;const R=rooted?{cells:[cell(u.c,u.r)],path:q=>[q]}:reach(u);let best=null;const ts=aiTargets(u);if(!ts.length)return null;const goals=B.spec.obj.t==='hold'?B.goals:null;
 const usable=u.sk.filter(k=>!(u.cd[k]>0));
 R.cells.forEach(q=>{let pos=0;if(q.h)pos+=q.h*.8;if(q.t==='f')pos+=.8;if(q.t==='b'&&!u.tr.fly)pos-=4;if(q.fire)pos-=8;if(q.t==='w'&&!u.tr.fly)pos-=1;
  ts.forEach(t=>{const dd=hdist(q,t);if(dd<=u.rng){const sc=aiScoreHit(u,q,t,0)+pos+(u.rng>1&&dd===u.rng?1.5:0);if(!best||sc>best.s)best={s:sc,q,t,kind:'atk'};}
   usable.forEach(k=>{const s=SK[k];if(s.tg==='foe'&&dd<=s.r){const sc=aiScoreHit(u,q,t,s.dm||0,s)+pos+6;if(!best||sc>best.s)best={s:sc,q,t,kind:'sk',key:k};}});});
  if(usable.indexOf('fstink')>=0){const n=nbrs(q).filter(z=>{const o=unitAt(z.c,z.r);return o&&o.side===0;}).length;if(n>=1){const sc=n*7+pos+4;if(!best||sc>best.s)best={s:sc,q,kind:'self',key:'fstink'};}}
  if(usable.indexOf('ftorch')>=0){B.cells.forEach(z=>{if((z.t==='f'||z.t==='b')&&!z.fire&&hdist(q,z)<=3){const near=ts.reduce((m,t)=>Math.min(m,hdist(t,z)),9);if(near<=1){const sc=14-near*3+pos;if(!best||sc>best.s)best={s:sc,q,kind:'burn',key:'ftorch',z};}}});}
  if(goals&&!u.tr.fly){const on=goals.some(g=>g.c===q.c&&g.r===q.r);if(on){const sc=40;if(!best||sc>best.s)best={s:sc,q,kind:'goal'};}}
 });
 return{best,R};}
async function foeAct(u){if(u.hp<=0||u.gone)return;
 if(u.st.stun>0){u.st.stun--;fxTag(u,'Stunned');await pause(FAST?0:220);return;}
 if(u.sk.indexOf('frally')>=0&&!(u.cd.frally>0)){const near=B.units.filter(o=>o.side===1&&o!==u&&o.hp>0&&hdist(o,u)<=2).length;if(near>=1){await useSkill(u,'frally',cell(u.c,u.r));}}
 const P=aiPlan(u);if(!P){return;}const ts=aiTargets(u);let b=P.best;
 if(u.lazy&&!b&&!(B.turn>2)){return;}u.lazy=0;
 if(b&&b.q&&(b.q.c!==u.c||b.q.r!==u.r)){await walk(u,P.R.path(b.q));u.c=b.q.c;u.r=b.q.r;await moveEffects(u,b.q);if(u.hp<=0)return;}
 if(b){if(b.kind==='atk'){if(b.t.hp>0)await doAttack(u,b.t);}else if(b.kind==='sk'){if(b.t.hp>0)await useSkill(u,b.key,cell(b.t.c,b.t.r));}else if(b.kind==='self'){await useSkill(u,b.key,cell(u.c,u.r));}else if(b.kind==='burn'){await useSkill(u,'ftorch',b.z);}}
 else if(!(u.st.root>0)){/* advance */
  const goals=B.spec.obj.t==='hold'?B.goals:ts;let pick=null,pd=1e9;P.R.cells.forEach(q=>{let dd=1e9;goals.forEach(g=>{dd=Math.min(dd,hdist(q,g));});dd+=(q.t==='b'?1.5:0)+(q.fire?4:0);if(dd<pd){pd=dd;pick=q;}});
  if(pick&&(pick.c!==u.c||pick.r!==u.r)){await walk(u,P.R.path(pick));u.c=pick.c;u.r=pick.r;await moveEffects(u,pick);}}
 if(u.st.root>0)u.st.root--;}
async function foePhase(){B.phase='foe';B.units.forEach(u=>{if(u.side===0){delete u.st.rallyb;if(u.st.root>0)u.st.root--;}});let r=checkEnd();if(r){await endBattle(r);return;}
 if(!FAST)fxTurn('The Host moves');await startSide(1);await tickFire();r=checkEnd();if(r){await endBattle(r);return;}
 await runWaves();
 const foes=B.units.filter(u=>u.side===1&&u.hp>0);
 for(const u of foes){await waitUnpaused();if(!B)return;await foeAct(u);r=checkEnd();if(r){await endBattle(r);return;}if(!FAST)await pause(70);}
 if(B.spec.obj.t==='hold'){for(const g of B.goals){const o=unitAt(g.c,g.r);if(o&&o.side===1){B.gateHP--;fxTag(o,'The road is cut!');sfx('thud');}}if(B.gateHP<=0)B.gateLost=1;}
 r=checkEnd();if(r){await endBattle(r);return;}
 await startPlayerTurn();}

/* ===== Diorama renderer ===== */
const SQ=.62;let cv,ctx,W=1180,H=820,DP=1,R=46,OX=0,OY=0,HH=13,boardC=null,boardRev=-1,running=false,lastT=0,PAUSED=false,shake=0,UIS=null;
const tweens=[],floats=[],parts=[],bursts=[];let banner=null,fxList=[];
const decorC={};function season(){return SEASON[B?(B.chapter||0)%5:0];}
function sizeCanvas(){W=innerWidth;H=innerHeight;DP=Math.min(window.devicePixelRatio||1,1.6);cv.width=W*DP|0;cv.height=H*DP|0;cv.style.width=W+'px';cv.style.height=H+'px';if(B)layoutBoard();}
function layoutBoard(){const top=62,bot=138;const aw=W-30,ah=H-top-bot;const rw=aw/(1.5*(B.w-1)+2),rh=ah/((B.h+.5)*1.732*SQ+1.75);R=Math.min(rw,rh,62);HH=R*.28;
 const bw=(1.5*(B.w-1)+2)*R,bh=(B.h+.5)*1.732*R*SQ;OX=(W-bw)/2+R;OY=top+R*1.5+Math.max(0,(ah-bh-R*1.75)/2);boardRev=-1;for(const k in decorC)delete decorC[k];}
function hexXY(c,r){return[OX+c*1.5*R,OY+(r+(c&1)*.5)*1.732*R*SQ];}
function cellXY(q){const p=hexXY(q.c,q.r);return[p[0],p[1]-q.h*HH];}
function hexPath(g,x,y,rr,sq){const s=sq==null?SQ:sq;g.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr*s;i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();}
function pickCell(px,py){let best=null,bd=1e9;B.cells.forEach(q=>{const[x,y]=cellXY(q);const dx=(px-x)/R,dy=(py-y)/(R*SQ);const d=dx*dx+dy*dy;if(d<bd){bd=d;best=q;}});return bd<1.25?best:null;}

function paintScene(cvs,sidx,opts){opts=opts||{};const dp=Math.min(window.devicePixelRatio||1,1.5),w=innerWidth,h=innerHeight;cvs.width=w*dp;cvs.height=h*dp;const g=cvs.getContext('2d');g.scale(dp,dp);const s=SEASON[sidx];const rg=srand(sidx*13+5);
 const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,s.sky[0]);sky.addColorStop(.7,s.sky[1]);g.fillStyle=sky;g.fillRect(0,0,w,h);
 g.globalAlpha=.5;g.fillStyle='#fff8e4';for(let i=0;i<7;i++){const x=rg()*w,y=rg()*h*.26+14;for(let k=0;k<6;k++){g.beginPath();g.ellipse(x+k*26-60,y+rg()*9,34+rg()*20,10+rg()*7,0,0,TAU);g.fill();}}g.globalAlpha=1;
 const hill=(y0,amp,col,al)=>{g.globalAlpha=al;g.fillStyle=col;g.beginPath();g.moveTo(0,h);g.lineTo(0,y0);let x=0;while(x<w){const st=70+rg()*90;g.quadraticCurveTo(x+st/2,y0-amp*(.4+rg()),x+st,y0+(rg()-.5)*amp*.5);x+=st;}g.lineTo(w,h);g.closePath();g.fill();g.globalAlpha=1;};
 hill(h*.3,30,shade(s.leaf,.3),.55);hill(h*.37,26,shade(s.moss,.1),.8);
 // the Hedge itself, lumpy and leafy
 const hy=opts.hedgeY||h*.47;const bump=[];let x=-20;while(x<w+30){const r=26+rg()*30;bump.push([x,hy-r*.3,r]);x+=r*1.05;}
 g.fillStyle=shade(s.leaf,-.45);g.strokeStyle=INK;g.lineWidth=2.4;g.beginPath();g.moveTo(-30,h);bump.forEach(b=>g.lineTo(b[0],b[1]-b[2]*.6));g.lineTo(w+30,h);g.closePath();g.fill();
 bump.forEach(b=>{g.beginPath();g.ellipse(b[0],b[1],b[2]*1.1,b[2]*.9,0,0,TAU);g.fillStyle=shade(s.leaf,-.3);g.fill();g.stroke();});
 for(let i=0;i<1400;i++){const b=bump[rg()*bump.length|0],a=rg()*TAU,rr=rg()*b[2];const px=b[0]+Math.cos(a)*rr*1.1,py=b[1]+Math.sin(a)*rr*.9;const tone=rg();g.fillStyle=tone<.4?shade(s.leaf,-.18):tone<.8?s.leaf:shade(s.leaf,.22);g.beginPath();g.ellipse(px,py,3+rg()*3.4,1.6+rg()*1.6,rg()*3,0,TAU);g.fill();}
 for(let i=0;i<46;i++){const b=bump[rg()*bump.length|0];g.fillStyle=sidx===3?'#fff':s.bloom;g.beginPath();g.arc(b[0]+(rg()-.5)*b[2]*1.5,b[1]+(rg()-.5)*b[2],sidx===3?4:2.2,0,TAU);g.fill();}
 if(sidx===3){g.fillStyle='#f4f7f8';bump.forEach(b=>{g.beginPath();g.ellipse(b[0],b[1]-b[2]*.55,b[2]*.9,b[2]*.32,0,0,TAU);g.fill();});}
 const gr=g.createLinearGradient(0,hy,0,h);gr.addColorStop(0,s.moss);gr.addColorStop(1,s.moss2);g.fillStyle=gr;g.fillRect(0,hy+16,w,h-hy);
 g.strokeStyle=INK;g.lineWidth=2;g.beginPath();g.moveTo(0,hy+16);g.lineTo(w,hy+16);g.stroke();
 g.lineCap='round';for(let i=0;i<1100;i++){const px=rg()*w,py=hy+18+rg()*(h-hy);g.strokeStyle=rg()<.5?shade(s.moss2,-.2):shade(s.moss,.25);g.lineWidth=1;g.beginPath();g.moveTo(px,py);g.lineTo(px+(rg()-.5)*3,py-4-rg()*5);g.stroke();}
 if(opts.path){const P=opts.path;g.strokeStyle='#5a3d1e';g.lineWidth=3.2;g.setLineDash([2,10]);g.beginPath();P.forEach((p,i)=>{const a=p[0]*w,b=p[1]*h;if(!i)g.moveTo(a,b);else{const q=P[i-1];g.quadraticCurveTo((q[0]*w+a)/2,(q[1]*h+b)/2+(i%2?22:-22),a,b);}});g.stroke();g.setLineDash([]);}
 return g;}

ACT.howT=()=>howTo('toTitleBack');ACT.setT=()=>settings('toTitleBack');ACT.toTitleBack=()=>{closeOv();};
function howTo(){overlay('<h2>How the Watch fights</h2><div class="scroll"><p><b>Your turn.</b> Tap a fighter. Pale hexes show where they can go. Tap one to move, then tap a red-marked foe to see the damage, and tap again (or press Confirm) to strike. Each fighter moves once and acts once. Press the horn to end your turn.</p><p><b>Flank.</b> Every ally beside your target adds +1 damage, up to +2. High ground adds +1. Ferns give armor against arrows. Foes hiding in ferns cannot be seen until you are close.</p><p><b>Skills.</b> Tap a skill on the bottom strip, then its target. Skills need a few turns to return. Dashes do not use up your action.</p><p><b>Ground.</b> Mud, snow, water and climbing cost extra move. Bramble scratches. Fire spreads through ferns and bramble. A shove on ice keeps sliding. Shoving someone into a rock or a friend hurts them.</p><p><b>Leaf seals.</b> One for winning, one if nobody falls, one for winning within the par turns. Battles can be replayed for seed and experience.</p><p><b>Camp.</b> Spend hazelnuts on buildings and goods. Each fighter picks talents at levels 3, 6 and 9, and a third skill arrives at level 5.</p><p><b>Tap a foe</b> at any time to see how far it can reach.</p></div><button class="tag" data-a="closeOv">'+ic('close',18)+'<span>Close</span></button>');}

/* ---- campaign map ---- */
const NODEPOS=[[.09,.62],[.2,.78],[.31,.6],[.42,.76],[.53,.58],[.64,.74],[.76,.57],[.89,.7]];
function chapterOpen(i){if(i===0)return true;const prev=CH[i-1].filter(n=>!n.side);return !!G.done[prev[prev.length-1].id];}
function nodeOpen(ch,n){if(n.side)return !!G.done[n.after];const st=CH[ch].filter(x=>!x.side);const i=st.indexOf(n);if(i===0)return chapterOpen(ch);return !!G.done[st[i-1].id];}
function toMap(ch){stopLoop();B=null;closeOv();PAUSED=false;if(ch==null)ch=G.lastCh||0;ch=Math.min(ch,CH.length-1);G.lastCh=ch;setMusic(SEASON[ch].mus[(ch+1)%2]);setPauseBtn(true);
 const st=CH[ch].filter(x=>!x.side),side=CH[ch].filter(x=>x.side);const pts=st.map((_,i)=>NODEPOS[Math.round(i*(NODEPOS.length-1)/(st.length-1))]);
 let tabs='';CH.forEach((_,i)=>{const op=chapterOpen(i);tabs+='<button class="stab'+(i===ch?' on':'')+'"'+(op?' data-a="mapTo" data-v="'+i+'"':' disabled')+'>'+SEASON[i].n+'</button>';});
 let nodes='';st.forEach((n,i)=>{const p=pts[i],op=nodeOpen(ch,n),d=G.done[n.id];const boss=n.boss?' boss':'';nodes+='<button class="node'+boss+(d?' done':'')+(op?'':' lock')+'" style="left:'+p[0]*100+'%;top:'+p[1]*100+'%"'+(op?' data-a="nodeS" data-v="'+n.id+'"':' disabled')+'><span class="nn">'+(n.boss?ic('flag',26):i+1)+'</span>'+(d?'<span class="sl">'+seals(d.stars,12)+'</span>':'')+'</button>';});
 side.forEach((n,i)=>{const op=nodeOpen(ch,n),d=G.done[n.id];const x=.14+i*.5,y=.43;nodes+='<button class="node side'+(d?' done':'')+(op?'':' lock')+'" style="left:'+((.26+i*.38)*100)+'%;top:'+y*100+'%"'+(op?' data-a="nodeS" data-v="'+n.id+'"':' disabled')+'><span class="nn">'+ic('nut',22)+'</span>'+(d?'<span class="sl">'+seals(d.stars,10)+'</span>':'')+'</button>';});
 const allow=!!G.done.u8;
 show('<canvas id="sceneC" class="bgc"></canvas><div class="mapTop"><div class="stabs">'+tabs+'</div>'+nutsTag()+'</div><div class="mapHead"><h2>'+SEASON[ch].n+'</h2><p class="ital">'+SEASON[ch].sub+'</p></div>'+nodes+'<div class="mapBot"><button class="tag" data-a="camp">'+ic('camp',22)+'<span>Camp</span>'+(campNote()?'':'')+'</button><button class="tag" data-a="roster">'+ic('crew',22)+'<span>Company</span>'+(talentPending()?'<i class="pip"></i>':'')+'</button><button class="tag" data-a="journal">'+ic('book',22)+'<span>Field Book</span></button>'+(allow?'<button class="tag" data-a="endless">'+ic('map',22)+'<span>The Long Hedge</span></button>':'')+'</div>','map');
 paintScene($('sceneC'),ch,{hedgeY:innerHeight*.28,path:pts});saveGame();}
function campNote(){return false;}
function talentPending(){return HERO_ORDER.some(id=>G.heroes[id].own&&talTier(id)>=0);}
function talTier(id){const h=G.heroes[id];for(let i=0;i<3;i++){if(h.lvl>=[3,6,9][i]&&h.tal[i]==null)return i;}return -1;}
function seals(n,s){let o='';for(let i=0;i<3;i++)o+=ic('seal',s||14,i<n?'#6f9a3f':'#00000030');return o;}
ACT.mapTo=v=>toMap(+v);
function findNode(id){for(let c=0;c<CH.length;c++){const n=CH[c].find(x=>x.id===id);if(n)return Object.assign({ch:c},n);}return null;}
function foeRow(n){const ks=parseFoes(n.foes);if(n.boss)ks.unshift(n.boss);const uniq={};ks.forEach(k=>uniq[k]=(uniq[k]||0)+1);return Object.keys(uniq).map(k=>'<div class="fc">'+fig(FOE[k].sp||k,70)+'<small>'+FOE[k].n+(uniq[k]>1?' x'+uniq[k]:'')+'</small></div>').join('');}
ACT.nodeS=id=>{const n=findNode(id),d=G.done[id];const o=n.obj;const obj={rout:'Drive every foe from the field',boss:'Defeat their leader',hold:'Keep foes off the gold ground for '+o.n+' turns',escape:'Get everyone to the far side',rescue:G.heroes[o.who]&&G.heroes[o.who].own?'Drive every foe from the field':'Reach the captive, then clear the field',survive:'Hold out for '+o.n+' turns',cache:'Gather '+o.n+' stores'}[o.t];
 overlay('<h2>'+n.n+'</h2><p class="ital">'+obj+'</p><div class="frow">'+foeRow(n)+'</div><p class="sm">Foe strength '+n.L+'. Par '+n.par+' turns. '+(d?'Best: '+seals(d.stars):'')+(n.recruit&&!G.heroes[n.recruit].own?' A new fighter may join.':'')+'</p><div class="btnr"><button class="tag" data-a="closeOv">'+ic('close',18)+'<span>Close</span></button><button class="tag pri" data-a="march" data-v="'+id+'">'+ic('flag',20)+'<span>March</span></button></div>');};
ACT.march=id=>{closeOv();startNode(id);};
function startNode(id){const n=findNode(id);UI.node=n;UI.run=null;if(n.pre&&!G.done[id])playDialog(n.pre,n.ch,()=>toDeploy(n));else toDeploy(n);}
/* ---- dialogue ---- */
function playDialog(lines,ch,cb){let i=0;hideScr();$('hud').style.display='none';setPauseBtn(true);const d=$('dlg');d.style.display='block';d.innerHTML='';const sc0=dlgScene(ch||0);
 const figs={};const step=()=>{if(i>=lines.length){d.style.display='none';d.innerHTML='';cb();return;}const[who,t]=lines[i];const sp=DS[who]||'pip';const left=(who==='Sloe'||who==='Sloughskin'||who==='Reeve'||who==='Queen'||who==='Gulo');
  d.innerHTML='';d.appendChild(sc0);d.insertAdjacentHTML('beforeend','<div class="dfig'+(left?' r':'')+'">'+fig(sp,Math.min(innerHeight-200,640)*1.2,0,1)+'</div><div class="dbox"><b>'+who.replace('Ysolde','Mother Ysolde')+'</b><p>'+t+'</p><div class="dbtn"><button class="tag" data-a="dlgSkip">'+ic('close',16)+'<span>Skip</span></button><button class="tag pri" data-a="dlgNext"><span>Next</span>'+ic('up',16)+'</button></div></div>');const slot=d.querySelector('.dfig canvas');if(figs[sp]){slot.replaceWith(figs[sp]);}else{hydrate(d);const ks=Object.keys(figs);if(ks.length>=3)delete figs[ks[0]];figs[sp]=slot;}};
 ACT.dlgNext=()=>{i++;step();};ACT.dlgSkip=()=>{i=lines.length;step();};step();}
function playChoice(c,ch,cb){const d=$('dlg');d.style.display='block';setPauseBtn(true);d.innerHTML='';d.appendChild(dlgScene(ch));d.insertAdjacentHTML('beforeend','<div class="dbox choice"><b>A choice</b><p>'+c.q+'</p>'+c.a.map((a,i)=>'<button class="row" data-a="pick" data-v="'+i+'"><b>'+a.t+'</b></button>').join('')+'</div>');
 ACT.pick=v=>{const a=c.a[+v];G.mercy+=a.m||0;if(a.nuts)G.nuts+=a.nuts;if(a.rec)recruit(a.rec);saveGame();d.style.display='none';d.innerHTML='';if(a.r)playDialog(a.r,ch,cb);else cb();};}
function dlgScene(ch){const c=document.createElement('canvas');c.className='bgc';paintScene(c,ch,{hedgeY:innerHeight*.52});return c;}
function recruit(id){const h=G.heroes[id];if(h.own)return;h.own=1;const own=HERO_ORDER.filter(k=>G.heroes[k].own&&k!==id).map(k=>G.heroes[k].lvl);const avg=Math.round(own.reduce((a,b)=>a+b,0)/Math.max(1,own.length));h.lvl=Math.max(h.lvl,Math.max(1,avg-1));}
/* ---- deploy ---- */
function slots(){return 4+G.build.banner;}
function toDeploy(n,endless){const forced=n.team;let sel=forced?forced.slice():(G.party||[]).filter(k=>G.heroes[k].own&&!G.heroes[k].wound);const cap=forced?forced.length:slots();sel=sel.slice(0,cap);HERO_ORDER.forEach(k=>{if(!forced&&sel.length<cap&&G.heroes[k].own&&!G.heroes[k].wound&&sel.indexOf(k)<0)sel.push(k);});
 if(!sel.length){HERO_ORDER.forEach(k=>{if(G.heroes[k].own){G.heroes[k].wound=0;if(sel.length<cap)sel.push(k);}});}
 UI.sel=sel;UI.dnode=n;UI.dforced=forced;UI.dcap=cap;drawDeploy();}
function drawDeploy(){const n=UI.dnode;setPauseBtn(true);let h='';HERO_ORDER.forEach(k=>{const a=G.heroes[k];if(!a.own)return;const on=UI.sel.indexOf(k)>=0,dis=UI.dforced||a.wound;const s=heroStats(k);h+='<button class="hcard'+(on?' on':'')+(a.wound?' hurt':'')+'" '+(dis?'disabled':'data-a="dpk" data-v="'+k+'"')+'>'+fig(HERO[k].sp,104)+'<b>'+HERO[k].n.split(' ')[0]+'</b><small>'+HERO[k].role+' L'+a.lvl+'</small>'+(a.wound?'<em>Wounded</em>':'')+(on?'<i class="chk">'+ic('check',18)+'</i>':'')+'</button>';});
 show('<div class="paper"><div class="bar">'+backBtn('dpBack','Map')+'<div class="grow"><h2>'+n.n+'</h2><p>Choose '+UI.dcap+' fighters for the field. '+UI.sel.length+' of '+UI.dcap+' chosen.</p></div><button class="tag pri big" data-a="dpGo"'+(UI.sel.length?'':' disabled')+'>'+ic('flag',20)+'<span>To the Field</span></button></div><div class="hgrid">'+h+'</div></div>');setPauseBtn(false);}
ACT.dpk=k=>{const i=UI.sel.indexOf(k);if(i>=0)UI.sel.splice(i,1);else if(UI.sel.length<UI.dcap)UI.sel.push(k);else{UI.sel.pop();UI.sel.push(k);}drawDeploy();};
ACT.dpBack=()=>{if(UI.run){endRunToMap();return;}toMap(UI.dnode.ch);};
ACT.dpGo=()=>{if(!UI.dforced)G.party=UI.sel.slice();enterBattle(UI.dnode,UI.sel);};
/* ---- battle shell ---- */
function enterBattle(n,party){hideScr();closeOv();const boons=UI.run?UI.run.boons:null;clearSprites();B=setupBattle(n,party,boons);B.chapter=n.ch||0;afterSetup();saveMid();}
function afterSetup(){$('hud').style.display='block';setPauseBtn(true);layoutBoard();initParts();UIS={mode:'idle'};PAUSED=false;setMusic(curMusic());B.rev++;
 B.units.forEach(u=>{spr(u.sp,0);spr(u.sp,1);});
 if(B.phase==='deploy'){UIS.spawn=B.spawnC.map(p=>cell(p.c,p.r));UIS.mode='deploy';}startLoop();renderHud();}
function saveMid(){if(!B)return;try{G.mid={B:JSON.parse(JSON.stringify(B)),run:UI.run,dn:UI.dnode?{id:UI.dnode.id}:null};saveGame();}catch(e){}}
function resumeMid(){const m=G.mid;hideScr();closeOv();clearSprites();B=m.B;UI.run=m.run||null;UI.node=B.spec.id?findNode(B.spec.id):null;UI.dnode=UI.node||{ch:B.chapter};UIS=null;B.units.forEach(u=>{u.vx=null;u.vy=null;u.ax=0;u.ay=0;u.pose=0;u.dying=0;});if(B.phase==='foe')B.phase='player';afterSetup();}
function renderHud(){if(!B)return;$('objT').textContent=objText();$('turnT').textContent=B.phase==='deploy'?'Deploy':'Turn '+B.turn;renderPanel();}
function hudBtn(a,v,cls,inner,dis){return'<button class="sb '+(cls||'')+'" data-a="'+a+'"'+(v!=null?' data-v="'+v+'"':'')+(dis?' disabled':'')+'>'+inner+'</button>';}
function statStrip(u){return'<div class="sts"><span>'+ic('blade',16)+u.atk+'</span><span>'+ic('shield',16)+u.def+'</span><span>'+ic('boot',16)+u.mov+'</span><span>'+ic('arrow',16)+u.rng+'</span></div>';}
function stNote(u){const a=[];if(u.st.poison)a.push('poisoned');if(u.st.stun)a.push('stunned');if(u.st.root)a.push('tied up');if(u.st.guard||u.st.guard1)a.push('guarded');if(u.st.riposte)a.push('riposte');if(u.st.rallyb)a.push('rallied');return a.join(', ');}
function renderPanel(){const p=$('panel');const u=UIS&&(UIS.sel||UIS.info);const eb=$('endT');
 if(B.phase==='deploy'){eb.innerHTML=ic('flag',30)+'<span>Begin</span>';eb.disabled=false;eb.classList.remove('pulse');p.innerHTML='<div class="hint"><b>Set your line.</b> Tap a fighter, then a blue hex to place them. Then press Begin.</div><div class="acts">'+hudBtn('dpBackB',null,'',ic('back',18)+'<span>Change company</span>')+'</div>';if(UIS.sel){}hydrate(p);return;}
 eb.innerHTML=ic('horn',30)+'<span>End Turn</span>';eb.disabled=B.phase!=='player'||UI.busy;const allDone=B.phase==='player'&&!B.units.some(x=>x.side===0&&x.hp>0&&!x.gone&&!x.acted);eb.classList.toggle('pulse',allDone);
 if(B.phase!=='player'&&!u){p.innerHTML='<div class="hint ital">The Host is moving...</div>';return;}
 if(!u){p.innerHTML='<div class="hint"><b>Your move.</b> Tap a fighter to act. Tap a foe to see its reach.</div>';return;}
 const isFoe=u.side===1;const pct=Math.round(100*u.hp/u.mhp);let h='<div class="pfig">'+fig(u.sp,190)+'</div><div class="pinfo"><b>'+u.name+'</b> <small>'+(isFoe?(FOE[u.k]?'Level '+u.lvl:''):HERO[u.k].role+' L'+u.lvl)+'</small><div class="hbar"><i class="'+(isFoe?'f':'')+'" style="width:'+pct+'%"></i><em>'+u.hp+' / '+u.mhp+'</em></div>'+statStrip(u)+(stNote(u)?'<small class="note">'+stNote(u)+'</small>':'')+'</div>';

async function onBoardTap(px,py){if(!B||PAUSED||UI.busy)return;const q=pickCell(px,py);
 if(B.phase==='deploy'){if(!q)return;const o=unitAt(q.c,q.r);if(UIS.sel&&inList(UIS.spawn,q)){const su=UIS.sel;if(o&&o!==su){o.c=su.c;o.r=su.r;}su.c=q.c;su.r=q.r;UIS.sel=null;sfx('tap');renderPanel();return;}if(o&&o.side===0){UIS.sel=o;sfx('tap');renderPanel();}return;}
 if(B.phase!=='player')return;if(!q){if(UIS.mode==='sel'||UIS.mode==='idle')clearSel();return;}
 let o=unitAt(q.c,q.r);if(o&&isHidden(o))o=null;const m=UIS.mode;
 if(m==='skill'){if(UIS.pending===q){await doConfirm();return;}if(inList(UIS.tgt,q)||inList(UIS.help,q)||inList(UIS.cellt,q)){UIS.pending=q;sfx('tap');renderPanel();return;}cancelSkill();return;}

  if(inList(UIS.tgt,q)){UIS.pending=q;sfx('tap');renderPanel();return;}

  if(o&&o.side===0&&!o.acted){selectUnit(o);sfx('tap');return;}if(o&&(o.side===1||o.captive)){showThreat(o);return;}clearSel();return;}
 if(o&&o.side===0&&!o.gone){selectUnit(o);sfx('tap');return;}if(o&&(o.side===1||o.captive)){showThreat(o);return;}clearSel();}
function showThreat(o,keep){if(o.captive){UIS={mode:'idle',info:o};renderPanel();return;}const rc=(o.st.root?{cells:[cell(o.c,o.r)]}:reach(o));const seen={};const th=[];rc.cells.forEach(q=>{B.cells.forEach(z=>{if(hdist(q,z)<=o.rng){const k=z.r*B.w+z.c;if(!seen[k]){seen[k]=1;th.push(z);}}});});if(keep){UIS.info=null;return;}UIS={mode:'idle',info:o,threat:th};renderPanel();}

 show('<div class="paper"><div class="bar">'+backBtn('roster','Company')+'<div class="grow"><h2>'+H0.n+'</h2><p>'+H0.sh+', '+H0.role+'. Level '+a.lvl+(a.lvl<20?', '+a.xp+' of '+xpNeed(a.lvl)+' to next':'')+'</p></div></div><div class="hpg"><div class="hl">'+fig(H0.sp,330,0,1)+'<p class="ital">'+H0.bio+'</p><p class="sm"><b>'+H0.pas.split(':')[0]+':</b>'+H0.pas.split(':')[1]+'</p><div class="sts lg"><span>'+ic('heart',20)+s.hp+'</span><span>'+ic('blade',20)+s.atk+'</span><span>'+ic('shield',20)+s.def+'</span><span>'+ic('boot',20)+s.mov+'</span><span>'+ic('arrow',20)+s.rng+'</span></div></div><div class="hr"><h3>Skills</h3>'+sk+'<h3>Talents</h3>'+tl+'<h3>Gear</h3><div class="gr">'+gear+'</div></div></div></div>');setPauseBtn(false);};
function talDesc(m){const o=[];if(m.sk){const n=SK[m.sk].n;if(m.cd)o.push(n+' returns '+(-m.cd)+' sooner');if(m.dm)o.push(n+' +'+m.dm+' damage');if(m.heal)o.push(n+' +'+m.heal+' healing');}['hp','atk','def','mov','rng'].forEach(k=>{if(m[k])o.push('+'+m[k]+' '+{hp:'health',atk:'attack',def:'armor',mov:'move',rng:'range'}[k]);});if(m.bristle)o.push('Bristle +'+m.bristle);return o.join(', ');}
ACT.tal=v=>{const[i,j]=v.split('_').map(Number);G.heroes[UI.hero].tal[i]=j;sfx('level');saveGame();ACT.hero(UI.hero);};

ACT.uneq=i=>{const a=G.heroes[UI.hero];const k=a.items[+i];if(k){G.inv.push(k);a.items[+i]=null;a.items=a.items.map(x=>x||null);}a.items=a.items.filter((x,idx)=>x||idx<2);saveGame();closeOv();ACT.hero(UI.hero);};

ACT.journal=v=>{const tab=v||'foes';let body='';if(tab==='foes'){body='<div class="hgrid">'+Object.keys(FOE).filter(k=>G.seen[k]).map(k=>'<button class="hcard" data-a="foeD" data-v="'+k+'">'+fig(FOE[k].sp||k,120)+'<b>'+FOE[k].n+'</b></button>').join('')+'</div>'+(Object.keys(FOE).some(k=>G.seen[k])?'':'<p class="ital">No foes noted yet.</p>');}
 else if(tab==='notes'){const reach=CH.reduce((m,_,i)=>chapterOpen(i)?i:m,0);body='<div class="notes">'+LORE.filter(l=>l.ch<=reach).map(l=>'<div class="nt"><b>'+l.n+'</b><p>'+l.t+'</p></div>').join('')+'</div>';}
 else{const st=G.stats;const tot=Object.keys(G.done).length,all=CH.reduce((a,c)=>a+c.length,0),seal=Object.values(G.done).reduce((a,d)=>a+d.stars,0);body='<div class="notes"><div class="nt"><b>Battles won</b><p>'+st.wins+' won, '+st.losses+' lost</p></div><div class="nt"><b>Foes defeated</b><p>'+st.kills+'</p></div><div class="nt"><b>Fighters fallen</b><p>'+st.fallen+'</p></div><div class="nt"><b>Turns played</b><p>'+st.turns+'</p></div><div class="nt"><b>Fields cleared</b><p>'+tot+' of '+all+'</p></div><div class="nt"><b>Leaf seals</b><p>'+seal+' of '+all*3+'</p></div><div class="nt"><b>Long Hedge record</b><p>Field '+(G.best||0)+'</p></div><div class="nt"><b>Endings seen</b><p>'+Object.keys(G.endings||{}).length+' of 3</p></div></div>';}
 show('<div class="paper"><div class="bar">'+backBtn('mapBack','Map')+'<div class="grow"><h2>Field Book</h2></div><div class="stabs in">'+[['foes','Foes'],['notes','Notes'],['rec','Record']].map(a=>'<button class="stab'+(a[0]===tab?' on':'')+'" data-a="journal" data-v="'+a[0]+'">'+a[1]+'</button>').join('')+'</div></div><div class="jbody">'+body+'</div></div>');setPauseBtn(false);};

/* ---- the Long Hedge ---- */
ACT.endless=()=>{overlay('<h2>The Long Hedge</h2><p class="ital">Field after field with no way home but forward. Each cleared field grants a boon for this walk. Foes never stop getting stronger.</p><p class="sm">Record: field '+(G.best||0)+'</p><div class="btnr"><button class="tag" data-a="closeOv">'+ic('close',18)+'<span>Close</span></button><button class="tag pri" data-a="endGo">'+ic('flag',18)+'<span>Walk it</span></button></div>');};
ACT.endGo=()=>{closeOv();UI.run={floor:1,boons:[],nuts:0};toDeploy(endlessSpec(1));};
function endlessSpec(f){const avg=HERO_ORDER.filter(k=>G.heroes[k].own).reduce((a,k,_,arr)=>a+G.heroes[k].lvl/arr.length,0);const L=Math.max(3,Math.round(avg-2+f*.7));const rg=srand(f*91+(G.stats.turns%1000));const pool=['rat','ratsling','weasel','stoat','crow','adder','polecat','sergeant','ermine','torch'].filter((k,i)=>i<4+f);const n=4+Math.min(5,(f/2)|0);const foes=[];for(let i=0;i<n;i++)foes.push(pool[rg()*pool.length|0]);const ch=(f-1)%5;const obj=f%5===0?{t:'boss'}:(f%3===0?{t:'cache',n:3}:{t:'rout'});const bossK=['sloe','sloughskin','reeve','wolverine','ermengard'][(f/5-1)%5|0];const snow=ch===3;return{id:'end'+f+'_'+(G.stats.turns%1000),n:'The Long Hedge: field '+f,L,foes:foes.join(','),boss:obj.t==='boss'?bossK:null,obj,par:9,ch,snow,endless:1,mix:snow?{n:.3,i:.08,s:.06}:{f:.18+rg()*.1,s:.06,x:.04,d:.06}};}
function endlessResult(win){G.mid=null;const f=UI.run.floor;if(!win)__mgt('e','The Long Hedge',f-1);if(!win){if(f-1>G.best)G.best=f-1;saveGame();sfx('lose');overlay('<h2>The walk ends</h2><p class="ital">You cleared '+(f-1)+' field'+(f===2?'':'s')+' of the Long Hedge.</p><p class="sm">Record: field '+G.best+'</p><button class="tag pri big" data-a="resRunEnd"><span>Back to the map</span></button>');return;}
 if(f>G.best)G.best=f;const nuts=Math.round((40+f*14)*(1+G.build.store*.25));G.nuts+=nuts;UI.run.nuts+=nuts;const xp=Math.round(20+B.spec.L*4);B.units.forEach(u=>{if(u.side===0)awardXP(u.k,xp);});saveGame();sfx('win');const rg=srand(f*53+G.stats.turns);const opts=BOONS.slice().sort(()=>rg()-.5).slice(0,3);UI.boonOpts=opts;overlay('<h2>Field '+f+' cleared</h2><div class="nuts c">'+ic('nut',24)+'<b>+'+nuts+'</b></div><p class="ital">Take one for the road:</p>'+opts.map((b,i)=>'<button class="row" data-a="boon" data-v="'+i+'"><b>'+b.n+'</b><span>'+b.d+'</span></button>').join('')+'<button class="tag" data-a="resRunEnd">'+ic('map',18)+'<span>End the walk here</span></button>');}
ACT.boon=v=>{const b=UI.boonOpts[+v];if(b.m)UI.run.boons.push({m:b.m});if(b.nuts)G.nuts+=b.nuts;UI.run.floor++;closeOv();stopLoop();const party=B.units.filter(u=>u.side===0).map(u=>u.k);B=null;enterBattle(endlessSpec(UI.run.floor),party);saveGame();};

 cv.addEventListener('pointerup',e=>{initAudio();onBoardTap(e.clientX,e.clientY);});
