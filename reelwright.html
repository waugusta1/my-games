function newRun(gear){const bag=['coin','cherry','pearl','flower','cat'];if(gear>=3)bag.push('rust');if(gear>=5)bag.push('rust');const r={gear,bag:bag.map(id=>({id,u:Math.random().toString(36).slice(2,9),c:0,v:0})),coins:1,toll:0,left:TOLLS[0][1]+0,spins:0,pins:1,rer:1,charms:[],grid:Array(20).fill(null),phase:'spin',last:0,best:0};for(const x of bag)disc(x);return r;}

function tollAmt(r,i){return Math.round(TOLLS[i][0]*(1+.6*i/11)*(1+.2*r.gear*(.1+.9*i/11)));}
function hasC(k){return R_.charms.includes(k);}
function luck(){return(R_.bag.filter(b=>b.id==='clover').length)+(hasC('rabbit')?2:0);}
function nb(i){const c=i%5,r=Math.floor(i/5),o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=c+dx,y=r+dy;if(x>=0&&x<5&&y>=0&&y<4)o.push(y*5+x);}return o;}

 // phase B: base values and adds
 for(let i=0;i<20;i++){const s=ids[i];if(s==='empty'){val[i]=hasC('shrink')?1:0;continue;}if(destroy.has(i)&&s!=='key'&&s!=='hammer'&&!(s==='chest'&&hasC('sparekey')&&!ids.some((x,j)=>x==='key'&&nb(j).includes(i)))){val[i]=0;continue;}
  let v=SY[s].b+(G[i].v||0);
  if(s==='coin'&&hasC('penny'))v+=2;if((s==='bee'||s==='hive'||s==='honey')&&hasC('queen'))v+=1;if((s==='milk'||s==='cat')&&hasC('jug'))v+=2;if(s==='flower'&&hasC('thumb'))v+=1;if(s==='gem'&&hasC('leaf'))v+=2;if(s==='pearl'&&hasC('leaf'))v+=1;
  if(s==='cherry')for(const j of nb(i))if(ids[j]==='cherry'){v+=1;}
  if(s==='bee')for(const j of nb(i))if(ids[j]==='flower'){v+=1;links.push([j,i]);}
  if(s==='dog')for(const j of nb(i))if(ids[j]==='cat'){v+=2;links.push([j,i]);}
  if(s==='diamond')v+=count('diamond')-1;
  if(s==='dice')v=rint(1,6);

 // neighbor boosts
 for(let i=0;i<20;i++){const s=ids[i];
  if(s==='cloud')for(const j of nb(i))if(ids[j]==='flower'){val[j]+=2;links.push([i,j]);}
  if(s==='clock')for(const j of nb(i))if(ids[j]!=='empty'){val[j]+=1;links.push([i,j]);}
  if(s==='bee')for(const j of nb(i))if(['flower','hive','honey'].includes(ids[j])){mul[j]*=2;links.push([i,j]);}
  if(s==='sun')for(const j of nb(i))if(ids[j]==='flower'){mul[j]*=5;links.push([i,j]);}

  if(s==='crown')for(const j of nb(i))if(['coin','gem','pearl'].includes(ids[j])){mul[j]*=3;links.push([i,j]);}}
