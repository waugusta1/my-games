:root{--bone:#ece2c8;--bone2:#c9bc9a;--stone:#2a2523;--stone2:#3a3330;--ink:#120e0d;--rune:#6fe3d0;--blood:#b3262a;--gold:#e2b84c;--ember:#ec8a3a;--cap:Copperplate,"Copperplate Gothic Light","Trajan Pro",Georgia,serif;--body:Optima,"Avenir Next","Segoe UI",sans-serif}

<div id="pz" hidden></div>
<div class="toast" id="toast"></div>
<script>
/* Connected-silhouette figure art: every body is built from tapered limbs and smooth closed blobs that
   overlap at the joints, outlined as ONE union (outline pass first, fills second), then shaded as a whole. */
const ART=(()=>{
const TAU=Math.PI*2;
function nrm(x,y){const l=Math.hypot(x,y)||1;return[x/l,y/l];}
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);}
function dense(pts,ws,sub){sub=sub||7;const P=[],W=[];const n=pts.length;for(let i=0;i<n-1;i++){const a=pts[Math.max(0,i-1)],b=pts[i],c=pts[i+1],d=pts[Math.min(n-1,i+2)];for(let s=0;s<sub;s++){const t=s/sub;P.push([cr(a[0],b[0],c[0],d[0],t),cr(a[1],b[1],c[1],d[1],t)]);W.push(ws[i]+(ws[i+1]-ws[i])*(t*t*(3-2*t)));}}P.push(pts[n-1]);W.push(ws[n-1]);return[P,W];}
/* tapered limb along a smooth spine with round caps */
function limb(pts,ws){const[P,W]=dense(pts,ws);const n=P.length,L=[],R=[];for(let i=0;i<n;i++){const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];const[tx,ty]=nrm(b[0]-a[0],b[1]-a[1]);L.push([P[i][0]-ty*W[i],P[i][1]+tx*W[i]]);R.push([P[i][0]+ty*W[i],P[i][1]-tx*W[i]]);}
 const p=new Path2D();p.moveTo(L[0][0],L[0][1]);for(let i=1;i<n;i++)p.lineTo(L[i][0],L[i][1]);
 const e=P[n-1],e0=P[n-2];const te=Math.atan2(e[1]-e0[1],e[0]-e0[0]);p.arc(e[0],e[1],W[n-1],te+Math.PI/2,te-Math.PI/2,true);
 for(let i=n-1;i>=0;i--)p.lineTo(R[i][0],R[i][1]);const s=P[0],s1=P[1];const ts=Math.atan2(s1[1]-s[1],s1[0]-s[0]);p.arc(s[0],s[1],W[0],ts-Math.PI/2,ts-Math.PI*1.5,true);p.closePath();return p;}
/* smooth closed shape through points (Catmull-Rom as beziers) */
function blob(pts,k){k=k==null?1:k;const p=new Path2D(),n=pts.length;p.moveTo(pts[0][0],pts[0][1]);for(let i=0;i<n;i++){const a=pts[(i-1+n)%n],b=pts[i],c=pts[(i+1)%n],d=pts[(i+2)%n];p.bezierCurveTo(b[0]+(c[0]-a[0])/6*k,b[1]+(c[1]-a[1])/6*k,c[0]-(d[0]-b[0])/6*k,c[1]-(d[1]-b[1])/6*k,c[0],c[1]);}p.closePath();return p;}
/* open smooth stroke path */
function curve(pts){const p=new Path2D(),n=pts.length;p.moveTo(pts[0][0],pts[0][1]);for(let i=0;i<n-1;i++){const a=pts[Math.max(0,i-1)],b=pts[i],c=pts[i+1],d=pts[Math.min(n-1,i+2)];p.bezierCurveTo(b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6,c[0]-(d[0]-b[0])/6,c[1]-(d[1]-b[1])/6,c[0],c[1]);}return p;}
function poly(pts){const p=new Path2D();p.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)p.lineTo(pts[i][0],pts[i][1]);p.closePath();return p;}
function sh(hex,a){/* shade hex by a (-1..1) */let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);if(a<0){r*=1+a;g*=1+a;b*=1+a;}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}return'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function rnd(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

/* Figure builder */
function Fig(){this.parts=[];this.dets=[];this.glows=[];}
Fig.prototype.add=function(path,fill,o){this.parts.push({p:path,f:fill,o:o||{}});return this;};
Fig.prototype.det=function(fn){this.dets.push(fn);return this;};
Fig.prototype.glow=function(fn){this.glows.push(fn);return this;};

function render(fig,box,scale,opt){opt=opt||{};const W=Math.ceil(box.w*scale),H=Math.ceil(box.h*scale);
 const out=document.createElement('canvas');out.width=W;out.height=H;const o=out.getContext('2d');
 const F=document.createElement('canvas');F.width=W;F.height=H;const f=F.getContext('2d');
 const T=c=>{c.setTransform(scale,0,0,scale,box.ox*scale,box.oy*scale);};
 T(o);T(f);
 const OL=opt.ol||2.6;o.lineJoin='round';o.lineCap='round';o.strokeStyle=opt.olc||'#120c10';
 for(const q of fig.parts){if(q.o.nol)continue;o.lineWidth=(q.o.olw||OL)*2;o.stroke(q.p);o.fillStyle=o.strokeStyle;o.fill(q.p);}
 for(const q of fig.parts){f.fillStyle=typeof q.f==='function'?q.f(f):q.f;f.fill(q.p);if(q.o.line){f.lineWidth=q.o.line;f.strokeStyle=q.o.lc||'rgba(0,0,0,.35)';f.stroke(q.p);}}
 // unified shading over the whole body
 f.save();f.setTransform(1,0,0,1,0,0);f.globalCompositeOperation='source-atop';
 const lx=opt.lx==null?-0.5:opt.lx;
 let g=f.createLinearGradient(W*(0.5+lx*0.6),0,W*(0.5-lx*0.6),H);g.addColorStop(0,'rgba(255,240,215,'+(opt.hi==null?0.22:opt.hi)+')');g.addColorStop(0.45,'rgba(255,240,215,0)');g.addColorStop(0.6,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,0,20,'+(opt.lo==null?0.42:opt.lo)+')');f.fillStyle=g;f.fillRect(0,0,W,H);
 if(opt.rim){/* coloured rim light from behind */const r=f.createLinearGradient(W,0,0,0);r.addColorStop(0,opt.rim);r.addColorStop(0.35,'rgba(0,0,0,0)');f.fillStyle=r;f.fillRect(0,0,W,H);}
 f.restore();
 for(const d of fig.dets){f.save();d(f);f.restore();}
 o.setTransform(1,0,0,1,0,0);o.drawImage(F,0,0);
 if(fig.glows.length){T(o);for(const d of fig.glows){o.save();o.globalCompositeOperation='lighter';d(o);o.restore();}}
 return out;}
function whiteOf(c){const w=document.createElement('canvas');w.width=c.width;w.height=c.height;const x=w.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,w.width,w.height);return w;}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>g.addColorStop(s[0],s[1]));return g;}
function rg(c,x,y,r,stops){const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;}

/* ---------- shared body pieces ---------- */
function boot(x,y,len,h,dir){dir=dir||1;return blob([[x-len*0.35*dir,y-h],[x+len*0.25*dir,y-h*0.95],[x+len*0.62*dir,y-h*0.45],[x+len*0.7*dir,y],[x-len*0.42*dir,y],[x-len*0.45*dir,y-h*0.5]]);}
function hand(x,y,r,a){a=a||0;const c=Math.cos(a),s=Math.sin(a);const P=[[-.9,-.6],[.3,-1],[1.1,-.35],[1.15,.4],[.3,.9],[-.8,.7]].map(([u,v])=>[x+(u*c-v*s)*r,y+(u*s+v*c)*r]);return blob(P);}
function eye(f,x,y,r,col,glow){f.fillStyle=glow?col:'#f3ead8';f.beginPath();f.ellipse(x,y,r*1.15,r,0,0,TAU);f.fill();if(!glow){f.fillStyle=col||'#1a1010';f.beginPath();f.arc(x+r*0.25,y,r*0.62,0,TAU);f.fill();f.fillStyle='rgba(255,255,255,.85)';f.beginPath();f.arc(x+r*0.45,y-r*0.3,r*0.22,0,TAU);f.fill();}}
function gEye(f,x,y,r,col){f.save();f.shadowColor=col;f.shadowBlur=r*3;f.fillStyle=col;f.beginPath();f.ellipse(x,y,r*1.2,r*0.8,0,0,TAU);f.fill();f.fillStyle='#fff';f.beginPath();f.ellipse(x,y,r*0.5,r*0.32,0,0,TAU);f.fill();f.restore();}

/* ---------- humanoid (faces right) ---------- */
function humanoid(o){const f=new Fig(),H=o.h||170,B=o.build||1,sk=o.skin||'#d9a77e',cl=o.cloth||'#5a4a7a',pa=o.pants||'#3d3530',bo=o.boots||'#2a2220',ar=o.arm||cl;
 const hipY=-H*0.47,shY=-H*0.775,kn=-H*0.245,st=o.stance||1;
 const legW=[11*B,8.5*B,6.6*B];
 // back leg + boot
 f.add(limb([[-5*B,hipY],[-15*st*B,kn],[-12*st*B,-9]],legW),sh(pa,-.28));
 f.add(boot(-12*st*B,0,26*B,13),sh(bo,-.25));
 // back arm
 const ba=o.backArm||[[-12*B,shY+6],[-24*B,shY+36],[-18*B,shY+66]];
 if(o.cape)f.add(blob([[-14*B,shY-2],[6*B,shY-4],[-6*B,hipY+10],[-30*B,-H*0.12],[-44*B,-H*0.14],[-36*B,hipY]]),sh(o.cape,-.15));
 f.add(limb(ba,[9*B,7.2*B,6*B]),sh(ar,-.3));
 if(o.backItem)o.backItem(f,ba[2]);
 f.add(hand(ba[2][0],ba[2][1]+4,6.5*B,1.6),sh(o.glove||sk,-.3));
 // torso
 const tor=o.torso||[[-20*B,shY-3],[2*B,shY-8],[20*B,shY-1],[25*B,shY+22],[19*B,hipY-4],[16*B,hipY+10],[-15*B,hipY+11],[-20*B,hipY-6],[-24*B,shY+24]];
 f.add(blob(tor),o.clothFill||cl);
 if(o.belt)f.add(blob([[-17*B,hipY-6],[18*B,hipY-7],[18*B,hipY+3],[-17*B,hipY+4]]),o.belt,{nol:1});
 // neck
 if(!o.noNeck)f.add(limb([[1*B,shY+2],[5*B,shY-14]],[7.5*B,7*B]),sh(sk,-.12));
 // head
 const hx=o.hx==null?7*B:o.hx,hy=o.hy==null?shY-26:o.hy;o.head(f,hx,hy,o);
 // front leg + boot
 f.add(limb([[7*B,hipY],[15*st*B,kn],[13*st*B,-9]],[12*B,9.2*B,7*B]),pa);
 f.add(boot(15*st*B,0,28*B,14),bo);
 if(o.skirt)f.add(blob(o.skirt),o.skirtFill||cl);
 // front arm, weapon, hand
 const fa=o.frontArm||[[13*B,shY+5],[30*B,shY+33],[44*B,shY+50]];
 if(o.weapon)o.weapon(f,fa[2],o);
 if(o.pauldron)f.add(blob([[2*B,shY-6],[22*B,shY-9],[30*B,shY+4],[22*B,shY+16],[4*B,shY+12]]),o.pauldron);
 f.add(limb(fa,[9.5*B,7.5*B,6.2*B]),ar);
 f.add(hand(fa[2][0]+2,fa[2][1],7*B,o.handA||0.3),o.glove||sk);
 if(o.frontItem)o.frontItem(f,fa[2],o);
 if(o.extra)o.extra(f,o);
 return f;}

/* heads: each is ONE silhouette that flows into the neck */
const HEAD={
 human(f,x,y,o){const r=o.hr||15;f.add(blob([[x-r*0.9,y-r*0.2],[x-r*0.6,y-r*1.05],[x+r*0.35,y-r*1.15],[x+r*1.0,y-r*0.45],[x+r*1.12,y+r*0.15],[x+r*0.95,y+r*0.55],[x+r*0.5,y+r*0.95],[x-r*0.2,y+r*1.0],[x-r*0.85,y+r*0.6]]),o.skin);
  if(o.hair)f.add(blob([[x-r*1.02,y+r*0.35],[x-r*0.95,y-r*0.6],[x-r*0.2,y-r*1.25],[x+r*0.75,y-r*1.0],[x+r*1.05,y-r*0.4],[x+r*0.4,y-r*0.62],[x-r*0.3,y-r*0.35],[x-r*0.45,y+r*0.2]]),o.hair);
  if(o.beard)f.add(blob([[x-r*0.3,y+r*0.25],[x+r*0.9,y+r*0.25],[x+r*0.7,y+r*1.05],[x+r*0.15,y+r*1.5],[x-r*0.35,y+r*0.9]]),o.beard);
  f.det(c=>{eye(c,x+r*0.55,y-r*0.12,r*0.17,o.eyeC);c.strokeStyle='rgba(60,25,15,.6)';c.lineWidth=1.4;c.beginPath();c.moveTo(x+r*0.75,y+r*0.5);c.quadraticCurveTo(x+r*0.9,y+r*0.58,x+r*0.98,y+r*0.48);c.stroke();c.strokeStyle='rgba(40,20,10,.55)';c.lineWidth=2;c.beginPath();c.moveTo(x+r*0.35,y-r*0.42);c.lineTo(x+r*0.78,y-r*0.38);c.stroke();});
  if(o.hat)o.hat(f,x,y,r,o);},
 kobold(f,x,y,o){const r=o.hr||14;f.add(blob([[x-r*0.95,y+r*0.1],[x-r*0.7,y-r*0.9],[x+r*0.2,y-r*1.0],[x+r*0.95,y-r*0.55],[x+r*1.9,y-r*0.2],[x+r*2.1,y+r*0.25],[x+r*1.4,y+r*0.6],[x+r*0.4,y+r*0.85],[x-r*0.6,y+r*0.75]]),o.skin);
  // swept ear
  f.add(limb([[x-r*0.4,y-r*0.5],[x-r*1.3,y-r*1.4],[x-r*2.1,y-r*1.6]],[r*0.42,r*0.3,r*0.08]),sh(o.skin,-.15));
  f.det(c=>{gEye(c,x+r*0.75,y-r*0.3,r*0.22,o.eyeC||'#ffd23a');c.fillStyle='#f4ecd0';for(let i=0;i<3;i++){c.beginPath();c.moveTo(x+r*(1.05+i*0.3),y+r*0.42);c.lineTo(x+r*(1.17+i*0.3),y+r*0.72);c.lineTo(x+r*(1.29+i*0.3),y+r*0.42);c.fill();}c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.ellipse(x+r*1.92,y-r*0.05,r*0.12,r*0.08,0,0,TAU);c.fill();});
  if(o.hat)o.hat(f,x,y,r,o);},
 fish(f,x,y,o){const r=o.hr||15;f.add(blob([[x-r*0.9,y+r*0.2],[x-r*0.75,y-r*0.85],[x+r*0.3,y-r*1.05],[x+r*1.3,y-r*0.45],[x+r*1.75,y+r*0.15],[x+r*1.2,y+r*0.75],[x+r*0.2,y+r*0.95],[x-r*0.7,y+r*0.75]]),o.skin);
  f.add(blob([[x-r*0.6,y-r*0.8],[x-r*0.2,y-r*1.9],[x+r*0.4,y-r*1.55],[x+r*0.7,y-r*2.1],[x+r*1.0,y-r*0.7]]),o.fin||sh(o.skin,-.2));
  f.det(c=>{gEye(c,x+r*0.7,y-r*0.25,r*0.25,o.eyeC||'#c8ff6a');c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=1.8;c.beginPath();c.moveTo(x+r*1.7,y+r*0.25);c.quadraticCurveTo(x+r*1.1,y+r*0.45,x+r*0.6,y+r*0.35);c.stroke();for(let i=0;i<3;i++){c.beginPath();c.moveTo(x-r*0.3+i*r*0.25,y+r*0.05);c.quadraticCurveTo(x-r*0.15+i*r*0.25,y+r*0.35,x-r*0.3+i*r*0.25,y+r*0.6);c.stroke();}
   c.globalAlpha=.25;c.fillStyle='#fff';for(let i=0;i<9;i++){const a=i*0.7;c.beginPath();c.arc(x-r*0.5+Math.cos(a)*r*0.6+r*0.6,y+r*0.2+Math.sin(a*1.3)*r*0.5,r*0.1,0,TAU);c.fill();}});},
 skull(f,x,y,o){const r=o.hr||15;f.add(blob([[x-r*0.9,y],[x-r*0.6,y-r*1.0],[x+r*0.4,y-r*1.1],[x+r*1.05,y-r*0.4],[x+r*1.0,y+r*0.35],[x+r*0.7,y+r*0.95],[x+r*0.05,y+r*1.0],[x-r*0.6,y+r*0.6]]),o.skin);
  f.det(c=>{c.fillStyle='#1b1012';c.beginPath();c.ellipse(x+r*0.45,y-r*0.1,r*0.28,r*0.24,0,0,TAU);c.fill();gEye(c,x+r*0.48,y-r*0.1,r*0.1,o.eyeC||'#7af');});},
 helm(f,x,y,o){const r=o.hr||15;f.add(blob([[x-r*1.0,y+r*0.5],[x-r*0.95,y-r*0.55],[x-r*0.2,y-r*1.25],[x+r*0.75,y-r*1.0],[x+r*1.15,y-r*0.2],[x+r*1.1,y+r*0.75],[x+r*0.2,y+r*0.95],[x-r*0.6,y+r*0.95]]),o.helmC||'#8a8f96');
  if(o.horns){f.add(limb([[x-r*0.3,y-r*0.8],[x-r*1.1,y-r*1.7],[x-r*0.7,y-r*2.5]],[r*0.32,r*0.22,r*0.05]),'#e2d6b6');}
  if(o.crest)f.add(limb([[x-r*0.9,y-r*0.7],[x-r*0.1,y-r*1.5],[x+r*0.7,y-r*1.15]],[r*0.15,r*0.22,r*0.1]),o.crest);
  f.det(c=>{c.fillStyle='#120d10';c.beginPath();c.moveTo(x+r*0.15,y-r*0.18);c.lineTo(x+r*1.16,y-r*0.22);c.lineTo(x+r*1.13,y+r*0.05);c.lineTo(x+r*0.2,y+r*0.08);c.closePath();c.fill();c.fillRect(x+r*0.55,y,r*0.16,r*0.62);gEye(c,x+r*0.8,y-r*0.08,r*0.08,o.eyeC||'#ffe9a0');c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1.5;c.beginPath();c.moveTo(x-r*0.5,y-r*0.7);c.quadraticCurveTo(x+r*0.1,y-r*1.1,x+r*0.7,y-r*0.85);c.stroke();});
  if(o.lamp)f.glow(c=>{c.fillStyle=rg(c,x+r*0.4,y-r*1.0,r*1.6,[[0,'rgba(255,230,140,.9)'],[0.3,'rgba(255,200,90,.35)'],[1,'rgba(255,180,60,0)']]);c.beginPath();c.arc(x+r*0.4,y-r*1.0,r*1.6,0,TAU);c.fill();});
  if(o.lamp)f.add(blob([[x+r*0.1,y-r*1.25],[x+r*0.7,y-r*1.3],[x+r*0.75,y-r*0.8],[x+r*0.15,y-r*0.78]]),'#ffe08a',{olw:1.8});},
 hood(f,x,y,o){const r=o.hr||15;f.add(blob([[x-r*1.1,y+r*1.0],[x-r*1.2,y-r*0.3],[x-r*0.6,y-r*1.3],[x+r*0.6,y-r*1.4],[x+r*1.25,y-r*0.6],[x+r*1.3,y+r*0.4],[x+r*0.9,y+r*1.1],[x,y+r*1.25]]),o.hoodC||o.cloth);
  f.add(blob([[x+r*0.05,y-r*0.6],[x+r*0.95,y-r*0.65],[x+r*1.15,y+r*0.2],[x+r*0.85,y+r*0.95],[x+r*0.1,y+r*0.75]]),'#140e16',{nol:1});

 show(`<div id="map" class="stone"><h2 style="font:600 3rem/1 var(--cap);letter-spacing:.08em;margin:0 0 .3rem">${DEP[r.depth].n}</h2><div class="hint">Tap a glowing room. ${r.hp}/${r.max} HP · ${r.dice} dice · ${r.items.length}/6 gear</div>

function startBattle(en,kind){const r=R();r.pending={type:'battle',en,kind};persist();hideUI();
 const e=EN[en],hm=heatMul(r),colBoost=kind==='fight'?1+0.05*Math.max(0,r.pos.c):1;

 B={en,kind,def:e,E:{hp,max:hp,blk:0,st:{},pi:rnd(0,e.pat.length-1)*(kind==='boss'?0:1),rage:0,enraged:0},P:{blk:0,st:{},thorns:0},dice:[],use:{},turn:0,busy:true,extra:0,lockI:-1,sel:null,over:false};

 if(kind==='boss')toast(`<span style="color:#ffd27a">${ROSTER.D[en].n}</span>`,1800);else if(kind==='elite')toast('Elite: '+ROSTER.D[en].n,1400);

function nextIntent(){const p=B.def.pat;let it=p[B.E.pi%p.length].slice();B.E.pi++;B.E.intent=it;layoutIntent();}

function intentHTML(){const it=B.E.intent;if(!it)return'';const[t,a,b]=it;switch(t){case'atk':return ic('sword')+(b?`${eDmg(a)}×${b}`:eDmg(a));case'ab':return ic('sword')+eDmg(a)+' '+ic('shield')+b;case'blk':return ic('shield')+a;case'burn':return ic('burn')+a;case'poison':return ic('poison')+a;case'frost':return ic('frost')+a;case'lock':return ic('lock')+a;case'heal':return ic('heal')+a;case'rage':return ic('rage')+'+'+a;case'weak':return ic('weak')+a;}}
function intentText(){const it=B.E.intent;const[t,a,b]=it;switch(t){case'atk':return b?`Attacks ${b} times for ${eDmg(a)} each.`:`Attacks for ${eDmg(a)}.`;case'ab':return`Attacks for ${eDmg(a)} and gains ${b} block.`;case'blk':return`Gains ${a} block.`;case'burn':return`Sets you on fire: burn ${a}. Burn hurts at the start of your turn, then halves.`;case'poison':return`Poisons you: ${a}. Poison hurts each turn, then drops by 1.`;case'frost':return`Freezes ${a} of your dice next turn. Frozen dice roll 1.`;case'lock':return`Chains ${a} of your gear next turn.`;case'heal':return`Heals ${a}.`;case'rage':return`Grows stronger: +${a} damage on every attack.`;case'weak':return`Weakens you for ${a} turns: you deal 25% less.`;}}

function renderGear(){const r=R();const g=$('gear');g.innerHTML=r.items.map((it,i)=>{const sp=itemSpec(it),u=B.use[i]||{t:0,f:0,c:0},d=IT[it.id];const left=sp.u>=99?'':Array.from({length:sp.u},(_,k)=>`<i class="${k<u.t?'off':''}"></i>`).join('');const spent=avail(i)!==true;

 g.querySelectorAll('.slab').forEach(el=>{el.onclick=()=>{const i=+el.dataset.i;if(B.sel!=null){const d=B.dice.find(q=>q.id===B.sel);if(d)useDie(d,i);}else{const sp=itemSpec(r.items[i]);toast(`<b>${IT[r.items[i].id].n}</b><br><span style="font:500 1.6rem var(--body)">${fmt(sp.t)}</span>`,2000);}};});

function avail(i){const r=R(),sp=itemSpec(r.items[i]),u=B.use[i]||{t:0,f:0,c:0};if(B.lockI===i)return'It is chained this turn';if(u.t>=sp.u)return'Already used this turn';if(sp.pf&&u.f>=sp.pf)return'Used up for this fight';return true;}
function fits(sp,v){const[t,a]=sp.req;switch(t){case'any':case'chg':return true;case'min':return v>=a;case'max':return v<=a;case'even':return v%2===0;case'odd':return v%2===1;case'eq':return v===a;}return false;}

let dieId=0;

function bindDie(el){let sx=0,sy=0,drag=false,pid=null,ghost=null;
 el.onpointerdown=e=>{if(B.busy)return;pid=e.pointerId;sx=e.clientX;sy=e.clientY;drag=false;try{el.setPointerCapture(pid);}catch(_){};};
 el.onpointermove=e=>{if(pid!==e.pointerId)return;if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){drag=true;B.sel=+el.dataset.d;markFits();ghost=el.cloneNode(true);ghost.classList.add('drag');ghost.classList.remove('roll','sel');document.body.appendChild(ghost);el.style.opacity=.25;}
  if(drag&&ghost){const s=el.getBoundingClientRect();ghost.style.left=(e.clientX-s.width/2)+'px';ghost.style.top=(e.clientY-s.height/2)+'px';ghost.style.width=s.width+'px';ghost.style.height=s.height+'px';}};
 const up=e=>{if(pid!==e.pointerId)return;pid=null;if(drag){if(ghost)ghost.remove();el.style.opacity='';const tgt=document.elementFromPoint(e.clientX,e.clientY);const slab=tgt&&tgt.closest&&tgt.closest('.slab');const d=B.dice.find(q=>q.id===+el.dataset.d);if(slab&&d)useDie(d,+slab.dataset.i);else{B.sel=null;renderDice();}}else{const id=+el.dataset.d;B.sel=B.sel===id?null:id;sfx('place');renderDice();}};
 el.onpointerup=up;el.onpointercancel=e=>{if(ghost)ghost.remove();el.style.opacity='';pid=null;};}
function newDieObj(v,fz){return{id:++dieId,v:clamp(v,1,6),fz:!!fz};}
function playerTurn(){if(B.over)return;const r=R();B.turn++;B.busy=true;
 // statuses on player
 let hurt=0;if(B.P.st.burn){hurt+=B.P.st.burn;B.P.st.burn=Math.floor(B.P.st.burn/2);}if(B.P.st.poison){hurt+=B.P.st.poison;B.P.st.poison--;}
 if(hurt){r.hp-=hurt;float('-'+hurt,'#ff9a5a','h');scene.hero.flash=1;sfx('hurt');refreshHUD();if(checkDeath())return;}
 B.P.blk=B.turn===1&&r.relics.includes('shell')?6:0;B.P.thorns=0;
 // dice
 let n=r.dice+B.extra+(B.turn===1&&r.relics.includes('glass')?1:0);B.extra=0;n=Math.min(n,7);

 show(`<div class="sheet stone" style="width:min(56rem,92vw);text-align:center">${closeBtn()}<h2>Paused</h2><p class="hint">${r?`${HEROES[r.hero].n} · ${DEP[r.depth].n} · ${r.hp}/${r.max} HP`:''}</p><div class="menu" style="margin:2rem auto">
 <button class="cbtn rune" id="pR">${ic('back')} Resume</button>
 ${r?`<button class="cbtn" id="pGear">${ic('bag')} Gear and relics</button>`:''}
 <button class="cbtn" id="pHow">${ic('event')} How to play</button>
 <button class="cbtn" id="pS">${ic(save.snd?'sound':'mute')} Sound: ${save.snd?'On':'Off'}</button>
 <button class="cbtn" id="pM">${ic(save.mus?'sound':'mute')} Music: ${save.mus?'On':'Off'}</button>
 ${r?`<button class="cbtn" id="pA">${ic('flag')} Abandon run</button>`:''}
 <button class="cbtn gold" id="pG">${ic('home')} Go back to games</button></div></div>`,closePause);
 $('pR').onclick=()=>{sfx('btn');closePause();};
 if($('pGear'))$('pGear').onclick=()=>{sfx('btn');gearView(openPause);};
 $('pHow').onclick=()=>{sfx('btn');how(openPause);};
 $('pS').onclick=()=>{save.snd=save.snd?0:1;setVol();persist();openPause();};
 $('pM').onclick=()=>{save.mus=save.mus?0:1;setVol();persist();openPause();};
 if($('pA'))$('pA').onclick=()=>{sfx('btn');show(`<div class="sheet stone" style="width:min(60rem,92vw)"><h2>Abandon this run?</h2><p>You keep the shards earned so far.</p><div class="bar2"><button class="cbtn" id="aN">${ic('back')} Back</button><button class="cbtn gold" id="aY">Abandon</button></div></div>`,openPause);$('aN').onclick=()=>{sfx('btn');openPause();};$('aY').onclick=()=>{sfx('btn');closePause();B=null;endRun(false,true);title();};};
 $('pG').onclick=()=>{sfx('btn');leave();};}
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});
addEventListener('pagehide',persist);

/* ---------------- camp ---------------- */
function camp(back){setMode('menu');$('title').className='hide';
 show(`<div class="sheet stone">${closeBtn()}<h2>The camp</h2><p>${ic('shard')} <b style="font-size:2.2rem">${save.shards}</b> shards · earned on every run, win or lose.</p>
 ${UPG.map(u=>{const lv=save.up[u.id]||0,max=u.c.length,cost=u.c[lv];return`<div class="uprow"><div class="d"><b>${u.n}</b><div class="hint">${u.t}</div><div class="pips">${u.c.map((_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div>${lv>=max?'<span class="tag">MAXED</span>':`<button class="cbtn${save.shards>=cost?' rune':''}" data-u="${u.id}" ${save.shards>=cost?'':'disabled'}>${ic('shard')} ${cost}</button>`}</div>`;}).join('')}
 <h3>Heroes</h3><div class="row">${Object.keys(HEROES).map(h=>`<span class="tag">${HEROES[h].n}: ${save.heroes[h]?'unlocked':HEROES[h].lock}</span>`).join('')}</div>
 <div class="bar2"><button class="cbtn" id="kB">${ic('back')} Back</button></div></div>`,back);
 on('[data-u]',e=>{const u=UPG.find(q=>q.id===e.dataset.u),lv=save.up[u.id]||0,c=u.c[lv];if(save.shards<c)return;save.shards-=c;save.up[u.id]=lv+1;persist();sfx('magic');camp(back);});
 $('kB').onclick=()=>{sfx('btn');back();};}
/* ---------------- records ---------------- */
function records(back){setMode('menu');$('title').className='hide';const ids=Object.keys(ROSTER.D).filter(k=>EN[k]);
 const goals=[['Beat a boss',save.bosses>=1],['Unlock the Hexer',!!save.heroes.hexer],['Reach the Ember Core',save.bestDepth>=3],['Unlock the Reaver',!!save.heroes.reaver],['Finish a full run',save.wins>=1],['Win at Heat 3',save.maxHeat>=4],['Win at Heat 5',save.heat5>=1],['Meet every foe',ids.every(k=>save.seen[k])]];
 show(`<div class="sheet stone">${closeBtn()}<h2>Records</h2><div class="grid2"><div><h3>Totals</h3><p>Runs: <b>${save.runs}</b> · Wins: <b>${save.wins}</b><br>Foes beaten: <b>${save.fights}</b> · Bosses: <b>${save.bosses}</b><br>Elites: <b>${save.elites}</b> · Deepest: <b>${save.bestDepth?DEP[Math.min(3,save.bestDepth-1)].n:'none'}</b><br>Highest heat unlocked: <b>${save.maxHeat}</b></p></div>
 <div><h3>Goals</h3>${goals.map(([t,ok])=>`<div style="display:flex;gap:.8rem;align-items:center;margin:.4rem 0;opacity:${ok?1:.6}">${ic(ok?'relic':'die')} ${t}</div>`).join('')}</div></div>
 <h3>Bestiary</h3><div class="best">${ids.map(k=>`<div class="b${save.seen[k]?'':' un'}"><span data-bp="${k}"></span>${save.seen[k]?ROSTER.D[k].n+(save.beat[k]?`<br>beaten ${save.beat[k]}×`:''):'???'}</div>`).join('')}</div>
 <div class="bar2"><button class="cbtn" id="rcB">${ic('back')} Back</button></div></div>`,back);
 TGT.querySelectorAll('[data-bp]').forEach(el=>{const g=ROSTER.get(el.dataset.bp,0.6),im=g.frames[0].c;const c=document.createElement('canvas');c.width=200;c.height=200;const x=c.getContext('2d');const s=Math.min(190/im.width,190/im.height);x.drawImage(im,(200-im.width*s)/2,(200-im.height*s)/2,im.width*s,im.height*s);el.replaceWith(c);});
 $('rcB').onclick=()=>{sfx('btn');back();};}
function how(back){if(scene.mode==='title')$('title').className='hide';
 show(`<div class="sheet stone">${closeBtn()}<h2>How to play</h2>
 <p>Each turn you roll your bone dice. <b>Drag a die onto a piece of gear</b> (or tap the die, then the gear) to use it. The socket shows what the gear needs: any die, 4 or more, 3 or less, even, odd, an exact number, or <b>charge</b> (add dice until the bar fills).</p>
 <p>Gear that glows can take the die you picked. Little lights show uses left this turn. When you are done, tap <b>End turn</b>. Unused dice are lost.</p>
 <p>The badge above the enemy shows what it will do next. Tap it for details. Block soaks up damage until your next turn.</p>
 <h3>Status</h3><p>${ic('burn')} Burn hurts each turn, then halves. ${ic('poison')} Poison hurts each turn, then drops by 1. ${ic('weak')} Weak: 25% less damage. ${ic('stun')} Stun: skips a move. ${ic('frost')} Frost: some dice roll 1. ${ic('lock')} Chains: gear locked for a turn.</p>
 <h3>The descent</h3><p>Pick rooms on the map: ${ic('fight')} fights, ${ic('elite')} elites (relic), ${ic('shop')} the peddler, ${ic('rest')} campfires, ${ic('chest')} chests and ${ic('event')} shrines. Beat the ${ic('boss')} boss of each of the 4 depths. Bosses give extra dice and relics.</p>
 <h3>Between runs</h3><p>Every run earns ${ic('shard')} shards for lasting upgrades at the camp. Beat bosses to unlock new heroes. Win a run to unlock Heat levels.</p>
 <div class="bar2"><button class="cbtn" id="hwB">${ic('back')} Back</button></div></div>`,back);$('hwB').onclick=()=>{sfx('btn');back();};}

/* ---------------- boot ---------------- */
resize();title();
window.__rr={save:()=>save,B:()=>B,BAPI,winBattle:()=>{if(B){B.E.hp=0;checkWin();}},persist};
})();

</script>
</body></html>
