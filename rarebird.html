function result(t,i,isNew){cancelAnimationFrame(G.raf);G.ph='rev';const p=G.ps[G.i];const pts=t<0?0:TIERS[t].p+(isNew?5:0);G.score+=pts;
 G.res[G.i]={t,i,pid:p.id,q:p.q,a:t<0?'':nameOf(p,i),pts};

function revealUI(t,i,isNew,pts,lostNow){const p=G.ps[G.i],n=p.a.length;$('card').hidden=true;$('ansRow').hidden=true;$('kb').hidden=true;$('msg').textContent='';
 const common=[0,1,2].map(k=>nameOf(p,k)).filter((x,k)=>k!==i);
 const rareIdx=[];for(let k=Math.floor(n*.82);k<n;k++)rareIdx.push(k);shuf(rareIdx);const rare=rareIdx.filter(k=>k!==i).slice(0,6).map(k=>nameOf(p,k));
 const last=G.mode!=='free'?G.i>=6:G.lives<=0||G.i>=G.ps.length-1;const canRe=t>=0&&t<=1&&S.gear.retake>0&&!G.retakeUsed&&G.mode!=='daily'&&!last;
 const canRe2=t>=0&&t<=1&&S.gear.retake>0&&!G.retakeUsed&&G.mode!=='daily';
 const d=document.createElement('div');d.id='rev';d.className='page';
 d.innerHTML=`<canvas id="revCv"></canvas><div id="rv">${t<0?`<div class="tier">Time's up</div><div class="big">It flew away</div><p style="font-size:19px">No sighting this time.</p>`:
 `<div class="tier" style="color:${TIERS[t].c}">${TIERS[t].d}</div><div class="big">${nameOf(p,i)}</div><div style="font-size:24px;margin:6px 0 14px">is a <b style="color:${TIERS[t].c}">${TIERS[t].n}</b></div>
 <span class="pts" style="background:${TIERS[t].c}">+${TIERS[t].p}</span> ${isNew?'<span class="pts" style="background:#a87a1c;font-size:22px">+5 new in journal</span>':''}
 <p style="font-size:17px;color:var(--ink2);margin-top:14px">Rank ${i+1} of ${n} in the guide for this prompt.</p>`}
 ${lostNow?`<p style="font-size:19px;color:#b4532a;font-weight:700">${G.lives>0?'Lost 1 stamina':'Out of stamina!'}</p>`:''}</div>
 <div class="lst"><h4>Most people say</h4>${common.slice(0,3).map(x=>`<span class="chip">${x}</span>`).join('')}<h4>Ghost Owls you could have found</h4>${rare.map(x=>`<span class="chip" style="background:rgba(141,123,196,.18)">${x}</span>`).join('')}</div>
 <div class="row" style="position:absolute;right:28px;bottom:24px">${canRe2?`<button class="st pale" id="reB">${IC.redo} Retake <small>(${S.gear.retake} left)</small></button>`:''}<button class="st" id="nxB" style="min-width:220px">${last||(G.mode==='free'&&G.lives<=0)?'See results':'Next prompt'} ${IC.play}</button></div>`;
 UI.appendChild(d);
 const cv=$('revCv'),pr=Math.min(2,PR);cv.width=470*pr;cv.height=330*pr;const c=cv.getContext('2d');c.scale(pr,pr);const t0=performance.now();
 (function an(now){if(!cv.isConnected)return;const e=Math.max(0,Math.min(1,(now-t0)/900)),ee=1-Math.pow(1-e,3);c.clearRect(0,0,470,330);
  if(t<0){c.globalAlpha=1-e*.8;drawBird(c,0,235+ee*260,170-ee*120,.9,(Math.sin(now*.02)+1)/2);c.globalAlpha=1;}
  else{c.fillStyle='rgba(90,75,51,.12)';c.beginPath();c.ellipse(235,262,120*ee+1,12*ee+1,0,0,7);c.fill();const fl=e<1?(Math.sin(now*.03)+1)/2:(Math.sin(now*.004)+1)/4;drawBird(c,t,-120+ee*360,60+ee*120+Math.sin(now*.003)*4,t===3?1.25:t===4?1.15:1.5,fl);}
  requestAnimationFrame(an);})(t0);
 on('nxB',next);if(canRe2)on('reB',()=>{S.gear.retake--;G.retakeUsed=1;G.score-=pts;G.res[G.i]=null;if(G.mode==='free'&&lostNow){G.lives++;G.lost--;}G.usedA=p.id+':'+i;save();ask();G.left=Math.min(G.left,15000);$('msg').textContent='Retake! Find something rarer.';});}
function next(){G.usedA=null;if(G.mode==='free'){if(G.lives<=0||G.i>=G.ps.length-1){endFlight();return;}}else if(G.i>=6){endFlight();return;}G.i++;ask();}
function useHint(){if(!G||G.ph!=='ask'||!S.gear.hint||G.hint)return;const p=G.ps[G.i],n=p.a.length,J=S.j[p.id]||[];const c=[];for(let k=Math.floor(n*.58);k<n;k++)if(!J.includes(k))c.push(k);if(!c.length)for(let k=Math.floor(n*.34);k<n;k++)c.push(k);
 const k=c[Math.floor(Math.random()*c.length)],nm=p.a[k].split('/')[0];S.gear.hint--;save();G.hint=nm.split('').map((ch,j)=>j===0?ch.toUpperCase():ch===' '?'  ':'_').join(' ');drawField();hud();$('msg').textContent='Hint: a rare one starts with '+nm[0].toUpperCase()+' ('+nm.replace(/[^a-z0-9]/gi,'').length+' letters)';}
function pauseGame(){if(!G||OV)return;if(G.ph==='ask'){}
 sheet(`<button class="xb" id="xC" aria-label="Resume">${IC.x}</button><h2>Paused</h2><p>${G.label}: prompt ${G.i+1}${G.mode==='free'?'':' of 7'} · score ${G.score}</p>
 <div class="row cen" style="margin-top:18px"><button class="st" id="pR">${IC.play} Resume</button><button class="st pale" id="pS">${IC.snd} Settings</button><button class="st pale" id="pQ">${IC.q} How to play</button></div>
 <div class="row cen" style="margin-top:12px"><button class="st rust" id="pT">${IC.back} Quit flight</button><button class="st ink" id="pH">${IC.home} Go back to games</button></div>
 <p style="font-size:15px;color:var(--ink2);text-align:center;margin-top:14px">Quitting ends this flight. Journal entries you've found are already saved.</p>`,760);
 const res=()=>{closeSheet();if(G&&G.ph==='ask'){G.t0=performance.now();}};on('xC',res);on('pR',res);on('pS',()=>settings(pauseGame));on('pQ',()=>howTo(pauseGame));on('pT',()=>{closeSheet();cancelAnimationFrame(G.raf);G=null;title();});on('pH',goHub);}
function endFlight(){const g=G;g.ph='end';cancelAnimationFrame(g.raf);S.flights++;try{__mgt('m','flight');}catch(e){}
 g.res.forEach(r=>{if(r)S.seen[r.pid]=S.flights;});
 let fe=Math.round(g.score/10);if(S.gear.luck)fe=Math.round(fe*1.25);let stars=0,cleared1=false,msg='';
 if(g.mode==='reg'){const R=REG[g.reg];stars=g.score>=R.t+140?3:g.score>=R.t+70?2:g.score>=R.t?1:0;const prev=S.reg[g.reg]||0;
  if(stars&&!prev){cleared1=true;fe+=40+g.reg*10;try{__mgt('m','reg');}catch(e){}}if(stars>prev){S.reg[g.reg]=stars;if(prev)fe+=15*(stars-prev);}S.rb[g.reg]=Math.max(S.rb[g.reg]||0,g.score);
  try{stars?__mgt('w','Region '+(g.reg+1)):__mgt('l','Region '+(g.reg+1));}catch(e){}}
 if(g.mode==='daily'){const d=today(),y=new Date(Date.now()-864e5);const yd=y.getFullYear()+'-'+('0'+(y.getMonth()+1)).slice(-2)+'-'+('0'+y.getDate()).slice(-2);S.streak=S.lastD===yd?S.streak+1:1;S.lastD=d;S.daily={d,sc:g.score,res:g.res.map(r=>({q:PBY[r.pid].q.replace(/^Name (a|an) /,''),a:r.a,t:r.t}))};fe+=20;try{__mgt('e','Daily',g.score);}catch(e){}}
 if(g.mode==='free'){if(g.score>S.bestFree)msg='New Free Flight best!';S.bestFree=Math.max(S.bestFree,g.score);try{__mgt('e','Free Flight',g.score);}catch(e){}}
 if(g.mode!=='free'){if(g.score>S.best&&S.flights>1)msg=msg||'New best flight!';S.best=Math.max(S.best,g.score);if(g.score>=500&&!S.s500){S.s500=1;try{__mgt('m','s500');}catch(e){}}}
 S.fe+=fe;S.tot+=g.score;save();AU.fan();
 const rs=g.res.filter(Boolean);
 const R=g.mode==='reg'?REG[g.reg]:null;
 UI.querySelectorAll('#rev').forEach(e=>e.remove());$('card').hidden=true;$('ansRow').hidden=true;$('kb').hidden=true;
 const d=document.createElement('div');d.id='rev';d.className='page';
 d.innerHTML=`<div style="position:absolute;left:36px;top:30px;right:36px"><div class="tier">${g.label}${g.mode==='free'?' · '+rs.length+' prompts':''}</div><div class="big" style="font-size:64px">${g.score} points</div>
 ${R?`<div style="font-size:22px;margin:6px 0">${stars?`Target ${R.t} beaten! ${starsHTML(stars)}`:`Target was ${R.t}. ${R.t-g.score} short. Try again for rarer birds.`}</div>`:''}
 ${msg?`<div style="font-size:22px;color:#a87a1c;font-weight:700">${msg}</div>`:''}

 <div class="row" style="position:absolute;right:28px;bottom:24px">${g.mode==='reg'?(stars&&g.reg<11?`<button class="st pale" id="eM">${IC.map} Map</button><button class="st" id="eN">Fly to ${REG[g.reg+1].n} ${IC.play}</button>`:`<button class="st pale" id="eM">${IC.map} Map</button><button class="st" id="eR">${IC.redo} Fly again</button>`):g.mode==='free'?`<button class="st pale" id="eT">${IC.back} Title</button><button class="st" id="eF">${IC.redo} Fly again</button>`:`<button class="st" id="eT">${IC.back} Title</button>`}</div>`;
 UI.appendChild(d);d.querySelectorAll('.rb').forEach(e=>{const t=+e.dataset.t;if(t>=0)e.appendChild(birdCanvas(t,64,44,.22));else e.style.cssText='width:64px;height:44px;display:block';});
 $('pauseB').hidden=true;
 on('eM',mapScreen);on('eN',()=>{G=null;startRegion(g.reg+1);});on('eR',()=>{G=null;startRegion(g.reg);});on('eT',title);on('eF',()=>{G=null;startFree();});}
/* ---------- journal ---------- */
function journal(cat='All',tab='pages'){const cats=['All','Animals','Food','Places','Science','Sports','Games','Culture','Everyday'];
 let body='';if(tab==='pages'){const ps=DATA.filter(p=>cat==='All'||p.c===cat);body=`<div class="tabs">${cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('')}</div><div class="jgrid">${ps.map(p=>{const f=(S.j[p.id]||[]).length;return`<button class="jc" data-p="${p.id}"><b>${p.q.replace(/^Name (a|an) /,'')}</b><div class="bar"><i style="width:${(f/p.a.length*100).toFixed(1)}%"></i></div><span style="font-size:14px;color:var(--ink2)">${f} / ${p.a.length}</span></button>`;}).join('')}</div>`;}
 else{const tot=DATA.reduce((a,p)=>a+p.a.length,0);body=`<div class="tline" style="font-size:22px">${IC.book} Answers logged <b style="margin-left:auto">${S.jc.toLocaleString()} / ${tot.toLocaleString()}</b></div>
  ${TIERS.map((t,i)=>`<div class="tline"><span id="jt${i}"></span><b style="width:140px">${t.n}s</b><span>spotted ${S.tc[i]} times</span></div>`).join('')}
  <div class="tline">${IC.chart} Best flight <b style="margin-left:auto">${S.best}</b></div><div class="tline">${IC.wind} Best Free Flight <b style="margin-left:auto">${S.bestFree}</b></div><div class="tline">${IC.map} Regions cleared <b style="margin-left:auto">${cleared()} / 12</b></div><div class="tline">${IC.cal} Flights flown <b style="margin-left:auto">${S.flights}</b></div><div class="tline">${IC.sun} Daily streak <b style="margin-left:auto">${S.streak}</b></div>`;}
 sheet(`<button class="xb" id="xC" aria-label="Close">${IC.x}</button><h2>Field Journal</h2><div class="tabs"><button class="${tab==='pages'?'on':''}" id="jP">${'Pages'}</button><button class="${tab==='rec'?'on':''}" id="jR">Records</button></div>${body}`,940);
 on('xC',()=>{closeSheet();if(SCR==='title')title();});on('jP',()=>journal(cat,'pages'));on('jR',()=>journal(cat,'rec'));
 if(tab==='rec')TIERS.forEach((t,i)=>$('jt'+i).appendChild(birdCanvas(i,64,44,.22)));
 OV.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>journal(b.dataset.c,'pages'));OV.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>jPage(b.dataset.p,cat));}
function jPage(pid,cat){const p=PBY[pid],J=(S.j[pid]||[]).slice().sort((a,b)=>a-b),n=p.a.length;const left=[0,0,0,0,0,0];for(let k=0;k<n;k++)if(!J.includes(k))left[tierOf(k,n)]++;
 sheet(`<button class="bk" id="jB" style="position:relative;left:auto;top:auto;display:inline-flex">${IC.back} Journal</button><button class="xb" id="xC" aria-label="Close">${IC.x}</button><h2 style="margin-top:14px">${p.q}</h2><p>${J.length} of ${n} found.</p>

 on('jB',()=>journal(cat,'pages'));on('xC',closeSheet);}
