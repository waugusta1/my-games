/* ================= helpers ================= */
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');let n=parseInt(c,16),r=n>>16,gg=n>>8&255,b=n&255;
 const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return '#'+((1<<24)|(f(r)<<16)|(f(gg)<<8)|f(b)).toString(16).slice(1);}
const CJK='"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","Noto Sans CJK SC","PingFang SC","SimSun",serif';

/* ================= TILE FACES ================= */
// kinds: 0-8 coins, 9-17 bamboo, 18-26 characters, 27-30 winds, 31-33 dragons, 34-37 flowers, 38-41 seasons
function faceMatch(a,b){if(a===b)return true;if(a>=34&&a<=37&&b>=34&&b<=37)return true;if(a>=38&&b>=38)return true;return false;}
function faceGroup(f){return f>=38?38:f>=34?34:f;}
function coin(g,x,y,r,col,ink,big){
 const gr=g.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);gr.addColorStop(0,shade(col,.55));gr.addColorStop(.7,col);gr.addColorStop(1,shade(col,-.35));

 g.fillStyle=shade(col,.82);g.beginPath();g.arc(x,y,r*.74,0,7);g.fill();
 // petal ring
 const n=big?12:8;g.fillStyle=col;
 for(let i=0;i<n;i++){const a=i/n*Math.PI*2,px=x+Math.cos(a)*r*.52,py=y+Math.sin(a)*r*.52;g.beginPath();g.ellipse(px,py,r*(big?.13:.15),r*.075*(big?1:1.2),a,0,7);g.fill();}

 g.fillStyle=shade(col,.82);g.fillRect(x-r*.1,y-r*.1,r*.2,r*.2);

const COINPOS={1:[[.5,.5]],2:[[.5,.27],[.5,.73]],3:[[.24,.2],[.5,.5],[.76,.8]],4:[[.28,.27],[.72,.27],[.28,.73],[.72,.73]],

function drawCoins(g,n,w,h,ink){const P=COINPOS[n],C=coinCols(n,ink);const r=n===1?w*.4:n===2?Math.min(w*.26,h*.2):n<=5?Math.min(w*.2,h*.15):n<=7?Math.min(w*.16,h*.115):n===8?Math.min(w*.17,h*.105):Math.min(w*.15,h*.14);

function stick(g,cx,cy,L,W,col,ang){g.save();g.translate(cx,cy);if(ang)g.rotate(ang);
 const half=L/2,w=W/2;const gr=g.createLinearGradient(-w,0,w,0);gr.addColorStop(0,shade(col,-.35));gr.addColorStop(.35,shade(col,.35));gr.addColorStop(.6,col);gr.addColorStop(1,shade(col,-.45));

function drawBird(g,w,h,ink){ // sparrow perched on a bamboo branch: one continuous body silhouette

  case 'ring':{const m=Math.hypot(u,v);inside=m<=1.15&&m>=.48;t=1-Math.abs(m-.82)/.34;break;}
  case 'cross':inside=au<.38||av<.38;t=1-Math.max(au,av);break;
  case 'xshape':inside=Math.abs(au-av)<.45||(au<.25&&av<.3);t=1-Math.max(au,av);break;

function freeIn(p,M){for(const dx of[-1,0,1])for(const dy of[-1,0,1])if(M.has((p.x+dx)+','+(p.y+dy)+','+(p.z+1)))return false;

 for(let att=0;att<400;att++){const M=new Map();pos.forEach((p,i)=>M.set(key(p),i));const pairs=[];
  while(M.size){const fr=[];for(const i of M.values())if(freeIn(pos[i],M))fr.push(i);if(fr.length<2)break;

   const pick=()=>{let tot=0;const w=fr.map(i=>{const v=1+pos[i].z*2.2;tot+=v;return v;});let x=rng()*tot;for(let j=0;j<fr.length;j++){x-=w[j];if(x<=0)return j;}return fr.length-1;};
   const a=pick();const ia=fr.splice(a,1)[0];const ib=fr[pick()];M.delete(key(pos[ia]));M.delete(key(pos[ib]));pairs.push([ia,ib]);}

 if(G.mode==='caravan'){G.cpairs++;G.sand=Math.min(G.sandMax||150,G.sand+3+Math.min(4,G.combo-1));G.score+=10*G.combo;}

 for(let i=toks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[toks[i],toks[j]]=[toks[j],toks[i]];}

 }

 ["Chang'an, spring","Dear Mei, the caravan leaves at dawn: forty camels, twelve bolts of my best silk, and a box of carved tiles the old master gave me for the road. He says every board of tiles is a city, and that you only leave a city once its tiles are cleared. I think he means I should not rush. I will write from every gate."],
