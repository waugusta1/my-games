 let mx=0,my=0;if(joy&&joy.on){mx=joy.dx;my=joy.dy;}if(KEYS.size){if(KEYS.has('ArrowLeft')||KEYS.has('a'))mx-=1;if(KEYS.has('ArrowRight')||KEYS.has('d'))mx+=1;if(KEYS.has('ArrowUp')||KEYS.has('w'))my-=1;if(KEYS.has('ArrowDown')||KEYS.has('s'))my+=1;}
 if(window.AUTO){let fx=0,fy=0;for(const e of G.E){const dx=G.x-e.x,dy=G.y-e.y,d2=dx*dx+dy*dy;if(d2<95*95){fx+=dx/d2*900;fy+=dy/d2*900;}}let g=null,gd=1e12;for(const q of G.Gm){const d=(q.x-G.x)**2+(q.y-G.y)**2;if(d<gd){gd=d;g=q;}}if(g){const d=Math.sqrt(gd)||1;fx+=(g.x-G.x)/d*.6;fy+=(g.y-G.y)/d*.6;}mx=fx;my=fy;}
 const ml=Math.hypot(mx,my);G.moving=ml>.1;if(ml>.1){const s=stat('spd')*Math.min(1,ml);G.x+=mx/ml*s*dt;G.y+=my/ml*s*dt;if(Math.abs(mx)>.15)G.face=mx>0?1:-1;G.walk+=dt;}
 if(G.inv>0)G.inv-=dt;G.hp=Math.min(stat('maxhp'),G.hp+stat('regen')*dt);
 stepSpawn(dt);stepWeapons(dt);stepProj(dt);
 // enemies
 const arm=stat('arm');for(let i=G.E.length-1;i>=0;i--){const e=G.E[i];if(e.dead){G.E.splice(i,1);continue;}if(e.hit>0)e.hit-=dt;if(e.burn>0){e.burn-=dt;e.bt=(e.bt||0)-dt;if(e.bt<=0){e.bt=.4;dmgE(e,8,0);if(e.dead)continue;}}
  const dx=G.x-e.x,dy=G.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=(dx/d*e.spd+e.kx)*dt;e.y+=(dy/d*e.spd+e.ky)*dt;e.kx*=.86;e.ky*=.86;e.fx=dx>0?1:-1;e.sf+=dt*(e.spd/60);
  if(d>1100&&!e.boss){const a=R()*Math.PI*2;e.x=G.x+Math.cos(a)*650;e.y=G.y+Math.sin(a)*560;}
  if(d<e.r+18&&G.inv<=0){const dm=Math.max(1,e.dmg-arm);G.hp-=dm;G.inv=.45;G.flash=.25;AU.tone(140,.12,'square',.08,80);if(G.hp<=0){if(G.rev>0){G.rev--;G.hp=stat('maxhp')*.6;G.inv=2;banner('A second wick catches!');for(const o of G.E)if(!o.boss&&(o.x-G.x)**2+(o.y-G.y)**2<300*300)dmgE(o,9999,0);}else{die();return;}}}
  if(e.boss&&e.t==='wick'){e.cd-=dt;if(e.cd<=0){e.cd=2.4;for(let k=0;k<10;k++){const a=k/10*Math.PI*2+G.t;G.Pj.push({k:'ember',x:e.x,y:e.y-100,vx:Math.cos(a)*180,vy:Math.sin(a)*180,l:4,t:0});}}}
  if(e.boss&&e.t==='bride'){e.cd-=dt;if(e.cd<=0){e.cd=5;for(let k=0;k<6;k++)spawn('bat',e.x+(R()-.5)*80,e.y+(R()-.5)*80);}}
  if(e.boss&&e.t==='eater'){e.cd-=dt;if(e.cd<=0){e.cd=4;e.kx+=dx/d*600;e.ky+=dy/d*600;banner('',1);}}
  if(e.boss&&e.t==='colossus'){e.cd-=dt;if(e.cd<=0){e.cd=6;for(let k=0;k<5;k++)spawn('skel',e.x+(R()-.5)*120,e.y+(R()-.5)*120);}}}
 // boss embers hurt player
 for(let i=G.Pj.length-1;i>=0;i--){const p=G.Pj[i];if(p.k!=='ember')continue;p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if((p.x-G.x)**2+(p.y-G.y+20)**2<16*16&&G.inv<=0){G.hp-=Math.max(1,18-arm);G.inv=.45;G.flash=.25;G.Pj.splice(i,1);if(G.hp<=0&&!G.rev){die();return;}continue;}if(p.t>p.l)G.Pj.splice(i,1);}
 // separation (cheap): push apart pairs in a grid
 const grid=new Map();for(const e of G.E){const k=((e.x/40)|0)+','+((e.y/40)|0);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}for(const a of grid.values()){for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const p=a[i],q=a[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||.1,m=p.r+q.r-6;if(d<m){const s=(m-d)/d*.5;p.x-=dx*s;p.y-=dy*s;q.x+=dx*s;q.y+=dy*s;}}}
 // gems
 const mag=stat('mag');if(G.Gm.length>320){let tot=0;for(const g of G.Gm.splice(0,120))tot+=g.v;G.Gm.push({x:G.x+(R()-.5)*400,y:G.y+(R()-.5)*300,v:tot,k:2});}
 for(let i=G.Gm.length-1;i>=0;i--){const g=G.Gm[i];const dx=G.x-g.x,dy=G.y-10-g.y,d=Math.hypot(dx,dy);if(g.pull||d<mag){g.pull=1;const sp=Math.max(300,700-d);g.x+=dx/d*sp*dt;g.y+=dy/d*sp*dt;}if(d<18){G.Gm.splice(i,1);gainXp(g.v);}}
 for(let i=G.Hl.length-1;i>=0;i--){const h=G.Hl[i];const d=Math.hypot(G.x-h.x,G.y-h.y);if(d<mag*.6){h.x+=(G.x-h.x)*.2;h.y+=(G.y-h.y)*.2;}if(d<22){G.Hl.splice(i,1);if(h.k==='heal'){G.hp=Math.min(stat('maxhp'),G.hp+40);AU.tone(660,.2,'sine',.1);}else{G.shardsGot+=5;AU.tone(1318,.1,'triangle',.08);}}}
 for(let i=G.Ch.length-1;i>=0;i--){const h=G.Ch[i];if(Math.hypot(G.x-h.x,G.y-h.y)<34){G.Ch.splice(i,1);openChest();break;}}
 for(let i=G.Fx.length-1;i>=0;i--){const f=G.Fx[i];f.t+=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;}if(f.t>(f.l||.7))G.Fx.splice(i,1);}
 if(G.flash>0)G.flash-=dt;if(!S.surv5done&&G.t>=300){S.surv5done=1;}if(G.t>=300&&!G.s5){G.s5=1;if(!S.surv5){S.surv5=1;__mgt('m','surv5');persist();}}}
let BAN=null;function banner(t,silent){if(!t)return;BAN={t,l:2.6};}
function gainXp(v){G.xp+=v*stat('grow');AU.tone(1200+R()*400,.04,'triangle',.025);while(G.xp>=need(G.lv)){G.xp-=need(G.lv);G.lv++;G.pendingLv++;}if(G.pendingLv&&!G.lvlUp)levelUp();}
/* ---------- level up ---------- */
function choices(n=3,chest){const o=[];for(const w of G.w){if(w.lv<5)o.push({k:'w',id:w.id,lv:w.lv+1});if(w.lv>=5&&!w.ev&&G.ps[WP[w.id].evo]&&chest)o.push({k:'ev',id:w.id,pri:1});}
 if(G.w.length<4)for(const id in WP)if(!W(id))o.push({k:'w',id,lv:1});
 for(const id in G.ps)if(G.ps[id]<5)o.push({k:'p',id,lv:G.ps[id]+1});if(Object.keys(G.ps).length<4)for(const id in PS)if(!G.ps[id])o.push({k:'p',id,lv:1});
 const ev=o.filter(x=>x.k==='ev');const rest=shuf(o.filter(x=>x.k!=='ev'));const out=ev.concat(rest).slice(0,n);if(!out.length)out.push({k:'heal'});return out;}
function apply(c){if(c.k==='w'){const w=W(c.id);if(w)w.lv++;else G.w.push({id:c.id,lv:1,cd:.2,ev:0,a:0});}else if(c.k==='p'){G.ps[c.id]=(G.ps[c.id]||0)+1;if(c.id==='wick')G.hp+=G.maxhp0*.2;}else if(c.k==='ev'){W(c.id).ev=1;banner(WP[c.id].evn+'!');}else if(c.k==='heal'){G.hp=Math.min(stat('maxhp'),G.hp+50);G.shardsGot+=10;}}
function cName(c){return c.k==='w'?WP[c.id].n:c.k==='p'?PS[c.id].n:c.k==='ev'?WP[c.id].evn:'Warm Broth';}
function cDesc(c){if(c.k==='w')return c.lv===1?WP[c.id].d:`Level ${c.lv}: ${['','more damage','more damage and reach','stronger and faster','more projectiles and damage','maximum power'][c.lv]}.`;if(c.k==='p')return PS[c.id].d+(c.lv>1?` (rank ${c.lv})`:'');if(c.k==='ev')return WP[c.id].evd;return'Heal 50 health and gain 10 shards.';}
function levelUp(){G.lvlUp=1;const cs=choices(3);AU.tone(523,.12,'triangle',.1);AU.tone(784,.12,'triangle',.1,0,.08);AU.tone(1046,.3,'triangle',.1,0,.16);
 sheet(`<h2 class="cen">Level ${G.lv-G.pendingLv+1}</h2><p class="cen">Choose a gift from the grave.</p>${cs.map((c,i)=>`<button class="pk ${c.k==='ev'?'ev':''}" id="lc${i}"><canvas id="lcc${i}" width="144" height="144"></canvas><span><b>${cName(c)}${c.k==='w'||c.k==='p'?` <em>${c.lv===1?'New!':'Level '+c.lv}</em>`:''}</b><small>${cDesc(c)}</small></span></button>`).join('')}<div class="row cen">${G.rer>0?`<button class="gb" id="lR">${IC.dice} Reroll (${G.rer})</button>`:''}</div><p class="cen" style="font-size:14px;opacity:.7">The pause button still works here.</p>`);
 cs.forEach((c,i)=>{const k=$('lcc'+i).getContext('2d');drawIcon(k,c.k==='heal'?'heal':c.id,144);btn('lc'+i,()=>{apply(c);G.pendingLv--;closeSheet();G.lvlUp=0;if(G.pendingLv>0)levelUp();});});btn('lR',()=>{G.rer--;closeSheet();G.lvlUp=0;levelUp();});}
function openChest(){G.chest=1;const cs=choices(1,1);const n=G.t>300?2:1;const got=[];for(let i=0;i<n;i++){const c=choices(1,1)[0];apply(c);got.push(c);}G.shardsGot+=15;AU.tone(392,.2,'square',.08);AU.tone(523,.2,'square',.08,0,.15);AU.tone(784,.4,'square',.08,0,.3);
 sheet(`<h2 class="cen">A coffin cracks open</h2>${got.map((c,i)=>`<div class="pk ${c.k==='ev'?'ev':''}"><canvas id="chc${i}" width="144" height="144"></canvas><span><b>${cName(c)}</b><small>${cDesc(c)}</small></span></div>`).join('')}<p class="cen">+15 shards</p><div class="row cen"><button class="gb hi" id="cO">${IC.play} Onward</button></div>`);
 got.forEach((c,i)=>drawIcon($('chc'+i).getContext('2d'),c.k==='heal'?'heal':c.id,144));btn('cO',()=>{closeSheet();G.chest=0;});}
/* ---------- run end ---------- */
function shardsFor(clear){return Math.floor((Math.floor(G.kills/8)+G.shardsGot+Math.floor(G.t/30)+(clear?60*(G.stage+1):0))*(1+.1*metaLv('greed'))*(G.bm?1.5:1));}

 setTimeout(()=>{sheet(`<h2 class="cen">Your lantern goes out</h2><p class="cen">${STAGES[G.stage].n} · survived ${fmt(G.t)} · ${G.kills} creatures put to rest · level ${G.lv}</p><p class="cen">${IC.shard.replace('<svg','<svg style="width:22px;height:22px;vertical-align:-5px"')} +${sh} shards (you have ${S.shards})</p><p class="cen" style="font-size:15px">Spend shards at the Undertaker to grow stronger for the next night.</p><div class="row cen"><button class="gb hi" id="dA">${IC.play} Try again</button><button class="gb" id="dU">${IC.coffin} Undertaker</button><button class="gb" id="dT">${IC.back} Title</button><button class="gb" id="dH">${IC.home} Go back to games</button></div>`);
  btn('dA',()=>{closeSheet();startRun(G.stage);});btn('dU',()=>{closeSheet();G=null;title();shop();});btn('dT',()=>{closeSheet();G=null;title();});btn('dH',goHub);},1200);}
function stageClear(){if(!G||G.cleared)return;G.cleared=1;const sh=shardsFor(1);S.shards+=sh;S.runs++;S.totalKills+=G.kills;S.bestKills=Math.max(S.bestKills,G.kills);const first=!S.cl[G.stage];S.cl[G.stage]=1;S.clears++;
 if(first)__mgt('m','clear');__mgt('w',()=>STAGES[G.stage].n+(G.bm?' (Blood Moon)':''));if(G.bm&&G.stage===3&&!S.blood){S.blood=1;__mgt('m','blood');}
 let unl='';if(first&&G.stage<3)unl=`<p class="cen"><b>${STAGES[G.stage+1].n}</b> is now open.</p>`;if(first&&G.stage===3)unl='<p class="cen"><b>Blood Moon</b> is now open: every graveyard again, much harder, with more shards.</p>';persist();AU.play(['heroic_adventure','journey_of_hope'],1);
