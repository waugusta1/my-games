/* ---------- layout ---------- */

/* ---------- seeded rng & levels ---------- */

function levelDef(n){const r=mulberry(n*7919+13);const types=n<=8?5:6;const goals=[];const k=n<3?1:n<12?(r()<.5?1:2):(r()<.4?2:3);

  if(crates){const cnt=Math.min(18,6+Math.floor(n*.5));goals.push({k:'crate',n:cnt});}
  while(goals.length<k+(crates?0:0)&&goals.length<3){const t=Math.floor(r()*types);if(used.has(t))continue;used.add(t);goals.push({k:t,n:Math.min(36,10+Math.floor(n*.7)+Math.floor(r()*6))});}
  const total=goals.reduce((a,g)=>a+(g.k==='crate'?g.n*2.2:g.n),0);
  const moves=Math.max(15,Math.round(10+total*.42-Math.min(8,n*.12)));

/* ---------- board state ---------- */

const mk=(t,r,c,s=null)=>({t,s,x:c,y:r,vy:0,id:++uid,pop:0});
const at=(r,c)=>r>=0&&r<N&&c>=0&&c<N?board[r][c]:null;

function startLevel(n){RNG=mulberry(Date.now()%100000+n);L=levelDef(n);moves=L.moves;score=0;goalsLeft=L.goals.map(g=>({...g}));dying=[];parts=[];pops=[];beams=[];sel=null;tool=null;hint=null;idleT=0;
  for(let tries=0;tries<50;tries++){board=[];for(let r=0;r<N;r++){board.push([]);for(let c=0;c<N;c++){let t;do{t=ri(L.types);}while((c>=2&&board[r][c-1].t===t&&board[r][c-2].t===t)||(r>=2&&board[r-1][c].t===t&&board[r-2][c].t===t));board[r].push(mk(t,r,c));}}
    if(L.crates){let placed=0,cap=Math.min(L.crates,18);while(placed<cap){const r=N-1-ri(Math.min(N-2,3+Math.floor(L.n/8))),c=ri(N);if(board[r][c].t<0)continue;const tl=mk(-1,r,c);tl.hp=L.steel&&RNG()<.35?2:1;if(tl.hp===2)tl.t=-2;board[r][c]=tl;placed++;}}
    if(findMove())break;}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const tl=board[r][c];tl.y=r-N-1-(N-r)*.25;tl.vy=0;tl.fall=true;}
  busy=false;state='play';$('hudBtns').hidden=false;$('menuB').hidden=false;updBoost();}

/* ---------- matching ---------- */
function findRuns(){const runs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const tl=board[r][c];if(!fruit(tl)){c++;continue;}let e=c+1;while(e<N&&fruit(board[r][e])&&board[r][e].t===tl.t)e++;if(e-c>=3){const cells=[];for(let k=c;k<e;k++)cells.push([r,k]);runs.push({dir:'h',t:tl.t,cells});}c=e;}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const tl=board[r][c];if(!fruit(tl)){r++;continue;}let e=r+1;while(e<N&&fruit(board[e][c])&&board[e][c].t===tl.t)e++;if(e-r>=3){const cells=[];for(let k=r;k<e;k++)cells.push([k,c]);runs.push({dir:'v',t:tl.t,cells});}r=e;}}
  return runs;}
function wouldMatch(r1,c1,r2,c2){const a=board[r1][c1],b=board[r2][c2];if(!a||!b)return false;if(a.t<0||b.t<0)return false;if(a.t===6||b.t===6)return true;if(a.s&&b.s)return true;

function findMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(c<N-1&&wouldMatch(r,c,r,c+1))return[[r,c],[r,c+1]];if(r<N-1&&wouldMatch(r,c,r+1,c))return[[r,c],[r+1,c]];}return null;}

/* ---------- clearing ---------- */
const key=(r,c)=>r*N+c;
function expand(cells,origin){const set=new Map();const q=[];const add=(r,c,why)=>{if(r<0||r>=N||c<0||c>=N)return;const k=key(r,c);if(set.has(k))return;set.set(k,why);q.push([r,c]);};
  for(const[r,c]of cells)add(r,c,'m');
  while(q.length){const[r,c]=q.shift();const tl=board[r][c];if(!tl||!tl.s||tl.used)continue;tl.used=true;
    if(tl.s==='h'){for(let k=0;k<N;k++)add(r,k,'b');beams.push({k:'h',r,c,life:.45});SFX.line();}
    else if(tl.s==='v'){for(let k=0;k<N;k++)add(k,c,'b');beams.push({k:'v',r,c,life:.45});SFX.line();}
    else if(tl.s==='w'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)add(r+dr,c+dc,'b');beams.push({k:'w',r,c,life:.5,s:1.5});SFX.boom();shake=.25;}
    else if(tl.s==='c'){const t=mostCommon();for(let rr=0;rr<N;rr++)for(let cc=0;cc<N;cc++)if(board[rr][cc]&&board[rr][cc].t===t)add(rr,cc,'b');SFX.rainbow();}}
  return set;}
function mostCommon(){const cnt=[0,0,0,0,0,0];for(const row of board)for(const tl of row)if(fruit(tl))cnt[tl.t]++;let b=0;for(let i=1;i<6;i++)if(cnt[i]>cnt[b])b=i;return b;}
function clearSet(set,keep){combo++;const hitCrates=new Set();
  for(const[k,why]of set){const r=Math.floor(k/N),c=k%N,tl=board[r][c];if(!tl)continue;
    if(tl.t<0){hitCrates.add(k);continue;}
    if(keep&&keep.has(k))continue;
    if(why==='m')for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=at(r+dr,c+dc);if(n&&n.t<0)hitCrates.add(key(r+dr,c+dc));}
    removeTile(r,c,tl);}
  for(const k of hitCrates){const r=Math.floor(k/N),c=k%N,tl=board[r][c];if(!tl||tl.t>=0)continue;tl.hp--;tl.pop=1;SFX.crate();burst(c,r,'#c8904a',8);
    if(tl.hp<=0){board[r][c]=null;dying.push({...tl,life:.3});goal('crate');score+=100;}else tl.t=-1;}
  return set.size;}
function removeTile(r,c,tl){board[r][c]=null;dying.push({...tl,life:.28});const pts=60*combo;score+=pts;goal(tl.t===6?-9:tl.t);burst(c,r,tl.t===6?'#fff':COL[tl.t],6);if(Math.random()<.35)pops.push({x:c,y:r,txt:'+'+pts,life:.7});}
function goal(k){for(const g of goalsLeft)if(g.k===k&&g.n>0){g.n--;if(g.n===0)tone(1568,.2,'triangle',.05);}}
function burst(c,r,col,n){const x=bx+(c+.5)*cs,y=by+(r+.5)*cs;for(let i=0;i<n;i++){const a=Math.random()*TAU,v=cs*(1.5+Math.random()*3);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-cs,life:.4+Math.random()*.3,c:col,s:cs*(.05+Math.random()*.06)});}}

/* ---------- gravity ---------- */
function gravity(){for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--){const tl=board[r][c];if(tl){if(w!==r){board[w][c]=tl;board[r][c]=null;tl.fall=true;}w--;}}
    for(let r=w,k=0;r>=0;r--,k++){const tl=mk(ri(L.types),r,c);tl.y=-1-k-.2;tl.fall=true;board[r][c]=tl;}}}
function atRest(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const tl=board[r][c];if(tl&&(Math.abs(tl.y-r)>.01||Math.abs(tl.x-c)>.01))return false;}return true;}
const settle=()=>new Promise(res=>{const chk=()=>{if(atRest())res();else setTimeout(chk,16);};chk();});
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- turn logic ---------- */
async function resolve(swapCells){let cas=0;
  while(true){const runs=findRuns();if(!runs.length)break;cas++;
    const cellRuns=new Map();for(const run of runs)for(const[r,c]of run.cells){const k=key(r,c);if(!cellRuns.has(k))cellRuns.set(k,[]);cellRuns.get(k).push(run);}
    const makes=new Map();// key -> {t,s}
    const pick=run=>{if(swapCells)for(const[r,c]of swapCells)if(run.cells.some(([a,b])=>a===r&&b===c))return key(r,c);const m=run.cells[Math.floor(run.cells.length/2)];return key(m[0],m[1]);};
    for(const run of runs)if(run.cells.length>=5)makes.set(pick(run),{t:6,s:'c'});
    for(const[k,rs]of cellRuns)if(rs.length>1&&!makes.has(k)&&!rs.some(x=>x.cells.length>=5))makes.set(k,{t:rs[0].t,s:'w'});
    for(const run of runs)if(run.cells.length===4&&!run.cells.some(([r,c])=>makes.has(key(r,c))))makes.set(pick(run),{t:run.t,s:run.dir==='h'?'v':'h'});
    const all=[];for(const run of runs)for(const cl of run.cells)all.push(cl);
    const set=expand(all);
    for(const k of makes.keys())if(set.get(k)==='b')makes.delete(k);
    const keep=new Set(makes.keys());SFX.match(combo);if(cas>1)buzz(10);
    clearSet(set,keep);
    for(const[k,m]of makes){const r=Math.floor(k/N),c=k%N;const tl=mk(m.t,r,c,m.s);tl.pop=1;board[r][c]=tl;SFX.make();}
    if(cas>=3)pops.push({x:N/2-.5,y:N/2-.5,txt:['','','','Sweet!','Juicy!','Fizztastic!','Unbelievable!'][Math.min(6,cas)],life:1.2,big:1});
    swapCells=null;await wait(170);gravity();await settle();}
  combo=0;}
async function trySwap(a,b){if(busy||state!=='play')return;const[r1,c1]=a,[r2,c2]=b;const A=board[r1][c1],B=board[r2][c2];if(!A||!B||A.t<0||B.t<0){SFX.bad();return;}
  busy=true;hint=null;idleT=0;board[r1][c1]=B;board[r2][c2]=A;SFX.swap();await settle();
  // special combos
  if(A.t===6||B.t===6||(A.s&&B.s)){moves--;await comboSwap(A,B,r2,c2,r1,c1);await resolve(null);await endTurn();return;}
  if(!findRuns().length){board[r1][c1]=A;board[r2][c2]=B;SFX.bad();buzz(8);await settle();busy=false;return;}
  moves--;await resolve([[r1,c1],[r2,c2]]);await endTurn();}
async function comboSwap(A,B,ra,ca,rb,cb){let cells=[];
  if(A.t===6&&B.t===6){for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push([r,c]);SFX.rainbow();shake=.5;}
  else if(A.t===6||B.t===6){const bomb=A.t===6?A:B,other=bomb===A?B:A,t=other.t;bomb.used=true;SFX.rainbow();
    cells.push(bomb===A?[ra,ca]:[rb,cb]);

    if(other.s){await wait(380);}}
  else{const[rA,cA]=[ra,ca],[rB,cB]=[rb,cb];A.used=B.used=true;const ws=(A.s==='w')+(B.s==='w');cells.push([rA,cA],[rB,cB]);
    if(ws===2){for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)cells.push([rB+dr,cB+dc]);beams.push({k:'w',r:rB,c:cB,life:.6,s:2.5});SFX.boom();shake=.4;}
    else if(ws===1){for(let d=-1;d<=1;d++)for(let k=0;k<N;k++){cells.push([rB+d,k],[k,cB+d]);}for(let d=-1;d<=1;d++){beams.push({k:'h',r:rB+d,c:cB,life:.5});beams.push({k:'v',r:rB,c:cB+d,life:.5});}SFX.boom();SFX.line();shake=.3;}
    else{for(let k=0;k<N;k++)cells.push([rB,k],[k,cB]);beams.push({k:'h',r:rB,c:cB,life:.5});beams.push({k:'v',r:rB,c:cB,life:.5});SFX.line();}}

async function endTurn(){
  if(done()){movesAtWin=moves;await bonus();return win();}

  if(!findMove()){pops.push({x:N/2-.5,y:N/2-.5,txt:'Shuffle!',life:1.2,big:1});await wait(400);shuffle();await settle();}
  busy=false;}
function shuffle(){const tiles=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const tl=board[r][c];if(fruit(tl)||tl&&tl.t===6)tiles.push(tl);}
  for(let k=0;k<40;k++){for(let i=tiles.length-1;i>0;i--){const j=ri(i+1);[tiles[i],tiles[j]]=[tiles[j],tiles[i]];}let i=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const tl=board[r][c];if(fruit(tl)||tl&&tl.t===6)board[r][c]=tiles[i++];}if(!findRuns().length&&findMove())break;}
  if(!findMove())for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fruit(board[r][c]))board[r][c].t=ri(L.types);}
async function bonus(){if(moves<=0)return;pops.push({x:N/2-.5,y:N/2-.5,txt:'Fizz Bonus!',life:1.4,big:1});SFX.rainbow();await wait(500);
  let left=Math.min(moves,12);while(left-->0){const opts=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const tl=board[r][c];if(fruit(tl)&&!tl.s)opts.push([r,c]);}if(!opts.length)break;const[r,c]=opts[ri(opts.length)];

  const cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]&&board[r][c].s)cells.push([r,c]);
  if(cells.length){const set=expand(cells);clearSet(set);await wait(250);gravity();await settle();await resolve(null);}}

/* ---------- win / lose ---------- */
function starsFor(){return 1+(movesAtWin>=Math.ceil(L.moves*.2)?1:0)+(movesAtWin>=Math.ceil(L.moves*.38)?1:0);}
let movesAtWin=0;
function win(){busy=false;state='won';const st=starsFor();const prev=save.stars[L.n]||0;const gain=prev?Math.max(0,st-prev)*10:10+st*5;save.coins+=gain;save.stars[L.n]=Math.max(prev,st);save.max=Math.max(save.max,L.n+1);persist();SFX.win();buzz([20,40,20]);
  setTimeout(()=>{$('wS').innerHTML=[0,1,2].map(i=>i<st?'<b>★</b>':'★').join('');$('wInfo').textContent='Score '+score.toLocaleString()+'  ·  +'+gain+' coins';$('win').hidden=false;},500);}

  $('lInfo').textContent='So close! Still needed: '+left+'.';$('lMore').disabled=save.coins<40;$('lMore').textContent='+5 moves · ● 40 (you have '+save.coins+')';setTimeout(()=>$('lose').hidden=false,400);}
$('lMore').onclick=()=>{if(save.coins<40)return;save.coins-=40;persist();moves+=5;state='play';$('lose').hidden=true;SFX.make();updBoost();};
$('lRetry').onclick=()=>{$('lose').hidden=true;openIntro(L.n);};
$('lLv').onclick=$('wLv').onclick=()=>{$('lose').hidden=true;$('win').hidden=true;openLevels();};
$('wNext').onclick=()=>{$('win').hidden=true;openIntro(L.n+1);};

/* ---------- boosters ---------- */
function updBoost(){$('hamB').classList.toggle('on',tool==='ham');$('hamB').disabled=save.coins<25&&tool!=='ham';$('shufB').disabled=save.coins<15;}
$('hamB').onclick=()=>{audio();if(busy||state!=='play')return;tool=tool==='ham'?null:(save.coins>=25?'ham':null);SFX.tap();updBoost();};
$('shufB').onclick=async()=>{audio();if(busy||state!=='play'||save.coins<15)return;save.coins-=15;persist();busy=true;shuffle();SFX.rainbow();await settle();busy=false;updBoost();};
async function hammer(r,c){const tl=board[r][c];if(!tl)return;save.coins-=25;persist();tool=null;updBoost();busy=true;shake=.3;SFX.boom();buzz(30);
  if(tl.t<0){tl.hp=1;}const set=expand([[r,c]]);for(const k of set.keys())set.set(k,'b');clearSet(set);await wait(200);gravity();await settle();await resolve(null);await endTurn();}

/* ---------- input ---------- */
let down=null;
const cellAt=(x,y)=>{const c=Math.floor((x-bx)/cs),r=Math.floor((y-by)/cs);return r>=0&&r<N&&c>=0&&c<N?[r,c]:null;};
cv.addEventListener('pointerdown',e=>{audio();if(state!=='play'||busy)return;const cl=cellAt(e.clientX,e.clientY);if(!cl)return;idleT=0;hint=null;
  if(tool==='ham'){hammer(cl[0],cl[1]);return;}
  if(sel&&Math.abs(sel[0]-cl[0])+Math.abs(sel[1]-cl[1])===1){const a=sel;sel=null;trySwap(a,cl);return;}
  sel=cl;SFX.tap();down={x:e.clientX,y:e.clientY,cl};});
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.max(Math.abs(dx),Math.abs(dy))<cs*.35)return;
  const[r,c]=down.cl;const tgt=Math.abs(dx)>Math.abs(dy)?[r,c+Math.sign(dx)]:[r+Math.sign(dy),c];down=null;sel=null;if(tgt[0]<0||tgt[0]>=N||tgt[1]<0||tgt[1]>=N)return;trySwap([r,c],tgt);});

/* ---------- update / render ---------- */
function update(dt){t+=dt;if(board.length)
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const tl=board[r][c];if(!tl)continue;
    if(tl.fall&&tl.y<r){tl.vy+=46*dt;tl.y+=tl.vy*dt;if(tl.y>=r){tl.y=r;tl.vy=0;tl.fall=false;tl.land=.15;}}
    else{tl.fall=false;tl.vy=0;const k=1-Math.exp(-dt*22);tl.y+=(r-tl.y)*k;if(Math.abs(tl.y-r)<.01)tl.y=r;}

function drawTile(tl,x,y,sc){if(tl.t===undefined)return;const s=cs*sc,sp=SPR[tl.t];if(!sp)return;

    ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(px,py,0,px,py,s*.55);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.7,'rgba(255,240,200,0)');g.addColorStop(1,'rgba(255,240,200,.35)');ctx.fillStyle=g;ctx.fillRect(px-s*.6,py-s*.6,s*1.2,s*1.2);ctx.restore();}}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#ffb38a');bg.addColorStop(1,'#ff6a8e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // fizz bubbles
  for(let i=0;i<26;i++){const x=(i*97.3%1)*W,sp=20+(i*13%30),y=H-((t*sp+i*137)%(H+40));ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc((i*0.618*W)%W,y,3+(i%5)*2,0,TAU);ctx.stroke();}
  if(state==='title'||state==='levels'||!L){drawDecor();return;}
  const sx=shake>0?(Math.random()-.5)*shake*cs*.4:0,sy=shake>0?(Math.random()-.5)*shake*cs*.4:0;ctx.save();ctx.translate(sx,sy);
  // board panel
  ctx.fillStyle='rgba(120,30,70,.25)';rr(ctx,bx-8,by-8+6,cs*N+16,cs*N+16,22);ctx.fill();ctx.fillStyle='rgba(255,246,234,.9)';rr(ctx,bx-8,by-8,cs*N+16,cs*N+16,22);ctx.fill();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ctx.fillStyle=(r+c)%2?'rgba(255,200,190,.45)':'rgba(255,225,215,.45)';ctx.fillRect(bx+c*cs,by+r*cs,cs,cs);}
  if(sel){ctx.fillStyle='rgba(255,225,77,.6)';rr(ctx,bx+sel[1]*cs+2,by+sel[0]*cs+2,cs-4,cs-4,cs*.2);ctx.fill();}
  ctx.save();ctx.beginPath();ctx.rect(bx-8,by,cs*N+16,cs*N+8);ctx.clip();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const tl=board[r][c];if(!tl)continue;let sc=1+(tl.pop>0?Math.sin(tl.pop*Math.PI)*.25:0);
    let x=tl.x,y=tl.y;if(hint&&hint.some(([a,b])=>a===r&&b===c)){const o=hint[0][0]===r&&hint[0][1]===c?1:-1;const amt=Math.sin(t*10)*.08*o;if(hint[0][0]===hint[1][0])x+=amt;else y+=amt;}

  ctx.textAlign='center';ctx.textBaseline='middle';for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*2.5);const x=bx+(p.x+.5)*cs,y=by+(p.y+.5)*cs;ctx.font='800 '+(p.big?Math.round(cs*.75):Math.round(cs*.32))+'px "Baloo 2",system-ui,sans-serif';ctx.lineWidth=p.big?7:4;ctx.strokeStyle='#c42450';ctx.strokeText(p.txt,x,y);ctx.fillStyle=p.big?'#ffe14d':'#fff';ctx.fillText(p.txt,x,y);}ctx.globalAlpha=1;

function drawHud(){const top=8;ctx.textBaseline='middle';

function drawDecor(){if(!SPR[0])return;for(let i=0;i<9;i++){const tt=t*.5+i;const x=W*((i*0.37+.07)%1),y=(H*((i*.53)%1)+t*30*(1+i%3))%(H+120)-60;const s=48+(i%3)*14;ctx.save();ctx.translate(x,H-y);ctx.rotate(Math.sin(tt)*.4);ctx.globalAlpha=.85;ctx.drawImage(SPR[i%7===6?6:i%6],-s/2,-s/2,s,s);ctx.restore();}ctx.globalAlpha=1;}
