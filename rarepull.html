function pick(cats,n,r=Math.random,mode='seen'){let pool=DATA.filter(p=>cats.includes(p.c));const k=pool.map(p=>[(mode==='fill'?fill(p)*40:(S.seen[p.id]||0))+r()*2.5,p]);k.sort((a,b)=>a[0]-b[0]);

 for(const [,p] of k){if(out.length>=n)break;if(!out.includes(p))out.push(p);}return shuf(out,r);}
