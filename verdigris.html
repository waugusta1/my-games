function doAttack(){const lev=eqd('lever')?1.33:1;const reach=64*lev;let ax,ay,aw,ah;if(P.atkD===-1){ax=P.x-28;ay=P.y-P.h-reach;aw=56;ah=reach+12;}else if(P.atkD===1){ax=P.x-28;ay=P.y-20;aw=56;ah=reach+20;}else{ax=P.dir>0?P.x:P.x-reach;ay=P.y-52;aw=reach;ah=56;}
 const base=(1+S.temper*.6)*(eqd('over')&&P.hp===1?2:1)*(1);
 const hit=(x,y,w,h)=>ax<x+w&&ax+aw>x&&ay<y+h&&ay+ah>y;
 for(const e of G.ents){if(e.dead||P.atkHit.has(e))continue;
  if(e.type==='shutter'){if(Math.hypot(e.x-P.x,e.y-(P.y-30))<3.1*T&&P.atkD!==undefined){P.atkHit.add(e);if(has('fist')){S.gates[e.key]=1;e.dead=true;SFX.boom();burst(e.x,e.y,28,'#b47a4a',280);G.shake=.25;setLocks(G.b,false);G.ents=G.ents.filter(q=>q.type!=='shutter'&&q.type!=='curtain'&&q.type!=='sealdoor'||q!==e);G.ents=G.ents.filter(q=>q.type!=='shutter'&&q.type!=='curtain'&&q.type!=='sealdoor');for(const k in G.b.R.d){const D=G.b.R.d[k];if(D.g==='fist')addShutter(G.b,k,D);if(D.g==='dash')addCurtain(G.b,k);if(D.g==='springs')addSpringDoor(G.b,k);}save();}else{SFX.clank();burst(e.x,e.y,6,'#ffe9a0',180);openHint('fist');}}continue;}
  if(!e.d)continue;const h=e.d.h,r=e.d.r+4,ey=e.type==='sentry'?e.y:e.d.fly?e.y-h/2-6:e.y-h;
  if(hit(e.x-r,ey,r*2,h+8)){P.atkHit.add(e);hurtEnemy(e,base,P.atkD===1?'above':e.type==='bulwark'&&P.atkD===-1?'face':'x');if(P.atkD===1){P.vy=-620;P.air=0;}else if(!eqd('steady'))P.vx-=P.dir*90;}}

 if(P.atkD===1){const v=tileAt(P.x,P.y+36);if(v===3&&!P.atkHit.has('sp')){P.atkHit.add('sp');P.vy=-620;P.air=0;SFX.clank();burst(P.x,P.y+30,5,'#ffe9a0',160);}}
}

 if(G.hitstop>0){G.hitstop-=dt;return;}
 if(G.bossPending){G.bossPending.t-=dt;if(G.bossPending.t<=0){startBoss(G.bossPending.k);G.bossPending=null;}}
 updP(dt);
 for(const m of G.mov){m.t+=dt;const u=(Math.sin(m.t*.9)+1)/2,nx=lerp(m.x0,m.x1,u);m.vx=(nx-(m.cx==null?nx:m.cx))/dt;m.cx=nx;}

 for(const m of G.crush)m.t+=dt;
 for(const e of G.ents){updEnemy(e,dt);if(e.dashed)e.dashed-=dt;if(e.dashed<=0)e.dashed=0;}
 G.ents=G.ents.filter(e=>!e.dead);
 if(G.boss)bossAI(G.boss,dt);
 /* shots */
 for(const s of G.shots){s.life-=dt;s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.life<=0||s.x<0||s.x>RW*T||s.y>RH*T){s.dead=1;continue;}const v=tileAt(s.x,s.y);if(v===1||v===5){s.dead=1;burst(s.x,s.y,5,s.col,120);continue;}
  if(s.foe){if(P.flash<=0&&Math.abs(s.x-P.x)<P.w+s.r&&s.y>P.y-P.h-s.r&&s.y<P.y+s.r){s.dead=1;hurtP(1,s.x);}}else{for(const e of G.ents){if(!e.d)continue;if(Math.abs(s.x-e.x)<e.d.r+s.r&&Math.abs(s.y-(e.type==='sentry'?e.y+14:e.d.fly?e.y:e.y-e.d.h/2))<e.d.h/2+s.r+4){s.dead=1;hurtEnemy(e,s.dm,'fire');break;}}const b=G.boss;if(b&&!s.dead){const[x,y,w,h]=bossHitbox(b);if(s.x>x&&s.x<x+w&&s.y>y&&s.y<y+h){s.dead=1;b.hp-=s.dm;b.fl=.1;SFX.hit();burst(s.x,s.y,6,'#ffb066',160);if(b.hp<=0)killBoss(b);}}}}
 G.shots=G.shots.filter(s=>!s.dead);
 for(const w of G.waves){w.life-=dt;w.x+=w.dir*w.sp*dt;if(G.parts.length<170)G.parts.push({x:w.x,y:w.y-4,vx:0,vy:-130,l:.3,m:.3,col:'#ffb066',g:300,s:4});if(P.flash<=0&&Math.abs(P.x-w.x)<24&&P.y>w.y-40&&P.dead<=0)hurtP(1,w.x);}
 G.waves=G.waves.filter(w=>w.life>0&&w.x>T*3&&w.x<(RW-3)*T);
 for(const r of G.rings){r.life-=dt;r.r+=r.v*dt;const d=Math.hypot(P.x-r.x,P.y-20-r.y);if(P.flash<=0&&Math.abs(d-r.r)<r.w)hurtP(1,r.x);}
 G.rings=G.rings.filter(r=>r.life>0);
 for(const h of G.beams){h.a+=h.w*dt;if(h.cx==null)continue;const ex=h.cx+Math.cos(h.a)*h.len,ey=h.cy+Math.sin(h.a)*h.len;const dx=ex-h.cx,dy=ey-h.cy,l2=dx*dx+dy*dy;const u=clamp(((P.x-h.cx)*dx+(P.y-20-h.cy)*dy)/l2,.12,1);const qx=h.cx+dx*u,qy=h.cy+dy*u;if(P.flash<=0&&Math.hypot(P.x-qx,P.y-20-qy)<22)hurtP(2,qx);}
 for(const q of G.pick){q.t+=dt;if(q.t<=.3||!(Math.hypot(P.x-q.x,P.y-20-q.y)<110||eqd('magnet'))){q.vy+=1500*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;const v=tileAt(q.x,q.y+6);if((v===1||v===2)&&q.vy>0){q.y=Math.floor((q.y+6)/T)*T-6;q.vy*=-.35;q.vx*=.7;}}}
 G.pick=G.pick.filter(q=>!q.dead);
 for(const p of G.parts){p.l-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}G.parts=G.parts.filter(p=>p.l>0);
 G.shake=Math.max(0,G.shake-dt);
 /* interact prompt */
 let u=null;for(const p of G.props){if(Math.abs(p.x-P.x)<46&&Math.abs(p.y-P.y)<70){u=p;break;}}
 G.near=u;const ub=$('use');if(u&&(u.k==='post'||u.k==='npc'||u.k==='card'||u.k==='altar'||u.k==='heart'||u.k==='mod')){ub.hidden=false;ub.textContent={post:'Wind',npc:'Speak',card:'Read',altar:'Take',heart:'Take',mod:'Take'}[u.k];}else ub.hidden=true;
 if(u&&u.k==='drop'){S.cogs+=u.n;S.drop=null;G.props=G.props.filter(q=>q!==u);SFX.up();banner('Recovered',u.n+' cogs');}
}

const CARDS=[
['Undercroft','Boiler log, day 1','They have hired me to stoke the Sixth Boiler. The pay is good. The city above is the finest thing men have made and I am told it will never stop.'],
['Undercroft','Lamplighter guild notice','All wicks to report for winding at the hour bell. A wick that lets a street go dark will be drawn down and reissued. Remember: dark streets are how a city forgets itself.'],
['Undercroft','Boiler log, day 4,015','The Horologist came to inspect us. Thin man, Ansel Veyre. He put his ear to the boiler like a doctor and asked if it hurt. I laughed. He did not.'],
['Undercroft','Child\'s school card','Why is there no sun in Verdigris? Because Mister Veyre built us a better one. It comes up when it is told and it has never once been late.'],
['Undercroft','Boiler log, final','They say the people have gone up the mountain road. I will wait. Someone has to feed her. She gets so cold.'],
['Undercroft','Odalys\'s ledger','Sold: one left hand. Bought: one left hand. Everyone down here is the same six hundred parts, passed around. I keep the books so nobody forgets whose they were.'],
['Galleries','Painter\'s note','Copper goes green in the wet. The council wanted it polished. I told them to leave it. It is the only thing in this city that has been allowed to grow old.'],
['Galleries','Tinsmith\'s diary I','Made a moth out of a roof gutter, for my daughter. She laughed so hard. Made it bigger for her birthday.'],
['Galleries','Tinsmith\'s diary II','She has gone up the road with the others. I do not know how to stop making them. The moth has started bringing me pieces of the roof.'],
['Galleries','Council minute 212','Motion: the Orrery runs eleven minutes slow. Mr. Veyre assures us this cannot be seen by the public. Motion carried that it cannot be seen.'],
['Galleries','Cartographer\'s margin','Pell here. Corridors move when nobody is walking them, or else I am a poor cartographer. Both are possible. Added to the map anyway.'],
['Galleries','Love letter, unsent','Meet me in the green gallery when the sun goes down. I know it goes down when he says. I still think it is beautiful. I still think you are.'],
['Cistern','Waterworks bulletin','Do not be alarmed. The lower wards are being flooded in an orderly fashion. Residents should collect their belongings and any parts they are fond of.'],
['Cistern','Pump engineer\'s note','We set it to drink and never told it when to stop. Everything Veyre builds is like that. He does not believe in the word enough.'],
['Cistern','Marrow, written on slate','I was a diver. Then I was a diving bell. Then I was a very old diving bell who remembers being a diver. Ask me for the difference, I have the time.'],
['Cistern','Prayer scratched in tile','Let the water come up. Let it take the clocks first.'],
['Cistern','Engineer\'s last note','Found what he has been pumping out of the deep wards. Not water. Time, he calls it; he means the mountain\'s heat. Every hour that sun burned, the rock below got colder. It is nearly out.'],
['Foundry','Pour schedule','Tonight: forty door hinges, nine hundred bolts, one knight. The knight is for Mr. Veyre. He says the city needs someone who will not leave.'],
['Foundry','Gant\'s ledger page','Lift\'s been stuck since before I was forged. I keep the rope oiled. You think that is sad. It is the only good day I know how to have, and I get it every day.'],
['Foundry','Forge-master\'s complaint','The Knight will not stop guarding. I ordered it to stand down. It asked me what I was, and I said a person, and it asked to see my maker\'s mark.'],
['Foundry','Veyre\'s invoice','One furnace-heart, unlicensed. One set of hands, to fit a man of my height. Bill to the Orrery fund. Tell no one on the council who they are for.'],
['Foundry','Scratched on crucible','Nobody told the fire the people left.'],
['Spire','Sister Ohm\'s rule','We ring so that it is known. Not so that it is true. A bell is an honest thing: it only tells you someone was pulling the rope.'],
['Spire','The last council minute','Motion: leave. Carried nineteen to one. Mr. Veyre asked that his dissent be recorded, then asked what day it was. Nobody had the heart to tell him we could not know, now.'],
['Spire','Veyre\'s journal I','I was given a dying city under a mountain with no sky. I gave it noon. I gave children noon. I will not apologize for noon.'],
['Spire','Veyre\'s journal II','Hands fitted. The left shakes less than the old one did. If I do not sleep I think I can tend it alone. It needs only someone who will not stop.'],
['Spire','Veyre\'s journal III','Five mainsprings, sealed with five keepers, so that no one tired can come and do something kind. I have thought of everyone. I have thought of myself most of all.'],
['Spire','Veyre\'s journal IV','I wound a last wick tonight. A small lamplighter. I don\'t know why. There are no streets. I think I wanted to see one lit by someone who was not me.'],
['Orrery','Brass plate, unsigned','You were not built to fight. You were built to walk down a dark road and leave it brighter than you found it. Whatever else they tell you.'],
['Orrery','Daughter\'s card','Dear Mister Veyre. We got to the top of the road. There is a real one up here. It is late sometimes. You should come see. It is really something.']];
