    let sc=land*.02;if(hit&&hit.t===j.cur)sc+=20+j.cur*2;else if(hit&&hit.t>=0)sc-=Math.abs(hit.t-j.cur)*2;if(hit&&hit.t<0)sc-=4;sc+=R()*(diff===0?14:diff===1?5:1);if(sc>bs){bs=sc;best=x;}}
  j.aim=best;j.cpuT=[1.6,1.05,.7][diff]+R()*.4;drop(j);}

/* ---------- rounds ---------- */
function startRound(){J=[newJar(0),newJar(1)];parts=[];state='play';$('title').hidden=true;$('over').hidden=true;[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.06,0,i*.1));}
function roundOver(w){if(state!=='play')return;state='end';rounds[w]++;const champ=rounds[w]>=2;
  [523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.07,0,i*.1));buzz([30,40,60]);
  if(champ){if(nPlayers===2)save.w[w]++;else if(w===0)save.cpu=(save.cpu||0)+1;persist();}
  setTimeout(()=>{const nm=nPlayers===1&&w===1?'Computer':COLS[w].name;$('wTitle').textContent=champ?(nPlayers===1?(w===0?'You beat the computer!':'The computer wins the match!'):'🏆 '+nm+' wins the match!'):nm+' wins the round!';$('wTitle').style.color=COLS[w].c;
    $('wScore').textContent='Rounds: Pink '+rounds[0]+' – '+rounds[1]+' '+(nPlayers===1?'Computer':'Green')+(champ?'':' · first to 2 rounds wins');$('next').textContent=champ?'New match':'Next round';if(champ)rounds=[0,0];$('over').hidden=false;},1300);}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{nPlayers=+b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.className='btn '+(x===b?'on':'ghost'));$('cpuLv').hidden=nPlayers!==1;tone(700,.06);});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{diff=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.className='btn '+(x===b?'on':'ghost'));tone(700,.06);});
$('go').onclick=()=>{audio();rounds=[0,0];startRound();};$('next').onclick=()=>{audio();startRound();};
$('home').onclick=()=>{rounds=[0,0];$('over').hidden=true;$('title').hidden=false;state='title';updTitle();};
function updTitle(){$('wins').textContent=(save.w[0]||save.w[1])?'Matches won · Pink '+save.w[0]+' – '+save.w[1]+' Green'+(save.cpu?' · beat the computer '+save.cpu+'×':''):'';}

/* ---------- input ---------- */
const ptr=new Map();
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(state!=='play')return;for(const i of[0,1]){const j=J[i];if(j.cpu||!inJar(i,e.clientX,e.clientY))continue;ptr.set(e.pointerId,i);j.aim=toLocal(i,e.clientX,e.clientY).x;j.aiming=true;}});
addEventListener('pointermove',e=>{const i=ptr.get(e.pointerId);if(i===undefined||state!=='play')return;J[i].aim=toLocal(i,e.clientX,e.clientY).x;});
addEventListener('pointerup',e=>{const i=ptr.get(e.pointerId);if(i===undefined)return;ptr.delete(e.pointerId);if(state==='play'){J[i].aiming=false;drop(J[i]);}});
addEventListener('pointercancel',e=>{const i=ptr.get(e.pointerId);if(i!==undefined){J[i].aiming=false;ptr.delete(e.pointerId);}});

/* ---------- render ---------- */
function drawJar(j){const c=jarCenter(j.i),col=COLS[j.i];ctx.save();ctx.translate(c.x+(j.shake?(R()-.5)*j.shake*8:0),c.y);ctx.scale(k,k);if(c.rot)ctx.rotate(Math.PI);ctx.translate(-JW/2,-JH/2);
  // glass
  ctx.fillStyle='rgba(255,255,255,.06)';rr(-10,-6,JW+20,JH+16,26);ctx.fill();ctx.strokeStyle=col.c;ctx.globalAlpha=.55;ctx.lineWidth=4;rr(-10,-6,JW+20,JH+16,26);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.09)';ctx.fillRect(6,10,10,JH-30);
  // danger line
  const dk=clamp(j.danger/2.6,0,1);ctx.strokeStyle=dk>0?`rgba(255,${Math.round(120-dk*100)},${Math.round(120-dk*100)},${.5+dk*.5})`:'rgba(255,255,255,.25)';ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,TOP);ctx.lineTo(JW,TOP);ctx.stroke();ctx.setLineDash([]);
  if(dk>0){ctx.fillStyle=`rgba(255,60,60,${dk*.18})`;ctx.fillRect(0,0,JW,TOP);ctx.font='700 18px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#ff8a8a';ctx.fillText('Overflowing! '+Math.max(0,2.6-j.danger).toFixed(1),JW/2,TOP-12);}
  // aim line & current
  if(state==='play'&&!j.lost){const r=T[j.cur].r,x=clamp(j.aim,r+6,JW-r-6);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(x,TOP*.35);ctx.lineTo(x,JH);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=j.cool>0?.4:1;drawSpr(j.cur,x,TOP*.35,0);ctx.globalAlpha=1;}
  for(const b of j.B)drawSpr(b.t,b.x,b.y,b.sq);
  // particles
  for(const p of parts)if(p.j===j.i){ctx.globalAlpha=Math.min(1,p.life/p.max*1.5);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();}ctx.globalAlpha=1;
  if(j.flash>0){ctx.fillStyle=`rgba(255,240,180,${j.flash*.4})`;ctx.fillRect(0,0,JW,JH);}
  // HUD inside jar frame (bottom of jar, outside)
  ctx.textAlign='left';ctx.font='700 22px Fredoka,system-ui,sans-serif';ctx.fillStyle=col.c;ctx.fillText((j.cpu?'Computer':col.name)+' · '+j.score,0,-18);
  ctx.textAlign='right';ctx.font='600 15px Fredoka,system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('next',JW-40,-20);ctx.save();ctx.translate(JW-14,-26);const ns=T[j.next].r>18?18/T[j.next].r:1;ctx.scale(ns,ns);drawSpr(j.next,0,0,0);ctx.restore();
  if(j.weeds>0){ctx.textAlign='center';ctx.font='700 17px Fredoka,system-ui,sans-serif';ctx.fillStyle='#d8e8a0';ctx.fillText('🌿 '+j.weeds+(j.weeds>1?' weeds':' weed')+' incoming!',JW/2,TOP*.75+40);}
  if(j.combo>=2&&j.comboT>0){ctx.textAlign='center';ctx.font='700 22px Fredoka,system-ui,sans-serif';ctx.fillStyle='#ffe066';ctx.fillText('Combo ×'+j.combo,JW/2,JH*.45);}
  if(j.lost){ctx.fillStyle='rgba(30,10,30,.55)';ctx.fillRect(0,0,JW,JH);ctx.textAlign='center';ctx.font='700 36px Fredoka,system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText('Overflow!',JW/2,JH/2);}
  ctx.restore();}
function drawSpr(t,x,y,sq){const r=t<0?16:T[t].r,s=SPR[t],sz=r*2+12,q=1+Math.sin(sq*10)*sq*.12;ctx.save();ctx.translate(x,y);ctx.scale(q,2-q);ctx.drawImage(s,-sz/2,-sz/2,sz,sz);ctx.restore();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3a1e4a');g.addColorStop(.5,'#5a2a5a');g.addColorStop(1,'#2a1838');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<30;i++){const x=(i*97.3+t*8)%W,y=(i*53.1+Math.sin(t+i)*20)%H;ctx.fillStyle=`rgba(255,230,150,${.2+.2*Math.sin(t*2+i)})`;ctx.beginPath();ctx.arc(x,y,2,0,TAU);ctx.fill();}
  if(state==='title')return;
  for(const j of J)drawJar(j);
  // flying weeds between jars
  for(const p of parts)if(p.fly){const a=jarCenter(p.from),b=jarCenter(p.to),q=1-p.life;const x=lerp(a.x,b.x,q),y=lerp(a.y,b.y,q)-Math.sin(q*Math.PI)*120;ctx.font='28px system-ui';ctx.textAlign='center';ctx.fillText('🌿',x,y);}
  if(portrait){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([6,10]);ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);}
  ctx.textAlign='center';ctx.font='700 15px Fredoka,system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.7)';const rs='Round wins: '+rounds[0]+' – '+rounds[1];if(portrait){ctx.save();ctx.translate(W-10,H/2);ctx.rotate(-Math.PI/2);ctx.fillText(rs,0,0);ctx.restore();}else ctx.fillText(rs,W/2,20);}
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;
  if(state==='play'||state==='end'){for(const j of J)if(state==='play')updateJar(j,dt);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}if(!p.fly){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;}}
  render();requestAnimationFrame(frame);}
resize();updTitle();requestAnimationFrame(frame);
window.__bb2={get s(){return{state,rounds,jars:J.map(j=>({n:j.B.length,score:j.score,weeds:j.weeds,lost:j.lost,danger:j.danger}))}},allCpu(){J.forEach(j=>j.cpu=true);}};
})();

});</script>
