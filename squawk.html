<style>
:root{--deck:#0c1116;--deck2:#141b22;--deck3:#1d2730;--edge:#2c3a46;--txt:#c9d6df;--dim:#7c8f9d;--amber:#ffb238;--cyan:#6fdcff;--green:#7dfba6;--red:#ff4d45;--paper:#e8e2cf;--paper2:#cfc8b1;--ink:#20252a;
--mono:Menlo,"SF Mono",Consolas,"DejaVu Sans Mono",monospace;--disp:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Liberation Sans Narrow",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#05080b;overflow:hidden;position:fixed;inset:0;font-family:var(--mono);color:var(--txt)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;touch-action:manipulation;cursor:pointer}

.kb.warn{background:linear-gradient(180deg,#8a3b25,#5f2717);box-shadow:inset 0 1px 0 #c0654a}
.kb.big{font-size:18px;font-weight:700;min-height:44px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:5px}
.kgrid.two{grid-template-columns:1fr 1fr}
.kb.hl{outline:2px solid var(--green);outline-offset:-2px}
.note{font:14px/1.34 var(--disp);color:var(--txt);margin:0 0 7px}

.lgnd{display:flex;align-items:center;gap:6px;font:13px var(--disp);color:var(--txt);margin:3px 0}
.lgnd i{width:12px;height:12px;border-radius:2px;display:block;flex:none}
/* overlay */
#ov{position:absolute;inset:0;display:none;z-index:20;background:#06090cde;overflow:hidden}
#ov.on{display:block}
#ov.solid{background:#070b0f}

.pan{width:100%;max-width:920px;background:linear-gradient(180deg,#171f26f4,#10161bf4);border:1px solid var(--edge);border-radius:4px;box-shadow:0 12px 40px #000c;margin:auto 0}

.pb{padding:12px 14px 14px}

.btn.pri{background:linear-gradient(180deg,#d98f18,#a5690a);color:#180f00;box-shadow:inset 0 1px 0 #ffcb70}

.ttl{margin:auto;width:min(100%,520px);display:flex;flex-direction:column;align-items:stretch;text-align:center}

.row{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:#0b1116;border:1px solid var(--edge);border-radius:3px;padding:8px 10px;min-height:56px;margin-top:6px}

@media (orientation:portrait){

}

<script>

const fl=a=>String(Math.round(a/100)).padStart(3,'0');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* Aircraft: real published lengths and spans in metres. wake L/M/H/S. app = approach speed kt, clb = climb ft/min */

const TAPES=[
 'MANAGUA. Primary target, no flight plan.\n\n"...Managua tower, Tango four one nine, Bluefields mail, level four thousand. Say altimeter. Managua, how do you read?"\n\nThe tape from 1969 has this same call on it. Word for word.',
 'BRADLEY. Primary target, squawk 0419.\n\n"Hartford, I don\'t know you. I am looking for the lights at Managua. Is there a young woman on your frequency? Very serious. Reads back everything twice."',
 'SAN JOSE. Primary target, squawk 0419.\n\n"Fog to the top of the mountains. Beautiful, really. The port engine stopped a while ago and it doesn\'t seem to matter. Tango four one nine, still level."',
 'MIAMI. Primary target, squawk 0419.\n\n"All these lights. When did they build all these lights? I have the mail for Bluefields, I think I should keep going. Say again, what year is it there? Never mind."',
 'HEATHROW. Primary target, squawk 0419.\n\n"Four stacks and not one of them will talk to me. That\'s fine. Inés told me: Rubén, if you lose me, keep flying the heading I gave you until somebody gives you another."',
 'HANEDA. Primary target, squawk 0419.\n\n"So I kept the heading. Nobody gave me another. Tango four one nine. Somebody please, a new heading."',
 'ATLANTA. Primary target, squawk 0419.\n\n"There is a voice I keep nearly catching, always one airport ahead of me. She sounds tired now. She sounds a lot older than she should."',
 'KAI TAK. Target squawking 0419, then voice. Clear as a bell.\n\n"Hong Kong approach, Tango four one nine, DC-3. I can see a checkerboard on a hill. Inés said you would give me a heading."',

const LETTERS=[
 'To whoever gets this chair next,\n\nThis binder comes with the seat. Nobody at the facility will tell you that, because nobody remembers why. My name is Inés Arauz. I started on this scope at Managua in 1969, and on my ninth night I gave my brother Rubén a heading in fog and never heard him again. Tango 419. A DC-3 with the Bluefields mail.\n\nThey never found it. If you see it, write it down. Then keep working. Your traffic is real.',

 'To the next chair,\n\nSan José, 1981. I took this post because of the mountains. If he came down anywhere, I thought, it was somewhere like this. Learn your minimum altitudes the way you learn your mother\'s phone number. I was a careful controller before that night. Afterwards I was the most careful one you ever met. It is not the same as being at peace.',
 'To the next chair,\n\nMiami, 1986. A young man asked me how I stay so calm with storms on the scope. I told him that the weather isn\'t personal. I have read the tapes from every field. He is not repeating himself. He is getting further along. He is still flying, and he knows it now. I do not know what you are supposed to do with information like that.',

 'To the next chair,\n\nAtlanta, 1997. I am old and my hands are not steady, and they have been very kind about it. There is an airport in Hong Kong that closes for good next summer. Its last night has been recorded for the simulators, every target and every word. I have filed the tapes in the back of this binder. You will find something on them that was not there the first time they were played.\n\nI can\'t run it. My eyes are not good enough for that approach. You can. Finish the book.',

function cmdSpd(p,d){if(p.nordo)return;p.ts=clamp(p.ts+d,T[p.t].app+10,320);queue(p,'s',p.ts);sfx('key');}
function cmdDir(p,f){if(p.nordo)return;p.mode='dir';p.fix=f;if(p.k==='arr')p.rw=null;say('c',`${p.cs}: Proceed direct ${f}.`);radio(`Direct ${f.split('').join(' ')}, ${p.spk}.`,p);sfx('tick');}

function cmdIls(p,en){if(p.nordo)return;const e=endByName(en),r=canIntercept(p,e);if(!r.ok){say('p',`${p.cs}: Unable ILS ${en}, ${r.why}.`);radio(`Unable, ${r.why}, ${p.spk}.`,p);toast(`${p.cs} unable ILS ${en}: ${r.why}`,'a');return false;}
 flushCmd(p);p.mode='ils';p.rw=en;p.fix=null;p.prevX=undefined;if(p.th===undefined)p.th=p.hdg;say('c',`${p.cs}: Cleared ILS runway ${en}.`);radio(`Cleared I L S ${spokenRw(en)}, ${p.spk}.`,p);sfx('tick');return true;}
function cmdCancel(p){if(p.mode==='ils'||p.mode==='loc'){if(p.mode==='loc'&&p.alt<ap().elev+3000)p.ta=Math.ceil((ap().elev+3000)/1000)*1000;else p.ta=Math.round(p.alt/1000)*1000;p.mode='hdg';p.th=p.hdg;p.rw=null;p.ts=210;say('c',`${p.cs}: Cancel approach clearance, maintain heading ${pad3(p.hdg)}.`);radio(`Cancel approach, heading ${digits(pad3(p.hdg))}, ${p.spk}.`,p);sfx('tick');}}

const stepper=(k,lbl,p)=>`<div class="stp"><button class="kb big" data-c="${k}-" aria-label="${lbl} down">-</button><div><small>${lbl}</small><span id="v_${k}">-</span></div><button class="kb big" data-c="${k}+" aria-label="${lbl} up">+</button></div>`;

 const set=(i,t)=>{const e=$(i);if(e&&e.textContent!==t)e.textContent=t;};
 set('v_alt',fl(p.ta)+(Math.abs(p.ta-p.alt)>50?'  ('+fl(p.alt)+')':''));
 set('v_spd',String(Math.round(p.ts))+(Math.abs(p.ts-p.spd)>4?'  ('+Math.round(p.spd)+')':''));
 set('cWait',Math.round(p.wait)+'s');set('cAlt2',Math.round(p.alt)+' ft');
 if($('cDst')&&p.rw){const e=endByName(p.rw),g=apr(p,e);set('cDst',Math.max(0,g.dist).toFixed(1)+' nm');}

let roseDrag=null;
function drawRose(p){const cv=$('rose');const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=V.dpr;const sz=Math.round(r.width*dpr);if(cv.width!==sz){cv.width=cv.height=sz;}const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const w=r.width,cc=w/2,R=cc-2;c.clearRect(0,0,w,w);
 c.fillStyle='#06090c';c.beginPath();c.arc(cc,cc,R,0,7);c.fill();c.strokeStyle='#33424e';c.lineWidth=2;c.stroke();
 c.textAlign='center';c.textBaseline='middle';
 for(let b=0;b<360;b+=10){const v=vec(b),maj=b%30===0;c.strokeStyle=maj?'#a9bdca':'#4a5c69';c.lineWidth=maj?1.6:1;c.beginPath();c.moveTo(cc+v[0]*(R-1),cc-v[1]*(R-1));c.lineTo(cc+v[0]*(R-(maj?10:5)),cc-v[1]*(R-(maj?10:5)));c.stroke();if(b%90===0){c.fillStyle='#d7e3ea';c.font=`bold ${w*.075}px Menlo,monospace`;c.fillText(({0:'N',90:'E',180:'S',270:'W'})[b],cc+v[0]*(R-21),cc-v[1]*(R-21));}}
 const th=roseDrag!==null?roseDrag:p.th;const vt=vec(th),vh=vec(p.hdg);
 c.strokeStyle='#ffb238';c.lineWidth=3.2;c.lineCap='round';c.beginPath();c.moveTo(cc+vt[0]*20,cc-vt[1]*20);c.lineTo(cc+vt[0]*(R-13),cc-vt[1]*(R-13));c.stroke();c.fillStyle='#ffb238';c.beginPath();c.arc(cc+vt[0]*(R-13),cc-vt[1]*(R-13),6.5,0,7);c.fill();
 c.strokeStyle='#6fdcff';c.lineWidth=2;c.beginPath();c.moveTo(cc+vh[0]*20,cc-vh[1]*20);c.lineTo(cc+vh[0]*(R-30),cc-vh[1]*(R-30));c.stroke();c.lineCap='butt';
 c.fillStyle='#ffb238';c.font=`bold ${w*.135}px Menlo,monospace`;c.fillText(pad3(th),cc,cc);}
function bindRose(){const cv=$('rose');if(!cv)return;const ang=e=>{const r=cv.getBoundingClientRect();return brg(r.left+r.width/2,-(r.top+r.height/2),e.clientX,-e.clientY);};
 cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}roseDrag=Math.round(ang(e)/5)*5%360;};
 cv.onpointermove=e=>{if(roseDrag===null)return;const n=Math.round(ang(e)/5)*5%360;if(n!==roseDrag){roseDrag=n;sfx('key');}const p=S.planes.find(q=>q.id===sel);if(p)drawRose(p);};

 else if(c.startsWith('ils:'))cmdIls(p,c.slice(4));else if(c.startsWith('to:')){const e2=endByName(c.slice(3));if(!runwayBusy(e2)){takeoff(p,c.slice(3));}}

/* scope touch */
function planeAt(x,y){let best=null,bd=1e9;for(const p of S.planes){if(p.st==='gnd')continue;const px=PX(p.x),py=PY(p.y);let d=Math.hypot(px-x,py-y);if(p._r&&x>=p._r[0]-3&&x<=p._r[0]+p._r[2]+3&&y>=p._r[1]-2&&y<=p._r[1]+p._r[3]+2)d=Math.min(d,14);if(d<34&&d<bd){bd=d;best=p;}}return best;}
function dragTarget(d,p){d.fix=null;d.ils=null;G.dragIls=null;const a=ap();
 for(const f of a.fix){if(Math.hypot(PX(f.x)-d.x,PY(f.y)-d.y)<26){d.fix=f.n;return;}}
 if(p.k==='arr'){let best=null,bd=24;for(const e of activeEnds()){const g=apr({x:NX(d.x),y:NY(d.y)},e);if(g.along>1.5&&g.along<20){const px=Math.abs(g.xtk)*V.k;if(px<bd){bd=px;best=e;}}}if(best){d.ils=best.n;G.dragIls=best.n;}}}
sc.addEventListener('pointerdown',e=>{if(!S||G.paused)return;ac();const r=sc.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 try{sc.setPointerCapture(e.pointerId);}catch(_){}
 if(S.ghost){const g=S.ghost;if(Math.hypot(PX(g.x)-x,PY(g.y)-y)<40){catchGhost();return;}}
 const p=planeAt(x,y);G.drag={id:p?p.id:null,sx:x,sy:y,x,y,on:false};});
sc.addEventListener('pointermove',e=>{const d=G.drag;if(!d||d.id===null)return;const r=sc.getBoundingClientRect();d.x=e.clientX-r.left;d.y=e.clientY-r.top;if(!d.on&&Math.hypot(d.x-d.sx,d.y-d.sy)>13)d.on=true;if(d.on){const p=S.planes.find(q=>q.id===d.id);if(p){dragTarget(d,p);if(sel!==p.id){sel=p.id;G.sub=null;}}}});
sc.addEventListener('pointerup',e=>{const d=G.drag;G.drag=null;G.dragIls=null;if(!d||!S)return;if(!d.on){if(d.id===null){if(sel){sel=null;}return;}select(d.id);return;}
 const p=S.planes.find(q=>q.id===d.id);if(!p||p.st!=='air'||p.nordo)return;
 if(p.mode==='loc'){toast(p.cs+' is established. Use cancel to break it off.','a');return;}
 const b=brg(p.x,p.y,NX(d.x),NY(d.y));
 if(d.fix){cmdDir(p,d.fix);return;}
 if(d.ils){p.mode='hdg';p.th=Math.round(b/5)*5%360;if(cmdIls(p,d.ils)===false){cmdHdg(p,b);}return;}
 cmdHdg(p,b);});

const TUT=[
 ['An arrival is on your scope. Tap the aircraft, or its paper strip on the left.'],
 ['This is your console. It is too high for the approach. Press ALTITUDE minus until it reads 040 (four thousand feet).'],
 ['See the blue dashed line? That is the approach to runway 10. Drag from the aircraft to the blue line and let go, or just press the ILS 10 button. The pilot will intercept and fly it down.'],
 ['It will now land on its own. Your job is to keep it clear of everyone else. Press x2 at the top if you want to speed up time.'],
 ['A departure is waiting. Look at OUTBOUND, bottom left. Tap its strip.'],
 ['Press TAKEOFF when the runway is clear.'],
 ['Rolling. Once it is airborne, tap it and send it to its exit: press DIRECT, then the fix marked in green. Or drag from it to the green circle.'],
 ['The strip says what altitude it must reach before it leaves. Raise ALTITUDE until it is at or above that number.'],

function tutStep(){const s=S;if(s.tutN===undefined){s.tutN=0;s.tutGate=0;showCoach();}
 const elev=ap().elev;const A=s.planes.find(p=>p.id===1),Dp=s.planes.find(p=>p.k==='dep');let n=s.tutN,done=false;
 if(n===0)done=A&&sel===A.id;
 else if(n===1)done=!A||A.ta<=4000;
 else if(n===2)done=!A||A.mode==='ils'||A.mode==='loc';
 else if(n===3){if(s.handled>=1){done=true;s.tutGate=1;}}
 else if(n===4)done=Dp&&sel===Dp.id;
 else if(n===5)done=!Dp||Dp.st!=='gnd';
 else if(n===6)done=!Dp||Dp.mode==='dir';
 else if(n===7)done=!Dp||Dp.ta>=Dp.exAlt;
 else if(n===8){if(s.handled>=2){done=true;}}
 if(done){s.tutN++;if(s.tutN>=TUT.length){endTut();return;}s.coachOff=false;showCoach();}
}
function endTut(){const s=S;s.tutOn=false;SV.tutDone=true;persist();let t=s.t+6;s.sched.forEach(i=>{if(!i.done){i.t=t;t+=30;}delete i.gate;});const c=$('coach');c.style.display='block';c.innerHTML=`<b>YOU HAVE THE SCOPE</b>More are coming. Keep them 3 miles or 1000 feet apart. Amber means a conflict is predicted, red is a strike. Three strikes and you are relieved.<button data-x aria-label="Close">${I.x}</button>`;setTimeout(()=>{if($('coach').querySelector('b')&&$('coach').querySelector('b').textContent==='YOU HAVE THE SCOPE')$('coach').style.display='none';},11000);}
function showCoach(){const c=$('coach'),s=S;if(s.coachOff){c.style.display='none';return;}c.style.display='block';c.innerHTML=`<b>INES, YOUR TRAINER  ${s.tutN+1}/${TUT.length}</b>${TUT[s.tutN][0]}<button data-x aria-label="Close">${I.x}</button>`;}

const at=$('attract'),AX=at.getContext('2d');const blips=Array.from({length:7},(_,i)=>({a:i*.9+.4,r:330+i*44,s:.02+i*.005}));
function drawAttract(now){const w=innerWidth,h=innerHeight;if(at.width!==w){at.width=w;at.height=h;}const c=AX;c.fillStyle='#050a10';c.fillRect(0,0,w,h);const cx=w/2,cy=h/2,R=Math.max(w,h)*.62;c.strokeStyle='#14283a';c.lineWidth=1;for(let r=70;r<R;r+=70){c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();}
 const t=now/1000,sa=t*.5%6.283;const g=c.createConicGradient?c.createConicGradient(sa-1.57-.6,cx,cy):null;if(g){g.addColorStop(0,'rgba(90,190,240,0)');g.addColorStop(.095,'rgba(90,190,240,.16)');g.addColorStop(.096,'rgba(90,190,240,0)');c.fillStyle=g;c.fillRect(0,0,w,h);}
 c.font='11px Menlo,monospace';blips.forEach((b,i)=>{b.a+=b.s/60;const x=cx+Math.cos(b.a)*b.r,y=cy+Math.sin(b.a)*b.r*.7;c.fillStyle='#3f8fb8';c.save();c.translate(x,y);c.rotate(b.a+3.14);c.beginPath();c.moveTo(0,-7);c.lineTo(5,5);c.lineTo(0,3);c.lineTo(-5,5);c.closePath();c.fill();c.restore();c.fillText(AIR[i][0]+(214+i*37),x+10,y-9);});}

 if(G.mode==='play'&&S){

 }else if($('ov').classList.contains('solid'))drawAttract(now);
