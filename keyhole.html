 if(!S.gem){const cx=px(L.gem[0])+T/2,cy=py(L.gem[1])+T/2,r=T*.3,pu=1+Math.sin(ts/260)*.07;X.save();X.translate(cx,cy);X.scale(pu,pu);X.fillStyle='rgba(120,240,255,.25)';X.beginPath();X.arc(0,0,r*1.45,0,7);X.fill();X.fillStyle='#57dcf2';X.beginPath();X.moveTo(-r,-r*.25);X.lineTo(-r*.55,-r*.8);X.lineTo(r*.55,-r*.8);X.lineTo(r,-r*.25);X.lineTo(0,r);X.closePath();X.fill();X.strokeStyle='#e8fdff';X.lineWidth=1.4;X.beginPath();X.moveTo(-r,-r*.25);X.lineTo(r,-r*.25);X.moveTo(-r*.55,-r*.8);X.lineTo(-r*.3,-r*.25);X.lineTo(0,r);X.lineTo(r*.3,-r*.25);X.lineTo(r*.55,-r*.8);X.moveTo(-r*.3,-r*.25);X.lineTo(0,-r*.8);X.lineTo(r*.3,-r*.25);X.stroke();X.restore();}
 /* cameras */for(const C of L.cams){const cx=px(C.x)+T/2,cy=py(C.y)+T/2;X.save();X.translate(cx,cy);X.rotate(camDir(C,S.step)*Math.PI/2);X.fillStyle=S.emp>0?'#55606b':'#e2e6ea';X.beginPath();X.moveTo(-T*.2,T*.16);X.lineTo(T*.2,T*.16);X.lineTo(T*.13,-T*.28);X.lineTo(-T*.13,-T*.28);X.closePath();X.fill();X.fillStyle=S.emp>0?'#222':'#ff5a4a';X.beginPath();X.arc(0,-T*.14,T*.07,0,7);X.fill();X.restore();}
 /* smoke */for(const c of S.smoke){for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const sx=px(c.x+i)+T/2,sy=py(c.y+j)+T/2;if(blocked(L,c.x+i,c.y+j,S.open))continue;X.fillStyle='rgba(225,232,240,.5)';X.beginPath();X.arc(sx+Math.sin(ts/500+i)*3,sy+Math.cos(ts/640+j)*3,T*.45,0,7);X.fill();}}
 /* guards and thief */for(let i=0;i<L.guards.length;i++){const a=gPos(i);drawThief(X,px(a[0])+T/2,py(a[1])+T/2,T,gDir(i),S.step*.5,'#2e3a48','#d6a57c');const r=gDir(i),[dx,dy]=DIRS[r];X.fillStyle='#ffe58a';X.beginPath();X.arc(px(a[0])+T/2+dx*T*.33+(dy?T*.16:0),py(a[1])+T/2+dy*T*.33+(dx?T*.16:0),T*.055,0,7);X.fill();}
 const k=S.anim>0?1-S.anim:1,ax=S.px+(S.x-S.px)*k,ay=S.py+(S.y-S.py)*k;drawThief(X,px(ax)+T/2,py(ay)+T/2,T,S.face,S.walk*.5,'#0d1218','#26313d','#ff5a4a');
 if(S.arm){X.strokeStyle='#ffd75e';X.setLineDash([5,4]);X.lineWidth=2;X.strokeRect(ox,oy,L.w*T,L.h*T);X.setLineDash([]);}
 /* tap hints */if(!S.over&&!S.arm){X.strokeStyle='rgba(255,255,255,.38)';X.lineWidth=1.5;for(const[dx,dy]of DIRS){const x=S.x+dx,y=S.y+dy;if(!blocked(L,x,y,S.open))X.strokeRect(px(x)+3,py(y)+3,T-6,T-6);}}
 if(S.over&&!S.won){X.fillStyle='rgba(255,50,40,'+(.18+.14*Math.sin(ts/90))+')';X.fillRect(0,0,W,H);}}
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;if(noteT>0){noteT-=dt;if(noteT<=0)$('note').hidden=true;}if(S&&!paused){if(S.anim>0)S.anim=Math.max(0,S.anim-dt*7);if(S.over){S.overT-=dt;if(S.overT<=0){return S.won?winLevel():loseLevel();}}}if(scr==='play')draw(ts);else{X.setTransform(1,0,0,1,0,0);}}
/* ---------- screens ---------- */
function sheet(title,body,close){setTimeout(()=>{const e=UI.querySelector('.x');if(e&&close)e.onclick=close;},0);return`<div class="sheet"><button class="x" aria-label="Back">${CLOSE}</button><h2>${esc(title)}</h2>${body}</div>`;}
function home(){scr='menu';S=null;UI.className='';UI.hidden=false;['hud','pauseB','tools','note'].forEach(i=>$(i).hidden=true);const st=Object.values(save.stars).reduce((a,b)=>a+b,0);UI.innerHTML=`<h1 class="hero">Key<i>h</i>ole</h1><p class="tag">Sixty heists. One set of plans. ${st} of 180 stars.</p><div class="mn"><button class="b pri" id="mP">${save.maxLv?'Continue':'Start the job'}<small>Heist ${Math.min(60,save.maxLv+1)}</small></button><button class="b" id="mM">The map<small>Pick any heist you have reached</small></button><button class="b" id="mS">The fence<small>${save.cash} cash for gadgets</small></button><button class="b" id="mR">The file<small>What you have stolen so far</small></button><button class="b" id="mO">How it works<small>Rules and sound</small></button><button class="b" id="mG">Go back to games<small>Return to the hub</small></button></div><svg viewBox="0 0 200 240" style="display:block;width:min(26vh,190px);margin:26px auto 0;opacity:.5" fill="none" stroke="#cfe3f7" stroke-width="2"><circle cx="100" cy="76" r="52"/><circle cx="100" cy="76" r="62" stroke-dasharray="5 6"/><path d="M78 118L60 214H140L122 118"/><path d="M20 76H42M158 76H180M100 4V14M46 230H154M46 224V236M154 224V236"/><text x="100" y="238" fill="#cfe3f7" stroke="none" font-size="10" text-anchor="middle" font-family="monospace">FIG. 1</text></svg>`;$('mP').onclick=()=>startLevel(Math.min(59,save.maxLv));$('mM').onclick=showMap;$('mS').onclick=showShop;$('mR').onclick=showFile;$('mO').onclick=showHow;$('mG').onclick=leave;UI.scrollTop=0;}
function leave(){persist();location.href='index.html';}
function showMap(){scr='menu';S=null;UI.className='';UI.hidden=false;['hud','pauseB','tools','note'].forEach(i=>$(i).hidden=true);UI.innerHTML=sheet('The map',CITIES.map((c,ci)=>{const end=ci<4?CITIES[ci+1].from:60;let b='';for(let i=c.from;i<end;i++){const st=save.stars[i]||0;b+=`<button data-l="${i}" ${i>save.maxLv?'disabled':''}>${i+1}<em>${[0,1,2].map(k=>`<i class="${k<st?'on':''}"></i>`).join('')}</em></button>`;}return`<h3>${esc(c.n)}</h3><p style="color:#7fa6c9;margin:0 0 8px">${esc(c.d)}</p><div class="lv">${b}</div>`;}).join(''),home);UI.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>startLevel(+b.dataset.l));}
function showShop(){UI.className='';UI.innerHTML=sheet('The fence',`<p><b>${save.cash}</b> cash. Gadgets make any heist easier, but only stars from the plans count toward your record.</p>${Object.keys(GADS).map(k=>{const G=GADS[k];return`<div class="up"><svg viewBox="0 0 32 32" style="color:#cfe3f7">${G.ic}</svg><div><b>${G.n}</b><small>${G.d}. You hold ${save.gad[k]||0}.</small></div><button class="b" data-b="${k}" ${save.cash<G.c?'disabled':''}>${G.c}</button></div>`;}).join('')}`,home);UI.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const k=b.dataset.b,G=GADS[k];if(save.cash>=G.c){save.cash-=G.c;save.gad[k]=(save.gad[k]||0)+1;persist();sfx('key');showShop();}});}
function showFile(){const st=Object.values(save.stars).reduce((a,b)=>a+b,0),n3=Object.values(save.stars).filter(v=>v===3).length;let lets='';CITIES.forEach((c,i)=>{const end=i<4?CITIES[i+1].from:60;if(save.maxLv>=end)lets+=`<div class="letter">${esc(LETTERS[i])}</div>`;});UI.className='';UI.innerHTML=sheet('The file',`<div class="st"><div><b>${Object.keys(save.stars).length}</b>Heists done</div><div><b>${st}</b>Stars</div><div><b>${n3}</b>Perfect heists</div><div><b>${save.caught}</b>Times caught</div><div><b>${save.total}</b>Cash earned</div></div><h3>Notes from V.</h3>${lets||'<p>Nothing yet. Finish Marseille.</p>'}`,home);}
function showHow(){UI.className='';UI.innerHTML=sheet('How it works',`<p><b>You move, then they move.</b> Tap any tile in a direction to step that way, or use Wait. Guards and cameras only act after you do.</p><p><b>Red hatching</b> is where a guard is looking. <b>Amber</b> is a camera. Stand in it at the end of your turn and you are caught. Dashed lines show where each guard steps next.</p><p><b>Three stars:</b> finish the heist, take all the side loot, and stay near the target move count.</p><h3>Sound</h3><div class="row"><button class="b ${save.snd?'pri':''}" id="sOn">On</button><button class="b ${save.snd?'':'pri'}" id="sOff">Off</button></div>`,home);$('sOn').onclick=()=>{save.snd=1;persist();showHow();};$('sOff').onclick=()=>{save.snd=0;persist();showHow();};}
function pauseGame(){if(scr!=='play'||paused)return;paused=true;UI.className='dim';UI.hidden=false;const n=S.n;UI.innerHTML=sheet('Paused',`<div class="mn" style="margin-top:14px"><button class="b pri" id="pR">Resume</button><button class="b" id="pT">Restart heist</button><button class="b" id="pM">Back to the map</button><button class="b" id="pG">Go back to games</button></div>`,resume);$('pR').onclick=resume;$('pT').onclick=()=>{paused=false;startLevel(n);};$('pM').onclick=()=>{paused=false;showMap();};$('pG').onclick=leave;}
function resume(){paused=false;UI.hidden=true;}
$('pauseB').onclick=pauseGame;addEventListener('pagehide',persist);
resize();home();requestAnimationFrame(frame);
</script></body></html>
