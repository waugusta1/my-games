<style>
:root{--bg:#141016;--ink:#f4ead8;--dim:#a99f92;--amber:#ffb347;--amber2:#e0792b;--teal:#47c2b4;--wood1:#6b4026;--wood2:#3d2416;--panel:#221b20;--panel2:#2e252b;--line:rgba(255,222,180,.14);--s:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Avenir","Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:block}
/* ---------- library ---------- */
#lib{background:radial-gradient(120% 80% at 50% -10%,#3a2a33 0%,#1b1418 55%,#120d10 100%)}
#lib:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 2px,transparent 2px 5px),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 4px)}
.top{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;gap:12px;padding:0 18px;padding-top:env(safe-area-inset-top);z-index:3;background:linear-gradient(#0e0a0c,rgba(14,10,12,.6) 80%,transparent)}
.logo{flex:1;display:flex;justify-content:center;pointer-events:none}
.pb{height:56px;min-width:56px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;font-weight:700;font-size:18px;letter-spacing:.2px;background:linear-gradient(#3a3035,#262024);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.4),0 3px 8px rgba(0,0,0,.45);color:var(--ink)}
.pb:active{transform:translateY(1px);filter:brightness(1.15)}
.pb svg{width:26px;height:26px}
.pb.hot{background:linear-gradient(#ffc566,#e88a2f);color:#2a1406;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(120,50,0,.45),0 4px 12px rgba(232,138,47,.35)}
.pb.teal{background:linear-gradient(#5fd6c8,#2b9488);color:#082a26;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,60,52,.45),0 4px 12px rgba(43,148,136,.3)}
.pb.red{background:linear-gradient(#e0615a,#a8322d);color:#fff}
.pb.ic{padding:0;width:56px}
#chips{position:absolute;left:0;right:0;top:84px;height:52px;display:flex;gap:8px;padding:0 20px;align-items:center;z-index:2;overflow-x:auto}
.chip{height:40px;padding:0 16px;border-radius:20px;font-size:16px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.chip.on{color:#2a1406;background:var(--amber);border-color:transparent}
.chip i{font-style:normal;opacity:.7;font-size:14px}
#statl{margin-left:auto;color:var(--dim);font-size:15px;white-space:nowrap;padding-left:12px}
#shelf{position:absolute;left:0;right:0;top:140px;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 26px 40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));column-gap:0;row-gap:26px}
.tile{position:relative;height:236px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:28px}
.tile:after{content:"";position:absolute;left:-1px;right:-1px;bottom:0;height:26px;background:linear-gradient(#8a5634,#6b4026 30%,#4a2b19 75%,#2b180e);box-shadow:0 10px 16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,210,160,.35)}
.tile:before{content:"";position:absolute;left:-1px;right:-1px;bottom:26px;height:10px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.35))}
.tile .cart{width:176px;height:143px;transition:transform .15s;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.tile:active .cart{transform:translateY(-6px) scale(1.03)}
.tile .nm{position:absolute;bottom:3px;left:8px;right:8px;text-align:center;font-size:13px;font-weight:800;color:#fbe3c4;text-shadow:0 1px 0 #2b180e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1;letter-spacing:.3px}
.tile .rec{position:absolute;top:8px;right:16px;font-size:11px;font-weight:800;letter-spacing:1px;color:#2a1406;background:var(--teal);border-radius:8px;padding:3px 7px}
#empty{display:none;position:absolute;left:0;right:0;top:150px;bottom:0;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:0 60px}
#empty.on{display:flex}
#empty h2{margin:0;font-size:30px;font-weight:800;letter-spacing:.5px}
#empty p{margin:0;color:var(--dim);font-size:18px;max-width:640px;line-height:1.45}
/* ---------- sheets ---------- */
#sheetBg{position:fixed;inset:0;background:rgba(6,4,6,.72);display:none;z-index:40;align-items:center;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheetBg.on{display:flex}
.sheet{position:relative;width:min(880px,92vw);max-height:90vh;overflow-y:auto;border-radius:22px;padding:24px 26px 26px;background:linear-gradient(#2d2429,#1d171b);box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);border:1px solid var(--line)}
.sheet h3{margin:0 70px 16px 0;font-size:26px;font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:12px}
.sheet h3 svg{width:30px;height:30px;color:var(--amber)}
.sheet .x{position:absolute;top:16px;right:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--dim);font-size:16px;line-height:1.45}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:17px}
.dl b{color:var(--dim);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}
.slot{border-radius:14px;background:#151013;border:1px solid var(--line);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.slot:active{filter:brightness(1.2)}
.slot .im{height:128px;background:#0a0709 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#4b3f45;image-rendering:pixelated}
.slot .im svg{width:44px;height:44px}
.slot .tx{padding:10px 12px;font-size:15px;font-weight:700}
.slot .tx span{display:block;color:var(--dim);font-weight:500;font-size:13px;margin-top:2px}
.slot.emp{opacity:.75}
.opt{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .l{flex:1;font-size:18px;font-weight:700}
.opt .l span{display:block;font-size:14px;color:var(--dim);font-weight:500;margin-top:2px}
.seg{display:inline-flex;background:#151013;border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{height:44px;padding:0 16px;border-radius:9px;font-weight:700;font-size:16px;color:var(--dim)}
.seg button.on{background:var(--amber);color:#2a1406}
input[type=range]{-webkit-appearance:none;appearance:none;width:240px;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--amber) var(--p,50%),#3a3035 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;margin-top:-11px;background:radial-gradient(circle at 40% 35%,#fff,#d8cbbb);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.tin{width:100%;height:56px;border-radius:12px;border:1px solid var(--line);background:#151013;color:var(--ink);font-size:20px;padding:0 16px;-webkit-user-select:text;user-select:text}
.ext{display:inline-block;margin:3px;padding:3px 9px;border-radius:8px;background:#151013;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--amber)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;letter-spacing:1px;color:#2a1406;background:var(--teal);border-radius:8px;padding:4px 8px}
/* ---------- play ---------- */
#play{background:#000}
#stage{position:absolute;inset:0}
#ejs{position:absolute;inset:0}
#ejs .ejs_menu_bar,#ejs .ejs_context_menu,#ejs .ejs_virtualGamepad_parent,#ejs .ejs_start_button,#ejs .ejs_message,#ejs .ejs_virtualGamepad_open,#ejs .ejs_menu_bar_hidden{display:none!important}
#ejs .ejs_popup_container{background:rgba(0,0,0,.6)}
#ejs .ejs_menu_button{background:var(--amber)!important;color:#2a1406!important;border-radius:16px!important;font-weight:800}
#ejs canvas{outline:none}
.play-port #ejs{bottom:auto;height:58%}
#load{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(80% 70% at 50% 40%,#2b2026,#0b0809)}
#load .slotart{width:300px;height:220px}
#load .msg{font-size:20px;font-weight:700;color:var(--dim);letter-spacing:.4px}
#load .bk{position:absolute;top:18px;left:18px}
@keyframes ins{0%{transform:translateY(-70px);opacity:0}40%{opacity:1}75%{transform:translateY(8px)}100%{transform:translateY(8px)}}
#load .slotart .cin{animation:ins 1.4s ease-out forwards}
@keyframes led{0%,60%{fill:#3a1410}70%,100%{fill:#ff3b2f}}
#load .slotart .led{animation:led 1.4s forwards}
/* HUD */
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:12;padding-top:env(safe-area-inset-top)}
.hb{width:58px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(20,14,18,.55);border:1px solid rgba(255,220,180,.22);color:#f4ead8;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.hb svg{width:26px;height:26px}
.hb.on{background:rgba(255,179,71,.85);color:#2a1406}
.hb:active{filter:brightness(1.3)}
/* pad */
#pad{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:var(--op,.6)}
#pad.hide{display:none}
#pad .pz{position:absolute;pointer-events:auto;touch-action:none}
#dpad{left:calc(40px + env(safe-area-inset-left));bottom:calc(60px*var(--s));width:calc(210px*var(--s));height:calc(210px*var(--s))}
#dpad svg{width:100%;height:100%}
#dpad .dk{transition:fill .05s}
#face{right:calc(36px + env(safe-area-inset-right));bottom:calc(50px*var(--s));width:calc(240px*var(--s));height:calc(240px*var(--s))}
.fb{position:absolute;width:calc(84px*var(--s));height:calc(84px*var(--s));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(28px*var(--s));color:rgba(255,255,255,.92);text-shadow:0 1px 1px rgba(0,0,0,.5);background:radial-gradient(circle at 38% 30%,var(--c1),var(--c2) 65%,var(--c3));box-shadow:inset 0 -4px 6px rgba(0,0,0,.35),inset 0 3px 4px rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.45),0 6px 12px rgba(0,0,0,.4);pointer-events:none}
.fb.on{transform:translateY(3px) scale(.95);box-shadow:inset 0 -2px 4px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.25),0 1px 0 rgba(0,0,0,.45);filter:brightness(1.25)}
.fb.sm{width:calc(64px*var(--s));height:calc(64px*var(--s));font-size:calc(20px*var(--s))}
.sh{position:absolute;top:calc(70px + env(safe-area-inset-top));width:calc(170px*var(--s));height:calc(62px*var(--s));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(22px*var(--s));color:#e9e1ea;background:linear-gradient(#8d8794,#5b5562);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.45)}
#shL{left:calc(20px + env(safe-area-inset-left));border-radius:30px 12px 12px 12px}
#shR{right:calc(20px + env(safe-area-inset-right));border-radius:12px 30px 12px 12px}
.sh.on{filter:brightness(1.35);transform:translateY(2px)}
#mid{left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:24px;padding:10px 16px}
.pill{width:calc(96px*var(--s));height:calc(34px*var(--s));border-radius:18px;background:linear-gradient(#59525c,#37323a);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:calc(13px*var(--s));font-weight:900;letter-spacing:1.5px;color:#d6ced8;pointer-events:none}
.pill.on{filter:brightness(1.5);transform:translateY(2px)}
.play-port #dpad{bottom:calc(90px + env(safe-area-inset-bottom))}
.play-port #face{bottom:calc(80px + env(safe-area-inset-bottom))}
.play-port .sh{top:calc(58% + 14px)}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-220%);transition:transform .25s;z-index:80;background:#2d2429;border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:17px;padding:14px 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;pointer-events:none}
#toast.on{transform:translate(-50%,0)}
#toast svg{width:22px;height:22px;color:var(--teal)}
#file{position:fixed;left:-9999px;top:0;opacity:0}
</style>
</head>

<div id="sheetBg"><div class="sheet" id="sheet"></div></div>

async function autoSave(){if(!started)return;try{EM.gameManager.saveSaveFiles();}catch(e){}const img=paused?lastShot:await shot();if(await saveState('auto',img))CUR.auto=1;await persist();}
async function pause(){if(!started||paused)return;releaseAll();lastShot=await shot();paused=true;try{EM.pause();}catch(e){}try{EM.gameManager.saveSaveFiles();}catch(e){}persist();pauseMenu();}
function resume(){if(!paused)return;paused=false;stack.length=0;paint();lastTick=performance.now();try{EM.play();}catch(e){}resumeAudio();}
function pauseMenu(){onSheetsClosed=resume;sheet(sh=>{sh.innerHTML=head('Paused','pause',true)+`<div class="row" style="align-items:center;gap:16px;margin:-4px 0 16px"><div style="width:96px;flex:none">${cartSVG(CUR.sys,CUR.name).replace('class="cart"','style="width:96px;height:78px"')}</div><div><div style="font-size:20px;font-weight:800">${esc(CUR.name)}</div><div class="muted">${SYS[CUR.sys].n} &middot; ${fmtT((CUR.secs||0))} played</div></div></div><div class="col"><button class="pb hot" data-a="resume" style="height:64px;font-size:20px">${I.play}<span>Resume</span></button><div class="row" style="flex-wrap:nowrap"><button class="pb" data-a="psave" style="flex:1">${I.save}<span>Save state</span></button><button class="pb" data-a="pload" style="flex:1">${I.load}<span>Load state</span></button></div><div class="row" style="flex-wrap:nowrap"><button class="pb" data-a="pset" style="flex:1">${I.gear}<span>Controls &amp; picture</span></button><button class="pb" data-a="prst" style="flex:1">${I.restart}<span>Restart game</span></button></div><div class="row" style="flex-wrap:nowrap"><button class="pb" data-a="pshelf" style="flex:1">${I.cart}<span>Back to shelf</span></button><button class="pb teal" data-a="phome" style="flex:1">${I.home}<span>Go back to games</span></button></div><p class="muted" style="margin:2px 0 0;text-align:center">Leaving keeps your place, so Continue picks up right here.</p></div>`;});
 ACT.resume=()=>{onSheetsClosed=null;resume();};ACT.psave=()=>slotSheet(CUR,'save');ACT.pload=()=>slotSheet(CUR,'load');ACT.pset=()=>settings(false);
 ACT.prst=()=>confirmBox('Restart the game?','The game starts again from power on. Your in-game saves and save states are kept.','Restart',()=>{try{EM.gameManager.restart();}catch(e){}closeAll();onSheetsClosed=null;resume();});
 ACT.pshelf=()=>leave('cartbay.html');ACT.phome=()=>leave('index.html');}
async function leave(dest){if(leaving)return;leaving=true;try{if(started){await autoSave();await sleep(350);}}catch(e){}location.href=dest;}
$('bPause').addEventListener('click',()=>pause());
$('bFF').addEventListener('click',()=>{if(!started)return;ff=!ff;try{EM.gameManager.toggleFastForward(ff?1:0);}catch(e){}$('bFF').classList.toggle('on',ff);toast(ff?'Fast forward on':'Normal speed','ff');});
addEventListener('keydown',e=>{if(e.key==='Escape'&&CUR){if(paused){if(stack.length>1)back();else resume();}else pause();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!leaving){autoSave();}});
addEventListener('pagehide',()=>{if(started&&!leaving){try{EM.gameManager.saveSaveFiles();}catch(e){}persist();}});
/* a gamepad's Home/guide button opens the pause menu */
(function gp(){try{const g=navigator.getGamepads?[...navigator.getGamepads()].find(x=>x&&x.connected):null;if(g&&CUR&&started){const h=g.buttons[16]&&g.buttons[16].pressed;if(h&&!gp.h){paused?resume():pause();}gp.h=h;}}catch(e){}requestAnimationFrame(gp);})();
window.__cb={get EM(){return EM;},get started(){return started;},get paused(){return paused;},refresh,launch:id=>{const m=META.find(x=>x.id===id);return launch(m,null);},addBuffer:async(name,u8)=>{const f=new File([u8],name);const r=await addFile(f);await refresh();return r;},S:()=>S};
refresh();
})();
</script>
</body></html>
