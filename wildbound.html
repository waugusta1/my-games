 const reg=REG[o.ri!=null?o.ri:7];B.sky=o.kind==='summit'?['#f2d9a6','#9a6a8a']:reg.sky;B.hill=o.kind==='summit'?['#8a6a9a','#5a4a7a','#3a2e54']:reg.hill;

 (async()=>{await say(o.kind==='wild'?`A wild ${SP[B.foe.c.s].n} appears!`:`${o.name} wants to battle!`,900);if(o.kind!=='wild')await say(`${o.name} sends out ${SP[B.foe.c.s].n}.`,700);await say(`Go, ${SP[B.me.c.s].n}!`,600);B.busy=false;hud();})();}
function stgM(v){return v>=0?1+.25*v:1/(1-.25*v);}
function eff(sd,k){const s=stats(sd.c);let v=s[k]*stgM(sd.stg[k]);if(k==='spd'&&sd.slow)v*=.6;return v;}
function say(t,ms=750){B.msg=t;const l=$('log');if(l)l.textContent=t;return W8(ms);}
function hud(){if(scr!=='battle'||!B)return;const me=B.me,fo=B.foe,ms=stats(me.c);
 const tag=(sd,id,st)=>{const sp=SP[sd.c.s],s=stats(sd.c),f=sd.shp/s.hp;return`<div class="tag" id="${id}" style="${st}"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#123b33" stroke="#0b2621" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="none" stroke="#0b2621" stroke-width="9"/><circle class="arc" cx="50" cy="50" r="38" fill="none" stroke="${hpCol(f)}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${238.8*f} 300" transform="rotate(-90 50 50)"/><g transform="translate(26 26) scale(2)">${TG[sp.t].replace(/"F"/g,'"'+TC[sp.t]+'"')}</g></svg><div class="pl"><b>${sp.n}</b><small>Lv ${sd.c.lv} · <span class="hpn">${Math.ceil(sd.shp)}</span>/${s.hp}</small><div class="seeds">${[0,1,2,3].map(i=>`<i class="${i<sd.nrg?'on':''}"></i>`).join('')}</div><div class="stx">${sd.burn?'<span style="background:#d2442e">Burned</span>':''}${sd.slow?'<span style="background:#2f86c9">Slowed</span>':''}${sd.stun?'<span style="background:#b38a12">Stunned</span>':''}${['atk','def','spd'].filter(k=>sd.stg[k]).map(k=>`<span style="background:#3f8a66">${({atk:'Attack',def:'Defense',spd:'Speed'})[k]} ${sd.stg[k]>0?'+':''}${sd.stg[k]}</span>`).join('')}</div></div></div>`;};
 let h=`<div id="log">${esc(B.msg||'')}</div>`+tag(fo,'tF','right:24px;top:84px;flex-direction:row-reverse')+tag(me,'tM','left:20px;bottom:126px');
 if(!B.busy&&!B.over){h+=`<div id="acts">${me.c.mv.map((m,i)=>{const d=MV[m],t=d[1],mu=d[2]?tmul(t,SP[fo.c.s].t):1;return`<button class="mv" id="m${i}" ${me.nrg<d[3]?'disabled':''}><span class="ti" style="background:${TC[t]}">${tg(t,'#fff')}</span><b>${d[0]}</b><small>${d[2]?'Power '+d[2]+(mu>1?' · strong!':mu<1?' · weak':''):FXD[d[5]]}</small><span class="cs">${'<i></i>'.repeat(d[3])}</span></button>`;}).join('')}</div>
 <div id="side"><button class="sb" id="aS" ${S.team.filter(c=>c.hp>0).length<2?'disabled':''}>${IC.swap}Swap</button><button class="sb" id="aB">${IC.bag}Bag</button>${B.kind==='wild'?`<button class="sb" id="aR">${IC.run}Run</button>`:''}</div>`;}
 UI.innerHTML=h;if(!B.busy&&!B.over){me.c.mv.forEach((m,i)=>btn('m'+i,()=>turn({k:'mv',m})));btn('aS',swapPick);btn('aB',battleBag);btn('aR',()=>turn({k:'run'}));}}

function swapPick(){const al=S.team.map((c,i)=>[c,i]).filter(([c,i])=>c.hp>0&&i!==B.pi);sheet(`${XB()}<h2>Swap creature</h2><p>Swapping uses your turn.</p><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:8px">${al.map(([c,i])=>cCard(c,'sw'+i)).join('')}</div><div class="row cen" style="margin-top:10px"><button class="b" id="swB">${IC.back} Back</button></div>`);btn('xC',closeSheet);btn('swB',closeSheet);al.forEach(([c,i])=>btn('sw'+i,()=>{closeSheet();turn({k:'sw',i});}));}

function battleBag(){const can=k=>S.items[k]>0&&(k.includes('snare')?B.kind==='wild':true);const keys=['snare','gsnare','salve','bsalve','tonic'];

 btn('xC',closeSheet);btn('bbB',closeSheet);keys.forEach(k=>btn('bi_'+k,()=>{if(!can(k))return;if(k==='tonic'){const f=S.team.map((c,i)=>[c,i]).filter(([c])=>c.hp<=0);if(!f.length){flash('No one has fainted.');return;}sheet(`${XB()}<h2>Use Tonic on…</h2><div class="grid" style="grid-template-columns:1fr 1fr">${f.map(([c,i])=>cCard(c,'tn'+i)).join('')}</div><div class="row cen"><button class="b" id="tnB">${IC.back} Back</button></div>`);btn('xC',battleBag);btn('tnB',battleBag);f.forEach(([c,i])=>btn('tn'+i,()=>{closeSheet();turn({k:'it',it:'tonic',i});}));return;}closeSheet();turn({k:'it',it:k});}));}
function aiPick(){const f=B.foe,m=B.me,opts=f.c.mv.filter(x=>MV[x][3]<=f.nrg);let best=opts[0]||'tackle',bv=-1;const ms=SP[m.c.s].t,fs=stats(f.c);
 for(const x of opts){const d=MV[x];let v;if(d[2])v=d[2]*tmul(d[1],ms)*(d[1]===SP[f.c.s].t||d[1]===SP[f.c.s].t2?1.25:1)*(d[4]/100);else{v=d[5]==='heal'?(f.c.hp<fs.hp*.4?140:5):d[5]==='guard'?(R()<.12?60:0):(f.stg.atk<2&&d[5]==='atk+'?45:f.stg.def<2&&d[5]==='def+'?40:d[5]==='spd+'&&f.stg.spd<1?35:5);}
  v*=.85+R()*.3;if(B.kind!=='wild'&&d[3]===0&&f.nrg>=2&&opts.some(y=>MV[y][3]>=2&&MV[y][2]))v*=.5;if(v>bv){bv=v;best=x;}}
 if(B.kind!=='wild'&&f.nrg<4&&R()<.2){const cheap=opts.filter(x=>MV[x][3]===0&&MV[x][2]);if(cheap.length&&opts.some(x=>MV[x][3]>f.nrg))best=cheap[0];}
 return{k:'mv',m:best};}
async function turn(a){if(B.busy||B.over)return;B.busy=true;hud();B.turn++;const fa=aiPick();const me=B.me,fo=B.foe;
 const pri=x=>x.k!=='mv'?3:MV[x.m][5]==='guard'?2:0;let order;
 const pm=pri(a),fm=pri(fa);if(pm!==fm)order=pm>fm?[[me,fo,a],[fo,me,fa]]:[[fo,me,fa],[me,fo,a]];else{const sm=eff(me,'spd'),sf=eff(fo,'spd');order=(sm>sf||sm===sf&&R()<.5)?[[me,fo,a],[fo,me,fa]]:[[fo,me,fa],[me,fo,a]];}
 me.guard=fo.guard=0;
 for(const [u,t,x] of order){if(B.over)return;if(u.c.hp<=0)continue;const isMe=u===B.me||u===me;
  if(x.k==='run'){if(R()<.85||eff(me,'spd')>eff(fo,'spd')){await say('You got away safely.',800);return endBattle('run');}await say("Couldn't get away!");continue;}
  if(x.k==='sw'){await say(`Come back, ${SP[B.me.c.s].n}!`,500);B.pi=x.i;B.me=side(S.team[x.i]);B.part.add(B.me.c.u);await say(`Go, ${SP[B.me.c.s].n}!`,600);hud();for(const o of order)if(o[1]===me)o[1]=B.me;continue;}
  if(x.k==='it'){await useItem(x);if(B.over)return;continue;}
  if(u.stun){u.stun=0;await say(`${nm(u)} can't move!`,700);continue;}
  const tgt=u===B.foe||u===fo?B.me:B.foe;await attack(u===fo?B.foe:B.me,u===fo?B.me:B.foe,x.m);if(B.over)return;
  if(await checkFaint())return;}
 // end of turn
 for(const sd of[B.me,B.foe]){if(sd.c.hp>0&&sd.burn){const d=Math.max(1,Math.floor(stats(sd.c).hp*.06));sd.c.hp=Math.max(0,sd.c.hp-d);sd.burn--;pop(sd,d,'#ff8a3a');await say(`${nm(sd)} is hurt by its burn.`,550);}if(sd.slow)sd.slow--;sd.nrg=Math.min(4,sd.nrg+1);}
 if(await checkFaint())return;B.busy=false;hud();persist();}
function nm(sd){return(sd===B.foe&&B.kind==='wild'?'The wild ':sd===B.foe?'Foe ':'')+SP[sd.c.s].n;}
function pop(sd,v,col){const isF=sd===B.foe;POP.push({x:isF?W*.7:W*.28,y:isF?H*.3:H*.5,v:String(v),c:col,t:0});}
async function attack(u,t,m){const d=MV[m];u.nrg-=d[3];hud();await say(`${nm(u)} used ${d[0]}!`,420);
 u.anim={k:'lunge',t:0};AU.noise(.12,.12,1400,1,0,'highpass');await W8(220);
 if(!d[2]){const s=stats(u.c);if(d[5]==='heal'){const h=Math.floor(s.hp*.35);u.c.hp=Math.min(s.hp,u.c.hp+h);sfxHeal();burst(u,'heal');await say(`${nm(u)} recovers health.`);}
  else if(d[5]==='guard'){u.guard=1;await say(`${nm(u)} braces itself.`);}

 t.c.hp=Math.max(0,t.c.hp-dmg);t.anim={k:'hit',t:0};burst(t,d[1]);sfxHit(d[1],mu);pop(t,dmg,mu>1?'#ffd23a':'#fff');

async function giveXp(fc){const base=SP[fc.s].b.reduce((a,b)=>a+b,0)/4;const g=Math.floor(base*fc.lv/4*(B.kind==='wild'?1:1.4));

async function endBattle(res){B.over=true;hud();const k=B.kind;let coins=0,msg='',extra='';

  if(k==='warden'){if(!S.reg[B.ri].w){S.reg[B.ri].w=1;S.wardens++;__mgt('m','warden');extra=`<p><b>You earned the ${REG[B.ri].n} mark!</b>${B.ri<7?` The trail to ${REG[B.ri+1].n} is open.`:' The Summit is open.'}</p>`;S.items.gsnare=(S.items.gsnare||0)+(B.ri>=1?1:0);}}

 else if(res==='lose'){const lost=Math.floor(S.coins*.2);S.coins-=lost;msg='Your team was defeated';extra=`<p>You hurry back to camp and drop ${lost} coins on the way. Your team is rested.</p>`;if(k!=='wild')__mgt('l',()=>B.name);healAll();}

  const go=()=>{closeSheet();summitFight(nx);};btn('nX',go);btn('nT',()=>teamSheet(()=>endBattleSheetAgain()));btn('nQ',()=>{closeSheet();openMap();});window.endBattleSheetAgain=()=>{sheet(`<h2>Next: ${SUMMIT[nx].n}</h2><div class="row cen"><button class="b" id="nX">${IC.sword} Next battle</button><button class="b g" id="nQ">${IC.back} Leave the Summit</button></div>`);btn('nX',go);btn('nQ',()=>{closeSheet();openMap();});};return;}
  S.summit++;S.srank++;__mgt('m','summit');S.coins+=1000;persist();extra=`<p><b>You conquered the Summit and became Champion of the Wild!</b> +1000 coins. The Summit climb now starts at Rank ${S.srank+1} with stronger rivals.</p>`;msg='Champion!';}
