function fixFeed(d){
  if(!d||!Array.isArray(d.pets)||!d.pets.length)return null;
  const by={};d.pets.forEach(p=>{if(p&&p.name)by[p.name]=p;});
  d.pets=PET_ORDER.filter(n=>by[n]).concat(Object.keys(by).filter(n=>!PET_ORDER.includes(n))).map(n=>{
    const p=Object.assign(demoPet(n,{}),by[n],{demo:!!d.demo});
    p.stats=Object.assign({hp:150,atk:40,def:40,spd:40,spc:40},p.stats||{});
    if(!p.moves||!p.moves.length)p.moves=(DEMO.pets.find(x=>x.name===n)||DEMO.pets[0]).moves;
    ['hours24','by_hour'].forEach(k=>{if(!Array.isArray(p[k])||p[k].length!==24)p[k]=Array(24).fill(0);});
    if(!Array.isArray(p.days7)||p.days7.length!==7)p.days7=Array(7).fill(0);
    if(!Array.isArray(p.album))p.album=[];
    return p;});
  return d;
}
function feedCached(){try{return fixFeed(JSON.parse(localStorage.getItem(FEED_CACHE)||'null'));}catch(e){return null;}}
// state: 'live' (fresh from the camera), 'cached' (offline, last copy), 'demo' (camera hasn't sent anything yet)
async function loadFeed(){
  let d=null,state='demo';
  // 1) GitHub API: always the newest copy (right after /games update). 2) raw file: can be up to 5 min old.
  const tries=[[FEED_API,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'}],[FEED_BASE+'pets.json?t='+Date.now(),{cache:'no-store'}]];
  for(const[url,opt]of tries){if(d)break;
    try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(url,Object.assign({signal:ctl.signal},opt));clearTimeout(t);
      if(r.ok){d=fixFeed(await r.json());if(d){state='live';try{localStorage.setItem(FEED_CACHE,JSON.stringify(d));}catch(e){}}}}catch(e){}}
  if(!d){d=feedCached();if(d)state='cached';}
  if(!d){d=fixFeed(JSON.parse(JSON.stringify(DEMO)));state='demo';}
  d.state=state;return d;
}
const PHOTOS={};
function petPhoto(p,which){ // which: 'photo' | 'latest'
  const path=p[which||'photo']||(which==='latest'?p.photo:null);if(!path)return null;
  const k=path;if(PHOTOS[k])return PHOTOS[k];
  const im=new Image();im.crossOrigin='anonymous';im.decoding='async';
  im.src=FEED_BASE+path+'?v='+encodeURIComponent(p[(which||'photo')+'_time']||p.photo_time||'');
  im.onerror=()=>{im._bad=1;};PHOTOS[k]=im;return im;
}
function randomPhoto(p){ // a different real photo each time (best photo + the album)
  const opts=[p.photo?{path:p.photo,time:p.photo_time}:null].concat(p.album||[]).filter(Boolean);if(!opts.length)return null;
  const a=pick(opts);if(PHOTOS[a.path])return PHOTOS[a.path];const im=new Image();im.crossOrigin='anonymous';im.decoding='async';
  im.src=FEED_BASE+a.path+'?v='+encodeURIComponent(a.time||'');im.onerror=()=>{im._bad=1;};return PHOTOS[a.path]=im;}
function photoReady(im){return im&&im.complete&&im.naturalWidth>0&&!im._bad;}
function agoText(iso){if(!iso)return 'not seen yet';const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400){const h=Math.floor(s/3600);return h+(h===1?' hour':' hours')+' ago';}
  const d=Math.floor(s/86400);return d===1?'yesterday':d+' days ago';}
function hoursSince(iso){return iso?(Date.now()-new Date(iso).getTime())/3600000:1e9;}
function isNightNow(){const h=new Date().getHours();return h>=18||h<5;}
function hexRGB(h){h=(h||'#999').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgba(h,a){const[r,g,b]=hexRGB(h);return`rgba(${r},${g},${b},${a})`;}
function shade(h,f){const c=hexRGB(h).map(v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f))));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}

function bowl(g,x,y,col,inside,kibble){ // a real bowl: sloped side + rim + what's in it

// ---------- actors ----------
function inPool(x,y,m){const P=LAY.pool;m=m||0;return x>P.x-m&&x<P.x+P.w+m&&y>P.y-m&&y<P.y+P.h+m;}
// path around the pool: the pool is solid for walking (only Bella swims, and only after a ball in the water)
function segHitsPool(x1,y1,x2,y2,m){for(let k=0;k<=30;k++){const q=k/30;if(inPool(x1+(x2-x1)*q,y1+(y2-y1)*q,m))return true;}return false;}
function routeAround(x1,y1,x2,y2){if(!segHitsPool(x1,y1,x2,y2,14))return[];const P=LAY.pool,m=30,l=P.x-m,r=P.x+P.w+m,top=Math.max(LAY.floorTop+3,P.y-m),bot=P.y+P.h+m,mid=P.y+P.h/2;let best=null;
  for(const sx of [l,r]){const pts=[{x:sx,y:y1<mid?top:bot}];if((y1<mid)!==(y2<mid))pts.push({x:sx,y:y2<mid?top:bot});
    let L=0,px=x1,py=y1;for(const q of pts){L+=Math.hypot(q.x-px,q.y-py);px=q.x;py=q.y;}L+=Math.hypot(x2-px,y2-py);if(!best||L<best.L)best={pts,L};}
  return best.pts.map(q=>({x:clamp(q.x,W*.03,W*.97),y:q.y}));}
// if a walker ends up on the water, step it back out to the closest edge
function keepOutOfPool(A){const P=LAY.pool;if(!inPool(A.x,A.y,6))return;const opts=[{x:A.x,y:P.y+P.h+14},{x:P.x-14,y:A.y},{x:P.x+P.w+14,y:A.y}];
  if(P.y-10>LAY.floorTop)opts.push({x:A.x,y:P.y-10});let b=opts[0];for(const o of opts)if(Math.hypot(o.x-A.x,o.y-A.y)<Math.hypot(b.x-A.x,b.y-A.y))b=o;A.x=b.x;A.y=b.y;}
// where to head next: straight at the goal, or to the next corner around the pool
function nextStep(A,gx,gy){const w=routeAround(A.x,A.y,gx,gy);return w.length?w[0]:{x:gx,y:gy};}
function poolEdge(x){const P=LAY.pool;return{x:clamp(x,P.x+10,P.x+P.w-10),y:P.y+P.h+16};}
function depthScale(y){return .78+.42*(y-LAY.floorTop)/(LAY.floorBot-LAY.floorTop);}
function inYardNow(p){return hoursSince(p.last_seen)<1;}
function zoneOf(p){return inYardNow(p)?[LAY.yA,LAY.yB]:[LAY.inA,LAY.inB];}
function makeActors(){layout();ACT=PETS.map((p,i)=>{const z=zoneOf(p);return{p,x:rnd(z[0],z[1]),y:rnd(LAY.floorTop+20,LAY.floorBot),dir:Math.random()<.5?-1:1,pose:'idle',state:'idle',timer:rnd(1,4),seed:i*1.7,walkT:0,scale:1,happy:0,bed:LAY.beds[i]};});ACT.forEach(keepOutOfPool);}
function goTo(A,x,y,then,speed){A.state='walk';A.tx=clamp(x,W*.03,W*.97);A.ty=clamp(y,LAY.floorTop+6,LAY.floorBot);
  if(inPool(A.tx,A.ty,14)){const e=poolEdge(A.tx);A.tx=e.x;A.ty=e.y;}
  A.wp=null; // walk around the pool (see nextStep)
  A.then=then||null;A.speed=speed||rnd(60,90);}
function sleepyNow(p,c){const h=new Date().getHours(),night=h>=22||h<5;return c.energy<25||(night&&!nightOwl(p));}
function think(A){
  const c=care(A.p.name),z=zoneOf(A.p);
  if(A.state==='sleep'){if(c.energy>=98&&!sleepyNow(A.p,c)){A.state='idle';A.pose='idle';A.timer=1;}return;}
  if(sleepyNow(A.p,c)&&Math.random()<.7){goTo(A,A.bed.x,A.bed.y+2,()=>{A.state='sleep';A.pose='sleep';});return;}
  const r=Math.random();
  if(c.food<25&&BOWL>0&&r<.6){goTo(A,LAY.bowl.x-30,LAY.bowl.y+2,()=>{A.dir=1;A.state='eat';A.pose='eat';A.timer=4;});return;}
  if(r<.5)goTo(A,rnd(z[0],z[1]),rnd(LAY.floorTop+10,LAY.floorBot));
  else if(r<.8){A.state='idle';A.pose='sit';A.timer=rnd(3,8);}
  else{A.state='idle';A.pose='idle';A.timer=rnd(2,5);}
}
function stepActors(dt){
  for(const A of ACT){if(A.away)continue;A.scale=depthScale(A.y)*clamp(H/820,.7,1.4)*(A.p.species==='dog'?1.18:1);A.happy=Math.max(0,A.happy-dt);
    if(A.state==='walk'){const ns=nextStep(A,A.tx,A.ty),corner=ns.x!==A.tx||ns.y!==A.ty,gx=ns.x,gy=ns.y,dx=gx-A.x,dy=gy-A.y,d=Math.hypot(dx,dy);A.pose='walk';if(Math.abs(dx)>2)A.dir=dx>0?1:-1;
      if(corner&&d<6){A.x=gx;A.y=gy;continue;}
      if(!corner&&d<4){A.state='idle';A.pose='idle';A.timer=rnd(1,3);const th=A.then;A.then=null;if(th)th();}else{const v=A.speed*dt*A.scale;A.x+=dx/d*Math.min(v,d);A.y+=dy/d*Math.min(v,d);A.walkT+=dt*A.speed/22;keepOutOfPool(A);}}
    else if(A.state==='eat'){A.timer-=dt;if(A.timer<=0){A.state='idle';A.pose='idle';A.timer=1;}}
    else if(A.state==='idle'&&!MODE){A.timer-=dt;if(A.timer<=0)think(A);}
    else if(A.state==='sleep'){const c=care(A.p.name);const bedK=S.owned.includes(A.p.species==='dog'?'bed_doghouse':'bed_igloo')?1.5:S.owned.includes('bed_basket')?1.25:1;c.energy=clamp(c.energy+dt*.6*bedK,0,100);A.timer-=dt;if(A.timer<=0){A.timer=6;think(A);}}}
}
function needIcon(c){const lows=NEEDS.filter(([k])=>c[k]<30).sort((a,b)=>c[a[0]]-c[b[0]]);return lows.length?lows[0][0]:null;}

const PARTS=[];

    if(A.p.species==='dog'&&inPool(A.x,A.y,-4)){const P=LAY.pool,wl=clamp(A.y-4*A.scale,P.y+5,P.y+P.h-4),bob=Math.sin(NOW*3)*1.5;cx.save();cx.beginPath();cx.rect(0,0,W,wl);cx.clip();cx.translate(0,30*A.scale+bob);drawPet(cx,A,NOW);cx.restore();

function startBath(p){

// ---------- mini-games ----------
function gameHUD(text){$('ghud').innerHTML=text;$('ghud').classList.add('on');}
function startLaser(p){
  const A=actorOf(p.name);select(p.name);$('care').classList.remove('on');$('tray').hidden=true;if(A.state==='sleep'){A.state='idle';A.pose='idle';}
  // move the dot to make the cat run (metres), hold it still so it pounces (catches)
  let dot={x:W*.7,y:(LAY.floorTop+LAY.floorBot)/2},catches=0,run=0,time=30,still=0,pounce=0,rest=0,chase=false;const ox=A.x,oy=A.y;
  const pts=()=>catches*5+Math.floor(run/4);
  MODE={hide:B=>B!==A,step(dt){time-=dt;A.scale=depthScale(A.y)*clamp(H/820,.7,1.4);const wet=inPool(dot.x,dot.y,6),goal=wet?poolEdge(dot.x):dot,tg=nextStep(A,goal.x,goal.y),detour=tg!==goal&&(tg.x!==goal.x||tg.y!==goal.y),dx=tg.x-A.x,dy=tg.y-A.y,d=Math.hypot(dx,dy);if(Math.abs(dx)>(chase?4:24))A.dir=dx>0?1:-1;still+=dt;if(wet)still=0;
      if(rest>0){rest-=dt;A.pose='sit';A.happy=1;}
      else if(pounce>0){pounce-=dt;A.pose='walk';A.walkT+=dt*14;const v=Math.min(d,700*dt);A.x+=dx/(d||1)*v;A.y+=dy/(d||1)*v;keepOutOfPool(A);
        if(d<20*A.scale&&!wet&&!detour){chase=false;catches++;sfx('pounce',{pan:panOf(A)});if(Math.random()<.25)voice(p,{cd:4,vol:.6});puffs(dot.x,dot.y,10,'#ff3a3a');hearts(A.x,A.y-70*A.scale,2);pounce=0;rest=1.1;}
        else if(pounce<=0){A.pose='sit';rest=.4;}}
      else if(d>.5&&(chase||d>64*A.scale||detour)){chase=d>22*A.scale||detour;A.pose='walk';const v=Math.min(d,(170+catches*6)*dt*A.scale);A.x+=dx/d*v;A.y+=dy/d*v;keepOutOfPool(A);run+=v/(55*A.scale);A.walkT+=dt*10;
        if(still>.6&&d<260*A.scale&&!detour)pounce=.45;}
      else if(detour){A.x=tg.x;A.y=tg.y;}
      else{A.pose='sit';if(still>.6){/* sitting right on the dot: no pounce, move it away */}}
      gameHUD(`<b>${catches}</b> pounces · ${Math.round(run)} m run · ${Math.max(0,Math.ceil(time))} s`);if(time<=0)done();},
    draw(t){cx.fillStyle='rgba(255,40,40,.25)';cx.beginPath();cx.arc(dot.x,dot.y,16,0,7);cx.fill();cx.fillStyle='#ff2a2a';cx.beginPath();cx.arc(dot.x,dot.y,6+Math.sin(t*20),0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(dot.x,dot.y,2.2,0,7);cx.fill();},
    down(x,y){dot={x,y:clamp(y,LAY.floorTop,LAY.floorBot)};still=0;},move(x,y,d){if(!d)return;const ny=clamp(y,LAY.floorTop,LAY.floorBot);if(Math.hypot(x-dot.x,ny-dot.y)>3)still=0;dot={x,y:ny};},up(){},
    end(){$('ghud').classList.remove('on');keepOutOfPool(A);A.scale=depthScale(A.y)*clamp(H/820,.7,1.4);A.state='idle';A.pose='idle';A.timer=2;}};
  const done=()=>{const score=pts(),bonus=hasItem('wand')?1.2:1,fun=Math.round(Math.min(60,10+score*1.5)*bonus),coins=Math.min(40,score);bump(p.name,'fun',fun);bump(p.name,'energy',-Math.min(25,8+run/10));S.coins+=coins;addBond(p.name,4+catches);
    S.stats.plays++;if(score>S.best.laser)S.best.laser=score;if(catches>=8)mgt('m','play20');mgt('e','Laser',score);sfx('coins');const c=catches,r=Math.round(run);endMode();toast(`${c} pounces, ${r} m run! +${fun} fun, +${coins} coins`,'coin');};
  overlayBar('Move the laser to make '+esc(p.name)+' run. Hold it still and she pounces!'.replace('she',p.name==='Buster'?'he':'she'),[['Stop','mStop','']]);$('mStop').onclick=done;
}
function startFetch(p){
  const A=actorOf(p.name);select(p.name);$('care').classList.remove('on');$('tray').hidden=true;if(A.state==='sleep'){A.state='idle';A.pose='idle';}
  const home={x:W*.62,y:LAY.floorBot-6};A.x=home.x;A.y=home.y;let ball=null,score=0,throws=8,phase='ready',wet=0;const ox=A.x,oy=A.y;
  MODE={hide:B=>B!==A,step(dt){A.scale=depthScale(A.y)*clamp(H/820,.7,1.4)*1.18;
      if(ball&&ball.fly){ball.t+=dt/ball.d;const k=Math.min(1,ball.t);ball.x=ball.x0+(ball.x1-ball.x0)*k;ball.y=ball.y0+(ball.y1-ball.y0)*k;ball.h=Math.sin(k*Math.PI)*ball.d*260;if(k>=1){ball.fly=false;phase='run';sfx('bounce',{pan:(ball.x/W-.5)});
        const P=LAY.pool;if(ball.x>P.x&&ball.x<P.x+P.w&&ball.y>P.y-6&&ball.y<P.y+P.h){ball.pool=1;ball.y=clamp(ball.y,P.y+P.h*.5,P.y+P.h*.8);ball.x=clamp(ball.x,P.x+P.w*.08,P.x+P.w*.92);sfx('splash',{pan:(ball.x/W-.5)});puffs(ball.x,ball.y,14,'#8ad0f0','drop');}}}

        if(d>6){A.x+=dx/d*Math.min(v,d);A.y+=dy/d*Math.min(v,d);if(ball.pool&&phase==='run'){const P=LAY.pool;if(A.x>P.x&&A.x<P.x+P.w&&A.y>P.y&&A.y<P.y+P.h&&Math.random()<.3)puffs(A.x,A.y,2,'#8ad0f0','drop');}}
        else if(phase==='run'){phase='back';ball.held=1;if(ball.pool){wet++;sfx('splash',{pan:panOf(A)});}if(Math.random()<.35)voice(p,{cd:3,one:1,vol:.7});}else{phase='ready';score++;A.happy=1.5;hearts(A.x,A.y-90*A.scale,2);ball=null;A.pose='sit';if(throws<=0)done();}}
      if(ball&&ball.held){ball.x=A.x+A.dir*60*A.scale;ball.y=A.y;ball.h=58*A.scale;}
      gameHUD(`<b>${score}</b> fetched · ${throws} balls left`);},
    draw(){if(!ball)return;cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(ball.x,ball.y,8,3,0,0,7);cx.fill();cx.fillStyle='#d8e84a';cx.beginPath();cx.arc(ball.x,ball.y-ball.h-7,8,0,7);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.beginPath();cx.arc(ball.x-6,ball.y-ball.h-7,7,-.9,.9);cx.stroke();},
    down(x,y){if(phase!=='ready'||throws<=0)return;y=clamp(y,LAY.floorTop+4,LAY.floorBot);x=clamp(x,W*.47,W*.97);throws--;sfx('throw');if(Math.random()<.4)voice(p,{cd:3,one:1,vol:.8});const d=clamp(Math.hypot(x-home.x,y-home.y)/600,.35,1);
      ball={x0:home.x,y0:home.y,x1:x,y1:y,x:home.x,y:home.y,h:0,t:0,d,fly:true};phase='wait';},up(){},
    end(){$('ghud').classList.remove('on');keepOutOfPool(A);A.scale=depthScale(A.y)*clamp(H/820,.7,1.4);A.state='idle';A.pose='idle';A.timer=2;}};
  const done=()=>{const bonus=hasItem('ball')?1.2:1,fun=Math.round(Math.min(60,10+score*6)*bonus),coins=score*3;bump(p.name,'fun',fun);bump(p.name,'energy',-15);if(wet)bump(p.name,'clean',-10*wet);S.coins+=coins;addBond(p.name,4+score*2);
    S.stats.plays++;if(score>S.best.fetch)S.best.fetch=score;if(score>=8)mgt('m','play20');mgt('e','Fetch',score);sfx('coins');const s=score;endMode();toast(`${s} fetched! +${fun} fun, +${coins} coins${wet?' (and a wet dog)':''}`,'coin');};

// =================== PET LIFE PLUS ===================
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let PL_BULBS=[],PL_FX={leaves:[],flies:[],bugs:[],birds:[]};
// ---------- our real yard (drawn from the security-camera view) ----------
function drawYardPL(g,hr){
  const R=seeded(2026),r=(a,b)=>a+R()*(b-a),ft=LAY.floorTop,X0=LAY.door,night=hr>=19||hr<5,eve=hr>=17&&hr<19,Wd=W-X0,P=LAY.pool;
  const sk=sky(hr);let gr=g.createLinearGradient(0,0,0,ft*.3);gr.addColorStop(0,sk[0]);gr.addColorStop(1,sk[1]);g.fillStyle=gr;g.fillRect(X0,0,Wd,ft*.32);
  if(night){for(let i=0;i<50;i++){g.fillStyle=`rgba(255,255,255,${r(.3,1)})`;g.fillRect(r(X0,W),r(0,ft*.16),1.5,1.5);}g.fillStyle='#f6f0d6';g.beginPath();g.arc(X0+Wd*.55,ft*.07,11,0,7);g.fill();}
  else{g.fillStyle='rgba(255,255,255,.85)';for(const[x,y]of[[.2,.05],[.62,.03]])for(let i=0;i<4;i++){g.beginPath();g.ellipse(X0+Wd*x+i*20-30,ft*y+(i%2)*4,22,9,0,0,7);g.fill();}}
  for(let i=0;i<26;i++){g.fillStyle=['#3d7a3a','#4f9446','#2f6630'][i%3];g.beginPath();g.ellipse(X0+Wd*r(.55,.8),ft*r(.12,.22),r(9,18),r(6,11),r(0,3),0,7);g.fill();}
  // back wall: brick band + white plaster
  const wallR=X0+Wd*.7,bt=ft*.1,bb=ft*.27;g.fillStyle='#b5673e';g.fillRect(X0,bt,wallR-X0,bb-bt);const bh=(bb-bt)/4;
  for(let row=0;row<4;row++){const off=row%2?Wd*.025:0;for(let x=X0-off;x<wallR;x+=Wd*.05){g.fillStyle=['#c47448','#b0603a','#bd6d44','#a95a35','#c97d50'][Math.floor(R()*5)];g.fillRect(x+1,bt+row*bh+1,Wd*.05-2,bh-2);}}
  g.fillStyle='#f1ece2';g.fillRect(X0,bb,wallR-X0,ft-bb);
  // the house corner: white wall, teal stripe, dark door, wooden window
  const hx=X0+Wd*.66;g.fillStyle='#ecebe6';g.fillRect(hx,ft*.3,W-hx,ft*.7);g.fillStyle='#a64a2c';for(let x=hx;x<W;x+=9){g.beginPath();g.arc(x+4,ft*.3,5,Math.PI,0);g.fill();}
  gr=g.createLinearGradient(0,ft*.76,0,ft);gr.addColorStop(0,'#2fb8a6');gr.addColorStop(1,'#239a8a');g.fillStyle=gr;g.fillRect(hx,ft*.76,W-hx,ft*.24);
  const dx=hx+Wd*.03,dw=Wd*.07;g.fillStyle='#3a2a22';g.fillRect(dx,ft*.44,dw,ft*.56);g.fillStyle='#4a3830';g.fillRect(dx+3,ft*.455,dw-6,ft*.54);g.fillStyle='#d8b45a';g.beginPath();g.arc(dx+dw*.8,ft*.74,2,0,7);g.fill();g.fillStyle='#e0c050';g.fillRect(dx+dw*.25,ft*.48,dw*.4,ft*.03);
  const wx=hx+Wd*.15,wy=ft*.42,ww=Wd*.16,wh=ft*.3;g.fillStyle='#7a4a26';g.fillRect(wx-4,wy-4,ww+8,wh+8);
  for(let i=0;i<4;i++)for(let j=0;j<3;j++){g.fillStyle=night||eve?'#f5c76a':'#e8e4d8';g.fillRect(wx+i*ww/4+2,wy+j*wh/3+2,ww/4-4,wh/3-4);}
  // ivy wall
  g.save();g.beginPath();g.moveTo(X0,ft+2);g.lineTo(X0,ft*.3);let x=X0;while(x<X0+Wd*.62){const nx=Math.min(X0+Wd*.62,x+r(Wd*.04,Wd*.08));g.quadraticCurveTo((x+nx)/2,ft*r(.2,.26),nx,ft*r(.26,.32));x=nx;}
  g.lineTo(X0+Wd*.64,ft*.6);g.quadraticCurveTo(X0+Wd*.65,ft*.85,X0+Wd*.63,ft+2);g.closePath();g.fillStyle=night?'#16301e':'#2f5e2c';g.fill();g.clip();
  const greens=night?['#1c3a26','#24482e','#163020','#2a5030']:['#3c7a36','#4b8c3e','#5a9c46','#2e6a2e','#68a850','#447f3a','#80b85a'];
  for(let i=0;i<3200;i++){g.fillStyle=greens[Math.floor(R()*greens.length)];g.beginPath();g.ellipse(r(X0,X0+Wd*.66),r(ft*.18,ft),r(2,4.6),r(1.6,3.6),r(0,3),0,7);g.fill();}
  if(!night)for(let i=0;i<500;i++){g.fillStyle=eve?'rgba(255,190,110,.3)':'rgba(200,240,140,.35)';g.beginPath();g.ellipse(r(X0,X0+Wd*.55),r(ft*.22,ft*.55),r(2,4),r(1.5,3),0,0,7);g.fill();}
  g.restore();
  // canna with red flowers, pots, cactus, plants under the window
  const pot=(px,py,s)=>{g.fillStyle='#c86a3a';g.beginPath();g.moveTo(px-s,py-s*1.2);g.lineTo(px+s,py-s*1.2);g.lineTo(px+s*.75,py);g.lineTo(px-s*.75,py);g.closePath();g.fill();g.fillStyle='#d87e4a';g.fillRect(px-s*1.08,py-s*1.35,s*2.16,s*.3);};
  const cx0=X0+Wd*.3;for(let i=0;i<6;i++){const a=-Math.PI/2+r(-.7,.7),len=ft*r(.12,.2);g.fillStyle=['#4e9e3e','#5cae48','#3f8a34'][i%3];g.beginPath();g.moveTo(cx0,ft);g.quadraticCurveTo(cx0+Math.cos(a+.4)*len*.6,ft+Math.sin(a+.4)*len*.6,cx0+Math.cos(a)*len*.5,ft+Math.sin(a)*len);g.quadraticCurveTo(cx0+Math.cos(a-.4)*len*.6,ft+Math.sin(a-.4)*len*.6,cx0,ft);g.fill();}
  g.fillStyle='#e8402a';g.beginPath();g.ellipse(cx0+4,ft*.78,5,8,.2,0,7);g.fill();g.fillStyle='#ff7a3a';g.beginPath();g.ellipse(cx0+7,ft*.76,3,5,.6,0,7);g.fill();
  g.fillStyle='#4f8a4a';g.fillRect(dx+dw+Wd*.012,ft*.72,Wd*.012,ft*.26);g.fillRect(dx+dw+Wd*.004,ft*.78,Wd*.01,ft*.12);pot(dx+dw+Wd*.018,ft+2,Wd*.014);
  for(let i=0;i<60;i++){g.fillStyle=['#3f8a3a','#5aa84a','#2e7030'][i%3];g.beginPath();g.ellipse(r(wx-10,W),r(ft*.84,ft),r(4,10),r(2,4),r(-1.2,1.2),0,7);g.fill();}
  for(const px of[.84,.92,.98])pot(X0+Wd*px,ft+2,Wd*.011);
  // stone deck behind + around the pool, drain grate, then the red porch tiles in front
  const deckBot=P.y+P.h+18;g.fillStyle='#cdbfa6';g.fillRect(X0,ft,Wd,deckBot-ft);
  for(let i=0;i<220;i++){g.fillStyle=['#bfae92','#d6c9b0','#a8987e','#c8b89c'][i%4];g.globalAlpha=.55;g.beginPath();g.ellipse(r(X0,W),r(ft,deckBot),r(6,22),r(2,6),0,0,7);g.fill();}g.globalAlpha=1;
  g.fillStyle='#e9e2d2';g.beginPath();g.roundRect(P.x-8,P.y-6,P.w+16,P.h+12,8);g.fill();
  gr=g.createLinearGradient(0,P.y,0,P.y+P.h);gr.addColorStop(0,'#1d5fd0');gr.addColorStop(1,'#2aa0f0');g.fillStyle=gr;g.beginPath();g.roundRect(P.x,P.y,P.w,P.h,6);g.fill();
  g.save();g.beginPath();g.roundRect(P.x,P.y,P.w,P.h,6);g.clip();g.strokeStyle='rgba(10,40,120,.22)';g.lineWidth=1;for(let xx=P.x;xx<P.x+P.w;xx+=9){g.beginPath();g.moveTo(xx,P.y);g.lineTo(xx,P.y+P.h);g.stroke();}for(let yy=P.y;yy<P.y+P.h;yy+=9){g.beginPath();g.moveTo(P.x,yy);g.lineTo(P.x+P.w,yy);g.stroke();}
  g.fillStyle='rgba(0,20,80,.25)';g.fillRect(P.x,P.y,P.w,4);g.restore();
  g.fillStyle='#2a2a2c';g.fillRect(X0,deckBot,Wd,7);g.strokeStyle='#555';g.lineWidth=1;for(let xx=X0;xx<W;xx+=5){g.beginPath();g.moveTo(xx,deckBot+1);g.lineTo(xx,deckBot+6);g.stroke();}
  const ty=deckBot+7,tc=['#8e3d24','#9a4528','#84361f','#a04c2c','#7e3420'];g.fillStyle='#8a3a22';g.fillRect(X0,ty,Wd,H-ty);
  const rows=[];let yy=ty,hh=10;while(yy<H){rows.push([yy,hh]);yy+=hh;hh*=1.18;}
  rows.forEach(([y0,h],ri)=>{const tw=h*1.6,off=(ri%2)*tw/2;for(let xx=X0-off;xx<W;xx+=tw){g.fillStyle=tc[Math.floor(R()*tc.length)];g.fillRect(xx+1,y0+1,tw-2,h-2);const hg=g.createLinearGradient(xx,y0,xx+tw,y0+h);hg.addColorStop(0,'rgba(255,190,150,.14)');hg.addColorStop(1,'rgba(40,10,5,.14)');g.fillStyle=hg;g.fillRect(xx+1,y0+1,tw-2,h-2);}});
  for(const[sx,col,w]of[[.4,'rgba(150,210,255,.12)',.3],[.15,'rgba(120,200,110,.08)',.15],[.85,'rgba(255,240,220,.1)',.12]]){gr=g.createLinearGradient(0,ty,0,H);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(X0+Wd*sx-Wd*w/2,ty,Wd*w,H-ty);}

function openAdvent(){const td=adventToday(),left=td===0?Math.ceil((new Date(new Date().getFullYear(),11,1)-new Date())/864e5):0;
  const order=[7,18,3,12,22,9,15,1,20,5,24,11,16,2,13,8,21,4,19,10,14,6,23,17];
  sheet(sheetHead('Christmas calendar')+`<p class="sm">${td===0?`Door 1 opens on December 1, in <b>${left} day${left===1?'':'s'}</b>. 24 surprises: new outfits, yard decorations, coins and a Christmas Eve gift.`:td>0&&td<=24?'Open today\'s door! Missed one? You can still open every door up to today.':'Feliz Navidad! See you next December.'}</p>
   <div class="advent">${order.map(n=>{const open=S.advent[n],can=td>=n&&td<=31&&td!==99;return`<button class="ad${open?' open':can?' ready':''}${n===24?' big24':''}" data-n="${n}"><b>${n}</b>${open?`<div class="adg">${adventIcon(n)}</div>`:''}</button>`;}).join('')}</div>`,'tall');
  $('sheet').querySelectorAll('.ad').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(S.advent[n]){toast(adventText(n),'');return;}if(!(td>=n&&td<=31)){toast(td===0?'Opens on December '+n:'Not yet! Opens on December '+n,'');sfx('tap');return;}
    S.advent[n]=Date.now();const R=ADVENT[n];let got=[];if(R.it){const s=SHOP.find(x=>x.id===R.it);if(!hasItem(R.it)){S.owned.push(R.it);if(s&&(s.k==='decor'||s.k==='yard'))S.decor.push(R.it);got.push(s?s.n:R.it);}else got.push((s?s.n:R.it)+' (you have it, so +25 coins)'),S.coins+=25;}
    if(R.coins){S.coins+=R.coins;got.push(R.coins+' coins');}if(R.bond){PETS.forEach(p=>addBond(p.name,R.bond));got.push('+'+R.bond+' bond for everyone');}
    if(R.fun){PETS.forEach(p=>bump(p.name,'fun',25));got.push('a play party (+fun for everyone)');}if(R.feast){PETS.forEach(p=>bump(p.name,'food',30));got.push('a nacatamal feast (+food for everyone)');}
    BG=null;save();b.classList.add('pop');sfx('chime');sfx('coins');ACT.forEach(A=>{if(!A.away)hearts(A.x,A.y-70*A.scale,3,'#ffd34a');});
    setTimeout(()=>{openAdvent();toast('Door '+n+': '+got.join(' + '),'coin');topUI();},450);mgt('m','advent '+n);});}
function adventText(n){const R=ADVENT[n],s=R.it&&SHOP.find(x=>x.id===R.it);return'Door '+n+': '+[s?s.n:'',R.coins?R.coins+' coins':''].filter(Boolean).join(' + ');}
function adventIcon(n){const R=ADVENT[n];if(R.it)return`<svg width="34" height="34" viewBox="0 0 36 36">${shopIcon(R.it)}</svg>`;return`<span>${icon('coin',16)}${R.coins}</span>`;}
const GIFTICON='<svg class="ic" width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="8" width="14" height="10" rx="1.5" fill="currentColor" opacity=".35"/><rect x="2" y="6" width="16" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v12M10 6C8 2 4 3 6 6M10 6c2-4 6-3 4 0" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';
const _topUI2=topUI;topUI=function(){_topUI2();const td=adventToday();if(td<0||td===99)return;const shop=$('tShop');if(shop&&!$('tGift')){const b=document.createElement('button');b.className='ib';b.id='tGift';b.setAttribute('aria-label','Christmas calendar');
  const ready=td>=1&&Array.from({length:Math.min(24,td)},(_,i)=>i+1).some(n=>!S.advent[n]);b.innerHTML=GIFTICON+(ready?'<i class="mdot"></i>':'');b.style.position='relative';b.onclick=()=>{sfx('tap');openAdvent();};shop.parentNode.insertBefore(b,shop);}};
const _openMenu2=openMenu;openMenu=function(){_openMenu2();const m=$('sheet').querySelector('.menu'),ph=$('mPhoto');if(!m||!ph)return;
  const a=document.createElement('button');a.innerHTML=GIFTICON+' Christmas calendar';a.onclick=()=>openAdvent();m.insertBefore(a,ph);};
// ---------- BUBBLES game ----------
function startBubbles(p){const A=actorOf(p.name);select(p.name);$('care').classList.remove('on');$('tray').hidden=true;if(A.state==='sleep'){A.state='idle';A.pose='idle';}
  const dog=p.species==='dog';let bubs=[],popped=0,timeLeft=30,walking=false,leap=0,leapB=null,hold=0,hx=0,hy=0,ended=0,best=0,streak=0,lastPop=0;
  const floorY=y=>clamp(y,LAY.floorTop+20,LAY.floorBot-12);
  const blow=(x,y)=>{if(bubs.length>14)return;const gy=floorY(y+rnd(30,90));bubs.push({x,y,gy,r:rnd(14,30),vx:rnd(-30,30),vy:-rnd(20,55),ph:rnd(0,6),life:rnd(7,10),t:0});if(Math.random()<.5)sfx('pop');};
  MODE={kind:'bubbles',hide:B=>B!==A,step(dt){A.scale=depthScale(A.y)*clamp(H/820,.7,1.4)*(dog?1.18:1);timeLeft-=dt;if(timeLeft<=0)return done();
      if(hold>0){hold-=dt;if(Math.random()<dt*7)blow(hx+rnd(-10,10),hy+rnd(-10,10));}
      for(let i=bubs.length-1;i>=0;i--){const b=bubs[i];b.t+=dt;b.x+=(b.vx+Math.sin(b.t*2+b.ph)*24)*dt;b.y+=b.vy*dt;b.vy=Math.max(-70,b.vy-4*dt);
        if(b.t>b.life||b.y<-40){bubs.splice(i,1);puffs(b.x,b.y,4,'rgba(255,255,255,.8)');}}
      // the pet chases the lowest bubble it can reach
      if(leap>0){leap=Math.max(0,leap-dt*2.2);A.jumpH=Math.sin((1-leap)*Math.PI)*120*A.scale;A.pose='walk';A.walkT=.6;
        if(leapB&&leap<.55&&bubs.includes(leapB)){const b=leapB;bubs.splice(bubs.indexOf(b),1);leapB=null;popped++;const now=performance.now()/1000;streak=now-lastPop<2.2?streak+1:1;lastPop=now;best=Math.max(best,streak);
          puffs(b.x,b.y,10,'#e8f8ff','bub');sfx('pop');if(streak>=3)toast(streak+' in a row!','');if(Math.random()<.35)voice(p,{cd:1.5,one:1,vol:.4});}
        return hud();}
      A.jumpH=0;let tgt=null,bd=1e9;for(const b of bubs){const d=Math.abs(b.x-A.x)+Math.abs(b.gy-A.y)*.6+(b.gy-b.y)*.3;if(d<bd){bd=d;tgt=b;}}
      if(tgt){let tx=clamp(tgt.x-A.dir*20*A.scale,30,W-30),ty=tgt.gy;if(inPool(tx,ty,30)){const e=poolEdge(tx);tx=e.x;ty=e.y;}
        const dx=tx-A.x,dy=ty-A.y,dist=Math.hypot(dx,dy),reachH=(dog?190:210)*A.scale;
        if(Math.abs(tgt.x-A.x)<55*A.scale&&Math.abs(tgt.gy-A.y)<60&&A.y-tgt.y<reachH&&A.y-tgt.y>10){leap=1;leapB=tgt;A.dir=tgt.x>A.x?1:-1;sfx('pounce',{pan:panOf(A)});return hud();}
        if(!walking&&dist>34*A.scale)walking=true;if(walking&&dist<14*A.scale)walking=false;
        if(walking){const st=nextStep(A,tx,ty),sx=st.x-A.x,sy=st.y-A.y,sd=Math.hypot(sx,sy)||1,sp=(dog?260:230)*A.scale;A.x+=sx/sd*Math.min(sp*dt,sd);A.y+=sy/sd*Math.min(sp*dt,sd);if(Math.abs(sx)>3)A.dir=sx>0?1:-1;A.pose='walk';A.walkT+=dt*4;}
        else{A.pose='sit';A.dir=tgt.x>A.x?1:-1;A.headTilt=-.25;}}
      else{A.pose='sit';A.headTilt=Math.sin(performance.now()/600)*.15;}
      keepOutOfPool(A);hud();},
    draw(t){for(const b of bubs){const g=cx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,b.r*.1,b.x,b.y,b.r);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.7,'rgba(180,230,255,.12)');g.addColorStop(1,`hsla(${(t*80+b.ph*60)%360},90%,70%,.6)`);
        cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fill();cx.strokeStyle=`hsla(${(t*80+b.ph*60+120)%360},90%,80%,.7)`;cx.lineWidth=1.5;cx.stroke();cx.fillStyle='rgba(255,255,255,.85)';cx.beginPath();cx.ellipse(b.x-b.r*.4,b.y-b.r*.45,b.r*.22,b.r*.12,-.6,0,7);cx.fill();
        cx.fillStyle='rgba(0,0,0,.07)';cx.beginPath();cx.ellipse(b.x,b.gy,b.r*.7,b.r*.18,0,0,7);cx.fill();}
      // the wand at your finger
      if(hold>0){cx.save();cx.translate(hx,hy);cx.strokeStyle='#ff6ab0';cx.lineWidth=4;cx.beginPath();cx.arc(0,0,16,0,7);cx.stroke();cx.beginPath();cx.moveTo(10,12);cx.lineTo(40,60);cx.stroke();cx.restore();}},
    down(x,y){hold=.35;hx=x;hy=y;blow(x,y);},move(x,y,d){if(!d)return;hold=.25;hx=x;hy=y;},up(){hold=0;},
    end(){$('ghud').classList.remove('on');A.jumpH=0;A.state='idle';A.pose='idle';A.headTilt=0;A.timer=2;keepOutOfPool(A);}};
  function hud(){gameHUD(`Bubbles popped: <b>${popped}</b> · best streak ${best} · ${Math.ceil(timeLeft)} s`);}
  function done(){if(ended)return;ended=1;const coins=Math.round(popped*1.5)+best*2;S.coins+=coins;bump(p.name,'fun',12+popped*2);bump(p.name,'energy',-Math.min(25,popped));addBond(p.name,3+Math.floor(popped/4));S.stats.plays++;
    S.best.bubbles=Math.max(S.best.bubbles||0,popped);mgt('e','Bubbles',popped);sfx('coins');endMode();toast(`${p.name} popped ${popped} bubbles! +${coins} coins`,'coin');if(typeof wishDone==='function')wishDone(p.name,'bubbles');}
  overlayBar('Touch the yard to blow bubbles. Hold and drag to blow lots!',[['Done','mStop','']]);$('mStop').onclick=done;hud();}
</script></body></html>
