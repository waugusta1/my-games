  const tries=[[FEED_API,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'}],[FEED_BASE+'pets.json?t='+Date.now(),{cache:'no-store'}]];

  s.playbackRate.value=(o.rate||1)*(1+(o.vary==null?.04:o.vary)*(Math.random()*2-1));g.gain.value=(o.vol==null?1:o.vol)*(.88+Math.random()*.12);
  if(o.pan&&a.createStereoPanner){const p=a.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);s.connect(g);g.connect(p);p.connect(BUS[o.bus||'fx']);}else{s.connect(g);g.connect(BUS[o.bus||'fx']);}
  s.start(t);return{s,g};}
function cool(k,sec){const n=performance.now();if(CD[k]&&n-CD[k]<sec*1000)return false;CD[k]=n;return true;}
function panOf(A){return A?clamp((A.x/W-.5)*1.2,-.8,.8):0;}
// the pet talks: cats meow in their own voice, Bella barks (once or twice)
function voice(p,o){o=o||{};if(!p||!cool('v'+p.name,o.cd==null?1.2:o.cd))return;const A=actorOf(p.name),pan=panOf(A);
  if(p.species==='dog'){play(pick('bark'),{bus:'pets',pan,vol:o.vol||.9});if(!o.one&&Math.random()<.5)play(pick('bark'),{bus:'pets',pan,vol:.8,at:.32+Math.random()*.1});return;}
  const v=VOICE[p.name]||{set:'meow-man',rate:1};play(pick(v.set),{bus:'pets',pan,rate:v.rate,vary:.03,vol:o.vol||.85});}
function sfx(k,o){o=o||{};switch(k){
  case'tap':if(cool('tap',.07))play('tap',{vol:.55,vary:.02});break;case'back':play('back',{vol:.5});break;
  case'coin':play('coin',{vol:.7});break;case'coins':play('coin-small',{vol:.6});break;
  case'chime':case'happy':if(cool('chime',.8))play('chime',{vol:.45,vary:0});break;
  case'kibble':play('kibble',{vol:.8});break;
  case'eat':{play('kibble',{vol:.75});let t=.75;for(let i=0;i<9;i++){play(pick('crunch'),{at:t,vol:.55+Math.random()*.4,vary:.08,pan:o.pan});t+=.2+Math.random()*.17+(i%3===2?.18:0);}break;}
  case'stroke':if(cool('stroke',.38))play(pick('stroke'),{vol:.6,vary:.08});break;
  case'brush':if(cool('brush',.3))play(pick('brush'),{vol:.55,vary:.06});break;
  case'pop':if(cool('pop',.06))play(pick('bubble'),{vol:.55,vary:.12});break;
  case'rinse':play('rinse',{vol:.8,vary:.02});break;case'splash':if(cool('splash',.25))play('splash',{vol:.75,pan:o.pan});break;
  case'throw':play('whoosh',{vol:.6});break;case'bounce':play(pick('bounce'),{vol:.7,pan:o.pan});break;
  case'zap':case'pounce':play('pounce',{vol:.6,pan:o.pan});break;case'whine':if(cool('whine',4))play('whine',{bus:'pets',vol:.5,pan:o.pan});break;}}
// a real cat purr that fades in and out instead of switching on like a buzzer
function purr(on,vol){const a=ac();if(!a||!BUF.purr){if(!on&&PURR){try{PURR.s.stop();}catch(e){}PURR=null;}return;}const t=a.currentTime;
  if(on&&!PURR){const s=a.createBufferSource(),g=a.createGain();s.buffer=BUF.purr;s.loop=true;s.playbackRate.value=.97+Math.random()*.06;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.9,t+.6);s.connect(g);g.connect(BUS.pets);s.start(t,Math.random()*BUF.purr.duration);PURR={s,g};}
  else if(on&&PURR&&vol)PURR.g.gain.setTargetAtTime(vol,t,.3);
  if(!on&&PURR){const P=PURR;PURR=null;P.g.gain.cancelScheduledValues(t);P.g.gain.setValueAtTime(P.g.gain.value,t);P.g.gain.linearRampToValueAtTime(0,t+.7);try{P.s.stop(t+.8);}catch(e){}}}
// a short purr when a cat curls up for a nap
function napPurr(){purr(true,.6);clearTimeout(napPurr.t);napPurr.t=setTimeout(()=>{if(!MODE)purr(false);},3200);}
// yard sounds: birds in the day, crickets at night (off unless turned on in Sound)
function ambience(){const a=AC;if(!a)return;const want=S.sound&&S.ambOn?(isNightNow()?'yard-night':'yard-day'):null;
  if(AMB&&AMB.name===want)return;const t=a.currentTime;
  if(AMB){const P=AMB;AMB=null;P.g.gain.setTargetAtTime(0,t,.6);try{P.s.stop(t+3);}catch(e){}}
  if(want&&BUF[want]){const s=a.createBufferSource(),g=a.createGain();s.buffer=BUF[want];s.loop=true;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+2.5);s.connect(g);g.connect(BUS.amb);s.start(t,Math.random()*BUF[want].duration);AMB={s,g,name:want};}}
function soundOff(){purr(false);if(AMB){try{AMB.s.stop();}catch(e){}AMB=null;}if(AC&&AC.state==='running')AC.suspend();}
// iPad only allows sound after a touch, so wake the audio on the first one
['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{if(S.sound){ac();if(AC&&AC.state==='suspended')AC.resume();}},{passive:true}));

// ---------- care state ----------
function care(n){const c=S.pets[n]=S.pets[n]||{food:70,fun:60,love:60,clean:80,energy:70,bond:0,fed:{},petted:0,acc:null,fur:null};return c;}
function bondLevel(c){let lv=1,need=60,x=c.bond;while(x>=need&&lv<10){x-=need;lv++;need=Math.round(need*1.35);}return{lv,into:x,need};}
function addBond(n,v){const c=care(n),b0=bondLevel(c).lv;c.bond+=v;const b1=bondLevel(c).lv;if(b1>b0){toast(`${n} bond level ${b1}!`,'heart');sfx('chime');if(b1>=5)mgt('m','bond5');}}
function mood(c){return(c.food+c.fun+c.love+c.clean+c.energy)/5;}
function moodWord(m){return m>=80?'Over the moon':m>=62?'Happy':m>=45?'Okay':m>=28?'Grumpy':'Sad';}
function bump(n,k,v){const c=care(n);c[k]=clamp(c[k]+v,0,100);}
function hasItem(id){return S.owned.includes(id);}
function nightOwl(p){return p.night_visits>=Math.max(8,p.passes*.25);}
// time passes while the game is closed
function catchUp(){
  const hrs=clamp((Date.now()-(S.lastT||Date.now()))/3600000,0,72),hr=new Date().getHours();
  for(const p of PETS){const c=care(p.name);c.food=clamp(c.food-5*hrs,5,100);c.fun=clamp(c.fun-4*hrs+(hasItem('tree_cat')&&p.species==='cat'?hrs:0),5,100);c.love=clamp(c.love-2.5*hrs,5,100);c.clean=clamp(c.clean-1.5*hrs,5,100);
    c.energy=clamp(c.energy+(hrs>6?40:hrs*3),5,100);}
}
// what the camera saw since last time = their real adventures
function cameraReport(){
  const out=[];if(FEED.state==='demo'){return out;}
  const first=!S.lastPasses;S.lastPasses=S.lastPasses||{};
  for(const p of PETS){const before=S.lastPasses[p.name];S.lastPasses[p.name]=p.passes;if(first||before==null)continue;
    const v=Math.max(0,Math.min(40,p.passes-before));const zk=p.zoomies-(S.lastZoom[p.name]==null?p.zoomies:S.lastZoom[p.name]);
    if(v>0){const c=care(p.name);c.fun=clamp(c.fun+6*v,0,100);c.energy=clamp(c.energy-3*v,5,100);c.clean=clamp(c.clean-2*v,5,100);
      const coins=5*v;S.coins+=coins;out.push({p,v,z:Math.max(0,zk),coins});if(zk>0){c.energy=clamp(c.energy-8*zk,5,100);c.fun=clamp(c.fun+10*zk,0,100);}}}
  PETS.forEach(p=>S.lastZoom[p.name]=p.zoomies);
  return out;
}

// ---------- fur colours from the real photo ----------
function furFromPhoto(p,im){
  try{const n=28,c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d',{willReadFrequently:true});const s=Math.min(im.naturalWidth,im.naturalHeight);
    g.drawImage(im,(im.naturalWidth-s*.6)/2,(im.naturalHeight-s*.6)/2,s*.6,s*.6,0,0,n,n);const d=g.getImageData(0,0,n,n).data,px=[];
    for(let i=0;i<d.length;i+=4)px.push([d[i],d[i+1],d[i+2]]);
    let cen=[px[0],px[Math.floor(px.length/2)],px[px.length-1]].map(v=>v.slice());const asg=new Array(px.length);
    for(let it=0;it<8;it++){px.forEach((q,i)=>{let b=0,bd=1e9;cen.forEach((c2,j)=>{const dd=(q[0]-c2[0])**2+(q[1]-c2[1])**2+(q[2]-c2[2])**2;if(dd<bd){bd=dd;b=j;}});asg[i]=b;});
      cen=cen.map((c2,j)=>{const m=px.filter((q,i)=>asg[i]===j);if(!m.length)return c2;return[0,1,2].map(k=>m.reduce((a,q)=>a+q[k],0)/m.length);});}
    const cnt=cen.map((c2,j)=>asg.filter(a=>a===j).length),ord=[0,1,2].sort((a,b)=>cnt[b]-cnt[a]);
    const hex=v=>'#'+v.map(x=>Math.round(clamp(x,0,255)).toString(16).padStart(2,'0')).join('');
    const base=cen[ord[0]],acc=cen[ord[1]],lum=v=>.3*v[0]+.59*v[1]+.11*v[2];
    const type=lum(acc)>200&&lum(base)<150?'tux':Math.abs(lum(base)-lum(acc))>45?'tabby':'solid';
    return{base:hex(base),accent:hex(acc),type,auto:1};
  }catch(e){return null;}
}
// what each pet really looks like (from the camera photos). Changeable in the Diary.
const DEF_FUR={Buster:{type:'van',base:'#f6f2ea',accent:'#d9853b'},Galaxy:{type:'van',base:'#f6f2ea',accent:'#7a716a'},
 Cloudy:{type:'van',base:'#f6f2ea',accent:'#2a2522',spots:1},Man:{type:'van',base:'#f6f2ea',accent:'#6b4f3a'},Bella:{type:'shepherd',base:'#b9793a',accent:'#1f1a17'}};
function furOf(p){const c=care(p.name);if(c.fur)return c.fur;return DEF_FUR[p.name]||(p.species==='dog'?DEF_FUR.Bella:{base:'#8a8f99',accent:'#5a5f69',type:'solid'});}

// ---------- drawing the pets (connected shapes, side view, facing right) ----------
function legPath(c,x0,y0,x1,y1,w0,w1,col){const a=Math.atan2(y1-y0,x1-x0)+Math.PI/2,ca=Math.cos(a),sa=Math.sin(a);
  c.fillStyle=col;c.beginPath();c.moveTo(x0+ca*w0,y0+sa*w0);c.lineTo(x1+ca*w1,y1+sa*w1);c.arc(x1,y1,w1,a,a+Math.PI);c.lineTo(x0-ca*w0,y0-sa*w0);c.closePath();c.fill();
  c.beginPath();c.ellipse(x1+3,y1-1,w1*1.35,w1*.85,0,0,7);c.fill();}
function drawPet(c,A,t){
  const p=A.p,f=furOf(p),dog=p.species==='dog',base=f.base,acc=f.accent,dark=shade(base,-.28),light=shade(base,.35);
  const belly=f.type==='tux'?'#f4f0e8':f.type==='shepherd'?shade(base,.25):light,paws=f.type==='tux'?'#f4f0e8':null;
  const tailC=(f.type==='van'||f.type==='shepherd')?acc:base;
  const k=A.scale;c.save();c.translate(A.x,A.y);c.scale(A.dir*k,k);
  // ground shadow
  c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(0,2,dog?72:58,9,0,0,7);c.fill();
  const pose=A.pose,walk=A.walkT||0,bob=pose==='walk'?Math.abs(Math.sin(walk*2))*3:0,breath=Math.sin(t*2.4+A.seed)*1.2;
  const L=dog?46:34,bodyY=-(L+(dog?20:16))-bob; // shoulder height
  const tailWag=Math.sin(t*(A.happy?14:3)+A.seed)*(A.happy?.5:.18);
  const pattern=(clipFn,sleep)=>{const by=sleep?-30:bodyY;if(f.type==='tabby'||f.type==='patches'||f.type==='shepherd'||(f.type==='van'&&f.spots)){c.save();clipFn();c.clip();c.fillStyle=acc;c.globalAlpha=f.type==='tabby'?.55:.95;
      if(f.type==='tabby')for(let i=-4;i<5;i++){c.beginPath();c.ellipse(i*15,by-14,4,22,.25,0,7);c.fill();}
      else if(f.type==='shepherd'){c.beginPath();c.ellipse(-10,by-20,54,19,-.05,0,7);c.fill();}           // black saddle
      else if(f.type==='van'){c.beginPath();c.ellipse(-18,by-14,13,10,.2,0,7);c.fill();}                     // spot on the back
      else{c.beginPath();c.ellipse(-24,by-6,26,18,.3,0,7);c.fill();c.beginPath();c.ellipse(22,by-14,16,12,-.2,0,7);c.fill();}c.restore();}};
  if(pose==='sleep'){ // curled up loaf
    const by=-24+breath;c.fillStyle=base;
    c.lineCap='round';c.strokeStyle=tailC;c.lineWidth=dog?14:11;c.beginPath();c.moveTo(-40,-10);c.quadraticCurveTo(-10,8,34,-4);c.stroke();c.strokeStyle=shade(tailC,-.25);c.lineWidth=dog?6:5;c.beginPath();c.moveTo(20,-4);c.lineTo(34,-4);c.stroke();
    const body=()=>{c.beginPath();c.moveTo(-50,0);c.bezierCurveTo(-62,by-34,30,by-44,46,-6);c.lineTo(-50,0);c.closePath();};
    body();c.fill();pattern(body,1);c.fillStyle=belly;c.beginPath();c.ellipse(26,-8,18,8,0,0,7);c.fill();
    drawHead(c,A,{x:34,y:-22,tilt:.5,sleep:1,dog,base,dark,light,acc,f},t);
    c.restore();return;}
  if(pose==='sit'){
    // tail curled on the floor
    c.lineCap='round';c.strokeStyle=tailC;c.lineWidth=dog?12:10;c.beginPath();c.moveTo(-30,-8);c.quadraticCurveTo(-50,0,-20+Math.sin(t*2+A.seed)*6,2);c.stroke();
    const body=()=>{c.beginPath();c.moveTo(-34,0);c.bezierCurveTo(-46,-40,-20,-(L+40),14,-(L+38));c.bezierCurveTo(30,-(L+20),28,-20,24,0);c.closePath();};
    c.fillStyle=base;body();c.fill();pattern(body);
    c.fillStyle=belly;c.beginPath();c.ellipse(16,-(L+14),10,20,-.15,0,7);c.fill();
    legPath(c,14,-(L+12),18,-4,8,6,paws||base);legPath(c,4,-(L+12),6,-4,8,6,paws?shade(paws,-.1):dark);
    c.fillStyle=base;c.beginPath();c.ellipse(-22,-12,22,14,0,0,7);c.fill(); // haunch

  // standing / walking / eating
  const sw=pose==='walk'?Math.sin(walk*2):0,sw2=pose==='walk'?Math.sin(walk*2+Math.PI):0,lift=v=>pose==='walk'?Math.max(0,v)*6:0;
  // tail
  c.save();c.translate(-50,bodyY+4);c.rotate((f.type==='shepherd'?-.2:-.6)+tailWag);c.lineCap='round';c.strokeStyle=tailC;c.lineWidth=f.type==='shepherd'?15:dog?11:10;c.beginPath();c.moveTo(0,0);
  if(f.type==='shepherd'){c.quadraticCurveTo(-26,10,-34,36);}else if(dog){c.quadraticCurveTo(-18,-22,-10,-44);}else{c.bezierCurveTo(-20,-20,-12,-50,4,-62);}c.stroke();c.strokeStyle=f.type==='shepherd'?shade(acc,.15):dog?light:f.type==='van'?shade(acc,-.2):acc;c.lineWidth=dog?6:7;c.beginPath();if(f.type==='shepherd'){c.moveTo(-30,26);c.lineTo(-34,36);}else if(dog){c.moveTo(-14,-34);c.lineTo(-10,-44);}else{c.moveTo(-2,-56);c.lineTo(4,-62);}c.stroke();c.restore();
  // far legs
  legPath(c,-40,bodyY+10,-40+sw2*12,-lift(sw2),dog?9:8,dog?6:5,paws?shade(paws,-.15):dark);legPath(c,30,bodyY+10,30+sw*12,-lift(sw),dog?9:8,dog?6:5,paws?shade(paws,-.15):dark);
  // body
  const body=()=>{c.beginPath();c.moveTo(40,bodyY-18+breath*.5);c.bezierCurveTo(10,bodyY-26,-40,bodyY-26,-58,bodyY-10);c.bezierCurveTo(-66,bodyY+4,-56,bodyY+20,-40,bodyY+18);
    c.bezierCurveTo(-10,bodyY+26,20,bodyY+24,38,bodyY+16);c.bezierCurveTo(50,bodyY+10,50,bodyY-12,40,bodyY-18+breath*.5);c.closePath();};
  c.fillStyle=base;body();c.fill();pattern(body);
  c.save();body();c.clip();c.fillStyle=belly;c.globalAlpha=f.type==='tux'?1:.55;c.beginPath();c.ellipse(4,bodyY+22,44,12,0,0,7);c.fill();c.globalAlpha=.18;c.fillStyle='#fff';c.beginPath();c.ellipse(-6,bodyY-18,40,7,0,0,7);c.fill();c.restore();

  drawHead(c,A,{x:hx,y:hy,tilt:eat?.5:A.headTilt||0,dog,base,dark,light,acc,f},t);

  }else if(dog){
    c.fillStyle=base;c.beginPath();c.ellipse(0,0,22,20,0,0,7);c.fill();
    c.beginPath();c.moveTo(10,-10);c.quadraticCurveTo(34,-8,38,4);c.quadraticCurveTo(38,14,16,14);c.closePath();c.fill(); // snout
    c.fillStyle=f.type==='tux'?'#f4f0e8':light;c.beginPath();c.ellipse(26,8,12,7,0,0,7);c.fill();

    c.fillStyle=f.type==='patches'?f.accent:dark;c.beginPath();c.moveTo(-6,-16);c.bezierCurveTo(-26,-18,-30,10,-18+Math.sin(t*3+A.seed)*2,22);c.bezierCurveTo(-8,14,-2,-4,4,-14);c.closePath();c.fill(); // floppy ear

      c.beginPath();c.ellipse(-12,-4,9,9,0,0,7);c.fill();c.fillStyle=base;c.beginPath();c.moveTo(8,-17);c.quadraticCurveTo(13,-8,16,2);c.lineTo(6,2);c.quadraticCurveTo(6,-8,8,-17);c.fill();c.restore();} // white blaze

function inPool(x,y,m){const P=LAY.pool;m=m||0;return x>P.x-m&&x<P.x+P.w+m&&y>P.y-m&&y<P.y+P.h+m;}
// path around the pool: the pool is solid for walking (only Bella swims, and only after a ball in the water)
function segHitsPool(x1,y1,x2,y2,m){for(let k=0;k<=30;k++){const q=k/30;if(inPool(x1+(x2-x1)*q,y1+(y2-y1)*q,m))return true;}return false;}

// if a walker ends up on the water, step it back out to the closest edge
function keepOutOfPool(A){const P=LAY.pool;if(!inPool(A.x,A.y,6))return;const opts=[{x:A.x,y:P.y+P.h+14},{x:P.x-14,y:A.y},{x:P.x+P.w+14,y:A.y}];
  if(P.y-10>LAY.floorTop)opts.push({x:A.x,y:P.y-10});let b=opts[0];for(const o of opts)if(Math.hypot(o.x-A.x,o.y-A.y)<Math.hypot(b.x-A.x,b.y-A.y))b=o;A.x=b.x;A.y=b.y;}

function nextStep(A,gx,gy){const w=routeAround(A.x,A.y,gx,gy);return w.length?w[0]:{x:gx,y:gy};}

  if(inPool(A.tx,A.ty,14)){const e=poolEdge(A.tx);A.tx=e.x;A.ty=e.y;}
  A.wp=null; // walk around the pool (see nextStep)
  A.then=then||null;A.speed=speed||rnd(60,90);}
function sleepyNow(p,c){const h=new Date().getHours(),night=h>=22||h<5;return c.energy<25||(night&&!nightOwl(p));}
function think(A){
  const c=care(A.p.name),z=zoneOf(A.p);

  if(sleepyNow(A.p,c)&&Math.random()<.7){goTo(A,A.bed.x,A.bed.y+2,()=>{A.state='sleep';A.pose='sleep';});return;}

    if(A.p.species==='dog'&&inPool(A.x,A.y,-4)){const P=LAY.pool,wl=clamp(A.y-4*A.scale,P.y+5,P.y+P.h-4),bob=Math.sin(NOW*3)*1.5;cx.save();cx.beginPath();cx.rect(0,0,W,wl);cx.clip();cx.translate(0,30*A.scale+bob);drawPet(cx,A,NOW);cx.restore();

function gameHUD(text){$('ghud').innerHTML=text;$('ghud').classList.add('on');}
function startLaser(p){
  const A=actorOf(p.name);select(p.name);$('care').classList.remove('on');$('tray').hidden=true;if(A.state==='sleep'){A.state='idle';A.pose='idle';}
  // move the dot to make the cat run (metres), hold it still so it pounces (catches)
  let dot={x:W*.7,y:(LAY.floorTop+LAY.floorBot)/2},catches=0,run=0,time=30,still=0,pounce=0,rest=0;const ox=A.x,oy=A.y;
  const pts=()=>catches*5+Math.floor(run/4);
  MODE={hide:B=>B!==A,step(dt){time-=dt;A.scale=depthScale(A.y)*clamp(H/820,.7,1.4);const wet=inPool(dot.x,dot.y,6),goal=wet?poolEdge(dot.x):dot,tg=nextStep(A,goal.x,goal.y),detour=tg!==goal&&(tg.x!==goal.x||tg.y!==goal.y),dx=tg.x-A.x,dy=tg.y-A.y,d=Math.hypot(dx,dy);if(Math.abs(dx)>4)A.dir=dx>0?1:-1;still+=dt;if(wet)still=0;
      if(rest>0){rest-=dt;A.pose='sit';A.happy=1;}
      else if(pounce>0){pounce-=dt;A.pose='walk';A.walkT+=dt*14;const v=Math.min(d,700*dt);A.x+=dx/(d||1)*v;A.y+=dy/(d||1)*v;keepOutOfPool(A);
        if(d<20*A.scale&&!wet&&!detour){catches++;sfx('pounce',{pan:panOf(A)});if(Math.random()<.25)voice(p,{cd:4,vol:.6});puffs(dot.x,dot.y,10,'#ff3a3a');hearts(A.x,A.y-70*A.scale,2);pounce=0;rest=1.1;}
        else if(pounce<=0){A.pose='sit';rest=.4;}}
      else if(d>30*A.scale){A.pose='walk';const v=Math.min(d,(170+catches*6)*dt*A.scale);A.x+=dx/d*v;A.y+=dy/d*v;keepOutOfPool(A);run+=v/(55*A.scale);A.walkT+=dt*10;
        if(still>.6&&d<260*A.scale&&!detour)pounce=.45;}
      else if(detour){A.x=tg.x;A.y=tg.y;}
      else{A.pose='sit';if(still>.6){/* sitting right on the dot: no pounce, move it away */}}
      gameHUD(`<b>${catches}</b> pounces · ${Math.round(run)} m run · ${Math.max(0,Math.ceil(time))} s`);if(time<=0)done();},
    draw(t){cx.fillStyle='rgba(255,40,40,.25)';cx.beginPath();cx.arc(dot.x,dot.y,16,0,7);cx.fill();cx.fillStyle='#ff2a2a';cx.beginPath();cx.arc(dot.x,dot.y,6+Math.sin(t*20),0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(dot.x,dot.y,2.2,0,7);cx.fill();},
    down(x,y){dot={x,y:clamp(y,LAY.floorTop,LAY.floorBot)};still=0;},move(x,y,d){if(!d)return;const ny=clamp(y,LAY.floorTop,LAY.floorBot);if(Math.hypot(x-dot.x,ny-dot.y)>3)still=0;dot={x,y:ny};},up(){},
    end(){$('ghud').classList.remove('on');A.x=ox;A.y=oy;A.state='idle';A.pose='idle';A.timer=2;}};
  const done=()=>{const score=pts(),bonus=hasItem('wand')?1.2:1,fun=Math.round(Math.min(60,10+score*1.5)*bonus),coins=Math.min(40,score);bump(p.name,'fun',fun);bump(p.name,'energy',-Math.min(25,8+run/10));S.coins+=coins;addBond(p.name,4+catches);
    S.stats.plays++;if(score>S.best.laser)S.best.laser=score;if(catches>=8)mgt('m','play20');mgt('e','Laser',score);sfx('coins');const c=catches,r=Math.round(run);endMode();toast(`${c} pounces, ${r} m run! +${fun} fun, +${coins} coins`,'coin');};
  overlayBar('Move the laser to make '+esc(p.name)+' run. Hold it still and she pounces!'.replace('she',p.name==='Buster'?'he':'she'),[['Stop','mStop','']]);$('mStop').onclick=done;
}
function startFetch(p){
  const A=actorOf(p.name);select(p.name);$('care').classList.remove('on');$('tray').hidden=true;if(A.state==='sleep'){A.state='idle';A.pose='idle';}
  const home={x:W*.62,y:LAY.floorBot-6};A.x=home.x;A.y=home.y;let ball=null,score=0,throws=8,phase='ready',wet=0;const ox=A.x,oy=A.y;
  MODE={hide:B=>B!==A,step(dt){A.scale=depthScale(A.y)*clamp(H/820,.7,1.4)*1.18;
      if(ball&&ball.fly){ball.t+=dt/ball.d;const k=Math.min(1,ball.t);ball.x=ball.x0+(ball.x1-ball.x0)*k;ball.y=ball.y0+(ball.y1-ball.y0)*k;ball.h=Math.sin(k*Math.PI)*ball.d*260;if(k>=1){ball.fly=false;phase='run';sfx('bounce',{pan:(ball.x/W-.5)});
        const P=LAY.pool;if(ball.x>P.x&&ball.x<P.x+P.w&&ball.y>P.y-6&&ball.y<P.y+P.h){ball.pool=1;ball.y=clamp(ball.y,P.y+P.h*.5,P.y+P.h*.8);ball.x=clamp(ball.x,P.x+P.w*.08,P.x+P.w*.92);sfx('splash',{pan:(ball.x/W-.5)});puffs(ball.x,ball.y,14,'#8ad0f0','drop');}}}
      if(phase==='run'||phase==='back'){const goal=phase==='run'?ball:home,swimTo=phase==='run'&&ball.pool,tg=swimTo||inPool(A.x,A.y,2)?goal:nextStep(A,goal.x,goal.y),dx=tg.x-A.x,dy=tg.y-A.y,d=Math.hypot(dx,dy);A.dir=dx>0?1:-1;A.pose='walk';A.walkT+=dt*14;const v=380*dt;
        if(d>6){A.x+=dx/d*Math.min(v,d);A.y+=dy/d*Math.min(v,d);if(ball.pool&&phase==='run'){const P=LAY.pool;if(A.x>P.x&&A.x<P.x+P.w&&A.y>P.y&&A.y<P.y+P.h&&Math.random()<.3)puffs(A.x,A.y,2,'#8ad0f0','drop');}}
        else if(phase==='run'){phase='back';ball.held=1;if(ball.pool){wet++;sfx('splash',{pan:panOf(A)});}if(Math.random()<.35)voice(p,{cd:3,one:1,vol:.7});}else{phase='ready';score++;A.happy=1.5;hearts(A.x,A.y-90*A.scale,2);ball=null;A.pose='sit';if(throws<=0)done();}}
      if(ball&&ball.held){ball.x=A.x+A.dir*60*A.scale;ball.y=A.y;ball.h=58*A.scale;}
      gameHUD(`<b>${score}</b> fetched · ${throws} balls left`);},
    draw(){if(!ball)return;cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(ball.x,ball.y,8,3,0,0,7);cx.fill();cx.fillStyle='#d8e84a';cx.beginPath();cx.arc(ball.x,ball.y-ball.h-7,8,0,7);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.beginPath();cx.arc(ball.x-6,ball.y-ball.h-7,7,-.9,.9);cx.stroke();},
    down(x,y){if(phase!=='ready'||throws<=0)return;y=clamp(y,LAY.floorTop+4,LAY.floorBot);x=clamp(x,W*.47,W*.97);throws--;sfx('throw');if(Math.random()<.4)voice(p,{cd:3,one:1,vol:.8});const d=clamp(Math.hypot(x-home.x,y-home.y)/600,.35,1);
      ball={x0:home.x,y0:home.y,x1:x,y1:y,x:home.x,y:home.y,h:0,t:0,d,fly:true};phase='wait';},up(){},
    end(){$('ghud').classList.remove('on');A.x=ox;A.y=oy;A.state='idle';A.pose='idle';A.timer=2;}};
  const done=()=>{const bonus=hasItem('ball')?1.2:1,fun=Math.round(Math.min(60,10+score*6)*bonus),coins=score*3;bump(p.name,'fun',fun);bump(p.name,'energy',-15);if(wet)bump(p.name,'clean',-10*wet);S.coins+=coins;addBond(p.name,4+score*2);
    S.stats.plays++;if(score>S.best.fetch)S.best.fetch=score;if(score>=8)mgt('m','play20');mgt('e','Fetch',score);sfx('coins');const s=score;endMode();toast(`${s} fetched! +${fun} fun, +${coins} coins${wet?' (and a wet dog)':''}`,'coin');};
  overlayBar('Tap the yard to throw the ball',[['Stop','mStop','']]);$('mStop').onclick=done;
}

   ${sl('pets','Pet voices','Real meows, barks and purring')}${sl('fx','Sound effects','Eating, bath, toys, coins')}
   <button class="tog${S.ambOn?' on':''}" id="sAmb"><span>Yard sounds<small>Birds in the day, crickets at night</small></span><i></i></button>${sl('amb','Yard volume','')}
   <button class="go wide" id="sTest">Test: hear your pets</button><button class="wide" data-close>Done</button>
   <p class="cred">Real recordings: cats, Bella, water and brushing from the ESC-50 set (Freesound.org recordists, CC BY-NC); toys, food and buttons by Kenney (CC0).</p></div>`,'small');
  $('sheet').querySelectorAll('[data-v]').forEach(r=>{r.oninput=()=>{ac();setVol(r.dataset.v,r.value/100);};r.onchange=()=>{save();if(r.dataset.v==='pets')voice(PETS[Math.floor(Math.random()*PETS.length)],{cd:0,one:1});else if(r.dataset.v==='fx')sfx('coins');};});
  $('sOn').onclick=()=>{S.sound=!S.sound;save();if(!S.sound)soundOff();else{ac();ambience();}openSound();};
  $('sAmb').onclick=()=>{S.ambOn=!S.ambOn;save();ac();ambience();openSound();};
  $('sTest').onclick=()=>{if(!S.sound){S.sound=true;save();}ac();PETS.forEach((p,i)=>setTimeout(()=>voice(p,{cd:0,one:1}),300+i*1100));};}
function openHelp(){sheet(sheetHead('How Pet Life works')+`<div class="help"><p>Your five pets live here, and the security camera keeps them real. Every hour it sends what it saw:</p>
  <ul><li>A pet the camera saw in the last hour is <b>out in the yard</b> here too.</li><li>Every real visit since you last played gives that pet fun (and makes it a bit dirtier and more tired) and gives you <b>5 coins</b>.</li>
  <li>Real zoomies burn energy. Night owls stay up at night.</li><li>The <b>Diary</b> has each pet's real photos, visits, favourite hours and badges.</li><li>Each pet is drawn to look like the real one. You can change how they look in the Diary.</li></ul>
  <p>Keep their food, fun, love, clean and energy up. Pets that are cared for grow their bond with you.</p></div>`,'small');}
function openCamInfo(){const f=FEED;sheet(sheetHead('The camera')+`<div class="help">${f.state==='demo'?'<p>The camera hasn\'t sent its first update yet, so these are demo pets. Type <b>/games</b> in Discord to check on it.</p>':
  `<p>Last update from the camera: <b>${agoText(f.updated)}</b>${f.state==='cached'?' (you are offline, this is the last copy)':''}.</p><p>It updates every hour. Recent visits:</p><ul>${(f.recent||[]).slice(-8).reverse().map(r=>`<li><b>${esc(r.pet)}</b> · ${agoText(r.time)}</li>`).join('')||'<li>None yet</li>'}</ul>`}
  <button class="go wide" id="cRef">Check for new data</button></div>`,'small');$('cRef').onclick=async()=>{$('cRef').textContent='Asking the camera...';await boot(true);closeSheet();};}
function showReport(rep,daily){
  if(!rep.length&&!daily)return;
  sheet(sheetHead('While you were away')+`<div class="help">${daily?`<p class="daily">${icon('coin',18)} Daily visit bonus: <b>+20 coins</b></p>`:''}
   ${rep.length?`<p>The camera saw your pets go out:</p><div class="rep">${rep.map(r=>`<div>${photoTag(r.p,'th')}<b>${esc(r.p.name)}</b><span>${r.v} visit${r.v>1?'s':''}${r.z?' · zoomies!':''}</span><em>${icon('coin',14)}+${r.coins}</em></div>`).join('')}</div>`:''}
   <button class="go wide" data-close>Nice!</button></div>`,'small');
}

// ---------- boot ----------
async function boot(refresh){
  FEED=await loadFeed();PETS=FEED.pets;
  PETS.forEach(p=>{const im=petPhoto(p,'photo');if(im){const f=()=>{const fr=furFromPhoto(p,im);if(fr){p._fur=fr;delete PORT[p.name];}};if(photoReady(im))f();else im.addEventListener('load',f,{once:true});}});
  if(!refresh){catchUp();makeActors();}else{ACT.forEach(A=>{const np=petByName(A.p.name);if(np)A.p=np;});}
  const rep=cameraReport();const today=new Date().toISOString().slice(0,10);let daily=false;if(S.lastDaily!==today){S.lastDaily=today;S.coins+=20;daily=true;}
  save();$('ui').hidden=false;$('load').hidden=true;refreshAll();showReport(rep,daily);
}
resize();layout();requestAnimationFrame(frame);
boot();
setInterval(()=>{if(document.hidden||MODE)return;const m=1/60;for(const p of PETS){const c=care(p.name);c.food=clamp(c.food-5*m,0,100);c.fun=clamp(c.fun-4*m,0,100);c.love=clamp(c.love-2.5*m,0,100);c.clean=clamp(c.clean-1.5*m,0,100);
  const A=actorOf(p.name);if(!A||A.state!=='sleep')c.energy=clamp(c.energy-3*m,0,100);}save();careUI();trayUI();},60000);
setInterval(()=>{if(document.hidden||MODE||!S.sound||!AC)return;ambience();const hungry=PETS.filter(p=>{const A=actorOf(p.name);return A&&A.state!=='sleep'&&care(p.name).food<25;});
  if(hungry.length&&Math.random()<.5)voice(hungry[Math.floor(Math.random()*hungry.length)],{cd:40,one:1,vol:.65});},30000); // a hungry pet asks for food now and then
setInterval(()=>{if(!document.hidden)boot(true);},20*60000); // new camera data comes every hour
document.addEventListener('visibilitychange',()=>{if(document.hidden){purr(false);if(AC&&AC.state==='running')AC.suspend();save();}else if(S.sound&&AC){AC.resume();ambience();}});
</script></body></html>
