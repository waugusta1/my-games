function makeFoe(round,heat){const f=FOES[(round*3+((R()*FOES.length)|0))%FOES.length];const cls=pick(['v','p','t']);const budget=Math.round((10+round*9.5)*(.72+Math.min(.3,round*.03))*(1+heat*.08));const cols=Math.min(7,4+Math.ceil(round/3)),rows=Math.min(5,3+Math.ceil(round/4));

function mkSide(pack,hp,isP){const s={hp,max:hp,block:0,poison:0,burn:0,regen:0,stun:0,haste:0,crit:0,thorns:0,poPlus:0,buPlus:0,poTick:1,items:[],isP,dmgDealt:0,flash:0,lunge:0};

  for(const q of s.items){if(!touching(o.p,q.p))continue;const g=q.it;if(g.adjA&&it.k==='wpn')o.adjA+=g.adjA;if(g.adjB&&it.k==='shield')o.adjB+=g.adjB;if(g.adjBurn&&it.k==='wpn')o.burn+=g.adjBurn;if(g.adjPoison&&it.k==='wpn')o.poison+=g.adjPoison;if(g.adjSpeed)o.spd+=g.adjSpeed;if(g.adjLeech&&it.k==='wpn')o.leech+=g.adjLeech;if(g.adjBow&&it.bow)o.spd+=g.adjBow;if(g.adjDouble&&it.k==='wpn')o.dbl+=g.adjDouble;}}

function fireItem(a,d,o){const it=o.it;o.fire=1;
