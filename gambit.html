.modal .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.bigStars{display:flex;gap:10px;justify-content:center;margin-top:16px}
.bigStars svg{width:54px;height:54px;transform:scale(0);animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.rew{display:flex;justify-content:center;gap:24px;margin-top:16px;font-size:18px}
.rew span{display:inline-flex;align-items:center;gap:6px}
.rew svg{width:22px;height:22px}
.goalList{margin:14px auto 0;text-align:left;display:inline-block;font-size:15px}
.goalList div{display:flex;align-items:center;gap:8px;margin:3px 0}
.goalList svg{width:18px;height:18px}
#promo .card{padding:18px;display:flex;gap:10px}
#promo button{width:92px;height:92px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(216,180,106,.4)}
#promo canvas{width:80px;height:80px}
/* lists */
.page{position:absolute;inset:0;padding:calc(76px + env(safe-area-inset-top)) 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.item{padding:14px;border-radius:10px;background:linear-gradient(180deg,rgba(58,38,24,.9),rgba(30,19,11,.9));border:1px solid #6a4a2a;display:flex;flex-direction:column;gap:8px;position:relative}
.item.on{border-color:#f0cf86;box-shadow:0 0 0 2px rgba(240,207,134,.45)}
.item canvas{width:100%;border-radius:6px}
.item b{font-size:18px}
.item .plq{min-height:40px}
.secT{font-size:22px;margin:8px 0 12px;letter-spacing:.06em;color:#f0d79a}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(216,180,106,.2)}
.ach.got{background:linear-gradient(100deg,rgba(216,180,106,.22),rgba(0,0,0,.2));border-color:rgba(240,207,134,.6)}
.ach .med{width:46px;height:46px;flex:none}
.ach b{display:block;font-size:16px}.ach small{font-size:13px;color:var(--ivory2)}
.stat{padding:12px;border-radius:10px;background:rgba(0,0,0,.28);text-align:center}
.stat b{display:block;font-size:28px;color:#f0d79a}.stat small{color:var(--ivory2);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
/* free play */
#freeOv .card,#setOv .card{width:min(600px,95vw);padding:24px}
.optRow{display:flex;align-items:center;gap:12px;margin:12px 0;flex-wrap:wrap}
.optRow>span{width:110px;font-size:16px;color:var(--ivory2)}
.seg{display:flex;flex:1;border-radius:7px;overflow:hidden;border:1px solid #7a5631}
.seg button{flex:1;min-height:44px;font-size:15px;background:rgba(0,0,0,.3);border-right:1px solid rgba(122,86,49,.6)}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(180deg,#f3d68e,#c79a48);color:#2a1806;font-weight:700}
input[type=range]{flex:1;accent-color:#d8b46a;height:30px}
#lvlLbl{min-width:150px;text-align:right;font-size:15px}
#toast{visibility:hidden;position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-140%);transition:transform .35s;z-index:90;padding:12px 20px;border-radius:10px;background:linear-gradient(180deg,#f3d68e,#c79a48);color:#2a1806;font-size:17px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;pointer-events:none}
#toast.on{transform:translate(-50%,0);visibility:visible}
#toast svg{width:30px;height:30px}
#pause .card{padding:26px;display:flex;flex-direction:column;gap:12px;min-width:300px;align-items:stretch}
#pause h2{text-align:center;font-size:30px;margin-bottom:6px}
#pause .__gb{font-family:var(--serif)!important;background:linear-gradient(180deg,#4a3120,#2b1a0f)!important;color:var(--ivory)!important;border:1px solid #7a5631!important;border-radius:6px!important;box-shadow:0 3px 0 #0f0805!important}
.portrait #tHero{width:100%;height:42%;bottom:auto;top:40px}
.portrait #tMenu{width:auto;left:6%;right:6%;top:44%;bottom:auto;padding-top:0}
.portrait #vList{grid-template-columns:repeat(3,1fr)}
</style>

function dailyIdx(){const d=today();let h=2166136261;for(const ch of d){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}const pool=[];PZ.forEach((p,i)=>{if(p[2]>=1050&&p[2]<=1900)pool.push(i);});return pool[(h>>>0)%pool.length];}
/* ---------------- collection & trophies ---------------- */
function renderCollection(){refreshCoins();const pg=$('#cPage');let h='<div class="secT">Boards</div><div class="grid" id="cBoards"></div><div class="secT" style="margin-top:22px">Piece sets</div><div class="grid" id="cSets"></div><div class="secT" style="margin-top:22px">Hints</div><div class="grid" id="cHintShop"></div>';pg.innerHTML=h;
  Object.keys(BOARDS).forEach(k=>{const b=BOARDS[k],own=S.owned.b.includes(k),it=document.createElement('div');it.className='item'+(S.sel.b===k?' on':'');
    const c=document.createElement('canvas');c.width=480;c.height=240;thumbBoard(c,k);it.appendChild(c);it.insertAdjacentHTML('beforeend',`<b>${b.n}</b>`);
    const bt=document.createElement('button');bt.className='plq'+(own?'':' gold');bt.innerHTML=S.sel.b===k?'In use':own?'Use':COIN+' '+b.cost;bt.disabled=S.sel.b===k;bt.onclick=()=>buy('b',k,b.cost);it.appendChild(bt);$('#cBoards').appendChild(it);});
  Object.keys(PIECES.SETS).forEach(k=>{const s=PIECES.SETS[k],own=S.owned.p.includes(k),it=document.createElement('div');it.className='item'+(S.sel.p===k?' on':'');
    const c=document.createElement('canvas');c.width=480;c.height=200;const g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,480,200);[6,5,2,1].forEach((t,i)=>{g.drawImage(PIECES.sprite(t,0,110,k),10+i*55,10,110,110);g.drawImage(PIECES.sprite(t,1,110,k),245+i*55,80,110,110);});it.appendChild(c);
    it.insertAdjacentHTML('beforeend',`<b>${s.name}</b>`);const bt=document.createElement('button');const cost=SETCOST[k];bt.className='plq'+(own?'':' gold');bt.innerHTML=S.sel.p===k?'In use':own?'Use':COIN+' '+cost;bt.disabled=S.sel.p===k;bt.onclick=()=>buy('p',k,cost);it.appendChild(bt);$('#cSets').appendChild(it);});
  buildBoard();[[3,60],[10,180]].forEach(([n,c])=>{const it=document.createElement('div');it.className='item';it.innerHTML=`<b style="display:flex;align-items:center;gap:8px">${svgI('i-bulb')} ${n} hints</b><small class="muted">A hint shows the computer's best move during a game.</small>`;
    const bt=document.createElement('button');bt.className='plq gold';bt.innerHTML=COIN+' '+c;bt.onclick=()=>{if(S.coins<c){toast(COIN+'<span>Not enough coins</span>');AU.bad();return;}S.coins-=c;S.hints+=n;save();AU.coin();renderCollection();};it.appendChild(bt);$('#cHintShop').appendChild(it);});}
function buy(kind,k,cost){const own=S.owned[kind].includes(k);if(!own){if(S.coins<cost){toast(COIN+'<span>Not enough coins. Win games and solve tactics to earn more.</span>');AU.bad();return;}S.coins-=cost;S.owned[kind].push(k);AU.coin();if(kind==='p'&&S.owned.p.length>=Object.keys(PIECES.SETS).length)award('coll');}
  S.sel[kind]=k;save();AU.click();PIECES.clear();buildBoard();renderCollection();}
function thumbBoard(c,k){const save2=S.sel.b;S.sel.b=k;const oBS=BS,oFR=FR,oDPR=DPR;BS=240;FR=8;DPR=1;buildBoard();const g=c.getContext('2d');g.drawImage(boardImg,0,0,240,240,0,0,480,480);
  BS=oBS;FR=oFR;DPR=oDPR;S.sel.b=save2;}
function renderTrophies(){refreshCoins();const st=S.st;let h=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
  <div class="stat"><b>${Math.round(S.rating)}</b><small>Rating</small></div><div class="stat"><b>${Math.round(S.prating)}</b><small>Puzzle rating</small></div>
  <div class="stat"><b>${st.wins} / ${st.draws} / ${st.losses}</b><small>Won / drawn / lost</small></div><div class="stat"><b>${st.pz}</b><small>Tactics solved</small></div>
  <div class="stat"><b>${st.best}</b><small>Best streak</small></div><div class="stat"><b>${journeyProgress().st} / 120</b><small>Journey stars</small></div></div><div class="secT" style="margin-top:22px">Trophies</div><div class="grid">`;
  ACH.forEach(a=>{const got=!!S.ach[a[0]];h+=`<div class="ach${got?' got':''}"><svg class="med" viewBox="0 0 48 48"><path d="M14 2h8l4 12-8 4zM34 2h-8l-4 12 8 4z" fill="${got?'#b33a2e':'#4a3a2a'}"/><circle cx="24" cy="30" r="15" fill="${got?'url(#gMed)':'#3a2c1e'}" stroke="${got?'#7a5212':'#5a4630'}" stroke-width="2"/><circle cx="24" cy="30" r="10.5" fill="none" stroke="${got?'rgba(122,82,18,.7)':'#5a4630'}" stroke-width="1.2"/>${got?'<path d="M24 22.6l2.3 4.8 5.2.7-3.8 3.6 1 5.2-4.7-2.5-4.7 2.5 1-5.2-3.8-3.6 5.2-.7z" fill="#8a5a12"/>':'<path d="M19.6 30v-2.4a4.4 4.4 0 018.8 0V30M18.4 30h11.2v7H18.4z" fill="none" stroke="#7a6448" stroke-width="1.8"/>'}</svg><div><b>${a[1]}</b><small>${a[2]} · ${a[3]} coins</small></div></div>`;});
  h+='</div>';$('#trPage').innerHTML=h;}
/* ---------------- navigation ---------------- */
function goHome(){if(G&&!G.over&&G.mode!=='puzzle'&&G.mode!=='daily')persist();wid++;engBusy=0;$('#venue').hidden=true;$('#pause').hidden=true;show('title');refreshTitle();}
function goJourney(){show('journey');drawMap();refreshCoins();$('#jRating').innerHTML=svgI('i-cup')+'<span>'+Math.round(S.rating)+'</span>';}
$$('[data-home]').forEach(b=>b.onclick=()=>{AU.click();goHome();});
$$('.mItem').forEach(b=>b.onclick=()=>{AU.click();const g=b.dataset.go;
  if(g==='journey'){if(S.cur&&S.cur.mode==='journey'){resumeOrNew(()=>goJourney());}else goJourney();}
  else if(g==='tactics')startPuzzle();
  else if(g==='daily')startPuzzle(dailyIdx(),true);
  else if(g==='free'){if(S.cur&&(S.cur.mode==='free'||S.cur.mode==='duo'))resumeOrNew(openFree);else openFree();}
  else if(g==='collection'){show('collection');renderCollection();}
  else if(g==='trophies'){show('trophies');renderTrophies();}});
function resumeOrNew(alt){const c=S.cur;confirmBox('Resume your game?',c.mode==='journey'?'You have an unfinished game against '+(RIVALS.find(r=>r.id===c.rid)||{n:'a rival'}).n+'.':'You have an unfinished game in progress.',()=>resume());$('#cfNo').textContent='New game';$('#cfYes').textContent='Resume';
  $('#cfNo').onclick=()=>{$('#confirm').hidden=true;$('#cfNo').textContent='Cancel';$('#cfYes').textContent='Yes';S.cur=null;save();alt();};
  const y=$('#cfYes').onclick;$('#cfYes').onclick=()=>{$('#cfNo').textContent='Cancel';$('#cfYes').textContent='Yes';y();};}
function resume(){const c=S.cur;if(!c)return;const r=c.rid?RIVALS.find(x=>x.id===c.rid):null;
  G=Object.assign({start:c.start,moves:[],san:[],you:c.you,undos:c.undos||0,hints:c.hints||0,over:null,view:-1,mode:c.mode,rival:r,lvl:c.lvl,elo:c.elo||(r&&r.elo),clockMin:c.clockMin,clock:c.clock});
  E.load(G.start);for(const u of c.moves){const m=E.fromUci(u);if(!m)break;G.san.push(E.san(m));E.make(m);G.moves.push(u);}startBoard();}
$('#vClose').onclick=()=>{$('#venue').hidden=true;};$('#venue').addEventListener('click',e=>{if(e.target.id==='venue')$('#venue').hidden=true;});
$('#vPlay').onclick=()=>{AU.click();$('#venue').hidden=true;startJourney(selRival);};
/* free play dialog */
function segSet(sel,val){$$(sel+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(val)));}
function openFree(){const f=S.free;segSet('#fOpp',f.opp);segSet('#fCol',f.col);segSet('#fClk',f.clk);$('#fLvl').value=f.lvl;lvlLbl();$('#fLvlRow').style.display=f.opp==='cpu'?'':'none';$('#fColRow').style.display=f.opp==='cpu'?'':'none';$('#freeOv').hidden=false;}
function lvlLbl(){const l=+$('#fLvl').value;$('#lvlLbl').textContent='Level '+l+' · about '+LVL[l-1];}
['#fOpp','#fCol','#fClk'].forEach(id=>$$(id+' button').forEach(b=>b.onclick=()=>{AU.click();const k={'#fOpp':'opp','#fCol':'col','#fClk':'clk'}[id];S.free[k]=b.dataset.v;openFree();}));
$('#fLvl').oninput=()=>{S.free.lvl=+$('#fLvl').value;lvlLbl();};
$('#fCancel').onclick=()=>{$('#freeOv').hidden=true;};
$('#fGo').onclick=()=>{AU.click();$('#freeOv').hidden=true;save();const f=S.free,clk=+f.clk;
  if(f.opp==='duo')newGame({mode:'duo',clockMin:clk,inc:clk?2:0});else newGame({mode:'free',lvl:f.lvl,elo:LVL[f.lvl-1],you:f.col==='r'?(Math.random()<.5?0:1):+f.col,clockMin:clk,inc:clk&&clk<=5?2:0});};
/* settings & pause */
function openSettings(){$$('#setOv .seg').forEach(s=>{const k=s.dataset.opt;s.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.v===String(S.opt[k]));b.onclick=()=>{S.opt[k]=+b.dataset.v;save();AU.click();openSettings();if(k==='mus')AU.music();if(k==='coords')dirty=true;};});});$('#setOv').hidden=false;}
$('#setDone').onclick=()=>{$('#setOv').hidden=true;dirty=true;};
$('#gMenu').onclick=()=>{AU.click();$('#pause').hidden=false;};$('#tMenuBtn').onclick=()=>{AU.click();$('#pause').hidden=false;};
$('#pResume').onclick=()=>{$('#pause').hidden=true;};$('#pHome').onclick=()=>{AU.click();goHome();};$('#pSet').onclick=()=>{$('#pause').hidden=true;openSettings();};
/* ---------------- boot ---------------- */
__boot(()=>{loadSave();layout();show('title');refreshTitle();requestAnimationFrame(loop);
  addEventListener('pagehide',()=>{if(G&&!G.over)persist();});window.__gambit={get G(){return G;},get S(){return S;},E,startPuzzle,newGame,startJourney,RIVALS,PZ,applyMove,human,endGame};});

</script>
</body></html>
