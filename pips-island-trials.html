function panel(x,y,w,h,border='#ffd23f'){ctx.fillStyle='#0b1626';ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle=border;ctx.fillRect(x-1,y-1,w+2,h+2);ctx.fillStyle='#16263f';ctx.fillRect(x,y,w,h);}
function wrap(s,n){const out=[];let line='';for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line.trim());line=w;}else line+=' '+w;}if(line.trim())out.push(line.trim());return out;}
const HEART=['.xx.xx.','xxxxxxx','xxxxxxx','.xxxxx.','..xxx..','...x...'];
function heart(x,y,full){ctx.fillStyle=full?'#ff4d6d':'#3a3f55';for(let r=0;r<6;r++)for(let c=0;c<7;c++)if(HEART[r][c]==='x')ctx.fillRect(x+c,y+r,1,1);}
function trophyIcon(x,y,on){
  const g=on?'#ffd23f':'#3a3f55',d=on?'#c98a00':'#2a2e40';
  ctx.fillStyle=g;ctx.fillRect(x-4,y,8,5);ctx.fillRect(x-6,y+1,2,3);ctx.fillRect(x+4,y+1,2,3);ctx.fillRect(x-1,y+5,2,2);ctx.fillRect(x-3,y+7,6,2);
  ctx.fillStyle=d;ctx.fillRect(x+2,y,2,5);
}

let parts=[],floats=[];
function burst(x,y,n,cols,sp=60,life=0.5,size=2,g=0){for(let i=0;i<n&&parts.length<450;i++){const a=R()*TAU,v=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(life*0.6,life),col:cols[i%cols.length],s:size,g});}}
function floatText(x,y,t,col='#fff'){floats.push({x,y,t,col,life:1});}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;else{p.vx*=0.95;p.vy*=0.95;}}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=22*dt;if(f.life<=0)floats.splice(i,1);}
}
function drawParts(){
  for(const p of parts){ctx.fillStyle=p.col;const s=p.s*Math.min(1,p.life*3);ctx.fillRect(p.x-s/2,p.y-s/2,s,s);}
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life*2);txt(f.t,f.x,f.y,f.col,4,'center');ctx.globalAlpha=1;}
}

/* ---------- player ---------- */
const ACC=950,MAXV=96,FRIC=11,DASHV=270;
function mkP(x,y,hp){return{x,y,vx:0,vy:0,r:5,face:1,dirx:0,diry:1,dashT:0,dashCD:0,inv:0,hp,maxhp:hp,walk:0,squash:0};}
function blocked(x,y,solid){return solid(x-4,y-2)||solid(x+4,y-2)||solid(x-4,y+3)||solid(x+4,y+3);}
function updatePlayer(p,dt,solid,canAct=true){
  const a=canAct?axis():{x:0,y:0};
  if(a.x||a.y){p.dirx=a.x;p.diry=a.y;if(Math.abs(a.x)>0.1)p.face=Math.sign(a.x);}
  if(p.dashT>0){p.dashT-=dt;if(R()<0.8)parts.push({x:p.x+rnd(-3,3),y:p.y-4+rnd(-3,3),vx:0,vy:0,life:0.25,col:'#ffd6e6',s:3,g:0});}
  else{
    p.vx+=a.x*ACC*dt;p.vy+=a.y*ACC*dt;
    const sp=Math.hypot(p.vx,p.vy);if(sp>MAXV){const f=Math.max(MAXV/sp,1-9*dt);p.vx*=f;p.vy*=f;}
    if(!a.x)p.vx*=Math.max(0,1-FRIC*dt);if(!a.y)p.vy*=Math.max(0,1-FRIC*dt);
  }
  p.dashCD-=dt;p.inv-=dt;p.squash=Math.max(0,p.squash-dt*5);
  if(canAct&&hit(' ')&&p.dashCD<=0){
    let dx=a.x,dy=a.y;if(!dx&&!dy){dx=p.dirx;dy=p.diry;}if(!dx&&!dy)dx=p.face;
    const l=Math.hypot(dx,dy);p.vx=dx/l*DASHV;p.vy=dy/l*DASHV;p.dashT=0.15;p.dashCD=0.5;p.inv=Math.max(p.inv,0.24);p.squash=1;
    SFX.dash();burst(p.x,p.y,6,['#ffffff','#ffc6da'],50,0.3,2);
  }
  const nx=p.x+p.vx*dt;if(!blocked(nx,p.y,solid))p.x=nx;else p.vx=0;
  const ny=p.y+p.vy*dt;if(!blocked(p.x,ny,solid))p.y=ny;else p.vy=0;
  p.walk+=Math.hypot(p.vx,p.vy)*dt*0.16;
}
function drawPip(p,gold=false,blink=true){
  if(blink&&p.inv>0&&p.dashT<=0&&(Math.floor(time*24)&1))return;
  const sp=Math.hypot(p.vx,p.vy),moving=sp>15;
  const bob=moving?Math.abs(Math.sin(p.walk))*2:Math.sin(time*3)*0.6;
  ell(p.x,p.y+3,6,2.4,'rgba(0,0,0,0.22)');
  ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y-5-bob));ctx.scale(1+p.squash*0.35,1-p.squash*0.3);
  const f=moving?Math.sin(p.walk)*1.5:0;
  ctx.fillStyle='#d9577a';ctx.fillRect(-5+f,5,3,3);ctx.fillRect(2-f,5,3,3);
  circ(0,0,7.5,'#ff9ec0');ell(0,2.6,4.5,3.4,'#ffc9dc');
  const band=gold?'#ffd23f':'#ff3b4e',fx=-p.face,w=Math.sin(time*14)*(moving?1.6:0.5);
  ctx.fillStyle=band;ctx.fillRect(-7,-5.5,14,2.5);
  ctx.beginPath();ctx.moveTo(fx*6,-5);ctx.lineTo(fx*12,-7+w);ctx.lineTo(fx*11,-3.5+w);ctx.fill();
  ctx.beginPath();ctx.moveTo(fx*6,-4);ctx.lineTo(fx*10,-1.5+w*0.6);ctx.lineTo(fx*8.5,0+w*0.6);ctx.fill();
  const ex=(p.dirx||p.face*0.8)*1.4,ey=p.diry*1;
  ctx.fillStyle='#fff';ctx.fillRect(-4.5+ex,-2.5+ey,3,3.5);ctx.fillRect(1.5+ex,-2.5+ey,3,3.5);
  ctx.fillStyle='#1b1b2f';ctx.fillRect(-3.8+ex*1.3,-1.6+ey,1.6,2.2);ctx.fillRect(2.2+ex*1.3,-1.6+ey,1.6,2.2);
  ctx.fillStyle='#ff6f9a';ctx.fillRect(-6.5,1.5,2,1);ctx.fillRect(4.5,1.5,2,1);
  ctx.restore();
}

function pushOut(p,o,r){const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy),m=r+p.r;if(d<m&&d>0.01){p.x=o.x+dx/d*m;p.y=o.y+dy/d*m;}}
function updWorld(dt){
  if(dlg){
    const full=dlg.lines[dlg.i].join(' ').length;
    if(dlg.ch<full){const before=Math.floor(dlg.ch);dlg.ch+=dt*55;if(Math.floor(dlg.ch)!==before&&Math.floor(dlg.ch)%3===0)SFX.talk();}
    if(hit('e','enter',' ')){if(dlg.ch<full)dlg.ch=full;else{dlg.i++;dlg.ch=0;SFX.blip();if(dlg.i>=dlg.lines.length){const f=dlg.onEnd;dlg=null;if(f)f();}}}
    updatePlayer(P,dt,worldSolid,false);
  }else{
    updatePlayer(P,dt,worldSolid);
    for(const s of STATUES)pushOut(P,{x:s.x,y:s.y-1},8);
    pushOut(P,COACH,7);
    near=null;let nd=26;
    for(const s of STATUES){const d=Math.hypot(P.x-s.x,P.y-s.y);if(d<nd){nd=d;near=s;}}
    if(Math.hypot(P.x-COACH.x,P.y-COACH.y)<nd)near=COACH;
    if(near&&hit('e','enter')){SFX.blip();if(near===COACH)coachTalk();else{state='intro';introId=near.id;introT=0;}}
  }
  for(let i=0;i<coins.length;i++){if(coinsGot.has(i))continue;const c=coins[i];
    if(Math.hypot(c.x-P.x,c.y-(P.y-4))<11){coinsGot.add(i);save.coins=[...coinsGot];persist();SFX.coin(coinsGot.size%8);
      burst(c.x,c.y,10,['#ffd23f','#fff3b0','#ffffff'],60,0.45,2);floatText(c.x,c.y-10,coinsGot.size+'/'+coins.length,'#ffd23f');
      if(coinsGot.size===coins.length){SFX.bonus();floatText(P.x,P.y-28,'GOLDEN HEADBAND!','#ffd23f');burst(P.x,P.y-6,30,['#ffd23f','#fff'],100,0.8,2);}}}
  for(const f of flies){f.t+=dt;f.x=f.hx+Math.sin(f.t*0.7)*24+Math.sin(f.t*2.3)*6;f.y=f.hy+Math.cos(f.t*0.5)*16+Math.sin(f.t*3.1)*4;}
  for(const c of clouds){c.x+=8*dt;if(c.x>MW*TS+80)c.x=-80;}
  cam.x=lerp(cam.x,clamp(P.x-W/2,0,MW*TS-W),Math.min(1,8*dt));
  cam.y=lerp(cam.y,clamp(P.y-H/2,0,MH*TS-H),Math.min(1,8*dt));
  if(save.champ){fwT-=dt;if(fwT<=0){fwT=rnd(0.4,0.9);const x=cam.x+rnd(40,W-40),y=cam.y+rnd(20,H/2);burst(x,y,26,[['#ff4d6d','#ffd23f'],['#7cc8ff','#fff'],['#7dffb0','#ffd23f'],['#b28dff','#ff9ec0']][(R()*4)|0],90,0.9,2,60);if(R()<0.5)tone(rnd(300,500),0.2,'triangle',0.02,80);}}
}

function mkBG(fn){const c=document.createElement('canvas');c.width=W*S;c.height=H*S;const g=c.getContext('2d');g.scale(S,S);fn(g);return c;}
const BG=[
  mkBG(g=>{g.fillStyle='#14152e';g.fillRect(0,0,W,H);for(let i=0;i<60;i++){g.fillStyle=i%3?'#3b3d6e':'#8d8fd1';g.fillRect((hash(i,1)*W)|0,(hash(1,i)*28)|0,1,1);}
    g.fillStyle='#55578f';g.fillRect(AR.x-4,AR.y-4,AR.w+8,AR.h+8);
    for(let y=0;y<AR.h;y+=16)for(let x=0;x<AR.w;x+=16){g.fillStyle=((x+y)/16)%2?'#2c2d58':'#323366';g.fillRect(AR.x+x,AR.y+y,Math.min(16,AR.w-x),Math.min(16,AR.h-y));}
    g.fillStyle='#6d70b3';g.fillRect(AR.x-4,AR.y-4,AR.w+8,2);}),
  mkBG(g=>{g.fillStyle='#2a7fcb';g.fillRect(0,0,W,H);g.fillStyle='#45aee8';g.fillRect(0,18,W,12);g.fillStyle='#d6f0ff';for(let x=0;x<W;x+=12)g.fillRect(x+((x/12)%2)*4,AR.y-4,8,2);
    g.fillStyle='#f2d7a0';g.fillRect(AR.x-4,AR.y-2,AR.w+8,AR.h+6);
    for(let i=0;i<260;i++){g.fillStyle=i%4?'#e0c084':'#fbe7bd';g.fillRect(AR.x+(hash(i,7)*AR.w)|0,AR.y+(hash(9,i)*AR.h)|0,1,1);}
    g.fillStyle='#c9a46b';g.fillRect(AR.x-4,AR.y+AR.h+2,AR.w+8,2);}),
  mkBG(g=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5fb3f0');gr.addColorStop(1,'#c4e7ff');g.fillStyle=gr;g.fillRect(0,0,W,H);
    g.fillStyle='rgba(255,255,255,0.9)';for(let i=0;i<14;i++){const x=hash(i,3)*W,y=AR.y+40+hash(4,i)*(AR.h-30);g.beginPath();g.ellipse(x,y,30+hash(i,i)*20,8,0,0,TAU);g.fill();}
    g.fillStyle='rgba(255,255,255,0.5)';g.fillRect(AR.x,AR.y,AR.w,AR.h);
    g.fillStyle='#ffd23f';g.fillRect(AR.x-3,AR.y+AR.h+1,AR.w+6,2);})
];
let ch=null,hitstop=0,shake=0;
function startChallenge(id){
  state='challenge';parts=[];floats=[];setSong('battle');
  ch=[Storm,Shell,Gull][id]();ch.id=id;ch.phase='ready';ch.readyT=2.4;ch.lastN=4;ch.goT=0;
}
function hurt(p){
  if(ch.phase!=='play'||p.inv>0)return false;
  p.hp--;p.inv=1.1;shake=6;hitstop=0.07;SFX.hurt();burst(p.x,p.y-5,14,['#ff4d6d','#fff'],90,0.4,2);
  if(p.hp<=0)finish(false);
  return true;
}
function finish(win){
  if(ch.phase!=='play')return;ch.phase='end';ch.win=win;ch.endT=win?1.3:1.4;setSong(null);
  if(win)SFX.win();else SFX.lose();
}
function updChallenge(dt){
  const c=ch;
  if(c.phase==='ready'){c.readyT-=dt;updatePlayer(c.p,dt,arenaSolid);const n=Math.ceil(c.readyT/0.8);if(n!==c.lastN&&n>0){c.lastN=n;SFX.count();}
    if(c.readyT<=0){c.phase='play';c.goT=0.7;SFX.go();}}
  else if(c.phase==='play'){c.goT-=dt;c.update(dt);}
  else{c.endT-=dt;updatePlayer(c.p,dt,arenaSolid,false);if(c.win&&R()<0.5)burst(rnd(AR.x,AR.x+AR.w),AR.y,1,['#ffd23f','#ff4d6d','#7cc8ff','#7dffb0','#fff'],30,2,3,80);
    if(c.endT<=0)showResult();}
}
function drawChallenge(sx,sy){
  ctx.fillStyle='#0b1626';ctx.fillRect(0,0,W,H);
  ctx.drawImage(BG[ch.id],0,0,W*S,H*S,sx,sy,W,H);
  ctx.save();ctx.translate(sx,sy);
  ch.drawBack&&ch.drawBack();
  drawPip(ch.p,coinsGot.size===coins.length);
  ch.draw();
  drawParts();
  ctx.restore();
  ctx.fillStyle='rgba(11,22,38,0.7)';ctx.fillRect(0,0,W,24);
  txt(STATUES[ch.id].name,8,8,STATUES[ch.id].col,8);
  ch.hud();
  if(ch.phase==='ready'){const n=Math.ceil(ch.readyT/0.8);txt(String(n),W/2,H/2-16,'#fff',24,'center');txt('GET READY',W/2,H/2+14,'#ffd23f',8,'center');}
  if(ch.phase==='play'&&ch.goT>0)txt('GO!',W/2,H/2-16,'#7dffb0',24,'center');
  if(ch.phase==='end')txt(ch.win?'CLEAR!':'K.O.',W/2,H/2-16,ch.win?'#ffd23f':'#ff4d6d',24,'center');
}
function hudHearts(p,x){for(let i=0;i<p.maxhp;i++)heart(x+i*9,9,i<p.hp);}

function Storm(){
  const c={p:mkP(W/2,AR.y+AR.h/2+10,3),t:0,dur:40,metT:1.2,bulT:0.5,spT:3,mets:[],buls:[]};
  c.update=dt=>{
    const p=c.p,k=Math.min(1,c.t/c.dur);c.t+=dt;updatePlayer(p,dt,arenaSolid);
    if((c.metT-=dt)<=0){c.metT=lerp(1.05,0.32,k)*rnd(0.8,1.2);const n=k>0.55&&R()<0.5?2:1;
      for(let j=0;j<n;j++){const aim=j===0&&R()<0.5;
        c.mets.push({x:aim?clamp(p.x+rnd(-14,14),AR.x+8,AR.x+AR.w-8):rnd(AR.x+12,AR.x+AR.w-12),y:aim?clamp(p.y-4+rnd(-14,14),AR.y+8,AR.y+AR.h-8):rnd(AR.y+12,AR.y+AR.h-12),t:0,warn:lerp(1.0,0.72,k),r:rnd(14,19),boom:false});}}
    for(let i=c.mets.length-1;i>=0;i--){const m=c.mets[i];m.t+=dt;
      if(!m.boom&&m.t>=m.warn){m.boom=true;SFX.boom();shake=Math.max(shake,4);burst(m.x,m.y,16,['#ffb347','#ff6b3d','#fff3b0','#7a5c4e'],100,0.5,3);
        if(Math.hypot(p.x-m.x,p.y-4-m.y)<m.r+3)hurt(p);}
      if(m.t>m.warn+0.4)c.mets.splice(i,1);}
    if(c.t>7&&(c.bulT-=dt)<=0){c.bulT=lerp(1.3,0.33,k);const side=(R()*4)|0;let x,y;
      if(side===0){x=AR.x;y=rnd(AR.y,AR.y+AR.h);}else if(side===1){x=AR.x+AR.w;y=rnd(AR.y,AR.y+AR.h);}else if(side===2){x=rnd(AR.x,AR.x+AR.w);y=AR.y;}else{x=rnd(AR.x,AR.x+AR.w);y=AR.y+AR.h;}
      const a=Math.atan2(p.y-4-y,p.x-x)+rnd(-0.25,0.25),v=lerp(70,125,k);c.buls.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3});}
    if(c.t>20&&(c.spT-=dt)<=0){c.spT=lerp(3.6,2,k);
      const cs=[[AR.x+6,AR.y+6],[AR.x+AR.w-6,AR.y+6],[AR.x+6,AR.y+AR.h-6],[AR.x+AR.w-6,AR.y+AR.h-6]];let b=cs[0],bd=0;
      for(const q of cs){const d=Math.hypot(q[0]-p.x,q[1]-p.y);if(d>bd){bd=d;b=q;}}
      const off=R()*TAU;for(let j=0;j<16;j++){const a=off+j/16*TAU;c.buls.push({x:b[0],y:b[1],vx:Math.cos(a)*62,vy:Math.sin(a)*62,r:3,pink:true});}SFX.zap();}
    for(let i=c.buls.length-1;i>=0;i--){const b=c.buls[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<AR.x-10||b.x>AR.x+AR.w+10||b.y<AR.y-10||b.y>AR.y+AR.h+10){c.buls.splice(i,1);continue;}
      if(Math.hypot(b.x-p.x,b.y-p.y+4)<b.r+p.r-1&&hurt(p))c.buls.splice(i,1);}
    if(c.t>=c.dur)finish(true);
  };
  c.drawBack=()=>{for(const m of c.mets){if(m.boom){const q=(m.t-m.warn)/0.4;ctx.globalAlpha=1-q;circ(m.x,m.y,m.r*(0.6+q*0.6),'#ffb347');circ(m.x,m.y,m.r*0.5*(1-q),'#fff3b0');ctx.globalAlpha=1;continue;}
      const q=m.t/m.warn;ctx.globalAlpha=0.15+q*0.35;circ(m.x,m.y,m.r*q,'#ff4d6d');ctx.globalAlpha=1;
      ctx.strokeStyle=Math.floor(time*12)%2?'#ff4d6d':'#ffd23f';ctx.lineWidth=1;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,TAU);ctx.stroke();}};
  c.draw=()=>{
    for(const m of c.mets){if(m.boom)continue;const q=m.t/m.warn;if(q>0.55){const f=(1-q)/0.45,yy=m.y-f*f*130;ell(m.x,yy,4,5,'#7a5c4e');circ(m.x-1,yy-1,2,'#a8836d');ctx.fillStyle='#ffb347';ctx.fillRect(m.x-1,yy-10,2,6);}}
    for(const b of c.buls){circ(b.x,b.y,b.r+1,b.pink?'#ff4dd2':'#4dd2ff');circ(b.x,b.y,b.r-1,'#fff');}
  };
  c.hud=()=>{hudHearts(c.p,120);const left=Math.max(0,c.dur-c.t);txt('SURVIVE '+left.toFixed(1)+'s',W-8,8,left<10?'#ffd23f':'#fff',8,'right');
    ctx.fillStyle='#2c2d58';ctx.fillRect(0,22,W,2);ctx.fillStyle='#7cc8ff';ctx.fillRect(0,22,W*Math.min(1,c.t/c.dur),2);};
  c.score=()=>c.p.hp;
  c.loseText=()=>'Survived '+c.t.toFixed(1)+'s of 40s';
  c.winText=()=>'Survived with '+c.p.hp+' heart'+(c.p.hp===1?'':'s')+' left';
  return c;
}

function Shell(){
  const c={p:mkP(W/2,AR.y+AR.h/2+10,0),t:0,left:45,got:0,goal:25,shells:[],crabs:[],crabT:7,combo:0,comboT:0};
  const spawnShell=()=>{let x,y,n=0;do{x=rnd(AR.x+12,AR.x+AR.w-12);y=rnd(AR.y+12,AR.y+AR.h-12);}while(Math.hypot(x-c.p.x,y-c.p.y)<55&&++n<20);c.shells.push({x,y,gold:R()<0.12,t:R()*6});};
  const spawnCrab=()=>c.crabs.push({x:R()<0.5?AR.x+12:AR.x+AR.w-12,y:rnd(AR.y+20,AR.y+AR.h-20),vx:0,vy:0,dir:R()<0.5?-1:1,wt:0,stun:0,t:R()*6});
  for(let i=0;i<3;i++)spawnShell();spawnCrab();spawnCrab();
  c.update=dt=>{
    const p=c.p;c.t+=dt;c.left-=dt;c.comboT-=dt;if(c.comboT<=0)c.combo=0;
    updatePlayer(p,dt,arenaSolid);
    for(let i=c.shells.length-1;i>=0;i--){const s=c.shells[i];s.t+=dt;
      if(Math.hypot(s.x-p.x,s.y-p.y+4)<p.r+8){c.shells.splice(i,1);const v=s.gold?3:1;c.got=Math.min(c.goal,c.got+v);c.combo++;c.comboT=1.8;
        SFX.coin(c.combo);burst(s.x,s.y,10,s.gold?['#ffd23f','#fff']:['#ffb3c7','#fff','#ff8fa3'],70,0.4,2);floatText(s.x,s.y-10,s.gold?'+3!':'+1',s.gold?'#ffd23f':'#fff');
        if(c.combo%5===0){c.left+=2;floatText(p.x,p.y-26,'COMBO +2s','#7dffb0');SFX.bonus();}
        spawnShell();}}
    if((c.crabT-=dt)<=0&&c.crabs.length<6){c.crabT=7;spawnCrab();floatText(W/2,AR.y+10,'ANOTHER CRAB!','#ff8a5c');}
    for(const cr of c.crabs){cr.t+=dt;
      if(cr.stun>0){cr.stun-=dt;cr.vx*=0.9;cr.vy*=0.9;}
      else{const dx=p.x-cr.x,dy=p.y-cr.y,d=Math.hypot(dx,dy)||1,chase=d<85,sp=chase?Math.min(74,42+c.got*1.2):30;
        if(chase){cr.vx=lerp(cr.vx,dx/d*sp,0.08);cr.vy=lerp(cr.vy,dy/d*sp,0.08);}
        else{cr.wt-=dt;if(cr.wt<=0){cr.wt=rnd(0.8,2);cr.dir=R()<0.5?-1:1;cr.vy=rnd(-15,15);}cr.vx=lerp(cr.vx,cr.dir*sp,0.05);}}
      cr.x=clamp(cr.x+cr.vx*dt,AR.x+8,AR.x+AR.w-8);cr.y=clamp(cr.y+cr.vy*dt,AR.y+8,AR.y+AR.h-6);
      if(Math.hypot(cr.x-p.x,cr.y-p.y)<p.r+8&&cr.stun<=0){
        if(p.dashT>0){cr.stun=2.2;cr.vx=p.vx*0.7;cr.vy=p.vy*0.7;SFX.bonk();floatText(cr.x,cr.y-12,'BONK!','#ffd23f');burst(cr.x,cr.y,10,['#fff','#ff7b54'],90,0.35,2);shake=3;hitstop=0.04;}
        else if(p.inv<=0){c.left-=3;p.inv=1;const a=Math.atan2(p.y-cr.y,p.x-cr.x);p.vx=Math.cos(a)*220;p.vy=Math.sin(a)*220;
          floatText(p.x,p.y-20,'-3s','#ff4d6d');SFX.hurt();shake=5;hitstop=0.06;c.combo=0;burst(p.x,p.y-5,10,['#ff4d6d','#fff'],80,0.4,2);}}}
    if(c.got>=c.goal){finish(true);return;}
    if(c.left<=0){c.left=0;finish(false);}
  };
  c.drawBack=()=>{for(const s of c.shells){const y=s.y+Math.sin(s.t*4)*1;ell(s.x,s.y+4,4,1.5,'rgba(0,0,0,0.2)');
      ctx.fillStyle=s.gold?'#ffd23f':'#ff9eb5';ctx.beginPath();ctx.arc(s.x,y+1,5,Math.PI,0);ctx.fill();ctx.fillRect(s.x-5,y+1,10,2);
      ctx.fillStyle=s.gold?'#c98a00':'#e0708c';ctx.fillRect(s.x-0.5,y-3.5,1,4);ctx.fillRect(s.x-3,y-2,1,3);ctx.fillRect(s.x+2,y-2,1,3);
      if(s.gold&&Math.floor(time*6+s.t)%3===0){ctx.fillStyle='#fff';ctx.fillRect(s.x+3,y-4,1,1);}}};
  c.draw=()=>{for(const cr of c.crabs){const st=cr.stun>0,x=cr.x,y=cr.y,l=Math.sin(cr.t*14)*1.2;
      ell(x,y+4,7,2,'rgba(0,0,0,0.2)');ctx.save();ctx.translate(x,y);if(st)ctx.scale(1,-1);
      ctx.fillStyle='#c4472e';for(let i=-1;i<=1;i++){ctx.fillRect(-9,i*2+l*(i?1:-1),3,1);ctx.fillRect(6,i*2-l*(i?1:-1),3,1);}
      ell(0,0,6.5,4.5,'#ff6a45');ell(-1,-1.5,3.5,1.6,'#ff9a7a');
      ctx.fillStyle='#ff6a45';ctx.fillRect(-10,-6,4,3);ctx.fillRect(6,-6,4,3);ctx.fillRect(-8,-4,2,2);ctx.fillRect(6,-4,2,2);
      ctx.fillStyle='#fff';ctx.fillRect(-3,-7,2,3);ctx.fillRect(1,-7,2,3);ctx.fillStyle='#1b1b2f';ctx.fillRect(-2.5,-6,1,1.5);ctx.fillRect(1.5,-6,1,1.5);
      ctx.restore();if(st)txt('*',x,y-14+Math.sin(time*10),'#ffd23f',4,'center');}};
  c.hud=()=>{
    ctx.fillStyle='#ff9eb5';ctx.beginPath();ctx.arc(112,15,5,Math.PI,0);ctx.fill();ctx.fillRect(107,15,10,2);
    txt(c.got+'/'+c.goal,122,8,'#fff',8);
    if(c.combo>=2)txt('x'+c.combo,190,8,'#7dffb0',8);
    txt(c.left.toFixed(1)+'s',W-8,8,c.left<10?'#ff4d6d':'#fff',8,'right');
    ctx.fillStyle='#3a2a20';ctx.fillRect(0,22,W,2);ctx.fillStyle='#ffa96b';ctx.fillRect(0,22,W*c.got/c.goal,2);};
  c.score=()=>c.t;
  c.loseText=()=>'Collected '+c.got+'/'+c.goal+' shells';
  c.winText=()=>'All 25 shells in '+c.t.toFixed(1)+'s';
  return c;
}

function Gull(){
  const c={p:mkP(W/2,AR.y+AR.h-24,5),t:0,buls:[],stars:[],orb:null,orbT:1.2,angry:false,
    b:{x:W/2,y:AR.y+28,hp:24,max:24,flash:0,mode:'move',mt:2.2,shots:0,shotT:0,rainT:0,dv:null,wing:0,dead:false}};
  c.update=dt=>{
    const p=c.p,b=c.b;c.t+=dt;b.wing+=dt*(b.mode==='dive'?22:10);b.flash-=dt;
    updatePlayer(p,dt,arenaSolid);
    const p2=b.hp<=b.max/2;
    if(p2&&!c.angry){c.angry=true;SFX.roar();shake=6;floatText(W/2,AR.y+60,'THE GULL KING IS ANGRY!','#ff4d6d');}
    if(b.mode!=='dive'){const tx=W/2+Math.sin(c.t*(p2?1.25:0.8))*130,ty=AR.y+26+Math.sin(c.t*1.9)*6;b.x=lerp(b.x,tx,Math.min(1,3*dt));b.y=lerp(b.y,ty,Math.min(1,3*dt));}
    b.mt-=dt;
    if(b.mode==='move'&&b.mt<=0){const o=p2?['spread','rain','dive','ring','dive','spread']:['spread','rain','dive','spread'];b.mode=o[(R()*o.length)|0];
      if(b.mode==='spread'){b.shots=p2?4:3;b.shotT=0.2;}
      else if(b.mode==='rain'){b.mt=p2?2.4:2;b.rainT=0;floatText(W/2,AR.y+40,'FEATHER STORM!','#fff');}
      else if(b.mode==='dive'){b.dv={phase:'aim',t:0.8,tx:p.x,ty:p.y-4};SFX.warn();}
      else if(b.mode==='ring'){b.shots=2;b.shotT=0.3;}}
    if(b.mode==='spread'){if((b.shotT-=dt)<=0){b.shotT=0.34;const n=p2?7:5,base=Math.atan2(p.y-4-b.y,p.x-b.x);
        for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*0.22;c.buls.push({x:b.x,y:b.y+6,vx:Math.cos(a)*95,vy:Math.sin(a)*95,r:3});}SFX.shoot();
        if(--b.shots<=0){b.mode='move';b.mt=p2?1.0:1.5;}}}
    else if(b.mode==='ring'){if((b.shotT-=dt)<=0){b.shotT=0.55;const off=R()*TAU;for(let i=0;i<18;i++){const a=off+i/18*TAU;c.buls.push({x:b.x,y:b.y,vx:Math.cos(a)*72,vy:Math.sin(a)*72,r:3});}SFX.zap();
        if(--b.shots<=0){b.mode='move';b.mt=1.2;}}}
    else if(b.mode==='rain'){if((b.rainT-=dt)<=0){b.rainT=p2?0.075:0.1;c.buls.push({x:rnd(AR.x+4,AR.x+AR.w-4),y:AR.y,vx:0,vy:rnd(80,115),r:3,feather:true,ph:R()*6});}
      if(b.mt<=0){b.mode='move';b.mt=1.3;}}
    else if(b.mode==='dive'){const d=b.dv;d.t-=dt;
      if(d.phase==='aim'){d.tx=lerp(d.tx,p.x,Math.min(1,4*dt));d.ty=lerp(d.ty,p.y-4,Math.min(1,4*dt));
        if(d.t<=0){d.phase='go';const dx=d.tx-b.x,dy=d.ty-b.y,L=Math.hypot(dx,dy)||1;d.vx=dx/L*340;d.vy=dy/L*340;d.t=(L+30)/340;SFX.dive();}}
      else if(d.phase==='go'){b.x=clamp(b.x+d.vx*dt,AR.x+14,AR.x+AR.w-14);b.y=clamp(b.y+d.vy*dt,AR.y+10,AR.y+AR.h-10);parts.push({x:b.x+rnd(-6,6),y:b.y,vx:0,vy:0,life:0.3,col:'#ffffff',s:3,g:0});
        if(d.t<=0){d.phase='back';d.t=0.9;shake=4;SFX.boom();burst(b.x,b.y+8,12,['#fff','#cfe8ff'],80,0.4,3);
          if(p2){for(let i=0;i<10;i++){const a=i/10*TAU;c.buls.push({x:b.x,y:b.y,vx:Math.cos(a)*55,vy:Math.sin(a)*55,r:3});}}}}
      else{b.y=lerp(b.y,AR.y+26,Math.min(1,3*dt));if(d.t<=0){b.mode='move';b.mt=p2?1.0:1.6;}}}
    if(!b.dead&&Math.hypot(b.x-p.x,b.y-p.y+4)<p.r+12)hurt(p);
    for(let i=c.buls.length-1;i>=0;i--){const u=c.buls[i];if(u.feather)u.x+=Math.sin(c.t*6+u.ph)*24*dt;u.x+=u.vx*dt;u.y+=u.vy*dt;
      if(u.x<AR.x-10||u.x>AR.x+AR.w+10||u.y<AR.y-12||u.y>AR.y+AR.h+10){c.buls.splice(i,1);continue;}
      if(Math.hypot(u.x-p.x,u.y-p.y+4)<u.r+p.r-1&&hurt(p))c.buls.splice(i,1);}
    if(!c.orb){if((c.orbT-=dt)<=0){let x,y,n=0;do{x=rnd(AR.x+20,AR.x+AR.w-20);y=rnd(AR.y+70,AR.y+AR.h-14);}while(Math.hypot(x-p.x,y-p.y)<50&&++n<20);c.orb={x,y,t:0};}}
    else{c.orb.t+=dt;if(Math.hypot(c.orb.x-p.x,c.orb.y-p.y+4)<p.r+8){
      for(let i=0;i<3;i++){const a=-Math.PI/2+(i-1)*0.8;c.stars.push({x:p.x,y:p.y-6,vx:Math.cos(a)*130,vy:Math.sin(a)*130,t:0});}
      SFX.power();burst(c.orb.x,c.orb.y,14,['#7dffb0','#fff','#b0fff0'],90,0.4,2);c.orb=null;c.orbT=p2?1.5:1.1;}}
    for(let i=c.stars.length-1;i>=0;i--){const s=c.stars[i];s.t+=dt;const dx=b.x-s.x,dy=b.y-s.y,L=Math.hypot(dx,dy)||1,sp=200+s.t*160;
      s.vx=lerp(s.vx,dx/L*sp,Math.min(1,6*dt));s.vy=lerp(s.vy,dy/L*sp,Math.min(1,6*dt));s.x+=s.vx*dt;s.y+=s.vy*dt;
      if(R()<0.6)parts.push({x:s.x,y:s.y,vx:0,vy:0,life:0.2,col:'#ffe066',s:2,g:0});
      if(L<15&&!b.dead){c.stars.splice(i,1);b.hp--;b.flash=0.12;SFX.hit();burst(s.x,s.y,10,['#ffd23f','#fff'],90,0.35,2);floatText(b.x+rnd(-12,12),b.y-18,'-1','#ffd23f');shake=Math.max(shake,2);
        if(b.hp<=0){b.dead=true;c.buls.length=0;c.stars.length=0;burst(b.x,b.y,70,['#ffffff','#ffd23f','#ff9a3d','#c9d3de'],170,1.1,3);shake=10;hitstop=0.15;SFX.boom();finish(true);return;}}
      else if(s.t>3)c.stars.splice(i,1);}
  };
  c.drawBack=()=>{const b=c.b;
    if(c.orb){const o=c.orb,pul=Math.sin(o.t*8)*1.2;ell(o.x,o.y+7,5,1.5,'rgba(0,0,0,0.15)');ctx.globalAlpha=0.35;circ(o.x,o.y,9+pul,'#7dffb0');ctx.globalAlpha=1;circ(o.x,o.y,5,'#3ddc84');circ(o.x-1.5,o.y-1.5,2,'#fff');}
    if(b.mode==='dive'&&b.dv.phase==='aim'){ctx.strokeStyle=Math.floor(time*14)%2?'#ff4d6d':'#ffd23f';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.dv.tx,b.dv.ty);ctx.stroke();ctx.setLineDash([]);
      ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.dv.tx,b.dv.ty,8,0,TAU);ctx.stroke();}
    if(!b.dead)ell(b.x,Math.min(AR.y+AR.h-4,b.y+40),12,3,'rgba(0,40,90,0.15)');};
  c.draw=()=>{const b=c.b;
    for(const s of c.stars){ctx.fillStyle='#ffd23f';ctx.fillRect(s.x-1,s.y-4,2,8);ctx.fillRect(s.x-4,s.y-1,8,2);ctx.fillStyle='#fff';ctx.fillRect(s.x-1,s.y-1,2,2);}
    if(!b.dead){const x=b.x,y=b.y,fl=Math.sin(b.wing)*7,hit=b.flash>0;
      ctx.fillStyle=hit?'#ffffff':'#8f9bab';
      ctx.beginPath();ctx.moveTo(x-8,y-2);ctx.lineTo(x-32,y-7-fl);ctx.lineTo(x-24,y+5-fl*0.3);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x+8,y-2);ctx.lineTo(x+32,y-7-fl);ctx.lineTo(x+24,y+5-fl*0.3);ctx.closePath();ctx.fill();
      ctx.fillStyle=hit?'#ffffff':'#5c6878';ctx.fillRect(x-31,y-8-fl,5,2);ctx.fillRect(x+26,y-8-fl,5,2);
      ell(x,y+2,14,10,hit?'#ffb3b3':'#f4f7fb');ell(x,y+5,9,5,hit?'#ffd0d0':'#ffffff');
      circ(x,y-8,7.5,hit?'#ffb3b3':'#f4f7fb');
      ctx.fillStyle='#ff9a3d';ctx.beginPath();ctx.moveTo(x-3,y-6);ctx.lineTo(x+3,y-6);ctx.lineTo(x,y+1);ctx.closePath();ctx.fill();
      ctx.fillStyle='#1b1b2f';ctx.fillRect(x-5,y-10,2,2.5);ctx.fillRect(x+3,y-10,2,2.5);
      ctx.fillStyle=c.angry?'#ff4d6d':'#1b1b2f';ctx.fillRect(x-6,y-13,4,1.2);ctx.fillRect(x+2,y-13,4,1.2);
      ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(x-6,y-14);ctx.lineTo(x-6,y-20);ctx.lineTo(x-3,y-17);ctx.lineTo(x,y-22);ctx.lineTo(x+3,y-17);ctx.lineTo(x+6,y-20);ctx.lineTo(x+6,y-14);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ff4d6d';ctx.fillRect(x-0.8,y-17,1.6,1.6);
      ctx.fillStyle='#ff9a3d';ctx.fillRect(x-5,y+11,2,3);ctx.fillRect(x+3,y+11,2,3);}
    for(const u of c.buls){if(u.feather){ell(u.x,u.y,1.6,4,'#ffffff');ctx.fillStyle='#9fb3d1';ctx.fillRect(u.x-0.5,u.y-3,1,6);}else{circ(u.x,u.y,u.r+1,'#ff9a3d');circ(u.x,u.y,u.r-1,'#fff3b0');}}
  };
  c.hud=()=>{hudHearts(c.p,104);const b=c.b,bw=150,bx=W-bw-8;ctx.fillStyle='#0b1626';ctx.fillRect(bx-1,8,bw+2,9);ctx.fillStyle='#3a3f55';ctx.fillRect(bx,9,bw,7);
    ctx.fillStyle=c.angry?'#ff4d6d':'#ffd23f';ctx.fillRect(bx,9,bw*Math.max(0,b.hp)/b.max,7);txt('KING',bx-6,10,'#fff',4,'right');};
  c.score=()=>c.t;
  c.loseText=()=>'Gull King had '+c.b.hp+'/'+c.b.max+' HP left';
  c.winText=()=>'Defeated in '+c.t.toFixed(1)+'s';
  return c;
}

/* ---------- results ---------- */
let res=null;
function showResult(){
  const id=ch.id,win=ch.win;let rec=false;
  if(win){const sc=ch.score(),b=save.best[id];
    if(b==null||(id===0?sc>b:sc<b)){save.best[id]=id===0?sc:Math.round(sc*10)/10;rec=b!=null;}
    const first=!save.trophies[id];save.trophies[id]=true;persist();
    res={id,win,rec,first,line:ch.winText(),t:0};
  }else res={id,win,line:ch.loseText(),t:0};
  state='result';
}
function updResult(dt){
  res.t+=dt;if(res.win&&res.t<2&&R()<0.7)burst(rnd(0,W),-4,1,['#ffd23f','#ff4d6d','#7cc8ff','#7dffb0','#fff','#b28dff'],20,2.5,3,70);
  if(res.t<0.5)return;
  if(hit('r'))startChallenge(res.id);
  else if(hit('e','enter',' ','escape'))toWorld(res.id);
}
function drawResult(){
  ctx.fillStyle='rgba(5,10,20,0.65)';ctx.fillRect(0,0,W,H);drawParts();
  panel(62,38,260,140,res.win?'#ffd23f':'#ff4d6d');
  txt(res.win?'TROPHY WON!':'SO CLOSE!',W/2,52,res.win?'#ffd23f':'#ff4d6d',16,'center');
  if(res.win)trophyIcon(W/2,80+Math.sin(time*4)*1.5,true);
  txt(res.line,W/2,res.win?100:86,'#fff',8,'center');
  if(res.rec)txt('NEW RECORD!',W/2,114,'#7dffb0',8,'center');
  else txt(bestText(res.id),W/2,res.win?116:106,'#9fb3d1',4,'center');
  if(!res.win)txt(['Tip: dash right as a meteor lands.','Tip: chain shells fast for combo time.','Tip: grab orbs even mid-attack!'][res.id],W/2,122,'#9fb3d1',4,'center');
  if(res.t>0.5)txt('R: RETRY    E: BACK TO ISLAND',W/2,156,'#ffd23f',8,'center');
}
function toWorld(id){
  state='world';parts=[];floats=[];setSong('island');
  if(id!=null){const s=STATUES[id];P.x=s.x;P.y=s.y+22;P.vx=P.vy=0;P.inv=0;}
  cam.x=clamp(P.x-W/2,0,MW*TS-W);cam.y=clamp(P.y-H/2,0,MH*TS-H);
  if(save.trophies.every(Boolean)&&!save.champ){save.champ=true;persist();SFX.win();
    say(COACH.name,['PIP!!! All three trophies! You are the CHAMPION of Tidepool Isle!','Look at the sky, the whole island is celebrating for you!']);}
}

/* ---------- title & pause ---------- */
const titleP=mkP(0,0,3);
function drawTitle(){
  const px=(Math.sin(time*0.06)*0.5+0.5)*(MW*TS-W),py=(Math.cos(time*0.05)*0.5+0.5)*(MH*TS-H);
  ctx.drawImage(mapC,Math.round(px)*S,Math.round(py)*S,W*S,H*S,0,0,W,H);
  ctx.fillStyle='rgba(8,18,34,0.55)';ctx.fillRect(0,0,W,H);
  txt("PIP'S",W/2,26,'#ff9ec0',16,'center');
  txt('ISLAND TRIALS',W/2,46,'#ffd23f',24,'center');
  titleP.walk+=0.1;titleP.vx=Math.sin(time*2)>0?40:0;titleP.face=1;titleP.dirx=1;titleP.diry=0;
  ctx.save();ctx.translate(W/2,118+Math.abs(Math.sin(time*4))*-6);ctx.scale(3,3);drawPip(titleP,coinsGot.size===coins.length,false);ctx.restore();
  if(Math.floor(time*2)%2)txt('PRESS SPACE TO PLAY',W/2,146,'#fff',8,'center');
  const n=save.trophies.filter(Boolean).length;
  if(save.met)txt('SAVED: '+n+'/3 TROPHIES  '+coinsGot.size+'/'+coins.length+' COINS   N: NEW GAME',W/2,164,'#9fb3d1',4,'center');
  txt('WASD MOVE   SPACE DASH   E TALK   M MUSIC   F FULLSCREEN   G FPS',W/2,190,'rgba(255,255,255,0.7)',4,'center');
}
function drawPause(){
  ctx.fillStyle='rgba(5,10,20,0.7)';ctx.fillRect(0,0,W,H);
  txt('PAUSED',W/2,70,'#ffd23f',16,'center');
  txt('ESC: RESUME',W/2,104,'#fff',8,'center');
  txt(state==='challenge'?'Q: QUIT TRIAL':'Q: TITLE SCREEN',W/2,120,'#fff',8,'center');
  txt('M: MUSIC '+(muted?'OFF':'ON'),W/2,136,'#9fb3d1',8,'center');
}

/* ---------- main loop ---------- */
let state='title',paused=false,time=0,showFps=false,fps=60,fc=0,ft=0;
function update(dt){
  time+=dt;
  if(hit('m'))muted=!muted;
  if(hit('g'))showFps=!showFps;
  if(state==='title'){if(hit(' ','enter','e'))startGame(false);else if(hit('n'))startGame(true);return;}
  if(paused){if(hit('escape','p'))paused=false;else if(hit('q')){paused=false;if(state==='challenge')toWorld(ch.id);else{state='title';setSong(null);}}return;}
  if(state==='intro'&&hit('escape')){state='world';return;}
  if(state!=='result'&&hit('escape','p')){paused=true;return;}
  if(hitstop>0){hitstop-=dt;return;}
  shake=Math.max(0,shake-dt*22);
  if(state==='world')updWorld(dt);
  else if(state==='intro')updIntro(dt);
  else if(state==='challenge')updChallenge(dt);
  else if(state==='result')updResult(dt);
  updParts(dt);
}
function draw(){
  ctx.setTransform(S,0,0,S,0,0);
  const sx=shake>0.5?Math.round(rnd(-shake,shake)):0,sy=shake>0.5?Math.round(rnd(-shake,shake)):0;
  if(state==='title')drawTitle();
  else if(state==='world'||state==='intro'){drawWorld(sx,sy);if(state==='intro')drawIntro();}
  else{drawChallenge(sx,sy);if(state==='result')drawResult();}
  if(paused)drawPause();
  if(showFps)txt(fps+' FPS',W-4,H-10,'#7dffb0',4,'right');
}
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.25)dt=0.25;acc+=dt;
  fc++;ft+=dt;if(ft>=0.5){fps=Math.round(fc/ft);fc=0;ft=0;}
  let n=0;while(acc>=STEP&&n<5){update(STEP);acc-=STEP;pressed={};n++;}
  if(n===5)acc=0;
  draw();musicTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

});</script>
