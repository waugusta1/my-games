:root{--steel:#2b312d;--steel2:#1b1f1c;--steel3:#3c443e;--lamp:#f0ab3c;--lamp2:#7a5317;--stencil:#c9cdbd;--paper:#e8dfc6;--paper2:#cdbf9b;--ink:#26231b;--red:#b5301f;--phos:#7dffb0;--sten:"DIN Condensed","Avenir Next Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;--type:"American Typewriter","Courier New",Courier,monospace}

{id:'m01',th:0,n:'Shakedown',wx:0,tod:'day',lvl:1,rw:250,tut:1,

<h5>THE IDEA</h5><p>You cannot see. You can only listen, and be heard. Find them first, shoot first, then disappear.</p>
<h5>STEERING</h5><p>Tap the chart to set a course. Drag to move the chart, pinch or use + and - to zoom. The target-cross button recentres on you. ORDER sets speed. Fast means loud, and fast also makes you deaf.</p>
<h5>DEPTH AND THE LAYER</h5><p>Drag on DIVING PLANES or use SCOPE, ABOVE, BELOW, DEEP. The dashed THERMOCLINE line bends sound. Below it, ships on the surface hear you far less and their pings reach far less. Do not pass the red TEST line for long.</p>
<h5>SONAR</h5><p>The green screen shows noise by bearing. Bright lines are contacts. You are deaf in the dark arc behind your boat. New contacts start as a bearing line. Moving across the line builds a solution, shown as a pencil mark with a ring of doubt. Tap a mark to select it.</p>
<h5>PERISCOPE</h5><p>At periscope depth press SCOPE. Drag to look around. MARK gives an exact fix on the ship on the crosshair. PHOTO needs 6X. A raised scope can be spotted, so be quick.</p>
<h5>TORPEDOES</h5><p>Select a contact and press FIRE AT TRACK, or press FIRE and tap the chart. Better solutions mean better shots. The seeker takes over in the last kilometre. Tubes need time to reload.</p>
<h5>BEING HUNTED</h5><p>The HELD light means they have you on active sonar. Cross the layer, change course, slow down or stop, and drop a DECOY. Hugging the seabed also confuses pings. PING gives you a fix on everything nearby, and tells everyone exactly where you are.</p>
<h5>BATTERY</h5><p>Diesel boats drain fast at speed. At periscope depth press SNORKEL to recharge. It is loud and visible.</p>
<h5>COMMENDATIONS</h5><p>Three stars per patrol: finish it, keep the hull over 70%, and never be located.</p>`;
