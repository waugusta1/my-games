window.__store={flush(){if(timer){clearTimeout(timer);timer=0;}flush();},get(k){return has[k]?mem[k]:lget(k);},

  remove(k){has[k]=1;mem[k]=null;lset(k,null);lset('__t:'+k,String(Date.now()));pending.set(k,null);sched();}};

    $('wStats').textContent='Hits: cyan '+stats.hits[0]+' · magenta '+stats.hits[1]+'  ·  Fastest shot: '+Math.round(stats.top/10)+' km/h';$('over').hidden=false;},1400);}
function burst(x,y,c,n,sp){for(let i=0;i<n&&parts.length<800;i++){const a=R()*TAU,v=rnd(sp*.2,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.2,.6),max:.6,c,s:rnd(1.5,4)});}}

/* ---------- loop ---------- */
function update(rdt){t+=rdt;slowT=Math.max(0,slowT-rdt);slow=lerp(slow,slowT>0?.25:1,Math.min(1,rdt*8));const dt=rdt*slow;
  shake=Math.max(0,shake-rdt*40);flash=flash.map(f=>Math.max(0,f-rdt*1.5));if(banner){banner.t-=rdt;if(banner.t<=0)banner=null;}
  if(state==='play'||state==='end'){if(serveT>0){serveT-=rdt;}step(dt);
    if(state==='play'&&pups){itemT-=rdt;if(itemT<=0&&items.filter(i=>!i.got).length<2){const ks=Object.keys(PUPDEF);items.push({k:ks[(R()*ks.length)|0],x:rnd(120,FW-120),y:FH/2+rnd(-90,90),t:0});itemT=rnd(7,11);}}
    for(const it of items)it.t+=rdt;items=items.filter(i=>!i.got&&i.t<12);}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;}
  for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.life-=rdt;q.y-=40*rdt;if(q.life<=0)texts.splice(i,1);}}
function glowLine(x1,y1,x2,y2,c,w){ctx.strokeStyle=c;ctx.lineWidth=w*3;ctx.globalAlpha=.18;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#05040c';ctx.fillRect(0,0,W,H);
  if(state==='title'){drawBgGrid();return;}
  ctx.save();ctx.translate(shake?(R()-.5)*shake:0,shake?(R()-.5)*shake:0);applyField();
  // table
  const tg=ctx.createLinearGradient(0,0,0,FH);tg.addColorStop(0,'#160a24');tg.addColorStop(.5,'#0a0a18');tg.addColorStop(1,'#061420');ctx.fillStyle=tg;ctx.fillRect(0,0,FW,FH);
  ctx.strokeStyle='rgba(120,140,255,.07)';ctx.lineWidth=1;for(let x=0;x<=FW;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,FH);ctx.stroke();}for(let y=0;y<=FH;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(FW,y);ctx.stroke();}
  for(const i of[0,1])if(flash[i]>0){ctx.fillStyle=COL[i];ctx.globalAlpha=flash[i]*.25;ctx.fillRect(0,i?0:FH/2,FW,FH/2);ctx.globalAlpha=1;}
  ctx.lineCap='round';ctx.strokeStyle='#5a60c8';glowLine(0,FH/2,FW,FH/2,'#6a70ff',3);ctx.strokeStyle='#6a70ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(FW/2,FH/2,90,0,TAU);ctx.stroke();
  for(const i of[0,1]){const y=i?0:FH,c=COL[i];ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(FW/2,y,140,i?0:Math.PI,i?Math.PI:TAU);ctx.stroke();
    // walls
    ctx.strokeStyle=c;glowLine(0,y,FW/2-GOAL/2,y,c,6);glowLine(FW/2+GOAL/2,y,FW,y,c,6);ctx.fillStyle=c;ctx.globalAlpha=.25+.15*Math.sin(t*5);ctx.fillRect(FW/2-GOAL/2,i?-10:FH,GOAL,10);ctx.globalAlpha=1;}
  ctx.strokeStyle='#8a90ff';glowLine(0,0,0,FH,'#8a90ff',5);glowLine(FW,0,FW,FH,'#8a90ff',5);
  // pillars
  for(const pl of pillars){ctx.fillStyle='#120e2a';ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r,0,TAU);ctx.fill();ctx.strokeStyle='#a0a8ff';ctx.lineWidth=4;ctx.shadowColor='#a0a8ff';ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;}
  // items
  for(const it of items){const P=PUPDEF[it.k],b=1+Math.sin(it.t*6)*.08,a=it.t>10?(Math.sin(it.t*20)>0?1:.3):1;ctx.globalAlpha=a;ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.t*1.5);ctx.strokeStyle=P.c;ctx.lineWidth=3;ctx.shadowColor=P.c;ctx.shadowBlur=20;ctx.beginPath();for(let s=0;s<6;s++){const an=s/6*TAU;ctx.lineTo(Math.cos(an)*24*b,Math.sin(an)*24*b);}ctx.closePath();ctx.stroke();ctx.shadowBlur=0;ctx.restore();
    ctx.font='22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=P.c;ctx.save();ctx.translate(it.x,it.y);if(rot)ctx.rotate(Math.PI/2);ctx.fillText(P.icon,0,1);ctx.restore();ctx.globalAlpha=1;}
  // pucks
  for(const p of pucks){const c=p.fire?'#ffa03a':p.extra?'#ffe14a':'#ffffff';ctx.globalCompositeOperation='lighter';for(let i=1;i<p.trail.length;i++){const a=p.trail[i-1],b=p.trail[i],q=i/p.trail.length;ctx.strokeStyle=c;ctx.globalAlpha=q*.5;ctx.lineWidth=p.r*2*q;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    const sv=serveT>0&&!p.extra?.5+.5*Math.sin(t*14):1;ctx.globalAlpha=sv;ctx.fillStyle='#0a0a14';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=5;ctx.shadowColor=c;ctx.shadowBlur=24;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,6,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  // strikers
  for(const m of M){const c=COL[m.i];ctx.globalAlpha=m.frz>0?.6:1;ctx.fillStyle='#0a0a18';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,TAU);ctx.fill();ctx.strokeStyle=m.frz>0?'#9ae8ff':c;ctx.lineWidth=7;ctx.shadowColor=c;ctx.shadowBlur=30;ctx.stroke();ctx.shadowBlur=0;
    ctx.lineWidth=3;ctx.beginPath();ctx.arc(m.x,m.y,m.r*.55,0,TAU);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.arc(m.x,m.y,m.r*.25,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  ctx.globalCompositeOperation='lighter';for(const q of parts){ctx.globalAlpha=q.life/q.max;ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // score digits on each half (readable by each player)
  ctx.textAlign='center';ctx.textBaseline='middle';for(const i of[0,1]){ctx.save();ctx.translate(FW-50,i?FH/2-70:FH/2+70);if(i)ctx.rotate(Math.PI);if(rot)ctx.rotate(Math.PI/2*(i?-1:1));ctx.font='900 64px Orbitron,"Arial Black",sans-serif';ctx.fillStyle=COL[i];ctx.globalAlpha=.85;ctx.shadowColor=COL[i];ctx.shadowBlur=20;ctx.fillText(score[i],0,0);ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();}
  for(const q of texts){ctx.save();ctx.translate(q.x,q.y);if(rot)ctx.rotate(Math.PI/2);ctx.globalAlpha=Math.min(1,q.life*2);ctx.font='900 26px Orbitron,"Arial Black",sans-serif';ctx.fillStyle=q.c;ctx.shadowColor=q.c;ctx.shadowBlur=14;ctx.fillText(q.s,0,0);ctx.shadowBlur=0;ctx.restore();}ctx.globalAlpha=1;
  ctx.restore();
  // banner in screen space
  if(banner){ctx.setTransform(dpr,0,0,dpr,0,0);const a=Math.min(1,banner.t*3);ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='middle';const sz=Math.min(W,H)*.14;ctx.font='900 '+Math.round(sz)+'px Orbitron,"Arial Black",sans-serif';const c=banner.c||'#fff';ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=30;
    for(const r of rot?[0]:[0,1]){ctx.save();ctx.translate(W/2,H/2+(rot?0:(r?-1:1)*H*.12));if(r)ctx.rotate(Math.PI);ctx.fillText(banner.s,0,0);if(banner.sub){ctx.font='700 '+Math.round(sz*.28)+'px Orbitron,"Arial Black",sans-serif';ctx.fillText(banner.sub,0,sz*.7);ctx.font='900 '+Math.round(sz)+'px Orbitron,"Arial Black",sans-serif';}ctx.restore();}ctx.shadowBlur=0;ctx.globalAlpha=1;}}
function drawBgGrid(){ctx.strokeStyle='rgba(255,47,208,.18)';ctx.lineWidth=1;const hz=H*.62;for(let i=-20;i<=20;i++){ctx.beginPath();ctx.moveTo(W/2+i*20,hz);ctx.lineTo(W/2+i*W*.12,H);ctx.stroke();}for(let j=0;j<14;j++){const y=hz+Math.pow((j+(t*.6)%1)/14,2)*(H-hz);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const sg=ctx.createLinearGradient(0,hz-H*.3,0,hz);sg.addColorStop(0,'#ffcf3a');sg.addColorStop(1,'#ff2fd0');ctx.fillStyle=sg;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(W/2,hz,Math.min(W,H)*.25,Math.PI,TAU);ctx.fill();ctx.globalAlpha=1;}
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
resize();updTitle();requestAnimationFrame(frame);
window.__ns={get s(){return{state,score,pucks:pucks.length,items:items.length}},bot(){setInterval(()=>{if(state!=='play')return;for(const m of M){const p=pucks[0];if(!p)continue;const home=m.i?FH*.12:FH*.88;const own=m.i?p.y<FH/2:p.y>FH/2;if(own){m.tx=clamp(p.x+(R()-.5)*20,m.r,FW-m.r);m.ty=m.i?clamp(p.y-20,m.r,FH/2-m.r):clamp(p.y+20,FH/2+m.r,FH-m.r);}else{m.tx=FW/2+(p.x-FW/2)*.4;m.ty=home;}}},16);}};
})();
