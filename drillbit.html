<script>/* SND: shared audio engine: real public-domain soundtrack (FreePD.com, CC0) with synth fallback, rich sound effects, nature ambience. */
window.SND=(()=>{
'use strict';
let ac=null,master,comp,rev,musicBus,sfxBus,ambBus,noiseBuf=null,pinkBuf=null,unlocked=false;
const S={music:true,sfx:true,vol:.85};try{Object.assign(S,JSON.parse(localStorage.getItem('snd-settings')||'{}'));}catch(_){}
const saveS=()=>{try{localStorage.setItem('snd-settings',JSON.stringify(S));}catch(_){}};
const R=Math.random,rv=(a=.05)=>1+(R()-.5)*2*a,mtof=n=>440*Math.pow(2,(n-69)/12);

  ambBus=ac.createGain();ambBus.gain.value=S.sfx?.8:0;ambBus.connect(master);const ar=ac.createGain();ar.gain.value=.2;ambBus.connect(ar);ar.connect(rev);
  const n=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,n,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=R()*2-1;

/* ---- real soundtrack: public-domain tracks streamed from music/ ---- */
const TRK={garden:['magic_in_the_garden','travelers_notebook','spring_chicken','peaceful_days','happy_whistling_ukulele','wisdom_in_the_sun','a_place_i_call_home','barnville','slice_of_life'],
  calm:['infinite_peace','study_and_relax','river_meditation','kalimba_relaxation_music','lonely_mountain'],night:['forest_night','night_vigil','midnight_in_the_green_house','shining_stars'],
  ocean:['the_lagoon','pond','aquarium','pina_colada','coy_koi'],adventure:['heroic_adventure','journey_of_hope','jungle_mission','adventure','horizon_flare'],flight:['inventing_flight','adventures_of_flying_jack','horizon_flare','journey_of_hope'],
  race:['take_the_ride','rush','gotta_keep_on_movin','action_strike','city_run'],boss:['epic_boss_battle','battle_ready','strength_of_the_titans'],candy:['funshine','going_bananas','llama_in_pajama','hippety_hop','improved_ice_cream_truck'],
  arcade:['blippy_trance','funky_energy_loop','circuit','bit_bit_loop'],storm:['cold_journey','mysterious_lights'],snow:['ice_and_snow','winter'],desert:['the_desert','jungle_mission'],
  castle:['black_knight','behind_the_sword','night_in_the_castle','honor_bound'],pirate:['land_of_pirates','windy_old_weather','village_tarantella'],safari:['nomadic_sunset','the_range','wisdom_in_the_sun','del_rio_bravo'],deep:['aquatic_city_vanished','the_abyss','deep_tones','neptunian_princess'],kitchen:['le_baguette','dancing_at_the_inn','sunny_rasta','funshine'],groove:['funkeriffic','groovin','funky_energy_loop'],space:['space_ambience','mothership','neptunian_princess'],cozy:['bonfire','brewing_potions','forest_frolic_loop']};
const FALL={pirate:'adventure',safari:'adventure',deep:'calm',kitchen:'candy',groove:'arcade',flight:'adventure',snow:'night',castle:'boss',space:'arcade',desert:'adventure',cozy:'calm'};
let RT=null,rtBus=null,rtStyle=null,rtFail=0;const rtIdx={};const MB=()=>(window.MUSIC_BASE||'music/');

function rtUnlockEls(){if(!RT)return;for(const e of RT){if(e.busy)continue;try{e.a.muted=true;const p=e.a.play();if(p&&p.catch)p.catch(()=>{});e.a.pause();e.a.muted=false;}catch(_){}}}
function rtStart(style){if(!RT||rtFail>3)return false;const list=TRK[style];if(!list)return false;if(rtStyle===style&&RT.some(e=>e.busy))return true;rtStop();rtStyle=style;
  const e=RT[0].busy?RT[1]:RT[0];let i=rtIdx[style];if(i==null)i=Math.floor(Math.random()*list.length);rtIdx[style]=(i+1)%list.length;
  e.busy=true;e.a.src=MB()+list[i]+'.mp3';e.a.currentTime=0;e.g.gain.cancelScheduledValues(now());e.g.gain.setValueAtTime(0,now());e.g.gain.linearRampToValueAtTime(.62,now()+2.2);
  e.a.onended=()=>{e.busy=false;if(rtStyle===style){rtStyle=null;rtStart(style);}};
  e.a.onerror=()=>{e.busy=false;rtFail++;if(rtStyle===style){rtStyle=null;if(rtFail>3){startSong(STY[style]?style:FALL[style]);}else rtStart(style);}};
  const p=e.a.play();if(p&&p.catch)p.catch(()=>{});return true;}
function rtStop(){if(!RT)return;rtStyle=null;for(const e of RT){if(!e.busy)continue;e.busy=false;const a=e.a,g=e.g;a.onended=null;a.onerror=null;g.gain.cancelScheduledValues(now());g.gain.setValueAtTime(g.gain.value,now());g.gain.linearRampToValueAtTime(0,now()+1.8);setTimeout(()=>{if(!e.busy)a.pause();},1900);}}

function unlock(){if(!init())return;if(ac.state==='suspended')ac.resume();rtInit();if(!unlocked){unlocked=true;rtUnlockEls();if(want.song)playMusic(want.song);for(const k in want.amb)if(want.amb[k])ambOn(k,want.amb[k]);}}
['pointerdown','touchstart','keydown','mousedown'].forEach(ev=>addEventListener(ev,unlock,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend&&ac.suspend();else if(unlocked)ac.resume();});
const now=()=>ac.currentTime;
/* ---- primitives ---- */
function out(dest,pan){let node=dest||sfxBus;if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));p.connect(node);node=p;}return node;}
function tone(o){if(!ac)return;const t=now()+(o.t||0),d=o.d||.2,v=(o.v==null?.2:o.v),a=o.a||.005,r=o.r==null?d*.8:o.r;const os=ac.createOscillator(),g=ac.createGain();
  if(o.wave)os.setPeriodicWave(o.wave);else os.type=o.type||'sine';os.frequency.setValueAtTime(o.f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+(o.slide||d));if(o.detune)os.detune.value=o.detune;
  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vibRate||5.5;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+r+.1);}
  let node=os;if(o.lp||o.hp||o.bp){const f=ac.createBiquadFilter();f.type=o.lp?'lowpass':o.hp?'highpass':'bandpass';f.frequency.setValueAtTime(o.lp||o.hp||o.bp,t);if(o.lp2)f.frequency.exponentialRampToValueAtTime(o.lp2,t+d);f.Q.value=o.q||.8;os.connect(f);node=f;}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);if(o.sus!=null){g.gain.setTargetAtTime(v*o.sus,t+a,(o.dec||.1));g.gain.setValueAtTime(v*o.sus,t+d);}else g.gain.setValueAtTime(v,t+Math.max(a,d-r));g.gain.exponentialRampToValueAtTime(.0001,t+d+(o.sus!=null?r:0)+.001);

  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);node.connect(g);g.connect(out(o.dest,o.pan));s.start(t,R()*1.5);s.stop(t+d+.05);}

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.003));g.gain.exponentialRampToValueAtTime(.0001,t+d);c.connect(g);g.connect(out(o.dest,o.pan));c.start(t);m.start(t);c.stop(t+d+.05);m.stop(t+d+.05);}

let pulseW=null;const pulse=()=>{if(!pulseW){const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++)im[i]=2/(i*Math.PI)*Math.sin(i*Math.PI*.25);pulseW=ac.createPeriodicWave(re,im);}return pulseW;};

/* ---- instruments (used by music + sfx) ---- */
const INS={
  pad:(m,t,d,v,dest)=>{for(const dt of[-8,8])tone({type:'sawtooth',f:mtof(m),detune:dt,t,d,v:v*.32,a:Math.min(.6,d*.35),r:Math.min(1.2,d*.5),lp:900,q:.5,dest});},

  guitar:(m,t,d,v,dest)=>{if(ac)pluckKS(m,{t,v:v*.8,d:Math.max(1.2,d*2.5),lp:2400,dest});},
  bass:(m,t,d,v,dest)=>{tone({type:'sine',f:mtof(m),t,d,v:v*.75,a:.008,r:Math.min(.25,d*.5),dest});tone({type:'sawtooth',f:mtof(m),t,d,v:v*.18,a:.008,r:.15,lp:500,lp2:220,dest});},
  synthbass:(m,t,d,v,dest)=>{tone({type:'sawtooth',f:mtof(m),t,d,v:v*.4,a:.004,r:.1,lp:1400,lp2:300,q:4,dest});tone({type:'square',f:mtof(m-12),t,d,v:v*.2,r:.1,lp:400,dest});},

  if(old){old.bus.gain.cancelScheduledValues(now());old.bus.gain.setValueAtTime(old.bus.gain.value,now());old.bus.gain.linearRampToValueAtTime(0,now()+2);setTimeout(()=>{try{old.bus.disconnect();}catch(_){}},2600);}

function schedule(){if(!song||!ac)return;const s=song,st=s.st,spb=60/st.bpm/4;
  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;

    const deg=s.prog[bar%4],ch=chordNotes(st,deg),sw=(step%2)?st.swing*spb:0,T=t+sw;

    if(sec!=='intro'&&sec!=='break'||sec==='break'&&step%4===0){const ap=st.arpPat;let idx=null;if(ap==='up'&&step%2===0)idx=(step/2)%4;else if(ap==='down'&&step%2===0)idx=3-(step/2)%4;else if(ap==='wide'&&step%4===0)idx=[0,2,1,3][step/4];else if(ap==='bounce'&&[0,3,6,8,11,14].includes(step))idx=[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(step)];
      if(idx!=null)INS[st.arp](ch[idx]+12,T,spb*2,.3*(sec==='b'?1:.8),dest);}
    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}

  else if(tt===8){const v=Math.round(800+d.ty*30+R()*d.ty*20);save.money+=v;save.earned+=v;toast('🎁 Buried treasure chest! +'+fmt(v));SND.play('fanfare');burst(cx,cy,'#ffd040',30,5);}
  else if(tt===9){const v=Math.round(150+d.ty*6);save.money+=v;save.earned+=v;toast('🦴 Fossil found! The museum pays '+fmt(v));SND.play('success');burst(cx,cy,'#efe6d4',16,3);}
  else{burst(cx,cy,tt===1?'#8a6240':tt===2?'#a06a44':tt===3?'#7a7470':'#4a4650',8,2.5);}
  P.fx=d.dx?P.x:d.tx;P.x=d.tx;P.y=d.ty;P.Y=d.ty;P.vy=0;P.anim=d.dx?0:1;}
function update(dt){if(state!=='play')return;const st=S();t+=dt;
  if(P.drill){const d=P.drill;d.p+=dt*st.drill*1.6/tileHard(d.tt);P.fuel-=dt*.32;if(R()<dt*18)burst(d.tx+.5-d.dx*.45,d.ty+.5-d.dy*.45,['#6a4628','#8a6240','#999'][(R()*3)|0],1,2.5,10,.5,.05);shake=Math.max(shake,.12);
    if(drillSnd)drillSnd.set(.6+d.p*.3,1,1);if(d.p>=1)finishDrill();}
  else{if(drillSnd)drillSnd.set(.25,.2,P.thr?.8:.35);
    const L=keys.l,Rr=keys.r,D=keys.d,U=keys.u;if(L)P.face=-1;if(Rr)P.face=1;
    if(U&&P.fuel>0){P.vy=Math.max(P.vy-dt*(26+st.eng*8),-(4.5+st.eng*2));P.fuel-=dt*.4;P.thr=1;if(R()<dt*30)burst(P.x+.5,P.Y+1,'#ffb040',1,1.5,-4,.35,.06);}else{P.thr=0;P.vy+=dt*20;}
    P.vy=clamp(P.vy,-12,18);let nY=P.Y+P.vy*dt;
    if(P.vy>0){let fy=Math.floor(P.Y);while(fy<Math.floor(nY)+1){if(solid(tile(P.x,fy+1))){if(nY>fy){nY=fy;const imp=P.vy;if(imp>11){const dmg=Math.round((imp-11)*6);P.hull-=dmg;toast('💢 Hard landing −'+dmg+' hull');SND.play('hit');shake=.5;buzz(40);}else if(imp>4)SND.play('land');P.vy=0;}break;}fy++;}}
    else if(P.vy<0){if(nY<-1.6){nY=-1.6;P.vy=0;}const top=Math.floor(nY);if(top<Math.ceil(P.Y)&&top>=1&&solid(tile(P.x,top))){nY=top+1;P.vy=0;}}
    P.Y=nY;P.y=Math.max(0,Math.round(P.Y));const aligned=Math.abs(P.Y-Math.round(P.Y))<.12;const grounded=aligned&&P.vy>=0&&solid(tile(P.x,Math.round(P.Y)+1));if(grounded){P.Y=Math.round(P.Y);P.y=P.Y;}
    P.mvT=(P.mvT||0)-dt;
    if((L||Rr)&&P.mvT<=0&&aligned){const dx=L?-1:1,yy=Math.max(0,Math.round(P.Y)),nt=yy<1?(P.x+dx<0||P.x+dx>=WC?7:0):tile(P.x+dx,yy);if(nt===0){P.fx=P.x;P.x+=dx;P.anim=0;P.mvT=.16/st.eng;P.fuel-=.04;P.Y=yy;P.y=yy;}else if(grounded&&yy>=1){startDrill(dx,0);}}
    else if(D&&grounded){startDrill(0,1);}}
  P.anim=Math.min(1,P.anim+dt*7);P.fuel-=dt*.015;
  // hazards: heat below radiator depth
  if(P.y>st.heat){P.hull-=dt*(2+(P.y-st.heat)*.05);if(!P.heatT||t-P.heatT>4){toast('🌡️ Too hot! Upgrade the ❄️ Radiator to go deeper');P.heatT=t;}}
  // surface interaction
  const b=P.y===0?BUILD.find(b=>P.x>=b.x0&&P.x<=b.x1):null;$('enter').hidden=!b||!$('sheet').hidden;if(b)$('enter').textContent='Enter '+b.n;P.bld=b;
  if(P.y===0&&!P.surfT){P.surfT=1;}if(P.y>0)P.surfT=0;
  // depth records
  if(P.y>save.best){save.best=P.y;if(P.y-lastDepthToast>=100){lastDepthToast=Math.floor(P.y/100)*100;toast('⛏️ New depth record: '+P.y*5+' m');SND.play('levelup');}}
  // fuel / hull failure
  if(P.fuel<=0&&!P.dead){P.fuel=0;if(P.y>0)fail('⛽ Out of fuel!');}
  if(P.hull<=0&&!P.dead)fail('💥 Your pod was destroyed!');
  // camera
  const tx=(P.x+.5)*TS-W/2,ty=(P.Y+.5)*TS-H*.45;camX=lerp(camX,tx,Math.min(1,dt*6));camY=lerp(camY,ty,Math.min(1,dt*6));
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.l<=0)parts.splice(i,1);}
  shake=Math.max(0,shake-dt*2);
  // music & ambience
  SND.music(P.y<40?'adventure':P.y<160?'deep':'castle');SND.amb('wind',P.y===0?.5:0);SND.amb('fire',P.y>180?.4:0);}
function fail(msg){P.dead=true;state='rescue';const lost=P.cargo.length,fee=Math.round(save.money*.25);SND.play('powerdown');buzz([80,40,80]);
  openSheet('<h3>'+msg+'</h3><p>A rescue crew hauls your pod back to the surface.</p><p>You lose your cargo ('+lost+' ore) and pay a rescue fee of <b>'+fmt(fee)+'</b>.</p><button class="btn" id="resc">OK</button>');
  $('resc').onclick=()=>{save.money-=fee;P.cargo=[];toSurface();P.fuel=S().tank*.5;P.hull=Math.max(P.hull,S().hull*.5);P.dead=false;state='play';$('sheet').hidden=true;persist();};}
function toSurface(){P.x=20;P.y=0;P.Y=0;P.vy=0;P.fx=20;P.fy=0;P.drill=null;camX=(P.x+.5)*TS-W/2;camY=-H*.45;}
/* ---------- rendering ---------- */
let light=null;
function drawPod(x,y){const s=TS;ctx.save();ctx.translate(x,y);ctx.scale(P.face,1);const d=P.drill;const dang=d?(d.dy?Math.PI/2:0):0;
  // treads
  ctx.fillStyle='#2a2a2e';ctx.beginPath();ctx.roundRect(-s*.42,s*.18,s*.84,s*.22,s*.1);ctx.fill();ctx.fillStyle='#555';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-s*.32+i*s*.16,s*.29,s*.055,0,TAU);ctx.fill();}
  // body
  const gr=ctx.createLinearGradient(0,-s*.35,0,s*.2);gr.addColorStop(0,'#ffd24a');gr.addColorStop(1,'#d88a10');ctx.fillStyle=gr;ctx.beginPath();ctx.roundRect(-s*.38,-s*.28,s*.7,s*.5,s*.12);ctx.fill();ctx.strokeStyle='#7a4a08';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#1a1a1a';ctx.fillRect(-s*.3,s*.06,s*.55,s*.05);
  // cockpit
  const cg=ctx.createLinearGradient(-s*.2,-s*.25,s*.1,0);cg.addColorStop(0,'#bfefff');cg.addColorStop(1,'#3a7aa0');ctx.fillStyle=cg;ctx.beginPath();ctx.roundRect(-s*.18,-s*.22,s*.3,s*.2,s*.08);ctx.fill();
  // headlight
  ctx.fillStyle='#fffbe0';ctx.beginPath();ctx.arc(s*.3,-s*.1,s*.05,0,TAU);ctx.fill();
  // drill bit
  ctx.save();if(d&&d.dy){ctx.translate(0,s*.4);ctx.rotate(Math.PI/2);}else ctx.translate(s*.32,0);const sp=(t*30)%1;ctx.fillStyle='#b8bcc4';ctx.beginPath();ctx.moveTo(0,-s*.17);ctx.lineTo(s*.3,0);ctx.lineTo(0,s*.17);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#5a5e66';ctx.lineWidth=2;for(let i=0;i<3;i++){const u=(i/3+sp*(d?1:.1))%1;ctx.beginPath();ctx.moveTo(u*s*.3,-s*.17*(1-u));ctx.lineTo(u*s*.3+s*.04,s*.17*(1-u));ctx.stroke();}ctx.restore();

  if(P.thr){ctx.fillStyle='rgba(255,160,40,.85)';ctx.beginPath();ctx.moveTo(-s*.15,s*.4);ctx.lineTo(0,s*(.62+R()*.15));ctx.lineTo(s*.15,s*.4);ctx.fill();}
  ctx.restore();}
function render(){const sx=(R()-.5)*shake*8,sy=(R()-.5)*shake*8;ctx.save();ctx.translate(-Math.round(camX)+sx,-Math.round(camY)+sy);
  const x0=Math.floor(camX/TS)-1,x1=Math.ceil((camX+W)/TS)+1,y0=Math.floor(camY/TS)-1,y1=Math.ceil((camY+H)/TS)+1;
  // sky
  if(y0<1){const sky=ctx.createLinearGradient(0,camY,0,TS);sky.addColorStop(0,'#5aa8e8');sky.addColorStop(1,'#cfe8f8');ctx.fillStyle=sky;ctx.fillRect(camX-10,camY-10,W+20,TS-camY+10);
    ctx.fillStyle='#8aa0b0';for(let i=-2;i<14;i++){const mx=i*180-camX*.3+camX;ctx.beginPath();ctx.moveTo(mx,TS*.9);ctx.lineTo(mx+90,TS*.9-110-((i*37)%5)*14);ctx.lineTo(mx+180,TS*.9);ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<6;i++){const cx=((i*230+t*12)%(W+400))+camX-200,cy=camY+40+i*18;ctx.beginPath();ctx.ellipse(cx,cy,60,18,0,0,TAU);ctx.ellipse(cx+40,cy-8,40,16,0,0,TAU);ctx.fill();}
    // buildings
    for(const b of BUILD){const bx=b.x0*TS,bw=(b.x1-b.x0+1)*TS,bh=TS*1.9;ctx.fillStyle={fuel:'#d84a3a',trade:'#3a8ad8',garage:'#6a6a72',shop:'#8a5ad8'}[b.k];ctx.fillRect(bx,TS-bh,bw,bh);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(bx,TS-bh,bw,TS*.25);
      ctx.fillStyle='#2a2a2a';ctx.fillRect(bx+bw*.35,TS-TS*.95,bw*.3,TS*.95);ctx.fillStyle='#fff6e0';ctx.font='700 '+Math.round(TS*.28)+'px Fredoka,system-ui';ctx.textAlign='center';ctx.fillText(b.n,bx+bw/2,TS-bh+TS*.55);}}
  // tiles
  for(let y=Math.max(1,y0);y<=y1;y++)for(let x=x0;x<=x1;x++){const tt=tile(x,y),px=x*TS,py=y*TS;
    if(tt===0){ctx.drawImage(TEX.wall,px,py,TS,TS);const sh=TS*.28;if(solid(tile(x,y-1))&&y>1){const g=ctx.createLinearGradient(0,py,0,py+sh);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(px,py,TS,sh);}
      if(solid(tile(x-1,y))){const g=ctx.createLinearGradient(px,0,px+sh,0);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(px,py,sh,TS);}
      if(solid(tile(x+1,y))){const g=ctx.createLinearGradient(px+TS,0,px+TS-sh,0);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(px+TS-sh,py,sh,TS);}
      if(solid(tile(x,y+1))){ctx.fillStyle='rgba(255,220,170,.10)';ctx.fillRect(px,py+TS-3,TS,3);}continue;}const k=typeof tt==='string'?'o_'+tt.slice(4):'d'+tt;ctx.drawImage(TEX[k],px,py,TS+1,TS+1);
    if(y===1){ctx.fillStyle='#4aa83a';ctx.fillRect(px,py,TS,TS*.18);ctx.fillStyle='#6ac84a';ctx.fillRect(px,py,TS,TS*.07);}}
  // drilling progress crack
  if(P.drill){const d=P.drill;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=2;const cx=(d.tx+.5)*TS,cy=(d.ty+.5)*TS;for(let i=0;i<Math.floor(d.p*6)+1;i++){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(i*1.7)*TS*.45*d.p,cy+Math.sin(i*1.7)*TS*.45*d.p);ctx.stroke();}}
  // pod
  const a=P.anim,px=(lerp(P.fx,P.x,a)+.5)*TS,py=(P.Y+.5)*TS;
  let ox=0,oy=0;if(P.drill){ox=P.drill.dx*P.drill.p*TS*.25;oy=P.drill.dy*P.drill.p*TS*.25;}drawPod(px+ox,py+oy+(P.drill?(R()-.5)*2:0));
  for(const p of parts){ctx.globalAlpha=clamp(p.l/p.L*1.5,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x*TS,p.y*TS,p.s*TS,p.s*TS);}ctx.globalAlpha=1;
  ctx.restore();
  // darkness with headlight
  const dk=clamp((P.y-2)/30,0,.94);if(dk>0){if(!light||light.width!==cv.width){light=document.createElement('canvas');light.width=cv.width;light.height=cv.height;}const lg=light.getContext('2d');lg.setTransform(DPR,0,0,DPR,0,0);lg.globalCompositeOperation='source-over';lg.clearRect(0,0,W,H);lg.fillStyle='rgba(6,4,2,'+dk+')';lg.fillRect(0,0,W,H);
    lg.globalCompositeOperation='destination-out';const cx=px-camX,cy=py-camY;let g=lg.createRadialGradient(cx,cy,TS*.4,cx,cy,TS*2.6);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=g;lg.fillRect(0,0,W,H);
    const hx=cx+P.face*TS*2.2;g=lg.createRadialGradient(hx,cy,TS*.3,hx,cy,TS*2.6);g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=g;lg.fillRect(0,0,W,H);
    for(const p of parts){if(p.col==='#ff7a20'||p.col==='#ffb040'){g=lg.createRadialGradient(p.x*TS-camX,p.y*TS-camY,0,p.x*TS-camX,p.y*TS-camY,TS*.8);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=g;lg.fillRect(0,0,W,H);}}
    ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(light,0,0);ctx.setTransform(DPR,0,0,DPR,0,0);
    // glowing lava & ore glints remain visible
    ctx.save();ctx.translate(-Math.round(camX),-Math.round(camY));for(let y=Math.max(1,y0);y<=y1;y++)for(let x=x0;x<=x1;x++){const tt=tile(x,y);if(tt===5){ctx.fillStyle='rgba(255,90,20,'+(.25+Math.sin(t*3+x)*.1)*dk+')';ctx.fillRect(x*TS,y*TS,TS,TS);}else if(typeof tt==='string'&&hh(x,y,21)<.5){const tw=Math.max(0,Math.sin(t*2+x*3+y));if(tw>.9){ctx.fillStyle='rgba(255,255,255,'+dk*.7+')';ctx.fillRect(x*TS+TS*.4,y*TS+TS*.4,3,3);}}}ctx.restore();}
  // HUD
  const st=S();$('money').textContent=fmt(save.money);$('cargo').textContent='📦 '+P.cargo.length+'/'+st.cargo+' ore · worth '+fmt(cargoVal());$('fuelI').style.width=clamp(P.fuel/st.tank*100,0,100)+'%';$('hullI').style.width=clamp(P.hull/st.hull*100,0,100)+'%';
  $('depth').firstChild.textContent=(P.y*5)+' m';$('best').textContent='Record '+save.best*5+' m'+(P.fuel/st.tank<.2?' · ⚠️ LOW FUEL':'');}
/* ---------- buildings ---------- */
function openSheet(h){const s=$('sheet');s.innerHTML=h;s.hidden=false;}
function building(k){const st=S();SND.play('click');
  if(k==='fuel'){const need=st.tank-P.fuel,cost=Math.ceil(need*2);openSheet('<h3>⛽ Fuel Station <button class="x">×</button></h3><p>Tank: '+P.fuel.toFixed(0)+' / '+st.tank+' L</p><button class="btn" id="fill" '+(need<1||save.money<1?'disabled':'')+'>Fill up · '+fmt(Math.min(cost,save.money))+'</button> <button class="btn g" id="fix" '+(P.hull>=st.hull||save.money<1?'disabled':'')+'>Repair hull · '+fmt(Math.ceil((st.hull-P.hull)*3))+'</button>');
    $('fill').onclick=()=>{const c=Math.min(cost,save.money);P.fuel=Math.min(st.tank,P.fuel+c/2);save.money-=c;SND.play('water');building('fuel');persist();};$('fix').onclick=()=>{const c=Math.min(Math.ceil((st.hull-P.hull)*3),save.money);P.hull=Math.min(st.hull,P.hull+c/3);save.money-=c;SND.play('ratchet');building('fuel');persist();};}
  else if(k==='trade'){const cnt={};for(const id of P.cargo)cnt[id]=(cnt[id]||0)+1;const v=cargoVal();openSheet('<h3>💰 Ore Trader <button class="x">×</button></h3>'+(P.cargo.length?'<div class="grid">'+Object.entries(cnt).map(([id,n])=>'<div class="card"><div class="t">'+OR[id].n+' ×'+n+'</div><div class="d">'+fmt(OR[id].v)+' each</div></div>').join('')+'</div><p><button class="btn g" id="sell">Sell everything · '+fmt(v)+'</button></p>':'<p>Your cargo bay is empty. Go dig!</p>')+'<p style="font-size:12px;color:#6a5a48">Price list: '+ORES.filter(o=>save.found[o.id]).map(o=>o.n+' '+fmt(o.v)).join(' · ')+'</p>');
    if(P.cargo.length)$('sell').onclick=()=>{save.money+=v;save.earned+=v;P.cargo=[];SND.play('cash');toast('💰 Sold for '+fmt(v));building('trade');persist();};}
  else if(k==='garage'){openSheet('<h3>🔧 Upgrade Garage <button class="x">×</button></h3><div class="grid">'+Object.entries(UPS).map(([id,u])=>{const l=save.up[id],c=u.c[l+1];return'<div class="card"><div class="t">'+u.n+' · Lv '+l+'</div><div class="d">'+u.d+'</div>'+(c==null?'<b>MAX</b>':'<button class="btn" data-up="'+id+'" '+(save.money<c?'disabled':'')+'>'+fmt(c)+'</button>')+'</div>';}).join('')+'</div>');
    document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const id=b.dataset.up,c=UPS[id].c[save.up[id]+1];if(save.money>=c){save.money-=c;save.up[id]++;SND.play('powerup');if(id==='tank')P.fuel=S().tank;if(id==='hull')P.hull=S().hull;persist();building('garage');}});}
  else if(k==='shop'){openSheet('<h3>🧨 Supply Shop <button class="x">×</button></h3><div class="grid">'+Object.entries(ITEMS).map(([id,it])=>'<div class="card"><div class="t">'+it.n+' (×'+save.items[id]+')</div><div class="d">'+it.d+'</div><button class="btn" data-it="'+id+'" '+(save.money<it.c?'disabled':'')+'>'+fmt(it.c)+'</button></div>').join('')+'</div>');
    document.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{const id=b.dataset.it;if(save.money>=ITEMS[id].c){save.money-=ITEMS[id].c;save.items[id]++;SND.play('buy');persist();building('shop');renderItems();}});}}
$('sheet').addEventListener('click',e=>{if(e.target.classList.contains('x')){$('sheet').hidden=true;renderItems();}});
$('enter').onclick=()=>{if(P.bld)building(P.bld.k);};
function renderItems(){const el=$('items');el.innerHTML=Object.entries(ITEMS).filter(([id])=>save.items[id]>0).map(([id,it])=>'<button data-use="'+id+'">'+it.n.split(' ')[0]+' ×'+save.items[id]+'</button>').join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>useItem(b.dataset.use));}
function useItem(id){if(save.items[id]<=0||state!=='play')return;const st=S();
  if(id==='dyn'){for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const x=P.x+a,y=P.y+b;if(y<1)continue;const tt=tile(x,y);if(tt===7||tt===0)continue;if(typeof tt==='string'&&P.cargo.length<st.cargo)P.cargo.push(tt.slice(4));mined.add(x+','+y);}SND.play('explosion');shake=1.2;burst(P.x+.5,P.y+.5,'#ffb040',40,8,6,1);buzz([60,30,90]);}
  else if(id==='tele'){toSurface();SND.play('magic');toast('🌀 Beamed to the surface!');}
  else if(id==='rep'){P.hull=Math.min(st.hull,P.hull+60);SND.play('ratchet');}
  else if(id==='can'){P.fuel=Math.min(st.tank,P.fuel+30);SND.play('water');}

/* ---------- loop ---------- */
let last=performance.now(),saveT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if($('sheet').hidden||state!=='play')update(dt);render();if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true;}saveT+=dt;if(saveT>6){saveT=0;persist();}}
$('goB').onclick=()=>{$('start').hidden=true;save.started=true;SND.play('click');if(!drillSnd)drillSnd=SND.engine();persist();};
addEventListener('pointerdown',()=>{if(!drillSnd&&save.started)drillSnd=SND.engine();},{once:true});
window.__dd={P,save,tile,S,building,useItem,toSurface,keys};
resize();buildTex();toSurface();renderItems();if(save.started)$('start').hidden=true;requestAnimationFrame(loop);
addEventListener('visibilitychange',()=>{if(document.hidden)persist();});
})();

});</script>
