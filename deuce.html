function startDrill(){startMatch({surf:'hard',to:3,sk:.2,opp:oppFor('Coach Reyes',.2),drill:15});}
function showShop(){UI.className='';UI.innerHTML=sheet('Pro shop',`<div class="purse">${save.coins} prize money</div>${UPS.map(([k,n,d])=>{const lv=save.up[k],max=lv>=8,c=upCost(k);return`<div class="up"><div><b>${n}</b><small>${d}</small><div class="pips">${Array.from({length:8},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div><button class="b" style="width:auto" data-u="${k}" ${max||save.coins<c?'disabled':''}>${max?'Maxed':c}</button></div>`;}).join('')}<h3 style="margin-top:16px">Kit</h3>${SHIRT.map((s,i)=>{const own=save.kits[i];return`<div class="up"><div><b>${s[0]}</b><div class="pips"><i class="on" style="background:${s[1]};width:44px;height:14px"></i><i class="on" style="background:${s[2]};width:44px;height:14px"></i></div></div><button class="b" style="width:auto" data-k="${i}" ${own||save.coins>=s[3]?'':'disabled'}>${save.kit===i?'Wearing':own?'Wear':s[3]}</button></div>`;}).join('')}`,home);UI.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const k=b.dataset.u,c=upCost(k);if(save.coins>=c&&save.up[k]<8){save.coins-=c;save.up[k]++;persist();sfx('tick');showShop();}});UI.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const i=+b.dataset.k,s=SHIRT[i];if(!save.kits[i]){if(save.coins<s[3])return;save.coins-=s[3];save.kits[i]=1;}save.kit=i;persist();sfx('tick');showShop();});}
function showRecord(){const tot=save.wins+save.losses;UI.className='';UI.innerHTML=sheet('My record',`<div class="st"><div><b>${save.wins}–${save.losses}</b>Wins and losses</div><div><b>${tot?Math.round(100*save.wins/tot):0}%</b>Win rate</div><div><b>${save.titles}</b>Titles</div><div><b>${save.slams}</b>Slams</div><div><b>${save.aces}</b>Aces</div><div><b>${save.winners}</b>Winners</div><div><b>${Object.keys(save.beaten).length}</b>Players beaten</div><div><b>${save.best}</b>Coach's drill best</div></div>`,home);}
function showOpts(){const H=[['Full help','You only aim. Runs and swings for you.',2],['Some help','Runs for you, you swipe to swing.',1],['No help','Left thumb runs, swipe to swing. Pays 25% more.',0]];UI.className='';UI.innerHTML=sheet('How to play',`<p><b>Rally:</b> swipe when the ball reaches you. Direction aims. Fast swipe is a power shot, slow swipe is a lob, short swipe is a drop shot. Swipe as the ball is level with you for the sweet spot.</p><p><b>Serve:</b> press and hold to toss. Swipe up at the top of the toss. Sideways aims it. You get two tries.</p><h3>Help level</h3><div class="seg">${H.map(h=>`<button data-h="${h[2]}" class="${save.help===h[2]?'on':''}">${h[0]}</button>`).join('')}</div><p>${H.find(h=>h[2]===save.help)[1]}</p><h3>Sound</h3><div class="seg"><button data-sn="1" class="${save.snd?'on':''}">On</button><button data-sn="0" class="${save.snd?'':'on'}">Off</button></div>`,home);UI.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{save.help=+b.dataset.h;persist();showOpts();});UI.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>{save.snd=+b.dataset.sn;persist();showOpts();});}
function pauseGame(){if(scr!=='match'||paused)return;paused=true;UI.className='dim';UI.hidden=false;UI.innerHTML=sheet('Paused',`<div class="mn" style="margin-top:14px"><button class="b pri" id="pR">Resume</button><button class="b" id="pQ">${M&&M.cfg.tour?'Forfeit the match':'Quit match'}</button><button class="b" id="pG">Go back to games</button></div>`,resume);$('pR').onclick=resume;$('pQ').onclick=()=>{const c=M.cfg;if(c.tour){save.losses++;__mgt('l',TOUR[c.tour.i].n);RUN=null;saveRun();}persist();paused=false;home();};$('pG').onclick=()=>{persist();saveRun();leave();};}
function resume(){paused=false;UI.hidden=true;last=performance.now();}
$('pauseB').onclick=pauseGame;addEventListener('pagehide',()=>{persist();saveRun();});
resize();home();requestAnimationFrame(frame);
</script></body></html>
