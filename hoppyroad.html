<script>/* SND: shared audio engine: real public-domain soundtrack (FreePD.com, CC0) with synth fallback, rich sound effects, nature ambience. */
window.SND=(()=>{

const R=Math.random,rv=(a=.05)=>1+(R()-.5)*2*a,mtof=n=>440*Math.pow(2,(n-69)/12);

/* ---- real soundtrack: public-domain tracks streamed from music/ ---- */
const TRK={garden:['magic_in_the_garden','travelers_notebook','spring_chicken','peaceful_days','happy_whistling_ukulele','wisdom_in_the_sun','a_place_i_call_home','barnville','slice_of_life'],
  calm:['infinite_peace','study_and_relax','river_meditation','kalimba_relaxation_music','lonely_mountain'],night:['forest_night','night_vigil','midnight_in_the_green_house','shining_stars'],

  race:['take_the_ride','rush','gotta_keep_on_movin','action_strike','city_run'],boss:['epic_boss_battle','battle_ready','strength_of_the_titans'],candy:['funshine','going_bananas','llama_in_pajama','hippety_hop','improved_ice_cream_truck'],
  arcade:['blippy_trance','funky_energy_loop','circuit','bit_bit_loop'],storm:['cold_journey','mysterious_lights'],snow:['ice_and_snow','winter'],desert:['the_desert','jungle_mission'],
  castle:['black_knight','behind_the_sword','night_in_the_castle','honor_bound'],space:['space_ambience','mothership','neptunian_princess'],cozy:['bonfire','brewing_potions','forest_frolic_loop']};

let RT=null,rtBus=null,rtStyle=null,rtFail=0;const rtIdx={};const MB=()=>(window.MUSIC_BASE||'music/');

  strings:(m,t,d,v,dest)=>{for(const dt of[-6,0,7])tone({type:'sawtooth',f:mtof(m),detune:dt,t,d,v:v*.18,a:Math.min(.35,d*.3),r:.6,lp:1800,vib:2.5,vibRate:5,dest});},

  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;

    if(sec!=='intro'&&sec!=='break'||sec==='break'&&step%4===0){const ap=st.arpPat;let idx=null;if(ap==='up'&&step%2===0)idx=(step/2)%4;else if(ap==='down'&&step%2===0)idx=3-(step/2)%4;else if(ap==='wide'&&step%4===0)idx=[0,2,1,3][step/4];else if(ap==='bounce'&&[0,3,6,8,11,14].includes(step))idx=[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(step)];
      if(idx!=null)INS[st.arp](ch[idx]+12,T,spb*2,.3*(sec==='b'?1:.8),dest);}
    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}

function die(kind){if(P.dead)return;P.dead=true;deathT=0;save.games++;SND.music(null);
  if(kind==='car'){P.squash=true;SND.play('crash');SND.play('hit');feathers(14);buzz([40,30,60]);}else if(kind==='water'){SND.play('splash');splash();buzz(30);}else if(kind==='train'){SND.play('explosion');feathers(26);buzz([80,30,80]);}else if(kind==='eagle'){SND.play('whoosh');buzz(40);}
  $('ovT').textContent={car:'Squashed!',water:'Splash!',train:'Choo-choo… bonk!',eagle:'Too slow! 🦅',edge:'Swept away!'}[kind]||'Oops!';
  save.coins+=runCoins;const nb=score>save.best;if(nb)save.best=score;persist();$('ovS').innerHTML='Score '+score+(nb?' · 🏆 NEW BEST!':' · Best '+save.best)+'<br>🪙 +'+runCoins;setTimeout(()=>{state='over';$('over').hidden=false;SND.play(nb?'fanfare':'powerdown');refresh();},kind==='eagle'?1300:900);}
function feathers(n){const C=CH[save.char];for(let i=0;i<n;i++)parts.push({x:P.x+.5,r:P.r+.5,vx:(R()-.5)*5,vr:(R()-.2)*4,z:.4,vz:3+R()*4,l:1.2,col:i%3?C.b:'#fff',s:.12});}
function splash(){for(let i=0;i<18;i++)parts.push({x:P.x+.5,r:P.r+.5,vx:(R()-.5)*4,vr:(R()-.5)*2,z:0,vz:4+R()*5,l:.9,col:i%2?'#fff':'#a8e0ff',s:.1});}
function dust(){for(let i=0;i<4;i++)parts.push({x:P.x+.5,r:P.r+.3,vx:(R()-.5)*2,vr:(R()-.5),z:0,vz:1+R(),l:.4,col:'rgba(255,255,255,.7)',s:.08});}
/* update */
function update(dt){t+=dt;if(state!=='play'){camRow=lerp(camRow,P.r-3,dt*2);return;}
  // lanes
  for(let r=Math.floor(camRow)-2;r<camRow+20;r++){const L=lane(r);if(L.type==='road'||L.type==='river'&&L.objs.length){for(const o of L.objs){o.x+=L.dir*L.sp*dt;if(L.dir>0&&o.x>SPAN_R)o.x-=SPAN_R-SPAN_L+o.len;if(L.dir<0&&o.x+o.len<SPAN_L)o.x+=SPAN_R-SPAN_L+o.len;}}
    if(L.type==='rail'){if(!L.tr){L.next-=dt;if(L.next<1.6&&!L.warn){L.warn=1;if(Math.abs(r-P.r)<8)SND.play('ding');}if(L.next<=0){L.tr={x:L.dir>0?SPAN_L-14:SPAN_R,len:13};L.warn=1;if(Math.abs(r-P.r)<8)SND.tone({type:'sawtooth',f:330,d:.6,v:.06,lp:1200});}}else{L.tr.x+=L.dir*32*dt;if(L.tr.x>SPAN_R+2||L.tr.x+L.tr.len<SPAN_L-2){L.tr=null;L.warn=0;L.next=3+R()*6;}}}}
  // hop
  tryHop();if(P.hop<1){P.hop=Math.min(1,P.hop+dt/.12);P.x=lerp(P.fc,P.c,P.hop);if(P.hop>=1){P.x=P.c;dust();const L=lane(P.r);if(L.coins.has(P.c)){L.coins.delete(P.c);runCoins++;SND.play('coin');}}}
  const L=lane(P.r),landed=P.hop>=.6;
  if(!P.dead&&landed){const px0=P.x+.18,px1=P.x+.82;
    if(L.type==='road'){for(const o of L.objs)if(px1>o.x+.05&&px0<o.x+o.len-.05){die('car');break;}}
    if(L.type==='rail'&&L.tr&&px1>L.tr.x&&px0<L.tr.x+L.tr.len)die('train');
    if(L.type==='river'&&P.hop>=1){if(L.pads){if(!L.pads.has(Math.round(P.x)))die('water');}else{let on=null;for(const o of L.objs)if(P.x+.5>o.x&&P.x+.5<o.x+o.len){on=o;break;}if(!on)die('water');else{P.x+=L.dir*L.sp*dt;P.c=P.x;if(P.x<-.6||P.x>COLS-.4)die('edge');}}}}
  // camera & eagle
  const k=Math.min(1,maxRow/200);camRow+=dt*(.18+k*.35);camRow=Math.max(camRow,lerp(camRow,P.r-3.2,dt*3));
  if(!P.dead){idleT+=dt;if(P.r<camRow-.6||idleT>12){eagle={x:P.x,r:P.r+10,t:0};die('eagle');}}
  if(eagle){eagle.t+=dt;eagle.r=lerp(eagle.r,P.r,dt*5);if(eagle.t>.5)P.r=P.r;}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.r+=p.vr*dt;p.vz-=14*dt;p.z=Math.max(0,p.z+p.vz*dt);if(p.l<=0)parts.splice(i,1);}
  for(const r of[...lanes.keys()])if(r<camRow-6)lanes.delete(r);
  // ambient sound by lane
  let nearRoad=0,nearRiver=0;for(let r=P.r-1;r<=P.r+2;r++){const q=lanes.get(r);if(!q)continue;if(q.type==='road')nearRoad++;if(q.type==='river')nearRiver++;}SND.amb('river',nearRiver?.6:0);SND.amb('crowd',0);SND.amb('birds',.4);}
/* render */
const GR=['#8ad85a','#7fce50'];
function render(){ctx.fillStyle='#7fce50';ctx.fillRect(0,0,W,H);const ox=Math.round(W/2-COLS*TS/2),base=H-TS*2.4;const sy=r=>base-(r-camRow)*TS;
  const r0=Math.floor(camRow)-2,r1=Math.ceil(camRow+H/TS+2);
  // ground
  for(let r=r1;r>=r0;r--){const L=lane(r),y=sy(r);
    if(L.type==='grass'){ctx.fillStyle=GR[(r%2+2)%2];ctx.fillRect(0,y,W,TS);ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,y,ox,TS);ctx.fillRect(ox+COLS*TS,y,W,TS);for(const[fx,fk]of L.flowers){ctx.fillStyle=fk<.5?'#fff':'#ffd04a';ctx.fillRect(ox+fx*TS,y+fk*TS*.8,TS*.08,TS*.08);}}
    else if(L.type==='road'){ctx.fillStyle='#4a4e58';ctx.fillRect(0,y,W,TS);const nb=lane(r+1);if(nb.type==='road'){ctx.fillStyle='#e8e8e8';for(let x=-((t*0)%1);x<W/TS+1;x++)ctx.fillRect(x*TS+TS*.2,y-TS*.03,TS*.5,TS*.06);}else{ctx.fillStyle='#8a8e98';ctx.fillRect(0,y,W,TS*.06);}}
    else if(L.type==='river'){ctx.fillStyle='#3aa8e8';ctx.fillRect(0,y,W,TS);ctx.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<8;i++){const xx=((i*137+r*53+t*30*(L.dir||1))%(W+60)+W+60)%(W+60)-30;ctx.fillRect(xx,y+TS*(.2+((i*.37)%0.6)),TS*.4,TS*.05);}ctx.fillStyle='rgba(0,40,80,.25)';ctx.fillRect(0,y,W,TS*.12);}
    else if(L.type==='rail'){ctx.fillStyle='#9a8a6a';ctx.fillRect(0,y,W,TS);ctx.fillStyle='#6a4a2a';for(let x=0;x<W/TS*2+1;x++)ctx.fillRect(x*TS*.5,y+TS*.12,TS*.18,TS*.76);ctx.fillStyle='#c8ccd4';ctx.fillRect(0,y+TS*.25,W,TS*.07);ctx.fillRect(0,y+TS*.68,W,TS*.07);}}
  // objects far->near
  for(let r=r1;r>=r0;r--){const L=lane(r),y=sy(r);
    for(const c of L.coins){const bob=Math.sin(t*4+c)*TS*.05;ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(ox+(c+.5)*TS,y+TS*.6,TS*.18,TS*.08,0,0,7);ctx.fill();ctx.fillStyle='#ffd02a';ctx.beginPath();ctx.ellipse(ox+(c+.5)*TS,y+TS*.35+bob,TS*.18*Math.abs(Math.cos(t*3+c))+2,TS*.2,0,0,7);ctx.fill();ctx.fillStyle='#c08a10';ctx.fillRect(ox+(c+.5)*TS-1,y+TS*.28+bob,2,TS*.14);}
    if(L.type==='grass'){for(const[c,kd]of L.trees){const x=ox+c*TS;if(kd==='tree'){shadow(ctx,x+TS*.15,y+TS*.15,TS*.7,TS*.7);box(ctx,x+TS*.38,y+TS*.45,TS*.24,TS*.2,TS*.4,'#8a5a3a');box(ctx,x+TS*.12,y+TS*.1,TS*.76,TS*.7,TS*(.9+((c*7+r*3)%3)*.25),'#4ab040','#3a8a32');}else if(kd==='bush'){shadow(ctx,x+TS*.15,y+TS*.2,TS*.7,TS*.6);box(ctx,x+TS*.15,y+TS*.2,TS*.7,TS*.6,TS*.4,'#5ac04a','#3a9a32');}else{shadow(ctx,x+TS*.12,y+TS*.2,TS*.76,TS*.6);box(ctx,x+TS*.12,y+TS*.2,TS*.76,TS*.6,TS*.35,'#a8a8a8','#7a7a7a');}}
      if(r<0||true){for(const c of[-1,COLS]){const x=ox+c*TS;box(ctx,x+TS*.1,y+TS*.15,TS*.8,TS*.7,TS*.55,'#3a9a3a','#2a7a2a');}}}
    if(L.type==='river'){if(L.pads)for(const c of L.pads){ctx.fillStyle='#4ab83a';ctx.beginPath();ctx.ellipse(ox+(c+.5)*TS,y+TS*.5,TS*.4,TS*.32,0,0,7);ctx.fill();ctx.fillStyle='#3aa8e8';ctx.beginPath();ctx.moveTo(ox+(c+.5)*TS,y+TS*.5);ctx.lineTo(ox+(c+.9)*TS,y+TS*.4);ctx.lineTo(ox+(c+.9)*TS,y+TS*.6);ctx.fill();}
      for(const o of L.objs){const x=ox+o.x*TS;box(ctx,x,y+TS*.18,o.len*TS,TS*.64,TS*.18,'#9a6a3a','#6a4424');ctx.fillStyle='#c8945a';ctx.fillRect(x+TS*.1,y,o.len*TS-TS*.2,TS*.04);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(L.dir>0?x-4:x+o.len*TS,y+TS*.3,4,TS*.5);}}
    if(L.type==='road')for(const o of L.objs){const x=ox+o.x*TS,len=o.len*TS;shadow(ctx,x,y+TS*.18,len,TS*.62);if(o.truck){const cab=TS*.8,tx=L.dir>0?x+len-cab:x;box(ctx,L.dir>0?x:x+cab+2,y+TS*.12,len-cab-2,TS*.7,TS*.75,'#e8e8e8','#b8b8b8');box(ctx,tx,y+TS*.12,cab,TS*.7,TS*.55,o.col);ctx.fillStyle='#9ad8ff';ctx.fillRect(L.dir>0?tx+cab-TS*.22:tx+TS*.06,y+TS*.12-TS*.55+TS*.06,TS*.16,TS*.5);}
      else{box(ctx,x,y+TS*.15,len,TS*.66,TS*.32,o.col);const cw=len*.55,cx=x+(len-cw)/2+(L.dir>0?-len*.06:len*.06);box(ctx,cx,y+TS*.2,cw,TS*.5,TS*.6,'#bfe6ff','#8ab8d8');ctx.fillStyle=o.col;ctx.fillRect(cx+cw*.1,y+TS*.2-TS*.6,cw*.8,TS*.5);}
      ctx.fillStyle='#222';ctx.fillRect(x+len*.15,y+TS*.78,TS*.24,TS*.08);ctx.fillRect(x+len*.85-TS*.24,y+TS*.78,TS*.24,TS*.08);ctx.fillStyle='#ffe88a';ctx.fillRect(L.dir>0?x+len-3:x,y+TS*.62,3,TS*.1);}
    if(L.type==='rail'){const pole=ox-TS*.8,on=L.warn&&(t*6|0)%2;box(ctx,pole,y+TS*.05,TS*.12,TS*.1,TS*1.2,'#555');ctx.fillStyle=on?'#ff3a3a':'#5a2020';ctx.beginPath();ctx.arc(pole+TS*.06,y-TS*1.05,TS*.12,0,7);ctx.fill();if(on){ctx.fillStyle='rgba(255,60,60,.25)';ctx.beginPath();ctx.arc(pole+TS*.06,y-TS*1.05,TS*.35,0,7);ctx.fill();}
      if(L.tr){const x=ox+L.tr.x*TS,len=L.tr.len*TS;shadow(ctx,x,y+TS*.1,len,TS*.8);for(let i=0;i<4;i++){const cx=x+i*len/4+2;box(ctx,cx,y+TS*.08,len/4-4,TS*.8,TS*.95,i===(L.dir>0?3:0)?'#e8402a':'#3a6ad8',i===(L.dir>0?3:0)?'#b02a1a':'#2a4aa0');ctx.fillStyle='#bfe6ff';for(let w=0;w<3;w++)ctx.fillRect(cx+TS*.25+w*(len/4-TS*.3)/3,y+TS*.88-TS*.75,(len/4-TS*.6)/3,TS*.3);}}}

    if(Math.round(P.r)===r||(P.hop<1&&r===P.r)){const hp=P.hop<1?Math.sin(P.hop*Math.PI)*TS*.35:0;const fy=lerp(sy(P.fr),sy(P.r),P.hop);const L2=lane(P.r);const sink=P.dead&&L2.type==='river'&&!P.squash?1:0;
      if(!sink&&!(eagle&&eagle.t>.6))drawChar(ctx,save.char,ox+(P.x+.5)*TS,fy+TS*.5-hp,TS,P.face,P.squash);}}

  for(const p of parts){ctx.fillStyle=p.col;ctx.globalAlpha=clamp(p.l*2,0,1);ctx.fillRect(ox+p.x*TS,sy(p.r)-p.z*TS*.3,TS*p.s,TS*p.s);}ctx.globalAlpha=1;
  // eagle
  if(eagle){const ex=ox+(P.x+.5)*TS,ey=sy(eagle.r)+TS*.3;ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(ex,sy(P.r)+TS*.6,TS*1.2,TS*.4,0,0,7);ctx.fill();ctx.fillStyle='#6a4a2a';ctx.beginPath();ctx.moveTo(ex-TS*1.6,ey-TS*.4);ctx.lineTo(ex,ey-TS*.1);ctx.lineTo(ex+TS*1.6,ey-TS*.4);ctx.lineTo(ex+TS*.3,ey+TS*.4);ctx.lineTo(ex-TS*.3,ey+TS*.4);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(ex-TS*.2,ey-TS*.5,TS*.4,TS*.4);ctx.fillStyle='#ffb020';ctx.fillRect(ex-TS*.08,ey-TS*.15,TS*.16,TS*.15);}
  // edge vignette
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(.25,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
/* UI */
function refresh(){$('score').textContent=score;$('best').textContent='Best '+save.best;$('coins').textContent='🪙 '+(save.coins+(state==='play'?runCoins:0));}
function charCanvas(k,s=84){const c=document.createElement('canvas');c.width=c.height=s*2;const g=c.getContext('2d');g.scale(2,2);drawChar(g,k,s/2,s*.62,s*.8,0,false);return c;}
function openChars(){const s=$('sheet');s.innerHTML='<h3>🐾 Characters <button class="x">×</button></h3><div class="grid">'+Object.entries(CH).map(([k,C])=>'<div class="card'+(save.char===k?' sel':'')+'" data-k="'+k+'"><span data-cv="'+k+'"></span><div class="t">'+C.n+'</div>'+(save.own.includes(k)?(save.char===k?'<b>✔ Playing</b>':'<button class="btn s g" data-use="'+k+'">Use</button>'):C.prize?'<small>🎁 Prize only</small>':'<button class="btn s" data-buy="'+k+'" '+(save.coins<C.c?'disabled':'')+'>🪙 '+C.c+'</button>')+'</div>').join('')+'</div>';s.querySelectorAll('[data-cv]').forEach(e=>e.appendChild(charCanvas(e.dataset.cv)));s.hidden=false;}
$('sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;SND.play('click');if(b.classList.contains('x')){$('sheet').hidden=true;return;}const d=b.dataset;if(d.use){save.char=d.use;persist();openChars();}if(d.buy){const C=CH[d.buy];if(save.coins>=C.c){save.coins-=C.c;save.own.push(d.buy);save.char=d.buy;SND.play('buy');persist();refresh();}openChars();}});
function prize(){const cost=100;if(save.coins<cost){toast('The Prize Machine needs 🪙 100');SND.play('error');return;}save.coins-=cost;const ks=Object.keys(CH);const k=ks[(R()*ks.length)|0];const dup=save.own.includes(k);if(!dup)save.own.push(k);else save.coins+=40;persist();refresh();
  const pc=$('pc'),g=pc.getContext('2d');g.clearRect(0,0,200,200);drawChar(g,k,100,125,150,0,false);$('pn').textContent=dup?CH[k].n+' again! +🪙 40 back':'New friend: '+CH[k].n+'!';$('prize').hidden=false;SND.play(dup?'success':'rare');if(!dup){save.char=k;persist();}}
$('pOk').onclick=()=>{$('prize').hidden=true;SND.play('click');};

$('playB').onclick=start;$('againB').onclick=start;$('charB').onclick=$('charB2').onclick=()=>{SND.play('click');openChars();};$('giftB').onclick=$('giftB2').onclick=()=>{SND.play('click');prize();};
$('setB').onclick=()=>{const s=$('sheet');s.innerHTML='<h3>⚙️ Settings <button class="x">×</button></h3><div class="row"><button class="btn s b" id="tM">🎵 Music: '+(SND.get('music')?'on':'off')+'</button><button class="btn s b" id="tS">🔊 Sounds: '+(SND.get('sfx')?'on':'off')+'</button></div>';s.hidden=false;$('tM').onclick=()=>{SND.set('music',!SND.get('music'));$('setB').onclick();};$('tS').onclick=()=>{SND.set('sfx',!SND.get('sfx'));$('setB').onclick();};};
let last=performance.now(),uiT=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();uiT-=dt;if(uiT<=0){uiT=.1;refresh();}if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true;}}

refresh();requestAnimationFrame(loop);
})();
