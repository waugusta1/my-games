  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;

    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}

  for(const doc of snap.docs){const b=doc.data();if(!b||typeof b.k!=='string')continue;seen.add(b.k);const lt=+(lget('__t:'+b.k)||0),lv=lget(b.k);
    if(lv!==null&&lt>(b.t||0)){pending.set(b.k,lv);}else{has[b.k]=1;mem[b.k]=b.v;lset(b.k,b.v);lset('__t:'+b.k,String(b.t||Date.now()));}}
  if(ls){for(let i=0;i<ls.length;i++){const k=ls.key(i);if(!k||k.startsWith('__')||seen.has(k))continue;pending.set(k,lget(k));}}

/* ================= PHYSICS ================= */
function collideSeg(b,s){const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy;let u=((b.x-s.ax)*dx+(b.y-s.ay)*dy)/l2;u=clamp(u,0,1);const cx=s.ax+dx*u,cy=s.ay+dy*u;let nx=b.x-cx,ny=b.y-cy;const d=hyp(nx,ny);if(d>=BR||d===0)return false;nx/=d;ny/=d;
  if(s.oneway){const sn=[-dy,dx];const L=hyp(sn[0],sn[1]);const ox=sn[0]/L,oy=sn[1]/L;// normal facing up-left
    if(nx*ox+ny*oy<0)return false;}
  b.x=cx+nx*BR;b.y=cy+ny*BR;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;b.vx*=.995;b.vy*=.995;
    if(s.kick&&vn<-120){b.vx+=nx*720;b.vy+=ny*720;addScore(110,cx,cy);SND.play('flipper');SND.tone({type:'square',f:520,d:.05,v:.06,lp:2000});s.flash=.2;spark(cx,cy,'#ff5aa0');buzz(10);}
    else if(vn<-250&&!s.kick){if(R()<.5)SND.tone({type:'sine',f:180+R()*60,d:.04,v:.04});}}
  return true;}
function collideCircle(b,c){const dx=b.x-c.x,dy=b.y-c.y,d=hyp(dx,dy),r=c.r+BR;if(d>=r||d===0)return;const nx=dx/d,ny=dy/d;b.x=c.x+nx*r;b.y=c.y+ny*r;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+c.e)*vn*nx;b.vy-=(1+c.e)*vn*ny;}
  if(c.bump){b.vx+=nx*560;b.vy+=ny*560;c.flash=.25;G.bumps++;misHit('bump');addScore(1000,c.x,c.y-36);SND.play('bumper');SND.note('bell',[76,79,83][BUMP.indexOf(c.bump)]+(G.multiball?12:0),.3,.4);spark(c.x+nx*c.r,c.y+ny*c.r,c.bump.c);buzz(12);cons('lyra',G.bumps,30,'LYRA');}}
function collideFlipper(b,f){const ex=f.px+Math.cos(f.a)*f.len,ey=f.py+Math.sin(f.a)*f.len;const dx=ex-f.px,dy=ey-f.py,l2=dx*dx+dy*dy;let u=((b.x-f.px)*dx+(b.y-f.py)*dy)/l2;u=clamp(u,0,1);const cx=f.px+dx*u,cy=f.py+dy*u,rr=lerp(f.small?10:13,f.small?6:7,u);let nx=b.x-cx,ny=b.y-cy;const d=hyp(nx,ny);if(d>=BR+rr||d===0)return;nx/=d;ny/=d;b.x=cx+nx*(BR+rr);b.y=cy+ny*(BR+rr);
  const svx=-f.w*(cy-f.py),svy=f.w*(cx-f.px);let rx=b.vx-svx,ry=b.vy-svy;const vn=rx*nx+ry*ny;if(vn<0){rx-=(1+.35)*vn*nx;ry-=(1+.35)*vn*ny;b.vx=rx+svx;b.vy=ry+svy;if(Math.abs(f.w)>5&&-vn>400){SND.tone({type:'sine',f:140,f2:70,d:.06,v:.1});}}}
function step(dt){for(const f of FL){const target=f.on?f.up:f.rest;const sp=f.on?26:14;const prev=f.a;const dir=Math.sign(target-f.a);f.a+=dir*sp*dt;if((dir>0&&f.a>target)||(dir<0&&f.a<target))f.a=target;f.w=(f.a-prev)/dt;}
  for(const b of balls){if(b.held||b.ramp)continue;b.vy+=1500*dt;const sp=hyp(b.vx,b.vy);if(sp>2600){b.vx*=2600/sp;b.vy*=2600/sp;}b.x+=b.vx*dt;b.y+=b.vy*dt;
    for(const s of segs)collideSeg(b,s);for(const c of circles)collideCircle(b,c);for(const f of FL)collideFlipper(b,f);
    for(const d of DROPS)if(d.up&&b.x+BR>d.x-d.w/2&&b.x-BR<d.x+d.w/2&&b.y+BR>d.y&&b.y-BR<d.y+d.h){d.up=0;d.t=.3;b.vx=Math.abs(b.vx)*.8+120;b.x=d.x+d.w/2+BR+.5;G.drops++;misHit('drop');addScore(5000,d.x+30,d.y);SND.play('hit');SND.play('ding',72+DROPS.filter(q=>!q.up).length*4);spark(d.x,d.y+13,'#ffd23a');if(DROPS.every(q=>!q.up)){addScore(50000,120,520);cons('draco',1,1,'DRACO');setTimeout(()=>{DROPS.forEach(q=>q.up=1);SND.play('ratchet');},1500);}}
    // drop target backing for left of bank
    if(b.x<60+BR&&b.y>460&&b.y<600){b.x=60+BR;b.vx=Math.abs(b.vx)*.5;}
    // ball-ball
    for(const o of balls){if(o===b||o.held||o.ramp)continue;const dx=b.x-o.x,dy=b.y-o.y,d=hyp(dx,dy);if(d<BR*2&&d>0){const nx=dx/d,ny=dy/d,p=(BR*2-d)/2;b.x+=nx*p;b.y+=ny*p;o.x-=nx*p;o.y-=ny*p;const rv=(b.vx-o.vx)*nx+(b.vy-o.vy)*ny;if(rv<0){b.vx-=rv*nx;b.vy-=rv*ny;o.vx+=rv*nx;o.vy+=rv*ny;SND.play('ding',96);}}}

    if(b.y>150&&b.y<200&&b.vy<0)for(const L of LANES)if(Math.abs(b.x-L.x)<30&&!b['ln'+L.x]){b['ln'+L.x]=1;setTimeout(()=>b['ln'+L.x]=0,500);misHit('lane');if(b.fresh){b.fresh=0;if(LANES.indexOf(L)===G.skill){const v=100000*G.level;addScore(v/G.mult);dmd('SKILL SHOT!',fmt(v),2,'flash');SND.play('rare');ST('skill');checkAch();}}if(!L.lit){L.lit=1;addScore(2500,L.x,170);SND.play('ding',84);if(LANES.every(q=>q.lit)){addScore(25000,280,130);G.mult=Math.min(10,G.mult+1);dmd('MULTIPLIER','x'+G.mult,1.8,'flash');SND.play('levelup');cons('orion',1,1,'ORION');setTimeout(()=>LANES.forEach(q=>q.lit=0),800);}}else{addScore(500,L.x,170);SND.play('ding',72);}}
    if(b.y>RAMP.y-20&&b.y<RAMP.y+20&&b.x>RAMP.x0&&b.x<RAMP.x1&&b.vy<-200&&!b.lane){startRamp(b);}
    if(!b.ramp&&hyp(b.x-HOLE.x,b.y-HOLE.y)<HOLE.r&&hyp(b.vx,b.vy)<1500){captureHole(b);}
    if(b.lane&&b.x<540&&b.y<330)b.lane=0;if(b.fresh&&b.y>330&&!b.lane)b.fresh=0;
    // spinner-ish: orbit through top arc

function startRamp(b){b.ramp={u:0};addScore(25000,500,400);G.ramps++;misHit('ramp');SND.play('whoosh');SND.play('swish');
  if(G.multiball){const j=250000*G.level;addScore(j/G.mult);dmd('JACKPOT!',fmt(j),2,'flash');ST('jackpot');checkAch();SND.play('rare');buzz([40,30,80]);for(let i=0;i<30;i++)spark(rnd(100,500),rnd(200,800),['#ffd23a','#ff5aa0','#5ad8ff'][i%3]);}else cons('cygnus',G.ramps,3,'CYGNUS');}
function rampPos(u){const n=rampPath.length-1,f=u*n,i=Math.min(n-1,Math.floor(f)),k=f-i;const a=rampPath[i],b=rampPath[i+1];return[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];}

function startMultiball(){G.multiball=1;G.mis=null;ST('multiball');checkAch();dmd('SUPERNOVA','MULTIBALL!',2.6,'flash');SND.play('fanfare');SND.play('explosion',.5);SND.intensity(1.4);SND.music('boss');buzz([60,40,60,40,120]);for(let i=0;i<2;i++)setTimeout(()=>{balls.push({x:562,y:940,vx:0,vy:-2200-R()*300,lane:1,trail:[]});SND.play('whoosh');},400+i*700);G.saveT=-10;}

  ctx.drawImage(art,OX+sx,OY+sy,TW*S,TH*S);ctx.save();ctx.translate(OX+sx,OY+sy);ctx.scale(S,S);
  // lights
  const skB=G&&state==='play'&&balls.some(b=>b.fresh);for(const L of LANES){if(skB&&LANES.indexOf(L)===G.skill&&Math.floor(t*6)%2){ctx.fillStyle='#5affd0';ctx.shadowColor='#5affd0';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(L.x,172,11,0,TAU);ctx.fill();ctx.shadowBlur=0;continue;}ctx.fillStyle=L.lit?'#ffd23a':'rgba(255,210,58,.18)';ctx.shadowColor='#ffd23a';ctx.shadowBlur=L.lit?16:0;ctx.beginPath();ctx.arc(L.x,172,8,0,TAU);ctx.fill();}ctx.shadowBlur=0;
  ['S','T','R'].forEach((c,i)=>{ctx.fillStyle=LANES[i].lit?'#fff':'rgba(255,255,255,.3)';ctx.font='700 13px Fredoka,system-ui';ctx.textAlign='center';ctx.fillText(c,LANES[i].x,128);});
  const consL=[['orion',196,700],['draco',282,700],['lyra',368,700],['cygnus',282,740]];for(const[k,x,y]of consL){const on=G&&G.cons[k];ctx.fillStyle=on?'#7af0ff':'rgba(122,240,255,.15)';ctx.shadowColor='#7af0ff';ctx.shadowBlur=on?14:0;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?5:11;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=on?'#fff':'rgba(255,255,255,.35)';ctx.font='600 10px Fredoka,system-ui';ctx.fillText(k.toUpperCase(),x,y+24);}
  // ramp entrance glow
  const rl=G&&G.multiball?'#ffd23a':'#5aff9a';ctx.fillStyle=rl;ctx.globalAlpha=.4+Math.sin(t*6)*.3;ctx.beginPath();ctx.moveTo(500,RAMP.y-30);ctx.lineTo(515,RAMP.y-10);ctx.lineTo(485,RAMP.y-10);ctx.fill();ctx.globalAlpha=1;ctx.font='700 11px Fredoka,system-ui';ctx.fillStyle=rl;ctx.fillText(G&&G.multiball?'JACKPOT':'RAMP',500,RAMP.y+30);
  // hole
  const hg=ctx.createRadialGradient(HOLE.x,HOLE.y,2,HOLE.x,HOLE.y,HOLE.r+10);hg.addColorStop(0,'#000');hg.addColorStop(.6,'#1a0a3a');hg.addColorStop(1,HOLE.lit?'rgba(200,100,255,'+(.5+Math.sin(t*8)*.4)+')':'rgba(120,60,200,.3)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(HOLE.x,HOLE.y,HOLE.r+10,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(200,150,255,.5)';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(HOLE.x,HOLE.y,HOLE.r+4+i*6,t*2+i,t*2+i+2);ctx.stroke();}
  // bumpers
  for(const c of circles){if(c.bump){const b=c.bump,f=c.flash>0;ctx.fillStyle='#1a1a2a';ctx.beginPath();ctx.arc(c.x,c.y+4,c.r+4,0,TAU);ctx.fill();const g=ctx.createRadialGradient(c.x-8,c.y-8,2,c.x,c.y,c.r);g.addColorStop(0,'#fff');g.addColorStop(.3,f?'#fff':b.c);g.addColorStop(1,'#2a1a3a');ctx.fillStyle=g;ctx.shadowColor=b.c;ctx.shadowBlur=f?40:14;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,c.r*.6,0,TAU);ctx.stroke();ctx.fillStyle='#fff';ctx.font='700 14px Fredoka,system-ui';ctx.textAlign='center';ctx.fillText('★',c.x,c.y+5);}
    else if(c.post){ctx.fillStyle='#d0d8ff';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();}}
  // drops
  for(const d of DROPS){if(d.up){const g=ctx.createLinearGradient(d.x-d.w/2,0,d.x+d.w/2,0);g.addColorStop(0,'#ffe080');g.addColorStop(1,'#c08000');ctx.fillStyle=g;ctx.fillRect(d.x-d.w/2,d.y,d.w,d.h);ctx.fillStyle='#3a2a00';ctx.fillRect(d.x+1,d.y+10,4,6);}else{ctx.fillStyle='rgba(255,200,60,.2)';ctx.fillRect(d.x-d.w/2,d.y+d.h-4,d.w,4);}}
  // plunger
  const pl=G?G.plunger:0;ctx.fillStyle='#8a8a9a';ctx.fillRect(552,955+pl*40,20,50);ctx.fillStyle='#ff5a2a';ctx.fillRect(550,952+pl*40,24,8);
  // flippers
  for(const f of FL){ctx.save();ctx.translate(f.px,f.py);ctx.rotate(f.a);const L=f.len,r0=f.small?10:13,r1=f.small?6:7;ctx.fillStyle='#2a1a1a';ctx.beginPath();ctx.arc(0,3,r0+2,Math.PI/2,Math.PI*1.5);ctx.lineTo(L,3-r1-2);ctx.arc(L,3,r1+2,-Math.PI/2,Math.PI/2);ctx.closePath();ctx.fill();
    const g=ctx.createLinearGradient(0,-r0,0,r0);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#d8d8e8');g.addColorStop(1,'#8a8aa0');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r0,Math.PI/2,Math.PI*1.5);ctx.lineTo(L,-r1);ctx.arc(L,0,r1,-Math.PI/2,Math.PI/2);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff4a2a';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#ff4a2a';ctx.beginPath();ctx.arc(0,0,4,0,TAU);ctx.fill();ctx.restore();}
  // balls
  for(const b of balls){const[bx,by]=b.ramp?rampPos(b.ramp.u):[b.x,b.y];b.trail.push([bx,by]);if(b.trail.length>10)b.trail.shift();b.trail.forEach((p,i)=>{ctx.fillStyle='rgba(180,200,255,'+(i/10*.25)+')';ctx.beginPath();ctx.arc(p[0],p[1],BR*(i/10),0,TAU);ctx.fill();});
    const sc=b.ramp?1+Math.sin(b.ramp.u*Math.PI)*.35:1;ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(bx+4,by+5,BR*sc,BR*.8*sc,0,0,TAU);ctx.fill();
    const g=ctx.createRadialGradient(bx-4,by-5,1,bx,by,BR*sc);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#d0d4e0');g.addColorStop(.8,'#6a6e80');g.addColorStop(1,'#2a2e3a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,BR*sc,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,150,255,.25)';ctx.beginPath();ctx.ellipse(bx+3,by+5,5*sc,2*sc,.5,0,TAU);ctx.fill();}
  for(const s of sparks){ctx.fillStyle=s.col;ctx.globalAlpha=s.life*2.5;ctx.fillRect(s.x-2,s.y-2,4,4);}ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=clamp(p.life*1.5,0,1);ctx.font='700 16px Fredoka,system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;ctx.strokeText(p.txt,p.x,p.y);ctx.fillText(p.txt,p.x,p.y);}ctx.globalAlpha=1;
  if(G&&G.tilted){ctx.fillStyle='rgba(255,0,0,.12)';ctx.fillRect(0,0,TW,TH);}
  ctx.restore();
  renderDMD();drawDMD(dmdRect.x,dmdRect.y,dmdRect.w,dmdRect.h);
  if(side&&G){ctx.font='700 18px Fredoka,system-ui';ctx.fillStyle='#ffd23a';ctx.textAlign='left';let y=side.y+20;ctx.fillText('CONSTELLATIONS',side.x,y);y+=28;ctx.font='600 15px Fredoka,system-ui';
    for(const[k,txt]of[['orion','Orion: light S-T-R lanes'],['draco','Draco: drop all 4 targets'],['lyra','Lyra: 30 bumper hits ('+Math.min(30,G.bumps)+')'],['cygnus','Cygnus: 3 ramps ('+Math.min(3,G.ramps)+')']]){ctx.fillStyle=G.cons[k]?'#7af0ff':'rgba(255,255,255,.7)';ctx.fillText((G.cons[k]?'★ ':'☆ ')+txt,side.x,y,side.w);y+=24;}
    y+=14;ctx.fillStyle='#fff';ctx.fillText(HOLE.lit?'🌀 Black Hole LIT: shoot it for MULTIBALL!':'All 4 lights the Black Hole',side.x,y,side.w);y+=40;ctx.fillStyle='#ffd23a';ctx.fillText('HIGH SCORES',side.x,y);y+=24;ctx.fillStyle='#fff';(save.hs||[]).slice(0,5).forEach((h,i)=>{ctx.fillText((i+1)+'. '+fmt(h.s),side.x,y);y+=22;});}}

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;
  if(state==='play'){if(G.charging){G.plunger=Math.min(1,G.plunger+dt*1.4);}G.saveT+=dt;misTick(dt);const sub=10;for(let i=0;i<sub;i++)step(dt/sub);
    for(const b of balls){if(b.held){b.held-=dt;if(b.held<=0){b.held=0;b.vx=rnd(200,350);b.vy=rnd(300,450);SND.play('whoosh');SND.play('flipper');}}if(b.ramp){b.ramp.u+=dt/1.1;if(b.ramp.u>=1){const p=rampPos(1);b.x=p[0];b.y=p[1];b.vx=180;b.vy=380;b.ramp=null;}}}
    drainCheck();$('launch').hidden=!balls.some(b=>b.lane&&b.y>900);}
  for(const c of circles)if(c.flash>0)c.flash-=dt;for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.life<=0)sparks.splice(i,1);}for(let i=pops.length-1;i>=0;i--){pops[i].life-=dt;pops[i].y-=40*dt;if(pops[i].life<=0)pops.splice(i,1);}shake=Math.max(0,shake-dt*30);
  draw();requestAnimationFrame(frame);}

/* ================= MENU ================= */
function showMenu(paused){$('menu').hidden=false;['launch','nudge','menuB'].forEach(k=>$(k).hidden=true);if(!paused)SND.music('arcade');
  $('menu').innerHTML='<h1>STARFALL</h1><div style="font-weight:700;opacity:.8;letter-spacing:4px">P I N B A L L</div><div style="margin-top:18px">'+(paused?'<button class="btn" id="resume">Resume</button>':'')+'<button class="btn" id="play">'+(paused?'New game':'Play')+'</button></div>'+
    '<div class="hs"><div style="color:#ffd23a">🏆 High scores</div>'+(save.hs.length?save.hs.slice(0,8).map((h,i)=>'<div><span>'+(i+1)+'. '+h.d+'</span><b>'+fmt(h.s)+'</b></div>').join(''):'<div>No scores yet!</div>')+'</div>'+
    '<div class="hs"><div style="color:#5affd0">Trophies '+ACH.filter(a=>save.ach[a.id]).length+'/'+ACH.length+'</div>'+ACH.map(a=>'<div><span>'+(save.ach[a.id]?'★ ':'☆ ')+a.n+'</span><b style="font-weight:600;opacity:.7">'+a.d+'</b></div>').join('')+'</div>'+'<div><button class="btn s" id="tMus">🎵 Music: '+(SND.get('music')?'on':'off')+'</button><button class="btn s" id="tSfx">🔊 Sounds: '+(SND.get('sfx')?'on':'off')+'</button></div>'+
    '<div class="help">👈 Tap the left side for the left flipper, 👉 the right side for the right flippers.<br>🚀 Hold LAUNCH to pull the plunger, then let go.<br>⭐ Light all 4 constellations: S-T-R lanes (flippers move the lit lanes!), all 4 drop targets, 30 bumper hits and 3 ramp shots. Then shoot the 🌀 Black Hole for SUPERNOVA MULTIBALL. Hit the ramp in multiball for JACKPOTS!<br>🎯 SKILL SHOT: when a top lane blinks green, launch the ball into it.<br>⏱️ MISSIONS start during play: finish them before time runs out. The Black Hole sometimes gives a MYSTERY award.<br>📳 NUDGE shakes the table, but 3 nudges means TILT.</div>';
  const pb=$('play');pb.onclick=()=>{SND.play('click');LANES.forEach(l=>l.lit=0);DROPS.forEach(d=>d.up=1);HOLE.lit=0;newGame();};if(paused)$('resume').onclick=()=>{SND.play('click');state='play';$('menu').hidden=true;['launch','nudge','menuB'].forEach(k=>$(k).hidden=false);};
  $('tMus').onclick=()=>{SND.set('music',!SND.get('music'));showMenu(paused);};$('tSfx').onclick=()=>{SND.set('sfx',!SND.get('sfx'));showMenu(paused);};}
resize();showMenu();requestAnimationFrame(frame);
window.__pb={balls:()=>balls,G:()=>G,FL,start:()=>newGame(),launch:p=>{G.charging=1;G.plunger=p;release();},state:()=>state};
})();

});</script>
