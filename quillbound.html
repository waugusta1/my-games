/* ---------- run state ---------- */
let Q=null,ST='title';
function newRun(ink){Q={ch:0,step:0,hp:60,mhp:60,ward:0,relics:[],potions:['heal'],gold:0,ink:ink||0,alive:true,words:0,dmg:0,grid:[],gemRate:.06};Q.grid=[];for(let i=0;i<16;i++)Q.grid.push(newLetter());save.runs++;persist();nextFight();}
function packRun(){const o=Object.assign({},Q);delete o.F;delete o.sel;return JSON.parse(JSON.stringify(o));}
function hasR(k){return Q.relics.includes(k);}
function fightList(ch){const C=CHAPTERS[ch];return[...C.foes.slice(0,2),'rest',...C.foes.slice(2),pick(C.foes),'rest',C.boss];}
function nextFight(){const list=fightList(Q.ch);const k=list[Q.step];if(k==='rest'){restStop();return;}const f=FOES[k],sc=1+Q.ink*.15+(Q.step*.04);Q.F={k,f,hp:Math.round(f.hp*sc),mhp:Math.round(f.hp*sc),atk:Math.round(f.atk*(1+Q.ink*.12)),burn:0,stun:0,next:0,shake:0,hit:0,locks:0};Q.ward=hasR('ward')?8:0;Q.sel=[];Q.gemRate=hasR('gem')?.12:.06;
 for(const t of Q.grid){t.lock=0;t.poison=0;}ST='fight';closeOv();music(CHAPTERS[Q.ch].mus);if(f.boss)banner(f.n);persist();}
let BAN=null;function banner(t){BAN={t,life:2.4};}
/* scoring */
function curWord(){return Q.sel.map(i=>Q.grid[i].l).join('');}
function scoreWord(sel){let s=0;let gold=false;for(const i of sel){const t=Q.grid[i];let v=tileVal(t);if(hasR('vowel')&&VOW.includes(t.l))v+=1;if(hasR('lens')&&v>=4)v+=2;s+=v;if(t.gem==='gold')gold=true;}
 const n=sel.reduce((a,i)=>a+Q.grid[i].l.length,0);const mult=n<=3?1:n===4?1.25:n===5?1.6:n===6?2:n===7?2.6:n===8?3.3:4.2;let d=s*mult;if(n>=6&&hasR('long'))d*=1.3;if(n>=8&&hasR('crown'))d*=2;if(gold)d*=2;return Math.round(d);}
function submit(){const w=curWord();if(w.length<3){SFX.bad();say('Words need 3 letters or more');return;}if(!DICT.has(w)){SFX.bad();say('"'+w.toUpperCase()+'" is not in the book');Q.shakeW=1;return;}
 if(Q.sel.some(i=>Q.grid[i].poison)){}
 const F=Q.F;let d=scoreWord(Q.sel);if(F.f.armor&&w.length<=4)d=Math.max(1,d-F.f.armor*2);if(F.f.tric==='steal'&&F.k==='sphinx'&&w.length<5)d=Math.round(d*.5);
 const gems=Q.sel.map(i=>Q.grid[i].gem).filter(Boolean);const poisoned=Q.sel.filter(i=>Q.grid[i].poison).length;
 F.hp-=d;F.hit=1;F.shake=8;SFX.word(w.length);setTimeout(SFX.hit,200);Q.dmg+=d;Q.words++;save.words[w]=(save.words[w]||0)+1;if(w.length>save.longest.length)save.longest=w;if(d>save.bigHit)save.bigHit=d;if(w.length>=9)__mgt('m','long9');
 floats.push({x:850,y:250,t:'-'+d,col:'#b8322a',big:1,life:1.3});floats.push({x:590,y:440,t:w.toUpperCase(),col:'#1b2a4a',life:1.1,word:1});
 for(const gm of gems){if(gm==='red'){F.burn+=hasR('ink')?6:3;floats.push({x:850,y:200,t:'Burning',col:'#d8362a',life:1.2});}if(gm==='green')heal(4);if(gm==='blue'){Q.ward+=5;floats.push({x:330,y:250,t:'+5 ward',col:'#2a5ad8',life:1.2});}if(gm==='purple'){F.stun=1;floats.push({x:850,y:200,t:'Stunned',col:'#8a3ab8',life:1.2});}}
 if(poisoned){hurt(poisoned*2,'poison');}
 // replace the used tiles; long words leave a gem behind
 const n=w.length;const gemSlot=n>=6?Q.sel[Q.sel.length-1]:-1;for(const i of Q.sel){Q.grid[i]=newLetter();Q.grid[i].pop=1;}if(gemSlot>=0)Q.grid[gemSlot].gem=n>=8?'gold':pick(['red','green','blue','purple']);Q.sel=[];
 if(F.hp<=0){F.hp=0;win();return;}enemyTurn();}
function enemyTurn(){const F=Q.F;busy=true;setTimeout(()=>{busy=false;if(!Q||Q.F!==F||!Q.alive)return;if(F.burn>0){const b=Math.ceil(F.burn/1);F.hp-=2;floats.push({x:850,y:280,t:'-2 burn',col:'#d8362a',life:1});F.burn--;if(F.hp<=0){F.hp=0;win();return;}}
 if(F.stun>0){F.stun--;floats.push({x:850,y:200,t:'Stunned!',col:'#8a3ab8',life:1});return;}
 F.lunge=1;let d=F.atk+((R()*3)|0);if(F.f.boss&&R()<.3)d=Math.round(d*1.4);hurt(d,F.f.n);
 const tr=F.f.tric;if(tr&&R()<.45){const free=Q.grid.map((t,i)=>i).filter(i=>!Q.grid[i].lock);const i=pick(free);if(tr==='lock'){Q.grid[i].lock=2;say(F.f.n+' blots a letter');}else if(tr==='poison'){Q.grid[i].poison=1;say(F.f.n+' curses a letter');}else if(tr==='steal'){let bi=free[0];for(const j of free)if(tileVal(Q.grid[j])>tileVal(Q.grid[bi]))bi=j;Q.grid[bi]=newLetter();Q.grid[bi].pop=1;say(F.f.n+' steals your best letter');}}
 for(const t of Q.grid)if(t.lock>0&&R()<.5)t.lock--;},650);}
function hurt(d,src){const ab=Math.min(Q.ward,d);Q.ward-=ab;d-=ab;Q.hp-=d;Q.hurtFx=1;SFX.hurt();floats.push({x:330,y:260,t:d?'-'+d:'Blocked',col:d?'#b8322a':'#2a5ad8',big:1,life:1.2});if(Q.hp<=0){Q.hp=0;lose(src);}}
function heal(n){const b=Q.hp;Q.hp=Math.min(Q.mhp,Q.hp+n);if(Q.hp>b)floats.push({x:330,y:230,t:'+'+(Q.hp-b),col:'#2a9a4a',life:1.2});}
let floats=[],busy=false;
function scramble(){if(busy)return;for(let i=0;i<16;i++){if(!Q.grid[i].lock){const g0=Q.grid[i].gem;Q.grid[i]=newLetter();if(g0&&R()<.5)Q.grid[i].gem=g0;Q.grid[i].pop=1;}}Q.sel=[];SFX.scratch();if(!hasR('thesaurus'))enemyTurn();}
function usePotion(i){const p=Q.potions[i];if(!p||busy)return;Q.potions.splice(i,1);if(p==='heal')heal(25);else if(p==='ward'){Q.ward+=15;}else if(p==='fire'){Q.F.burn+=6;}SFX.word(3);}
