 if(s.com&&q<s.com.req){toast(`${FROSTER.D[c.who].n}: "Only ${Math.round(q*100)}%? That won't do. Again!"`,2600);sfx('grumble');c.anim=-1;renderTickets();return;}
 const tip=c.pat/c.max>0.5,master=q>=0.9;let pay=s.com?Math.round(s.com.pay*(0.6+q*0.6)):Math.round(it.v*mt.m*(0.4+0.9*q)*(tip?1.15:1)*(master?1.25:1));pay=Math.round(pay*(1+0.1*U('sign')));

let last=performance.now();

function tick(dt){G.t+=dt;const cfg=G.cfg;
 if(G.t<cfg.len&&G.spawned<cfg.n+(cfg.com?1:0)){G.next-=dt;const waiting=G.cust.filter(o=>o.state!=='leave').length;if(G.next<=0&&waiting<3){spawn();G.next=(cfg.len-10)/(cfg.n+1)*(0.75+Math.random()*0.5);}}
 // customers

 // slide

 G.cust.forEach(o=>{if(o.state==='leave'){o.x+=dt*40;}});
 const before=G.cust.length;G.cust=G.cust.filter(o=>!(o.state==='leave'&&o.x>128));if(G.cust.length!==before)renderTickets();
 // forge
 const rate=0.085*(1+0.15*U('bel'))*(G.bellows?2.2:1);
 G.slots.forEach((s,i)=>{if(!s)return;s.heat+=rate*METALS[s.metal].heat*dt;if(s.heat>=1)burn(i);});
 G.rack.forEach(s=>{s.heat=Math.max(0,s.heat-(U('rack')?0.016:0.03)*dt);});
 // anvil
 if(!G.anvil&&G.rack.length)toAnvil(G.rack.shift());
 const a=G.anvil;if(a){if(a.done!=null){a.done-=dt;if(a.done<=0){G.anvil=null;startQuench(a);}}
  else if(a.phase==='gap'){a.pt+=dt;if(a.pt>0.3){a.phase='ring';a.pt=0;const P=RS[a.item],i=a.hits.length,f=(i+0.5)/a.k;const sx=lerp(-0.7,0.7,f)+(Math.random()-0.5)*0.15;a.cur={u:sx,v:(Math.random()-0.5)*0.15};a.cur.x=0;a.cur.y=0;}}
  else if(a.phase==='ring'){a.pt+=dt;if(ringR(a)<0.3)nextStrike(a,0.15,'Miss','#f88');}}
 // quench

 G.hammerPose=Math.max(0,G.hammerPose-dt);
 // end
 if(G.t>=cfg.len&&!G.closing){G.closing=1;toast('Closing time! Finish your last orders',1800);sfx('bell');}
 if(G.closing&&!G.ended){const busy=G.cust.some(o=>o.state==='wait')||G.anvil||G.quench;if(!busy||G.t>cfg.len+75){endDay();return;}}
 updateLedgerLite();updateTicketBars();}

 T.querySelectorAll('.tk').forEach(b=>b.onclick=()=>{const c=G.cust.find(o=>o.id===+b.dataset.c);if(c)startJob(c);});}
function updateTicketBars(){G.cust.forEach(o=>{const e=document.querySelector(`[data-p="${o.id}"]`);if(e)e.style.width=clamp(o.pat/o.max*100,0,100)+'%';});}
for(let i=0;i<3;i++)$('zForge'+i).onclick=()=>{if(!G||G.paused)return;if(i>=slotCount()){toast('Buy the Wider Hearth at the smithy');return;}if(G.slots[i])pull(i);else{const c=G.cust.find(o=>o.state==='wait'&&!findJob(o.id));if(c)startJob(c);else toast('No orders waiting');}};
$('zAnvil').onpointerdown=e=>{if(!G||G.paused)return;e.preventDefault();strike();};
$('zQuench').onpointerdown=e=>{if(!G||G.paused)return;e.preventDefault();quenchTap();};
const BEL=$('bellows');BEL.innerHTML=ic('bellows')+' Bellows';
BEL.onpointerdown=e=>{if(!G)return;e.preventDefault();G.bellows=true;BEL.classList.add('on');bellowsSound(true);try{BEL.setPointerCapture(e.pointerId);}catch(_){}};
const belOff=()=>{if(G)G.bellows=false;BEL.classList.remove('on');bellowsSound(false);};BEL.onpointerup=belOff;BEL.onpointercancel=belOff;BEL.onlostpointercapture=belOff;
$('pauseB').innerHTML=ic('pause');$('pauseB').onclick=()=>{sfx('btn');openPause();};

/* ---------- overlays ---------- */
const UI=$('ui'),PZ=$('pz');let TGT=UI;
function show(html,onx){const T=TGT;T.innerHTML=html;T.hidden=false;T.scrollTop=0;const x=T.querySelector('[data-x]');if(x)x.onclick=()=>{sfx('btn');onx&&onx();};}
function hideUI(){UI.hidden=true;UI.innerHTML='';}
const closeBtn=()=>`<button class="close" data-x="1" aria-label="Close">${ic('close')}</button>`;
function bind(id,fn){const e=TGT.querySelector('#'+id);if(e)e.onclick=()=>{sfx('btn');fn();};}
function toast(t,ms){const e=$('toast');e.innerHTML=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms||1500);}
function coach(t,x,y){const c=$('coach');c.innerHTML=t;c.hidden=false;c.style.left=SX(x)+'px';c.style.top=SY(y)+'px';}
function hideCoach(){$('coach').hidden=true;}
function stars(n){return[0,1,2].map(i=>ic(i<n?'star':'star0')).join('');}
function title(){G=null;setMode('title');hideUI();const nd=Math.min(40,save.day),tot=Object.values(save.stars).reduce((a,b)=>a+b,0);
 $('title').innerHTML=`<div><h1 class="logo">Forgewright</h1><div class="sub">Forty days at the anvil. One king's blade.</div><div class="menu">
 <button class="bbtn" id="tP">${ic('hammer')}<span class="col">${save.stars[1]?'Open the shop':'Light the forge'}<small>Day ${nd} · ${CHAP[Math.floor((nd-1)/10)]}</small></span></button>
 <button class="bbtn wood" id="tC">${ic('cal')}<span class="col">Calendar<small>${tot} of 120 stars</small></span></button>
 <button class="bbtn wood" id="tS">${ic('coin')}<span class="col">The smithy<small>${save.coins} coins to spend</small></span></button>
 <button class="bbtn wood" id="tR">${ic('book')}<span class="col">Ledger<small>Records and masterworks</small></span></button>
 <button class="bbtn wood" id="tH">${ic('help')}<span class="col">How to play<small>Heat, hammer, quench</small></span></button>
 <button class="bbtn wood" id="tG">${ic('home')}<span class="col">Go back to games<small>Return to the hub</small></span></button></div></div>`;
 const T=$('title');const b=(id,fn)=>{T.querySelector('#'+id).onclick=()=>{sfx('btn');fn();};};
 b('tP',()=>dayIntro(nd,title));b('tC',calendar);b('tS',()=>smithy(title));b('tR',records);b('tH',()=>how(title));b('tG',leave);}
function leave(){persist();location.href='index.html';}
function menuMode(){setMode('menu');}
function calendar(){menuMode();let h='';for(let c=0;c<4;c++){h+=`<div class="chap">${CHAP[c]}</div>`;for(let d=c*10+1;d<=c*10+10;d++){const s=save.stars[d]||0;h+=`<button data-d="${d}" ${d>save.day?'disabled':''} class="${d===Math.min(40,save.day)?'cur':''}">${d}${COMS[d]?'<small>COMMISSION</small>':''}<span class="s">${stars(s)}</span></button>`;}}
 show(`<div class="sheet paper">${closeBtn()}<h2>Calendar</h2><p class="hint">Replay any day you have reached to earn more stars and coins.</p><div class="cal">${h}</div><div class="bar2"><button class="bbtn wood" id="cB">${ic('back')} Back</button></div></div>`,title);
 TGT.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{sfx('btn');dayIntro(+b.dataset.d,calendar);});bind('cB',title);}
function dayIntro(d,back){menuMode();const c=dayCfg(d);const com=c.com;
 show(`<div class="sheet paper" style="text-align:center">${closeBtn()}<h2>Day ${d}</h2><p class="hint">${CHAP[c.c]} · open for ${Math.round(c.len)} seconds · about ${c.n} customers</p>
 <div class="pick">${c.newItem&&d>1?`<div class="newcard paper"><b>New order</b>${itemSVG(c.newItem,'iron')}<div>${ITEMS[c.newItem].n} · ${ITEMS[c.newItem].k} strikes</div></div>`:''}${c.newMetal?`<div class="newcard paper"><b>New metal</b>${itemSVG('ingot',c.newMetal)}<div>${METALS[c.newMetal].n}: ${c.newMetal==='bronze'?'heats fast, narrow window':c.newMetal==='steel'?'heats slow, worth more':c.newMetal==='silver'?'heats very fast, tight window':'slow, tight, priceless'}</div></div>`:''}
 ${com?`<div class="newcard paper" style="width:44rem"><b>Commission: ${com.n}</b>${itemSVG(com.item,com.metal)}<div class="hint">${com.t} ${com.k} strikes. Deliver it to pass the day.</div></div>`:''}</div>
 <p style="font:700 2.2rem var(--serif)">Goal: ${ic('coin')} ${c.target}</p><p class="hint">${stars(1)} ${c.target} · ${stars(2)} ${Math.round(c.target*1.4)} · ${stars(3)} ${Math.round(c.target*1.9)}${save.stars[d]?` · best so far ${save.stars[d]}★`:''}</p>
 <div class="bar2"><button class="bbtn wood" id="iB">${ic('back')} Back</button><button class="bbtn" id="iGo">${ic('flame')} Open the shop</button></div></div>`,back);
 bind('iB',back);bind('iGo',()=>startDay(d));}
function endDay(){G.ended=1;$("toast").classList.remove("on");G.cust.forEach(o=>o.state==='wait'&&0);const c=G.cfg,co=G.coins;let st=co>=c.target*1.9?3:co>=c.target*1.4?2:co>=c.target?1:0;if(!G.comDone)st=0;
 const d=G.d,prev=save.stars[d]||0;save.coins+=co;save.earned+=co;save.served+=G.served;save.angry+=G.angry;
 if(st>0){try{window.__mgt&&__mgt('w','Day '+d);}catch(e){}if(st===3&&prev<3){try{window.__mgt&&__mgt('m','star3');}catch(e){}}save.stars[d]=Math.max(prev,st);if(d>=save.day)save.day=Math.min(41,d+1);sfx('win');}
 else{try{window.__mgt&&__mgt('l','Day '+d);}catch(e){}sfx('fail');}
 persist();const g=G;G.paused=true;menuMode();
 const king=d===40&&st>0;
 show(`<div class="sheet paper" style="text-align:center"><h2>${king?'The King\'s Blade':st?'Closing time':'A rough day'}</h2>${king?'<p>King Aldric lifts the blade to the light. You are named Forgewright of the Crown. Every day stays open to replay for stars.</p>':''}
 <div class="stars">${stars(st)}</div><p style="font:700 2.6rem var(--serif)">${ic('coin')} ${co} <span class="hint">of ${c.target} goal</span></p>
 <div class="stats"><span class="tag">${g.served} SERVED</span><span class="tag">${g.masters} MASTERWORKS</span><span class="tag">${g.angry} WALKED OUT</span><span class="tag">${g.burnt} BURNT</span></div>
 ${!g.comDone?'<p class="hint">The commission was not delivered, so the day does not count.</p>':st?'':'<p class="hint">Reach the goal to unlock the next day. Upgrades at the smithy help.</p>'}
 <div class="bar2"><button class="bbtn wood" id="eT">${ic('back')} Title</button><button class="bbtn wood" id="eS">${ic('coin')} Smithy</button>${st&&d<40?`<button class="bbtn" id="eN">${ic('flame')} Day ${d+1}</button>`:`<button class="bbtn" id="eR">${ic('hammer')} Try again</button>`}</div></div>`,title);
 bind('eT',title);bind('eS',()=>smithy(title));bind('eN',()=>dayIntro(d+1,title));bind('eR',()=>dayIntro(d,title));G=null;}
function smithy(back){menuMode();show(`<div class="sheet paper">${closeBtn()}<h2>The smithy</h2><p>${ic('coin')} <b style="font-size:2.4rem">${save.coins}</b> coins · everything you earn each day lands here.</p>
 ${UPG.map(u=>{const lv=U(u.id),max=u.c.length,cost=u.c[lv];return`<div class="uprow"><div class="d"><b>${u.n}</b><div class="hint">${u.t}</div><div class="pips">${u.c.map((_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div>${lv>=max?'<span class="tag">DONE</span>':`<button class="bbtn" data-u="${u.id}" ${save.coins>=cost?'':'disabled'}>${ic('coin')} ${cost}</button>`}</div>`;}).join('')}
 <div class="bar2"><button class="bbtn wood" id="sB">${ic('back')} Back</button></div></div>`,back);
 TGT.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=UPG.find(q=>q.id===b.dataset.u),lv=U(u.id),c=u.c[lv];if(save.coins<c)return;save.coins-=c;save.up[u.id]=lv+1;persist();sfx('coin');smithy(back);});bind('sB',back);}
function records(){menuMode();const days=Object.keys(save.stars).length,st=Object.values(save.stars).reduce((a,b)=>a+b,0),three=Object.values(save.stars).filter(v=>v>=3).length;
 show(`<div class="sheet paper">${closeBtn()}<h2>The ledger</h2><div class="stats"><span class="tag">${days}/40 DAYS</span><span class="tag">${st}/120 STARS</span><span class="tag">${three} PERFECT DAYS</span><span class="tag">${save.served} SERVED</span><span class="tag">${save.master} MASTERWORKS</span><span class="tag">${save.earned} COINS EARNED</span><span class="tag">${save.angry} WALKED OUT</span></div>
 <h3>Pieces forged</h3><div class="gal">${Object.keys(ITEMS).map(k=>`<div class="g${save.made[k]?'':' un'}">${itemSVG(k,save.made[k]?'steel':'iron')}<div>${save.made[k]?ITEMS[k].n+' × '+save.made[k]:'Not yet'}</div></div>`).join('')}</div>
 <h3>Commissions</h3><div class="stats">${[10,20,30,40].map(d=>`<span class="tag">${COMS[d].n}: ${save.stars[d]?'delivered':'waiting'}</span>`).join('')}</div>
 <div class="bar2"><button class="bbtn wood" id="rB">${ic('back')} Back</button></div></div>`,title);bind('rB',title);}
function how(back){show(`<div class="sheet paper">${closeBtn()}<h2>How to play</h2>
 <p><b>1. Heat.</b> Customers pin order tickets at the top. Tap a ticket to put a bar in the forge. Watch the gauge under it and tap the bar when the marker is in the <b>gold</b> zone. Hold <b>Bellows</b> to heat faster. Past the red end, the bar burns.</p>
 <p><b>2. Hammer.</b> The bar goes to the anvil. Tap the work plate when the shrinking white ring meets the gold circle. Perfect strikes make better pieces. If the anvil is busy, bars wait on the rack and slowly cool.</p>
 <p><b>3. Quench.</b> Tap the barrel when the needle is in the green. The finished piece goes straight to its customer.</p>
 <p>Quality pays: fast service earns tips, 90%+ is a <b>Masterwork</b>. Earn the day's goal to unlock the next day. Commissions on days 10, 20, 30 and 40 must be delivered. Spend coins at the smithy on upgrades.</p>
 <div class="bar2"><button class="bbtn wood" id="hB">${ic('back')} Back</button></div></div>`,back);bind('hB',back);}
function closePause(){PZ.hidden=true;PZ.innerHTML='';TGT=UI;if(G)G.paused=false;}
function openPause(){if(G){G.paused=true;belOff();}TGT=PZ;
 show(`<div class="sheet paper" style="width:min(56rem,92vw);text-align:center">${closeBtn()}<h2>Paused</h2><p class="hint">${G?`Day ${G.d} · ${G.coins} of ${G.cfg.target} coins`:''}</p><div class="menu" style="margin:2rem auto">
 <button class="bbtn" id="pR">${ic('back')} Resume</button><button class="bbtn wood" id="pH">${ic('help')} How to play</button>
 <button class="bbtn wood" id="pS">${ic(save.snd?'sound':'mute')} Sound: ${save.snd?'On':'Off'}</button><button class="bbtn wood" id="pM">${ic(save.mus?'sound':'mute')} Music: ${save.mus?'On':'Off'}</button>
 ${G?`<button class="bbtn wood" id="pQ">${ic('cal')} Leave this day</button>`:''}<button class="bbtn wood" id="pG">${ic('home')} Go back to games</button></div></div>`,closePause);
 bind('pR',closePause);bind('pH',()=>how(openPause));bind('pS',()=>{save.snd=save.snd?0:1;setVol();persist();openPause();});bind('pM',()=>{save.mus=save.mus?0:1;setVol();persist();openPause();});
 bind('pQ',()=>{closePause();title();});bind('pG',leave);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();if(G&&mode==='play'&&!G.paused)openPause();}});
addEventListener('pagehide',persist);

resize();requestAnimationFrame(loop);title();
window.__fw={G:()=>G,save:()=>save,strike,quenchTap,pull,persist,ringR,needle,slotCount,findJob};
})();

</script>
</body></html>
