const ksCache={};

let song=null,want={song:null,amb:{}},seqTimer=null;
function seeded(n){let a=n>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function scaleNote(st,i){const sc=SC[st.sc],n=sc.length;return st.root+sc[((i%n)+n)%n]+12*Math.floor(i/n);}
function makeMotif(g,len){const m=[];for(let i=0;i<len;i++){m.push(g()<.25?null:{d:Math.floor(g()*5)-2,l:g()<.3?2:1});}return m;}
function startSong(name){const st=STY[name];if(!st)return;if(song&&song.name===name)return;const g=seeded(name.length*977+(Date.now()/86400000|0));
  const old=song;const bus=ac.createGain();bus.gain.value=0;bus.connect(musicBus);bus.gain.linearRampToValueAtTime(1,now()+2.5);
  if(old){old.bus.gain.cancelScheduledValues(now());old.bus.gain.setValueAtTime(old.bus.gain.value,now());old.bus.gain.linearRampToValueAtTime(0,now()+2);setTimeout(()=>{try{old.bus.disconnect();}catch(_){}},2600);}
  song={name,st,bus,step:0,next:now()+.15,bar:0,g,motifs:[makeMotif(g,8),makeMotif(g,8),makeMotif(g,8)],prog:st.prog[0],section:0,intensity:1};
  if(!seqTimer)seqTimer=setInterval(schedule,40);}
function stopSong(){if(!song)return;const s=song;song=null;s.bus.gain.cancelScheduledValues(now());s.bus.gain.setValueAtTime(s.bus.gain.value,now());s.bus.gain.linearRampToValueAtTime(0,now()+1.5);setTimeout(()=>{try{s.bus.disconnect();}catch(_){}},1800);}
const SECTIONS=['intro','a','a','b','a','b','break','b'];
function schedule(){if(!song||!ac)return;const s=song,st=s.st,spb=60/st.bpm/4;
  while(s.next<now()+.25){const step=s.step%16,bar=Math.floor(s.step/16),t=s.next-now(),sec=SECTIONS[Math.floor(bar/4)%SECTIONS.length],dest=s.bus,I=s.intensity;
    if(step===0&&bar%4===0){s.prog=st.prog[Math.floor(s.g()*st.prog.length)];if(bar%16===0&&bar>0){s.motifs[Math.floor(s.g()*3)]=makeMotif(s.g,8);}}
    const deg=s.prog[bar%4],ch=chordNotes(st,deg),sw=(step%2)?st.swing*spb:0,T=t+sw;
    if(step===0)ch.slice(0,3).forEach(n=>INS[st.pad](n,T,spb*16,sec==='intro'?.5:.42,dest));
    if(sec!=='intro'){const bp=st.bass==='synthbass'?[0,3,6,8,10,14]:[0,6,8];if(bp.includes(step))INS[st.bass](ch[0]-24+(step===8&&s.g()<.3?7:0),T,spb*(step===0?5:2.5),.55,dest);}
    if(sec!=='intro'&&sec!=='break'||sec==='break'&&step%4===0){const ap=st.arpPat;let idx=null;if(ap==='up'&&step%2===0)idx=(step/2)%4;else if(ap==='down'&&step%2===0)idx=3-(step/2)%4;else if(ap==='wide'&&step%4===0)idx=[0,2,1,3][step/4];else if(ap==='bounce'&&[0,3,6,8,11,14].includes(step))idx=[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(step)];
      if(idx!=null)INS[st.arp](ch[idx]+12,T,spb*2,.3*(sec==='b'?1:.8),dest);}
    if((sec==='a'||sec==='b')&&step%2===0){const mo=s.motifs[(sec==='b'?1:0)+(bar%4===3?1:0)],e=mo[step/2];if(e&&s.g()<st.mel+.3){const base=SC[st.sc].length*1+(deg%SC[st.sc].length);const n=scaleNote(st,base+e.d+(bar%2?2:0)+(sec==='b'?2:0));INS[st.lead](n,T,spb*2*e.l,.32,dest);}}
    const D=DRUMS[st.drum];if(D&&sec!=='intro'){const k=s.step%32;const ki=D.kick[k]==='x',sn=D.snare&&D.snare[k]==='x',ht=D.hat&&D.hat[k]==='x';const lvl=(sec==='break'?.5:1)*I;
      if(ki&&sec!=='break')DR[D.k](T,.8*lvl,dest);if(sn)DR[D.s||'snare'](T,.6*lvl,dest);if(ht)DR[D.h||'hat'](T,(.5+(k%4===2?.3:0))*lvl,dest);if(k===0&&bar%8===0&&sec==='b'&&st.drum!=='soft'&&st.drum!=='lofi')DR.crash(T,.5,dest);}
    s.step++;s.next+=spb;}}

const MAXHP=()=>3+lvl('hearts'),MAXMP=()=>2+lvl('magic'),DMG=()=>1+lvl('sword')*.5;

/* ================= TILE ART ================= */
const tileCache={};
function tileArt(world,kind,top){const k=world+kind+top;if(tileCache[k])return tileCache[k];const c=document.createElement('canvas');c.width=c.height=TS;const g=c.getContext('2d'),r=seeded(world*31+kind.charCodeAt(0)+(top?7:0));const G=WORLDS[world].ground;
  if(kind==='#'){
    if(G==='grass'){g.fillStyle='#7a4a2a';g.fillRect(0,0,TS,TS);for(let i=0;i<14;i++){g.fillStyle=r()<.5?'#6a3e22':'#8a5a36';g.beginPath();g.ellipse(r()*TS,r()*TS,2+r()*3,1.5+r()*2,0,0,TAU);g.fill();}if(r()<.4){g.fillStyle='#9a9088';g.beginPath();g.ellipse(r()*TS,10+r()*20,4,3,0,0,TAU);g.fill();}
      if(top){g.fillStyle='#4aa83a';g.fillRect(0,0,TS,9);g.fillStyle='#6ac84a';g.fillRect(0,0,TS,4);for(let x=0;x<TS;x+=3){g.fillStyle=r()<.5?'#3a9830':'#7ad85a';g.fillRect(x,9,2,2+r()*4);g.fillRect(x,-1,1.5,3+r()*3);}}}
    else if(G==='cave'){g.fillStyle='#3a3048';g.fillRect(0,0,TS,TS);for(let i=0;i<10;i++){g.fillStyle=r()<.5?'#2a2238':'#4a3e5a';g.beginPath();g.moveTo(r()*TS,r()*TS);g.lineTo(r()*TS,r()*TS);g.lineTo(r()*TS,r()*TS);g.fill();}if(r()<.25){g.fillStyle='#7af0ff';g.beginPath();g.moveTo(10,30);g.lineTo(14,16);g.lineTo(18,30);g.fill();}if(top){g.fillStyle='#5a4a6a';g.fillRect(0,0,TS,5);g.fillStyle='#6a5a7a';g.fillRect(0,0,TS,2);}}
    else if(G==='brick'){g.fillStyle='#4a3030';g.fillRect(0,0,TS,TS);for(let y=0;y<TS;y+=8)for(let x=(y/8%2)*8-8;x<TS;x+=16){g.fillStyle=['#6a3a32','#5a302a','#7a4238'][(r()*3)|0];g.fillRect(x+1,y+1,14,6);g.fillStyle='rgba(255,180,120,.12)';g.fillRect(x+1,y+1,14,1);}if(top){g.fillStyle='#8a5040';g.fillRect(0,0,TS,4);}}
    else{g.fillStyle='#d8d0e0';g.fillRect(0,0,TS,TS);g.strokeStyle='rgba(120,100,140,.35)';g.lineWidth=1;g.strokeRect(.5,.5,TS-1,TS-1);for(let i=0;i<3;i++){g.strokeStyle='rgba(150,130,170,.35)';g.beginPath();g.moveTo(r()*TS,r()*TS);g.quadraticCurveTo(r()*TS,r()*TS,r()*TS,r()*TS);g.stroke();}if(top){g.fillStyle='#f4f0f8';g.fillRect(0,0,TS,5);g.fillStyle='#b8a8c8';g.fillRect(0,5,TS,2);}}}
  else if(kind==='='){const col=['#8a5a32','#6a5a7a','#7a4a3a','#e0d8ea'][world];g.fillStyle=col;g.fillRect(0,0,TS,9);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(0,0,TS,2);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(0,8,TS,2);for(let x=2;x<TS;x+=10){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x,3,1.5,1.5);}}
  else if(kind==='C'){g.fillStyle='#a0703a';g.fillRect(1,1,TS-2,TS-2);g.strokeStyle='#5a3a1a';g.lineWidth=3;g.strokeRect(2.5,2.5,TS-5,TS-5);g.beginPath();g.moveTo(3,3);g.lineTo(TS-3,TS-3);g.moveTo(TS-3,3);g.lineTo(3,TS-3);g.stroke();}
  else if(kind==='X'){g.fillStyle='#8a7a6a';g.fillRect(1,1,TS-2,TS-2);g.strokeStyle='#3a2a1a';g.lineWidth=1.5;g.beginPath();g.moveTo(5,2);g.lineTo(12,14);g.lineTo(8,24);g.moveTo(20,4);g.lineTo(16,16);g.lineTo(26,28);g.stroke();}
  tileCache[k]=c;return c;}

/* ================= BACKGROUNDS ================= */
const bgCache={};
function bgLayer(world,layer){const k=world+'_'+layer;if(bgCache[k])return bgCache[k];const w=1024,h=512,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),r=seeded(world*100+layer),Wd=WORLDS[world];
  if(layer===0){if(Wd.dark){g.fillStyle=Wd.far;for(let x=0;x<w;x+=30){const hh=60+r()*120;g.beginPath();g.moveTo(x,0);g.lineTo(x+15,hh);g.lineTo(x+30,0);g.fill();g.beginPath();g.moveTo(x,h);g.lineTo(x+15,h-hh*.8);g.lineTo(x+30,h);g.fill();}for(let i=0;i<40;i++){g.fillStyle='rgba(140,240,255,'+(r()*.6)+')';g.beginPath();g.arc(r()*w,r()*h,1+r()*2,0,TAU);g.fill();}}
    else{g.fillStyle=Wd.far;g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=16){g.lineTo(x,h-180-Math.sin(x*.011)*60-Math.sin(x*.031+1)*30-r()*8);}g.lineTo(w,h);g.fill();if(world===0||world===3){g.fillStyle='rgba(255,255,255,.7)';for(let x=0;x<=w;x+=128){const y=h-180-Math.sin(x*.011)*60-Math.sin(x*.031+1)*30;g.beginPath();g.moveTo(x-20,y+16);g.lineTo(x,y-4);g.lineTo(x+20,y+16);g.fill();}}
      if(world===2){g.fillStyle='#2a0a08';for(let i=0;i<5;i++){const x=r()*w,tw=40+r()*40,th=120+r()*100;g.fillRect(x,h-th,tw,th);for(let k=0;k<tw;k+=10)g.fillRect(x+k,h-th-10,6,10);g.fillStyle='#ffb040';g.fillRect(x+tw/2-3,h-th+30,6,10);g.fillStyle='#2a0a08';}}}}
  else{const col=Wd.mid;if(world===0){for(let i=0;i<22;i++){const x=r()*w,hh=80+r()*120;g.fillStyle='#3a6a3a';g.fillRect(x-4,h-hh*.5,8,hh*.5);g.fillStyle=r()<.5?'#2f7a3a':'#3a8a44';g.beginPath();g.arc(x,h-hh*.55,26+r()*18,0,TAU);g.fill();}g.fillStyle='#3a7a3a';g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=20)g.lineTo(x,h-60-Math.sin(x*.02)*20);g.lineTo(w,h);g.fill();}
    else if(world===1){g.fillStyle=col;for(let x=0;x<w;x+=50){const hh=100+r()*160;g.beginPath();g.moveTo(x,h);g.lineTo(x+25,h-hh);g.lineTo(x+50,h);g.fill();}for(let i=0;i<14;i++){const x=r()*w,y=h-60-r()*200;g.fillStyle='rgba(120,230,255,.5)';g.beginPath();g.moveTo(x,y);g.lineTo(x+6,y-22);g.lineTo(x+12,y);g.fill();}}
    else if(world===2){g.fillStyle=col;for(let x=0;x<w;x+=90){const hh=140+r()*120;g.fillRect(x,h-hh,60,hh);for(let k=0;k<60;k+=15)g.fillRect(x+k,h-hh-14,9,14);g.fillStyle='#ff8a2a';g.fillRect(x+25,h-hh+40,10,14);g.fillStyle=col;}const lg=g.createLinearGradient(0,h-40,0,h);lg.addColorStop(0,'rgba(255,90,20,0)');lg.addColorStop(1,'rgba(255,90,20,.6)');g.fillStyle=lg;g.fillRect(0,h-40,w,40);}
    else{for(let i=0;i<12;i++){const x=r()*w,hh=120+r()*180;g.fillStyle=col;g.fillRect(x,h-hh,26,hh);g.fillRect(x-6,h-hh,38,10);if(r()<.5)g.fillRect(x-30,h-hh-20,90,12);}for(let i=0;i<9;i++){g.fillStyle='rgba(255,255,255,.8)';const x=r()*w,y=h-r()*120;for(let k=0;k<5;k++){g.beginPath();g.arc(x+k*18,y+Math.sin(k)*6,18+r()*10,0,TAU);g.fill();}}}}
  bgCache[k]=c;return c;}

/* ================= LEVEL ================= */
let L=null;
function buildLevel(w,l){const boss=l===3,diff=1+w*.6+l*.2+save.ng*1.2,seed=w*1000+l*37+save.ng*7;const g=seeded(seed);let rows=[];
  if(boss){rows=ARENA.map(r=>r);}else{const n=8+w*2+l;rows=START.map(r=>r);const maxD=Math.min(3,1+Math.floor((w*4+l)/3));for(let i=0;i<n;i++){const opts=CH.filter(c=>c[0]<=maxD);const ch=opts[Math.floor(g()*opts.length)];for(let r=0;r<ROWS;r++)rows[r]+=ch[r+1];if(i===Math.floor(n/2)){for(let r=0;r<ROWS;r++)rows[r]+=(r===9?'....F...........':START[r].replace('P','.'));}}for(let r=0;r<ROWS;r++)rows[r]+=END[r];}
  const cols=rows[0].length,tiles=[],ents=[];let start={x:48,y:200};let gemN=0;
  for(let r=0;r<ROWS;r++){tiles.push([]);for(let c=0;c<cols;c++){const ch=rows[r][c];const x=c*TS,y=r*TS;let t='.';
    if('#=CX^L'.includes(ch))t=ch;
    else if(ch==='P')start={x:x+8,y:y};
    else if(ch==='o')ents.push({k:'coin',x:x+16,y:y+16,ph:R()*TAU});
    else if(ch==='G'){ents.push({k:'gem',x:x+16,y:y+16,id:gemN++,ph:0});}
    else if(ch==='H')ents.push({k:'heart',x:x+16,y:y+16,ph:0});
    else if(ch==='T')ents.push({k:'chest',x:x+16,y:y+TS,open:0});
    else if(ch==='F')ents.push({k:'flag',x:x+16,y:y+TS,on:0});
    else if(ch==='D')ents.push({k:'door',x:x+16,y:y+TS*2});
    else if(ch==='S')ents.push({k:'spring',x:x+16,y:y+TS,t:0});
    else if(ch==='M'||ch==='V')ents.push({k:'plat',x:x,y:y+8,w:TS*3,h:12,ox:x,oy:y+8,ax:ch==='M'?TS*3:0,ay:ch==='V'?TS*3:0,ph:0,dx:0,dy:0});
    else if('sbkhgfn'.includes(ch))ents.push(makeEnemy(ch,x+16,y+TS,diff));
    tiles[r].push(t);}}
  // decorations
  const deco=[];for(let c=0;c<cols;c++)for(let r=1;r<ROWS;r++){if(tiles[r][c]==='#'&&tiles[r-1][c]==='.'){const v=g();if(w===0&&v<.35)deco.push({k:v<.12?'flower':'tuft',x:c*TS+g()*TS,y:r*TS,c:['#ff6a8a','#ffd23a','#ffffff','#b88aff'][(g()*4)|0]});if(w===1&&v<.1)deco.push({k:'crystal',x:c*TS+g()*TS,y:r*TS});if(w===1&&v>.93)deco.push({k:'torch',x:c*TS+16,y:r*TS-40});if(w===2&&v<.08)deco.push({k:'torch',x:c*TS+16,y:r*TS-44});if(w===3&&v<.12)deco.push({k:'pillar',x:c*TS+16,y:r*TS});}}
  L={w,l,boss,tiles,cols,ents,start,deco,diff,gemTotal:gemN,gems:new Set(),coins:0,check:{...start},width:cols*TS,crumble:{},time:0,bossE:null};
  if(boss){const B=makeBoss(WORLDS[w].boss,cols*TS*.62,9*TS,diff);ents.push(B);L.bossE=B;}}
function tileAt(c,r){if(r<0)return'.';if(r>=ROWS||c<0||c>=L.cols)return c<0||c>=L.cols?'#':'.';return L.tiles[r][c];}
const isSolid=t=>t==='#'||t==='C'||t==='X';

/* ================= ENTITIES ================= */
function makeEnemy(ch,x,y,diff){const hpM=Math.max(1,Math.round(diff*.6));const base={x,y,vx:0,vy:0,dir:R()<.5?-1:1,t:R()*3,hit:0,dead:0,k:'enemy',type:ch};
  switch(ch){case's':return Object.assign(base,{w:24,h:18,hp:2*hpM,sp:40+diff*6,col:['#5ad06a','#7a5aff','#ff7a3a','#7ad8ff'][(diff|0)%4]});
    case'b':return Object.assign(base,{w:22,h:16,hp:1*hpM,fly:1,home:{x,y:y-TS*3},y:y-TS*3,state:'hang'});
    case'k':return Object.assign(base,{w:20,h:30,hp:3*hpM,sp:35,shoot:2});
    case'h':return Object.assign(base,{w:24,h:18,hp:2*hpM,sp:55,spiky:1});
    case'g':return Object.assign(base,{w:24,h:26,hp:2*hpM,fly:1,ghost:1,y:y-TS*2});
    case'f':return Object.assign(base,{w:22,h:22,hp:2*hpM,fly:1,y:y-TS*1.5,home:{x,y:y-TS*1.5},shoot:2.5});
    case'n':return Object.assign(base,{w:24,h:32,hp:4*hpM,sp:30,shield:1});}
  return base;}
function makeBoss(type,x,y,diff){const hp=Math.round((20+WORLDS.findIndex(w=>w.boss===type)*6)*(1+save.ng*.6));return{k:'enemy',boss:type,type:'B',x,y,vx:0,vy:0,w:type==='dragon'?90:type==='golem'?64:type==='batqueen'?56:72,h:type==='dragon'?50:type==='golem'?80:type==='batqueen'?40:56,hp,maxhp:hp,dir:-1,t:0,phase:0,hit:0,fly:type==='batqueen'||type==='dragon',home:{x,y:y-140},act:2};}
const P={x:0,y:0,vx:0,vy:0,w:18,h:28,dir:1,ground:false,coy:0,buf:0,jumps:0,hp:3,mp:2,inv:0,att:0,attCD:0,dash:0,dashCD:0,anim:0,wall:0,dead:0,plat:null,mpT:0,land:0,down:0};
const shots=[],parts=[],floaters=[];

/* ================= INPUT ================= */
const inp={l:0,r:0,j:0,a:0,d:0,f:0,jp:0,ap:0,dp:0,fp:0,down:0};const keys={};
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;if(['Space','ArrowUp','KeyW','KeyZ'].includes(e.code)){inp.j=1;inp.jp=1;e.preventDefault();}if(['KeyX','KeyJ'].includes(e.code)){inp.a=1;inp.ap=1;}if(['ShiftLeft','KeyC','KeyK'].includes(e.code)){inp.dp=1;}if(['KeyF','KeyL'].includes(e.code)){inp.fp=1;}if(e.code==='Escape'&&state==='play')pauseGame();});
addEventListener('keyup',e=>{keys[e.code]=0;if(['Space','ArrowUp','KeyW','KeyZ'].includes(e.code))inp.j=0;if(['KeyX','KeyJ'].includes(e.code))inp.a=0;});
function hb(id,k,press){const b=$(id);const on=e=>{e.preventDefault();inp[k]=1;if(press)inp[press]=1;b.classList.add('on');};const off=()=>{inp[k]=0;b.classList.remove('on');};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);}
hb('bL','l');hb('bR','r');hb('bJ','j','jp');hb('bA','a','ap');hb('bD','d','dp');hb('bF','f','fp');

/* ================= PHYSICS ================= */
const GRAV=1800;
function collide(e,dx,dy){// move & resolve against tiles
  e.x+=dx;let l=Math.floor((e.x-e.w/2)/TS),r=Math.floor((e.x+e.w/2-.01)/TS),t=Math.floor((e.y-e.h)/TS),b=Math.floor((e.y-.01)/TS);
  for(let row=t;row<=b;row++)for(let c=l;c<=r;c++){if(isSolid(tileAt(c,row))){if(dx>0){e.x=c*TS-e.w/2;e.hitWall=1;}else if(dx<0){e.x=(c+1)*TS+e.w/2;e.hitWall=-1;}}}
  const prevBottom=e.y;e.y+=dy;e.ground=false;l=Math.floor((e.x-e.w/2)/TS);r=Math.floor((e.x+e.w/2-.01)/TS);t=Math.floor((e.y-e.h)/TS);b=Math.floor((e.y-.01)/TS);
  for(let row=t;row<=b;row++)for(let c=l;c<=r;c++){const tt=tileAt(c,row);if(isSolid(tt)){if(dy>0){e.y=row*TS;e.vy=0;e.ground=true;if(tt==='X'&&e===P)crumble(c,row);}else if(dy<0){e.y=(row+1)*TS+e.h;e.vy=0;}}
    else if(tt==='='&&dy>0&&prevBottom<=row*TS+.5&&!(e===P&&P.down)){e.y=row*TS;e.vy=0;e.ground=true;}}}
function crumble(c,r){const k=c+','+r;if(L.crumble[k])return;L.crumble[k]={t:.45,c,r};SND.play('dig');}
function hazards(e){const l=Math.floor((e.x-e.w/2+3)/TS),r=Math.floor((e.x+e.w/2-3)/TS),t=Math.floor((e.y-e.h)/TS),b=Math.floor((e.y-1)/TS);for(let row=t;row<=b;row++)for(let c=l;c<=r;c++){const tt=tileAt(c,row);if(tt==='L'&&e.y>row*TS+10)return'lava';if(tt==='^'&&e.y>row*TS+16)return'spike';}return null;}
function overlap(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs((a.y-a.h/2)-(b.y-b.h/2))<(a.h+b.h)/2;}

let state='menu',cam={x:0,y:0,shake:0},hitStop=0,t=0,levelDone=0,bossIntro=0;
function startLevel(w,l){buildLevel(w,l);Object.assign(P,{x:L.start.x,y:L.start.y,vx:0,vy:0,hp:MAXHP(),mp:MAXMP(),inv:1,dead:0,att:0,dash:0,jumps:0,dir:1});shots.length=0;parts.length=0;floaters.length=0;cam.x=P.x-W/scale()/2;levelDone=0;
  state='play';$('menu').hidden=true;$('ctl').hidden=false;$('pauseB').hidden=false;$('bD').style.display=lvl('dash')?'flex':'none';$('bF').style.display=lvl('fire')?'flex':'none';

function showOver(h){$('overBox').innerHTML=h;$('over').hidden=false;}function hideOver(){$('over').hidden=true;}
function winLevel(){if(levelDone)return;levelDone=1;const key=L.w+'-'+L.l;const gemsGot=L.gems.size;const prev=save.gems[key]||0;if(gemsGot>prev)save.gems[key]=gemsGot;save.cleared[key]=1;const idx=L.w*4+L.l;if(save.unlocked<idx+2)save.unlocked=idx+2;
  const bonus=50+L.w*40+(L.boss?300:0);save.coins+=bonus;if(idx===15&&!save.ngUnlocked){save.ngUnlocked=1;}persist();SND.play('fanfare');buzz([40,40,80]);
  setTimeout(()=>{showOver('<h2>'+(L.boss?'👑 '+WORLDS[L.w].bossN+' defeated!':'🚪 Level clear!')+'</h2><p>💎 Gems: '+gemsGot+'/'+L.gemTotal+' · 🪙 +'+(L.coins+bonus)+' (bonus '+bonus+')</p>'+(idx===15?'<p>🌟 You beat the Storm Dragon! New Game+ is unlocked on the map: harder enemies, better loot.</p>':'')+'<div class="row" style="justify-content:center"><button class="btn" id="next">Next ▶</button><button class="btn p" id="toMap">World map</button></div>');
    $('next').onclick=()=>{hideOver();const n=idx+1;if(n>=16){save.ng++;persist();startLevel(0,0);}else startLevel(Math.floor(n/4),n%4);};$('toMap').onclick=()=>{hideOver();showMenu();};},1200);}

  $('res').onclick=()=>{hideOver();state='play';};$('toMap').onclick=()=>{hideOver();showMenu();};$('tMus').onclick=()=>{SND.set('music',!SND.get('music'));pauseGame();};$('tSfx').onclick=()=>{SND.set('sfx',!SND.get('sfx'));pauseGame();};}
$('pauseB').onclick=()=>{if(state==='play')pauseGame();};

/* ================= UPDATE ================= */
function burst(x,y,col,n,sp=180){for(let i=0;i<n;i++){const a=R()*TAU,s=R()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.6+R()*.4,col,sz:2+R()*3,g:600});}}
function dustP(x,y,n=4){for(let i=0;i<n;i++)parts.push({x:x+rnd(-8,8),y,vx:rnd(-60,60),vy:-rnd(20,80),life:.4,col:L.w===1?'#7a6a8a':L.w===3?'#ffffff':'#c8a878',sz:3+R()*3,g:0,fade:1});}
function float(x,y,txt,col='#fff'){floaters.push({x,y,txt,col,life:1});}
function updatePlayer(dt){const left=inp.l||keys.ArrowLeft||keys.KeyA,right=inp.r||keys.ArrowRight||keys.KeyD;P.down=keys.ArrowDown||keys.KeyS;
  if(P.dead){P.vy+=GRAV*dt;P.y+=P.vy*dt;return;}
  P.inv=Math.max(0,P.inv-dt);P.attCD-=dt;P.dashCD-=dt;P.mpT+=dt;if(P.mpT>4&&P.mp<MAXMP()){P.mpT=0;P.mp++;}
  const acc=P.ground?2400:1500,max=220;if(P.dash>0){P.dash-=dt;P.vy=0;if(R()<.7)parts.push({x:P.x,y:P.y-14,vx:0,vy:0,life:.25,col:skin().c,sz:12,ghost:1,dir:P.dir});}
  else{if(left&&!right){P.vx=Math.max(-max,P.vx-acc*dt);P.dir=-1;}else if(right&&!left){P.vx=Math.min(max,P.vx+acc*dt);P.dir=1;}else{const f=(P.ground?2200:600)*dt;P.vx=Math.abs(P.vx)<f?0:P.vx-Math.sign(P.vx)*f;}
    P.vy+=GRAV*dt*(P.vy>0?1.25:(inp.j?1:2.4));P.vy=Math.min(P.vy,900);}
  // wall slide
  P.hitWall=0;
  if(P.ground){P.coy=.1;P.jumps=0;}else P.coy-=dt;if(inp.jp){P.buf=.12;inp.jp=0;}else P.buf-=dt;
  if(P.buf>0){if(P.coy>0){jump(1);}else if(P.wall&&!P.ground){P.vy=-560;P.vx=-P.wall*300;P.dir=-P.wall;P.buf=0;SND.play('jump');dustP(P.x+P.wall*10,P.y-10);}else if(lvl('djump')&&P.jumps<1){P.jumps++;jump(.9);burst(P.x,P.y,'#ffffff',8,120);}}
  if(inp.dp&&lvl('dash')&&P.dashCD<=0){inp.dp=0;P.dash=.18;P.dashCD=.7;P.vx=P.dir*620;P.inv=Math.max(P.inv,.2);SND.play('whoosh');}else inp.dp=0;
  if(inp.ap&&P.attCD<=0){inp.ap=0;P.att=.2;P.attCD=.32;SND.play('swish');attack();}else inp.ap=0;P.att=Math.max(0,P.att-dt);
  if(inp.fp&&lvl('fire')&&P.mp>0){inp.fp=0;P.mp--;P.mpT=0;shots.push({x:P.x+P.dir*14,y:P.y-16,vx:P.dir*480,vy:0,w:14,h:14,mine:1,life:1.4,dmg:2+lvl('sword')*.5});SND.play('powerup');}else inp.fp=0;
  const wasG=P.ground,pvy=P.vy;collide(P,P.vx*dt,0);
  if(P.hitWall&&!P.ground&&P.vy>0&&((P.hitWall>0&&right)||(P.hitWall<0&&left))){P.wall=P.hitWall;P.vy=Math.min(P.vy,110);if(R()<.3)dustP(P.x+P.hitWall*9,P.y-20,1);}else if(!P.hitWall)P.wall=0;
  collide(P,0,P.vy*dt);
  // moving platforms
  for(const e of L.ents)if(e.k==='plat'){if(P.vy>=0&&P.x+P.w/2>e.x&&P.x-P.w/2<e.x+e.w&&P.y>=e.y-2&&P.y<=e.y+10&&pvy>=0){P.y=e.y;P.vy=0;P.ground=true;P.x+=e.dx;P.y+=e.dy;}}
  if(P.ground&&!wasG&&pvy>300){SND.play('land');dustP(P.x,P.y,6);}
  if(P.ground&&Math.abs(P.vx)>60){P.anim+=dt*Math.abs(P.vx)/22;if(Math.floor(P.anim/Math.PI)!==Math.floor((P.anim-dt*Math.abs(P.vx)/22)/Math.PI))SND.play('step',L.w===0?'grass':L.w===3?'stone':'stone');}else if(P.ground)P.anim=0;
  const hz=hazards(P);if(hz==='spike')hurtPlayer({x:P.x-P.dir});if(hz==='lava'){burst(P.x,P.y,'#ff6a1a',20);SND.play('splash');respawnPit();}
  if(P.y>ROWS*TS+80)respawnPit();if(P.x<P.w/2)P.x=P.w/2;if(P.x>L.width-P.w/2)P.x=L.width-P.w/2;}
function jump(k){P.vy=-620*k;P.coy=0;P.buf=0;SND.play('jump');dustP(P.x,P.y,4);}
function attack(){const hx=P.x+P.dir*24,hy=P.y-14,box={x:hx,y:hy+16,w:40,h:34};
  for(const e of L.ents){if(e.k!=='enemy'||e.dead)continue;if(overlap(box,e)){if(e.shield&&Math.sign(P.x-e.x)===e.dir&&!e.boss){SND.play('ding',90);burst(e.x+e.dir*10,e.y-16,'#e0e0ff',6);P.vx=-P.dir*200;continue;}damage(e,DMG(),P.dir);}}
  // break crates
  const c=Math.floor(hx/TS),r=Math.floor(hy/TS);for(const[cc,rr]of[[c,r],[c,r+1]]){if(tileAt(cc,rr)==='C'){L.tiles[rr][cc]='.';SND.play('hit');burst(cc*TS+16,rr*TS+16,'#a0703a',14);if(R()<.6)for(let k=0;k<3;k++)L.ents.push({k:'coin',x:cc*TS+16+rnd(-6,6),y:rr*TS+16,vy:-200-R()*150,vx:rnd(-80,80),drop:1,ph:0});else if(R()<.5)L.ents.push({k:'heart',x:cc*TS+16,y:rr*TS+16,ph:0});}}
  for(const e of L.ents)if(e.k==='chest'&&!e.open&&Math.abs(e.x-hx)<30&&Math.abs(e.y-P.y)<40){e.open=1;SND.play('magic');SND.play('coins');for(let k=0;k<12;k++)L.ents.push({k:'coin',x:e.x,y:e.y-20,vy:-300-R()*200,vx:rnd(-150,150),drop:1,ph:0});float(e.x,e.y-40,'Treasure!','#ffd23a');}}
function damage(e,d,dir){e.hp-=d;e.hit=.15;e.vx=dir*(e.boss?40:160);if(!e.fly&&!e.boss)e.vy=-180;hitStop=.05;cam.shake=Math.max(cam.shake,e.boss?6:3);SND.play('hit');float(e.x,e.y-e.h-6,'-'+(d%1?d.toFixed(1):d),'#ffd0a0');burst(e.x,e.y-e.h/2,'#ffffff',6,140);
  if(e.hp<=0){e.dead=1;save.kills++;burst(e.x,e.y-e.h/2,e.col||'#c0b0ff',18);SND.play('pop');if(e.boss){bossDeath(e);}else{const n=1+Math.floor(R()*3+L.diff*.4);for(let k=0;k<n;k++)L.ents.push({k:'coin',x:e.x,y:e.y-10,vy:-250-R()*120,vx:rnd(-90,90),drop:1,ph:0});}}}
function bossDeath(e){SND.play('explosion');cam.shake=20;for(let i=0;i<5;i++)setTimeout(()=>{burst(e.x+rnd(-40,40),e.y-rnd(0,60),['#ff8a3a','#ffd23a','#ffffff'][i%3],30,260);SND.play('explosion',.6);},i*200);for(let k=0;k<40;k++)L.ents.push({k:'coin',x:e.x,y:e.y-30,vy:-300-R()*300,vx:rnd(-250,250),drop:1,ph:0});L.ents.push({k:'door',x:L.width-80,y:10*TS});setTimeout(()=>toast('🚪 The exit door opened!'),1200);}
function updateEnemies(dt){for(const e of L.ents){if(e.k!=='enemy'||e.dead)continue;e.t+=dt;e.hit=Math.max(0,e.hit-dt);const dxp=P.x-e.x,dyp=P.y-e.y,dist=Math.hypot(dxp,dyp);
  if(e.boss){updateBoss(e,dt,dxp,dist);}
  else if(e.type==='b'){if(e.state==='hang'){if(dist<220)e.state='fly';e.y=e.home.y;}else{e.vx=lerp(e.vx,Math.sign(dxp)*120,dt*2);e.x+=e.vx*dt;e.y+=(Math.sin(e.t*4)*60+Math.sign(dyp-10)*50)*dt;}}
  else if(e.type==='g'){e.x+=Math.sign(dxp)*35*dt;e.y+=Math.sign(dyp-12)*25*dt+Math.sin(e.t*2)*.3;e.dir=Math.sign(dxp)||1;}
  else if(e.type==='f'){e.x=e.home.x+Math.sin(e.t*.8)*30;e.y=e.home.y+Math.sin(e.t*2)*10;e.shoot-=dt;if(e.shoot<=0&&dist<360){e.shoot=2.6;for(let k=0;k<4;k++){const a=k*Math.PI/2+e.t;shots.push({x:e.x,y:e.y-10,vx:Math.cos(a)*160,vy:Math.sin(a)*160,w:10,h:10,life:2.5,fire:1});}SND.play('steam');}}
  else{// walkers
    const sp=e.sp*(e.hit?0:1);if(Math.abs(e.vx)>sp+5)e.vx*=.9;else e.vx=e.dir*sp;if(e.type==='s'&&e.t%2.2<dt&&e.ground&&dist<300){e.vy=-320;}
    if(e.type==='k'){e.shoot-=dt;if(dist<300&&Math.abs(dyp)<60){e.vx=0;e.dir=Math.sign(dxp)||1;if(e.shoot<=0){e.shoot=2.2;shots.push({x:e.x+e.dir*12,y:e.y-20,vx:e.dir*300,vy:-40,w:16,h:4,life:2,arrow:1});SND.play('swish');}}}
    if(e.type==='n'&&dist<200&&Math.abs(dyp)<40)e.dir=Math.sign(dxp)||e.dir;
    e.vy+=GRAV*dt;e.hitWall=0;collide(e,e.vx*dt,0);if(e.hitWall)e.dir=-e.hitWall;collide(e,0,e.vy*dt);
    if(e.ground){const ahead=Math.floor((e.x+e.dir*(e.w/2+2))/TS),below=Math.floor((e.y+2)/TS);if(!isSolid(tileAt(ahead,below))&&tileAt(ahead,below)!=='=')e.dir*=-1;}if(e.y>ROWS*TS+100)e.dead=1;}
  // player contact
  if(!P.dead&&overlap(P,e)){const stomp=P.vy>120&&P.y-e.y<-e.h*.35;if(stomp&&!e.spiky&&!e.boss&&!e.ghost){damage(e,DMG()+1,P.dir);P.vy=-480;P.jumps=0;SND.play('bubble');}else if(stomp&&e.boss){damage(e,1,P.dir);P.vy=-520;}else hurtPlayer(e);}}}
function updateBoss(e,dt,dxp,dist){if(bossIntro>0){return;}e.act-=dt;const enraged=e.hp<e.maxhp*.4;const B=e.boss;e.dir=Math.sign(dxp)||e.dir;
  if(B==='slimeking'){e.vy+=GRAV*dt;collide(e,e.vx*dt,0);collide(e,0,e.vy*dt);if(e.ground){e.vx*=.85;if(e.act<=0){e.act=enraged?1.1:1.7;e.vy=-650-R()*150;e.vx=e.dir*(150+R()*120);SND.play('jump');}}if(e.ground&&e.wasAir){cam.shake=10;SND.play('land');burst(e.x,e.y,'#5ad06a',14);if(enraged&&R()<.5)L.ents.push(makeEnemy('s',e.x,e.y,L.diff));}e.wasAir=!e.ground;}
  else if(B==='batqueen'){e.x+=(Math.sign(dxp)*90+Math.sin(e.t)*60)*dt;e.y=lerp(e.y,e.home.y+Math.sin(e.t*1.5)*40,dt*2);if(e.act<=0){e.act=enraged?2:3;if(R()<.5){for(let k=0;k<2;k++)L.ents.push(Object.assign(makeEnemy('b',e.x,e.y+40,L.diff),{state:'fly',y:e.y}));SND.play('magic');}else{e.dive=1;SND.tone({type:'sawtooth',f:900,f2:300,d:.5,v:.08,lp:2000});}}if(e.dive){e.y+=380*dt;e.x+=Math.sign(dxp)*120*dt;if(e.y>9*TS){e.dive=0;cam.shake=8;}}}
  else if(B==='golem'){e.vy+=GRAV*dt;collide(e,e.vx*dt,0);collide(e,0,e.vy*dt);e.vx=e.dir*(enraged?70:45);if(e.act<=0){e.act=enraged?1.6:2.4;if(R()<.5){e.vy=-500;e.slam=1;}else{for(let k=-1;k<=1;k++)shots.push({x:e.x,y:e.y-70,vx:e.dir*260+k*60,vy:-300+k*40,w:16,h:16,life:3,fire:1,grav:1});SND.play('steam');}}
    if(e.slam&&e.ground){e.slam=0;cam.shake=16;SND.play('explosion',.6);for(const s of[-1,1])shots.push({x:e.x+s*30,y:e.y-8,vx:s*300,vy:0,w:20,h:16,life:2.2,wave:1});}}
  else{e.x=lerp(e.x,P.x+Math.sin(e.t*.6)*160,dt*.8);e.y=lerp(e.y,e.home.y+Math.sin(e.t*1.2)*50,dt*2);if(e.act<=0){e.act=enraged?1.4:2.1;const n=enraged?5:3;for(let k=0;k<n;k++){const a=Math.atan2(P.y-20-e.y,P.x-e.x)+(k-(n-1)/2)*.22;shots.push({x:e.x,y:e.y-20,vx:Math.cos(a)*300,vy:Math.sin(a)*300,w:12,h:12,life:3,bolt:1});}SND.play('thunder');cam.shake=4;}}
  e.x=clamp(e.x,e.w/2,L.width-e.w/2);}
function updateShots(dt){for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.life-=dt;if(s.grav)s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.fire||s.bolt)parts.push({x:s.x,y:s.y,vx:0,vy:-20,life:.25,col:s.bolt?'#a8d8ff':'#ffb040',sz:4,g:0,fade:1});
  const tc=tileAt(Math.floor(s.x/TS),Math.floor(s.y/TS));if(isSolid(tc)&&!s.wave){if(s.mine&&tc==='C'){L.tiles[Math.floor(s.y/TS)][Math.floor(s.x/TS)]='.';burst(s.x,s.y,'#a0703a',10);}s.life=0;burst(s.x,s.y,'#ffb040',6);}
  if(s.mine){for(const e of L.ents)if(e.k==='enemy'&&!e.dead&&overlap({x:s.x,y:s.y+7,w:s.w,h:s.h},e)){damage(e,s.dmg,Math.sign(s.vx));s.life=0;SND.play('explosion',.3);break;}}
  else if(!P.dead&&overlap({x:s.x,y:s.y+s.h/2,w:s.w,h:s.h},P)){hurtPlayer(s);s.life=0;}
  if(s.life<=0)shots.splice(i,1);}}
function updateItems(dt){const mag=lvl('magnet')*60;for(let i=L.ents.length-1;i>=0;i--){const e=L.ents[i];e.ph=(e.ph||0)+dt;
  if(e.k==='coin'||e.k==='heart'||e.k==='gem'){if(e.drop){e.vy+=1400*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;const r=Math.floor((e.y+6)/TS),c=Math.floor(e.x/TS);if(isSolid(tileAt(c,r))||tileAt(c,r)==='='){e.y=r*TS-6;e.vy*=-.35;e.vx*=.7;if(Math.abs(e.vy)<40)e.vy=0;}}
    const d=Math.hypot(P.x-e.x,P.y-14-e.y);if(e.k==='coin'&&mag&&d<mag){e.x+=(P.x-e.x)*dt*6;e.y+=(P.y-14-e.y)*dt*6;}
    if(d<22&&!P.dead){L.ents.splice(i,1);if(e.k==='coin'){L.coins++;save.coins++;SND.play('coin');parts.push({x:e.x,y:e.y,vx:0,vy:-40,life:.3,col:'#ffe060',sz:8,g:0,fade:1});}else if(e.k==='heart'){if(P.hp<MAXHP()){P.hp++;SND.play('powerup');float(e.x,e.y-10,'+❤️');}else{save.coins+=10;SND.play('coin');}}else{L.gems.add(e.id);SND.play('rare');float(e.x,e.y-14,'💎 Gem '+L.gems.size+'/'+L.gemTotal,'#9af0ff');buzz(30);}}}
  else if(e.k==='flag'){if(!e.on&&Math.abs(P.x-e.x)<20&&Math.abs(P.y-e.y)<40){e.on=1;L.check={x:e.x,y:e.y};SND.play('checkpoint');P.hp=Math.max(P.hp,Math.min(MAXHP(),P.hp+1));toast('🚩 Checkpoint!');burst(e.x,e.y-40,'#ffd23a',16);}}
  else if(e.k==='spring'){e.t=Math.max(0,e.t-dt);if(P.vy>0&&Math.abs(P.x-e.x)<18&&P.y>=e.y-14&&P.y<=e.y+4){P.vy=-950;P.jumps=0;e.t=.25;SND.play('bubble');SND.play('jump');}}
  else if(e.k==='door'){if(Math.abs(P.x-e.x)<20&&Math.abs(P.y-e.y)<10&&!L.bossE?true:L.bossE&&L.bossE.dead&&Math.abs(P.x-e.x)<20&&Math.abs(P.y-e.y)<10){winLevel();}}
  else if(e.k==='plat'){e.ph+=dt;const nx=e.ox+Math.sin(e.ph*.9)*e.ax,ny=e.oy+Math.sin(e.ph*.9)*e.ay;e.dx=nx-e.x;e.dy=ny-e.y;e.x=nx;e.y=ny;}}
  for(const k in L.crumble){const c=L.crumble[k];c.t-=dt;if(c.t<=0&&!c.gone){c.gone=1;L.tiles[c.r][c.c]='.';burst(c.c*TS+16,c.r*TS+16,'#8a7a6a',10);c.back=4;}if(c.gone){c.back-=dt;if(c.back<=0&&!overlap(P,{x:c.c*TS+16,y:c.r*TS+TS,w:TS,h:TS})){L.tiles[c.r][c.c]='X';delete L.crumble[k];}}}
  L.ents=L.ents.filter(e=>!(e.k==='enemy'&&e.dead&&!e.boss));}

/* ================= DRAW ================= */
const skin=()=>SKINS.find(s=>s.id===save.skin)||SKINS[0];
function drawKnight(g,x,y,dir,anim,state,sk,flash){g.save();g.translate(x,y);g.scale(dir,1);const run=Math.sin(anim),air=!P.ground;const bob=state==='idle'?Math.sin(t*3)*1:Math.abs(run)*1.5;
  // cape
  g.fillStyle=sk.c;g.beginPath();g.moveTo(-3,-24+bob);const sw=Math.sin(t*6+P.vx*.01)*3-Math.min(10,Math.abs(P.vx)*.04);g.quadraticCurveTo(-12+sw,-12,-14+sw,-2);g.lineTo(-4,-4);g.closePath();g.fill();
  // legs
  g.fillStyle=sk.b;const la=air?.6:run*.6;for(const s of[-1,1]){g.save();g.translate(s*3,-10);g.rotate(s*la);g.fillRect(-2.5,0,5,10);g.fillStyle='#3a2a1a';g.fillRect(-3,8,7,3);g.fillStyle=sk.b;g.restore();}
  // body
  const bg=g.createLinearGradient(-8,-26,8,-8);bg.addColorStop(0,sk.a);bg.addColorStop(1,sk.b);g.fillStyle=bg;g.beginPath();g.roundRect?g.roundRect(-7,-26+bob,14,17,4):g.rect(-7,-26+bob,14,17);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-7,-14+bob,14,2);
  // head / helmet
  g.fillStyle=sk.a;g.beginPath();g.arc(0,-31+bob,7,0,TAU);g.fill();g.fillStyle='#1a1a24';g.fillRect(1,-33+bob,6,2.5);g.fillStyle='rgba(255,255,255,.4)';g.fillRect(-4,-36+bob,3,3);
  g.fillStyle=sk.c;g.beginPath();g.moveTo(-2,-38+bob);g.quadraticCurveTo(-10,-46+bob+Math.sin(t*5)*1.5,-14,-38+bob);g.quadraticCurveTo(-8,-41+bob,-2,-36+bob);g.fill();
  // sword arm
  const swing=P.att>0?(1-P.att/.2):-1;g.save();g.translate(4,-20+bob);const a=P.att>0?lerp(-2.2,1.2,swing):(state==='run'?run*.4-.3:-.3);g.rotate(a);g.fillStyle=sk.b;g.fillRect(-2,0,4,8);g.fillStyle='#e8e8f0';g.fillRect(-1.5,8,3,16);g.fillStyle='#ffd23a';g.fillRect(-4,7,8,2.5);g.restore();
  if(P.att>0){g.strokeStyle='rgba(255,240,200,'+(P.att/.2)+')';g.lineWidth=4;g.beginPath();g.arc(6,-16,24,-1.6,lerp(-1.6,1.4,swing));g.stroke();}
  if(flash){g.globalCompositeOperation='source-atop';g.fillStyle='rgba(255,255,255,.8)';g.fillRect(-20,-50,40,52);}
  g.restore();}
function drawEnemy(g,e){const x=e.x,y=e.y;g.save();g.translate(x,y);if(e.hit>0)g.filter='brightness(3)';const f=e.dir||1;
  switch(e.boss||e.type){

function renderMenu(){const gemsAll=Object.values(save.gems).reduce((a,b)=>a+b,0);let h='<div class="row" style="justify-content:space-between"><h1>EMBER <b>KNIGHT</b></h1><div style="font-weight:700;font-size:19px">🪙 '+save.coins+' · 💎 '+gemsAll+(save.ng?' · NG+'+save.ng:'')+'</div></div>';
  h+='<div class="seg" style="margin:10px 0">'+[['map','🗺️ Map'],['shop','🛒 Forge'],['armor','🛡️ Armor'],['opt','⚙️']].map(([k,n])=>'<button data-mt="'+k+'" class="'+(mtab===k?'on':'')+'">'+n+'</button>').join('')+'</div>';
  if(mtab==='map')h+=WORLDS.map((Wd,w)=>'<div class="world"><h3>'+(w+1)+'. '+Wd.n+'</h3>'+[0,1,2,3].map(l=>{const idx=w*4+l,lock=idx+1>save.unlocked,key=w+'-'+l,gm=save.gems[key]||0;return'<button class="lv '+(l===3?'boss ':'')+(lock?'lock ':'')+(idx+1===save.unlocked?'cur':'')+'" data-lv="'+idx+'">'+(lock?'🔒':l===3?'👑':(w+1)+'-'+(l+1))+'<small>'+(save.cleared[key]?(l===3?'Beaten':'💎'+gm):lock?'':'Play')+'</small></button>';}).join('')+'</div>').join('');
  else if(mtab==='shop')h+='<div class="row">'+UPG.map(u=>{const L2=lvl(u.id),mx=L2>=u.max;return'<div class="card"><div style="font-weight:700">'+u.e+' '+u.n+(u.max>1?' · '+L2+'/'+u.max:mx?' ✓':'')+'</div><div class="d">'+u.d+'</div><button class="btn sm" data-up="'+u.id+'" '+(mx||save.coins<ucost(u)?'disabled':'')+'>'+(mx?'Owned':'🪙 '+ucost(u))+'</button></div>';}).join('')+'</div>';
  else if(mtab==='armor')h+='<div class="row">'+SKINS.map(s=>{const own=save.skins[s.id];return'<div class="card" style="align-items:center"><canvas width="80" height="80" data-prev="'+s.id+'"></canvas><div style="font-weight:700">'+s.n+'</div><button class="btn sm" data-skin="'+s.id+'" '+(!own&&save.coins<s.cost?'disabled':'')+'>'+(save.skin===s.id?'Equipped':own?'Wear':'🪙 '+s.cost)+'</button></div>';}).join('')+'</div>';
  else h+='<div class="row"><button class="btn sm p" id="tMus">🎵 Music: '+(SND.get('music')?'on':'off')+'</button><button class="btn sm p" id="tSfx">🔊 Sounds: '+(SND.get('sfx')?'on':'off')+'</button></div><p style="font-weight:600;line-height:1.6;opacity:.9">◀ ▶ move · JUMP (hold for higher, slide down walls and jump off them) · ⚔️ attack (breaks crates, opens chests) · Jump on enemies to stomp them, but not on spiky ones!<br>Buy Wing Boots, Shadow Dash and Ember Magic in the Forge.<br>Keyboard: arrows/WASD, Space jump, X attack, Shift dash, F fireball. Hold ↓ to drop through platforms.</p><p>Enemies defeated: '+save.kills+' · Falls: '+save.deaths+'</p>';
  $('menu').innerHTML=h;$('menu').querySelectorAll('canvas[data-prev]').forEach(c=>{const g=c.getContext('2d'),s=SKINS.find(x=>x.id===c.dataset.prev);g.translate(40,70);g.scale(1.6,1.6);const sv={...P};Object.assign(P,{vx:0,att:0,ground:true});drawKnight(g,0,0,1,0,'idle',s,0);Object.assign(P,sv);});}
$('menu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;SND.play('click');const d=b.dataset;
  if(d.mt){mtab=d.mt;renderMenu();return;}if(d.lv!=null){const idx=+d.lv;if(idx+1>save.unlocked){SND.play('error');return;}startLevel(Math.floor(idx/4),idx%4);return;}
  if(d.up){const u=UPG.find(x=>x.id===d.up);if(lvl(u.id)>=u.max||save.coins<ucost(u)){SND.play('error');return;}save.coins-=ucost(u);save.up[u.id]=lvl(u.id)+1;SND.play('levelup');persist();renderMenu();return;}
  if(d.skin){const s=SKINS.find(x=>x.id===d.skin);if(!save.skins[s.id]){if(save.coins<s.cost){SND.play('error');return;}save.coins-=s.cost;save.skins[s.id]=1;SND.play('buy');}save.skin=s.id;persist();renderMenu();return;}
  if(b.id==='tMus'){SND.set('music',!SND.get('music'));renderMenu();}if(b.id==='tSfx'){SND.set('sfx',!SND.get('sfx'));renderMenu();}});

/* ================= LOOP ================= */
let last=performance.now(),saveT=0;
function frame(now){let dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;
  if(state==='play'&&L){if(hitStop>0){hitStop-=dt;dt=0;}if(bossIntro>0)bossIntro-=dt;L.time+=dt;updatePlayer(dt);updateEnemies(dt);updateShots(dt);updateItems(dt);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.leaf)p.x+=Math.sin(t*2+p.y*.05)*20*dt;if(p.life<=0)parts.splice(i,1);}if(parts.length>500)parts.splice(0,parts.length-500);
    for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.life-=dt;f.y-=30*dt;if(f.life<=0)floaters.splice(i,1);}cam.shake=Math.max(0,cam.shake-dt*30);
    saveT+=dt;if(saveT>4){saveT=0;persist();}}
  if(L&&(state==='play'||state==='pause'))draw();else{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#120a18';ctx.fillRect(0,0,W,H);}
  if(toastT>0){toastT-=dt||.016;if(toastT<=0)$('toast').hidden=true;}requestAnimationFrame(frame);}
addEventListener('visibilitychange',()=>{if(document.hidden){persist();if(state==='play')pauseGame();}});
showMenu();requestAnimationFrame(frame);
window.__ek={P,save:()=>save,start:startLevel,L:()=>L,inp,state:()=>state};
})();

});</script>
